	{"i": "fjcs_0297", "type": "single", "t": "某市电视台推出了一个面向老年观众的养生节目，这个节目在试播时组织了 许多老年人观看，获得一致好评，但在正式播出后，收视率非常不理想。 以下最能够解释上述矛盾现象的一项是：", "o": [["A", "一些老年人认为节目内容对于养生作用不大"], ["B", "节目的包装过于娱乐化，与老年人的需求不符"], ["C", "看电视时间过长不利于老年人的身体健康"], ["D", "节目播出时间较晚，此时大多数老年人已经休息"]], "a": ["D"], "an": "第一步：总结题干。 本题主要是说节目在试播时反应好，正式播出时收视率却不理想。要求进行解释。 第二步：逐一判断选项作用。 A项：一些老年人，无法说明整体状况，不构成解释； B项：节目的包装过于娱乐化，与老年人的需求不符，这与试播时获得一致好评矛盾，不能 解释； C项：看电视时间过长的问题与该节目的关系没有谈到，不构成解释； D项：节目播出时间过晚，刚好解释了试播时获得好评，收视率却不理想。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0298", "type": "single", "t": "如果你的笔记本计算机是1999年以后制造的，那么它就带有调制解调器。 以上断定可由哪个选项推出：", "o": [["A", "只有1999年以后制造的笔记本计算机才带有调制解调器"], ["B", "所有1999年以后制造的笔记本计算机都带有调制解调器"], ["C", "有些1999年以后制造的笔记本计算机也带有调制解调器"], ["D", "所有1999年以后制造的笔记本计算机都不带有调制解调器"]], "a": ["B"], "an": "第一步：翻译题干，利用充分必要条件。 你的笔记本计算机：1999年以后制造的带有调制解调器。 第二步：逐一翻译选项并判断选项的正确，利用逆否规则。 A项：带有调制解调器1999年以后制造的，第一步中的“你的笔记本计算机：1999年以后 制造的带有调制解调器”，“1999年以后制造的”属A项翻译关系的肯后件，无法推出绝对表 达的结论，因此A项错误； B项：1999年以后制造的带有调制解调器，第一步中的“你的笔记本计算机：1999年以后 制造的带有调制解调器”，正是B项翻译关系，因此B项正确； C项：有些：1999年以后制造的带有调制解调器，第一步中的“你的笔记本计算机：1999 年以后制造的带有调制解调器”，“你的笔记本计算机”不一定是C项翻译关系“有些”中的， 因此C项错误； D项：1999年以后制造的－带有调制解调器，第一步中的“你的笔记本计算机：1999年以 后制造的带有调制解调器”，与D项翻译关系不相符，因此D项错误。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0299", "type": "single", "t": "维生素E是抗氧化剂，能够清除体内的自由基。于是，保健品商家把维生素 E作为提高免疫力、抗癌、抗衰老的灵丹妙药来宣传。科学家通过实验发现：如果食物中维 生素E的含量为每毫升5微克，能显著延长果蝇的寿命，但是如果维生素E的含量增加到 每毫升25微克，果蝇的寿命反而缩短了。其实，细胞中的自由基参与了许多重要的生命活 动，比如细胞增殖、细胞间通讯、细胞凋亡、免疫反应等。 由此推论不正确的是：", "o": [["A", "自由基有其独特的作用，对机体而言是不可或缺的"], ["B", "科学家对果蝇的实验揭示了“过犹不及”的道理"], ["C", "维生素E的含量超过25微克时，会危及到人的生命"], ["D", "维生素是维持人体生命的必要物质，但过量服用时也会威胁生命"]], "a": ["C"], "an": "题干中提及维生素E的含量增加到每毫克5微克，可以延长果蝇的寿命。维生素E 的含量增加到每毫克25微克，可以缩短果蝇的寿命。 A项“自由基有其独特的作用，对机体而言是不可或缺的”与题干中的“细胞中的自由基参与了 许多重要的生命活动”是同一个意思，所以可以推出，正确； B项“科学家对果蝇的实验揭示了‘过犹不及’的道理”，由于维生素E过多，反而导致了果蝇 的死亡，所以也是可以推出来的，正确； C项提及会伤害人的寿命，题干中讲的是果蝇不是人，所以主体不一致，错误； D项“维生素是维持人体生命的必要物质，但过量服用时也会威胁生命”，凡是都是物极必反， 所以可以推出，正确。 题干要求选错误的。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0300", "type": "single", "t": "蜜蜂大脑只有几毫克重，却可与哺乳动物一样执行某些任务，比如为同伴带 路、建造家园等。大象大脑体积是蜜蜂的500万倍，但运行效率极其低下。神经信号从大 脑一端传入另一端，以及从大脑传入脚趾间所需要的时间，均是蜜蜂的100倍。有人认为， 人类的大脑可能不像大象或蜜蜂那样极端，但只要通过进化，神经元数量变多，我们会更聪 明。 以下各项如果为真，最能质疑上述主张的是：", "o": [["A", "牛脑体积是老鼠的800倍，但牛并不比老鼠聪明多少。"], ["B", "神经元是用来产生电脉冲的蛋白质，他们天生不稳定。"], ["C", "要使人类的脑力变强，最明显的方法是增加大脑容量。"], ["D", "蜜蜂的脑容量有限，但可将神经系统的功能发挥到极致。"]], "a": ["B"], "an": "第一步：找到论点和论据。论点：神经元数量变多，我们会更聪明。没有论据。第 二步：判断削弱方式。本题只有论点，没有论据，所以需削弱论点。第三步：逐一判断选项 作用。A、C、D三项均与神经元无直接关系，属无关选项；B项神经元天生不稳定，数量不 能控制，削弱论点。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0301", "type": "single", "t": "美国睡眠专家设计了一项测试，让志愿者在睡眠实验室里连续度过13个夜晚。 前4个夜晚，志愿者每晚能睡足8小时；接下来6天，他们的睡眠时间缩短至每晚6小时； 最后3个晚上，志愿者出现“补觉”现象，每天要睡10小时。测试结果显示，持续几天睡眠 不足后，志愿者反应速度变慢。补觉后，虽然感觉头脑清醒一些，但仍行动迟缓、笨拙。由 此可见，连续工作一周，睡眠不足后，用3个晚上补觉可以改善困倦的状况，但是不能改善 缺觉对认知功能造成的累积影响。 以下哪项如果为真，最能支持上述结论：", "o": [["A", "很多志愿者难以适应睡眠实验室的环境，晚上经常做梦"], ["B", "志愿者平时习惯的睡眠时间不等，平均睡眠时间是每晚6小时"], ["C", "实验前后对志愿者进行大脑功能扫描，发现大脑结构并无明显异常"], ["D", "补觉后让志愿者进行反应灵敏度测试，多数人的灵敏度明显低于平时"]], "a": ["D"], "an": "本题属于加强题型。第一步：找到论点论据。论点：补觉不能改善缺觉对认知功能 造成的累积影响。论据：持续几天睡眠不足后，志愿者反应速度变慢，补觉后仍行动迟缓、 笨拙。第二步：逐一分析选项。D项，“灵敏度明显低于平时”，说明补觉后仍行动迟缓、笨 拙是因为灵敏度下降，灵敏度下降即认知功能下降，也就是说补觉不能改善缺觉对认知功能 的影响，加强了论点，是答案。A项中提到的“做梦”无法说明补觉后是否有好处，与题干讨 论的主题无关；B项，“平均睡眠时间是每晚6小时”，说明测试期间，志愿者并没有睡眠不 足，所以并非睡眠不足影响了认知功能，削弱了题干前提；C项，“大脑结构并无明显异常”， 与补觉是否能够改善认知功能无关，属于无关选项。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0302", "type": "single", "t": "凡事都应该有个“度”，正如做饭，火小了，不熟；火大了又会烧糊；只有正 好，才能吃到可口的饭菜。但是这个“度”并不是折中主义，不同的事物其“度”也是不同的。 这就是说：", "o": [["A", "只有具体地把握事物的“度”，才能把事情办好"], ["B", "事物折中的结果肯定不是我们要寻求的“度”"], ["C", "事物的“度”是无法得知的，更无从测量"], ["D", "折中主义也是有一定道理的"]], "a": ["A"], "an": "第一步：抓住题干主要信息。 第一句强调凡事都有度，并举例说明度不同，结果也不同； 第二句说明不同的事物有不同的“度”。 第二步：分析题干信息，结合选项得出答案。 A项，从第一句话中的举例可以看出，只有把度把握得恰如其分，才能把事情办好，选项A 的表述正确。 B项，题干中提到的折中主义是为了说明不同的事物有不同的“度”，没有说明事物折中的问 题，无法推出； C项，“度”是否可知可测量，题干没有涉及，无法推出； D项，题干没有对折中主义作出评价，无法判断。 B、C、D均无法从题干推出。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0303", "type": "single", "t": "核酸是什么？核酸与蛋白质均是生物所特有的重要大分子。核酸不但是一切 生物细胞的基本成分，还对生物体的生长、发育、繁殖、遗传及变异等重大生命现象起着主 宰作用。它分为脱氧核糖核酸（DNA）和核糖核酸（RNA）两大类，由核苷酸的3位和5位 磷酸键连接而成。 由此可以推断，下列对“核酸”的解说，不正确的一项是：", "o": [["A", "核酸是生物体所特有的重要大分子，是一切生物细胞的基本成分"], ["B", "核酸分成由核苷酸的3位和5位磷酸键连接而成的脱氧核糖酸和核糖核酸 两大类"], ["C", "核酸是核苷酸、核苷、碱基的混合物"], ["D", "核酸是对生物体的重大生命现象起着主宰作用的物质"]], "a": ["C"], "an": "第一步：抓住题干主要信息。 题干集中阐述了“核酸是什么”，包括核酸的本质，作用，种类，构成等。 第二步：逐一判断选项的作用。 由题干中“核酸与蛋白质均是生物所特有的重要大分子”，“核酸是一切生物细胞的基本成 分”，可知A正确； 由题干中“它分为脱氧核糖核酸（DNA）和核糖核酸（RNA）两大类，由核苷酸的3位和5 位磷酸键连接而成”，可知B正确； “核酸由核苷酸、核苷、碱基”构成，但是核酸不是混合物，可知C错误； 由题干中“对生物体的生长、发育、繁殖、遗传及变异等重大生命现象起着主宰作用”，可知 D正确。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0304", "type": "single", "t": "一罐橘子果酱再加上下列哪两罐果酱即可装成一箱：", "o": [["A", "一罐橘子果酱与一罐草莓果酱"], ["B", "两罐橘子果酱"], ["C", "一罐葡萄果酱与一罐草莓果酱"], ["D", "两罐葡萄果酱"]], "a": ["D"], "an": "题干所给条件较多，可以直接采用代入排除法。 A项不符合条件②和④； B项不符合条件①和②； C项不符合条件④； D项完全符合条件。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0305", "type": "single", "t": "人工合成食用色素，是用从煤焦油中分离出来的苯胺染料为原料制成的，故 又称煤焦油色素或苯胺色素，如合成苋菜红、胭脂红及柠檬黄等等。偶尔食用添加一定量的 人工合成食用色素的食品，并不会引发中毒、泻泄等状况。因此，人们可以放心食用添加少 量人工合成色素的食品。 以下哪项如果为真，最能削弱上述论证：", "o": [["A", "食用添加少量人工合成食用色素的食品不利于人体健康"], ["B", "经常食用和偶尔食用对人体的影响不同"], ["C", "苯胺染料含对人体有害的物质"], ["D", "食用添加少量天然食用色素的食品不会影响人体健康"]], "a": ["A"], "an": "第一步：分析题干，找到论点论据。 论点：人们可以放心食用添加少量人工合成色素的食品。 论据：偶尔食用添加一定量的人工合成食用色素的食品，并不会引发中毒、泄泻等状况。 第二步：逐一分析选项。 A项：点明人工合成食用色素不利于人体健康，不能放心食用，削弱论点； B项：经常和偶尔的影响具体有什么不同不明确，且题干没有提到经常食用，为不明确选项； C项：虽然苯胺染料含有有害物质，但是其制成的人工合成食用色素有没有害不明确，为不 明确选项； D项：讨论食用天然食用色素的影响，与题干的食用人工合成色素无关，为无关选项； 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0306", "type": "single", "t": "某小学向当地教育行政主管部门申请增购一辆校车，以加强对师生的接送能 力。该教育行政主管部门否决了这项申请，理由是：校车的数量必须与学校规模和师生数量 相配套。根据该校目前的师生数量和规模，现有的校车已经足够了。以下哪一项假设最能支 持教育行政主管部门的决定：", "o": [["A", "调查显示，租用校车比购买校车更经济"], ["B", "该小学的校车中，至少近期不会有车辆报废"], ["C", "该地区小学适龄儿童数量今后不会有大的增长"], ["D", "该教育行政主管部门没有扩大该校师生规模的计划"]], "a": ["B"], "an": "第一步：分析题干，找到论点和论据。 论点：教育行政主管部门否决了增购一辆校车的申请。 论据：校车的数量必须与学校规模和师生数量相配套。 第二步：逐一分析选项。 A 项：“租用校车比购买校车更经济”，与否决增购校车的申请无直接关系，属于 无关项； B 项：近期校车不会报废，说明目前的校车满足目前的师生数量和规模，支持了 不购买的决定，对题干结论加强作用明显； C 项：“该地区小学适龄儿童数量”范围扩大，并不是谈的该小学，属于无关项； D 项：“没有扩大该校师生规模的计划”并不是当前的情况，属于无关项。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0307", "type": "single", "t": "几位同学对物理竞赛的名次进行猜测。小钟说：“小华第三，小任第五。”小 华说：“小闽第五，小宫第四。”小任说：“小钟第一，小闽第四。”小闽说：“小任第一，小华 第二。”小宫说：“小钟第三，小闽第四。”已知本次竞赛没有并列名次，并且每个名次都有 人猜对。 那么，具体名次应该是：", "o": [["A", "小华第一、小钟第二、小任第三、小闽第四、小宫第五"], ["B", "小闽第一、小任第二、小华第三、小宫第四、小钟第五"], ["C", "小任第一、小华第二、小钟第三、小宫第四、小闽第五"], ["D", "小任第一、小闽第二、小钟第三、小宫第四、小华第五"]], "a": ["C"], "an": "第一步：找突破口。 由题干中“已知本次竞赛没有并列名次，并且每个名次都有人猜对”可以知道如果有一个名次 只被提到一次，那么该名次必然被猜对。由题干中五人的话可以看出第二名只被提到一次， 因此小华第二。 第二步：把题干信息列于表中，根据突破口进行判断。 综上所述，小任第一、小华第二、小钟第三、小宫第四、小闽第五。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0308", "type": "single", "t": "随着人们的生活和工作环境进入高楼大厦，人们接触日光的机会变少，研究 发现，日光是合成维生素D的必要条件，而维生素D是促进钙吸收的关键因素。因此有人 得出结论：现代人更容易患骨质疏松等因缺钙引起的疾病。 以下哪项为真，最能质疑上述结论：", "o": [["A", "骨质疏松疾病患者多晒太阳就可以缓解或治愈"], ["B", "现代人饮食结构中的含钙食品比以前丰富很多"], ["C", "骨质疏松症患者接触日光的时长与其他人无异"], ["D", "口服维生素D片是加了促吸收剂的合成配方"]], "a": ["C"], "an": "第一步：找到论点论据。论点：缺乏阳光导致现代人更容易患缺钙引起的骨质疏松 症。论据：现代人接触日光的机会变少，日光是合成维生素D的必要条件，维生素D是促 进钙吸收的关键因素。第二步：判断削弱方式。论点强调的是骨质疏松等缺钙疾病，论据强 调的是缺少日光、维生素D，两者对象不一致，可以考虑不搭桥削弱论证。第三步：逐一判 断选项。A项说晒太阳可以缓解或治愈骨质疏松病，即阳光对骨质疏松是有好处的，支持了 题干观点，不符合题意；B项说的是人们饮食结构中的含钙食品多了，但是摄取的这些食物 是否能被有效地吸收无法在选项中体现，无法证明人们是否会因缺钙而患骨质疏松，属于无 关选项；C项骨质疏松患者接触阳光时长与他人一样，意味着阳光和骨质疏松之间没有必然 联系，削弱论证；D项中的维生素D是否添加合成配方与题干讨论的话题不一致，属无关 选项，无法削弱。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0309", "type": "single", "t": "以往的研究认为火山喷发会释放大量热量，引发全球变暖，但今日研究发现， 火山喷发不仅不会引发全球温度上升，还可以削弱全球变暖的影响。 以下哪项为真，最能支持上述结论：", "o": [["A", "研究表明，火山爆发时地下岩浆喷出地面，与空气接触，产生氧化反应， 引起局部温度升高。"], ["B", "火山爆发能够抑制某种分解有机物的细菌，其分解的有机物中含有甲烷，甲 烷是一种可燃性气体，可产生热能。"], ["C", "火山喷发后会带来大规模的酸雨，酸雨能在短期内降低火山区气温，但是 也引发了农作物虫害。"], ["D", "研究发现火山喷发物质——二氧化硫可与大气物质形成“水粒”并将阳光反 射，减少对地面的热辐射，延缓全球变暖。"]], "a": ["D"], "an": "第一步：找到论点论据。论点：火山喷发不仅不会引起全球温度上升，还可以削弱 全球变暖的影响。论据：无明显论据。 第二步：判断加强方式。 本题没有论据，故可以考虑补充新论据加强论点。第三步：逐一判断选项。A、B两项均说 是火山喷发会产生热能，引起温度升高，削弱了论点；C、D两项均说明火山喷发会降温， 但C项只是火山区短期降温，而D项是全球降温，所以D项加强力度更强。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0310", "type": "single", "t": "记者采访时的提问要具体、简洁明了，切忌空泛、笼统、不着边际。约翰·布 雷迪在《采访技巧》中剖析了记者采访时向访问对象提出诸如“您感觉如何？”等问题的弊端， 认为这些提问“实际上在信息获取上等于原地踏步，它使采访对象没法回答，除非用含混不 清或枯燥无味的话来应付。” 由此可以推出：", "o": [["A", "记者采访时的提问如果具体、筒洁明了，就不会给采访对象带来回答的困 难"], ["B", "采访对象如果没法回答提问，说明他没有用含混不清或枯燥无味的话来应 付"], ["C", "采访对象只有用含混不清或枯燥无味的话来应付，才能回答那些空泛、笼 统的提问"], ["D", "诸如“您感觉如何？”这样的问题，只能使采访对象抓不住问题的要点而作泛 泛的或言不由衷的回答"]], "a": ["C"], "an": "第一步：翻译题干： 除非，否则不这个关联词可翻译为：后→前的形式，因此，题干最后一句话翻译为： 回答了→含混不清或枯燥无味 第二步：翻译选项。 A项：记者采访时的提问如果具体、简洁明了是否能给采访对象带来回答的困难，原文当中 完全没有提到过，属于无中生有的选项，排除； B项：可翻译为：没法回答→没有（含混不清或枯燥无味），否前→否后，与题干的翻译形 式不一致，排除； C项：可翻译为：回答→含混不清或枯燥无味，与题干翻译形式一致，符合题意； D项：说因为采访对象抓不住要点而做泛泛的或言不由衷的回答，原文说的是采用含混不清 或枯燥无味，不等同于泛泛或言不由衷，属于概念的偷换，并且这么回答的原因是什么题干 也没有提到，排除。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0311", "type": "single", "t": "私营部门试图通过提供高薪来吸引有技能的研究科学家。结果，大多数受雇 于私营部门的研究科学家赚的钱比技能相仿的在政府部门工作的研究科学家多出50％。所 以，除非政府雇佣的研究科学家更多地被对公众地职责感而不是被他们地个人利益所驱使， 否则政府就有可能使它最有技能地科学家流失到私营部门，因为这些科学家中没有人会在私 营部门中找不到工作。 上述论述依赖的假设是：", "o": [["A", "与私营部门相比，政府部门的研究科学家的科研贡献难以被承认"], ["B", "目前，在政府部门工作的研究科学家中，没有人赚的钱比受雇于私营部门的 研究科学家多"], ["C", "政府部门雇佣的技能卓越的研究科学家的人数没有私营部门中多"], ["D", "政府不给它的研究科学家提供非常好的工作条件或由于低薪水所应获得补 偿的额外福利"]], "a": ["D"], "an": "第一步：找出论点和论据。 论点：如果政府雇佣的研究科学家没有职责感并且受个人利益驱使，那么这些科学家可能就 会流失到私营部门。 论据：受雇于私营部门的研究科学家赚的钱更多。 第二步：判断加强方式。 本题论点和论据存在因果关系，所以需加强论点。 第三步：逐一判断选项。 A项中科研贡献是否被承认，与影响科学家找工作的因素无关，无法支持论点；B项说的是 在政府部门工作的研究科学家目前的薪资状况，只能证明受雇于私营部门的科学家赚的钱更 多，无法说明科学家是否会流失，不是得出结论必须有的前提假设；C项对比政府部门和私 营部门的科学家的数量，但科学家数量的多少受到多种因素的影响，不是论点成立的必要条 件。A、B、C三项均不是题干论述成立的必要假设； D项正确，如果政府给科学家提供良好的工作条件或额外的福利，那这些科学家就不会受私 营部门提供的高薪所吸引，到私营部门找工作，论点无法成立，因此D项是题干论述的前 提假设。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0312", "type": "single", "t": "如果不能保证四小时睡眠，那么大脑将不能得到很好的休息；如果大脑没有 得到很好的休息，那么第二天大部人都会感觉到精神疲劳。 因此，可以推断：", "o": [["A", "只要大脑得到充分休息，就能消除精神疲劳"], ["B", "大部人的精神疲劳源于睡眠不足"], ["C", "如果你只睡眠三个小时，那么第二天一定会精神疲劳"], ["D", "如果大脑得到了很好的休息，则必然保证了四小时的睡眠"]], "a": ["D"], "an": "第一步：翻译题干。利用充分必要条件。 第一句：－保证四小时睡眠－大脑得到很好的休息，第二句：－大脑得到很好的休息第二天 大部人都会感觉到精神疲劳。 将以上两个推导关系连起来即为：－保证四小时睡眠－大脑得到很好的休息第二天大部人都 会感觉到精神疲劳。 第二步：逐一翻译选项并判断选项的正确。利用逆否规则。 A项：大脑得到很好的休息能消除精神疲劳，“大脑得到很好的休息”是对第二句“－大脑得到 很好的休息第二天大部人都会感觉到精神疲劳”的否前件，无法推出绝对表达的结论，因此 A项错误； B项：大部人的精神疲劳睡眠不足，由第一步中的关系式“－保证四小时睡眠－大脑得到很 好的休息第二天大部人都会感觉到精神疲劳”可得：睡眠不足大部人的精神疲劳，因此B选 项是该关系的肯后件，无法推出绝对表达的结论，因此B项错误； C项：只睡眠三个小时第二天一定会精神疲劳，由第一步中的关系式“－保证四小时睡眠－ 大脑得到很好的休息第二天大部人都会感觉到精神疲劳”只能得到：只睡眠三个小时第二天 大部人都会感觉到精神疲劳，因此C项错误； D项：大脑得到很好的休息保证四小时睡眠，是对第一句“－保证四小时睡眠－大脑得到很 好的休息”的逆否规则，因此D项正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0313", "type": "single", "t": "某国近年来放松了对销售民用枪支的管制，枪击案发生率快速上升。据统计， 大多数枪击案与合法购置的民用枪支被滥用有关，所以有人提出为减少该国的枪击案发生 率，政府应该加强对销售民用枪支的限制。 下列哪项最能支持上述论述：", "o": [["A", "该国走私枪支的数量远远大于合法购置的枪支"], ["B", "目前对枪击案罪犯的严厉惩罚没有足够的威慑力"], ["C", "大多数在该国销售的民用枪支的杀伤力并不大"], ["D", "严格限制销售民用枪支能得到国民的支持"]], "a": ["B"], "an": "第一步：找到论点论据。 论点：应该加强民用枪支销售的限制以减少枪击案发生率。论据：大多数枪击案与合法购置 的民用枪支被滥用有关。 第二步：判断加强方式。 论点需要多个论据证明，枪击案发生率不仅仅取决于民用枪支的销售，故可以考虑补充新论 据加强论点。 第三步：逐一分析选项。 A项的走私枪支，C项的杀伤力，D项的国民支持都与论题无关，为无关选项； B项增加了新论据，说明为减少枪击案发生率，严厉惩罚效果不好，故限制民用枪支的销售 更加有必要，加强了论点。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0314", "type": "single", "t": "科学家最新发现被命名为“郑氏晓廷龙”的小恐龙是始祖鸟的“亲戚”，与生存于 侏罗纪晚期的始祖鸟亲缘关系非常近。通过分析始祖鸟的形态，并对似鸟恐龙和早期鸟类的 系统发育关系进行了重新分析，得出始祖鸟并非鸟类，而是原始恐爪龙类，即始祖鸟是迅猛 龙的祖先，而不是鸟类的祖先。 如果以下各项为真，最不能质疑上述推测的是：", "o": [["A", "恐爪龙类是一类与恐龙亲缘关系很近的鸟"], ["B", "恐爪龙类是一类与鸟类亲缘关系很近的恐龙"], ["C", "兽脚类恐龙的一支演化成植食性恐龙，再演化成鸟类"], ["D", "始祖鸟标本被命名后，一直被认为是最原始、最古老的鸟类"]], "a": ["B"], "an": "第一步：找到论点和论据。 论点：始祖鸟并非鸟类，而是原始的恐爪龙类。 没有明显论据。 第二步：逐一判断选项作用 A项指出恐爪龙类是鸟，具有削弱作用； B项与A项相反，具有加强作用； C项中兽脚类恐龙和题干始祖鸟主体不同，无关排除； D项指出始祖鸟是鸟类，削弱题干。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0315", "type": "single", "t": "与中国的贸易，法国远远落后于日本和美国，甚至落后于英国和意大利。中 国今年的国民生产总值的增长率预计将达7.5%—7.8%，与2001年前7个月相比，法国同 中国的贸易只增长了2.7%，而同是竞争者的其他欧洲国家同中国的贸易却平均增长了 10%。 这段话说明（ ）。", "o": [["A", "法中贸易增长率低于中国国民生产总值的增长率"], ["B", "法国同中国贸易的发展步伐相对缓慢"], ["C", "法国同中国的贸易远远落后于其他发达国家"], ["D", "除法国外的其他欧洲国家与中国的贸易都增长迅速"]], "a": ["B"], "an": "第一步：抓住每句话中的对象及其关系。 第一句说与中国的贸易额排名中，法国落后于日、美、英、意。第二句说法国同中国的贸易 增长率比其他欧洲国家低。 第二步：判断整体关系。 题干整体表明法国同中国的贸易增长不及其他欧洲国家。 第三步：逐一判断选项的作用。 今年的国民生产产值增长率预计……”，“与2001年头7个月相比，……只增长了……”，前者 为“今年”，后者为“头7个月”，在时间上不具可比性，前者为“预计”，既未然，后者为“了”， 即已然发生，所以A不正确； 题干中“法国同中国的贸易增长为2.7%，其他欧洲国家为10%”，这说明“法国同中国贸易 的发展步伐相对缓慢”，B正确； “法国同中国的贸易增长率低于其他国家”并不一定意味着“法国同中国的贸易落后于其他国 家”，C错误； 题干中“10%”是一个平均数，这并不意味着法国以外所有欧洲国家与中国的贸易都增长迅 速，也可能存在增长缓慢的国家，D错误。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0316", "type": "single", "t": "市长任职的三年里经常被控对女性有性别歧视的态度。然而，他已经在他的 管理层的19个高层职位中任用了5名妇女，她们中的所有人都仍在服务，这表明市长并不 是一名性别歧视者。 以下哪项为真，最能反驳上面得出的结论：", "o": [["A", "市长任命的一名高层职位的女性正准备辞职"], ["B", "市长所在的政党的政纲要求他在高层职位里至少任命5名女性"], ["C", "三年前在市长选举中，47％的女性投票支持这位市长"], ["D", "相邻市的市长最近在高层职位任命了7名女性"]], "a": ["B"], "an": "第一步：找到论点和论据。 论点是市长并不是一名性别歧视者。论据是他已经在他的管理层的19个高层职位中任用了 5名妇女，她们中的所有人都仍在服务。 第二步：判断削弱方式。 论点和论据之间构成因果关系，可对其论点进行削弱。 第三步：逐一判断选项的作用。 A项说明高层女性辞职的原因有很多，并不能说明州长性别歧视； B项说明这位州长任用女性是为达到政纲要求，而他并未在基本要求的基础上增加一名女 性，因而反驳了题干的结论； C项说明近一半的女性支持州长，是支持题干结论的，加强了论点； D项与性别歧视没有关系，不能削弱论点。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0317", "type": "single", "t": "据研究，到2013年底，全球互联网用户将达到27亿，相当于全球人口的39%。 发达国家与发展中国家在互联网使用方面存在较大差异。到2013年底，发达国家将有77% 的居民使用互联网，而发展中国家仅有31%的居民使用互联网。欧洲是互联网用户比例最 高的地区，达75%，远远超过亚太地区（32%）和非洲（16%）。 根据以上陈述，可以得出以下哪项：", "o": [["A", "发达国家的互联网用户超过发展中国家"], ["B", "亚太地区的互联网用户超过非洲"], ["C", "英国的互联网用户比例超过日本"], ["D", "发展中国家互联网用户比例低于全球"]], "a": ["D"], "an": "本题属于日常结论题型。 第一步：抓住题干主要信息。 第一句：全球互联网用户将达到27亿，相当于全球人口的39%； 第二句：到2013年底，发达国家将有77%的居民使用互联网，而发展中国家仅有31%的 居民使用互联网； 第三句：欧洲是互联网用户比例最高的地区，达75%，亚太地区为32%，非洲为16%。 第二步：分析各选项。 A项由第二句可知发达国家的互联网用户比例大于发展中国家，但题干没有给出发达国家和 发展中国家的人口数量，因此无法推知发达国家的互联网用户是否超过发展中国家，A项错 误； B项同理，题干没有给出亚太地区和非洲的具体人口数量，因此无法从亚太地区的互联网用 户比例高于非洲得出亚太地区的互联网用户超过非洲，B项错误； C项题干没有提供英国和日本的相关信息，无法得出结论，C项错误； D项从第一句和第二句可知，发展中国家互联网用户比例低于全球，D项正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0318", "type": "single", "t": "要治服坏人，有时候要以坏治坏，以小坏对付大坏，以假坏对付真坏，坏人 也会做好事，但好人只要做过坏事就变成了坏人。 由此可以推出：", "o": [["A", "好人不可能治服坏人"], ["B", "世界上不可能有好人"], ["C", "做过好事的人未必是好人"], ["D", "做过坏事的人未必是坏人"]], "a": ["C"], "an": "第一步：抓住题干主要信息。 题干阐述了如何治服坏人以及好人、好事、坏人、坏事四者之间的关系。 第二步：逐一判断选项的作用。 A错误，由“要治服坏人，有时候要以坏治坏”可知坏人是可以被“人”治服的，这个“人”包括 了好人，因此A错误； B错误，中“世界上不可能有好人”过于绝对，不能从题干中推出，因此B错误； C正确，由“坏人也会做好事”可知做好事的也可能是坏人，即做过好事的人未必是好人，因 此C正确； D错误，由“好人只要做过坏事就变成了坏人”可知只要做过坏事就会变成坏人，即做过坏事 的人必定是坏人，因此D错误。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0319", "type": "single", "t": "学校开设体育课的主要目的是使学生的身体变得健康。体育课应该集中于增 氧锻炼，增氧锻炼比集体运动更能促进参与者的健康，并且实际上只有一小部分学生参加集 体运动。 以上观点如果正确，作者将最有效地反对下面哪一项：", "o": [["A", "学校里使用身体训练计划来鼓励学生终身的健康习惯。"], ["B", "年轻的学生应该参加社区运动队。"], ["C", "学校过分依赖于增氧练习计划来帮助所有的孩子变得身体健康。"], ["D", "学校大部分体育课用来进行集体运动。"]], "a": ["D"], "an": "第一步：找出题干所给的关键点。 增氧锻炼比集体运动更能促进参与者的健康。 第二步：逐一判断选项的正确性。 AB中都没有和增氧锻炼、集体运动相关的观点，属于无关选项，C说明学校认为增氧锻炼 比集体运动更能促进参与者的健康，是支持题干的选项，D说学校大部分体育课用来进行集 体运动，说明集体运动比增氧锻炼更能促进参与者的健康。题干观点有效的反对了D的观 点。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0320", "type": "single", "t": "关于基本粒子目前最被认可的理论是“标准理论”。它约在30年前确立，已 发现的基本粒子都可以根据这一理论进行解释。100多年来，质子、中子、电子等基本粒子 陆续被发现。面对这些成绩，有人认为，宇宙间的基本粒子被发现得差不多了，即使有，也 可以用现有的理论解释，因而不会给人们带来太大的惊奇。 以下哪项如果为真，最能反驳以上观点：", "o": [["A", "基于“标准理论”而被发现的基本粒子很少"], ["B", "基于“标准理论”做出的某些预测未在实验中得到证实"], ["C", "新发现的基本粒子与“标准理论”做出的预测不相符"], ["D", "有科学家提出了颠覆人们以往对基本粒子认识的新理论"]], "a": ["C"], "an": "第一步：找到论点和论据。 本题的论点是宇宙间的基本粒子被发现得差不多了，即使有，也可以用标准理论解释。论据 是“已发现的基本粒子都可以根据标准理论进行解释”，“质子、中子、电子等基本粒子陆续 被发现”。 第二步：判断削弱方式。 论点和论据间有因果联系，所以需削弱论点。 第三步：逐一判断选项的作用。 A中“基于理论发现的基本粒子很少”，B中“某些预测未得到证实”，D中“提出新理论”都和题 干内容无关，A、B、D是无关选项，A、B、D错误。 C中新发现的粒子与“标准理论”做出的预测不符，也就是说新发现的粒子不能用“标准理论” 解释，这直接有力地否定题干的观点，C正确。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0321", "type": "single", "t": "北京市某公司发现有年收入在12万元以上的人员未申报缴纳个人所得税。 如果上述断定为真，则以下哪项不能确定真假： Ⅰ.北京市某公司所有年收入在12万元以上的人员都未申报缴纳个人所得税。 Ⅱ.北京市某公司所有年收入在12万元以上的人员都申报缴纳了个人所得税。 Ⅲ.北京市某公司有年收入在12万元以上的人员申报缴纳了个人所得税。 Ⅳ.北京市某公司年收入在12万元以上的小李申报缴纳了个人所得税。", "o": [["A", "Ⅰ、Ⅱ、Ⅲ和Ⅳ"], ["B", "Ⅰ、Ⅲ、Ⅳ"], ["C", "Ⅰ和Ⅲ"], ["D", "Ⅰ和Ⅳ"]], "a": ["B"], "an": "第一步：分析题干。 “有的”能推出的是有的，不能推出全部，不能推出有的不。 已知条件：有年收入在12万元以上的人员未申报缴纳个人所得税。 第二步：逐一判断几个结论。 根据有的不能推出所有，所以Ⅰ是可能，不能确定的；Ⅱ所有都申报，与题干有的未申报矛 盾，故确定为假；Ⅲ有的未申报，不能推出有的申报，是不确定的；Ⅳ有的不能推出个人， 不能确定。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0322", "type": "single", "t": "近十年来，新飞冰箱厂通过不断引进先进设备的技术，使得劳动生产率大为 提高。即在单位时间里，较少的工人生产了较多的产品。 请问以下哪项如果为真，就一定能支持上述结论： Ⅰ和1997年相比，2007年新飞冰箱厂的年利润增加了一倍，工人增加了10%。 Ⅱ和1997年相比，2007年新飞冰箱厂的年产量增加了一倍，工人增加了100人。 Ⅲ和1997年相比，2007年新飞冰箱厂的年产量增加了一倍，工人增加了10%。", "o": [["A", "只有Ⅰ"], ["B", "只有Ⅱ"], ["C", "只有Ⅲ"], ["D", "只有Ⅰ和Ⅱ"]], "a": ["C"], "an": "第一步：找到论点和论据。 论点是新飞冰箱厂通过不断引进先进设备的技术，使得劳动生产率大为提高。没有明显论据。 第二步：判断加强方式。 只有论点，所以需要加强论点。 第三步：逐一判断选项。 由题干Ⅰ可知，新飞冰箱厂年利润增加一倍，但利润率与生产率无关，利润率提高也可能是 由于其他原因引起的，利润率增加并不能说明劳动生产率。故Ⅰ不能支持论点；由Ⅱ可知， 年产量虽然增加了一倍，但原新飞冰箱厂工人人数未提及，新增加了100人与年产量增加 了一倍无法比较，不能加强论点；由Ⅲ可知，产量增加一倍，而工人增加了10%，说明单 位时间里工人生产了较多的产品，劳动生产率提高了，加强了论点。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0323", "type": "single", "t": "尽管对于备办酒宴机构的卫生检查程序要比普通餐厅的检查程序严格得多， 在报到市卫生主管部门的食品中毒案件中，还是来自酒宴服务的比来自普通餐厅的多。 以下哪个选项为真，最能够解释题干中表面上的矛盾现象：", "o": [["A", "上报的在酒宴中发生食品中毒案件的数目，与备办酒宴者和顾客常去场所 的服务无关"], ["B", "许多餐厅在提供备办酒宴服务的同时，也提供个人餐饮服务"], ["C", "人们不大可能在吃一顿饭和随之而来的疾病之间建立关联，除非该疾病影 响到一个相互联系的群体"], ["D", "备办酒宴的机构清楚地知道他们将为多少人服务，因此比普通餐厅更不可 能有剩余食物，后者是食品中毒的一个主要来源"]], "a": ["C"], "an": "第一步：找到论点和论据。 本题论点是上报到市卫生部门的食品中毒案件中，酒宴服务比普通餐厅要多，论据是对于备 办酒宴的机构的卫生检查程序比普通餐厅程序要严格得多。 第二步：判断加强方式。 论点强调上报的食品中毒案件，论据强调卫生检查程序，所以论点与论据间不存在明显因果 关系，需加强论证，在论点和论据间搭桥。 第三步：逐一判断选项的作用。 A中食品中毒案件的数目与服务场所的性质无关，并不能说明题干中的矛盾，是无关选项； B中餐厅也供个人餐饮服务； C中人们不大可能在吃一顿饭和随之而来的疾病之间建立联系，即说明卫生检查程序再严， 人们意识不到还是不会上报，从而在上报的食品中毒案件和卫生检查程序间搭桥，加强论证； D中剩余食物均与上报的食品中毒案件无直接关系，属无关选项。 综上，C中是搭桥论证。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0324", "type": "single", "t": "如果“我们班有的同学不会使用计算机”是一个真判断，下面不能确定其真假 的是：", "o": [["A", "我们班至少有一个同学不会使用计算机"], ["B", "我们班所有的同学都会使用计算机"], ["C", "我们班有的同学会使用计算机"], ["D", "不会使用计算机的有些是我们班的同学"]], "a": ["C"], "an": "由题干直接分析可知，A、D正确，B错误。因为题干只提到有不会计算机的同学， 没有提到会计算机的同学有没有，因此C无法判断真假。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0325", "type": "single", "t": "有统计数据表明，9月份国内汽车累计销售160万台左右，终结了连续7个 月同比正增长的记录，日系车产销出现大幅下降，同步下降达40%左右，与日系车销量全 线下降形成鲜明对比的是自主品牌，自主品牌占乘用车销售总量的42.7%左右，为今年销 售的第二高记录，因此，有关专家判断自主品牌汽车销量将进入快速增长期。 以下哪项如果为真，最能支持上述结论：", "o": [["A", "9月份，某日系品牌汽车被曝存在质量问题，影响了日系汽车的整体销量"], ["B", "在第4季度，自主品牌汽车销量依然高于其他品牌汽车，并持续增长"], ["C", "9月份，除了日系汽车外，德系、美系汽车的销量也不如自主品牌汽车"], ["D", "汽车销售统计数据不包括未上牌照的汽车，且存在大量不上牌照汽车"]], "a": ["B"], "an": "第一步：分析题干，找到论点和论据。 论点：自主品牌汽车销量将进入快速增长期。 论据：自主品牌汽车销量9 月份创新高。 第二步：逐一分析选项。 A 项：解释的是日系车销量下降的原因，与论点无关，属于无关选项； B 项：题干说到的是9 月份的销量，B 项补充了第四季度的数据和增长的趋势，通过补充论 据加强了论点，为正确选项； C 项：该项说德系、美系汽车的销量不如自主品牌汽车，说明自主品牌汽车的销量确实高， 补充论据支持论点，但是其补充的范围没有B 项大，只说了9 月份，论点是对未来的预测， 因此，支持力度没有B 项强； D 项：补充说明了统计数据的不完整，没统计未上牌照的汽车，且这种情况不在少数，质疑 了论证的准确性，削弱了论点。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0326", "type": "single", "t": "小高到超市买水果，售货员问他想买什么水果，小高说：“我不像讨厌荔枝那 样讨厌苹果，我不像讨厌梨那样讨厌葡萄，我不像喜欢柑橘那样喜欢苹果，我对葡萄不如对 荔枝那样喜欢。” 小高最后会选择的水果是：", "o": [["A", "荔枝"], ["B", "葡萄"], ["C", "苹果"], ["D", "柑橘"]], "a": ["D"], "an": "本题为关联词推导题型。 第一步：翻译题干。 小高对其提到的几种水果的喜欢程度分别是：①荔枝＜苹果，②梨＜葡萄，③苹果＜柑橘， ④葡萄＜荔枝，从上述关系可推出小高喜欢“梨＜葡萄＜荔枝＜苹果＜柑橘”。 第二步：逐一分析选项并得出答案。 从第一步的推导关系可得出，小高最喜欢的是柑橘。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0327", "type": "single", "t": "过度工作和压力都会不可避免地导致失眠症。现在所有的管理人员都有压力。 尽管医生反复提出警告，但大多数公司的管理人员每周工作仍然超过六十小时，而其它工作 人员每周仅工作四十小时。只有每周工作超过五十小时的员工才能得到一定的奖金。 从上述观点可以得出以下哪些结论：", "o": [["A", "许多公司员工的大部分奖金给了管理人员"], ["B", "公司管理人员比任何别的员工更容易患失眠症"], ["C", "大多数得到一定奖金的公司管理人员患有失眠症"], ["D", "没有每周仅仅工作四十小时的公司管理人员患有失眠症"]], "a": ["B"], "an": "第一步：抓住题干主要信息。 题干主要说的是过度工作和压力与失眠症及奖金的关系。 第二步：逐一判断选项。 A项多数公司的管理人员每周工作超过60小时，其他工作人员每周工作40小时，拿奖金的 条件是每周工作超过50小时，故其他工作人员拿不到奖金，奖金都给了管理人员，A项错 误； B项过度工作和压力都会不可避免地导致失眠症，现在所有的管理人员都有压力，且管理人 员大多每周工作超过60小时，属于过度工作，故公司管理人员比任何别的员工更容易患失 眠症，B项正确； C项从题干只能得知大多数管理人员容易患失眠症，不是已经患了失眠症，C项错误； D项题干只说过度工作易患失眠症，但正常工作是否患失眠症不可知，D项错误。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0328", "type": "single", "t": "在打猎季节，在人行道上行走时被汽车撞伤的人数是树林中的打猎事故中受 伤人数的2倍。因此，在打猎季节，人们在树林里比在人行道上行走安全。 要评价上面的论证，最重要的是要知道：", "o": [["A", "打猎季节在树林中行走的人数"], ["B", "在打猎季节，马路上的行人和树林中人数的比例"], ["C", "打猎季节在人行道行走时被撞伤的人数和总人数的比例"], ["D", "在打猎季节，汽车司机和打猎人都能小心点，那么受伤的人数将会有所下 降"]], "a": ["B"], "an": "第一步：找出论点和论据。 论点：在打猎季节，人们在树林里比在人行道上行走安全。 论据：在打猎季节，在人行道上行走时被汽车撞伤的人数是树林中的打猎事故中受伤人数的 2倍。 第二步：判断加强方式。 论点比较的是在人行道上和在树林里行走的安全性，论据比较的是在人行道上和在树林里行 走出事故的比例，论点和论据之间存在漏洞，需要加强论证。 第三步：逐一判断选项的作用。 A项只提到在树林中行走的人数，C项只提到在人行道上行走时被撞伤的人数和总人数的比 例，A、C都只提到一种情况，无法比较在树林中行走和在人行道上行走的总人数情况，因 此无法评价题干的论证； B项：在某种情况下行走是否安全，是要看出事故的人数与总人数的比例，论据只说明在人 行道上被汽车撞伤的人数和在打猎事故中受伤的人数的比例，并没有说明在人行道上和在森 林里行走的总人数比例，因此要评价题干的论证是否成立，需要知道在打猎季节马路上的行 人总数和树林中行走的总人数的比例，才能得出这两种情况下分别出事故的比例，从而比较 两者的安全程度，B项正确； D项说的是如何降低受伤人数的数量，与题干无关，属于无关选项。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0329", "type": "single", "t": "英国一家非常受欢迎的专卖三明治的快餐店，最近把三明治的价格提高了0.2 欧元，即从1.8欧元提到2欧元。可是涨价后仅仅一个月，所有的服务员都不约而同的辞职 了。 下列哪项如果为真，能最好的解释上述现象：", "o": [["A", "价格上涨后，快餐店就可以继续赠送顾客饮料，而服务员嫌麻烦"], ["B", "服务员的小费比以前大大的减少了。因为售价是整数，顾客可能没有零钱给 小费了"], ["C", "尽管三明治的价格上涨了，但是并没有相应的增加服务员的工资"], ["D", "由于价格上涨，除了某些老主顾经常来光顾，店里的生意可是日渐冷清了"]], "a": ["B"], "an": "第一步：找到论点和论据。 本题论点是服务员都不约而同的辞职了，论据是三明治涨价了。 第二步：判断加强方式。 论点强调服务员辞职，论据强调三明治涨价，所以论点与论据间不存在明显因果关系，需加 强论证，在论点和论据间搭桥。 第三步：逐一判断选项的作用。 A、C虽然建立了联系，但是联系不合理， B即在服务员辞职和三明治涨价间搭桥，是答案； D与服务员辞职无直接关系，属无关选项。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0330", "type": "single", "t": "在一次考古发掘中，考古人员在一座唐代古墓中发现多片先秦时期的夔文（音 kui，一种变体的龙文）陶片。对此，专家解释说，由于雨水冲刷等原因，这些先秦时期的 陶片后来被冲至唐代的墓穴中。 以下哪项如果为真，最能质疑上述专家的观点：", "o": [["A", "在这座唐代古墓中还发现多件西汉时期的文物"], ["B", "这座唐代古墓保存完好，没有漏水、毁塌迹象"], ["C", "并非只有先秦时期才使用夔文，唐代文人以书写夔文为能事"], ["D", "唐代的墓葬风俗是将墓主生前喜爱的物品随同墓主一同下葬"]], "a": ["B"], "an": "第一步：找到论点和论据。 论点：考古人员在一座唐代古墓中发现多片先秦时期的夔文陶片。 论据：专家解释说由于雨水冲刷等原因，这些先秦时期的陶片后来被冲至唐代的墓穴中。 第二步：判断削弱方式。 提问句是否定专家的观点，而专家的观点是原因解释，要构成削弱，可对其论据进行削弱。 第三步：逐一判断选项的作用。 A项“发现多件西汉时期的文物”、C项“唐代文人以书写夔文为能事”均与论点无关，属于无 关项； B项“保存完好，没有漏水、毁塌迹象”说明雨水不能将夔文陶片冲进古墓中，属于削弱论据 的否定原因选项；D项“唐代的墓葬风俗”使得夔文陶片出现在古墓中，属于削弱论据的他因 削弱选项，B项比D项的力度更强。 故正确答案选B。", "tp": "逻辑判断", "d": "中"},
	{"i":"fjcs_0331","type":"single","t":"地球自身储存着丰富的能力，雷雨、洪涝、台风、海啸、地震等自然灾害会带来巨大破坏。有些物理学家发现了地球自然破坏力、影响力中的军事意义和价值，通过不断研究自然现象的特征和规律，试图掌握自然灾害对军事的影响，并通过一些物理学的方法对自然能力进行利用，如人为地制造大风、降雨、闪电、潮汐、海啸、雾气等，可以达到军事进攻与防御的目的;利用人工引雷的方法，可以有效驱赶厚重的云层，减少闪电的能量与时间，从而让军事行动的指挥控制设施不受干扰。对这段文字概括最恰当的是:","o":[["A","地球物理技术在现代军事发展中是不可或缺的重要军事技术"],["B","地球物理技术为军事领域有效利用自然能量开辟新方向"],["C","地球自然破坏力具有两面性，不能片面归结为灾害"],["D","各国都注重利用地球物理技术，提高军事实力"]],"a":["B"],"an":"本题为中心理解题。文段第一句话是背景铺垫。第二句阐述地球自然破坏力有军事意义，并且通过一些物理学的方法对自然能力进行运用。后面一大段通过“如”字，告诉考生这是举例分析，不是文段重点，所以主旨句为第二句。A项中的“不可或缺的重要军事技术”错误;C项表述过于宽泛，没有论及“军事”;D项“各国”在文中没有出现。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0332","type":"single","t":"每一种行为都来自一定的思想，不一定都是行动的信号，人们越是充分运用语言工具自由地交流思想，越是能运用正确的认识以支配较为理智的行动。因此，镇压言论往往不是防止错误的行动，倒是防止了深思熟虑的行动，其结果必然是，假如压力有足够大，人们则消极被动，假如压力小了，人们就会任意乱动。作者通过以上文字想要表达的主要意思是:","o":[["A","有思想就会产生行动"],["B","限制言论会限制思想"],["C","限制言论可以限制行动"],["D","行动产生于思想"]],"a":["B"],"an":"据提问可知此题为中心理解题。根据层次结构可知材料是“铺垫理论一明确观点一正反加强”的“分一总一分”结构，因此文段的主旨句为“镇压言论往往不是防止错误的行动，倒是防止了深思熟虑的行动”，所以文段的主要意思是限制言论会限制思想的产生。因此，结合选项应该选择B。A项理解错误,根据文中“每一种行为都来自一定的思想”可知,思想只是行动的必要条件,并不是充分条件，所以有思想也不一定会产生行动;C、D项未把握重点，并不是文段想表达的中心意思。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0333","type":"single","t":"有朋友对我说,你们古董行不好,净卖假货。我深刻反省,究其原因,文物的文化含量太大，难以一目了然。自古文物收藏凭的是眼力，玩的是心跳，至少宋代以来许多国宝就在真假之间争论，翻来覆去者并不罕见。历史上被判了死刑的文物又起死回生也不是凤毛麟角。由于人类对自身文化认知的局限而对文物发生错判，只要不是故意，就情有可原。对这段文字理解错误的是:","o":[["A","非故意的卖假古董可以谅解"],["B","非故意的错判文物真假可以原谅"],["C","宋代以来许多国宝陷于真假之争"],["D","历史上有不少被判为赝品的古董又被鉴定为真品"]],"a":["A"],"an":"A项说法错误，文段没有体现，也违背法律常识;B项说法正确,由“由于人类对自身文化认知的局限而对文物发生错判,只要不是故意,就情有可原”可知;C项说法正确,由“至少宋代以来许多国宝就在真假之间争论”可知;D项说法正确，由“历史上被判了死刑的文物又起死回生也不是凤毛麟角”可知。本题为选非题。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0334","type":"single","t":"是否构成抄袭,要结合主观动机和客观结果两方面来判断:主观上是有意还是无意，有没有欺诈的成分;客观上自己是否从中获利，是否对原作者造成伤害。当人们依据这一标准再度审视古往今来那些有着抄袭倾向的“借鉴”时，怎样的行为应该受到舆论谴责，渐渐明朗。比如文学创作领域，早在17世纪，莎士比亚就曾经身陷“抄袭门”，其作品中的很多句子均与前人作品雷同。绝大多数的人默许了莎翁的“抄袭”，甚至坚定不移地将其奉为文坛巨匠，这是因为在他所处的时代，这样的借鉴有利于传播知识、惠及大众，而对原作者不构成实质性的伤害或者伤害几乎可以忽略不计。下列陈述符合作者观点的是:","o":[["A","句子雷同是判定是否为抄袭的重要标准"],["B","为传播知识的“借鉴”会得到读者赞同"],["C","时代局限使得抄袭行为不能被明确界定"],["D","在特定时代，对原作者造成实质侵害的抄袭才会被谴责"]],"a":["D"],"an":"文段先对抄袭从主观、客观两方面进行了界定，再由文学领域的莎士比亚曾深陷“抄袭门”一事，对特殊时代的特殊情况进行了分析，即只要借鉴有利于传播知识、惠及大众，而对原作者没有实质性的伤害，则抄袭可以不被追究与谴责。结合选项，D项表述正确。A项本身不符合文段一开始提出的主、客观两个标准，排除;B项“得到读者赞同”与“绝大多数的人默许了......这样的借鉴有利于传播知识、惠及大众”比较可知，“默许”和“赞同”程度不同，不可替换;C项由原文可知，抄袭是可以明确界定的，只是不同时代标准不同而已，对特殊时代的特殊情况，可以视情况而论。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0335","type":"single","t":"梅兰芳不像绝大多数因媒体包装而走红的明星那样瞬间就被人们忘却。他并不是因《一缕麻》、《牢狱鸳鸯》之类的新编剧目获得观众爱戴，而是由于在《贵妃醉酒》、《霸王别姬》、《汾河湾》这些传统戏的表演中，既恪守规矩，又能超越前人。虽因大众媒体的鼓动，经历过一段陈旧布新的喧嚣时光，终因回归传统风范而成为一代宗师。这段文字主要说明:","o":[["A","梅兰芳是20世纪上半叶中国的媒体英雄人物"],["B","梅兰芳的艺术之树长青，是因为他有深厚的传统艺术积淀"],["C","梅兰芳的成功之路，就是我国经济的成功之路"],["D","梅兰芳是如何成为京剧观众心目中最卓越的表演艺术家的"]],"a":["B"],"an":"根据提问“主要”一词知本题为中心理解题。材料首尾两句说的是梅兰芳被人们牢记、成为一代宗师，中间用“不是……而是”引出原因:既能恪守规矩，又能超越前人。因此材料主要阐述的是他成为宗师的原因。因此，结合选项应该选择B。A项是材料信息之一，但没抓住重点;C项“经济的成功之路”无中生有;D项说的是过程，而材料主要阐述的是原因。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0336","type":"single","t":"随着经济的不断发展和城市化的扩大，列岛之国有限的土地资源已经越来越不能满足日本人传统的独门独院住宅的奢望。特别是在东京这样的现代化大城市里，越来越多的高层居民楼拔地而起，占住宅总数的比例越来越大。这段话说明了这样一个观点:","o":[["A","日本人如今已不再奢望居住在独门独院。"],["B","东京的居民住宅中，高层居民楼已经取代了传统的独门独院。"],["C","经济发展和城市化扩大，使日本的土地资源越来越紧张。"],["D","日本是列岛之国，土地资源十分有限，必须发展高层建筑。"]],"a":["C"],"an":"据提问知此题为中心理解题。A项错误，表述有误，通过“......越来越不能满足日本人传统的独门独院住宅的奢望”可知;B项错误，表述过于绝对，通过“越来越多的高层居民楼拔地而起，占住宅总数的比例越来越大”可知B项“已经取代”可知;C项正确，文段首句为主旨句，C选项是对该主旨句的同义替换;D项错误，过度推断，通过首句“随着经济的不断发展和城市扩大......”可知，如果人口稀少，经济落后，即使土地资源有限，也不会发展高层建筑。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0337","type":"single","t":"一位年轻的母亲因幼儿园阿姨教自己的孩子认识英文字母而向法院起诉。这位母亲认为，当她画个圆圈，孩子可以说是月亮、是鸡蛋，而一旦教孩子这是字母“O”，想象的翅膀就被剪断了。结果，这位母亲胜诉。这段文字传递了什么样的信息:","o":[["A","孩子的想象力常被成人忽视"],["B","教育需要保护孩子们的想象力"],["C","教师应该遵循学生的思维规律"],["D","家长需要使用法律来保护孩子"]],"a":["B"],"an":"据提问知此题为中心理解题。题干为一则小故事,主要讲的是一位母亲因幼儿园阿姨的教育限制了孩子的想象力而向法院起诉的故事。由此可知，文段传递的信息是在教育的过程中要保护孩子的想象力。因此，结合选项应该选择B，因为B项表述最符合文意。A、C项在材料中并未提及;D项表述没有抓住材料的语意重点，因此排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0338","type":"single","t":"一个知名企业向社会招聘高级管理才，面试中有一道试题:请写出你原来所单位的最大秘密和对我公司有何价值?应聘者对此各陈己见，但最后被聘用的却是一对此题交白卷者。有人问及原因，老总回答道:“这样的人值得信任。”应聘者对其试卷交白卷却被聘用，这件说明了什么?对此理解最正确的一项是:","o":[["A","聪明地不做胜过了愚蠢地做"],["B","有创新精神才能出奇制胜"],["C","表现与众不同才能崭露头角"],["D","人格是成功的重要因素"]],"a":["D"],"an":"本题为中心理解题。D项正确，材料中招聘单位的问题是为了测试求职者对单位的忠诚度，由“这样的人值得信任”可知，材料着重表现的是对不出卖原公司的行为的赞美，是对人格的赞美。材料并非讲“创新”或“才能”。A、B、C均偏离题意，故不选。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0339","type":"single","t":"进入21世纪，中国的媒体事件频发，媒体对事件的关注程度和方式决定了公众的态度和事件的发展。人们所看到的已经不是事件本身，而是经过媒体把关后的媒体事件。随着网络的兴起，媒体事件更是集中地以网络事件的形式表现。在网络事件中，网民是网络舆论和网络监督主体。他们的触角遍布社会各个角落，时时处处监督着政府和官员的一举一动。下列说法与这段文字不符的是:","o":[["A","网络监督呈现出广泛性"],["B","网络对社会舆论有重大影响"],["C","媒体事件可能不是事件本身"],["D","网络监督比传统手段更有效率"]],"a":["D"],"an":"本题考查细节判断，且为选非题。最后一句指出网民作为网络监督者的特点无处不在，也从侧面说明网络监督的广泛性和普遍性，故A项符合文意;第三、四句也说明正是由于网络，才有了网络事件，正是由于网络，网民才能制造网络舆论，这必然会对社会舆论产生影响，故B项符合文意;第四、第二句说明如今的“媒体事件”和“事件本身”有所不同，故C项符合文意。文段首句点出“媒体事件频发”这一事实;第二句说明如今的“媒体事件”和“事件本身”有所不同;第三句指出媒体事件的表现形式;第四句则指出网民具有网络舆论制造者和网络监督者的双重身份;最后一句指出网民作为网络监督者的特点一无处不在。文段并没有对比网络监督和传统的监督手段，D项属无中生有。本题为选非题，故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0340","type":"single","t":"人类火星探索的步伐正在加快。欧洲的火星探测器ExoMars已于2016年3月14日从哈萨克斯坦的拜科努尔发射场发射，寻找火星过去或现在的生命迹象。中国也有望于2020年发射火星探测器，成为火星探索队伍中的又一支重要力量。对于这个神秘且遥远的星球，人类的求知欲已不仅停留在寻找生命迹象，而是超前到了对火星宜居环境的研究。近日，荷兰瓦赫宁根大学模拟月球和火星的土壤条件，成功进行蔬菜栽培实验，证明在外太空建立人类居住地并不是空想。这段文字主要介绍了:","o":[["A","新技术在火星探索中的作用"],["B","目前进行火星探索的主要力量"],["C","人类火星探索的主要进展"],["D","人类火星探索目的所发生的改变"]],"a":["C"],"an":"文段开篇指出“人类探索火星的步伐正在加快”，接着分别介绍了欧洲火星探测器寻找火星生命迹象、中国有望发射火星探测器、荷兰模拟火星和月球成功进行蔬菜栽培实验，据此可知整个文段都围绕人类对于火星探测的成果来展开,对应C项“主要进展”。A项“新技术”并非文段重点,文段重在讨论火星探索的主要成果,排除;B项“主要力量”与“目的所发生的改变”均出现在介绍中国探索成果的部分，表述片面，排除;D项“目的发生的改变”仅为文段中一个方面的意思，不是重点，排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0341","type":"single","t":"国际人才竞争远比物质资源争夺更为复杂，目前各国争夺人才的手段日渐多样化，但从根本来说，吸引并留住人才，依靠的不仅仅是薪酬待遇，更重要的是创造适合人才长远发展的基础和环境，以及优化相关基本政策体系。目前，各国都日益重视建立人才使用、评估、成长的开放环境，从过去注重人才使用的短期政策过渡到有利于人才长期发展的制度建设上来。关于这段文字，以下理解准确的是:","o":[["A","争夺人才已经成为各国政府一项十分重要的工作"],["B","提供优厚的薪酬待遇不再是吸引人才的重要手段"],["C","吸引和留住人才需要一系列的综合配套措施"],["D","人才的长远发展是各国人才政策的终极目标"]],"a":["C"],"an":"A项“争夺人才已经成为各国政府一项十分重要的工作”无中生有，文中讲的是各国“争夺人才的手段多样化”;B项“提供优厚的薪酬待遇不再是吸引人才的重要手段”曲解题意，文章没有讲薪酬不重要而是要多手段相结合;C项“一系列的综合配套措施”即文段提到的各种措施的同义替换;D项“人才的长远发展是各国人才政策的终极目标”,无中生有。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0342","type":"single","t":"“互联网+”,是一种科学地驾驭技术、利用技术基础上的提速、提质、提效。作为先进技术、先进工具的互联网，用于建设和发展是积极正面的，用于攻击和毁损是消极负面的。既要积极有效地使用互联网这一先进工具，推动经济社会发展，又要建立良好秩序，采取安全保护措施，防范由于破坏性运用所带来的被动和伤害。关于这段文字，以下理解正确的是()。","o":[["A","互联网有利于推动经济社会发展，是利大于弊的"],["B","互联网是一把双刃剑，“互联网+”就是对互联网辩证地趋利避害"],["C","“互联网+”的出现就是为了消除互联网的消极负面作用"],["D","互联网使得不少青年人沉溺其中，耽误了学业，是弊大于利的"]],"a":["B"],"an":"细节判断题，根据文段判断选项正误。根据文段可知，文段只是表明了互联网同时具有积极和消极的作用，并表明对策，即要积极有效地使用互联网，趋其利，避其害。故文段并没有对利弊进行对比，排除AD项。C项，可知除了消除互联网的负面作用外，还需积极有效地使用互联网，故表述过于绝对，排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0343","type":"single","t":"我和父亲感情极深,但直至他老人家临终我都没能说一句“爸爸我爱你”,不是不想说而是说不出口。我二十几岁时看西方电影，见外国人搂着老父亲说“爸爸我爱你”，心中感慨万分，就决心在儿子身上试验。当儿子可以交流的时候，我就和儿子深情地说:“儿子，爸爸爱你，你得说，我爱爸爸。”不懂事的儿子就此和我共同与传统的含蓄文化抗衡，天天上演国人觉得很肉麻的一幕。这是一场文化与制度博弈的试验。10年后，试验有了结果，儿子小学四年级的一天，我把他摁在床上深情地说:“儿子，爸爸爱你!”儿子毫不犹豫地对我说:“少来这一套!”这段文字最想说明的是:","o":[["A","我国传统文化中有含蓄表达的积习"],["B","父子之间的感情交流须契合传统文化"],["C","制度与作为社会背景的文化抗衡往往徒劳"],["D","东方的含蓄与西方的直白是一种文化差异"]],"a":["C"],"an":"根据原文中“这是一场文化与制度博弈的试验”一句可知，作者强行让儿子回馈直白的表述设置为一种“制度”，而我国传统的含蓄表达可谓是一种“文化”。博弈的结果是制度在文化大背景下彻底失败，可见作者通过这个故事想要说明的是制度与背景文化抗衡往往徒劳。A、D两项由作者与其父亲相处的故事体现，B项属于过度引申，均没有体现出作者想要表达的“制度与文化”的关系，故排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0344","type":"single","t":"看来，不只是贵族有偏见，平民也自有平民的偏见，这种偏见就是看不见每个人都应该享有人之为人的尊严和独自为人的权利。由于我们在这方面迷失太久，今天无论是尊重自己的权利,还是尊重他人的权利,都需要经过艰苦的学习。我们要早一天学会这些东西才好。只有先学会了尊重自己和尊重他人，我们才能开始学习有尊严的生活，我们才能尊严的生活在这片大地上。这段话主要支持的观点是:","o":[["A","尊重自己和尊重他人是自己获得尊严的前提"],["B","不论贵族或平民，都有得到别人尊重的权利"],["C","先尊重自己，还是先尊重他人，困扰着世人"],["D","当今很多人都不会尊重别人，只知索取尊重"]],"a":["A"],"an":"据提问可知此题属于中心理解题。文段前面叙述了贵族和平民都缺乏对个人和他人权利的尊重。最后一句关键词“只有……才”构成条件关系表达了主要观点,即尊重自己和尊重他人是自己获得尊严的前提，A正确。C项“困扰着世人”和D项“当年很多人”的表述在原文中并没有体现;B项，原文中说“贵族和平民”都存在偏见，都“看不见每个人应该有的尊严和权利”，宾语并非选项中的“得到别人尊重的权利”。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0345","type":"single","t":"尽管从国民经济总量的比重上看，农业所占的比重低于第二、第三产业，但对于一个农业人口占全国人口80%的发展中大国来说，无粮不稳。没有广大农民的普遍小康,没有农村经济的繁荣发展,整个国家发展进步的基础就会不稳,实现全面小康和高水平小康的战略目标就会成为无源之水、无本之木。农业和农村经济的发展，事关改革开放大局在这个根本问题上不能只算GDP贡献率一本账，更要算改革发展稳定全局这本大账。这段文字着重强调的内容是:","o":[["A","农业的基础地位"],["B","农村的经济发展"],["C","农民的生活质量"],["D","农村的社会稳定"]],"a":["A"],"an":"根据提问方式可以判断出本题为表面主旨题中心理解题。由转折关系词“但”可知，整个材料的语意重点是其后的内容。前面先说产业上的数据，转折后说明数据并不能代表一切，从农业人口、农村经济等方面说明农业在社会上的地位，整个文字既涉及农村经济又提到稳定，整段话是对农业基础地位的说明。因此，结合选项应该选择A。B、D项错误，材料中只是部分涉及，不是材料语意重点;C选项题干中并未涉及，予以排除。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0346","type":"single","t":"性格内向从本质上说是一种个性特征。它与害羞和具有孤僻的性格特征不同，与疾病无关。它也不是你能改变的事物。作者接下来最可能主要介绍的是:","o":[["A","性格外向的本质"],["B","如何改变性格内向"],["C","性格内向的危害"],["D","性格内向的特征"]],"a":["D"],"an":"本题考查接语选择考点的语句衔接。文段的主体词是“性格内向”，首先判定性格内向是一种个性特征。三个分句“与……不同”、“与……无关”、“也不是”均否定了既有的关于性格内向是什么的描述，接下来就应该提出作者自己的观点性格内向的个性特征究竟是什么?因此，结合选项应该选择D。A项“性格外向”与题目主题词不符，故排除;B项与题目说“也不是你能改变的”相矛盾，故排除;C项“危害”题目中并未涉及。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0347","type":"single","t":"风是地球上空的传送带，它将大陆的沙尘吹向海洋，又将海洋的水汽吹向大陆，沙尘和水汽相遇，便能结合为云，最终化作降水。可见，沙尘不仅在土壤的分布和补充上扮演着重要的角色，而且在全球的水循环上也扮演着重要角色。可以说，沙尘也是决定全球生态平衡的因子。对“沙尘也是决定全球生态平衡的因子”这句话理解错误的是()。","o":[["A","沙尘这种天气现象古已有之，它在地球生态平衡中起着一定的作用"],["B","沙尘逐渐积聚形成沙尘暴，在全球范围内起了保持生态平衡的作用"],["C","沙尘含有碱性，能使大气中的酸性物质得到平衡，从而减缓酸雨的发生"],["D","沙尘不仅在土壤的分布和补充上，而且在全球水循环上扮演着重要角色"]],"a":["B"],"an":"此题是词句理解题。利用排除法可以直接找到答案。文段都是围绕“沙尘是决定生态平衡的因子”展开，但是没有提到“沙尘暴”对生态平衡的作用。B选项混淆了“沙尘”和“沙尘暴”的概念，是错误的。A、C、D三个选项可以通过分析文段得出。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0348","type":"single","t":"常常被感动而充满激情的人是有福的。我或许属于其中之一。故我想，感动是由于我们深爱着世上一切美好的事物，甚至比别人更留意也更钟情于它们。而这些美好的事物也仿佛是我的朋友和亲人，也同样爱着、留意着、钟情着我。每次小小的感动都会洗净我灵魂中某个小小的斑点和污渍,每一次深深的感动都有可能斩断我性情中某一段深深的劣根。日复一日，年复一年，感动使我们的内心变得清洁、明亮、丰富而又宽敞，使我们对每一轮崭新的日出都能赢得一个全新的自我。这段文字主要告诉我们:","o":[["A","人应该有不断完善自我的意识"],["B","充满爱的人才有可能获得幸福"],["C","人应该对美好事物充满感情"],["D","提升人格境界需要持之以恒"]],"a":["C"],"an":"A项:“自我完善”文段中并无涉及;B项:表意过宽，文段论及的不是广义上的充满爱，而更多的是对美好事物怀揣一份爱意;C项:文段首先提出观点，自己就属于被感动而充满激情的有福之人，而通过“故”引出作者结论“感动是由于我深爱世上一切美好的事物,甚至比别人更留意更钟情于它们”。后文则是论述这些感动给我带来的好处。既然感动会给人带来如此多裨益,文段中也告诉了人们应该学会对美好事物充满作者所持有的“留意钟情”,因此C项符合文意;D项:主要论及坚持的重要性，但文段中并未涉及。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0349","type":"single","t":"无论导演还是监制,都是非常复杂的工种,经验的积累非常重要。没有经历过片场的摸爬滚打，在现场的执行能力就会有问题。因此，在一些电影产业成熟的国家，新人从学校毕业之后，要先在制片厂当学徒，从写剧本开始，再经过副导演、执行导演等环节，在各方面技能掌握齐全之后，最终成长为一名合格的导演，此后再“导而优则监”。下列哪句话最能概括这段文字所包含的道理?","o":[["A","纸上得来终觉浅，绝知此事要躬行"],["B","书山有路勤为径，学海无涯苦作舟"],["C","天才是1%的天赋加99%的努力"],["D","不想当将军的士兵不是好士兵"]],"a":["A"],"an":"文段为因果结构，作者首先强调经验积累对于导演、监制的重要性，接着以“因此”点出结论，即在电影业成熟的国家，要成为导演和监制需要在校园学习完理论后，积累一系列在基层锻炼和实践的经验。A项“纸上得来终觉浅，绝知此事要躬行”意为从书本上得到的知识毕竟比较肤浅，要透彻地认识事物还必须亲自实践，符合文意，当选。B、C两项均强调刻苦学习，D项强调树立远大志向的意义，与文段无关，排除。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0350","type":"single","t":"在一个环境和经济都面临挑战的高度技术化的时代，提高我们的理解能力和辨析科学证据与科学观点的能力至关重要。而要想做到这一点，出路之一就是需要来自自然科学和人文社会科学不同领域的专业人士的鼎力合作。比如，对于像地球气候变化这类复杂的问题，需要科学家去挖掘并阐述其根本原因，但与此同时，人文科学与社会科学工作者也同样需要去评估气候变化之于人口与社会的影响，而新闻工作者则需要把这类信息完整地传递给社会大众，在他们的共同努力下，才能把科学的新发现及其与社会相关的联系向社会大众解释得更好更清楚。这段文字意在强调:","o":[["A","不同领域专家分工协作的方式"],["B","不同领域专家分工协作的目的"],["C","提高公众理解科学能力的途径"],["D","提高大众理解科学能力的意义"]],"a":["C"],"an":"本题考查中心理解。材料首句说到提高我们的理解能力和辨析科学证据与科学观点的能力至关重要”，接下来指出，如果“想做到这一点，出路之一就是……”即给出了对策，之后又进一步举例来说明这一对策的具体情况，因此材料强调的是提高公众理解科学的方法、途径。因此，结合选项应该选择C。A项只是举例子中具体描述的内容,不是重点;B项对应的是文段最后一句话,“才能把科学的新发现……”即目的，也属于例子当中的信息，没有抓住重点;D项错误，材料强调的是提高理解科学能力的方法、途径，而不是意义，并没有讲到意义。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0351","type":"single","t":"这些年来我们一直在说“大学教育高中化，研究生教育本科化”，如今的研究生教育,比本科耗费了更多的时间和成本,但在教育成效上,可能连社会实践教育都不如。在一些学校,由于研究生规模膨胀,一个导师甚至要带上几十个上百个研究生,导师制形同虚设。这种情况下,要做到一对一的认真指导,除非导师们打通了“任督二脉”,否则恐怕要么就只有在教育上敷衍学生,要么就只能高抬贵手,让学生们蜂拥着通往毕业的闸门。“这种情况”是指:","o":[["A","研究生教育比本科教育耗费更多的时间和成本"],["B","“大学教育高中化，研究生教育本科化”"],["C","如今的研究生教育,可能连社会实践教育都不如"],["D","一个导师甚至要带上几十个上百个研究生"]],"a":["D"],"an":"这种情况为指代词,前文描述的是现在教育大环境下,导师带几十个上百个研究生的教育现状,在这种情况下很难做到“一对一”的认真指导。所以“这种情况”即是D选项所要表达的“一个导师甚至要带上几十个上百个研究生”。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0352","type":"single","t":"不久前，在美国丹佛市举行的国际癌专家会议上，医学家宣布:他们经过临床试验发现,普通的感冒病毒可以杀死癌细胞。有多名自愿接受试验的癌症患者在接受这项治疗后,身上的癌细胞都呈萎缩状。专家们指出,要运用基因工程的办法研究出能引起感冒的腺病毒有机体,让含有易变基因的癌细胞染上感冒。而这项新技术,估计每年可望挽救10万个癌症病人的生命。上面文字传达的最重要的一条信息是:","o":[["A","目前,正在开展的用感冒病毒治疗癌症的试验取得可喜的成果"],["B","目前，癌细胞在感冒病毒作用下萎缩这一事实引起医学界重视"],["C","今后，将日益广泛地推广用感冒病毒治疗癌症这一新方法"],["D","今后，要攻克运用基因工程让癌细胞染上感冒的新技术"]],"a":["D"],"an":"文段首先介绍了“感冒病毒可以杀死癌细胞”的临床试验结果，随后运用癌症患者的治疗结果证明了这项治疗工程的可行性，然后提出“要运用基因工程的方法让癌细胞染上感冒”，为文段重点。故文字最重要的信息就是“要运用这一项新技术”，即“运用基因工程的方法让癌细胞染上感冒”。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0353","type":"single","t":"没有人再怀疑人类已经进入信息时代。在这样史无前例的成就中，新的危机却悄悄萌发了。美国思想家梭罗曾说过:“我们热切地挖掘了大西洋隧道。期望新旧大陆更为密切地接近，实际上传来的最新消息不过是阿德莱亲王打了个哈欠。“危险正是在这里。这段文字中所说的“危险”是指:","o":[["A","信息太多，传播太快，为造成人们预想不到的危机"],["B","信息过剩回降低信息的质量，影响双方密切的接近"],["C","信息的快速传播，使人们无法判断某些信息之间的本质区别"],["D","剩余信息的快速传播，将可能湮没没真正有价值的信息"]],"a":["C"],"an":"据提问知此题考查词语理解题。本题的关键在于理解梭罗的话，而其中“阿德莱亲王的哈欠”正是一种无用信息，实际上梭罗话的意思是，人类发掘了大西洋隧道，希望获取的是重要信息，但过来的是无用信息，他的言下之意是信息没有甄别，所以“危险”就是人类无法判别信息之间的区别。因此，结合选项应该选择C。A项只是从表面上解释“危险”;B、D两项在题干中没有体现。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0354","type":"single","t":"在生活中出现摩擦、不快和委屈是常有的事，我们不能以针尖对麦芒，因为怨恨就像是一只气球，越吹越大，最后膨胀到无法控制的地步。要消除怨恨，我们应该不念旧恶，不计新怨，_。","o":[["A","退一步海阔天空"],["B","得饶人处且饶人"],["C","偷得浮生半日闲"],["D","直挂云帆济沧海"]],"a":["B"],"an":"本题考查语句填空。材料强调的是对待“摩擦、不快和委屈”等事的态度。“退一步海阔天空”是说以宽容的态度对人对事，强调退让;“得饶人处且饶人”指要宽容、体谅别人，尽量宽恕别人，强调胸襟。因此，结合选项应该选择B。C项“偷得浮生半日闲”是说难得有个休息的机会;D项“直挂云帆济沧海”是说挂起直入云霄的风帆，乘风破浪纵横驰骋于沧海之中，常用来抒发自己意气风发的感情;C、D项显然与题干语意不合，因此排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0355","type":"single","t":"库兹涅茨的倒U曲线理论认为:“在经济增长的初期阶段，尽管人们的收入都不减少，但社会收入分配却变得不平等;随着经济的继续增长，收入分配不平等的程度逐渐减轻;经济增长达到更高水平以后，收入分配又变得平等。”这种理论假说在一定程度上符合西方发达国家经济增长的历史实际，但他又指出，重复发达国家以往的模式，以为收入不平等促进了经济增长，欠发达国家强化当前的收入不平等就是必要的，这是一种“危险的类比”。在西方经济发展实践中，解决公平问题不是搞自然而然的过渡，而是通过政府和社会的积极干预，消除工业化和城市化带来的不利影响，提高广大人民群众收入在国家不断增长的收入中所占的比例，对高收入者形成法律和政治压力，从而使得社会收入分配转向公正。下列说法与这段文字最相符的一项是","o":[["A","经济总量增长不会自发地促进社会收入公平分配"],["B","国家通过宏观调控可以有效监督和保证社会公平"],["C","发达国家的收入分配模式是遵循效率优先原则的"],["D","倒U曲线理论不适于欠发达国家的经济增长模式"]],"a":["B"],"an":"此题为典型的细节主旨化题目。文段首先介绍库兹涅茨的倒U曲线理论，随后他又指出欠发达国家容易将此理论理解扭曲，较为危险。尾句提出正确的方向，即公平问题不能靠自然而然的过渡，而是需要政府和社会的积极参与方可实现。结合选项可知，B项为文段观点的同义表述。A项中“经济总量”这一概念在文段中无从体现;C项中的“效率优先原则”无中生有;D项表述过于绝对，文段并非强调倒U曲线理论不适于欠发达国家，而是提醒欠发达国家要正确理解并使用这一理论。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0356","type":"single","t":"文学最基本的特征是对自由心灵的表达，是伟大思想与丰富想象力的结合。而“网络文学”的特质正是“表达的高度自由”、强烈的“个性化”和非功利性。网络作家在现实生活中有着各种各样的身份与职业，而且绝大多数与文学无关，他们的知识结构与身份背景千差万别，他们的创作也因此有着别样的风情与广阔的视野。网络文学往往以颠覆经典文本的面貌出现，在写作中以轻松、嘲讽的气氛取胜，与传统文学正儿八经的叙事、抒情相比，神与貌皆相去甚远。这就要求我们以全新认知面对这一文学形态。有学者提出，网络文学最鲜明的特征是“写作”与“生存”的共生状态，这与目前主流文坛的写作方式有很大不同，他们是“在生存中写作”，而职业性作家文学则在很大的意义上是“在写作中生存”。下面叙述中，不属于网络文学特征的是:","o":[["A","具有“表达的高度自由”、强烈的“个性化”和非功利性"],["B","网络作家有着与文学无关的身份与职业，因而创作有着别样的风情与广阔的视野"],["C","以颠覆经典文本的面貌出现，在写作中以轻松、嘲讽的气氛取胜"],["D","“写作”与“生存”的共生状态，作家是“在生存中写作”"]],"a":["B"],"an":"本题考查细节判断。跟据文中“网络作家在现实生活中有着各种各样的身份与职业，而且绝大多数与文学无关”，由“绝大多数”可知，“网络作家有着与文学无关的身份与职业”的说法过于绝对，B项说法错误。因此，结合选项应该选择B。A项说法正确,由“‘网络文学’的特质正是‘表达的高度自由’、强烈的‘个性化’和非功利性”可以推断得出;C项说法正确，由“网络文学往往以颠覆经典文本的面貌出现，在写作中以轻松嘲讽的气氛取胜”可以推断得出;D项说法正确，由文段最后一句话可以推断得出。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0357","type":"single","t":"中国与西方的认识方式、思维逻辑乃至整体的文化观念，存在这样那样的差异。比如，西方式的执着，可能推衍出渐进的认识，强调主体与客体的关系，强调对象描述的精确性;中国式的洒落，则通向了圆融和体悟，描述对象时往往在清晰中又带有某种模糊。但二者并没有孰优孰劣，孰是孰非，只有因“差异”发生的对话与启迪、互补与和谐。通过“差异”而达到“中和”，这样的“和而不同”才能成全一个相生共融、丰富多彩的世界。对这段话的理解不正确的是()。","o":[["A","西方注重对象描述的精确性,中国则倾向于清晰性和模糊性共存"],["B","中西方的“差异”是对立的，不相互调和，二者都难以为继"],["C","文化观念有差异，但没有优劣是非的区别"],["D","成全一个相生共融、丰富多彩的世界，是启发两种文化对话的目的"]],"a":["B"],"an":"据提问可知此题属于细节判断题。文章后半句“但”这个转折词点明作者的态度“差异没有孰优孰劣”，应当追求“和而不同”。据此分析选项B明显错误,中西方文化差异不是“对立”的,“对立”就无法“中和”了。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0358","type":"single","t":"大凡受过教育的中国人尽管可能听不懂彼此的方言，却能阅读同样的书籍.....如果他们使用的是字母文字，中国恐怕早就分裂成像意大利、法国、葡萄牙那样的许多国家了。这说明:","o":[["A","欧洲分裂成许多小国家的主要原因是使用字母文字"],["B","中国汉字既实用又具有艺术性"],["C","统一文字有利于多民族国家的形成和发展"],["D","字母文字只有艺术性没有实用性"]],"a":["C"],"an":"根据提问知本题为中心理解题。从“如果他们使用的是字母文字……就分裂成像意大利……”可以得知，字母文字不利于多民族国家的形成和发展，而统一的文字却可以对其起到促进作用。由材料可知，使用字母文字是欧洲分裂成许多小国家的原因之一，A选项增加“主要”，改变了原文的意思;B、D选项的“艺术性”材料并未提及。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0359","type":"single","t":"当前，信息技术、视听手段的空前发展，改变着人们的生活方式。可以说，这是发明蒸汽机和电力以来，最伟大的科学进步。不少人认为，电视，电脑提供的画面与音响，已足够提供人类所需要的信息与知识，超过了文字的功能。于是他们片面地认为，人类进入了所谓的“读图时代”。这段文字意在说明:","o":[["A","传统文字的价值依然存在，并不会被图像信息完全替代"],["B","对于信息与知识的主要来源,很多人存在错误的看法"],["C","影像所提供的信息含量并不比文字负载的信息少"],["D","信息技术的影响力在当前社会是非常重大的"]],"a":["A"],"an":"文段由信息技术、视听手段的发展引出“不少人”的观点，即当前电视、电脑所提供的画面信息与知识,已经超过了文字的功能,于是人类进入了所谓的“读图时代”。由“片面地”、“所谓的”可以明确地看出作者的倾向性,即他不认同“不少人”的观点,而是认为文字是不会被图像代替的。A项为作者观点的同义表述。B项“错误的看法”表述不够明确;C、D两项并不是文段的重点。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0360","type":"single","t":"①无论从事什么职业，处于什么岗位②思维能力在人的成功过程中起着举足轻重的作用③著名科学家霍金说过:有一个聪明的大脑，你会比别人更接近成功④没有思维活动的参与,人类的任何发明创造都是根本不可能完成的⑤都是快速走向成功的有利资本⑥拥有较高的智商、活跃的思维上述句子按语序排列组合，最连贯的一项是:","o":[["A","②①⑥⑤④③"],["B","②⑥①⑤③④"],["C","③②④①⑥⑤"],["D","③④⑥①⑤②"]],"a":["C"],"an":"此题考查语句的排序。应从观察选项入手。首先观察首句，可知②③为首句，两句中③是引用，②为观点，一般情况下引用放在句首，暂时排除A、B两项;再看②与④，很明显这两句都是在说“思维”的问题，两句应该是连接在一起的。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0361","type":"single","t":"在当今国际体系中，民族国家不再是唯一的国际行为体，需要塑造新的认同，而非倡导什么温和、理性和开放的“新民族主义”，而应该超越民族主义本身。在当今以主权国家而非民族国家为国际社会的基本单元时，应该以爱国主义代替民族主义，为国家自豪，为未来鼓舞。这段文字的观点是:","o":[["A","国际体系中的民族国家越来越多"],["B","爱国主义是对民族主义的一种超越"],["C","主权国家在国际社会中取代民族国家"],["D","国际体系应该向温和、理性和开放的方向发展"]],"a":["B"],"an":"通读文段，首先阐述背景，提出观点:应超越民族主义本身;随后重申观点，在“当今主权国家为基本单位”的大背景下:应以爱国主义代替民族主义，此句为文段核心观点，B项“爱国主义是对民族主义的一种超越”为核心观点的同义替换。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0362","type":"single","t":"①他们保存历史的唯一办法是将历史当作传说讲述,由讲述人一代接一代地将史实描述为传奇故事口传下来②但是，没有人能把他们当时做的事情记载下来③这些传说是很有用的,因为它们能告诉我们以往人们迁居的情况④我们从书籍中可以读到5000年前近东发生的事情，那里的人最早学会了写字⑤但直到现在，世界上仍然有些地方，人们还不会书写将以上5个句子重新排列，语序正确的是:","o":[["A","①③②④⑤"],["B","④①③②⑤"],["C","④⑤①③②"],["D","①②③④⑤"]],"a":["C"],"an":"此题考查语句理解排序。观察选项布局,首句为①或④,①中含有代词“他们”,根据代词通常不出现在首句的原则,排除A、D两项;比较B、C两项,④、①前后矛盾,④提到“那里的人学会写字”,①的内容是“保存历史的方法,是讲述”,④、①不能衔接,因此排除B项;④提到“那里的人学会写字”,而⑤由转折词“但”引出“有些地方人们还不会书写”,④⑤话题衔接紧密。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0363","type":"single","t":"文化多样性是客观存在。它涉及以下基本认同:每种文明和文化都是在特定的地理环境和特定的人群中产生和发展的。尊重多样性,就是尊重文化的异质性。文明和文化有发展先后之差别,却无优劣高下的区分,它们都应获得同等的尊重和人类共同的保护。不符合上述文段文意得是:","o":[["A","文化多样性是客观存在。"],["B","文明和文化都有特定的发展背景。"],["C","文明和文化有发展先后之差别。"],["D","文化才有异质性,文明没有。"]],"a":["D"],"an":"本题考查文章中细节的判断。从文中第二句话可以推出，文明也具有异质性。所以D错误。A、B、C均是文中的原句，也可以采用排除法。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0364","type":"single","t":"婚姻，就是为了和一个人相濡以沫，共度今生，任何以钱财为目的的爱情和婚姻，都是不正确的。诚然，爱情也是要有块地方来承载的，而婚姻显然也要有个房子来遮风挡雨的,尤其是作为家庭最大财富的房子,还在不断增值的情况下。但是,现在不少人总是抱着某种目的去找对象，而忽视了感情本身。毕竟，婚姻的目的不是为了结束单身生活，而是为了创造一个属于自己的家庭，享受承担责任、被人需要的快乐。下列最适合做这段文字标题的是:","o":[["A","蜗居年代:寻找婚姻的避风港"],["B","裸婚时代:我们拿什么去结婚"],["C","悲剧:今天结婚，明天就离婚"],["D","婚姻:算房产账，更算感情账"]],"a":["D"],"an":"通过阅读文段得知，文段包含两个重要的主题词，即房子和感情。作者对于此二者的态度是婚姻显然需要有个房子来遮风挡雨，但不可因此而忽视了感情本身，D项中“更”字体现了作者的态度观点。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0365","type":"single","t":"前来巴塞罗那“朝圣”的年轻学生终年不绝，他们与其说为凭吊中世纪名胜而来，不如说是被安东尼·高迪这位现代主义大师的作品所吸引。毕加索虽说出生于马加尔，但在巴塞罗那的阿吉拉宫，你可以观赏到他从8岁起按年代陈列的琳琅满目的作品。达利早年狂热地迷恋海洋，一生大部分时间在有着白色粉墙的渔村里度过，但他超现实主义的天才之作却珍藏在这个艺术的圣地他的诞生与安息之地。这段话主要支持了这样一种观点，即:","o":[["A","现代主义的作品吸引了年轻的艺术家"],["B","巴塞罗那是一个绘画艺术的圣殿"],["C","画家的作品不一定保存在他的出生地"],["D","年轻学生朝圣巴塞罗那不是为了凭吊中世纪名胜"]],"a":["B"],"an":"据提问可知此题是中心理解题。文段为分一分结构，根据文段表述，可知安东尼·高迪这位现代主义大师的作品在巴萨罗那;毕加索从八岁开始的画作也在巴塞罗那;达利的天才之作也在巴塞罗那。故文段所表达的主题即为诸多大师的画作都在巴塞罗那，即巴塞罗那是一个绘画艺术的殿堂，B选项正确。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0366","type":"single","t":"财产安全一直是人们忧虑的一个问题，如果人们无法保障其个人财产的安全，就不可能有积极性去创造财富，即使创造财富，也会转移。个人财产的安全，既体现在保有环节，也体现在交易环节。为避免交易风险，需要通过国家机关的登记行为来确认其物权状态，从而保障其真实性，登记行为本身是以国家信用做担保的，而国家信用的背后又是法律信用。这段文字的关键词是:","o":[["A","交易风险物权登记法律信用"],["B","财产安全交易环节国家信用"],["C","财产安全物权登记国家信用"],["D","物权登记国家担保法律信用"]],"a":["C"],"an":"本题为中心理解题。“财产安全”是整个文段的主语和话题,“如果......就不可能......”用反面论证说明财产安全为何是人们忧虑的问题，“需要”对策引导词后面是重点，即“物权登记”。文段可以分为两个层次，第一层次不断强调的是财产安全的重要性，关键词为“财产安全”，排除A、D两项。第二层次是如何保证财产安全、避免交易风险而采取的措施，即“通过国家机关的登记行为来确认其物权状态”物权登记,排除B项。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0367","type":"single","t":"法律应尊重并保障媒体的监督权利。但作为媒体,必须依法行使监督权。在监督过程中出现失误或者过错，甚至给被监督对象造成损失，则必须勇于承担责任。这段文字的主旨是:","o":[["A","媒体须依法监督并承担相应责任"],["B","媒体行使监督权时要做到有法可依"],["C","法律保障媒体权利的同时也要对其进行监督"],["D","媒体出现失误或过错时责任应由其自身承担"]],"a":["A"],"an":"此题为中心理解题。根据转折关系词“但”可知，整个材料的语意重点是其后的内容，即媒体必须依法行使监督权，并且在出现失误时要勇于承担责任。因此，结合选项应该选择A，因为A项表述最符合文意。B、D项表述过于片面，未能准确概括文意;C项错误，题干中没有提到法律要对媒体权利进行监督。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0368","type":"single","t":"在漫长的进化过程中，食物匮乏一直是人类面临的首要威胁。由于食物供应的不确定性和食物不能长期保留，人类一直过着饱一顿、饿几顿的生活，能够最大限度有效利用食物的个体具有生存优势。在经历了反复的饥荒选择后，具有生存优势的个体和他们体内的基因,就会通过自然选择的方式被保留下来。这些基因能在饱餐一顿后刺激胰岛素大量分泌，从而最大限度地转化利用血液中的葡萄糖。虽然这样做的代价是可能导致肥胖，但它对肌体的危害所造成的生存威胁,却直到中年后才会表现出来,而在人类历史的绝大部分时间里，人的平均寿命不到30岁。这段文字意在说明:","o":[["A","古人的生存环境与现代人完全不同"],["B","人类的生理结构是自然选择的结果"],["C","食物匮乏是人类长期应对的首要问题"],["D","肥胖与人类生存繁衍的优势基因相关"]],"a":["D"],"an":"文段前四句阐述了人类优势基因通过自然选择被保留下来以及如何发挥作用，最后一句引出主旨，解释了前文所述的优势基因与肥胖之间的关系和没有被淘汰的原因。因此，结合选项应该选择D项。D项最为准确地复述了这一主旨。A、B两项属无中生有。C项根据文段首句可得出,但不是重点,故排除。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0369","type":"single","t":"“据理力争”不是最佳的表达方式，太用力，太急切地想说明道理，反而少了从容淡定。它反映出“力争”者的不够自信，也表明他对听众辨别事理能力的低估。以下与作者表述的观点最接近的是:","o":[["A","有理不在声高"],["B","公道自在人心"],["C","此时无声胜有声"],["D","针尖不必对麦芒"]],"a":["A"],"an":"文段为“观点+解释说明”结构，首句提出观点“据理力争”不是最佳的表达方式，缺少从容淡定。后文为解释说明部分，文段首句为中心句，结合选项可知A项的观点最相近，所以A项正确。B项“公道自在人心”指公正的道理自然存在于众人的心里，指群众对事情的是非曲直知道的清楚明白。不是作者想强调的观点;C项“此时无声胜有声”，指默默无声却比有声更感人。(有时候不说话比说话更有用)，文段并不是“无声”，而是声音大小;D项“针尖不必对麦芒”比喻双方不必针锋相对。不符合文意。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0370","type":"single","t":"当前，对于大部分消费者来说，智能化家居产品既熟悉又陌生，很多人的概念还停留在电动窗帘或别墅防盗系统。从技术层面来说，一键控制、远程遥控、感应人体、自动开启这些电影里才出现的产品如今并非“高科技”，但由于价格昂贵等原因，智能家居并未普及。根据这段文字，以下说法正确的是:","o":[["A","智能化已成为家居业未来的发展方向"],["B","目前技术上实现智能家居已无屏障"],["C","普及智能家居必须降低生产成本"],["D","智能家居的概念模糊影响其普及程度"]],"a":["B"],"an":"文段首句通过“当前”交代背景，接下来从技术层面进行论述，通过“如今并非‘高科技’”可知，目前在技术上可以实现智能家居，对应B项。A项“已成为未来的发展方向”与文段信息“并未普及”矛盾，排除。C项“生产成本”无中生有，文段尾句提到的是“由于价格昂贵等原因”，“价格昂贵”和“生产成本”不是一个概念，排除。D项“概念模糊”与文段不符，首句是说很多人对于智能家居的概念滞后而非模糊，且尾句提到并未普及的原因是由于价格昂贵而非概念问题，排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0371","type":"single","t":"现代经济以金融为核心，信贷一定程度上就是“信心”的代名词。货币信贷快速增长，有利于打掉通缩预期，提振市场信心，防止陷入通货紧缩与经济下行相互加强的恶性循环。目前，一些项目虽有政府信用为依托，但银行对地方政府未来的可支配财力、隐性负债等往往难以获得及时、全面、准确的信息，一旦地方财政出现困难，无疑将影响银行的信贷资产质量。从这段话我们可以了解，货币信贷要注重()。","o":[["A","适度增长"],["B","优化结构"],["C","防范风险"],["D","防止通胀"]],"a":["C"],"an":"此题属于细节判断题。文段关键转折出现在“但银行对地方政府未来的......”，之前肯定了信贷有利于提振市场信心，后面转而叙述银行难以及时获得政府信息从而影响信贷资产质量,这就说明银行业务是有潜在风险的，应该引起注意。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0372","type":"single","t":"黄种人倾斜的凤眼可能与亚洲中部地区多风沙有关,因为这种结构可以保护眼睛。就像白种人的头发呈亚麻色,还有点透明,这样容易使头皮吸收太阳光的热量,从而适应高纬度地区的严寒;黑人的头发更黑更卷，则有利于阻隔太阳光带来的热量，保护大脑。这段文字谈论的是:","o":[["A","各色人种的外表特征"],["B","各色人种外表特征之间的差异"],["C","人类的长相保护着人类自己"],["D","人类的外表特征是人类适应自然环境的产物"]],"a":["D"],"an":"据提问可知此题是中心理解题。D项正确，题干谈了黄种人的眼睛、白种人的头发、黑种人的头发与自然环境的关系，即人类的外表特征是人类适应自然环境的产物。A项错误，各色人种的外表特征只是文段中的一部分;B项错误，各色人种外表特征差异并不是重点;C项错误，属于干扰项，虽然能看出人的长相保护着人类自身，但也不是文段强调的重点。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0373","type":"single","t":"①经过漫长冬季，茶树养分充分积累，初春气温低，茶树生长速度缓慢，不需要施农药，芽质比较好②“明前茶”的声誉，正是来自于它的品质和稀有③作为茶叶主要品质标准的茶氨基酸含量最高，含苦涩味的茶多酚则相对较低④在江南茶叶产区，早发品种往往在惊蛰和春分开始萌芽，清明前可以采摘⑤清明前江南一带普遍较低的气温又限制了茶树叶芽的数量,使得能达到采摘标准的茶叶产量很少⑥中国各地农业生产一向以节气为农事安排的指导，茶叶也不例外将以上6个句子重新排列，语序正确的是:","o":[["A","③②⑥④⑤①"],["B","⑥④①③⑤②"],["C","⑥④②⑤①③"],["D","④⑤⑥①③②"]],"a":["B"],"an":"首先观察选项，对比首句，⑥句引出文段重点讨论的概念茶叶,③句具体讲茶叶的品质，④句以江南茶叶产区为例进行详细说明采摘时间，故对比而言，⑥句更适合做文段首句，③句和④句是具体解释说明茶叶的情况，不适合做首句，排除A项和D项。再观察可知，②句分别提出两个概念“品质”和“稀有”，故后文应该先讲“品质”后讲“稀有”，①③两句在讲“品质”，⑤句在讲“稀有”，故①③句应在⑤句之前，排除C项。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0374","type":"single","t":"英国新经济基金会对世界178个国家的调查表明，新兴国家如中国，人们的幸福感反而要高于日、韩，更高于美国，当然，据荷兰伊拉斯谟大学和美国密歇根大学社会研究所的调查，自1995年的短暂上升后，中国人的幸福感也开始下滑。全球范围内的人们开始体认到这样一个事实，经济的增长并不等同于发展，因为后者还包含生态休闲、社会福利与公平正义等一系列指标;幸福也不仅指感官的快乐,因为它还关乎人对生命意义的积极体验和整体评价。根据这段文字，以下说法正确的是:","o":[["A","新兴国家对幸福感有着不同的理解"],["B","幸福既包含感官的快乐又与人对生命意义的认识有关"],["C","文化背景对国民幸福观的形成有重要的影响"],["D","幸福感与经济增长有密切的关系"]],"a":["B"],"an":"本题属于细节判断题，通读文段一一对应选项。B项是对文段最后一句话的同义概括，正确。A项“新兴国家对幸福感有着不同的理解”在原文中并未涉及，并且文段中说新兴国家的经济上涨后幸福感也有所降低，可见新兴国家对幸福感的理解不一定有不同，排除;C项中的“文化背景”原文中并未涉及，排除;D项“幸福感”和“经济增长”密切联系属于过度推断，文中并未说关系密切，排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0375","type":"single","t":"中国近代人物都比较复杂，它的意识形态方面的代表更是如此。社会解体的迅速，政治斗争的剧烈，新旧观念的交错，使人们思想经常处在动荡、变化和不平衡的状态中。先进者已接受或迈向社会主义思想，落后者仍抱住“子曰诗云”、“正心诚意”不放。同一人物，思想或行为的这一部分已经很开通很进步了，另一方面或另一部分却很保守很落后。政治思想是先进的，世界观可能仍是唯心主义;文艺学术观点可能是资产阶级的，而政治主张却依旧是封建主义。如此等等，不一而足，构成了中国近代思想一幅极为错杂矛盾的图景。这段话支持了这样一个观点:","o":[["A","中国近代思想总体上还没有现代思想元素。"],["B","中国近代人物或者是保守落后的,或者是开放进步的。"],["C","中国近代思想的发展是错综复杂、充满矛盾的。"],["D","中国近代思想的复杂性源于西方列强的侵略与经济发展的落后。"]],"a":["C"],"an":"据提问知此题为态度理解题。A项错误，由文段“先进者已接受或迈向社会主义思想”可知，中国近代思想中存在现代思想元素;B项错误,由文段“中国的近代人物中,有些人的思想和行为既存在开通进步的方面,又存在保守落后的方面”可知;C项正确，是对原文“构成了中国近代思想一幅极为错杂矛盾的图景”的原意复述;D项错误，文段未提及该项表述的内容。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0376","type":"single","t":"从发展趋势来看，淡化GDP(国内生产总值)增长目标是大势所趋，因为片面过度追求这一个指标，不足以满足人民群众对青山绿水、放心食品、良好教育、便捷出行、健康工作、安享晚年等美好生活方面更高水平的期待与向往。这段文字主要谈论的是:","o":[["A","片面追求GDP指标的不当之处"],["B","淡化GDP增长目标后的发展趋势"],["C","人民群众对美好生活的期待与向往"],["D","淡化GDP增长目标这一趋势出现的原因"]],"a":["D"],"an":"本题为中心理解题。文段结构非常清晰，首句提出淡化GDP增长目标是大势所趋，随后以“因为”为标志，详细阐述这一趋势出现的原因，故正确答案为D。A项为原因内容，非文段重点。B项为无中生有。C项亦在原因解释中，非文段重点。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0377","type":"single","t":"写作事实上不但是为了向外发表，贡献社会，同时也是研究工作的最后阶段，而且是最重要、最严肃的阶段。不形成文章，根本就没有完成研究工作，学问也没有成熟。常有人说:“某人学问极好，可惜不写作”，事实上，此话大有问题。某人可能学识丰富，也有见解，但不写作为文，他的学问就只停留在简单看法的阶段，没有经过严肃的思考与整理，就不可能真正是系统的、成熟的。这段文字主要强调了","o":[["A","论文写作的重要性"],["B","科学研究的首要目的"],["C","研究工作的评价标准"],["D","知识与实践的内在联系"]],"a":["A"],"an":"作者首先点出写作的意义不仅在于发表和贡献，也是科研工作中最重要的环节;接着作者反驳了一些人的观点，认为没有写作的学问是不成系统的，不成熟的。而对科研和学问研究进行总结并系统化的写作文体即为论文，故作者事实上是通过正反两个方面阐述了论文写作对于学问研究的重要性，A项当选。B、C、D项均为涉及文段的主题词写作，排除。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0378","type":"single","t":"在美国，学术界、工商界、主管部门和多数消费者倾向于认为用豆浆代替牛奶是一种更健康的选择。不过，绝大多数西方人很不喜欢豆味，所以美国的豆浆有进一步去除或掩盖豆味的操作，而中国人就会觉得这样一点儿豆浆味也没有。对奶味的偏好和对豆味的排斥，是豆浆在西方不够受欢迎的主要原因。此外，豆浆在保存过程中比牛奶容易发生聚集下沉，这也给豆浆成为牛奶那样的方便食品带来了难度。保存难度高，加上市场需求量不是那么大，导致美国豆浆的价格远远高于牛奶。对这段文字的主旨概括最准确的是:","o":[["A","对比中国人和西方人对豆浆口味的不同喜好"],["B","探究豆浆在西方市场不受欢迎的根本原因"],["C","剖析豆浆在美国市场上价格偏高的原因"],["D","指出豆浆打入美国市场所必需的技术手段"]],"a":["C"],"an":"文段的行文脉络为分一总式，首先以“此外”为标志，分别论述豆浆在西方不够受欢迎，即市场需求量不大和豆浆保存难度高两种客观情况，最后总结这两种情况是造成豆浆价格高于牛奶的原因。因此，全文段是在剖析豆浆价格偏高的原因。结合选项可知，C项为文段中心意思的同义表述。A、B两项表述片面，排除;D项为无中生有，排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0379","type":"single","t":"①就可能走向思维的误区②这无疑是最好的强国路径③对于经济增长和民众福利来说，更重要的是人均意义上的增长，而不是总量意义上的增长④当然，也不能说总量意义上的增长没有意义，毕竟有很多事情是由“总体实力”决定的⑤简单的通过增加劳动力供给的数量来推动总量意义上的增长⑥如果人均意义上的增长快，却能够在提高民众福利的同时提高“总体实力”将以上6个句子重新排列，语序正确的是:","o":[["A","③⑤①④⑥②"],["B","④⑥②③⑤①"],["C","⑤①⑥②③④"],["D","⑥②⑤①③④"]],"a":["A"],"an":"本题为语句排序题,从选项入手。首先判断首句,④句开头有表示转折的“当然”和表示并列的“也”，不能作为首句成分，排除B项。随后可观察判断尾句，②句由“这”引导表总结，且“强国路径”为典型的“对策”表述形式，故排除C、D两项。通过验证,A项通顺合理。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0380","type":"single","t":"有人说，民主就像一个旋转的陀螺，重要的是旋转的过程，离开了这个过程，民主的陀螺就会倒下。就民主决策而言，正确的决策结果自然会给人们带来希望和信心，而决策的过程，对人们凝聚信心的影响更大。这段文字中的比喻意在强调:","o":[["A","民主决策过程对民主的重要性"],["B","只有通过民主决策，才能凝聚信心"],["C","决策过程中的民主，是广泛的社会参与"],["D","有效的参与过程，便是凝聚信心的过程"]],"a":["A"],"an":"据提问“意在强调”可知此题是中心理解题。A项正确，本文段先提到实现民主的过程很重要，又说民主决策的过程对人们的信心凝聚影响更大，更加印证了民主决策过程的重要性。B项错误,“只有......才能”和D项中的“......便是”,说法过于绝对,不符文意;C项错误,文段中未提到“决策过程中的民主，是广泛的社会参与”，C项是无中生有。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0381","type":"single","t":"《阿凡达》是卡梅隆花了12年才完成的一部片子，这12年里，他除了拍过几部跟海洋有关的纪录片之外，几乎都在为《阿凡达》折腾，同时消失于媒体和公众视线之外结果影片上映才两周,全球票房就直奔10亿美元,离他那部创下14亿美元票房纪录的《泰坦尼克号》,距离也并不遥远。而中国导演呢,谁会花12年的时间,去做一部完全不知道前景的影片?中国电影另外一个很堕落的地方是，贴片广告已经多到令人发指的地步，铜臭气十足。冯小刚在《非诚勿扰》受到批评后还说，这是国际通行做法。对，《变形金刚》里的确有雪佛兰,但是好莱坞是每部影片都会尽可能地往里拉赞助塞商标么?我真的不是苛刻,但事实就是这样,很多中国导演不是为观众在拍电影,甚至也不是为自己拍电影,他们只是在为钱拍电影。相比之下,《阿凡达》是多么的纯洁,可为什么这份纯洁,反而是远比我们商业的美国人实现的呢?对划横线的语句理解不恰当的一项是:","o":[["A","卡梅隆用了12年精心制作，其间，他几乎消失于媒体和公众视线之外。"],["B","卡梅隆用12年的时间，去做了一部完全不知道前景的影片。"],["C","《阿凡达》是导演卡梅隆为观众为自己而创作的一部电影。"],["D","《阿凡达》是一部没有商业广告的纯洁电影。"]],"a":["D"],"an":"本题考查词句理解。D项以有没有商业广告作为电影纯洁与否的标准,曲解了文意。且文段并不是反对在电影中加入商业广告，而是反对“尽可能地往里拉赞助塞商标”。因此，结合选项应该选择D。由“很多中国导演不是为观众在拍电影，甚至也不是为自己拍电影，他们只是在为钱拍电影，相比之下，《阿凡达》是多么的纯洁”可知，文段是通过对比卡梅隆与中国导演的不同做法来突出《阿凡达》的纯洁的。因此，A、B、C三项正确。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0382","type":"single","t":"居民健康问题已经成为国际社会与各国政府所关注的主要社会问题，实施基于居民健康的社会发展战略已成为推进社会和谐发展的重要措施，它不仅可以促进全社会的参与,统筹优先配置社会资源,而且可以协调政府和社会各部门之间的责任与发展目标,还可以规范居民个人的生活行为，充分体现了与其他社会公共政策的互补性。阅读上面的文字，选出理解不准确的一项:","o":[["A","居民健康这一社会问题已深为国际社会和各国政府所关注"],["B","居民健康战略是对其他社会公共政策的有效补充"],["C","实施居民健康战略可以规范居民生活行为，是推进社会和谐的重要发展战略"],["D","实施居民健康战略可以促进社会资源的统筹配置和部门之间的责任协调"]],"a":["C"],"an":"根据材料中“实施基于居民健康的社会发展战略已成为推进社会和谐发展的重要措施”一句可知C项表述错误,并不是“实施居民健康战略可以规范居民生活行为”。所以C项当选。根据“居民健康问题已经成为国际社会与各国政府所关注的主要社会问题”可知A项正确;根据“充分体现了与其他社会公共政策的互补性”可知B项正确;D项在材料中有原文体现，所以正确。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0383","type":"single","t":"就好比古代中国的读书人绕不开《易经》一样，现代中国的读书人是避不开《红楼梦》的。所以，自王国维发表《<红楼梦>评论》以来，中国现代各路“文化豪杰”在学有所成后都会在“红学”里一试身手，似乎不露一手就不足以显示自己的学问如何了得。也正是在这种意义上，《红楼梦》产生了一种“正典效应”。作者接下来最有可能重点介绍的是:","o":[["A","王国维的《<红楼梦>评论》"],["B","《红楼梦》的“正典效应”"],["C","各路“文化豪杰”的“红学成就”"],["D","现代中国的读书人避不开《红楼梦》的原因"]],"a":["B"],"an":"据提问知此题为接语选择题。根据文段的起承转合可知，下文应该围绕文段最后一句中出现的“正典效应”进行阐述。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0384","type":"single","t":"现在很多地方往往把衡量医院管理者的标准简化为“收入就是硬道理”，使得院长整天要想点子创收，考虑员工“吃饭”的问题，往往忽视了提高医疗质量、培养专业人才等长远大计。这段话说明了这样一个观点:","o":[["A","对医院管理者的衡量标准不应简单化。"],["B","提高医疗质量、培养专业人才是长远大计。"],["C","强调“收入就是硬道理”是各个医院的现状。"],["D","医院院长不应想点子创收，考虑员工“吃饭”的问题。"]],"a":["A"],"an":"据提问知此题为中心理解题。文段想说明这样一个问题:衡量标准的简化会造成医院将重点放在创收，而非关注提高医疗质量、培养专业人才等长远大计上。可以推知作者对衡量标准的简化持否定态度，后几句为该观点产生的一系列后果，目的是补充说明该观点的严重性。B项说法本身正确，但不是文段想要说明的观点，不足以概括本文段。C项说法过于绝对，并非是“各个医院”都如此。D项说法曲解文意，说法本身错误。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0385","type":"single","t":"知识的本质是发现，只有在自由的环境中，人们才会有更多发现的可能。因此，知识分子在本质上也不是熟知现成结论的人，知识分子要发掘未知事物，提示假相背后的真相。教育的目的，就是培养学生发现和创造知识的能力，教育如果停留在向学生强行灌输标准答案和“真理”上，根本就是反教育的。这段话的主题是:","o":[["A","知识的本质"],["B","知识分子的本质"],["C","创造力的培养"],["D","教育的目的"]],"a":["B"],"an":"根据提问标志词主题可知，本题为中心理解题。由总结关系词“因此”可知，整个材料的语意重点是其后的内容，即知识分子的本质并不是“熟知现成结论的人”，他们要发掘未知事物。因此，材料的主题是“知识分子的本质”。因此，结合选项应该选择B。其他三项都是材料的细节信息，未抓住材料重点，予以排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0386","type":"single","t":"中国的科技进步举世瞩目。2010年中国科技人力资源总量居世界第一位，国际科技论文数量居世界第二位，发明专利授权量居世界第三位……但调查显示，我国人才资本对经济增长的贡献率远远低于西方国家，而关键技术的对外依存度明显高于西方国家。这段文字主要想传递的信息是:","o":[["A","缺乏关键核心技术的支持已成为科技发展的瓶颈"],["B","中国科技发展的自主发展创新能力不强，研究基础薄弱"],["C","中国的科技实力发展迅猛，取得了许多重大成果"],["D","中国已成为科技大国，但仍与发达国家存在较大差距"]],"a":["D"],"an":"文段首先指出我国的科技进步举世瞩目，并列举了一系列科技指标的世界排名，随后以“但”表转折指出我国在人才资本贡献率以及关键技术的对外依存度明显高于西方国家。由转折后是重点可知，我国虽然已经成为科技大国，但仍与发达国家存在较大差距。D项正确。A项，未包含“中国”这一主体，扩大范围，排除。B项，文段没有提到自主创新与研究基础，无中生有，排除。C项，为转折前内容，非文段重点，排除。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0387","type":"single","t":"时间怀有一种公平的道义，对它所拿去的，它会给我们其他补偿。它夺去了我们肢体和精神的灵活，却给予我们安静和安详。对这段话理解正确的是:","o":[["A","无所谓浪费时间"],["B","耽误的时间可以得到补偿"],["C","不具有灵活的肢体和精神的人能获得安宁"],["D","可以补偿青春活力流逝的是晚年的宁静"]],"a":["D"],"an":"本题为中心理解题。材料第一句总体讲时间在拿走一些东西的时候会给我们其他补偿，第二句做具体的解释，当时间流逝，我们渐渐老去时，我们的心却安静了，体现“公平的道义”。A、B项错误,明显偏离题意,材料并不是在讲浪费时间的问题;C项错误,歪曲材料本意,“夺去了我们肢体和精神的灵活”并非指因残疾等原因,“不具有灵活的肢体和精神的人”，偷换概念，故不选。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0388","type":"single","t":"①干细胞的重要性奠定了其在医药卫生、科技产业、国防等领域内的重要地位②美国总统奥巴马上任之初就宣布取消前任总统对干细胞研究的限制③干细胞因其在生命科学、新药试验和疾病研究这三大生物医药领域的重要作用受到全世界医学界和政治人物的关注④2009年，美国FDA批准了世界上首次人类胚胎肝细胞治疗脊髓损伤的临床试验⑤因此，干细胞的研究、开放和应用可以看作是人类的健康工程，预期在未来几年内会有很大的飞跃⑥现在人们已经发现,癌症、糖尿病、帕金森氏症、心脑血管病、组织器官纤维化、自身免疫性疾病等一系列疾病都可能是干细胞数量减少或结构功能变异引起的将以上6个句子重新排列，语序正确的是:","o":[["A","③②①⑤⑥④"],["B","①⑤③②⑥④"],["C","③②④⑥①⑤"],["D","①⑤⑥④③②"]],"a":["C"],"an":"本题考查语句排序。此题需要找准切入点,根据语意前后捆绑关系,③“政治人物”后面应该接②“奥巴马”，而与②关系最密切的应该是④，排除A、B、D三项。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0389","type":"single","t":"玫瑰也许是我们能见到的最复杂的花卉。其花型、颜色和香味千变万化,既有雅致的种玫瑰，也有馨香的园林玫瑰，还有宝石般耀眼的现代杂交玫瑰。如今，世界各地生长着200多个种类的玫瑰，由于人们不断通过杂交试图获得更美、更香、花期更长的玫瑰，因此我们常见的园艺和商业用途的玫瑰品种一直在以每5年一批的速度进行着更新换代。要识别出一种玫瑰非常困难,连专家们的观点也往往有很大差异,因为玫瑰的种类非常容易发生变化，也很容易杂交;杂交玫瑰不仅可以通过人工控制进行选种，也大量地自然形成。这段文字意在说明:","o":[["A","杂交技术在培育玫瑰新品种中作用显著"],["B","如何对玫瑰进行科学分类目前尚无定论"],["C","玫瑰的商业价值刺激着人们不断开发新品种"],["D","自然属性与人为需求导致玫瑰品种十分复杂"]],"a":["D"],"an":"本题考查文段主旨。故文段第一句提出玫瑰品种复杂，接着阐述了人们为了获得更美、花期更长的玫瑰而对玫瑰进行杂交,最后说明识别一种玫瑰非常困难的原因是玫瑰种类易发生变化且易杂交。可见文段意在说明玫瑰品种十分复杂是因为其自然属性和人为需要。只有D项与此相关。A、C两项为文段部分内容，不是重点所在;文段未提及B项内容。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0390","type":"single","t":"从政治经济到日常生活，从全球化到地区的复兴，从实用技术到话语表达所面对的诸多难题乃至危机，都与空间这一因素密切相关。这是以地震海啸灾难、边界武装冲突、房地产业的崩盘、道路拥堵以及空间竞争日趋激烈等多种形式表现出来的。这段文字意在说明:","o":[["A","经济全球化带来很多空间危机"],["B","自然和人为空间危机日趋突出"],["C","如今空间变得越来越为重要"],["D","人口增多带来很多空间问题"]],"a":["C"],"an":"本段文字围绕“空间”这一话题进行阐述，首句指出空间的重要性体现在各个层面，后文以一句“这是以……等多种形式表现出来的”作为解释说明，再一次强调其重要性所在，故C项准确把握了文段的重点。A项，“经济全球化”是首句诸多现象中的一方面，表述片面，且文段阐述的是“全球化”与空间关系密切,而不是“带来空间危机”,排除。B项是后文解释说明的内容，非重点，排除。D项无中生有，排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0391","type":"single","t":"70年代一本练习题,一碗绿豆汤,高考花费5毛钱;80年代考前买套好文具,花费10元钱;90年代买复习资料,喝妈妈熬的鸡汤,花费350元;00年代请家教,花费5000元;10年代请一对一补课、订营养餐,租学区房花费4万元......这段文字最能说明的是:","o":[["A","高考消费的日益多样化"],["B","三十多年间高考成本的变迁"],["C","三十多年间物价上涨的脉络"],["D","三十多年间高考消费结构的变迁"]],"a":["B"],"an":"通过提问方式可以判断出本题是表面主旨题,文段通过序时并列的语句结构介绍了从上世纪70年代到本世纪10年代高考期间需要的花费和变化，主要说明了三十多年间高考成本的不断变迁。因此，结合选项应该选择B。B选项:三十多年间高考成本的变迁充分概括了随着时间的推移，同样是为了高考，所需要的成本在不断地变化符合文段所表达的内容。A选项:高考消费的日益多样化,文段所表达的是为了高考所花费的成本的变化过程,而不是消费种类的多样化，与原文不符;C选项:三十多年间物价上涨的脉络，忽略了本文段的一个重要主题就是高考，所以与原文不符;D选项:文中没有涉及消费结构的变化，属于无关选项。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0392","type":"single","t":"或许,作为一个翻译,一个以在两种语言之间搬运信息为职业的人,最无奈的事情，不是感到不同语言之间的鸿沟无法弥合，而是发现大多数生活在单语体系中的人，看不见那条鸿沟的存在，看不见翻译者为了沟通所做的上穷碧落下黄泉般的挣扎。或许有的人从未意识到，萌发于一片有限的特定土地上的语言，有时是无力为异域事物命名的。作者意在通过这段文字强调:","o":[["A","不同语言之间的鸿沟无法弥合"],["B","不同语言有时无法一一对译"],["C","人们往往无法认同翻译的辛苦"],["D","翻译工作很难得到人们认同"]],"a":["D"],"an":"本题为中心理解题。文段首先阐述了翻译工作的无奈，接着关联词“不是……而是”强调了无奈在于大多数人看不见鸿沟的存在，看不到译者的努力和辛苦。最后一句进一步进行补充说明，在不同语言之间，翻译有时无能为力。综合这两句可以看出:生活在单语系中的人看不到语言之间的鸿沟,理解不了翻译为什么不能对其他语系的专有名词进行翻译翻译工作得不到人们认同。因此，结合选项应该选择D。A项、B项的叙述为原文“不是”后面的内容，不属于要强调的，排除;C项表达错误，文段强调的是人们看不到的不仅仅是翻译的辛苦，还有有些时候“翻译”的“不可能”，C项没有涵盖后半部分的意思，不够全面，排除。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0393","type":"single","t":"春秋时期，鲁国上卿大夫季文子掌握国政和统兵之权，却“家无衣帛之妾，厩无食粟之马、府无金玉”。仲孙它提醒他，这样有损国家气派，吝啬而不体面。季文子回答，国家形象的维系要靠高尚品德，而非美妾良马，“若独贪于奢侈，好于文章，是不德也。”这则故事能给当今公务员带来的启示是:","o":[["A","生活俭朴，官员才能维护国家形象"],["B","为政以德，勤俭自律，官员要注重个人品行修养"],["C","联系群众，放下身段到群众中去"],["D","合理用权，权为民所用而不是以权谋私"]],"a":["B"],"an":"文段重点在于季文子说的话“国家形象的维系要靠高尚品德，而非美妾良马”。可见文段主要强调公务员的道德品行。只有B项提到“为政以德、勤俭自律、品行修养”。A、C、D三项均与文段所表达主题无关。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0394","type":"single","t":"有一次，就在一架民航客机即将着陆时，乘务员突然通知机上的乘客说“由于机场拥挤，无法降落，预计到达时间要推迟1个小时”，机舱里顿时一片抱怨之声，乘客们都在焦急等待着度过这段难熬的时间。几分钟后，乘务员又宣布“再过30分钟，飞机可以安全降落”，乘客们如释重负地松了口气。又过了5分钟，广播里又说“现在飞机就要降落了”，尽管晚了十几分钟，乘客们还是喜出望外。这段文字传达的道理是:","o":[["A","既来之，则安之"],["B","退一步海阔天空"],["C","道歉更易获得别人的谅解"],["D","适当的言语有利于稳定情绪"]],"a":["D"],"an":"据提问“道理”可知此题是考查道理判断的中心理解题。材料讲述了在一架推迟降落飞机上，乘客们在不同时候得知不同飞机运行信息下不同的心境，乘客在这之中不断获得比乘务员上一次推断更好的信息，情绪渐渐得到稳定，最后结果是“虽然晚了十几分钟，但乘客还是喜出望外”，说明如果语言运用适当，将有利于稳定情绪，所以D项正确。A项实际与乘客的心态相反，B项的“退一步”在文中并没有体现，且A、B项都是在乘客角度读出的信息，并不是材料得出的关键，;C项也只是片面理解材料蕴含的某一方面，所以A、B、C都不选。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0395","type":"single","t":"民生问题的发生源自人的正常需要难以被满足，而人的需要的满足必须有一定的资源、工具、手段和方式。在给定的社会历史条件下，人们用来解决民生问题的这些资源、工具、手段和方式都是特定的，是不以人的愿望为转移的。如果条件不具备，人们的民生需求就无法得到满足，由此产生的民生问题在给定的社会历史时期内就难以得到解决。这段文字的中心论点是:","o":[["A","民生问题的发生源自人的正当需要难以被满足"],["B","人的需要的满足是不以人的愿望为转移的"],["C","民生问题的解决受社会历史条件的限制"],["D","民生问题需要特定的资源、工具、手段和方式来解决"]],"a":["C"],"an":"第一步，读文段找到主旨句。“人的需要的满足必须有一定的资源、工具、手段和方式”而在历史条件下，这些手段和方法是不以人的愿望为转移的。因此文段重点讨论的是历史条件的制约作用。最后一句话是反面论证，“如果条件不具备”会出现什么情况，反过来证明了文段重点讨论的是历史条件的重要性。第二步，选择与主旨含义相同的选项。A项只是民生问题产生的根源，非中心论点，排除;B项主体错误，文段论述主体为民生问题，而非人的需要，排除;C项为主旨的同义替换，正确;D项只是表面的手段和方法，不是根本的制约条件，排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0396","type":"single","t":"在公众印象中，每一次加大尾矿治理力度，总是在发生严重的尾矿溃坝事故之后。而突击式的尾矿治理方式不太可能持久奏效。数量巨大的尾矿伴随着矿山的开采不断增加，随着矿山枯竭，经年累月贮存起来的尾矿被堆放于江岸的山坡，因在技术层面缺乏有效的处理方法，只能以非安全的暴露方式，继续留存在自然界中。这段文字主要想传递的信息是:","o":[["A","尾矿如不能得到有效治理将会产生各种隐患和威胁"],["B","我们总是在事故发生之后突击式的治理尾矿"],["C","遗留的历史包袱和新增的隐患令尾矿治理压力剧增"],["D","中国的尾矿治理将以何种模式继续进行才能有效"]],"a":["A"],"an":"由文段前两句可知，尾矿处理一直采用突击式的尾矿治理方式，这种方式不是有效的处理方式，且由最后一句“非安全的暴露方式”可知，尾矿存在安全隐患。显然A项表述最符合文段原意。B项无中生有。D项中“何种模式”在文段中并没有具体体现。C项为强迷惑项，但与A项对比可知，A项的重点在于应该对尾矿进行有效治理，而C项的重点在于压力倍增。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0397","type":"single","t":"随着全球肉类产量的进一步增加，畜牧业对全球温室效应的影响也会增长。目前畜牧业用地已经占到地球土地面积的30%。作为牧业增长最为迅速的一个门类，畜牧业还会占用更多的土地用来生产饲料和放牧。在拉丁美洲，为给牧场腾出空间，已经有70%的森林遭到砍伐。目前畜牧业对全球825个陆地生态区中的306个造成了威胁，并且威胁到1699个濒危物种。这段文字意在说明:","o":[["A","应严格控制畜牧业发展"],["B","畜牧业造成的污染严重"],["C","畜牧业发展面临的瓶颈"],["D","发展畜牧业的环境代价"]],"a":["D"],"an":"据提问可知此题是中心理解题。分析材料可知五句话是并列结构，分别通过数字描述了畜牧业对温室效应、土地、森林、陆地生态区的消极影响，都在说畜牧业的发展给环境带来了负面影响，即发展畜牧业付出的环境代价。所以D项正确。A项引申过度;B项是畜牧业造成消极影响的其中一个方面;C项无中生有。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0398","type":"single","t":"北京天坛祈年殿、圜丘的各层组排，均是以天阳之数“九”及其倍数呈扇环形展开的，即由内层至外层分别为九、一十八、三十六......这个天阳之数“九”来源于《易经》乾卦的“九”，如《易经·乾》“上九，亢龙有悔”，即言“九”为阳数之极，此时为阳之亢极。神圣的祈年大殿用“九”及其倍数排列，寓含着崇尚天阳的信息，这是《易经》符号学在古代建筑中的体现。这段文字意在说明:","o":[["A","我国古代建筑体现着功用、审美的特点"],["B","我国古代建筑蕴藏着一种数字符号信息"],["C","《易经》与我国古代建筑中的符号信息"],["D","我国建筑艺术的最高境界暗含符号信息"]],"a":["B"],"an":"据提问可知此题是中心理解题。材料先指出了天坛祈年殿、圜丘等古代建筑的风格特点，又谈到了《易经》中对于“九”的释义。最后一句话总结祈年大殿用“九”及其倍数排列，是符号学在古代建筑中的体现。引申可知材料意在说明我国古代建筑中蕴藏了一种潜移默化的数字符号信息。所以B项正确。A项“功用”、“审美”在材料中并不能体现，文段着重介绍的是古代建筑的数字符号寓意，排除A项;C项首先选项本身有歧义，根据断句不同可以理解为是“《易经》与“我国古代建筑中的符号信息”，也可理解为是“《易经》与我国古代建筑”中的“符号信息”。选项本身有歧义。而从文段中的描述可以看出“数字符号信号”在古代建筑中有所体现，B项“蕴含”一词说明了这种关系，C项描述较为笼统，没有进行引申;D项表述有所偏差，“最高境界”无从得出，排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0399","type":"single","t":"网络时代是一个“信息过剩而注意力稀缺”的时代,以网络为基础的当代经济本质是“注意力经济”，在这种经济形态中，最重要的资源是注意力，因此在互联网上如何吸引注意力成为一个非常重要的问题。网络时代对注意力的经济价值的强调无疑是必须的，但如果忽视了对吸引注意力的道德评价和精神意义，却会导致对注意力缺乏应有的人文关怀和起码的尊重，以至于会有人利用网络手段的便捷性和隐匿性，通过不实和不良信息去浪费、污染、践踏他人的注意力，这无疑也是一种严重的精神伤害。根据这段文字，可以看出作者的意图是:","o":[["A","呼吁网络时代要善用注意力,珍视其精神和文化价值"],["B","强调网络时代如何吸引注意力是创造经济价值的关键"],["C","强调网络时代忽略了对吸引注意力的道德评价"],["D","呼吁应加强对网络注意力污染和扭曲的管理"]],"a":["A"],"an":"本题是中心理解题。整个材料的主要论述对象是“注意力”，材料先提出“在互联网上如何吸引注意力成为一个非常重要的问题”，接着提出注意力在经济和道德上的两方面意义，根据“但”这一转折词可知，“注意力的道德评价和精神意义”是文段强调的重点，所以作者通过这些论述旨在强调要正确应用注意力，尤其不能忽视其精神和文化价值。因此，结合选项应该选择A项。B项表述片面,“经济价值”只是注意力价值的一个方面,并不是作者强调的关键;C项是对文段中的一个表面现象进行的说明，作者是想通过这样的现象告诉人们应该重视注意力的道德评价和精神意义，所以此项没有直接清晰地体现作者的意图所在;D项在材料中并未体现。故B、C、D三项均不选。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0400","type":"single","t":"在古代，对未知世界的恐惧感不只属于儿童。中世纪的绘图师们在绘制地图时，并不把未知地带留为空白，而是画上海蛇和想象中的怪兽，并标记“此处有龙”。几个世纪以来，探险家们穿越大洋，攀登高山，逐渐在地图上把这些想象替换成了真实的标记。现如今，我们可以从外太空拍摄照片，感叹地球之美。通信网络造就了“地球村”，世界变得越来越小了。这段文字的核心观点是:","o":[["A","科技让世界更美好"],["B","知识是治疗恐惧的良药"],["C","读万卷书，行万里路"],["D","吾生也有涯，而知也无涯"]],"a":["B"],"an":"文段首先介绍了在古代绘画师们将未知地带画上海蛇和怪兽的做法，指出人们对未知恐惧的问题，接着介绍几个世纪以来探险家们实地探索的经历，以及到今天我们通过各种方式了解世界认知世界的事实。文段通过古今对比，体现出科技带来的知识对克服恐惧的作用，对应B项。A项“让世界更美好”为无中生有的表述，文中强调的是今天科技带来的知识对未知恐惧的克服，排除;C项“读万卷书”在文段中没有体现，无中生有，排除;D项非文段的重点，文段并非讨论人生和知识有无止境的问题，排除。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0401","type":"single","t":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是:①然而，繁华盛景背后的旧制度却已是风烛残年、百孔千疮②德国总理默克尔赠给了中国贵宾的一幅古老地图,在无数国人心中激起波澜③在当时已经踏上现代化之路的欧洲人眼里,君主专制的中华帝国“翻来覆去只是一座雄伟的废墟”④那幅绘于乾隆年间的中国地图,刻画的是中国封建史上最后一个辉煌的年代","o":[["A","②③①④"],["B","①②④③"],["C","②④①③"],["D","③②④①"]],"a":["C"],"an":"浏览选项,我们发现①句中“然而”,表转折,说明该句不是首句,排除B项;转折之后提到风烛残年的旧制度，根据转折前后话题一致、意思相反的原则，其前一句应为辉煌的时代,故④①应为前后句,排除A项;由④句中出现指示代词“那幅地图”,故前文应提到“地图”。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0402","type":"single","t":"“一桌子苹果,别人通常挑一两个,挑三四个。毕加索最可气,每个都咬一口,每个苹果上都有他的牙印。”一位中国画家如此评价毕加索。毕加索一生搞过素描、油画、雕塑、版画，担任过舞台设计，还写过小说，剧本和无标点散文诗。从这段文字中我们可以推论:","o":[["A","毕加索吃苹果,每个都只咬一口,中国作家对这种做法不以为然"],["B","很多人都像毕加索一样参与过许多艺术类型的创作"],["C","毕加索在艺术领域的许多方面进行过创作的尝试"],["D","毕加索是个天才式的人物，没有他不涉及的艺术领域"]],"a":["C"],"an":"从提问方式“可以推论”可知此题为中心理解题。A项错误，文段中的“毕加索吃苹果，每个都咬一口”只是中国画家打的一个比喻，并不是真的每个苹果都咬一口;B项错误，文段没有提到除了毕加索以外的“很多人”，B选项没有依据;C项正确，文段首句用中国画家“吃苹果”的比喻引出论题，第二句对这个比喻的含义进行阐述，毕加索在素描、油画等多个艺术领域进行的创作尝试;D项错误，文段中写到毕加索涉足的多个艺术领域，显然没有穷尽所有的艺术领域，文段没有也不能说“没有不涉及的领域”，“每个都咬一口”只是用比喻来形容毕加索涉足艺术领域之广泛，不是说他每个领域都有涉及，D选项没有依据。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0403","type":"single","t":"《三字经》《弟子规》《劝学诗》等作品之所以成为经典，也许是教育的惰性所致:读书人不需要思考和摸索，只需要单向填鸭式的学习和灌输，奉经典为准则，即可读书成才，成就教育的结果。如今，将经典中的糟粕删掉了事，只剩下与当今时代契合的部分，让孩子们重新仰视经典之为经典，这当然还是教育之惰性的延续，只不过把书多编辑一次罢了。以下表述符合作者观点的是:","o":[["A","《三字经》《弟子规》《劝学诗》等作品的广泛流传正是教育惰性的体现"],["B","对经典作品中的糟粕采用“删去了事”的简单粗暴的处理方式，是一次失败的“拿来主义”"],["C","对《三字经》《劝学诗》等经典作品应该取其精华，真正使之发扬光大"],["D","对经典作品采用填鸭式的教学方式是教育界的败笔"]],"a":["B"],"an":"文段通过《三字经》《弟子规》等作品成为经典的分析引出现今对经典中的糟粕的处理方式，由此可知文段论述的主题是“对经典作品中的糟粕进行简单地删减，并没有进行任何有价值的改动，仍然是一种错误的教育方式。故作者的观点为B。A项表述对应首句，首句表述为“也许是教育的惰性所致”，故说法不严谨，此外，文段强调的是“如今”引导的后半部分，而不是前半部分，故A项偏离文段重心;C项表述偏离文段重心;D项填鸭式教学不是作者强调的重心，文段的重心在后半部分“经典的糟粕删除了事”，此外教育界的败笔用词也不当。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0404","type":"single","t":"总会有些人是白手起家，总会有些人崛起于社会的底层，总会有些传奇人物从生命的低谷爬上了事业的高峰。所以有一句长盛不衰的励志口号叫:苦难成就人生。可是，我们不要忘了,泯灭于苦难之中的人何其多,升起的永远是佼佼者。苦难常常只是性格的催化剂，它使强者更强，弱者更弱，智者更智，愚者更愚。作者对苦难的看法是:","o":[["A","苦难能够改变命运"],["B","苦难能够保持生命的热忱"],["C","苦难决定人的性格"],["D","苦难并不能成就人生"]],"a":["D"],"an":"本题考察对考点的态度理解。根据材料中表示转折的“可是”可知，作者观点应在其后，概括其意得到“苦难并不能成就人生”。因此，结合选项应该选D。A、B项错误,都是别人的观点,作者持相反态度;C项错误,作者的重点并不是谈苦难和性格的关系，而是苦难和人生。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0405","type":"single","t":"大唐帝国的开放品格和强盛国力，对周边国家产生了强大影响。作为唐朝手工业产品的各种生活用品和工艺品,对海外诸国都有着磁石般的吸引力。域外对从唐朝舶来的丝绸、瓷器等物品的追逐，就好比时下潮人对苹果手机和iPad的垂青一样，唐三彩也裹挟在这种洪流中漂洋过海，生根发芽。这段文字接下来最有可能论述的是:","o":[["A","唐朝对周边国家的巨大影响力"],["B","域外崇尚唐朝物品的各种表现"],["C","唐朝货品的运输路径和方式"],["D","唐三彩在域外的流传和影响"]],"a":["D"],"an":"接语题重点关注文段尾句。文段从帝国的影响具体到唐朝的生活用品和工艺品,最后提出更为微观具体的“唐三彩”这一核心概念，作为对下文的引出。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0406","type":"single","t":"在英国家庭中，绝对看不到孩子被没有理由的娇宠，犯错误的孩子会受到纠正甚至惩罚。家长们往往在尊重孩子独立人格的前提下，对孩子进行严格的管束，为的是让孩子明白:他们的行为不是没有边际的，不可以为所欲为。英国的法律明确规定允许家长体罚孩子。对这段文字的理解不准确的是:","o":[["A","英国人从不娇惯孩子"],["B","英国人经常体罚孩子"],["C","英国人管孩子时不伤其自尊"],["D","英国人的法律有管教孩子的条款"]],"a":["B"],"an":"根据提问知本题为细节判断题。A项正确，从文中第一句可知，英国人对孩子是很严格的，不会娇惯孩子，即使有“娇惯”也不是没有理由的;B项错误，文中只说“英国的法律明确规定允许家长体罚孩子”，并不意味着“英国人经常体罚孩子”，所以不准确;C项正确,从文中“家长们往往在尊重孩子独立人格的前提下,对孩子进行严格的管束”可知;D项正确，“英国的法律明确规定允许家长体罚孩子”，体罚孩子为“管教孩子”的一部分，故“英国人的法律有管教孩子的条款”。本题为选非题。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0407","type":"single","t":"工艺品的核心是严格的秩序与工序,“秩序”是它的美学原理,因此易于复制。艺术品倾注了创作者的创造和力量，或观念或爱意或人生哲学，“力量”或“力量的表达”是它的美学原理，因此不易被复制。造成艺术品与工艺品有所区别的根本原因是:","o":[["A","复制方式不同"],["B","创作手法不同"],["C","美学原理不同"],["D","制作流程不同"]],"a":["C"],"an":"本题为细节判断题。材料第一句强调工艺品的美学原理是“秩序”，第二句强调艺术品的美学原理是“力量”或“力量的表达”;“易于复制”和“不易被复制”是在这两种不同的美学原理引导下形成的不同结果，因此整个文段属于分一分结构，概括起来即美学原理就是造成艺术品与工艺品有所区别的根本原因。B、D两项“创作手法”和“制作流程”材料都没有涉及，属于无关选项，排除。A项“复制方式”是原因导致的结果，而题干是要找原因，排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0408","type":"single","t":"识才需要智慧，用人需要胆略，护才需要勇气。大规模选拔人才必须依照制度进行，但“制度选人”不能代替“伯乐相马”。现在通行的标准化选人方法，只能选出一般性的优秀人才，而那些特殊性的杰出人才则很难被选拔出来，甚至会被当作“不合格产品”加以淘汰。承接上述文字最恰当的一句是:","o":[["A","因此，领导者只有独具匠心和慧眼，才能将他们选拔出来"],["B","因此，高明的领导者应当大胆地起用、加倍地呵护杰出人才"],["C","因此，标准化的选人方法已不合时宜，更为灵活、覆盖面更广、尊重特点、承认差别的选拔方法应运而生"],["D","因此，选人方法必须由一般性人才向特殊性人才转换，为特殊性人才的发展开辟广阔的空间"]],"a":["A"],"an":"由提问可知本题为接语选择题。文段首句提到“识才”、“用才”、“护才”，随后围绕“识才”这一话题展开论述。以“但”为转折，提出观点，“制度选人”不能代替“伯乐相马”，即强调“伯乐”的重要性。随后以一长句对这一观点进行论述。最后承接的“因此”结论句，应为对这一观点的总结呼应。结合选项可知，只有A项中的“领导者”与观点句中的“伯乐”形成对应。B项中提到起用、呵护人才，文段仅强调识才，未提及用才、护才;C、D两项中的方法均未体现出“伯乐”的重要性。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0409","type":"single","t":"近年来，不少国家纷纷实施“人与生物圈计划”，目的都是为了寻求同一个答案。为什么人类在享受自己获得和创造的财富时，会不时受到大自然的种种惩罚?因为人类在土壤侵蚀、沙漠化、滥伐森林、越来越多的物种灭绝、环境污染等所导致的生态系统退化中,逐步意识到自身还没有真正揭开人与生物圈之间的秘密。这段话中“秘密”一词具体指的是:","o":[["A","人类为什么会受到自然的惩罚"],["B","生态系统为什么会退化"],["C","人类应怎样在维持生态平衡的同时来获得发展"],["D","人类搞经济建设怎样才能适应环境"]],"a":["C"],"an":"据提问知此题是词语理解题。综合整个文段可知这个“秘密”涉及两个方面的内容:人类既要维持生态平衡，同时又要获得发展。所以C选项符合文意。A、B两个选项意思相近，都是仅仅从人类受惩罚的原因去分析，不全面，故A、B选项不选;D选项侧重于谈人类怎么适应环境，但这只是问题的一个方面，也不全面，故D选项不选。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0410","type":"single","t":"翻译时，“直译”偏重于对原文的忠实，“意译”偏重于译文语气的顺畅。哪种译法最妥当，人们各执己见。依我看，直译和意译的分别根本不应存在，忠实的翻译必定能尽量表达原文的意思。思想感情与语言是一致的，相随而变的，一个意思只有一个精确的说法，换一个说法，意味就完全不同。所以想尽量表达原文的意思，必须尽量保持原文的语句组织。因此，直译不能不是意译，而意译也不能不是直译。这段文字中，作者认为:","o":[["A","应随原文意思灵活选择翻译方法"],["B","忠实于原文思想是翻译的最高艺术"],["C","人为划分直译、意译本无必要"],["D","翻译时应尽量减少译者个人风格的影响"]],"a":["C"],"an":"此题属于态度理解题。作者的观点应该在文中“依我看”后面，他认为忠实的翻译必定能尽量表达原文意思。从文段的最后一句话可以看出，根本没有绝对的直译和意译，与C项表述一致。A项“灵活选择翻译方法”与“忠实翻译”不符，说法有误;B项中的“翻译的最高艺术”在原文中找不到根据;翻译的时候应尽量保存原文的语句结构，这与翻译时有个人的风格是不矛盾的，D项也不是作者的观点。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0411","type":"single","t":"看待社会公正问题，应防止落入平均主义这种无论在历史上还是在现实中都颇具诱惑力的窠臼中。虽然平均主义在某些领域是适用的，但若将其推广到所有领域尤其是分配领域，否认人的差别而要求平均分享一切，最终只会扼制人的积极性，扼杀社会发展的活力，不利于社会公正的实现。这段文字意在强调：","o":[["A","社会公正是相对的"],["B","平均主义是国人习惯的“窠臼”"],["C","平均主义适合非分配领域"],["D","追求社会公正并非要搞平均主义"]],"a":["D"],"an":"由提问可知本题为中心理解题。文段第一句为中心句，指出看待社会公正问题要防止落入平均主义的窠臼，后面接上文说明了“平均主义”的危害，所以“追求社会公正并非要搞平均主义”。故正确答案为 D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0412","type":"single","t":"如果仅从文物价值来看，纸质版的古籍文献的确不适宜大规模地向读者开放，否则，因为频繁翻阅以及由此带来的细菌侵入，必定会在很大程度上影响它们的保存。但如果从史料价值来看，它却本应该向社会开放，因为只有这样，古籍的文献价值才能得到充分实现，学术研究也才可能取得长足的进步。这段文字重在说明古籍文献：","o":[["A","需要民众参与研究"],["B","保护技术有待提高”"],["C","是否开放是一个难题"],["D","文物属性更应受到重视"]],"a":["C"],"an":"文段先从文物价值角度描述，说纸质版古籍不大适宜大规模向读者开放，接着用“但”表示转折引出从史料价值角度来看，纸质版古籍向社会开放才能实现价值促进学术研究，因此文段是为了说明纸质版古籍对社会开放与否各有道理，即是一道难题，对应到 C 选项。A项“需要民众参与研究”在文段中并未提到，文段谈论的是开放与否而非研究，排除。B 项“保护技术”、D 项“文物属性应受到重视”在文段中均没有提及到，属无中生有的表述，均排除。故正确答案为 C。【文段出处】《为古籍借阅设置门槛也应找准方向》","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0413","type":"single","t":"作物生产系统，是一个作物一环境一社会相互交织的复杂系统，作物生产的高产、优质和高效通常又是矛盾的和难于协调统一的整体，而且，高产、优质和高效三者的主次关系也会随着社会经济的发展而变化，可见农学学科的研究对象不仅涉及自然因素，而且涉及了社会因素。这段文字意图说明:","o":[["A","农学学科的研究对象既涉及自然因素又涉及了社会因素"],["B","作物生产系统是一个作物一环境一社会相互交织的复杂系统"],["C","农学是服务于作物生产的一门综合学科"],["D","必须以系统学的观点来认识农学和作物生产"]],"a":["D"],"an":"由提问可知为中心理解题。文段是分分结构，首先指出作物生产是一个难以协调的复杂系统，其次提到农学学科的复杂性，不仅涉及自然因素，而且涉及社会因素。因此要以系统的观点来认识作物生产和农学学科这两方面。因此，结合选项应该选择D。A和B都只提到了其中的一方面，C项引申过度，不是文中应有之义。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0414","type":"single","t":"美联储为了解决美国储蓄量不足的问题，维持美国经济运转，利用美元作为国际储备货币的特殊地位大量发行美元。美国用这种方法来投资，维持很高的生活水平，但造成了世界范围内的流动性泛滥。美元发行过度导致美元贬值，贬值的损失由所有持有美元的国家来承担，然后再来做强美元，损失就实现了转嫁。美国的有识之士认为，美国的这种做法不仅会害了自己还会害了世界。对这段文字概括最恰当的一项是:","o":[["A","美联储为了维持美国经济运转而大量发行美元"],["B","美联储大量发行美元的措施将会导致美元贬值"],["C","美元的过量发行会造成流动性泛滥影响世界经济"],["D","美国加大发行量来维护美元国际储备货币的特殊地位"]],"a":["C"],"an":"根据提问标志词概括可知本题为中心理解题。材料首先指出美国依靠大量发行美元来解决本国储蓄量不足的问题,然后又提出这种做法所造成的影响，即美元发行过度对美国、对世界都有害。由转折关系词“但”可知，整个材料的语意重点是其后的内容,即美元的过量发行造成流动性泛滥,对世界经济产生负面影响。因此，结合选项应该选择C，因为C项表述最为全面准确。其他三项表述都过于片面，没有抓住材料的语意重点。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0415","type":"single","t":"在社会生活中，每一个人都渴望得到别人的欣赏，同样，每一个人也要学会欣赏别人。欣赏与被欣赏是一种互动的力量源泉，欣赏必然具有愉悦之心、仁爱之怀、成人之美之善念;被欣赏必然产生自尊之心、奋进之力、向上之志。因此，让我们在生活中多一些欣赏。最能概括这段文字的是:","o":[["A","欣赏与被欣赏"],["B","欣赏是一种善良"],["C","欣赏是一种理解"],["D","我们要学会欣赏"]],"a":["D"],"an":"据提问可知，本题为中心理解题。文段开头说明“每个人渴望被欣赏”，“每个人也要欣赏别人”，进而阐释欣赏的作用，所以是总一分结构,开头部分则是文段主旨,即人们要学会欣赏他人。结合选项，D项表达符合题意。A项过于宽泛;B项在文段中并没有提及;C项同样没有涉及。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0416","type":"single","t":"消极的戏剧性行为常常是由一些消极的情绪化语言引起的。因此，区别描述性语言与情绪化语言的差异相当重要。感情激动时，如果谈论你自己或配偶，你是否容易夸大其词，言过其实?表达积极情感的情绪化语言有益于密切夫妻关系，但是，消极情绪化语言则容易影响夫妻感情。使用消极情绪化语言描述对方的行为尤其如此。排除消极隐患，需要变消极情绪化语言为描述性语言。描述性语言简单扼要、情绪冷静地描述人。这段文字旨在表达的意思是:","o":[["A","区别描述性语言和情绪化语言的差异"],["B","表达积极情感的情绪化语言有益于密切夫妻关系"],["C","情绪化的语言会对人们产生消极作用"],["D","消极情绪化语言容易影响夫妻感情"]],"a":["A"],"an":"据提为中心理解题。本题属于总分结构，前两句其实已经点明主旨，随后通过不同情绪下的语言表达以及产生效果，区别描述性语言和情绪化语言的差异。因此，结合选项应该选择A。B、D项都是在讲文中的例子，皆不正确;根据文意，消极的情绪化语言会对人们产生消极作用，故C项表述错误，也排除。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0417","type":"single","t":"戏剧和书法篆刻家使用的繁体字等小众文化产品,正面临阵地锐减、影响下降的处境。这样的表现，从技术层面说，并无大的问题，因为实用主义统治的时代，那些已经不甚实用的东西，可以退出技术的范畴，但是，从文化产品的延续性而言，那些被动辄几千年中国文明史检验了的文化，它绝不能不为人知，也不能只由书法家、戏剧家等专门人士扛着，如果最后的结果即是这样，那么终会曲终人散，留下一段段文化悲剧。下列属于文中“文化悲剧”的是:","o":[["A","大量历史文物流失海外"],["B","繁体字被简体字取而代之"],["C","多种民间曲艺面临失传困境"],["D","少数民族生活被现代生活同化"]],"a":["C"],"an":"根据“从文化产品的延续性……它绝不能不为人知，也不能只由书法家、戏剧家等专门人士扛着，如果最后的结果即是这样，那么终会曲终人散，留下一段段文化悲剧”这句话可知，所谓“文化悲剧”是指那些小众文化产品只有专业人士扛着，不为大众所知，也就是面临失传。因此，结合选项选择C。符合这一表述内涵的只有C项，“多种民间曲艺面临失传困境”也是仅由专业的曲艺表演家所了解，而大众对此却越来越不熟知所造成的后果。A项说的是文物流失海外,不符合“文化悲剧”的内涵;B、D项意思大致相同,均属于以前保留的不同样式被现代方式所取代或者同化，而并非“失传”之意，予以排除。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0418","type":"single","t":"人类所创造的每一种文化都是一个动态的生命体,各种文化聚集在一起,形成各种不同的文化群落、文化圈、甚至类似食物链的文化链。他们互相关联成一张动态的生命之网，其作为人类文化整体的有机组成部分，都具有自身的价值，为维护整个人类文化的完整性而发挥着自己的作用。这段文字主要表明:","o":[["A","人类文化实质是一种动态的生命体"],["B","人类文化的聚集类似于生态的系统"],["C","人类文化本身就像一个生态系统"],["D","人类文化相互关联组成动态网络"]],"a":["D"],"an":"据提问可知此题为中心理解题。阅读文段可知，其主要想表达的意思是各种文化一起形成一张相互关联的动态网，他们都为了维护网的完整性而发挥着各自的作用。文段始终围绕“人类文化相互关联组成动态网络”这个中心，D项正确。A项只是文段为了更好的让读者理解文中观点做的一个比喻，并非文段主旨;B、C项“生态系统”无中生有。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0419","type":"single","t":"目前,IBM公司研发的电脑沃森战胜了美国电视智力节目《危险边缘》的两名人类常胜将军。一时间，很多网友担心，电脑越来越像人了，将会超越人类智慧。从深蓝到沃森，人工智能又向前跨越了一大步。电脑会代替人脑吗?近几年，每次有电脑战胜人脑的事发生，都会有“终结者”之类的担忧。甚至有人认为，电脑的计算速度正变得越来越快，不久的将来电脑将能够模拟人脑、产生意识，并最终替代人类。作者对于“电脑替代人脑”这种观点的态度:","o":[["A","作者认为人工智能技术有可能实现电脑模拟人脑"],["B","看不出作者是否认同“电脑替代人脑”这种观点"],["C","认同这种观点,因为人工智能技术不断超越人类智慧"],["D","不认同这种观点，因为人类是人工智能技术的主宰者"]],"a":["B"],"an":"根据题干可知，此题考查作者对于“电脑代替人脑”这一观点的态度。但文段中出现的都是“很多网友担心”“终结者’之类的担忧”“甚至有人认为”，文段的这些观点都不是作者自己的。作者的态度在文段中并未体现。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0420","type":"single","t":"真实的历史事实及其史料依据，是历史叙事的基本要素。历史学的任务不仅是考证历史事实，还应该完整地还原出历史人物、历史事件和历史过程的面貌。为此，历史研究者需要把各种历史事实加以联结和组合。而主张后现代主义史学理论的学者认为，历史研究者可以在不违反学科规范的前提下，对历史事实进行不同的联结和组合。而这些不同的联结和组合，会形成不同的人物、事件或者过程的历史面貌。依据后现代主义史学理论的学者观点，历史描写:","o":[["A","并不等同于事实"],["B","可以有虚构成分"],["C","可以有不同的版本"],["D","其中的事实是不确定的"]],"a":["C"],"an":"本题属于细节判断题。由文段最后一句话:“而这些不同的联结和组合，会形成不同的人物、事件或者过程的历史面貌”中的“而”是关键的转折词，可知依据后现代主义史学理论的学者的观点，历史描写可以有不同的版本。因此，结合选项应该选择C。A项不是后现代主义史学理论所持有的观点;B、D项违反了“学科规范”这一前提。故正确答案为C。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0421","type":"single","t":"李商隐说“美酒成都堪送老”，雍陶说“自到成都烧酒熟，不思身更入长安”，点名直夸成都酒好。客观来看，成都确实深受酒神的青睐。独有的弱酸性黄粘土，粘性强、保水性好,含铁、钙等金属离子少,是酿酒筑窖的最佳土壤,地下水和冰川融水形成的优质水源，浸润了美酒的灵魂，而盆地中湿润的气候，格外有利于酒窖里微生物的繁衍，为酿酒提供了得天独厚的外部环境。悠长历史，堆叠的不仅是酒窖的深，酒糟的浓、酒浆的冽，也是酿酒、沽酒、饮酒之人悠然享受生活的心态，这才使成都的酒，酝酿出至醇的香和韵。对这段文字概括最恰当的一项是:","o":[["A","独特的地理文化条件造就了成都美酒"],["B","成都美酒从唐朝开始就已经闻名天下"],["C","气候形成了成都市井文化中慢的特质"],["D","产地的生活哲学塑造了酒文化的灵魂"]],"a":["A"],"an":"文段第一句第二句，由李商隐和雍陶的话语引出了成都深受酒神青睐的话题。第三句则分别从土壤、水源、气候方面阐述了成都美酒之所以为美酒的外部环境。第四句则阐述了成都美酒之所以为美酒还与成都人悠然享受生活的心态有关，这是内部环境。A项正确，阐述最为符合，地理文化条件则对应着外部、内部环境;B项错误，文中并没有阐述;C项错误，成都市井文化文中没有提及;D项错误，生活哲学可以对应着内部环境，这只是文中一部分，不全面。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0422","type":"single","t":"如果你问到,“母亲和妻子同时落水,你先救谁”。中国男人会很纠结,因为怎么做都不对，而美国男人会很干脆地回答“先救另一半”。为什么会这样呢?对比一下中西文化，就不难理解了。西方文化鼓励独立和个人价值，尤其是成年个体要建立自己新的生活，在这一过程中,母亲的参与和影响力会主动降低,理性的美国人会选择对今后生活重要的人。而对中国人而言，不管是出于伦理或是情感，母亲早已是“自我”中根深蒂固的一部分。即使长大成人了，对母亲的情感联结，也早已渗透到个人的认知与行为中。下列说法与这段文字相符的是:","o":[["A","中国男人都是感性的,比理性的西方男人要依恋母亲"],["B","不同的文化造成母亲在中西方男人心中情感地位存在差异"],["C","因成长经历不同，母亲在中西方男人心中的地位有很大差距"],["D","西方男人爱妻子胜过爱母亲,因为他们更追求独立和个人价值"]],"a":["B"],"an":"本题为细节判断题。文中明确表述了对母亲和妻子同时落水，你先救谁”这一问题，之所以会造成中西方男人不同的选择是基于中西文化的差异。因此，结合选项应该选B。A项曲解文意，这不仅与感性有关，也并不能单纯归结为更依恋母亲，而是由于中方文化的影响使母亲在中国男人的心中地位很重要;C项的成长经历问题，为无关干扰项，文段并未提及，可排除;D项曲解文意，西方男人选择营救妻子并不表示爱妻子胜过爱母亲，而是理性选择了在自己以后生活中更重要的人。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0423","type":"single","t":"哥伦比亚大学的心理学教授罗伯特·海尔曾经做过实验，发现喜欢虐待、生性残忍的人在辨识富有情感意涵的词汇与一般词汇时，脑波无明显差异，而普通人的脑波则表现出不同。进一步研究表明，前者负责辨识字的语言皮质以及负责赋予字义的边缘系统的链接出了问题。正因如此，他们的情感较常人淡薄，在面对痛苦时不会引发焦虑，甚至对于恐惧没有感受，犯罪心理学研究表明，那些暴力犯罪者通常是这种缺乏同理心的人，他们无法设身处地为别人着想或同情别人，亦很难受到良心谴责。下列说法与原文相符的是:","o":[["A","喜欢虐待、生性残忍的人没有同理心"],["B","普通人与暴力犯罪者的脑波有所不同"],["C","暴力犯罪者在辨识文字时往往存在困难"],["D","难以受到良心谴责是缺乏同理心者的特征之一"]],"a":["D"],"an":"细节判断题，与原文一一对应。A、B两项均属于概念偷换，并且是两个选项之间的互换，根据文段中，没有同理心、缺乏同理心的应是“暴力犯罪者”，而与普通人脑波不同的才是“喜欢虐待、生性残忍的人”;C项为无中生有;D项为文段尾句的同义替换，且“……之一”的表述也比较严谨。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0424","type":"single","t":"提起意大利，人们立即会联想到这里曾是文艺复兴的诞生地。米开朗基罗、波提切利和十五、十六世纪其他艺术家们不仅改变了欧洲，也重塑了文化与艺术的表达方式。时至今日，我们的建筑、视觉艺术、文学甚至部分生活理念，在一定程度上仍然受到意大利文艺复兴时期在古典遗产基础上所创造的美学形式和思考方式的影响。这段文字意在说明:","o":[["A","古典文化遗产保护的必要性"],["B","意大利文艺复兴的重要影响"],["C","当代美学形式的历史渊源"],["D","意大利艺术家的主要成就"]],"a":["B"],"an":"本题考查中心理解。文段在结构上属于分一总结构。文段第一句引入一个话题，第二句是举例部分，最后一句话是文段的主旨句，强调的是意大利文艺复兴时期对现代的影响，符合文段主要意思的答案只有B项。A、C两项文段并未提及，D项并非论述重点。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0425","type":"single","t":"不管哪种鸟，营巢都是一项十分浩大而艰巨的“工程”。在城楼，寺庙等建筑物上营巢的楼燕，需要到远处的河泥滩上衔取泥土、草棍等，然后一点一点地堆砌成碗状的巢，足足需一周时间。而金丝燕，用纯粹唾液建巢，但同样要付出含辛茹苦的劳动。这种巢窝加工之后，就是我国自古闻名于世的珍贵补品燕窝。这段文字表述的主要内容是:","o":[["A","我国自古闻名于世的珍贵补品燕窝的来历"],["B","燕子有在城楼、寺庙等建筑物上筑巢的习性"],["C","楼燕与金丝燕在生理特征及筑巢方式上的不同"],["D","鸟类艰辛的筑巢过程如同人类实施一项浩大的工程"]],"a":["D"],"an":"根据提问标志词主要内容可以判断出本题为中心理解题。阅读可知，材料整体上为总一分结构。材料首句提出观点“鸟类筑巢是一项浩大而艰巨的工程”，接下来用楼燕和金丝雀的例子来进行解释说明。因此，结合选项应该选择D。选项中只有D项表述最符合文意。其他三项都属于对观点进行解释说明的“分”的部分，而非材料的语意重点，予以排除。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0426","type":"single","t":"大数据给人类呈现的是一幅既美好又可怕的未来图景:美好之处在于,它将给我们带来更大的视野和更新的发现,进而改变我们的工作和生活方式;可怕之处在于,它给我们带来更多的风险和更大的挑战，除了数据本身的安全之外，它更多地关乎人们的隐私。与此同时，在研究和制定大数据发展的政策中，需要打破思想上的束缚，做到与时俱进，与网俱进;需要有一个强有力的集中统一指挥与协调机制;需要处理好发展与安全的辩证关系;需要主动平衡全球治理的责任权利。这段文字旨在说明:","o":[["A","大数据的政策选择要考虑发展与安全"],["B","安全问题将成为大数据应用的瓶颈"],["C","大数据应用对人们生活的影响利大于弊"],["D","大数据的安全风险应该引起足够的重视"]],"a":["A"],"an":"文段首句介绍大数据既有美好之处也有可怕之处，第二句以“与此同时”引导对策，即在制定大数据政策时，需要注意很多方面。两句对比，显然后者对策更为重要。分析选项可知,B项为问题性表述;C项属于无中生有,没有强调利大于弊;并且B、C两项并非对策表述，较易排除。而A、D两项虽均为对策，但A项是围绕大数据政策这一主题词展开，表述更为准确。故正确答案为A。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0427","type":"single","t":"光在被照射物体单位面积上所施加的压力叫光压，也被称为辐射压强。根据量子理论，光具有“波粒二象性”，它既是一种电磁波，又是一种粒子，即光子。光子没有静态质量，但有动量。当光子撞击到光滑的平面上时，可以像从墙上反弹回来的兵乓球一样改变运动方向，并给撞击物体以相应的作用力，形成光压。这段文字主要意在说明:","o":[["A","光动量"],["B","光运动"],["C","光子"],["D","光压"]],"a":["D"],"an":"本题为非典型的中心理解题。材料首先说明光压的定义，其次解释光压的形成原因和过程。因此材料重点描述的即是光压。D项正确。A、B、C项只是解释光压形成原因和过程时涉及到的术语，均不属于重点。故正确答案为D。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0428","type":"single","t":"饮食最基本的功能就在于它是人体从外界环境中吸取赖以生存的营养与能量的主要途径，是生命活动的基础与表现。纳入文化领域后，饮食就被赋予了更深的涵义。尤其是经过民族文化旅游浪潮的洗礼，()，使人们不仅仅将饮食看作是果腹的手段，而且更注重体会和欣赏饮食过程中的民族文化内涵。在欣赏自然与人文美景的同时，品尝目的地的特色饮食正成为旅游者新的追求和向往。填入划横线部分最恰当的一句是:","o":[["A","美食体验成为一种新兴的旅游项目"],["B","民族饮食文化与旅游文化逐步整合"],["C","民族特色饮食文化的潜力得到开发"],["D","饮食在文化领域中的地位愈发重要"]],"a":["B"],"an":"本题为语句填空题。横线部分位于文段中间，重点关注其与前后文之间的衔接。横线之前提及旅游浪潮，横线之后论述饮食文化，故此处应将二者结合，保持前后的顺承。观察四个选项，只有A、B两项结合了饮食与旅游。但A项中的美食体验与文段论述的民族饮食特色文化亦有明显差别，概述不够准确。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0429","type":"single","t":"回溯整条产业链，中国奶粉业的困境是上游小农经济的困境。中国处于人口出生高峰期，所需奶粉量与出产之间存在巨大的缺口，高质量的奶源是稀缺产品，尤其在草场退化，奶农自养为主的今天，传统的畜牧模式已经成为中国奶粉发展最大的掣肘。我国的奶源无法满足暴涨的市场需求，如果要保障有质量的奶源，需要将目前的小农式散养模式，转变为工业牧场式养殖模式，而这需要土地流转、农业人口分流、原始资本大量投入等诸多根本性改革，难度比恢复奶粉信用还高。这段文字意在说明中国奶粉业:","o":[["A","产业链布局上存在先天不足"],["B","从生产模式上变革困难重重"],["C","短时间内难以摆脱进口依赖"],["D","恢复自身行业信用尚待时日"]],"a":["B"],"an":"文段一开始先说从整条产业链来看，中国奶粉业的困境是上游小农经济的困境，接下来论述传统的畜牧模式已经成为中国奶粉发展最大的掣肘，最后进一步指出想要保障有质量的奶源，需要改变目前的生产模式，然而变革生产模式将要面临比恢复奶粉信用还高的难度。因此，文段意在说明中国奶粉业从生产模式上变革困难重重。B项表述与此一致。故正确答案为B。","tp":"片段阅读","d":"中"},
	{"i":"fjcs_0430","type":"single","t":"19世纪，爱默生和其他一些作家向读者传授一种称为“自助论”的理论，在这些人看来，一个有个性的人必须要有一颗充实的大脑。在这种思想的指导下，为了得到他人的尊重，有必要在闲暇时广泛涉猎文化史上的杰出著作。同时，也有必要熟悉哲学、神学和世界范围内的重大政治事件。这种风气在一个多世纪的时间里塑造了美国新闻业。在那几十年里，杂志致力于推广古典歌剧、高雅艺术和宗教神学，而不是电影或大众健康常识。这段文字意在说明:","o":[["A","广泛阅读可以充实我们的大脑"],["B","主流媒体有引导大众品位的责任"],["C","新闻媒体是主流文化观的集中体现"],["D","自助论为美国新闻业的发展提供了方向"]],"a":["D"],"an":"文段开篇讲到“自助论”并介绍了其具体内容，接下来说“这种风气在一个多世纪的时间里塑造了美国新闻业”即本文主旨所在，最后一句是进一步展开解释说明。结合选项可知，D项“自助论为美国新闻业的发展提供了方向”是对文段主旨的准确概括。A项中的“广泛阅读充实我们的大脑”是文段前两句话讨论的内容,不是重点;B项属于无中生有,文段并没有提及此意;C项缺少“自助论”这一主题词,排除。故正确答案为D。","tp":"片段阅读","d":"中"},

	{"i":"fjcs_0432","type":"single","t":"10张卡片上分别写着从1到10的自然数，小王和小张分别从中抽出两张卡，\n并计算其中较大数字除以较小数字的结果，小王先抽，他抽到的卡片是3和9，小张在剩下\n卡片中抽取，计算出的结果比小王计算的结果大的概率：","o":[["A","小于20%"],["B","在30%到40%之间"],["C","在20%到30%之间"],["D","大于40%"]],"a":["B"],"an":"小王抽取的卡片数字为3和9，二者之商为3，小张要在剩下的卡片中抽出两张卡\n片数字之商大于3，有以下两种情况：\n当抽取的其中一张卡片数字为1时，另一张卡片可以为：4、5、6、7、8、10，共6种情况；\n当抽取的其中一张卡片数字为2时，另一张卡片可以为：7、8、10，共3种情况；\n在剩下的8张卡片中随机抽取2张，共 种情况。故小张的计算结果大于小王的概率\n为： 。\n故正确答案为B。","tp":"数学运算","d":"中"},
	{"i":"fjcs_0433","type":"single","t":"货车A由甲城开往乙城，货车B由乙城开往甲城，它们同时出发并以各自恒\n定的速度行驶，在途中第一次相遇时，它们离甲城为35千米。相遇后两车继续以原来的速\n度行驶至目的地城市后立即折返，途中再一次相遇，这时它们离乙城为25千米。则甲乙两\n城相距多少千米：","o":[["A","80"],["B","85"],["C","90"],["D","95"]],"a":["A"],"an":"第一次相遇时，两车共行走了一个全程；第二次相遇时，两车共行走了三个全程。\n第二次相遇所走路程是第一次相遇所走路程的3倍，所走时间与速度不变，故甲第二次相遇\n所走的路程也是第一次相遇所走路程的3倍。第一相遇时，甲走了35千米，则在第二次相\n遇时甲共走了35*3=105千米，这时离乙地25千米，则全程共105-25=80千米。\n故正确答案为A。","tp":"数学运算","d":"中"},

	{"i":"fjcs_0435","type":"single","t":"某科学兴趣小组在进行一项科学实验，从装满100克浓度为80％的盐水中倒\n出40克盐水后，再倒入清水将杯倒满，搅拌后再倒出40克盐水，然后再倒入清水将杯倒满，\n这样反复三次后，杯中盐水的浓度是：","o":[["A","11.52%"],["B","17.28%"],["C","28.8%"],["D","48%"]],"a":["B"],"an":"每次倒出40克盐水再加满清水，相当于倒出去总溶液量的40%再稀释，相当于每\n次减少溶质的40%，留下溶质的60%，因此每次操作后浓度均为未操作之前的浓度的60%。\n由此可知，这样反复三次后，杯中盐水的浓度为80%×60%×60%×60%＝17.28%。\n故正确答案为B。","tp":"数学运算","d":"中"},

	{"i":"fjcs_0437","type":"single","t":"一艘从广州开往大连的货轮，沿途依次在上海、青岛、天津停靠。出发时船\n上装满有240个集装箱，每次停靠都只装所停靠城市的集装箱，卸下其他城市的集装箱，每\n个城市的集装箱在沿途停靠的每个港口卸下数量相同，且每次离港时货轮都保持满载。则货\n轮到达大连时，船上有多少个天津的集装箱：","o":[["A","20"],["B","40"],["C","60"],["D","120"]],"a":["D"],"an":"由题干可知，每个城市的集装箱在沿途停靠的每个港口卸下数量相同的集装箱，因\n此可知广州的240个集装箱在此后的每个城市均卸下60个，即在上海港口将卸下60个集\n装箱。而每次离港时货轮要保持满载，因此上海港口要装上60个集装箱。由此继续，可知\n完成过程如下表所示：\n因此在达到大连港口时，船上有120个天津的集装箱。\n故正确答案为D。","tp":"数学运算","d":"中"},
	{"i":"fjcs_0438","type":"single","t":"把若干个大小相同的水立方摆成如图形状，从上向下数，摆1层有1个立方\n体，摆2层共有4个立方体，摆3层共有10个立方体，问摆7层共有多少个立方体：","o":[["A","60"],["B","64"],["C","80"],["D","84"]],"a":["D"],"an":"第一层有1个，第二层有1＋2＝3个，第三层有1＋2＋3＝6个，第四层有1+2\n＋3＋4＝10个，……第n层有1＋2＋3……＋n个。所以7层共有\n个。\n故正确答案为D。","tp":"数学运算","d":"中"},
	{"i":"fjcs_0439","type":"single","t":"在2011年世界产权组织公布的公司全球专利申请排名中，中国中兴公司提交\n了2826项专利申请，日本松下公司申请了2463项，中国华为公司申请了1831项，分别排\n名前3位，从这三个公司申请的专利中至少拿出多少项专利，才能保证拿出的专利一定有\n2110项是同一公司申请的专利：","o":[["A","6049"],["B","6050"],["C","6327"],["D","6328"]],"a":["B"],"an":"要保证拿出的专利一定有2110项是同一公司申请的专利，考虑最不利情况，拿出\n了中国华为公司申请的1831项、日本松下公司的2109项、中国中兴公司的2109项，在此\n极端情况下依然不满足条件。此时，华为公司已全部拿出，从剩下的两个公司任意拿出一项，\n均满足条件“保证拿出的专利一定有2110项是同一公司申请的专利”，故至少需要拿出1831\n＋2109＋2109＋1，相加尾数为0，只有B项正确。\n故正确答案为B。","tp":"数学运算","d":"中"},
	{"i":"fjcs_0440","type":"single","t":"A、B、C三支施工队在王庄和李庄修路，王庄要修路900米，李庄要修路1250\n米。已知A、B、C队每天分别能修24米、30米、32米，A、C队分别在王庄和李庄修路，\nB队先在王庄，施工若干天后转到李庄，两地工程同时开始同时结束。\n问B队在王庄工作了几天：","o":[["A","9"],["B","10"],["C","11"],["D","12"]],"a":["B"],"an":"两个工程的总工作量 ；三支队伍的总效率为 ，\n则完成任务一共用时 。25天中，A一共完成工作量 ，剩余工作\n量 由B完成，则B在王庄工作了 。\n故正确答案为B。","tp":"数学运算","d":"中"},
	{"i":"fjcs_0441","type":"single","t":"某次知识竞赛的决赛有3人参加，规则为12道题每题由1人以抢答方式答\n题，正确得10分，错误扣8分，如果最后所有人得分都是正分，且回答问题最多的人是得\n分最少的人，那么前两名之间的分差最多为多少分？","o":[["A","8"],["B","12"],["C","20"],["D","40"]],"a":["D"],"an":"因3人共回答12道题，故回答最多的人至少回答12÷3＋1＝5题，而此人的得分\n最少，故可构造为错2题，对3题，此人得分14分；依此，第二名应构造为回答2题且全\n答对，得分20分；第三名应构造为回答5题且全对，得分50分，此时前两名分差较大。\n则第一名比第二名多了50－20＝30分，排除ABC三项。\n验证D项：要让前两名的分差尽可能的大，则应让第二名的分数尽可能的少，且还应高于\n第三名，故应让第三名的得分尽可能的少。第三名得分相对较少的构造为错3题，对3题，\n得分6分；则第二名只需答对1道题，得分10分，第一名依旧为5道题全部答对，得分50\n分，前两名的分差＝50－10＝40分。\n故正确答案为D。","tp":"数学运算","d":"中"},

	{"i":"fjcs_0498","type":"single","t":"两个半径不同的圆柱形玻璃杯内盛有一定量的水，甲杯的水位比乙杯高5厘\n米。甲杯底部沉没着一个石块，当石块被取出并放进乙杯沉没后，乙杯的水位上升了5厘米，\n并且比这时甲的水位还高10厘米，则可得知甲杯与乙杯底面积之比为：","o":[["A","3∶2"],["B","1∶2"],["C","2∶3"],["D","3∶5"]],"a":["B"],"an":"石块未取出前，甲杯的水位比乙杯高5厘米；当石块被取出放进乙杯后，乙杯的\n水位上升了5厘米，而此时乙杯的水位比甲高10厘米。可知整个过程甲杯的水位下降了10\n厘米。甲杯下降的10厘米高度的体积，与乙杯上涨的5厘米高度的体积，均为石块的体积，\n故其底面积之比应为二者体积高度的反比，为5:10，即1:2。\n故正确答案为B。","tp":"数学运算","d":"中"},

	{"i":"fjcs_0513","type":"single","t":"某盐溶液100克，加入20克水稀释，浓度变为50%，然后加入80克浓度为\n25%的盐溶液，此时，混合后的盐溶液浓度为：\n A. 30%\n B. 40%\n C. 45%\n D. 50%","o":[["A",""],["B",""],["C",""],["D",""]],"a":["B"],"an":"由题意可得混合后溶液中溶质即盐质量为（100 + 20）\n×50% + 80×25% = 60 + 20 = 80 克，混合后溶液质量为 100 + 20 + 80 = 200 克。所以\n混合后浓度为 80÷200 = 40%。\n巧算：根据线段法，混合前浓度写两边（默认左小右大），混合溶液质量之比等于混合后浓\n度与两边浓度距离的反比，溶液质量之比为 80 :120 = 2 :3，把线段分为 5 段，每一段\n为（50% - 25%）÷5 = 5%，与线段左侧相比，混合后浓度为 25% + 3×5% = 40%。\n故正确答案为B。","tp":"数学运算","d":"中"},
