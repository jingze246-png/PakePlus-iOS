<script>

/* ================= 数据存储层 =================
 * 主存储：localStorage（同步、可靠、杀进程安全）
 * 多标签页：通过 tabId 检测，禁止多开
 */
const DB = (() => {
  const KEY = 'pwd_exam_v1';
  const TAB_KEY = 'pwd_exam_tab';
  let state = null;
  function blank() {
    return {
      version: 2,
      banks: [],
      activeBankId: null,
      progress: {},
      done: {},
      wrong: {},
      fav: {},
      exams: [],
      settings: {
        autoNext: true,          // 答对后自动跳转
        autoNextDelay: 0.7,      // 答对后延迟秒数
        autoNextWrong: false,    // 答错后是否也自动跳转
        autoNextWrongDelay: 2,   // 答错后延迟秒数
        showAnalysis: true,
        shuffleOptions: false,
        theme: 'light',          // light | dark | eye
        confirmSingle: false     // 单选/判断是否也需要点确认
      }
    };
  }
  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : blank();
      const b = blank();
      for (const k in b) if (state[k] === undefined) state[k] = b[k];
      // 设置项补全（新增字段）
      for (const k in b.settings) if (state.settings[k] === undefined) state.settings[k] = b.settings[k];
      /* 旧数据迁移：单条进度 -> 分槽；并从已有答案回填「已练题」累计 */
      if (!state.done || typeof state.done !== 'object') state.done = {};
      /* v3 迁移：内置题库改为常量直读，清掉旧版存进 localStorage 的内置题库（省空间、防重复） */
      if (Array.isArray(state.banks)) {
        state.banks = state.banks.filter(b => b && !b.builtin);
      }
      for (const bid in state.progress) {
        const v = state.progress[bid];
        if (v && v.qids) state.progress[bid] = { main: v };
        const m = state.progress[bid] || {};
        if (!state.done[bid]) {
          const d = {};
          for (const sl in m) {
            const p = m[sl];
            if (p && p.answers) {
              for (const qid in p.answers) {
                if (p.answers[qid] && p.answers[qid].length) d[qid] = 1;
              }
            }
          }
          state.done[bid] = d;
        }
      }
    } catch (e) {
      state = blank();
    }
    return state;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      console.error('保存失败', e);
      return false;
    }
  }
  /* ---------- 题库 ---------- */
  /* ===== 题库：内置题库(常量) + 导入题库(localStorage) ===== */
  function getBuiltins() {
    return (typeof BUILTIN_BANKS !== 'undefined' && Array.isArray(BUILTIN_BANKS)) ? BUILTIN_BANKS : [];
  }
  function addBank(bank) {
    load();
    // 内置题库不入库（常量直读）
    if (bank.builtin) return bank;
    const idx = state.banks.findIndex(b => b.id === bank.id);
    if (idx >= 0) state.banks[idx] = bank;
    else state.banks.push(bank);
    if (!state.activeBankId) state.activeBankId = bank.id;
    save();
    return bank;
  }
  function getBanks() { load(); return getBuiltins().concat(state.banks); }
  function getBank(id) {
    if (!id) return null;
    const b = getBuiltins().find(x => x.id === id);
    if (b) return b;
    load();
    return state.banks.find(x => x.id === id);
  }
  function getActiveBank() {
    const banks = getBanks();
    if (!banks.length) return null;
    let a = getBank(load().activeBankId);
    // 兜底：上次用的题库不存在了（比如删了导入题库），自动落到第一个
    if (!a) { a = banks[0]; state.activeBankId = a.id; }
    return a;
  }
  function setActiveBank(id) { load().activeBankId = id; save(); }
  function removeBank(id) {
    load();
    if (getBuiltins().some(b => b.id === id)) return false;  // 内置题库不可删
    state.banks = state.banks.filter(b => b.id !== id);
    delete state.progress[id];
    delete state.done[id];
    delete state.wrong[id];
    delete state.fav[id];
    if (state.activeBankId === id) state.activeBankId = (getBanks()[0] || {}).id || null;
    save();
    return true;
  }
  /* ---------- 进度（按模式分槽，互不覆盖） ---------- */
  /* 每个题库下按模式各存一份进度：
     main=顺序练习  cat=分类练习  wrong=错题重做  fav=收藏练习  exam=模拟考试
     旧版单条进度会在 load() 时自动迁移到 main 槽。 */
  function normProg(bid) {
    let v = state.progress[bid];
    if (!v) { v = {}; state.progress[bid] = v; return v; }
    if (v.qids) { v = { main: v }; state.progress[bid] = v; }
    return v;
  }
  function getProgress(bankId, slot) {
    load();
    return normProg(bankId)[slot || 'main'] || null;
  }
  function getAllProgress(bankId) { load(); return normProg(bankId); }
  /* 取最近一次更新的进度（首页「继续上次」用） */
  function getResume(bankId) {
    load();
    const m = normProg(bankId);
    let best = null, bestSlot = null;
    for (const k in m) {
      const p = m[k];
      if (!p || !p.qids || !p.qids.length) continue;
      if (!best || (p.updateTime || 0) > (best.updateTime || 0)) { best = p; bestSlot = k; }
    }
    if (!best) return null;
    const out = {};
    for (const k in best) out[k] = best[k];
    out._slot = bestSlot;
    return out;
  }
  function setProgress(bankId, p, slot) {
    load();
    normProg(bankId)[slot || 'main'] = p;
    save();
  }
  function clearProgress(bankId, slot) {
    load();
    if (slot) { delete normProg(bankId)[slot]; }
    else { delete state.progress[bankId]; }
    save();
  }
  /* ---------- 已练题累计（不随进度槽清空而丢失） ---------- */
  function getDone(bankId) { return load().done[bankId] || {}; }
  function markDone(bankId, qid) {
    load();
    if (!state.done[bankId]) state.done[bankId] = {};
    if (!state.done[bankId][qid]) { state.done[bankId][qid] = 1; save(); }
  }
  function clearDone(bankId) { load(); delete state.done[bankId]; save(); }
  /* ---------- 错题 ---------- */
  function addWrong(bankId, qid, myAnswer) {
    load();
    if (!state.wrong[bankId]) state.wrong[bankId] = {};
    const w = state.wrong[bankId][qid] || { count: 0 };
    w.count = (w.count || 0) + 1;
    w.lastTime = Date.now();
    w.myAnswer = myAnswer;
    state.wrong[bankId][qid] = w;
    save();
  }
  function removeWrong(bankId, qid) {
    load();
    if (state.wrong[bankId]) { delete state.wrong[bankId][qid]; save(); }
  }
  function getWrong(bankId) { return load().wrong[bankId] || {}; }
  function clearWrong(bankId) { load(); state.wrong[bankId] = {}; save(); }
  /* ---------- 收藏 ---------- */
  function toggleFav(bankId, qid) {
    load();
    if (!state.fav[bankId]) state.fav[bankId] = [];
    const arr = state.fav[bankId];
    const i = arr.indexOf(qid);
    if (i >= 0) { arr.splice(i, 1); save(); return false; }
    arr.push(qid); save(); return true;
  }
  function isFav(bankId, qid) { return (load().fav[bankId] || []).includes(qid); }
  function getFav(bankId) { return load().fav[bankId] || []; }
  /* ---------- 考试记录 ---------- */
  function addExam(rec) {
    load();
    state.exams.unshift(rec);
    if (state.exams.length > 50) state.exams = state.exams.slice(0, 50);
    save();
  }
  function getExams() { return load().exams; }
  /* ---------- 设置 ---------- */
  function getSettings() { return load().settings; }
  function setSetting(k, v) { load().settings[k] = v; save(); }
  /* ---------- 多标签页检测 ---------- */
  function claimTab() {
    const myId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const existing = localStorage.getItem(TAB_KEY);
    // 5 秒内的心跳视为活跃
    if (existing) {
      try {
        const o = JSON.parse(existing);
        if (o.id && o.ts && Date.now() - o.ts < 5000 && o.id !== myId) {
          return { ok: false, other: o.id };
        }
      } catch (e) {}
    }
    localStorage.setItem(TAB_KEY, JSON.stringify({ id: myId, ts: Date.now() }));
    // 心跳
    setInterval(() => {
      localStorage.setItem(TAB_KEY, JSON.stringify({ id: myId, ts: Date.now() }));
    }, 2000);
    // 关闭时释放
    window.addEventListener('beforeunload', () => {
      const cur = localStorage.getItem(TAB_KEY);
      try {
        if (cur && JSON.parse(cur).id === myId) localStorage.removeItem(TAB_KEY);
      } catch (e) {}
    });
    return { ok: true, id: myId };
  }
  return {
    load, save, blank,
    addBank, getBanks, getBank, getActiveBank, setActiveBank, removeBank,
    getProgress, getAllProgress, getResume, setProgress, clearProgress,
    getDone, markDone, clearDone,
    addWrong, removeWrong, getWrong, clearWrong,
    toggleFav, isFav, getFav,
    addExam, getExams,
    getSettings, setSetting,
    claimTab
  };
})();
/* ================= 工具函数 ================= */
const Util = {
  typeName(t) { return { single: '单选题', multi: '多选题', judge: '判断题', essay: '实操题' }[t] || '题目'; },
  tagName(g) {
    const m = {
          law_base:'法律基础',
          criminal:'刑法',
          civil:'民法',
          admin:'行政法',
          police:'公安基础知识',
          auxiliary:'辅警职业',
          public:'公共基础知识',
          document:'公文写作',
          current:'时政热点',
          ethics:'职业道德',
          traffic:'交通管理',
          procedure:'诉讼法',
          base: '综合常识'
        };
    return m[g] || g;
  },
  fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  },
  fmtDate(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
  },
  checkAnswer(q, myAnswer) {
    // 实操题：无标准答案，用自评结果（A=我答对了 / B=我答错了）
    if (q.t === 'essay') return !!(myAnswer && myAnswer[0] === 'A');
    const a = [...q.a].sort().join(',');
    const b = [...(myAnswer || [])].sort().join(',');
    return a === b && a !== '';
  },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  toast(msg, ms = 1600) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast'; el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), ms);
  },
  esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
};
/* ================= 主题 ================= */
const Theme = {
  apply(name) {
    document.body.setAttribute('data-theme', name);
    DB.setSetting('theme', name);
    // 更新 meta theme-color
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.content = name === 'dark' ? '#121418' : name === 'eye' ? '#c7e0c8' : '#2b6de5';
    }
  },
  init() {
    const t = DB.getSettings().theme || 'light';
    document.body.setAttribute('data-theme', t);
  },
  set(name) {
    this.apply(name);
  }
};

</script>
<script>

/* ================= 全局状态 ================= */
const App = {
  route: 'home',
  bank: null,
  session: null,
  examTimer: null,
  history: [],
  _navigating: false
};
/* ================= 路由（修复返回失效） ================= */
const Router = {
  go(name, params = {}) {
    // 允许重入：同一帧内连续跳转时，以最后一次为准
    if (App._navigating) {
      App._pendingRoute = { name, params };
      return;
    }
    App._navigating = true;
    // 只有真正换页才压栈
    if (App.route && App.route !== name) {
      App.history.push(App.route);
      if (App.history.length > 30) App.history.shift();
    }
    App.route = name;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = document.getElementById('page-' + name);
    if (el) el.classList.add('active');
    try { window.scrollTo(0, 0); } catch (e) {}
    const fn = Pages[name];
    if (fn) {
      try { fn(params); } catch (e) { console.error('页面渲染失败', name, e); }
    }
    App._navigating = false;
    // 处理渲染期间产生的跳转请求
    if (App._pendingRoute) {
      const p = App._pendingRoute;
      App._pendingRoute = null;
      Router.go(p.name, p.params);
    }
  },
  back() {
    // 答题页返回：先确认是否退出练习
    if (App.route === 'quiz' && App.session) {
      if (!confirm('退出当前练习？进度会自动保存，下次可继续。')) return;
      // 背题模式不保存进度（避免污染继续练习入口）
      if (App.session.mode !== 'review') {
        Quiz.saveProgress();
      }
      App.session = null;
      clearInterval(App.examTimer);
    }
    let prev = App.history.pop();
    // 过滤无效目标：空、自身、中转页
    while (prev && (prev === App.route || prev === 'practice' || prev === 'result')) {
      prev = App.history.pop();
    }
    if (!prev) prev = 'home';
    App.route = '';
    Router.go(prev);
  },
  home() {
    App.history = [];
    App.route = '';
    Router.go('home');
  }
};
/* ================= 顶栏 ================= */
function setTopbar(title, opts = {}) {
  const bar = document.getElementById('topbar');
  bar.innerHTML = `
    ${opts.noBack ? '<div style="width:34px"></div>' : '<div class="back" id="topBack">‹</div>'}
    <div class="title">${Util.esc(title)}</div>
    <div class="action" id="topAction">${opts.action || ''}</div>
  `;
  const backEl = document.getElementById('topBack');
  if (backEl) backEl.onclick = () => Router.back();
  if (opts.onAction) {
    const a = document.getElementById('topAction');
    if (a) a.onclick = opts.onAction;
  }
}
/* ================= 页面 ================= */
const Pages = {};
/* ---------- 首页 ---------- */
Pages.home = function () {
  setTopbar('刷题', { noBack: true });
  const bank = DB.getActiveBank();
  if (!bank) {
    document.getElementById('page-home').innerHTML = `
      <div class="empty">
        <div class="e-ico">📚</div>
        <p>还没有题库</p>
        <button class="btn btn-primary" style="max-width:200px;margin:16px auto 0" onclick="Router.go('import')">导入题库</button>
      </div>`;
    return;
  }
  const qs = bank.questions;
  const prog = DB.getResume(bank.id);
  const wrong = DB.getWrong(bank.id);
  const fav = DB.getFav(bank.id);
  const wrongCount = Object.keys(wrong).length;
  const doneCount = Object.keys(DB.getDone(bank.id)).length;
  const pct = qs.length ? Math.round(doneCount / qs.length * 100) : 0;
  const theme = DB.getSettings().theme || 'light';
  let resumeHtml = '';
  // 只要有进度记录（哪怕还没答题），就显示继续入口
  if (prog && prog.qids && prog.qids.length && prog.mode !== 'review') {
    const modeName = { seq: '顺序练习', type: '分类练习', tag: '分类练习', wrong: '错题重做', fav: '收藏练习', exam: '模拟考试', review: '背题模式' }[prog.mode] || '练习';
    const cur = Math.min(prog.index + 1, prog.qids.length);
    resumeHtml = `
      <div class="resume-bar" onclick="Resume.continue()">
        <div class="ico">▶️</div>
        <div class="info">
          <b>继续上次：${modeName}</b>
          <span>第 ${cur} / ${prog.qids.length} 题 · ${Util.fmtDate(prog.updateTime || Date.now())}</span>
        </div>
        <div class="go">继续</div>
      </div>`;
  }
  document.getElementById('page-home').innerHTML = `
    <div class="hero">
      <div class="theme-switch">
        <i class="${theme === 'light' ? 'on' : ''}" onclick="Theme.set('light');Pages.home()" title="默认">☀️</i>
        <i class="${theme === 'eye' ? 'on' : ''}" onclick="Theme.set('eye');Pages.home()" title="护眼">🌿</i>
        <i class="${theme === 'dark' ? 'on' : ''}" onclick="Theme.set('dark');Pages.home()" title="夜间">🌙</i>
      </div>
      <div class="bank-switch" onclick="Pages.bankPicker()">
        <h1>${Util.esc(bank.name)}</h1>
        ${DB.getBanks().length > 1 ? '<span class="bs-arrow">切换 ▾</span>' : ''}
      </div>
      ${bank.subtitle ? `<p class="hero-sub">${Util.esc(bank.subtitle)}</p>` : ''}
      <p>共 ${qs.length} 题 · 已完成 ${doneCount} 题（${pct}%）</p>
      <div class="hero-stats">
        <div class="hero-stat"><b>${qs.length}</b><span>总题数</span></div>
        <div class="hero-stat"><b>${doneCount}</b><span>已练习</span></div>
        <div class="hero-stat"><b>${wrongCount}</b><span>错题</span></div>
        <div class="hero-stat"><b>${fav.length}</b><span>收藏</span></div>
      </div>
    </div>
    ${resumeHtml}
    <div class="grid">
      <div class="grid-item" onclick="Router.go('practice')">
        <div class="gi" style="background:var(--primary-light);color:var(--primary)">📝</div><span>顺序练习</span>
      </div>
      <div class="grid-item" onclick="Router.go('category')">
        <div class="gi" style="background:var(--warn-light);color:var(--warn)">🗂️</div><span>分类刷题</span>
      </div>
      <div class="grid-item" onclick="Router.go('exam-setup')">
        <div class="gi" style="background:var(--success-light);color:var(--success)">⏱️</div><span>模拟考试</span>
      </div>
      <div class="grid-item" onclick="Router.go('wrong')">
        <div class="gi" style="background:var(--danger-light);color:var(--danger)">❌</div><span>错题本</span>
      </div>
      <div class="grid-item" onclick="Router.go('fav')">
        <div class="gi" style="background:var(--warn-light);color:var(--warn)">⭐</div><span>我的收藏</span>
      </div>
      <div class="grid-item" onclick="Router.go('review')">
        <div class="gi" style="background:var(--success-light);color:var(--success)">📖</div><span>背题模式</span>
      </div>
      <div class="grid-item" onclick="Router.go('exams')">
        <div class="gi" style="background:var(--primary-light);color:var(--primary)">📊</div><span>考试记录</span>
      </div>
      <div class="grid-item" onclick="Router.go('import')">
        <div class="gi" style="background:var(--input-bg);color:var(--text-2)">📥</div><span>导入题库</span>
      </div>
    </div>
    <div class="list-group" style="margin-top:14px">
      <div class="list-item" onclick="Router.go('banks')">
        <div class="li-ico" style="background:var(--primary-light)">📚</div>
        <div class="li-main"><b>题库管理</b><span>当前 ${DB.getBanks().length} 个题库</span></div>

/* ---------- 继续上次 ---------- */
const Resume = {
  continue() {
    const bank = DB.getActiveBank();
    const prog = DB.getResume(bank.id);
    if (!prog) return Util.toast('没有可恢复的进度');
    if (prog.mode === 'exam') Exam.resume(prog);
    else Quiz.start(prog.mode, prog.qids, prog.index, prog.answers, prog);
  },
  /* 恢复指定模式的进度槽 */
  slot(name) {
    const bank = DB.getActiveBank();
    const prog = DB.getProgress(bank.id, name);
    if (!prog || !prog.qids || !prog.qids.length) return false;
    if (prog.mode === 'exam') Exam.resume(prog);
    else Quiz.start(prog.mode, prog.qids, prog.index, prog.answers, {
      slot: name, startTime: prog.startTime, marks: prog.marks
    });
    return true;
  }
};
/* ---------- 分类刷题 ---------- */
Pages.category = function () {
  setTopbar('分类刷题');
  const bank = DB.getActiveBank();
  const qs = bank.questions;
  const doneSet = new Set(Object.keys(DB.getDone(bank.id)));
  const byType = {}, byTopic = {}, byTag = {};
  qs.forEach(q => {
    (byType[q.t] || (byType[q.t] = [])).push(q);
    if (q.tp) (byTopic[q.tp] || (byTopic[q.tp] = [])).push(q);
    (q.g || ['base']).forEach(g => (byTag[g] || (byTag[g] = [])).push(q));
  });
  const TYPE_ICON = { single: '①', multi: '☑', judge: '✓', essay: '✍️' };
  const TYPE_ORDER = ['single', 'multi', 'judge', 'essay'];
  const row = (arr, label, icon, bg, color, onclick) => {
    const done = arr.filter(q => doneSet.has(q.i)).length;
    const pct = arr.length ? Math.round(done / arr.length * 100) : 0;
    return `<div class="list-item" onclick="${onclick}">
      <div class="li-ico" style="background:var(--${bg});color:var(--${color})">${icon}</div>
      <div class="li-main">
        <b>${Util.esc(label)}</b>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <div class="progress" style="flex:1"><i style="width:${pct}%"></i></div>
          <span style="font-size:11px;color:var(--text-3)">${done}/${arr.length}</span>
        </div>
      </div>
      <div class="li-arrow">›</div>
    </div>`;
  };
  const typeRows = TYPE_ORDER.filter(t => byType[t] && byType[t].length)
    .map(t => row(byType[t], Util.typeName(t), TYPE_ICON[t] || '•',
      t === 'essay' ? 'danger-light' : (t === 'multi' ? 'warn-light' : (t === 'judge' ? 'success-light' : 'primary-light')),
      t === 'essay' ? 'danger' : (t === 'multi' ? 'warn' : (t === 'judge' ? 'success' : 'primary')),
      `Quiz.startByFilter('type','${t}')`)).join('');
  const topicKeys = Object.keys(byTopic).sort((a, b) => byTopic[b].length - byTopic[a].length);
  const topicRows = topicKeys.map(tp => row(byTopic[tp], tp, '🎯', 'input-bg', 'text-2',
    `Quiz.startByFilter('topic',${JSON.stringify(tp)})`)).join('');
  const tagRows = Object.keys(byTag).sort((a, b) => byTag[b].length - byTag[a].length)
    .map(g => row(byTag[g], Util.tagName(g), '#', 'input-bg', 'text-2', `Quiz.startByFilter('tag','${g}')`)).join('');
  document.getElementById('page-category').innerHTML = `
    <div class="sec-title">按题型</div>
    <div class="list-group">${typeRows || '<div class="empty"><p>暂无题目</p></div>'}</div>
    ${topicKeys.length ? `<div class="sec-title">按专项（${topicKeys.length}）</div>
    <div class="list-group">${topicRows}</div>` : ''}
    <div class="sec-title">按主题</div>
    <div class="list-group">${tagRows}</div>
    <div style="height:20px"></div>
  `;
};
Pages.practice = function () {
  // practice 是纯跳转页，不留在历史栈（避免返回时回到空页面）
  App.history = App.history.filter(h => h !== 'practice');
  const bank = DB.getActiveBank();
  if (!bank || !bank.questions.length) return Util.toast('题库为空');
  // 关键：只查「顺序练习」自己的进度槽，错题本/收藏练习不会互相覆盖
  const prog = DB.getProgress(bank.id, 'main');
  if (prog && prog.qids && prog.qids.length && prog.mode !== 'review') {
    const modeName = { seq: '顺序练习', type: '分类练习', tag: '分类练习', wrong: '错题重做', fav: '收藏练习', exam: '模拟考试' }[prog.mode] || '练习';
    const cur = Math.min(prog.index + 1, prog.qids.length);
    const msg = `检测到已有练习进度：\n\n${modeName} · 第 ${cur} / ${prog.qids.length} 题\n\n将从该进度继续。\n\n如需重新开始，请到「设置 → 清除当前刷题进度」。`;
    if (confirm(msg)) {
      Resume.slot('main');
    } else {
      // 取消则回首页，保持原进度不变
      Router.home();
    }
    return;
  }
  // 无进度，正常开始
  Quiz.start('seq', bank.questions.map(q => q.i), 0, {});
};

        <div class="li-ico" style="background:var(--success-light)">💾</div>
        <div class="li-main"><b>导出学习数据</b><span>备份进度、错题、收藏</span></div>
        <div class="li-arrow">›</div>
      </div>
      <div class="list-item" onclick="Settings.importData()">
        <div class="li-ico" style="background:var(--primary-light)">📂</div>
        <div class="li-main"><b>导入学习数据</b><span>从备份恢复（换机 / 重装后）</span></div>
        <div class="li-arrow">›</div>
      </div>
      <div class="list-item" onclick="Settings.resetAll()">
        <div class="li-ico" style="background:var(--danger-light);color:var(--danger)">⚠️</div>
        <div class="li-main"><b style="color:var(--danger)">清空全部数据</b><span>恢复初始状态</span></div>
        <div class="li-arrow">›</div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--text-3);padding:20px">刷题 v2.0 · 离线版</div>
  `;
};
const Settings = {
  progressDesc() {
    const bank = DB.getActiveBank();
    if (!bank) return '暂无题库';
    const prog = DB.getResume(bank.id);
    if (!prog || !prog.qids || !prog.qids.length) return '当前无未完成进度';
    const modeName = { seq: '顺序练习', type: '分类练习', tag: '分类练习', wrong: '错题重做', fav: '收藏练习', exam: '模拟考试' }[prog.mode] || '练习';
    const cur = Math.min(prog.index + 1, prog.qids.length);
    return `${modeName} · 第 ${cur}/${prog.qids.length} 题`;
  },
  clearProgress() {
    const bank = DB.getActiveBank();
    if (!bank) return Util.toast('暂无题库');
    const prog = DB.getResume(bank.id);
    if (!prog || !prog.qids || !prog.qids.length) return Util.toast('当前没有未完成进度');
    const modeName = { seq: '顺序练习', type: '分类练习', tag: '分类练习', wrong: '错题重做', fav: '收藏练习', exam: '模拟考试' }[prog.mode] || '练习';
    const cur = Math.min(prog.index + 1, prog.qids.length);
    if (confirm(`确定清除全部练习进度？\n\n${modeName} · 第 ${cur}/${prog.qids.length} 题\n\n清除后，下次点「顺序练习」将从第 1 题重新开始。\n（错题本、收藏、考试记录不受影响）`)) {
      DB.clearProgress(bank.id);
      DB.clearDone(bank.id);
      App.session = null;
      clearInterval(App.examTimer);
      Util.toast('进度已清除');
      Pages.settings();
    }
  },
  /* 导出学习数据：优先原生桥；否则弹窗显示可复制的 JSON（WebView 里最可靠） */
  exportData() {
    const raw = localStorage.getItem('pwd_exam_v1') || '{}';
    let pretty = raw;
    try { pretty = JSON.stringify(JSON.parse(raw), null, 1); } catch (e) {}
    // 1) 原生桥
    if (window.AndroidBridge && typeof window.AndroidBridge.exportData === 'function') {
      try { window.AndroidBridge.exportData(raw); Util.toast('已导出到手机文件'); return; } catch (e) {}
    }
    // 2) 尝试下载
    let downloaded = false;
    try {
      const blob = new Blob([raw], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '刷题备份_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      downloaded = true;
    } catch (e) {}
    // 3) 兜底：弹窗展示，可复制
    const sizeKb = Math.round(raw.length / 1024);
    showSheet('导出学习数据', `
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.75;margin-bottom:10px">
        ${downloaded ? '已尝试生成备份文件。若手机「下载」目录里没找到，' : ''}
        请点击下方「📋 复制全部」，把内容粘到微信收藏 / 备忘录 / 记事本里存好。
        <br><span style="color:var(--text-3)">备份大小约 ${sizeKb} KB，卸载重装后到「导入学习数据」粘贴回来即可。</span>
      </div>
      <textarea id="expArea" readonly style="width:100%;height:200px;border:1px solid var(--border);
        border-radius:8px;padding:10px;font-size:11px;font-family:monospace;background:var(--input-bg);
        color:var(--text-2);resize:none;outline:none" onclick="this.select()">${Util.esc(raw)}</textarea>
      <div style="display:flex;gap:9px;margin-top:10px">
        <button class="btn btn-primary" style="flex:1" onclick="Settings.copyBackup()">📋 复制全部</button>
        <button class="btn btn-ghost" style="flex:1" onclick="hideSheet()">关闭</button>
      </div>
    `);
    setTimeout(() => {
      const ta = document.getElementById('expArea');
      if (ta) ta.scrollTop = 0;
    }, 60);
  },
  copyBackup() {
    const ta = document.getElementById('expArea');
    if (!ta) return;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(ta.value).then(
        () => Util.toast('已复制到剪贴板'),
        () => Util.toast('请长按文本框手动全选复制')
      );
      return;
    }
    Util.toast(ok ? '已复制到剪贴板' : '请长按文本框手动全选复制');
  },
  /* 导入学习数据：粘贴 JSON 恢复 */
  importData() {
    showSheet('导入学习数据', `
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.75;margin-bottom:10px">
        把之前「导出学习数据」复制的内容整段粘到下面，点「开始恢复」。
        <br><span style="color:var(--danger);font-size:11.5px">⚠️ 恢复会覆盖当前进度、错题、收藏和考试记录。</span>
      </div>
      <textarea id="impArea" placeholder="在此粘贴备份内容（以 { 开头）" style="width:100%;height:180px;
        border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;
        font-family:monospace;background:var(--input-bg);color:var(--text);resize:none;outline:none"></textarea>
      <div style="display:flex;gap:9px;margin-top:10px">
        <button class="btn btn-primary" style="flex:1" onclick="Settings.doImport()">开始恢复</button>
        <button class="btn btn-ghost" style="flex:1" onclick="hideSheet()">取消</button>
      </div>
    `);
  },
  doImport() {
    const ta = document.getElementById('impArea');
    if (!ta) return;
    let txt = (ta.value || '').trim();
    if (!txt) return Util.toast('请先粘贴备份内容');
    if (!txt.startsWith('{')) {
      const i = txt.indexOf('{');
      if (i < 0) return Util.toast('内容格式不对，应以 { 开头');
      txt = txt.slice(i);
    }
    let obj;
    try {
      obj = JSON.parse(txt);
    } catch (e) {
      return Util.toast('JSON 解析失败：' + e.message);
    }
    if (!obj || typeof obj !== 'object') return Util.toast('备份内容无效');
    // 迁移旧内置题库的进度到新题库
    try {
      const map = { 'builtin_pwd4': 'builtin_yyy_4' };
      ['progress', 'done', 'wrong', 'fav'].forEach(k => {
        if (obj[k] && typeof obj[k] === 'object') {
          Object.keys(map).forEach(oldId => {
            if (obj[k][oldId] !== undefined && obj[k][map[oldId]] === undefined) {
              obj[k][map[oldId]] = obj[k][oldId];
            }
          });
        }
      });
      if (Array.isArray(obj.banks)) obj.banks = obj.banks.filter(b => b && !b.builtin);
      if (obj.activeBankId === 'builtin_pwd4' || !obj.activeBankId) obj.activeBankId = 'builtin_yyy_4';
    } catch (e) {}
    if (!confirm('确认用这份备份覆盖当前全部学习数据？（此操作不可撤销）')) return;
    try {
      localStorage.setItem('pwd_exam_v1', JSON.stringify(obj));
    } catch (e) {
      return Util.toast('写入失败（可能超出存储上限）：' + e.message);
    }
    Util.toast('恢复成功，正在重新加载…');
    setTimeout(() => location.reload(), 800);
  },
  resetAll() {
    if (confirm('确定清空全部数据？此操作不可恢复！\n\n建议先「导出学习数据」备份再清空。')) {
      localStorage.removeItem('pwd_exam_v1');
      location.reload();
    }
  }
};

</script>
<script>

/* ================= 答题引擎 ================= */
const Quiz = {
  start(mode, qids, index = 0, answers = {}, extra = {}) {
    const bank = DB.getActiveBank();
    if (!qids || !qids.length) return Util.toast('没有题目');
    App.session = {
      mode,
      slot: extra.slot || extra._slot || Quiz.slotOf(mode),
      qids: qids.slice(),
      index: Math.min(index, qids.length - 1),
      answers: Object.assign({}, answers),   // 已提交的答案
      picked: {},                             // 已选择但未提交的答案（关键：区分选择与提交）
      startTime: extra.startTime || Date.now(),
      examId: extra.examId || null,
      examConfig: extra.examConfig || null,
      deadline: extra.deadline || null,
      marks: extra.marks || {},               // 考试标记 {qid: true}
      showAnalysis: true                      // 背题模式解析显示开关
    };
    this.saveProgress();
    // 进入答题页时，把历史栈里的中转页（practice）剔除
    App.history = App.history.filter(h => h !== 'practice');
    Router.go('quiz');
  },
  startByFilter(kind, value) {
    const bank = DB.getActiveBank();
    let arr;
    if (kind === 'type') arr = bank.questions.filter(q => q.t === value);
    else if (kind === 'topic') arr = bank.questions.filter(q => q.tp === value);
    else arr = bank.questions.filter(q => (q.g || []).includes(value));
    if (!arr.length) return Util.toast('该分类暂无题目');
    this.start(kind, arr.map(q => q.i), 0, {});
  },
  /* 模式 -> 进度槽（各模式独立保存，互不覆盖） */
  slotOf(mode) {
    return ({ seq: 'main', type: 'cat', tag: 'cat', topic: 'cat', wrong: 'wrong', fav: 'fav', exam: 'exam' })[mode] || 'main';
  },
  saveProgress() {
    const s = App.session;
    if (!s) return;
    if (s.mode === 'review') return;   // 背题模式不写进度，避免污染
    const bank = DB.getActiveBank();
    if (!bank) return;
    DB.setProgress(bank.id, {
      mode: s.mode, qids: s.qids, index: s.index,
      answers: s.answers, picked: s.picked,
      startTime: s.startTime, examId: s.examId,
      examConfig: s.examConfig, deadline: s.deadline,
      marks: s.marks, updateTime: Date.now()
    }, s.slot || this.slotOf(s.mode));
  },
  curQ() {
    const s = App.session;
    if (!s) return null;
    const bank = DB.getActiveBank();
    const qid = s.qids[s.index];
    return bank.questions.find(q => q.i === qid);
  },
  /* 当前题是否已提交 */
  isSubmitted(qid) {
    const s = App.session;
    if (!s) return false;
    return !!(s.answers[qid] && s.answers[qid].length);
  },
  /* 当前题已选择的选项 */
  pickedOf(qid) {
    const s = App.session;
    if (!s) return [];
    return s.picked[qid] || s.answers[qid] || [];
  }
};
/* ---------- 答题页 ---------- */
Pages.quiz = function () {
  const s = App.session;
  if (!s) return Router.home();
  const q = Quiz.curQ();
  if (!q) return Router.home();
  const bank = DB.getActiveBank();
  const settings = DB.getSettings();
  const isReview = s.mode === 'review';
  const isExam = s.mode === 'exam';
  const isEssay = q.t === 'essay';
  if (!s.revealed) s.revealed = {};
  const submitted = Quiz.isSubmitted(q.i);
  const picked = Quiz.pickedOf(q.i);
  const isMulti = q.t === 'multi';
  const needConfirm = isMulti || settings.confirmSingle;
  const essayShown = isEssay && (submitted || s.revealed[q.i] || isReview);
  const showResult = isReview || (submitted && !isExam) || (isEssay && s.revealed[q.i]);
  const isRight = submitted && Util.checkAnswer(q, s.answers[q.i]);
  const modeName = { seq: '顺序练习', type: '分类练习', tag: '分类练习', wrong: '错题重做', fav: '收藏练习', review: '背题模式', exam: '模拟考试' }[s.mode] || '练习';
  setTopbar(modeName, {
    action: isExam ? '<span id="examTimer" class="exam-timer">--:--</span>' : ''
  });
  /* ---------- 选项渲染 ---------- */
  let opts = q.o.map(([k, t]) => ({ k, t }));
  if (settings.shuffleOptions && !isExam && !isReview) opts = Util.shuffle(opts);
  const optsHtml = opts.map(({ k, t }) => {
    let cls = 'opt';
    if (isReview) {
      if (s.showAnalysis && q.a.includes(k)) cls += ' correct';
      cls += ' disabled';
    } else if (showResult && !isEssay) {
      if (q.a.includes(k)) cls += ' correct';
      else if ((s.answers[q.i] || []).includes(k)) cls += ' wrong';
      cls += ' disabled';
    } else if (picked.includes(k)) {
      cls += ' selected';
    }
    return `<div class="${cls}" data-key="${k}" onclick="Quiz.pick('${k}')">
      <div class="key">${k}</div>
      <div class="txt">${Util.esc(t)}</div>
    </div>`;
  }).join('');
  /* ---------- 实操题：答案要点 + 自评 ---------- */
  let essayHtml = '';
  if (isEssay) {
    if (!essayShown) {
      essayHtml = `<button class="btn btn-ghost" style="width:100%;margin-top:16px" onclick="Quiz.revealEssay()">👁️ 查看参考答案与要点</button>`;
    } else {
      const aps = q.ap || [];
      const apsHtml = aps.length
        ? `<ol class="ap-list">${aps.map(x => `<li>${Util.esc(x)}</li>`).join('')}</ol>`
        : `<div style="color:var(--text-3);font-size:13px">本题源数据中没有参考答案要点</div>`;
      essayHtml = `<div class="essay-block">
        <div class="essay-title">📋 参考答案与要点</div>
        ${apsHtml}
      </div>`;
      if (!submitted && !isReview && !isExam) {
        essayHtml += `<div class="essay-actions">
          <div style="font-size:12px;color:var(--text-3);text-align:center;margin-bottom:8px">对照要点，给自己打个分</div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-ok" style="flex:1" onclick="Quiz.selfAssess(true)">✅ 我答对了</button>
            <button class="btn btn-bad" style="flex:1" onclick="Quiz.selfAssess(false)">❌ 我答错了</button>
          </div>
        </div>`;
      } else if (submitted && !isReview) {
        essayHtml += `<div class="essay-actions">
          <div class="self-result ${isRight ? 'ok' : 'bad'}">${isRight ? '✅ 本题记为答对' : '❌ 已加入错题本'}</div>
          ${!isExam ? `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="Quiz.selfAssess(${isRight ? 'false' : 'true'})">改判为${isRight ? '答错' : '答对'}</button>` : ''}
        </div>`;
      }
    }
  }
  /* ---------- 解析 / 易错点 / 知识点 ---------- */
  let analysisHtml = '';
  const showAnalysis = isReview ? s.showAnalysis : (showResult && settings.showAnalysis);
  if (showAnalysis && !isEssay) {
    const ansText = q.a.map(k => {
      const o = q.o.find(x => x[0] === k);
      return o ? `${k}. ${o[1]}` : k;
    }).join('；');
    analysisHtml = `<div class="analysis">
      <b>正确答案</b>
      <div class="ans">${Util.esc(ansText)}</div>
      ${q.an ? `<div class="ana-sec"><b>解析</b><div>${Util.esc(q.an)}</div></div>` : ''}
      ${q.pf ? `<div class="ana-sec pitfall"><b>⚠️ 易错点</b><div>${Util.esc(q.pf)}</div></div>` : ''}
      ${q.kp ? `<div class="ana-sec kp"><b>📌 知识点</b><div>${Util.esc(q.kp)}</div></div>` : ''}
    </div>`;
  } else if (showAnalysis && isEssay && (q.an || q.kp)) {
    analysisHtml = `<div class="analysis">
      ${q.an ? `<div class="ana-sec"><b>解析</b><div>${Util.esc(q.an)}</div></div>` : ''}
      ${q.kp ? `<div class="ana-sec kp"><b>📌 知识点</b><div>${Util.esc(q.kp)}</div></div>` : ''}
    </div>`;
  }
  /* ---------- 背题模式开关 ---------- */
  let reviewToggle = '';
  if (isReview) {
    reviewToggle = `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" onclick="Quiz.toggleAnalysis()">
      ${s.showAnalysis ? '🙈 隐藏答案与解析' : '👁️ 显示答案与解析'}
    </button>`;
  }
  const faved = DB.isFav(bank.id, q.i);
  const marked = s.marks && s.marks[q.i];
  const progressPct = Math.round((s.index + 1) / s.qids.length * 100);
  /* ---------- 底部主按钮 ---------- */
  let mainBtn = '';
  if (isExam) {
    mainBtn = `<button class="btn btn-primary" onclick="Quiz.next()">${s.index === s.qids.length - 1 ? '交卷' : '下一题'}</button>`;
  } else if (isEssay) {
    if (submitted) mainBtn = `<button class="btn btn-primary" onclick="Quiz.next()">${s.index === s.qids.length - 1 ? '完成' : '下一题'}</button>`;
    else if (essayShown) mainBtn = `<button class="btn btn-primary" disabled>请先自评</button>`;
    else mainBtn = `<button class="btn btn-primary" onclick="Quiz.revealEssay()">查看要点</button>`;
  } else if (isReview || showResult) {
    mainBtn = `<button class="btn btn-primary" onclick="Quiz.next()">${s.index === s.qids.length - 1 ? '完成' : '下一题'}</button>`;
  } else {
    mainBtn = `<button class="btn btn-primary" onclick="Quiz.submit()" ${picked.length ? '' : 'disabled'}>确认答案</button>`;
  }
  /* ---------- 标签：专项 / 难度 / 知识点 ---------- */
  const extraTags = [];
  if (q.tp) extraTags.push(`<span class="tag-topic">${Util.esc(q.tp)}</span>`);
  if (q.d) extraTags.push(`<span class="tag-diff d-${q.d === '易' ? 'easy' : q.d === '难' ? 'hard' : 'hell'}">${Util.esc(q.d)}</span>`);
  if (q.kp && !q.kp.trim().startsWith('实操')) extraTags.push(`<span class="tag-kp">${Util.esc(q.kp)}</span>`);
  document.getElementById('page-quiz').innerHTML = `
    <div class="quiz-head">
      <div class="quiz-meta">
        <span class="idx"><b>${s.index + 1}</b> / ${s.qids.length}</span>
        <span>${isExam ? '已答 ' + Object.keys(s.answers).length + ' 题' : '正确率 ' + Quiz.rate()}</span>
      </div>
      <div class="progress"><i style="width:${progressPct}%"></i></div>
    </div>
    <div class="quiz-body">
      <span class="q-type-tag ${q.t}">${Util.typeName(q.t)}${isMulti ? '（多选）' : ''}</span>
      <div class="q-tags">${(q.g || []).map(g => `<span>${Util.tagName(g)}</span>`).join('')}${extraTags.join('')}</div>
      <div class="q-stem">${Util.esc(q.s || q.t)}</div>
      ${isEssay ? '' : optsHtml}
      ${essayHtml}
      ${isMulti && !showResult && !isExam ? `<div style="font-size:12px;color:var(--text-3);text-align:center;margin-top:6px">多选题：选好全部选项后点「确认答案」</div>` : ''}
      ${analysisHtml}
      ${reviewToggle}
    </div>
    <div class="bottom-bar">
      <button class="btn-icon" onclick="Quiz.prev()" ${s.index === 0 ? 'disabled style="opacity:.4"' : ''}>‹</button>
      <button class="btn-icon ${faved ? 'on' : ''}" onclick="Quiz.fav()">${faved ? '★' : '☆'}</button>
      ${isExam ? `<button class="btn-icon ${marked ? 'marked' : ''}" onclick="Quiz.toggleMark()">${marked ? '🚩' : '⚑'}</button>` : ''}
      ${mainBtn}
      <button class="btn-icon" onclick="Quiz.sheet()">☰</button>
    </div>
  `;
  if (isExam) Exam.tick();
};
/* 实操题：展开参考答案 */
Quiz.revealEssay = function () {
  const s = App.session;
  const q = Quiz.curQ();
  if (!s || !q) return;
  if (!s.revealed) s.revealed = {};
  s.revealed[q.i] = true;
  Quiz.saveProgress();
  Pages.quiz();
  setTimeout(() => { try { window.scrollTo(0, document.body.scrollHeight); } catch (e) {} }, 50);
};
/* 实操题：自评对错 */
Quiz.selfAssess = function (ok) {
  const s = App.session;
  const q = Quiz.curQ();
  if (!s || !q) return;
  s.answers[q.i] = [ok ? 'A' : 'B'];
  Quiz.afterSubmit(q);
};
/* ---------- 选择选项（核心修复） ---------- */
Quiz.pick = function (key) {
  const s = App.session;
  const q = Quiz.curQ();
  if (!q) return;
  if (q.t === 'essay') return;   // 实操题无选项，走自评
  const isExam = s.mode === 'exam';
  const isReview = s.mode === 'review';
  if (isReview) return;
  // 已提交的练习不可再改
  if (!isExam && Quiz.isSubmitted(q.i)) return;
  const settings = DB.getSettings();
  const isMulti = q.t === 'multi';
  // 初始化 picked
  if (!s.picked[q.i]) s.picked[q.i] = [];
  const picked = s.picked[q.i];
  if (isMulti) {
    // 多选：切换选中状态，不提交
    const i = picked.indexOf(key);
    if (i >= 0) picked.splice(i, 1);
    else picked.push(key);
    picked.sort();
    Quiz.saveProgress();
    Pages.quiz();
    return;
  }
  // 单选/判断
  s.picked[q.i] = [key];
  if (isExam) {
    // 考试：直接记录答案，不判对错
    s.answers[q.i] = [key];
    Quiz.saveProgress();
    Pages.quiz();
    return;
  }
  // 练习模式：根据设置决定是否自动提交
  if (settings.confirmSingle) {
    // 需要确认，只记录选择
    Quiz.saveProgress();
    Pages.quiz();
  } else {
    // 自动提交
    s.answers[q.i] = [key];
    Quiz.afterSubmit(q);
  }
};
/* ---------- 提交答案 ---------- */
Quiz.submit = function () {
  const s = App.session;
  const q = Quiz.curQ();
  const picked = s.picked[q.i] || [];
  if (!picked.length) return Util.toast('请先选择答案');
  if (s.mode === 'exam') {
    s.answers[q.i] = picked.slice();
    Quiz.saveProgress();
    Pages.quiz();
    return;
  }
  s.answers[q.i] = picked.slice();
  Quiz.afterSubmit(q);
};
/* 提交后处理：判对错、记错题 */
Quiz.afterSubmit = function (q) {
  const s = App.session;
  const bank = DB.getActiveBank();
  const myAns = s.answers[q.i];
  const right = Util.checkAnswer(q, myAns);
  if (!right) DB.addWrong(bank.id, q.i, myAns);
  else DB.removeWrong(bank.id, q.i);
  DB.markDone(bank.id, q.i);   // 已练题累计，永久保留
  Quiz.saveProgress();
  Pages.quiz();
  // 自动跳转逻辑：区分答对/答错，各自可配置
  const settings = DB.getSettings();
  // 实操题自评后不自动跳转（留时间看解析）
  if (q.t === 'essay') return;
  let shouldJump = false, delay = 0;
  if (right && settings.autoNext) {
    shouldJump = true;
    delay = Math.max(0.2, Number(settings.autoNextDelay) || 0.7) * 1000;
  } else if (!right && settings.autoNextWrong) {
    shouldJump = true;
    delay = Math.max(0.5, Number(settings.autoNextWrongDelay) || 2) * 1000;
  }
  if (shouldJump) {
    const curIdx = s.index;
    clearTimeout(Quiz._jumpTimer);
    Quiz._jumpTimer = setTimeout(() => {
      if (App.session && App.session.index === curIdx) Quiz.next();
    }, delay);
  }
};
Quiz.next = function () {
  const s = App.session;
  // 考试模式：切题前把已选未提交的答案同步进 answers，避免漏答
  if (s.mode === 'exam') {
    const cur = Quiz.curQ();
    if (cur && s.picked[cur.i] && s.picked[cur.i].length) {
      s.answers[cur.i] = s.picked[cur.i].slice();
    }
  }
  if (s.index >= s.qids.length - 1) {
    if (s.mode === 'exam') return Exam.confirmSubmit();
    return Quiz.finish();
  }
  s.index++;
  Quiz.saveProgress();
  Pages.quiz();
};
Quiz.prev = function () {
  const s = App.session;
  // 考试模式：切题前同步答案
  if (s.mode === 'exam') {
    const cur = Quiz.curQ();
    if (cur && s.picked[cur.i] && s.picked[cur.i].length) {
      s.answers[cur.i] = s.picked[cur.i].slice();
    }
  }
  if (s.index <= 0) return;
  s.index--;
  Quiz.saveProgress();
  Pages.quiz();
};
Quiz.fav = function () {
  const bank = DB.getActiveBank();
  const q = Quiz.curQ();
  const on = DB.toggleFav(bank.id, q.i);
  Util.toast(on ? '已收藏' : '已取消收藏');
  Pages.quiz();
};
/* 考试标记 */
Quiz.toggleMark = function () {
  const s = App.session;
  const q = Quiz.curQ();
  if (!s.marks) s.marks = {};
  if (s.marks[q.i]) delete s.marks[q.i];
  else s.marks[q.i] = true;
  Quiz.saveProgress();
  Pages.quiz();
};
/* 背题模式解析开关 */
Quiz.toggleAnalysis = function () {
  App.session.showAnalysis = !App.session.showAnalysis;
  Pages.quiz();
};
Quiz.rate = function () {
  const s = App.session;
  const bank = DB.getActiveBank();
  let right = 0, total = 0;
  s.qids.forEach(id => {
    const ans = s.answers[id];
    if (ans && ans.length) {
      total++;
      const q = bank.questions.find(x => x.i === id);
      if (q && Util.checkAnswer(q, ans)) right++;
    }
  });
  return total ? Math.round(right / total * 100) + '%' : '—';
};
/* ---------- 答题卡（紧凑 + 标记） ---------- */
Quiz.sheet = function () {
  const s = App.session;
  const bank = DB.getActiveBank();
  const isExam = s.mode === 'exam';
  const cells = s.qids.map((id, i) => {
    const ans = s.answers[id];
    const picked = s.picked[id];
    const qq = bank.questions.find(x => x.i === id);
    let cls = 'sheet-cell';
    if (ans && ans.length) {
      if (isExam) cls += ' done';
      else if (qq && qq.t === 'essay') {
        // 实操题：自评答对显示绿，答错显示红
        cls += (ans[0] === 'A') ? ' right' : (ans[0] === 'B' ? ' wrong' : ' done');
      } else {
        cls += (qq && Util.checkAnswer(qq, ans)) ? ' right' : ' wrong';
      }
    } else if (picked && picked.length) {
      cls += ' done';
    }
    if (i === s.index) cls += ' cur';
    if (s.marks && s.marks[id]) cls += ' marked';
    return `<div class="${cls}" onclick="Quiz.jump(${i})">${i + 1}</div>`;
  }).join('');
  const legend = isExam
    ? `<div class="sheet-legend">
        <span><i style="background:var(--primary-light)"></i>已答</span>
        <span><i style="background:var(--input-bg)"></i>未答</span>
        <span><i style="background:var(--warn)"></i>已标记</span>
       </div>`
    : `<div class="sheet-legend">
        <span><i style="background:var(--success-light)"></i>答对</span>
        <span><i style="background:var(--danger-light)"></i>答错</span>
        <span><i style="background:var(--input-bg)"></i>未答</span>
       </div>`;
  showSheet('答题卡', `${legend}<div class="sheet-grid">${cells}</div>`);
};
Quiz.jump = function (i) {
  const s = App.session;
  // 考试模式：跳转前同步答案
  if (s.mode === 'exam') {
    const cur = Quiz.curQ();
    if (cur && s.picked[cur.i] && s.picked[cur.i].length) {
      s.answers[cur.i] = s.picked[cur.i].slice();
    }
  }
  App.session.index = i;
  Quiz.saveProgress();
  hideSheet();
  Pages.quiz();
};
/* ---------- 完成 ---------- */
Quiz.finish = function () {
  const s = App.session;
  const bank = DB.getActiveBank();
  /* 只清掉本次练习所在的那个进度槽，其它模式的进度完整保留 */
  DB.clearProgress(bank.id, s.slot || Quiz.slotOf(s.mode));
  App.session = null;
  let right = 0, wrong = 0, total = 0;
  s.qids.forEach(id => {
    const ans = s.answers[id];
    if (!ans || !ans.length) return;
    total++;
    const q = bank.questions.find(x => x.i === id);
    if (q && Util.checkAnswer(q, ans)) right++; else wrong++;
  });
  const pct = total ? Math.round(right / total * 100) : 0;
  setTopbar('练习完成');
  document.getElementById('page-result').innerHTML = `
    <div class="result-hero">
      <div class="result-score ${pct >= 60 ? 'pass' : 'fail'}">${pct}<span style="font-size:20px">%</span></div>
      <div class="result-label">本次正确率</div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><b>${total}</b><span>已作答</span></div>
      <div class="stat-box"><b style="color:var(--success)">${right}</b><span>答对</span></div>
      <div class="stat-box"><b style="color:var(--danger)">${wrong}</b><span>答错</span></div>
      <div class="stat-box"><b>${s.qids.length - total}</b><span>未作答</span></div>
    </div>
    <div style="padding:20px 12px">
      <button class="btn btn-primary" style="margin-bottom:10px" onclick="Router.home()">返回首页</button>
      ${wrong ? `<button class="btn btn-ghost" onclick="Router.go('wrong')">查看错题本</button>` : ''}
    </div>
  `;
  Router.go('result');
};
/* ---------- 底部弹层 ---------- */
function showSheet(title, body) {
  let mask = document.getElementById('mask');
  if (!mask) {
    mask = document.createElement('div');
    mask.id = 'mask'; mask.className = 'mask';
    mask.onclick = e => { if (e.target === mask) hideSheet(); };
    document.body.appendChild(mask);
  }
  mask.innerHTML = `<div class="sheet">
    <div class="sheet-head"><b>${title}</b><span class="close" onclick="hideSheet()">✕</span></div>
    <div class="sheet-body">${body}</div>
  </div>`;
  mask.classList.add('show');
}
function hideSheet() {
  const mask = document.getElementById('mask');
  if (mask) mask.classList.remove('show');
}

</script>
<script>

/* ================= 模拟考试 ================= */
const Exam = {
  setup() {
    const bank = DB.getActiveBank();
    // 实操题无法自动判分，不参与模拟考试
    const objective = bank.questions.filter(q => q.t !== 'essay');
    const essayN = bank.questions.length - objective.length;
    const total = objective.length;
    const byType = { single: 0, multi: 0, judge: 0 };
    objective.forEach(q => byType[q.t] = (byType[q.t] || 0) + 1);
    setTopbar('模拟考试');
    document.getElementById('page-exam-setup').innerHTML = `
      <div class="card">
        <div style="font-size:13px;color:var(--text-3);margin-bottom:10px">
          可考 ${total} 题（单选${byType.single} / 多选${byType.multi} / 判断${byType.judge}）
          ${essayN ? `<br><span style="font-size:11.5px">另有 ${essayN} 道实操题不参与考试，可在「分类刷题 → 实操题」单独练</span>` : ''}
        </div>
        <div class="form-item" style="padding:10px 0;background:transparent">
          <label>题目数量</label>
          <input type="number" id="exCount" value="${Math.min(100, total)}" min="5" max="${total}">
        </div>
        <div class="form-item" style="padding:10px 0;background:transparent;border-bottom:none">
          <label>考试时长（分钟）</label>
          <input type="number" id="exMin" value="60" min="1" max="300">
        </div>
      </div>
      <div class="card">
        <div style="font-size:13px;color:var(--text-3);margin-bottom:10px">快速选择</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('exCount').value=${Math.min(50, total)};document.getElementById('exMin').value=30">50题/30分钟</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('exCount').value=${Math.min(100, total)};document.getElementById('exMin').value=60">100题/60分钟</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('exCount').value=${total};document.getElementById('exMin').value=90">全部题目/90分钟</button>
        </div>
      </div>
      <div style="padding:10px 12px">
        <button class="btn btn-primary" onclick="Exam.begin()">开始考试</button>
      </div>
      <div style="padding:0 16px;font-size:12px;color:var(--text-3);line-height:1.8">
        · 考试中可随时查看答题卡<br>
        · 可给不确定的题目标记，交卷前快速回看<br>
        · 退出后进度自动保存，下次可继续<br>
        · 交卷后自动评分并记录成绩
      </div>
    `;
  },
  begin() {
    const bank = DB.getActiveBank();
    let count = parseInt(document.getElementById('exCount').value) || 100;
    let mins = parseInt(document.getElementById('exMin').value) || 60;
    const objective = bank.questions.filter(q => q.t !== 'essay');
    count = Math.max(5, Math.min(count, objective.length));
    mins = Math.max(1, Math.min(mins, 300));
    const pool = { single: [], multi: [], judge: [] };
    objective.forEach(q => (pool[q.t] || (pool[q.t] = [])).push(q.i));
    const ratio = { single: 0.55, multi: 0.25, judge: 0.20 };
    let picked = [];
    Object.keys(pool).forEach(t => {
      const want = Math.round(count * (ratio[t] || 0.2));
      picked = picked.concat(Util.shuffle(pool[t]).slice(0, want));
    });
    if (picked.length < count) {
      const rest = objective.map(q => q.i).filter(id => !picked.includes(id));
      picked = picked.concat(Util.shuffle(rest).slice(0, count - picked.length));
    }
    picked = Util.shuffle(picked).slice(0, count);
    const examId = Util.uid();
    const deadline = Date.now() + mins * 60 * 1000;
    Quiz.start('exam', picked, 0, {}, {
      examId, deadline,
      examConfig: { count, mins, startTime: Date.now() },
      marks: {}
    });
  },
  resume(prog) {
    App.session = {
      mode: 'exam',
      slot: 'exam',
      qids: prog.qids,
      index: prog.index || 0,
      answers: prog.answers || {},
      picked: prog.picked || {},
      startTime: prog.startTime,
      examId: prog.examId,
      examConfig: prog.examConfig,
      deadline: prog.deadline,
      marks: prog.marks || {},
      showAnalysis: true
    };
    Router.go('quiz');
  },
  tick() {
    clearInterval(App.examTimer);
    const update = () => {
      const s = App.session;
      if (!s || s.mode !== 'exam') { clearInterval(App.examTimer); return; }
      const el = document.getElementById('examTimer');
      if (!el) return;
      const left = Math.max(0, Math.floor((s.deadline - Date.now()) / 1000));
      el.textContent = Util.fmtTime(left);
      if (left <= 300) el.classList.add('danger');
      if (left <= 0) {
        clearInterval(App.examTimer);
        Util.toast('考试时间到，自动交卷');
        setTimeout(() => Exam.doSubmit(), 800);
      }
    };
    update();
    App.examTimer = setInterval(update, 1000);
  },
  confirmSubmit() {
    const s = App.session;
    const unanswered = s.qids.length - Object.keys(s.answers).filter(k => s.answers[k] && s.answers[k].length).length;
    const markedCount = Object.keys(s.marks || {}).length;
    let msg = '确定交卷？';
    if (unanswered > 0 && markedCount > 0) msg = `还有 ${unanswered} 题未作答，${markedCount} 题已标记，确定交卷？`;
    else if (unanswered > 0) msg = `还有 ${unanswered} 题未作答，确定交卷？`;
    else if (markedCount > 0) msg = `还有 ${markedCount} 题已标记，确定交卷？`;
    if (confirm(msg)) Exam.doSubmit();
  },
  doSubmit() {
    clearInterval(App.examTimer);
    const s = App.session;
    if (!s) return;
    const bank = DB.getActiveBank();
    let right = 0, wrong = 0, unanswered = 0;
    const detail = [];
    s.qids.forEach(id => {
      const q = bank.questions.find(x => x.i === id);
      const ans = s.answers[id] || [];
      const ok = q && Util.checkAnswer(q, ans);
      if (!ans.length) unanswered++;
      else if (ok) right++;
      else { wrong++; DB.addWrong(bank.id, id, ans); }
      if (ans.length) DB.markDone(bank.id, id);
      detail.push({ qid: id, my: ans, ok: !!ok });
    });
    const score = Math.round(right / s.qids.length * 100);
    const duration = Math.round((Date.now() - s.startTime) / 1000);
    const rec = {
      id: s.examId || Util.uid(),
      bankId: bank.id,
      time: Date.now(),
      total: s.qids.length,
      right, wrong, unanswered, score, duration,
      pass: score >= 60,
      detail
    };
    DB.addExam(rec);
    DB.clearProgress(bank.id, 'exam');
    App.session = null;
    Exam.showResult(rec);
  },
  showResult(rec) {
    setTopbar('考试成绩');
    const bank = DB.getActiveBank();
    const qMap = {};
    bank.questions.forEach(q => qMap[q.i] = q);
    const wrongList = rec.detail.filter(d => !d.ok && d.my.length);
    window._examWrongIds = wrongList.map(d => d.qid);
    document.getElementById('page-result').innerHTML = `
      <div class="result-hero">
        <div class="result-score ${rec.pass ? 'pass' : 'fail'}">${rec.score}<span style="font-size:20px">分</span></div>
        <div class="result-label">${rec.pass ? '🎉 恭喜通过！' : '继续加油，还需努力'}</div>
        <div style="font-size:12px;color:var(--text-3);margin-top:8px">用时 ${Util.fmtTime(rec.duration)}</div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><b>${rec.total}</b><span>总题数</span></div>
        <div class="stat-box"><b style="color:var(--success)">${rec.right}</b><span>答对</span></div>
        <div class="stat-box"><b style="color:var(--danger)">${rec.wrong}</b><span>答错</span></div>
        <div class="stat-box"><b style="color:var(--text-3)">${rec.unanswered}</b><span>未答</span></div>
      </div>
      ${wrongList.length ? `
      <div style="padding:12px 14px 4px;font-size:12px;color:var(--text-3);font-weight:600">错题回顾（${wrongList.length}）</div>
      <div class="list-group">
        ${wrongList.map(d => {
          const q = qMap[d.qid];
          if (!q) return '';
          return `<div class="list-item" onclick="Quiz.start('wrong',['${d.qid}'],0,{})">
            <div class="li-ico" style="background:var(--danger-light);color:var(--danger)">✗</div>
            <div class="li-main">
              <b style="font-weight:400;font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${Util.esc(q.s)}</b>
              <span>你的答案：${d.my.join(',')} · 正确：${q.a.join(',')}</span>
            </div>
            <div class="li-arrow">›</div>
          </div>`;
        }).join('')}
      </div>` : ''}
      <div style="padding:20px 12px">
        <button class="btn btn-primary" style="margin-bottom:10px" onclick="Router.home()">返回首页</button>
        <button class="btn btn-ghost" onclick="Router.go('exams')">查看考试记录</button>
      </div>
    `;
    Router.go('result');
  }
};
Pages['exam-setup'] = function () { Exam.setup(); };
/* ---------- 考试记录 ---------- */
Pages.exams = function () {
  setTopbar('考试记录');
  const bank = DB.getActiveBank();
  const exams = DB.getExams().filter(e => e.bankId === bank.id);
  if (!exams.length) {
    document.getElementById('page-exams').innerHTML = `
      <div class="empty"><div class="e-ico">📊</div><p>还没有考试记录<br><button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="Router.go('exam-setup')">去模拟考试</button></p></div>`;
    return;
  }
  // 用索引避免 JSON 内嵌引号问题
  window._examRecords = exams;
  const rows = exams.map((e, i) => `
    <div class="list-item" onclick="Exam.showResult(window._examRecords[${i}])">
      <div class="li-ico" style="background:${e.pass ? 'var(--success-light)' : 'var(--danger-light)'};color:${e.pass ? 'var(--success)' : 'var(--danger)'};font-weight:700;font-size:14px">${e.score}</div>
      <div class="li-main">
        <b>${e.pass ? '通过' : '未通过'} · ${e.right}/${e.total} 题</b>
        <span>${Util.fmtDate(e.time)} · 用时 ${Util.fmtTime(e.duration)}</span>
      </div>
      <div class="li-arrow">›</div>
    </div>`).join('');
  document.getElementById('page-exams').innerHTML = `<div class="list-group">${rows}</div>`;
};

<script>

/* ================= 题库导入 ================= */
const Importer = {
  /* 解析 JSON 格式
   * 支持两种：
   * 1) 本 App 导出格式：[{i,t,s,o:[[k,txt]],a:[..],g:[..]}]
   * 2) 通用格式：[{type,stem,options:[{key,text}],answer:[..],tags:[..]}]
   */
  parseJSON(text) {
    const data = JSON.parse(text);
    // 兼容三种顶层结构：
    //   A) 数组                         —— 本 App 导出 / 通用格式
    //   B) {questions: [...]}           —— 旧通用格式
    //   C) {banks:[...], questions:{bankId:[...]}} —— 密评题库导出格式（自动拆成多题库）
    let multi = null;
    let arr;
    if (Array.isArray(data)) {
      arr = data;
    } else if (data && data.questions && !Array.isArray(data.questions) && typeof data.questions === 'object') {
      // C) 分题库格式
      const metaMap = {};
      (data.banks || []).forEach(b => { if (b && b.bank_id) metaMap[b.bank_id] = b; });
      multi = [];
      Object.keys(data.questions).forEach(bid => {
        const qs = data.questions[bid] || [];
        const conv = this.mapQuestions(qs);
        if (conv.length) {
          multi.push({
            name: (metaMap[bid] && metaMap[bid].name) || bid,
            questions: conv
          });
        }
      });
      this._lastMulti = multi;
      return [];
    } else {
      arr = (data && data.questions) || [];
    }
    this._lastMulti = multi;
    return this.mapQuestions(arr);
  },
  /* 批量把原始题对象映射成 App 紧凑格式 */
  mapQuestions(arr) {
    const TYPE_ZH = { '单选': 'single', '多选': 'multi', '判断': 'judge', '实操': 'essay' };
    return arr.map((q, idx) => {
      // 本 App 紧凑格式
      if (q.i !== undefined && q.s !== undefined) {
        return {
          i: q.i || `q${idx + 1}`,
          t: q.t || 'single',
          s: q.s,
          o: q.o || [],
          a: q.a || [],
          g: q.g || ['base'],
          an: q.an || '',
          pf: q.pf || '',
          kp: q.kp || '',
          tp: q.tp || '',
          md: q.md || '',
          d: q.d || '',
          ap: q.ap || []
        };
      }
      // 密评题库导出格式：type=单选题/多选题/判断题/实操题，options={A:...}，answer="AB"
      const rawType = q.type || q.t || '';
      let type = TYPE_ZH[rawType] || rawType;
      if (!['single', 'multi', 'judge', 'essay'].includes(type)) {
        if (/多/.test(rawType)) type = 'multi';
        else if (/判断/.test(rawType)) type = 'judge';
        else if (/实操|问答|简答/.test(rawType)) type = 'essay';
        else type = '';
      }
      // 选项：对象 {A:'xx'} / 数组 [{key,text}] / 数组 [[k,txt]]
      let opts = [];
      const ro = q.options;
      if (Array.isArray(ro)) {
        opts = ro.map(o => Array.isArray(o) ? [o[0], o[1]] : [o.key || o.k, o.text || o.t]).filter(o => o[0]);
      } else if (ro && typeof ro === 'object') {
        opts = Object.keys(ro).map(k => [k, ro[k]]);
      }
      // 答案
      let ans = q.answer !== undefined && q.answer !== null ? q.answer : (q.a || []);
      if (typeof ans === 'string') {
        const cleaned = ans.replace(/[^A-Ha-h]/g, '').toUpperCase();
        ans = cleaned ? cleaned.split('') : [];
      } else if (Array.isArray(ans)) {
        ans = ans.map(x => String(x).trim().toUpperCase()).filter(Boolean);
      } else {
        ans = [];
      }
      // 题型推断
      if (!type) {
        if (ans.length > 1) type = 'multi';
        else if (opts.length === 2 && opts.every(o => ['正确', '错误', '对', '错'].includes(String(o[1]).trim()))) type = 'judge';
        else if (!opts.length) type = 'essay';
        else type = 'single';
      }
      if (type === '判断题' || type === '判断') type = 'judge';
      // 实操题的 answer_points
      let ap = q.answer_points || q.ap || [];
      if (Array.isArray(ap)) ap = ap.filter(x => x && String(x).trim());
      else ap = [];
      const tags = q.tags || q.g;
      return {
        i: q.id || q.qid || `q${idx + 1}`,
        t: type,
        s: q.stem || q.s || q.question || '',
        o: opts,
        a: ans,
        g: (Array.isArray(tags) && tags.length) ? tags : ['base'],
        an: q.analysis || q.an || '',
        pf: q.pitfall || q.pf || '',
        kp: q.knowledge_point || q.kp || '',
        tp: q.topic_name || q.tp || '',
        md: q.module || q.md || '',
        d: ({EASY:'易',HARD:'难',HELL:'地狱'})[q.difficulty] || q.d || '',
        ap: ap
      };
    }).filter(q => {
      if (!q.s) return false;
      if (q.t === 'essay') return true;        // 实操题无选项无标准答案，只要有题干就要
      return q.o.length && q.a.length;
    });
  },
  /* 解析 TXT 格式
   * 支持格式：
   * 1、题干
   * A、选项1
   * B、选项2(正确答案)
   * 
   * 或：
   * 1. 题干 [单选题]
   * A. 选项
   * 答案：B
   */
  parseTXT(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
    const questions = [];
    let cur = null;
    const optRe = /^([A-H])\s*[、.．:：]\s*(.+)$/;
    const stemRe = /^\d+\s*[、.．:：]\s*(.+)$/;
    const ansRe = /^(答案|正确答案)\s*[：:]\s*(.+)$/;
    const flush = () => {
      if (cur && cur.s && cur.o.length && cur.a.length) questions.push(cur);
      cur = null;
    };
    for (const line of lines) {
      const am = line.match(ansRe);
      if (am && cur) {
        cur.a = am[2].replace(/[^A-Ha-h]/g, '').toUpperCase().split('').filter(Boolean);
        continue;
      }
      const om = line.match(optRe);
      if (om && cur) {
        const isAns = /\(正确答案\)|（正确答案）|√|✔/.test(om[2]);
        const txt = om[2].replace(/\(正确答案\)|（正确答案）/g, '').trim();
        cur.o.push([om[1], txt]);
        if (isAns) cur.a.push(om[1]);
        continue;
      }
      const sm = line.match(stemRe);
      if (sm || /\[单选题\]|\[多选题\]|\[判断题\]/.test(line)) {
        flush();
        let stem = sm ? sm[1] : line;
        let type = null;
        if (stem.includes('[单选题]')) { type = 'single'; stem = stem.replace('[单选题]', ''); }
        else if (stem.includes('[多选题]')) { type = 'multi'; stem = stem.replace('[多选题]', ''); }
        else if (stem.includes('[判断题]')) { type = 'judge'; stem = stem.replace('[判断题]', ''); }
        stem = stem.replace(/\*+$/, '').trim();
        cur = { i: `q${questions.length + 1}`, t: type, s: stem, o: [], a: [], g: ['base'], an: '' };
        continue;
      }
      // 续行
      if (cur && !cur.o.length) cur.s += ' ' + line;
    }
    flush();
    // 推断题型
    return questions.map(q => {
      let t = q.t;
      if (!t) {
        if (q.a.length > 1) t = 'multi';
        else if (q.o.length === 2 && q.o.every(o => ['正确', '错误'].includes(o[1]))) t = 'judge';
        else t = 'single';
      }
      return { ...q, t };
    });
  },
  /* 解析 CSV/Excel（xlsx 需要 sheetjs，这里处理 CSV 文本） */
  parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuote) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; }
          else inQuote = false;
        } else cell += c;
      } else {
        if (c === '"') inQuote = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else if (c !== '\r') cell += c;
      }
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return [];
    // 判断是否有表头
    const head = rows[0].map(h => h.trim().toLowerCase());
    const hasHeader = head.some(h => ['题干', '题目', 'stem', 'question', '答案', 'answer'].includes(h));
    let idx = { stem: 0, optA: 1, optB: 2, optC: 3, optD: 4, answer: 5, type: 6, analysis: 7 };
    let dataRows = rows;
    if (hasHeader) {
      dataRows = rows.slice(1);
      idx = {};
      head.forEach((h, i) => {
        if (['题干', '题目', 'stem', 'question'].includes(h)) idx.stem = i;
        else if (['a', '选项a', 'opta'].includes(h)) idx.optA = i;
        else if (['b', '选项b', 'optb'].includes(h)) idx.optB = i;
        else if (['c', '选项c', 'optc'].includes(h)) idx.optC = i;
        else if (['d', '选项d', 'optd'].includes(h)) idx.optD = i;
        else if (['答案', 'answer', '正确答案'].includes(h)) idx.answer = i;
        else if (['题型', 'type'].includes(h)) idx.type = i;
        else if (['解析', 'analysis'].includes(h)) idx.analysis = i;
      });
    }
    return dataRows.map((r, i) => {
      const stem = (r[idx.stem] || '').trim();
      if (!stem) return null;
      const opts = [];
      ['optA', 'optB', 'optC', 'optD'].forEach((k, j) => {
        const v = (r[idx[k]] || '').trim();
        if (v) opts.push([String.fromCharCode(65 + j), v]);
      });
      let ansStr = (r[idx.answer] || '').trim().toUpperCase();
      let ans = ansStr.replace(/[^A-H]/g, '').split('').filter(Boolean);
      if (!ans.length && ansStr) {
        // 可能是 "正确/错误"
        if (ansStr.includes('正确') || ansStr === '对' || ansStr === 'T') ans = ['A'];
        else if (ansStr.includes('错误') || ansStr === '错' || ansStr === 'F') ans = ['B'];
      }
      let type = (r[idx.type] || '').trim();
      if (!type) {
        if (ans.length > 1) type = 'multi';
        else if (opts.length === 2 && opts.every(o => ['正确', '错误'].includes(o[1]))) type = 'judge';
        else type = 'single';
      } else {
        type = type.includes('多') ? 'multi' : type.includes('判断') ? 'judge' : 'single';
      }
      return {
        i: `q${i + 1}`, t: type, s: stem, o: opts, a: ans,
        g: ['base'], an: (r[idx.analysis] || '').trim()
      };
    }).filter(q => q && q.o.length && q.a.length);
  },
  /* 自动识别格式 */
  auto(text, filename) {
    const ext = (filename || '').split('.').pop().toLowerCase();
    if (ext === 'json') return { type: 'json', data: this.parseJSON(text) };
    if (ext === 'csv') return { type: 'csv', data: this.parseCSV(text) };
    if (ext === 'txt') return { type: 'txt', data: this.parseTXT(text) };
    // 无扩展名，尝试探测
    const t = text.trim();
    if (t.startsWith('[') || t.startsWith('{')) {
      try { return { type: 'json', data: this.parseJSON(text) }; } catch (e) { }
    }
    if (t.includes(',') && t.split('\n')[0].split(',').length >= 3) {
      return { type: 'csv', data: this.parseCSV(text) };
    }
    return { type: 'txt', data: this.parseTXT(text) };
  }
};

Importer.handleFile = function (input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      Importer._lastMulti = null;
      const res = Importer.auto(e.target.result, file.name);
      // 情况1：多题库格式（密评导出）
      if (Importer._lastMulti && Importer._lastMulti.length) {
        let n = 0;
        Importer._lastMulti.forEach(b => {
          Importer.saveBankSilent(b.name, b.questions, res.type);
          n += b.questions.length;
        });
        Util.toast(`成功导入 ${Importer._lastMulti.length} 个题库 / 共 ${n} 题`);
        setTimeout(() => Router.home(), 700);
        return;
      }
      // 情况2：普通单题库
      if (!res.data.length) return Util.toast('未解析到题目，请检查格式');
      const bankName = file.name.replace(/\.[^.]+$/, '');
      Importer.saveBank(bankName, res.data, res.type);
    } catch (err) {
      console.error(err);
      Util.toast('解析失败：' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  input.value = '';
};
/* 静默保存（批量导入用，不跳转） */
Importer.saveBankSilent = function (name, questions, srcType) {
  questions.forEach(q => {
    if (!q.g || !q.g.length || q.g[0] === 'base') q.g = Importer.autoTag(q);
  });
  const bank = {
    id: Util.uid(),
    name: name || '导入题库',
    questions, builtin: false,
    createTime: Date.now(),
    srcType
  };
  DB.addBank(bank);
  DB.setActiveBank(bank.id);
  return bank;
};
Importer.handlePaste = function () {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) return Util.toast('请先粘贴内容');
  try {
    const res = Importer.auto(text, '');
    if (!res.data.length) return Util.toast('未解析到题目，请检查格式');
    Importer.saveBank('粘贴导入题库', res.data, res.type);
  } catch (err) {
    Util.toast('解析失败：' + err.message);
  }
};
Importer.saveBank = function (name, questions, srcType) {
  // 自动打标签
  questions.forEach(q => {
    if (!q.g || !q.g.length || q.g[0] === 'base') {
      q.g = Importer.autoTag(q);
    }
  });
  const bank = {
    id: Util.uid(),
    name: name || '导入题库',
    questions,
    builtin: false,
    createTime: Date.now(),
    srcType
  };
  DB.addBank(bank);
  DB.setActiveBank(bank.id);
  Util.toast(`成功导入 ${questions.length} 题`);
  setTimeout(() => Router.home(), 600);
};
/* 自动打标签（简化版，与 Python 脚本逻辑一致） */
Importer.autoTag = function (q) {
  const TAGS = [
      ['law_base', ['宪法','法律','法规','法理','法治','权利','义务']],
      ['criminal', ['刑法','犯罪','既遂','未遂','正当防卫','危害后果','刑罚','自首']],
      ['civil', ['民法典','民事','合同','物权','侵权','婚姻']],
      ['admin', ['行政法','行政处罚','行政复议','行政诉讼']],
      ['police', ['公安','人民警察','治安管理','警械','盘查','传唤']],
      ['auxiliary', ['辅警','岗位职责','纪律','保密']],
      ['public', ['常识','国情','历史','地理','科技']],
      ['document', ['公文','决议','通知','报告']],
      ['current', ['时政','会议','讲话']],
      ['ethics', ['职业道德','爱岗敬业','诚信']],
      ['traffic', ['交通','道路','信号灯','违章']],
      ['procedure', ['刑事诉讼','民事诉讼','证据','管辖']]
  ];
  const text = q.s + ' ' + q.o.map(o => o[1]).join(' ');
  const scores = [];
  TAGS.forEach(([k, kws]) => {
    let s = 0;
    kws.forEach(kw => { if (text.toLowerCase().includes(kw.toLowerCase())) s++; });
    if (s) scores.push([k, s]);
  });
  if (!scores.length) return ['base'];
  scores.sort((a, b) => b[1] - a[1]);
  const top = scores[0][1];
  return scores.filter(x => x[1] >= Math.max(1, top * 0.6)).slice(0, 2).map(x => x[0]);
};
