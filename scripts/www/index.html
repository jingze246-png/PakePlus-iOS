<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b6de5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>刷题</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>

/* ===== 基础重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
/* ===== 主题变量 ===== */
:root,body[data-theme="light"]{
  --primary:#2b6de5;--primary-light:#eaf1fe;
  --success:#1a9e5c;--success-light:#e6f7ee;
  --danger:#e34d4d;--danger-light:#fdecec;
  --warn:#e8a33d;--warn-light:#fdf4e6;
  --bg:#f4f5f7;--card:#fff;--text:#1a1a1a;--text-2:#666;--text-3:#999;
  --border:#e8eaed;--input-bg:#f4f5f7;--hover:#f7f8fa;--active:#eceef1;
  --shadow:0 1px 3px rgba(0,0,0,.04);
  --hero-from:#2b6de5;--hero-to:#4b8bf5;
}
body[data-theme="dark"]{
  --primary:#5b9aff;--primary-light:#1e2d47;
  --success:#3ecf8e;--success-light:#15342a;
  --danger:#ff6b6b;--danger-light:#3a1f1f;
  --warn:#f0b350;--warn-light:#3a2f1a;
  --bg:#121418;--card:#1c1f26;--text:#e6e8eb;--text-2:#9aa0a8;--text-3:#6b7280;
  --border:#2a2e37;--input-bg:#252932;--hover:#22262e;--active:#2a2e37;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --hero-from:#1e3a6b;--hero-to:#2b5296;
}
body[data-theme="eye"]{
  --primary:#4a8b6f;--primary-light:#dcebe2;
  --success:#3d8b5f;--success-light:#d8ecdf;
  --danger:#c25a4a;--danger-light:#f2ddd8;
  --warn:#b8873a;--warn-light:#f0e6d2;
  --bg:#c7e0c8;--card:#d8ecd9;--text:#2c3a2e;--text-2:#556b58;--text-3:#7d9480;
  --border:#b3d0b5;--input-bg:#cfe4d0;--hover:#cde3ce;--active:#c2dbc4;
  --shadow:0 1px 3px rgba(60,90,60,.08);
  --hero-from:#4a8b6f;--hero-to:#6aa886;
}
*{transition:background-color .2s,border-color .2s,color .2s}
/* ===== 极简顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  height:calc(42px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding-left:6px;padding-right:6px;
}
.topbar .back{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:20px;color:var(--text);cursor:pointer;flex-shrink:0;
}
.topbar .back:active{background:var(--active)}
.topbar .title{
  flex:1;font-size:15px;font-weight:600;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
}
.topbar .action{
  min-width:34px;height:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:13px;color:var(--primary);cursor:pointer;flex-shrink:0;
}
.topbar .action:active{background:var(--active)}
/* ===== 页面 ===== */
.page{display:none;min-height:calc(100vh - 42px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.page.active{display:block}
/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 12px;box-shadow:var(--shadow)}
/* ===== 首页 ===== */
.hero{
  background:linear-gradient(135deg,var(--hero-from),var(--hero-to));color:#fff;
  padding:16px 16px 20px;border-radius:0 0 18px 18px;position:relative;
}
.hero h1{font-size:17px;font-weight:600;margin-bottom:2px;padding-right:80px}
.hero p{font-size:12px;opacity:.85}
.hero-stats{display:flex;gap:8px;margin-top:12px}
.hero-stat{flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:7px 4px;text-align:center}
.hero-stat b{display:block;font-size:16px;font-weight:700}
.hero-stat span{font-size:10px;opacity:.9}
/* 主题切换（首页右上角） */
.theme-switch{
  position:absolute;top:14px;right:12px;display:flex;gap:4px;
  background:rgba(255,255,255,.2);border-radius:20px;padding:3px;
}
.theme-switch i{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;font-style:normal;opacity:.6;transition:all .2s;
}
.theme-switch i.on{background:rgba(255,255,255,.9);opacity:1;transform:scale(1.05)}
/* 继续学习 */
.resume-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border-radius:12px;padding:11px 13px;margin:10px 12px;
  box-shadow:0 2px 8px rgba(43,109,229,.12);border:1px solid var(--primary-light);
}
.resume-bar .ico{width:34px;height:34px;border-radius:9px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.resume-bar .info{flex:1;min-width:0}
.resume-bar .info b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-bar .info span{font-size:11.5px;color:var(--text-2)}
.resume-bar .go{background:var(--primary);color:#fff;border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600;flex-shrink:0}
/* 功能网格 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:0 12px}
.grid-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:12px;cursor:pointer}
.grid-item:active{background:var(--active)}
.grid-item .gi{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.grid-item span{font-size:11px;color:var(--text-2);text-align:center;line-height:1.3}
/* 列表 */
.list-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--hover)}
.list-item .li-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-main b{display:block;font-size:14px;font-weight:500}
.list-item .li-main span{font-size:11.5px;color:var(--text-3)}
.list-item .li-arrow{color:var(--text-3);font-size:16px}
.list-group{background:var(--card);border-radius:12px;overflow:hidden;margin:10px 12px;box-shadow:var(--shadow)}
/* 进度条 */
.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
/* ===== 答题页 ===== */
.quiz-head{
  position:sticky;top:calc(42px + env(safe-area-inset-top,0px));z-index:90;
  background:var(--card);padding:7px 12px;border-bottom:1px solid var(--border);
}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:5px}
.quiz-meta .idx b{color:var(--primary);font-size:14px;font-weight:700}
.quiz-body{padding:12px 12px 96px}
.q-type-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--primary-light);color:var(--primary);font-weight:600;margin-bottom:8px}
.q-type-tag.multi{background:var(--warn-light);color:var(--warn)}
.q-type-tag.judge{background:var(--success-light);color:var(--success)}
.q-stem{font-size:15.5px;line-height:1.7;font-weight:500;margin-bottom:12px;color:var(--text)}
.q-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.q-tags span{font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--input-bg);color:var(--text-2)}
/* 选项 */
.opt{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:11px;margin-bottom:8px;cursor:pointer;transition:all .15s;
}
.opt:active{transform:scale(.995)}
.opt .key{
  width:23px;height:23px;border-radius:50%;border:1.5px solid var(--text-3);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:var(--text-2);flex-shrink:0;margin-top:1px;
}
.opt .txt{flex:1;font-size:14.5px;line-height:1.6;word-break:break-word}
.opt.selected{border-color:var(--primary);background:var(--primary-light)}
.opt.selected .key{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.correct{border-color:var(--success);background:var(--success-light)}
.opt.correct .key{background:var(--success);border-color:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-light)}
.opt.wrong .key{background:var(--danger);border-color:var(--danger);color:#fff}
.opt.disabled{pointer-events:none;opacity:.85}
/* 解析 */
.analysis{
  background:var(--card);border-radius:10px;padding:11px;margin-top:12px;
  border-left:3px solid var(--primary);font-size:13.5px;line-height:1.7;
}
.analysis b{color:var(--primary);display:block;margin-bottom:4px;font-size:12.5px}
.analysis .ans{color:var(--success);font-weight:600}
/* 底部操作栏 */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:95;
  background:var(--card);border-top:1px solid var(--border);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  display:flex;gap:7px;align-items:center;
}
.btn{
  flex:1;height:42px;border-radius:10px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:disabled{opacity:.45}
.btn-ghost{background:var(--input-bg);color:var(--text)}
.btn-sm{height:34px;font-size:13px;flex:0 0 auto;padding:0 13px}
.btn-icon{flex:0 0 42px;width:42px;height:42px;border-radius:10px;background:var(--input-bg);color:var(--text-2);font-size:17px;border:none;cursor:pointer}
.btn-icon.on{color:var(--warn);background:var(--warn-light)}
.btn-icon.marked{color:#fff;background:var(--warn)}
/* ===== 考试 ===== */
.exam-timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--primary)}
.exam-timer.danger{color:var(--danger)}
/* ===== 答题卡（紧凑小方块） ===== */
.sheet-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:10px}
.sheet-cell{
  aspect-ratio:1;border-radius:5px;background:var(--input-bg);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;cursor:pointer;position:relative;
  min-height:0;
}
.sheet-cell.done{background:var(--primary-light);color:var(--primary)}
.sheet-cell.cur{outline:2px solid var(--primary);outline-offset:1px}
.sheet-cell.right{background:var(--success-light);color:var(--success)}
.sheet-cell.wrong{background:var(--danger-light);color:var(--danger)}
.sheet-cell.marked::after{
  content:'';position:absolute;top:1px;right:1px;
  width:5px;height:5px;border-radius:50%;background:var(--warn);
}
.sheet-legend{display:flex;gap:12px;padding:0 12px 10px;font-size:11px;color:var(--text-3);flex-wrap:wrap}
.sheet-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:middle}
/* ===== 弹层 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end}
.mask.show{display:flex}
.sheet{
  background:var(--card);width:100%;border-radius:16px 16px 0 0;
  max-height:78vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.sheet-head b{font-size:15px}
.sheet-head .close{color:var(--text-3);font-size:20px;cursor:pointer;line-height:1}
.sheet-body{overflow-y:auto;padding:2px 0}
/* ===== 统计 ===== */
.stat-row{display:flex;gap:8px;margin:10px 12px}
.stat-box{flex:1;background:var(--card);border-radius:10px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-box b{display:block;font-size:18px;font-weight:700;color:var(--primary)}
.stat-box span{font-size:10.5px;color:var(--text-3)}
/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty .e-ico{font-size:44px;margin-bottom:10px;opacity:.5}
.empty p{font-size:13px}
/* ===== 表单 ===== */
.form-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.form-item:last-child{border-bottom:none}
.form-item label{font-size:14px;color:var(--text)}
.form-item input[type=number],.form-item select{
  border:none;background:var(--input-bg);border-radius:7px;padding:7px 10px;
  font-size:14px;text-align:right;width:110px;outline:none;color:var(--text);
}
.form-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
/* ===== 结果页 ===== */
.result-hero{text-align:center;padding:24px 20px 16px;background:var(--card);margin:10px 12px;border-radius:14px}
.result-score{font-size:42px;font-weight:800;line-height:1.1;color:var(--primary)}
.result-score.pass{color:var(--success)}
.result-score.fail{color:var(--danger)}
.result-label{font-size:13px;color:var(--text-2);margin-top:4px}
/* toast */
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:9px;
  font-size:13.5px;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1}
/* 多标签页遮罩 */
.dup-mask{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
}
.dup-mask.show{display:flex}
.dup-mask .ico{font-size:52px;margin-bottom:16px}
.dup-mask h2{font-size:17px;margin-bottom:10px;color:var(--text)}
.dup-mask p{font-size:13.5px;color:var(--text-2);line-height:1.8;margin-bottom:20px}
::-webkit-scrollbar{width:0;height:0}

/* ===== 新增：实操题 ===== */
.q-type-tag.essay{background:var(--danger-light);color:var(--danger)}
.essay-block{
  background:var(--card);border-radius:10px;padding:12px;margin-top:14px;
  border-left:3px solid var(--warn);
}
.essay-title{font-size:13px;font-weight:600;color:var(--warn);margin-bottom:8px}
.ap-list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.85;color:var(--text)}
.ap-list li{margin-bottom:6px;word-break:break-word}
.essay-actions{margin-top:14px}
.btn-ok{background:var(--success);color:#fff}
.btn-bad{background:var(--danger);color:#fff}
.self-result{text-align:center;font-size:13.5px;font-weight:600;padding:9px;border-radius:8px}
.self-result.ok{background:var(--success-light);color:var(--success)}
.self-result.bad{background:var(--danger-light);color:var(--danger)}
/* ===== 新增：解析分区 ===== */
.ana-sec{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.ana-sec b{color:var(--primary);display:block;margin-bottom:4px;font-size:12.5px}
.ana-sec.pitfall{border-top-color:var(--warn)}
.ana-sec.pitfall b{color:var(--warn)}
.ana-sec.kp{border-top-color:var(--text-3)}
.ana-sec.kp b{color:var(--text-2)}
/* ===== 新增：专项/难度/知识点标签 ===== */
.q-tags .tag-topic{background:var(--primary-light);color:var(--primary)}
.q-tags .tag-kp{background:var(--warn-light);color:var(--warn)}
.q-tags .tag-diff{font-weight:600}
.q-tags .tag-diff.d-easy{background:var(--success-light);color:var(--success)}
.q-tags .tag-diff.d-hard{background:var(--warn-light);color:var(--warn)}
.q-tags .tag-diff.d-hell{background:var(--danger-light);color:var(--danger)}
/* ===== 新增：首页题库切换 ===== */
.bank-switch{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.bank-switch h1{margin:0}
.bs-arrow{font-size:11.5px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.18);
  padding:2px 7px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.bank-list{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bank-item{padding:12px;border:1.5px solid var(--border);border-radius:10px;
  margin-bottom:9px;cursor:pointer;background:var(--card)}
.bank-item.on{border-color:var(--primary);background:var(--primary-light)}
.bi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bi-top b{font-size:14px;line-height:1.45;font-weight:600;color:var(--text)}
.bi-on{font-size:10px;background:var(--primary);color:#fff;padding:2px 6px;
  border-radius:4px;flex-shrink:0;font-weight:600}
.bi-sub{font-size:11.5px;color:var(--text-3);margin-top:5px}
/* ===== 新增：分区标题 ===== */
.sec-title{padding:12px 14px 4px;font-size:12px;color:var(--text-3);font-weight:600}
.hero-sub{font-size:11.5px;opacity:.82;margin-bottom:4px;line-height:1.5}
.bank-switch h1{font-size:17px;line-height:1.35;word-break:break-word;text-align:center;max-width:100%}

</style>
</head>

<div class="topbar" id="topbar"></div>
<div class="page" id="page-home"></div>

<div class="page" id="page-fav"></div>
<div class="page" id="page-review"></div>

<div class="page" id="page-exams"></div>
<div class="page" id="page-banks"></div>

<div class="page" id="page-settings"></div>

  <p>本应用不支持同时打开多个标签页，<br>否则会导致学习进度互相覆盖。<br><br>请关闭其他标签页后，<br>刷新本页面继续使用。</p>

</div>

/* ===== 内置题库数据（新版：1 个题库 / / 题） ===== */
const BUILTIN_BANKS = [
  {
    "id":"builtin_fj_cs_01",
    "name":"辅警·常识判断综合特训题库",
    "subtitle":"辅警笔试｜常识判断专项刷题",

	{"i":"fjcs_0001","type":"single","t":"危害后果是危害行为给刑法所保护的法益所造成的现实侵害事实与现实危险状态,下列关于危害后果说法错误的是()。","o":[["A","小李与人斗殴,将对方打成轻伤,小李事后自首,小李的行为没有造成危害后果"],["B","某顾客携带水果刀进入火车站候车,安检时,水果刀被没收,该旅客的行为没有造成危害后果"],["C","刘某见邻居的汽车很少使用,便私自偷出使用,使用期间勤于保养,汽车不但没有被损坏,而且性能更胜从前,其行为造成了危害后果"],["D","某活禽市场老板故意不配合活禽卫生检疫检查,但未造成疫病传播,该老板的行为没有造成危害后果"]],"a":["A"],"an":"打成轻伤已经造成了危害后果，有现实的侵害事实，自首不能表示该情节不存在。B没收的水果刀显然没有造成任何危害后果。C虽然私自使用邻居车辆是违法行为，但是由于车的性能比以前更好。D只是没有配合检查，而且题干表述没有造成疫情传播，更不能确定该老板的货就含有病源，故D也没有造成危害后果。","tp":"刑法常识","d":"中"},
	{"i":"fjcs_0002","type":"single","t":"“互联网”模式指的是互联网“+”()。","o":[["A","技术变革"],["B","传统的各行各业"],["C","创新产业"],["D","现代服务业"]],"a":["B"],"an":"通俗来说，“互联网+”就是“互联网+各个传统行业”，但这并不是简单的两者相加，而是利用信息通信技术以及互联网平台，让互联网与传统行业进行深度融合，创造新的发展生态。","tp":"科技经济","d":"易"},
	{"i":"fjcs_0003","type":"single","t":"地质学把自然界引起地壳或岩石圈的物质组成、结构、构造及地表形态等不断发生变化的各种作用称为地质作用。下列关于地质作用的表述不正确的是:","o":[["A","“阡陌交通”与地质作用相关"],["B","可分为表层和内部两种类型"],["C","同时具有破坏性和再造性"],["D","岩浆作用主要由地热能提供动力"]],"a":["A"],"an":"“阡陌交通”指田间小路交错相通。阡陌，指农田地里的小道和灌溉渠道，纵者称“阡”，横者称“陌”。“阡陌交通”主要受到人的影响，与地质作用无关。地质作用包括表层和内部，也就是外力作用和内力作用两种；地质作用既有破坏性，又有再造性；岩浆运动主要动力由地热能提供。","tp":"地理常识","d":"易"},
	{"i":"fjcs_0004","type":"single","t":"资本国际化是指资本越出一国的范围在国际间运动和增值。下列未能体现资本国际化的是( )","o":[["A","某集团以数十亿美元收购国外企业"],["B","某公司撤出伦敦股市的资金转投芝加哥商品期货市场"],["C","两个国家的农产品贸易集团签署相互持股的协议"],["D","各国消费者通过电商购买境外的商品和劳务"]],"a":["D"],"an":"资本国际化关键词：资本，国际。ABC三项均符合上述关键词的表述，而D项消费者购买商品和劳务是正常的消费行为，而非资本的跨国运作。","tp":"经济常识","d":"中"},
	{"i":"fjcs_0005","type":"single","t":"高铁列车的车窗和车门在运行过程中必须完全密闭。对此，下列解释最准确的是( )","o":[["A","减少高铁列车运行的能源消耗"],["B","保持高铁列车车厢内部的安静"],["C","避免车速过快形成空气压强差"],["D","确保高铁列车车厢内部的整洁"]],"a":["C"],"an":"高铁列车行驶时会产生巨大的空气压力强差，特别是列车进出隧道和两车交会时的巨大噪声也会乘虚而入，轻则使乘客耳膜产生压迫感，重则会使乘客感到头晕恶心，严重时甚至造成耳膜破裂。车窗车门密闭抵消压强差。","tp":"物理科技","d":"易"},
	{"i":"fjcs_0006","type":"single","t":"返乡大学生陈某利用互联网销售家乡的土特农产品,取得了较好的收益,为了更好地发展当地的互联网经济,他准备发起成立本县电商协会。该协会的合法登记机关应是( )","o":[["A","县公安局"],["B","县工商局"],["C","县民政局"],["D","县经信局"]],"a":["C"],"an":"《社会团体登记管理条例》第六条第一款规定:“国务院民政部门和县级以上地方各级人民政府民政部门是本级人民政府的社会团体登记管理机关。”","tp":"法律常识","d":"中"},
	{"i":"fjcs_0007","type":"single","t":"梯田是在山坡上开辟的农田,样子像楼梯,每一级边缘均筑有田埂。一些历史悠久的梯田已成为受国家保护的文化遗产。修建梯田的主要目的是()。","o":[["A","保护环境"],["B","传承文化"],["C","保持水土"],["D","节约人力"]],"a":["C"],"an":"修建梯田可以使田地的坡度减小，防止丘陵斜坡上的水土流失，有利于保持水土，发展农业。A说的过于宽泛，BD与题干无关。","tp":"地理农业","d":"易"},
	{"i":"fjcs_0008","type":"single","t":"在众多色彩中,人们往往对红色“情有独钟”,常采用红灯做指示,比如指挥交通的红灯,汽车尾部的红灯,公共场所安全门的红灯。这是因为,红色光在可见光中()。","o":[["A","波长最长,且不容易被散射"],["B","波长最短,且不容易被散射"],["C","波长最长,且容易被散射"],["D","波长最短,且容易被散射"]],"a":["A"],"an":"在所有的可见光中，红光的波长是最长的，因此红光的穿透力最强。大气对光的散射有一个特点：波长较短的光容易被散射，波长较长的光不容易被散射；因此红光不易被散射，它可以传得较远。","tp":"物理常识","d":"易"},
	{"i":"fjcs_0009","type":"single","t":"吸烟严重威胁人体健康。针对香烟产生的各种有害物质的描述,下列说法错误的是()。","o":[["A","尼古丁可让吸烟者成瘾,并有较强的毒性"],["B","烟焦油易沉积于肺等器官,可诱发癌变"],["C","香烟燃烧时物质分解放出的射线可以致癌"],["D","一氧化碳易溶于水,从而与血红蛋白结合"]],"a":["D"],"an":"一氧化碳更容易和血红蛋白结合的原因是：一氧化碳与血红蛋白的亲和力比氧和血红蛋白的亲和力大200‑300倍而非易溶于水，二者无因果关系，且一氧化碳的物理性质之一是可溶于水，而非易溶于水。","tp":"生物健康","d":"中"},
	{"i":"fjcs_0010","type":"single","t":"2015 年10 月19 日至23 日,习近平主席对英国进行了国事访问。期间,习主席在英国议会发表讲话时强调,中英虽然地处亚欧两端,却长期彼此吸引。新中国成立以来,两国关系创下了多项“第一”。对此下列说法中错误的是( )","o":[["A","英国是开办孔子学院最多的欧盟国家"],["B","英国是第一个与我国建立外交关系的国家"],["C","英国是首个发行人民币国债的西方国家"],["D","英国是最早申请加入亚洲基础设施投资银行的西方大国"]],"a":["B"],"an":"瑞典于1950 年1 月14 日承认新中国，1950 年5 月9 日同中国建交，是第一个与中国建交的西方国家。所以B选项错误，其他表述均正确。","tp":"时政外交","d":"中"},
	{"i":"fjcs_0011","type":"single","t":"宪法的基本原则是指人们在制定和实施宪法的过程中必须遵循的最基本的准则。下面对我国宪法的基本原则表述正确的是()。","o":[["A","人民主权原则、基本人权原则、法治原则和权力制约原则"],["B","人民主权原则、罪名法定原则、法治原则和权力制约原则"],["C","基本人权原则、依法解释原则、法治原则和经济中立原则"],["D","基本人权原则、罪名法定原则、法治原则和经济中立原则"]],"a":["A"],"an":"我国宪法四大基本原则：人民主权原则、基本人权原则、法治原则、权力制约原则。罪名法定属于刑法原则。","tp":"宪法","d":"中"},
	{"i":"fjcs_0012","type":"single","t":"十八世纪一位德国数学家在写给著名数学家欧拉的一封信中,提出一个猜想。该猜想可以表述为:(一)任何不小于6 的偶数,都是两个奇素数之和;(二)任何不小于9 的奇数,都是三个奇素数之和。我国著名数学家陈景润在证明这一猜想中作出了重大贡献,这个猜想是()","o":[["A","莫德尔猜想"],["B","哥德巴赫猜想"],["C","康威‑诺顿猜想"],["D","四色猜想"]],"a":["B"],"an":"陈景润的陈氏定理推进哥德巴赫猜想的证明。","tp":"科技历史","d":"易"},
	{"i":"fjcs_0013","type":"single","t":"“四个全面”是新一届党的领导集体治国理政的战略布局。下列与“四个全面”有关的说法正确的是:","o":[["A","党的十八大通过了《中共中央关于全面深化改革若干重大问题的决定》"],["B","十八届三中全会通过了《中共中央关于全面推进依法治国若干重大问题的决定》"],["C","十八届四中全会提出了“全面建成小康社会”的战略目标"],["D","习近平总书记在江苏调研时将“从严治党”首次提升到“全面从严”的高度"]],"a":["D"],"an":"《中共中央关于全面深化改革若干重大问题的决定》是十八届三中全会通过；《中共中央关于全面推进依法治国若干重大问题的决定》十八届四中全会通过；全面建成小康社会是十八大提出；2014年12月江苏调研首次提出全面从严治党。","tp":"时政党史","d":"中"},

	{"i":"fjcs_0015","type":"single","t":"下列文字中画横线部分存在错误的是:古代的东西方商路主要有三条:一条是从中亚由陆路沿里海、波罗的海(A)到小亚细亚;一条是先由海路至波斯湾,然后经两河流域到地中海东岸(B)的叙利亚一带;第三条是先由海路至红海,然后再由陆路到埃及(C)的亚历山大港。在这几条商路中,红海以东由阿拉伯商人(D)掌握;地中海一带则为意大利的威尼斯和热那亚所垄断。","o":[["A","(A)"],["B","(B)"],["C","(C)"],["D","(D)"]],"a":["A"],"an":"波罗的海在北欧，和里海‑小亚细亚不在一条线路，A错误。","tp":"历史地理","d":"中"},
	{"i":"fjcs_0016","type":"single","t":"“行政机关不得法外设定权力,没有法律法规依据不得作出减损公民、法人和其他组织合法权益或者增加其义务的决定”,这体现了法治政府建设中哪项要求?","o":[["A","职能科学"],["B","守法诚信"],["C","执法严明"],["D","权责法定"]],"a":["D"],"an":"权责法定含义就是法无授权不可为，行政机关权力由法律规定，不得法外设定权力。","tp":"行政法","d":"中"},
	{"i":"fjcs_0017","type":"single","t":"下列作品与第二次世界大战有关的是:","o":[["A","《辛德勒名单》"],["B","《静静的顿河》"],["C","《智取威虎山》"],["D","《战争与和平》"]],"a":["A"],"an":"《辛德勒名单》记录二战时期保护犹太人。《静静的顿河》一战前后；《智取威虎山》解放战争；《战争与和平》拿破仑战争。","tp":"文学历史","d":"易"},

	{"i":"fjcs_0019","type":"single","t":"关于古代思想家,下列对应错误的是:","o":[["A","独与天地精神相往来——荀子"],["B","虽千万人,吾往矣——孟子"],["C","知其不可而为之——孔子"],["D","摩顶放踵利天下——墨子"]],"a":["A"],"an":"“独与天地精神相往来”出自《庄子》，不是荀子。","tp":"诸子百家","d":"中"},
	{"i":"fjcs_0020","type":"single","t":"假如某国出现比较严重的经济衰退,该国当局却不能运用货币政策进行调节。这个国家可能是:","o":[["A","德国"],["B","美国"],["C","英国"],["D","新加坡"]],"a":["A"],"an":"德国属于欧元区，货币政策由欧洲中央银行统一制定，德国无独立货币政策。","tp":"经济常识","d":"中"},
	{"i":"fjcs_0021","type":"single","t":"关于当代文学,下列说法错误的是:","o":[["A","《白鹿原》获得“茅盾文学奖”"],["B","《平凡的世界》是史铁生的作品"],["C","余华是先锋文学的代表人物之一"],["D","电影《大红灯笼高高挂》由苏童的小说改编"]],"a":["B"],"an":"《平凡的世界》作者路遥，不是史铁生。","tp":"文学常识","d":"易"},
	{"i":"fjcs_0022","type":"single","t":"下列关于党的重要思想,按提出时间先后顺序排列正确的是:①社会主义市场经济理论②“三个代表”重要思想③社会主义本质理论④构建社会主义和谐社会理念","o":[["A","①②③④"],["B","①②④③"],["C","③①②④"],["D","③②①④"]],"a":["C"],"an":"③社会主义本质理论（1992南方谈话）；①社会主义市场经济理论（十四大1992.10）；②三个代表（2000）；④构建社会主义和谐社会（十六届四中全会2004）。顺序③①②④。","tp":"党史时政","d":"中"},
	{"i":"fjcs_0023","type":"single","t":"下列古文中能够体现领导者榜样效应的是:","o":[["A","止宿公署,夜则祷于天,昼则出赈饥民,终日无少怠"],["B","为政以德,譬如北辰,居其所而众星共之"],["C","其身正,不令而行;其身不正,虽令不从"],["D","乐民之乐者,民亦乐其乐;忧民之忧者,民亦忧其忧"]],"a":["C"],"an":"“其身正，不令而行；其身不正，虽令不从”出自论语，强调领导者以身作则，发挥榜样示范作用。","tp":"古文哲学","d":"中"},
	{"i":"fjcs_0024","type":"single","t":"中国加入世界贸易组织以来,价廉物美的“中国制造”走入国外亿万家庭,走向海外的中国企业贡献卓著,规模庞大的中国市场充满吸引力,数以亿计的中国游客出境旅游。对此,下列说法错误的是:","o":[["A","中国的发展给全球经济提供巨大动力源泉"],["B","中国与世界各国开始共同分享发展红利"],["C","中国在世界经济体系中拥有绝对的话语权"],["D","中国入世后所做贡献得到了国际社会认可"]],"a":["C"],"an":"我国是国际规则制定参与者，不具备绝对话语权，“绝对”表述过于绝对错误。","tp":"经济时政","d":"易"},
	{"i":"fjcs_0025","type":"single","t":"在日常生活和工作中,人们遭受挫折后有时会找理由自我安慰,以降低挫折感,恢复心理平衡,这是心理防御机制中心的“合理化”方法,下列不属于采用这种方法进行心理防御的是:","o":[["A","小朱上班途中发现包裹被盗,笑着说破财免灾"],["B","小邢的请求被同事拒绝,认为同事肯定有自己的难处"],["C","小范竞争上岗未能如愿,心想这个辛苦的岗位不干也罢"],["D","小马因工作失误受到批评,感觉领导在利用职权公报私仇"]],"a":["B"],"an":"B选项是对同事的体谅理解，不属于合理化心理防御；A甜柠檬；C酸葡萄；D推诿。","tp":"心理常识","d":"中"},
	{"i":"fjcs_0026","type":"single","t":"关于通信,下列说法错误的是:","o":[["A","如今“通信”这一术语一般指“电信”"],["B","电信是利用电信号来传输信息的通信方式"],["C","击鼓和鸣金传递作战命令也是通信手段"],["D","赫兹证明了电磁波的存在,开创了通信新时代"]],"a":["A"],"an":"通信不单单指电信，还包括邮政通信等信息传递方式。","tp":"科技常识","d":"中"},
	{"i":"fjcs_0027","type":"single","t":"下列古诗词中,表达作者对友人的思念之情的是:","o":[["A","上邪,我欲与君相知,长命无绝衰"],["B","问世间,情为何物,直教人生死相许"],["C","曾经沧海难为水,除却巫山不是云"],["D","红豆生南国,春来发几枝。愿君多采撷,此物最相思"]],"a":["D"],"an":"王维《相思》又名《江上赠李龟年》，怀念友人；其余都是爱情。","tp":"古诗词","d":"易"},
	{"i":"fjcs_0028","type":"single","t":"在银行的资产负债表中,客户存款属于:","o":[["A","资产"],["B","权益"],["C","资金"],["D","负债"]],"a":["D"],"an":"对银行而言客户存款属于负债，银行需要对储户还本付息。","tp":"经济金融","d":"中"},
	{"i":"fjcs_0029","type":"single","t":"我国古代用“金”“石”“丝”“竹”指代不同材质、类别的乐器。下列诗词涉及“竹”的是:","o":[["A","珠帘夕殿闻钟磬,白日秋天忆鼓鼙"],["B","主人有酒欢今夕,请奏鸣琴广陵客"],["C","深秋帘幕千家雨,落日楼台一笛风"],["D","哀筝一弄湘江曲,声声写尽湘波绿"]],"a":["C"],"an":"八音之竹指竹制吹奏乐器，笛子属于竹；磬是石；琴、筝属于丝。","tp":"文化常识","d":"中"},
	{"i":"fjcs_0030","type":"single","t":"司马谈《论六家要旨》:“______博而寡要,劳而少功,是以其事难尽从;然其序君臣父子之礼,列夫妇长幼之别,不可易也。______俭而难遵,是以其事不可遍循;然其强本节用,不可废也。______严而少恩;然其正君臣上下之分,不可改矣。______使人俭而善失真;然其正名实,不可不察也。”①②③④处应分别填入:","o":[["A","儒家、墨家、道家、法家"],["B","道家、名家、墨家、儒家"],["C","儒家、墨家、法家、名家"],["D","儒家、法家、兵家、名家"]],"a":["C"],"an":"序君臣父子之礼对应儒家；强本节用对应墨家；严而少恩对应法家；正名实对应名家。","tp":"诸子百家","d":"难"},
	{"i":"fjcs_0031","type":"single","t":"挑拨防卫是指故意挑拨他人对自己进行攻击，然后以“正当防卫”为借口对其加以侵害的行为。下列属于挑拨防卫的是：","o":[["A","某甲与某乙妻子通奸，被乙痛打，遂产生杀人报复之念。甲先到乙门口把乙妻叫出来，乙追出来便打，甲用匕首将乙捅死"],["B","王、赵二人争吵不休，王说：“你再骂，我就打你！”赵不甘示弱：“你打我试试。”于是二人打了起来"],["C","兄弟三人争夺一个家传古砚，老大一气之下将其摔碎，老二老三一起殴打老大，老大奋起反抗"],["D","一无业人员抢夺别人皮包时被抓住，遭到殴打，于是拼命还手，造成对方伤亡"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n该定义强调“故意挑拨他人对自己进行攻击”。\n第二步：逐一判断选项。\nA项中，甲把乙妻叫出来，让乙先追出来打自己，甲再用匕首捅死乙，符合定义提到的“故\n意挑拨他人对自己进行攻击”；\nB、C两项是在互相争吵、互相争夺的过程中发生的殴打行为，不存在一方先故意挑拨另一\n方的情形；\nD项是因为抢夺他人财物遭到殴打，而不是故意挑拨他人来殴打自己。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0032","type":"single","t":"科技实力是指国家为了追求和实现发展战略目标，在全国和全球范围内，利用各种科学技术资源的能力。它包括科学创新能力、技术创新能力、利用新技术的能力、利用全球信息的能力和研究与发展投资的能力，一个国家的科技实力，为该国获取、利用和配置各类科技资源的能力集中体现。根据以上定义，一个国家的科技实力是：","o":[["A","科技是否在世界同类科技的先进水平"],["B","在世界科技技术竞争格局下的总体实力情况"],["C","该国科学技术的“绝对实力”"],["D","该国科学技术的“静态实力”"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“利用各种科学技术资源的能力”，“获取、利用和配置各类科技资源的能力”。\n第二步：逐一判断选项。\n科技实力强调利用各种科学技术资源的能力，是一个能力集，应该是总体实力情况。\nA中的“同类科技”只是一种特定能力，因此A错；\nB中“总体实力情况”符合题意，因此B正确；\nC中的“绝对实力”和D中的“静态实力”不能从题干中得到具体指代什么，因此C和D均错。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0033","type":"single","t":"法律文书是指法律机关依法制作的在其法律活动中承担法律职能、具有法律意义和法律效力的文书。下列属于法律文书的是：","o":[["A","张某关于其死后财产分割问题的遗嘱"],["B","法院关于冻结李某银行账号的裁定"],["C","检察院关于调整上下班时间的公告"],["D","公安局关于规范干警职务行为的十条禁令"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“法律机关”，“法律活动”，“承担法律职能”。\n第二步：逐一判断选项。\nA中的张某不是法律机关，因此A错；\nB中的裁定符合关键词，因此B正确；\nC中的公告不承担法律职能，只是具有规范作用，因此C错；\nD中的规范的干警职务行为不属于法律活动，因此D错。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0034","type":"single","t":"概念的内涵是概念所反映的对象的本质属性，它是概念质的规定性，说明概念所反映的对象是什么样的。下列不是从内涵方面说明概念的是：","o":[["A","单身汉是未婚成年的男性"],["B","社会关系包括经济、思想、政治、文化以及家庭等各方面的关系"],["C","鱼是用鳃呼吸、鳍游水、有脊椎的水生动物"],["D","商品是用来交换的劳动产品"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n题干中对“概念的内涵”的定义强调了“本质属性”，“说明反映的对象是什么样的”。\n第二步：逐一判断选项。\nA、C、D三项都是说明事物是什么，是怎么样的。\nB列举了“社会关系”包括哪些关系，提出了“社会”包含了哪些层面的内容，而没有说明“社会\n关系”是什么，B属于概念的外延。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0035","type":"single","t":"霸王条款是指一些经营者单方面制定的逃避法定义务、减免自身责任的不平等格式合同、通知、声明和店堂告示或者行业惯例等，限制消费者权利，严重侵害消费者利益。根据上述定义，下列选项中不属于霸王条款的是：","o":[["A","某美容院告示：因已投保，如需要索赔需向保险公司要求赔偿"],["B","某餐厅告示：请保管好自己的物品，丢失本店概不负责"],["C","某些商场在促销广告中规定：本商场对促销活动内容拥有最终解释权"],["D","某房东提出，每个月增加500元房租，否则就不与租房者签订房屋续租合同"]],"a":["D"],"an":"第一步：关键词查找。\n主体：经营者；客体：消费者。\n第二步：逐一分析选项。\nABC三项均符合霸王条款的定义要点；\nD项房东不属于经营者。房东是出租或出借房屋的人，是房客对房主的称呼。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0036","type":"single","t":"新闻侵权：是指行为人通过新闻媒体（包括通讯社、报刊杂志、广播电视、公共网站等）向社会公众传播不真实的情况，或情况虽然真实但属于法律禁止传播的事项，从而侵害了他人的合法民事权利，依法应当承担法律后果的行为和事实。以下不属于新闻侵权的是：","o":[["A","某电台为名不副实的增高产品“高尔宝”做广告，欺骗了很多消费者"],["B","某出版社经过鲁迅先生家属同意，再次修订出版《鲁迅全集》"],["C","某电视台大肆宣传包治百病的某种秘方药物，引来观众的阵阵声讨"],["D","某杂志未经刘翔本人允许，擅自将其在奥运会上的跨栏照片当作封面"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“不真实的情况”，“情况虽然真实但属于法律禁止传播”，“侵害了他人的合法民事\n权利”。\n第二步：逐一判断选项。\nA中宣传的是“名不副实”的产品，且欺骗了很多消费者，符合关键词，因此属于新闻侵权；\nB中修订出版的是书，是经过家属同意了的，不符合关键词“侵害了他人的合法民事权利”，\n因此不属于新闻侵权；\nC中宣传的是某种秘方药物，其真实性无法确定，并引来观众声讨，符合关键词，因此属于\n新闻侵权；\nD中的杂志未经本人允许就使用他人照片，侵害了他人的合法民事权利，符合关键词，因此\n属于新闻侵权。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0037","type":"single","t":"涵化是指不同文化的群体间发生持续的接触，从而导致原有文化发生变迁的现象。根据上述定义，下列不属于涵化的是：","o":[["A","在20世纪，牛仔裤成为了风靡世界的时尚穿着"],["B","历史上英国曾将其法治文化和政治体系推行到自己的殖民地"],["C","近年来，越来越多的外国人对中国文化感兴趣，纷纷来中国学习汉语"],["D","由于英国曾长期受罗马帝国的统治及罗马天主教的影响，英语词汇中出现了大量拉丁语词"]],"a":["C"],"an":"第一步：关键词查找。本题关键词：（1）不同文化接触；（2）原有文化变迁。\n第二步：逐一分析选项。A、B、D三项都体现了不同文化群体间的接触带来的文化变迁，\n符合定义；C项，属于不同文化的接触，但是没有体现出原有文化的变迁，不符合关键词（2）。\n本题为选非题，故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0038","type":"single","t":"二次污染，指的是污染物由污染源排入环境后，在物理、化学或生物作用下生成新的污染物，而对环境产生的再次污染。以下属于二次污染的是：","o":[["A","汽车尾气中的有害化合物，在阳光作用下发生光化学反应，生成以臭氧为主的多种强氧化剂，危害人类健康"],["B","房屋装修时，施工机械发出强烈噪声，严重影响周边居民休息与生活"],["C","农药残留在棉花、麻纤维之中，制成服装后虽残留量甚微，但经常与皮肤接触也会对人体造成伤害"],["D","人们在公共场所吸入了二手烟"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n定义中强调“污染源排入环境”、“生成新的污染物”等。\n第二步：逐一判断选项。\nB项中的污染物为噪音；C项中的污染物为农药残留；D项中的污染物为烟，均未生成新的\n污染物，因此均不符合定义。\nA项中的污染物为汽车尾气中的有害化合物，新的污染物为臭氧，符合定义。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0039","type":"single","t":"外部不经济性是指经济活动主体在生产和消费过程中，给他人带来的损失或额外费用，而他人并未因此得到补偿。下列属于外部不经济性的是：","o":[["A","某项新技术发明被他人使用，没有得到使用费"],["B","桃树花开时，行人都可以享受到花香，但并未向种桃树的人交钱"],["C","上游居民大量植树，自己收获了木材又改善了下游居民的水源质量，却未收取费用"],["D","农民使用农药过量造成污染，却并没有赔偿受害者"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n外部不经济性强调“给他人带来的损失或额外费用”且“他人并未因此得到补偿”，两个条件缺\n一不可。\n第二步：逐一判断选项。\nA项“某项新技术发明被他人使用”、B项“行人都可以享受到花香”、C项“上游居民大量植树\n改善了下游居民的水源质量”都是给他人带来好处或收益，不符合“给他人带来的损失或额外\n费用”。\n而D项“农民使用农药过量造成污染”给环境造成污染，也给他人带来不利影响，符合“给他\n人带来的损失或额外费用”，同时“却并没有赔偿受害者”体现了定义“他人并未因此得到补\n偿”，两个条件均符合。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0040","type":"single","t":"斜杠青年：指不满足于从事单一职业，追求拥有多重职业身份及多元生活方式的年轻人。他们在自我介绍时往往喜欢用斜杠来区分自己的不同身份，如：张三，金牌律师/企划师/专栏作家。下列属于斜杠青年的是：","o":[["A","最近两三年，八零后导演黄某某先后出演了10多次男配角，去年在一个著名的国际电影节上斩获了最佳男配角奖"],["B","小丁在国外获得博士学位后，任职于国内一所著名高校，因科研成就突出，被破格聘为教授，并入选省“双百”人才计划"],["C","某公司程序员小陈爱好广泛，性格温和，人际关系融洽，节假日常邀上三五个好友一起登山、打球、游泳"],["D","李总做过保安，送过快递，当过安装工，开过小杂货店，他经常自豪地向员工讲述自己30多年来丰富的职业经历"]],"a":["A"],"an":"第一步：找到定义关键词\n关键词为：不满足于从事单一职业；追求拥有多重职业身份及多元生活。\n第二步：逐一分析选项\nA项：导演黄某先后出演了10次男配角，最终获得了最佳男配角奖，体现了黄某在同一时\n间所扮演的导演和演员两种不同的身份和职业，符合定义，当选；\nB项：小丁在国外获得博士学位后任职于高校，后因科研成就突出被聘为教授，从始至终小\n丁的职业只有教师这一项，没有体现多重职业和多元生活，不符合定义，排除；\nC项：小陈爱好广泛经常约朋友一起登山、打球、游泳，只是体现了不同的兴趣爱好，和职\n业无关，也没体现多重身份，不符合定义，排除；\nD项：李总做过保安、送过快递、当过安装工、开过小杂货店，虽然选项体现了李总不满足\n从事一种职业，追求多种职业身份及多元生活，但是这些身份和经验都是过往的经验，并不\n是在任当下工作之外所具有的的其他身份。结合百度百科中斜杠青年所给出的具体例子（“工\n作时间是IDC行业的程序猿，休息的时候就变成了笔耕不辍的作家，周末还能化身成变出\n一桌美味菜肴的营养师...这“程序猿/作家/营养师”的多重身份，就是对「斜杠青年」的完美\n诠释”）发现这多重身份更偏向的是某人在同一时间所具备的不同身份，?D选项不符合定义，\n排除。\n故正确答案为A。\n 第02关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0041","type":"single","t":"技术商品化，是指把技术转化为商品，技术作为一种特殊的商品已进入贸易市场，同其他的商品一样，具有使用价值和价值。根据上述定义，下列情形中不属于技术商品化的是：","o":[["A","某公司研制的“傻瓜”汉字输入软件投入市场后，销售十分火爆"],["B","五粮液集团最新调制的低度酒配方投产后，取得了极好的市场回报"],["C","用美国的一项高新技术制造的手机，已使购买者在地球的任何一个角落都能收发信息"],["D","某研究机构正在研究一种新的互联网技术，预计投产后将刷新同类产品的最高销售记录"]],"a":["D"],"an":"第一步：关键词查找。符合技术商品化定义的要点包括：（1）把技术转化为商品。\n（2）技术作为一种特殊的商品已进入贸易市场。（3）具有使用价值和价值。\n第二步：逐一分析选项。\nA选项：“傻瓜”汉字输入软件投入市场后，说明“傻瓜”汉字输入软件已经把技术转化为商品\n而且已经投入了市场；销售十分火爆，说明有使用价值和价值，符合定义要点；\nB选项：低度酒配方投产后，说明低度酒配方已经把技术转化为商品；取得了极好的市场回\n报，说明已经投入了市场，并且具有使用价值和价值，符合定义要点；\nC选项：高新技术制造的手机，说明高新技术制造的手机已经把技术转化为商品；已使购买\n者在地球的任何一个角落都能收发信息，说明已经投入了市场，并且具有使用价值和价值，\n符合定义要点；\nD选项：预计投产后将刷新同类产品的最高销售记录，并非是已经投入市场。不符合定义要\n点（2）。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0042","type":"single","t":"留置：指债权人按照合同约定占有债务人的动产，债务人不按合同约定的期限履行债务的，债权人有权依法留置该动产，以该财产的折价或者以拍卖、变卖该财产的价款优先受偿。下列情况中属于留置的是：","o":[["A","一企业家雄心勃勃，他在企业效益特别好的时候，并没有把利润以股息、红利、奖金等形式散了下去，而是留在企业，作为进一步发展的资本"],["B","银行在康某到期仍无力偿还贷款的情况下，以其作为抵押的房产折价拍卖后全部款项归入银行"],["C","某企业因经营不善，无力偿还其所欠另一家企业的债务，依据合同，在其宣告破产后，另一家企业直接接管并拥有了该企业"],["D","一古董商买进一批重要文物需大笔钱财，因此他向一位同行签订合同借款500万。在合同生效后，根据合同另一古董商取走了他店里的一批古董作为抵押"]],"a":["D"],"an":"第一步：找到定义关键词。\n债权人，债务人的动产，以该财产的折价或者以拍卖、变卖该财产的价款优先受偿。\n第二步：逐一分析选项。\nA项不存在债权人和债务人，不符合定义；\nB项中的房产属于不动产；\nC项中的企业不满足“债务人的动产”，C项是直接接管，不满足“以该财产的折价或者以拍卖、\n变卖该财产的价款优先受偿”；\nD项中，古董商向另一同行借款产生债务关系，债权人根据合同规定取走债务人店里的一批\n古董作为抵押，其中被取走的古董属于动产，以古董作抵押满足“以该财产的折价优先受偿”，\n是答案。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0043","type":"single","t":"群体规范包括正式规范和非正式规范，前者是指由组织明文规定的员工应遵循的规则和程序；后者是指人们在工作与生活过程中约定俗成的行为准则，该规范的形成受到历史的、习惯的、群体目的性的和社会因素的影响，同时也在很大程度上受到模仿、暗示、顺从等心理因素的制约，在群体成员彼此相互作用的条件下，发生的一种内化的过程。根据上述定义，下列不属于非正式群体规范的是：","o":[["A","公司要求每位员工在刚入职时签署保密责任书"],["B","由于受到描写黑帮的电影影响，一些青少年往往容易进行简单的模仿，形成各种“帮”、“会”等组织"],["C","春节是一家人团聚的时刻，北方人常常要在除夕夜包饺子，而南方人则是煮汤圆"],["D","在举手表决时，尽管有些人不赞成提案，但碍于情面，也会举手赞成"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n关键词强调“约定俗成的行为准则”“受到历史的、习惯的、群体目的性的和社会因素的影\n响”“受到模仿、暗示、顺从等心理因素的制约”“在群体成员彼此相互作用的条件”\n第二步：逐一判断选项。\nA项：公司明文规定的，属于正式规范，不属于非正式群体规范，当选；\nB项：青少年对黑帮电影进行简单模仿符合“受到模仿的制约”的非正式规范，排除；\nC项：春节南北习俗不同符合“受到历史的、习惯的影响”的非正式规范，排除；\nD项：碍于情面符合“在群体成员彼此相互作用的条件”的非正式规范，排除；\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0044","type":"single","t":"专利间接侵权是指，行为人的行为本身并不直接侵犯他人的专利，但却教唆、帮助或诱导他人实施专利侵权行为。根据上述定义，下列哪项属于专利间接侵权？","o":[["A","王某通过个人关系购买了甲公司发动机设备，该设备已申请国家专利，之后经甲公司许可转售给乙公司"],["B","李某购买了一批已申请专利的用于浇筑系统的模具，在购买前他和生产该模具的公司签订了相关合同"],["C","宋某将某外文小说译成中文后，以第一作者身份出版该小说，从中获利一百万元"],["D","甲公司遇到技术问题后委托乙公司解决，并暗示乙公司技术人员采用了丙公司的专利技术，但未告知丙公司"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词强调“行为人的行为本身并不实施专利侵权”“教唆、帮助或诱导他人实施专利侵权”。\n第二步：逐一判断选项。\nA项:王某购买设备不涉及侵犯专利权， 也没有教唆、帮助或诱导他人实施专利侵权行为，\n不符合定义，排除；\nB项:李某购买模具前他和生产该模具的公司签订了相关合同，没有侵权行为，也没有教唆、\n帮助或诱导他人实施专利侵权行为，不符合定义，排除；\nC项:宋某本人直接侵犯了专利权，不属于间接侵权，是直接侵权，不符合定义，排除；\nD项:甲公司没有直接侵权，教唆乙公司技术人员侵害丙公司的专利权，符合定义关键词，\n是间接侵权；\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0045","type":"single","t":"形而上学是指同辩证法相对立的世界观或方法论。指用孤立、静止、片面的观点看世界，认为一切事物都是孤立的，永远不变的；如果说有变化，只是数量的增减或场所的变更，这种增减或变更的原因不在事物内部而在于事物外部。以下属于形而上学的是：","o":[["A","黑格尔：手离开了身体就失去了其作为手的意义"],["B","庄子：一尺之棰，日取其半，万世不竭"],["C","赫拉克利特：没有人能两次踏进同一条河流"],["D","培根：科学在人心目中的价值必须由它的实践作决定"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n形而上学强调为“孤立、静止、片面”、“一切事物都是孤立的，永远不变的”；而辩证法强调\n“联系、发展、全面”。\n第二步：逐一判断选项。\nA项说明了手和身体其他部分相互依存，不可分割的关系，体现了辩证法中的“联系”；\nB项庄子认为棰万世不竭，符合“静止”，与变化发展相对，“日取其半，万世不竭”符合形而\n上学的定义；\nC项“没有人能两次踏进同一条河流”说明了河水是在不断流动的，体现了辩证法中的“发展”；\nD项强调了实践的作用，而实践本身体现了“联系、发展、全面”。\n因此A、C、D均不属于形而上学。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0046","type":"single","t":"O2O的营销方式：即OnlineToOffline，指以互联网为前台，用线上营销带动线下消费的商业营销模式。通常包括商家网上提供商品信息、折扣信息、服务预订、消费者在线预付、线下消费等环节完成商品交易。下列不属于O2O营销方式的是：","o":[["A","某公司推出线上、线下同价促销活动，旗下的网上商城和实体店所有商品价格相同，一时间网上商城订单量剧增，到实体店提货的人也摩肩接踵"],["B","小兰在时装杂志上看到了一款心仪的长裙，通过某比价网站发现单位附近一家商场同款长裙正在打折促销，于是趁中午休息时间买了回来"],["C","女朋友生日临近，小袁从网上团购了某酒店的自助餐消费券，邀请多名好友为女朋友开了一个难忘的生日派对"],["D","某家电厂商利用微信平台向订阅用户定期推送新品上市、促销信息，用户用手机扫描推送消息中商品下方的二维码即可完成支付，等待附近门店的配送"]],"a":["B"],"an":"第一步：查找关键词。定义的关键词信息为“消费者在线预付、线下消费”。\n第二步：逐一判断选项。\nA选项，虽然说到了线上和线下，但是商品相同，价格相同，同时都促进了消费，并没有明\n确的指出是否是线上带动了线下的消费；\nB选项，比价网站发布的折扣信息并不是这个商场这个商家做出的行为，因此主体不符，不\n符合题干的定义；\nC、D两项都涉及到了在线上支付线下消费的定义。\n在A项和B项之间对比可知，B项完全不符合，A项是不明确。\n本题为选非题，故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0047","type":"single","t":"某省发布地质灾害防治方案，方案指出，全省各地区、各有关部门要结合实际情况，因地制宜，突出重点，迅速组织开展地质灾害隐患巡查排查工作，特别要逐一排查城镇乡村等人口密集区和江河流域、交通干线、重要设施等重点区域的地质灾害隐患，不留死角。下列各项做法中属于贯彻执行该方案中这一要求的是：","o":[["A","甲县气象局预测，该年度极端天气较历年偏多，局部暴雨、冰雹等强对流天气将频繁发生，容易造成崩塌、滑坡、泥石流、地面塌陷、地裂缝等地质灾害"],["B","乙县充分发挥基层党组织和干部群众的作用，建立汛期值班等制度，并把防灾避险、监测预警的任务具体落实到城镇、乡村、学校、医院、企业等单位及相关责任人员"],["C","丙县要求全县各乡、村自查自纠，发现该县某处煤矿采空区地面塌陷，危及尚未拆迁的居民房屋和公共设施以及铁路运行安全"],["D","丁县建有大型水库，因而该县水利部门认真做好水库周边和河道两侧的地质灾害防治工作，严防地质灾害危及水库和河道安全及引发次生灾害"]],"a":["C"],"an":"第一步：抓住题干中的关键句。\n本题关键句为迅速组织开展地质灾害隐患巡查排查工作。\n第二步：逐一分析并判断选项的正确。\n本题重点是巡查排查地质灾害隐患。\nA中是预测不是巡查排查，因此A错；\nB中是预防洪涝灾害不是地质灾害，因此B错；\nC中正是巡查排查地质灾害隐患，因此C正确；\nD中是做好地质灾害防治工作而不是排查隐患，是强干扰项，因此D错。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0048","type":"single","t":"行政征用是行政机关为了公共利益和公共目的，依法强制获得公民、法人财产的使用权或所有权，并给予其合理补偿的一种行政法律制度。根据上述定义，下列不属于行政征用的是：","o":[["A","两年前镇建的一个经济开发园区占用了杨军家的承包地，杨军经多次努力，终于拿到了合理的补偿"],["B","某公安机关在破案时，由于情况紧急，使用了王某的摩托车，后来支付给王某一些费用"],["C","一项国家重点工程项目需占用某市农民的土地，当地政府给予被征用土地的农民各种补偿费用与安置费，并对多余的劳动力进行了安置"],["D","某地发生洪灾，为了抗洪，政府从几个建筑公司调集了沙子，给予他们一定的补偿"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n关键词强调“为了公共利益和公共目的”、“给予合理补偿”。\n第二步：逐一判断选项。\nB、C、D项均是“为了公共利益和公共目的”，并“给予合理补偿”，均符合关键词；\nA项中建经济开发园区不是“为了公共利益和公共目的”，并且刚开始没有“给予合理补偿”，\n是通过多次努力才拿到的补偿，不是行政征用。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0049","type":"single","t":"差别化信贷是指对不同地区、不同行业、不同群体、不同用途的信贷额度和还贷方式采取差别对待的政策。这是国家对经济进行宏观调控的重要手段，通过差别化信贷遏制两极分化趋势、促进社会公平、促进经济结构调整和全面可持续发展。根据上述定义，下列选项中属于差别化信贷的是：","o":[["A","2008年年初，央行放宽商业银行信贷规模，全国性商业银行在原有信贷规模基础上调增5%，地方性商业银行在原有信贷规模基础上调增10%，共新增约2000亿元贷款"],["B","某商业银行规定：贷款不满一年提前还款，收取不低于实际还款额三个月的利息；贷款满一年后提前还款，则收取不低于实际还款额一个月的利息"],["C","新购房政策规定：购买首套住房，且套型建筑面积在90平米以下的家庭，可以享受首付款20%的政策；如果首套住房套型面积大于90平米，贷款首付款比例不得低于30%"],["D","2009年，某国际银行对中小企业的贷款总额较去年增长14%，同时又推出“幸福时贷”无担保个人贷款，18-55岁的本地居民可获得最高50万元的贷款"]],"a":["C"],"an":"第一步：抓住定义中的关键词。定义的关键词有“不同地区、不同行业、不同群体、\n不同用途的信贷额度和还贷方式”“差别对待”“宏观调控的重要手段”。第二步：逐一判断选项。\nA项“央行放宽商业银行信贷规模”不符合定义关键词“不同行业、不同用途的信贷额度和还贷\n方式”，故不符合定义，排除；B项商业银行的个别规定和D项国际银行的贷款规定不是“宏\n观调控的重要手段”，均不符合定义，可排除；C项“新购房政策规定”，是通过对不同群体的\n首套房实行差别化信贷来进行宏观经济调控，符合“不同群体”“差别对待”“宏观调控的重要手\n段”。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0050","type":"single","t":"犯罪的间接故意是指行为人明知自己的行为可能发生危害社会的结果，并且放任这种结果发生的心理态度。下列属于犯罪的间接故意的是：","o":[["A","甲欲毒杀同事乙，于是在大家共同喝水的饮水机中投毒，乙当天并未从饮水机中取水，但却导致其他三位同事中毒"],["B","甲欲枪杀乙，在乙家门口伏击，只击中了乙的胳膊"],["C","出租车司机甲与朋友吃饭时多喝了几杯，但是凭借自己多年的驾驶经验，甲认为不会有什么问题，于是不顾朋友劝阻执意出车，结果撞死了行人乙"],["D","某医院护士甲将病人乙和丙的药物弄混，到了给乙用药的时间，甲没有仔细核对就拿起应该给丙服用的药物给乙服用，结果因药性不对导致乙死亡"]],"a":["A"],"an":"第一步：抓住定义中关键词。\n定义中强调“明知自己的行为可能发生”、“放任这种结果发生”。\n第二步：逐一判断选项。\nA项中甲明知投毒会对他人也造成危害，仍然放任自己的行为是犯罪的间接故意；\nB项只是针对被害人的行为，属于直接故意；\nC项中伺机认为自己不会对他人造成危害以及D项中护士的行为，都属于过失而非间接故\n意。\n故正确答案为A。\n 第03关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0051","type":"single","t":"刻板印象：指社会上对于某一类事物产生一种比较固定的看法，也是一种概括而笼统的看法。以下选项中不存在刻板印象的是：","o":[["A","老板第一眼看到小李就非常喜欢他，在工作中予以重用"],["B","张三不想与日本人合作，因为日本人尚武、有野心"],["C","王五从不买温州产品，觉得那里生产的商品质量不好"],["D","在人们的心目中，母亲是一个伟大的形象，她们慈爱、温柔、贤慧、为家庭尽心尽力"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n关键词强调是对于“某一类”且“比较固定”。\n第二步：逐一判断选项。\nA项中老板对小李的印象属于个人对个人的看法，而不是对某一类事物的固定看法，因此不\n属于刻板印象。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0052","type":"single","t":"直觉思维是指行为步骤和思维过程不明确、不清晰，对某些现象或者问题直接地迅速地作出某些猜想、假设或判断的思维。下面哪一个是典型的直觉思维？（）","o":[["A","公安刑警根据收集到的证据，对案件进行分析。"],["B","军事指挥员根据侦察兵的情报材料作出军事决策。"],["C","根据所学过的知识解答考试时的难题。"],["D","医生根据病人的口述材料，迅速的做出疾病的诊断。"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“行为步骤和思维过程不明确、不清晰”，“直接”。\n第二步：逐一判断选项。\nA、B和C中均是根据已经收集到的资料或者已经学过的知识进行分析的过程，思路是清晰、\n明确、有条理的，都不符合关键词，因此均不是典型的直觉思维；\nD中医生只是根据病人的口述，并没有经过一系列的检查便迅速做出了判断，符合关键词，\n因此属于直觉思维。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0053","type":"single","t":"公共政策：指以政府为主的公共机构，为确保社会朝着政治系统所确定、承诺的正确方向发展，通过广泛参与的和连续的抉择以及具体实施产生效果的途径，利用公共资源达到解决社会公共问题，平衡、协调社会公众利益目的的公共管理活动过程。下列不符合这一定义的是：","o":[["A","公共政策制定的主体是政府为主的一系列公共机构"],["B","公共政策的目的在于确保社会朝着政治系统所确定、承诺的正确方向发展"],["C","公共政策是一种公共管理活动过程"],["D","公共政策就是政府要少花钱多办事的各种方法与途径"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n公共政策制定的主体是“以政府为主的公共机构”，目的在于“确保社会朝着政治系所确定、\n承诺的正确方向发展”，且是“公共管理活动过程”。\n第二步：逐一判断选项。\nA项符合“以政府为主的公共机构”；\nB项符合“确保社会朝着政治系所确定、承诺的正确方向发展”；\nC项符合“公共管理活动过程”；\n而D项“少花钱多办事的各种方法与途径”在定义中没有涉及，不符合公共政策定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0054","type":"single","t":"系谱是指根据各类生物间的进化历程和亲缘关系的远近而编制的生物变化系统。根据上述定义，下列属于系谱的是：","o":[["A","有一种观点认为，人类起源于非洲，并逐步迁徙到世界各地"],["B","李氏家族的家谱中详细记录了家族五百年来的发展和变迁"],["C","在自然界中，人类与各种动物相互依存，一旦失去平衡，灾难就会接踵而至"],["D","鱼类进化到两栖类，从中分化出哺乳类和鸟类，哺乳类中的一支发展成为高等智慧动物"]],"a":["D"],"an":"第一步：关键词查找。本题关键词为：（1）生物间的进化历程；（2）亲缘关系；\n（3）生物变化系统。第二步：逐一分析选项。A项的观点并没有体现出生物间的进化过程，\n迁徙不能算是一种生物间进化过程，排除；B项中的族谱只是记录一个家族的人和事，也没\n有体现出生物间的进化过程，因此，不符合定义；C项，说的是人和动物间的依存关系，非\n亲缘关系，不符合定义；D项，从鱼演化到两栖动物，然后分化成哺乳动物和鸟类，哺乳类\n的一支发展为高等智慧动物，符合定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0055","type":"single","t":"虐待罪指对共同生活的家庭成员，经常以打骂、冻饿、禁闭、强迫过度劳动，有病不给治疗或者其他方法进行摧残、折磨的行为。根据定义，下列不构成虐待罪的是：","o":[["A","王浩的父亲经常生病，王浩觉得其父已是知天命之年，所以也就不给其医治"],["B","某企业老板经常强迫员工过度劳动，克扣员工工资"],["C","张志看妻子不顺眼，经常对其进行毒打或关禁闭"],["D","李某常使用体罚来教育调皮的儿子，有时还不让做错事的孩子吃饭"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词强调“家庭成员”且“摧残、折磨的行为”。\n第二步：逐一判断选项。\nA中的有病不给治疗、C中的毒打或关禁闭、D中的不让吃饭都是对家庭成员进行摧残折磨，\n均符合定义；\nB中的员工不属于家庭成员，不符合定义关键词。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0056","type":"single","t":"危机管理策划是指为防止爆发危机或者危机发生后为减少、消除危机带来的风险与损失，通过策划手段使人更有效地掌握事物和社会舆论的一些办法与措施的综合过程。根据上述定义，下列不属于危机管理策划的一项是：","o":[["A","听到海啸警报后，海边的游客飞快地向高处撤离"],["B","李平参加考试后，特意带了两支铅笔以备万一"],["C","面对突如其来的地震，小张被震倒在地，所幸躲过一劫"],["D","某企业因负债累累，无力清偿到期债务向法院提出破产申请"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词强调“策划手段”。\n第二步：逐一判断选项。\nA项中“游客向高处撤离”，B项中“特意带了两支铅笔”，D项中“申请破产”均是策划手段，符\n合定义；\nC项中小张被震倒，属于自然力的作用，不是策划手段。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0057","type":"single","t":"转继承是指继承人在继承开始后遗产分割前死亡的，其继承的遗产转由其法定继承人（包括配偶、子女、父母、兄弟姐妹、祖父母和外祖父母）继承的制度。下列属于转继承的是：","o":[["A","老王与其妻子生有两个儿子，二儿子早年去世，留有一女，未满十八岁。老王去世后，在未立有遗嘱的情况下，该女孩要求继承老王的部分遗产"],["B","老李有价值50万元的房产一处。老李去世的当天，儿子小李在赶往医院办理后事的途中不幸遭遇车祸死亡，小李的儿子当即表示要继承老李的房产"],["C","孤寡老人老刘一直由邻居老张照顾，老刘在生前立下遗嘱，将其全部财产留给老张。老刘去世后不久，老张心脏病发去世，老张的妻子要求继承老张应继承的部分份额"],["D","老黄生前一直由其外甥小赵照顾，老黄立下遗嘱，将全部财产留给小赵。老黄去世后，老黄的子女向法院提起争夺遗产的诉讼，法院作出判决前，小赵不幸去世，老黄的子女继承了这笔遗产"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n定义强调“继承人在继承开始后遗产分割前死亡”、“其有权继承的遗产转由其法定继承人继\n承”。\n第二步：逐一判断选项。\nA项中“二儿子早年去世”并非在继承开始后死亡，不符合定义“继承人在继承开始后遗产分割\n前死亡”；\nC项“老刘去世后不久，老张心脏病发去世”说明老张的死亡并不是发生在继承开始后遗产分\n割前，不符合定义要求；\nD项中“小赵不幸去世”是法院作出判决前死亡的，且不是老黄法定继承人，不符合定义“其\n有权继承的遗产转由其法定继承人继承”。只有B选项完全符合定义，小李符合“在继承开始\n后遗产分割前死亡”，“小李的儿子”是小李的法定继承人。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0058","type":"single","t":"想象是指在原有经验的基础上创造新形象的思维活动。按照想象是否受意志控制，可分为随意想象和不随意想象。不随意想象的特点是把各种印象和信息离奇、突然、有时是无意义地组合在一起。随意想象是把各种印象和信息自觉控制、有目的、经过意志的努力呈现出需要的场景。根据上述定义，下列选项属于随意想象的是：","o":[["A","小李昨天晚上睡觉时，梦到了儿时一起嬉戏的伙伴"],["B","张三接到录取通知，想到自己实现了目标，很兴奋"],["C","小王面对设计图，憧憬着公司新大楼竣工后的样子"],["D","小陈的父亲看着照片回忆起当年上山下乡时的场景"]],"a":["C"],"an":"第一步：判断考查定义。题目考查“随意想象”，所以仅需在题干中阅读“随意想象”。\n第二步：抓住定义中的关键词。关键词包括“自觉控制”、“有目的”和“经过意志的努力呈现需\n要的场景”。第三步：逐一判断选项。A项中睡觉做梦不属于自觉控制；B项并没有呈现需\n要的场景，只是情感活动；C属于自觉控制、有目的，而且是经过意志的努力呈现出竣工的\n场景，符合定义；D项“回忆当年上山下乡时的情景”没有创造新形象的过程，因此不符合定\n义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0059","type":"single","t":"潜伏需求是指相当一部分消费者对某种商品或服务有强烈的需求，而现有产品或服务又无法使之满足的一种需求状况。根据上述定义，以下最能体现“潜伏需求”的是：","o":[["A","某市所售楼盘多为三居室大户型，让想在这里安家的工薪阶层望而却步"],["B","某药厂推出的中药降糖保健品在部分程度上可以取代药品，常供不应求"],["C","目前市场上的防辐射孕妇装抵御电子产品辐射的有效率是多少尚不明确"],["D","新型的电动游戏机带有护眼功能，想必可以说服一些学生家长前来购买"]],"a":["A"],"an":"第一步：抓住定义中的关键词，“现有产品或服务又无法使之满足的一种需求状况”。\n第二步：逐一判断选项。\nA项，工薪阶层想在某市安家而所售楼盘多为三居室大户型使工薪阶层望而却步体现了题干\n中的“现有产品或服务又无法使之满足的一种需求状况”；\nB项，从选项可知中药降糖保健品只是市场上某些药品的取代品，即使供不应求也不符合题\n干中的“现有产品或服务又无法使之满足的一种需求状况”这一定义要求；\nC项，防辐射孕妇装是否有效率尚不明确，不能体现需求状况，故此选项与题干无关；\nD项，新型的电动游戏机带有护眼功能体现一种需求状况，但无法说明“现有产品或服务又\n无法使之满足的一种需求状况”。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0060","type":"single","t":"权利暗示：指基于职务地位、业务能力、人格魅力而产生的对组织机构外部成员的影响力。下列不属于权利暗示的是:","o":[["A","张教授是微电子领域的专家，不少企业遇到相关问题，都会向他请教解决的方法"],["B","五年级的小聪，电子游戏玩得特别顺溜，学校组队参加各级比赛时总请他协助指导"],["C","退伍军人老赵处事公平，街坊邻居遇到大小纠纷，首先想到的就是请他来主持公道"],["D","教育局李主任长期研究教师的专业发展，亲友们却常常向他求教孩子的教育问题"]],"a":["B"],"an":"第一步：找到定义关键词\n“基于职务地位、业务能力和人格魅力产生的对组织机构外部成员的影响力”\n第二步：逐一分析选项\nA项：张教授是微电子领域的专家，不少企业遇到相关问题都会向他请教解决的办法，体现\n了张教授基于业务能力产生的对组织机构外部成员的影响，符合定义，排除；\nB项：小聪电子游戏玩得顺溜，学校组队参加比赛时总请他协助指导，电子游戏玩得顺溜没\n有体现职务地位、业务能力和人格魅力的影响，同时小聪作为学校的学生，学校组队参加比\n赛协助指导不能体现出对组织机构外部成员的影响，不符合定义，当选；\nC项：退伍军人老赵处事公平，街坊邻居遇到大小纠纷请他来主持公道，体现了由于人格魅\n力而产生的对街坊邻居的影响，同时街坊邻居相对于与军人来说属于组织外部成员，符合定\n义，排除；\nD项：李主任长期研究教师的专业发展，亲友们常常向他请教孩子的教育问题，体现了由于\n职务地位而产生的对不属于教育体系组织外部成员亲友的影响，符合定义，排除；\n本题为选非题，故正确答案为B。\n 第04关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0061","type":"single","t":"集合概念是以事物的集合体为反映对象的概念。集合体是由许多个体组成的统一整体，集合体所具有的属性，只为该集合体所具有，而不必为这个集合体中的某一个体所具有。集合概念所涉及的关系不同于类和分子的关系，也不完全同于整体和部分的关系。组成类的各个分子都必然具有类的属性，而组成集合体的个体却不具有集合体的属性；整体是由不同的部分组成的，而集合体则是由同类的个体组成的。根据上述定义，下列划线词在当前语境下所反映的概念不是集合概念的是：","o":[["A","人定胜天"],["B","主权在民"],["C","羊入虎口"],["D","正义之师"]],"a":["C"],"an":"A项的“人”是划线部分；B项的“民”是划线部分；C项的“羊”是划线部分；D项的“师”\n是划线部分。第一步：找到定义关键词。集合概念的定义条件包括：“只为该集合体所具有，\n而不必为这个集合体中的某一个体所具有”。第二步：逐一分析选项。A项的“人”、B项的“民”、\nD项的“师”作为一个整体的概念时具有选项中描述的属性，但是“某一个人”，“某一个民”，“某\n一个师”并不是必然具有选项中描述的属性，因此都属于集合概念；C项的“羊”这个概念是由\n无数个羊组成的，而每个“羊”都具有被老虎吃掉这个特征。\n本题为选非题，故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0062","type":"single","t":"所谓诬告陷害罪是指捏造事实诬告陷害他人，意图使他人受刑事追究，情节严重的行为。根据上述定义，下列行为构成诬告陷害罪的是：","o":[["A","乙捏造“文某强奸幼女”的事实，并向司法部门举报"],["B","甲与丁某长期不和，便捏造丁某包养情人并匿名举报，使丁某与妻子离婚"],["C","丙捏造同事万某受贿10万元的事实，并印刷大量传单在县城的大街小巷张贴"],["D","丁匿名举报李某抢劫他人50万元。事后查明，李某只抢劫了5000元"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n定义中强调“捏造事实”，“使他人受刑事追究”等。\n第二步：逐一判断选项。\nA项中乙捏造事实，并可以使他人受到刑事追究，符合定义；\nB、C项中没有体现使他人受刑事追究；\nD项中没有体现是丁捏造事实诬告陷害他人，均不符合定义。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0063","type":"single","t":"定义：①自我意识：指一个人对自己的认识和评价，包括对自己心理倾向、个性心理特征和心理过程的认识与评价。②原意识：指由动物（特指猿群）进化而来的适合人类个体生存的基本感知。③显层意识：指个体在人类群体（社会）中受到教育的感知结果。典型例证：（1）尊老爱幼是中华民族的传统美德之一。（2）智能机器人能够具有基本的光感、热感和电磁感。（3）学生认为自己很优秀。上述典型例证与定义存在对应关系的数目有：","o":[["A","0个"],["B","1个"],["C","2个"],["D","3个"]],"a":["C"],"an":"第一步：抓住每个定义中的关键词。\n自我意识：关键词是“一个人对自己”的“认识和评价”；\n原意识：关键词是“由动物（特指猿群）进化而来”的“适合人类个体”；\n显层意识：关键词是“个体在人类群体（社会）”“受到教育”。\n第二步：逐一判断选项。\n例证（1）对应“显层意识”的定义，作为中华民族的子孙，我们从小就受到教育，要做到“尊\n老爱幼”；\n例证（2）的主体是“智能机器人”，不满足题干任一定义；\n例证（3）是学生对自己的认识和评价，对应“自我意识”的定义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0064","type":"single","t":"体育旅游是指个人暂时离开常住地或工作地，参加体育活动、观看体育活动，或者观赏与体育活动有关的吸引物，以休闲为基础的旅游活动。以下不属于体育旅游的是：","o":[["A","球迷小李赶到大连市观看中超联赛"],["B","自行车俱乐部的成员小张骑车到上海后，找了一份在快递公司的工作"],["C","2008年北京奥运会结束后，很多外地游客到北京参观鸟巢和水立方"],["D","广州某集团公司的小李是游泳健将，他被单位推选到青岛市参加游泳比赛"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n该定义项中的关键词为“暂时离开常住地或工作地”、“参加体育活动、观看体育活动，或者\n观赏与体育活动有关的吸引物”。\n第二步：逐一判断选项。\nA项，“赶到大连”说明是“暂时离开常住地”，“观看中超联赛”是“观看体育活动”，符合定义；\nB项，小张骑车到上海找了一份工作，说明不只是暂时离开常住地或工作地，而且“找工作”\n与“体育活动”无关，不符合定义；\nC项，鸟巢是国家体育场，水立方是国家游泳中心，外地游客参观鸟巢和水立方属于“观赏\n与体育活动有关的吸引物”，符合定义；\nD项，小李属于广州某集团公司的，被派到青岛市参加游泳比赛，属于“暂时离开工作地，\n参加体育活动”，符合定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0065","type":"single","t":"负迁移，是指一种知识技能的掌握干扰或抑制了另一种知识技能的掌握。也就是已掌握的知识经验使新的学习发生了困难。凡新旧刺激物十分相似而又要求学习者做出不同的反应时，就可能发生负迁移现象。根据上述定义，下列属于负迁移的是：","o":[["A","已经懂得英语的人，就会很容易地掌握法语"],["B","爱好打篮球的小王，耽误了学习文化课的时间"],["C","不会骑自行车的人，学习骑摩托车就会很费力"],["D","学会汉语拼音，就会对学习英文音标产生干扰"]],"a":["D"],"an":"第一步，查找关键词。\n定义关键词：“一种知识技能的掌握干扰或抑制了另一种知识技能的掌握”“已掌握的知识经\n验使新的学习发生了困难”。\n第二步，逐一分析选项。\nA项：由“很容易”可以得出，并未干扰或抑制新技能的掌握，与定义要件不符，排除。\nB项：“耽误了学习文化课的时间”，是指时间上的耽误，并非干扰或抑制文化课的学习时间，\n与定义要件不符，排除。\nC项：“不会骑自行车”与“已掌握的知识经验”不符，不满足定义要求，排除。\nD项：汉语拼音对学习英文音标产生干扰，指出已经掌握的语言技能会对新学习的语言技能\n产生干扰，与定义要件相符，当选。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0066","type":"single","t":"外部不经济，是指一种经济行为对其本身和外部产生出来的负效益。下列选项中，属于外部不经济现象的是：","o":[["A","学校周边钢厂的烟囱冒出黑色灰尘"],["B","国家出资提高公众健康水平"],["C","湘江岸边的造纸厂流出经处理合格的水"],["D","吃完东西后将包装用的塑料袋扔到分类的垃圾箱"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n定义中强调“经济行为”、“对其本身和外部”、“负效益”。\n第二步：逐一判断选项。\nB、C、D中行为产生的均为正效益，与定义相悖。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0067","type":"single","t":"职务侵占罪是指公司、企业或者其他单位的人员，利用职务上的便利，将本单位财物非法占为已有，数额较大的行为。下列行为属于职务侵占罪的是（ ）。","o":[["A","张某是名乘警，他将乘客遗失在列车上价值5000元的物品占为已有"],["B","刘某是某工地的材料工人，负责工地物品的调拨，几次私自将公司的建筑材料卖给别人，共卖了2万元"],["C","刘某是单位的保管员，一天他趁其他同事不注意的时候，将一个200元的收音机拿回家给儿子用"],["D","赵某是一跨国公司的会计师，私自作假账，使公司偷税高达200万余元"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“本单位财物”，“非法占为已有”，“数额较大”。\n第二步：逐一判断选项。\nA中不符合关键词“本单位财物”，因此不属于职务侵占罪；\nB项符合关键词，因此属于职务侵占罪；\nC中200元数额过小，不符合关键词“数额较大”，因此不属于职务侵占罪；\nD中不符合关键词“非法占为已有”。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0068","type":"single","t":"非物质文化遗产是指各种以非物质形态存在的与群众生活密切相关、世代相承的传统文化表现形式。下列不属于非物质文化遗产的是：","o":[["A","传统节庆礼仪"],["B","传统民俗活动"],["C","传统表演艺术"],["D","传统手工艺品"]],"a":["D"],"an":"非物质文化遗产包括口头传统、传统表演艺术、民俗活动和礼仪与节庆、有关自然\n界和宇宙的民间传统知识和实践、传统手工艺技能等以及与上述传统文化表现形式相关的文\n化空间。\nA、B、C都属于非物质文化遗产；\nD有具体的表现形式，属于物质文化遗产。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0069","type":"single","t":"直观教学是指利用教具作为感官传递物，向学生展示相关内容，以达到提高学习效率或效果的一种教学方式。直观教学包括实物直观、模象直观和言语直观。实物直观通过直接感知实际事物而进行；模象直观通过对实物的模拟性形象来直接感知；言语直观是在形象化的语言作用下，通过学生对语言的物质形式（语音、字形）的感知及对语义的理解而进行的一种直观形式。根据上述定义,下列不属于上述三种直观教学的是：","o":[["A","请学生在课后阅读整篇小说内容并撰写读后感"],["B","暑期带着学生去工厂和农村进行实地参观访问"],["C","请学生分角色朗读戏剧作品，或通过上台表演来体会人物性格"],["D","在艺术鉴赏课上，使用幻灯片给学生展示西方油画的经典之作"]],"a":["A"],"an":"第一步：找到定义关键词。\n实物直观：“直接感知实际事物”\n模象直观：“对实物的模拟性形象来直接感知”\n言语直观：“通过形象化的语言，学生对语言的物质形式（语音、字形）感知和语义的理解”\n第二步：逐一分析选项。\nA项：课后阅读整篇小说并撰写读后感并未涉及到上述三者，阅读小说写读后感不属于直接\n感知实际事物，且不属于模拟性形象和学生接收言语直观的理解，不符合定义，当选。\nB项：去工厂和农村实地参观访问属于直接感知实际事物，属于实物直观，符合定义，排除。\nC项：分角色朗读戏剧作品属于对语言物质形式的感知，通过上台表演属于对实物的模拟性\n形象来直接感知，属于模象直观，符合定义，排除。\nD项：用幻灯片展示西方油画，属于通过对油画的幻灯片形式而不是直接感知油画本身，即\n对实物的模拟性形象来直接感知，属于模象直观，符合定义，排除。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0070","type":"single","t":"负性制裁是指社会以消极性手段对违反社会规范的社会成员所进行的惩治方式。其特点是强迫性，迫使社会成员认识到不遵守社会规范所承担的不良后果。根据上述定义，下列不属于负性制裁的是：","o":[["A","甲因入室行凶抢劫，被判处死刑"],["B","乙因不孝顺父母，受到邻里谴责"],["C","丙因不当行为，被单位警告处分"],["D","丁因严重违反校纪，被开除学籍"]],"a":["B"],"an":"第一步：抓住定义中的关键词。关键词包括“惩治方式”，“强迫性”。第二步：逐一\n判断选项。A项中的“死刑”、C项中的“警告处分”、D项中的“开除学籍”都是具有“强迫性”\n的惩治方式，因此均属于负性制裁；而B项中的“邻里谴责”不是惩治方式，也不具有强迫性。\n故正确答案为B。\n 第05关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0071","type":"single","t":"挤出效应是指在一个相对平面的市场上，由于供应、需求有新的增加，导致部分资金从原来的预支中挤出，而流入到新的商品中。下列不属于挤出效应的是（ ）。","o":[["A","张某换了新工作，上班地点离家太远，于是他从准备的购房款中抽出部分先买了车"],["B","路某父母从外地搬来和他一起居住，住房太拥挤，他把原来准备买车的钱拿出了一些租了一套更大的房子"],["C","金某弟弟意外受伤，需要大笔医药费，他把自己准备度蜜月的旅游费拿出一半付了弟弟的医药费"],["D","林某预计用10万元装修新房，结果少花了一万元，于是他买了一台手提电脑"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“供应、需求有新的增加”，“部分资金从原来的预支中挤出”，“流入到新的商品”。\n第二步：逐一判断选项。\nA、B和C中行为均符合关键词，因此都属于挤出效应；\nD中预计花10万，结果少花了一万，而买了手提。不是有了新的需求，而是节省了开支，\n不符合关键词“供应、需求有新的增加”，因此不属于挤出效应。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0072","type":"single","t":"社会壁垒是指在国际贸易中一国以其他国家劳动者的劳动环境和生存权利为借口而采取的贸易保护措施。根据上述定义，下列属于社会壁垒的是：","o":[["A","甲国认为乙国制衣业雇佣童工现象严重，因而取消了该国的贸易订单"],["B","甲国在从乙国进口的奶粉中发现某种重金属含量超标，即终止了该项贸易"],["C","甲国受经济危机影响，国内工人大批失业，为给工人创造就业机会，甲国政府终止了与多国的进口贸易"],["D","甲国认为乙国汽车制造业的从业人员素质较低，会对汽车的安全性产生影响，因而取消了从乙国进口汽车的订单"]],"a":["A"],"an":"定义关键词。（1）方式：以其他国家劳动者的劳动环境和生存权利为借口；（2）\n结果：贸易保护。A项雇用童工现象严重符合以劳动者的生存权利为借口，取消贸易订单符\n合贸易保护行为；B项中奶粉重金属超标不符合关键词（1），排除；C项国内工人创造就\n业机会不符合关键词（1）中的以其他国家的劳动者为借口，排除；D项担心的是由于从业\n人员素质低最终会导致汽车安全性受影响，不符合关键词（1）中的劳动环境和生存权利，\n不如A项直接明确，排除。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0073","type":"single","t":"产业结构政策是指一定时期内政府为促进本国产业结构的调整，优化和升级所制定的政策。根据以上定义，下列哪种政策不属于产业结构政策：","o":[["A","对第三产业采取保护与扶持"],["B","对涉农产品及产品加工，推行公司加农户的形式"],["C","对“五小”工业采取“关、停、并、转”"],["D","对某些工业产品实行“3C”认证"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词强调“一定时期内”、“政府”、“为促进本国产业结构的调整，优化和升级”。\n第二步：逐一判断选项。\nA中对第三产业采取保护与扶持、B中对涉农产品及产品加工、C中对“五小”工业采取“关、\n停、并、转”，均是对本国的产业结构进调整、优化和升级，符合定义；\nD中对某些工业产品实行“3C”认证，不是对产业机构进行调整、优化和升级，不符合定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0074","type":"single","t":"基尼系数，是衡量分配不平等程度的重要指标。国际上通常认为，当基尼系数低于0.2表示收入绝对平均；0.3~0.4表示相对合理；0.4~0.5表示收入差距较大；0.6以上表示收入差距悬殊。下列选项中，有关基尼系数说法不正确的是：","o":[["A","基尼系数是测量收入平等的指标"],["B","基尼系数可在0和1之间取任何值，收入分配越是趋向平等，基尼系数也越小"],["C","我国城市基尼系数从1978年的0.15上升到2000年的0.32，这说明至2000年城市居民个人收入差距逐步拉大"],["D","我国农村地区基尼系数在90年代为0.338左右，处于国际水平的相对合理区域"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n定义中强调“衡量分配不平等程度”。\n第二步：逐一判断选项。\nA中测量“收入平等”与定义中的衡量“分配不平等程度”不一致；\n由定义中可推出B、C、D均正确。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0075","type":"single","t":"股份有限公司是指由一定人数以上的股东组成，其全部资本分为等额股份，股东只就其所认股份即出资额对公司承担有限责任，公司只以其全部资产对公司债务承担责任的公司。下列情况属于股份有限公司的是：","o":[["A","甲公司和乙公司门前一片草地无人看管护理，便协商由两公司各负责一年"],["B","甲公司进行改组，将全部资本分为五万股，由职工认购，并改名为“××有限责任公司”"],["C","由原电子部下属的科研所改制成立国家控股的科研开发中心"],["D","小张、小王和村里的其他人一起建起了一所村小学"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词强调“由一定人数以上的股东组成”、“全部资本分为等额股份”。\n第二步：逐一判断选项。\nA项“两公司各负责一年”看管一片草地没有体现“全部资本分为等额股份”，且甲公司和乙公\n司是两个不同的公司；\nB项“甲公司进行改组”说明该公司“由一定人数以上的股东组成”，“将全部资本分为五万股”\n体现了“全部资本分为等额股份”；\nC项“国家控股的科研开发中心”没有体现“全部资本分为等额股份”；\nD项“一起建起了一所村小学”不涉及“全部资本分为等额股份”，不符合股份有限公司定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0076","type":"single","t":"东施效颦：中国历史上“四大美女”之一的西施有心痛的毛病。犯病时手扶住胸口，皱着眉头，比平时更美丽。同村女孩东施学着西施的样子扶住胸口，皱着眉头，因其本来就长得丑，再加上刻意地模仿西施的动作，装腔作势的怪样子，让人更加厌恶。用下面哪个词来解释成语东施效颦最合适：","o":[["A","独辟蹊径"],["B","标新立异"],["C","盲目模仿"],["D","照猫画虎"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词强调“刻意模仿”且“装腔作势”的怪样子。\n第二步：逐一判断选项。\nA选项“独辟蹊径”指独创一种新风格或新的方法，不符合定义；\nB选项“标新立异”指独创一格的意思，不符合定义；\nC选项“盲目模仿”与定义相近；\nD选项“照猫画虎”指照着样子模仿，不包含不考虑自己的实际情况去模仿，不符合定义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0077","type":"single","t":"供给诱导需求是指供应商利用优于消费者的资讯，以自身的利益为优先考量，促使消费者购买更多的产品和服务。根据上述定义，下列不属于供给诱导需求的是：","o":[["A","某百货商场为促销，在元旦期间先对某商品进行提价，再以“满200元送50元”的手段促销该商品"],["B","某超市售货员让顾客免费品尝国外某品牌饮料，并宣称该饮料是该国成功人士的首选"],["C","林女士凭免费券到某美容店美容时，美容师说其美白产品效果很好，用了能使人年轻10岁，林女士随后订购了一年的美容消费"],["D","李先生为更换手机到某电器城，他详细咨询了销售员，买到了一部自己称心的手机"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n定义中强调“优于消费者的资讯”、优先考虑自身利益、促使购买更多产品等。\n第二步：逐一判断选项。\nA、B、C项均属于利用优于消费者的资讯增加了消费者的消费，符合定义；\nD项中购买称心的手机不属于增加消费，而是消费者必需的消费，不符合定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0078","type":"single","t":"人际冲突有两种：工作性冲突与情绪性冲突（关系冲突）。工作性冲突是因为对工作本身有不同的理解、思路和方法；情绪性冲突则是情绪上的对立或敌意。根据上面的定义，下面属于情绪性冲突的是：","o":[["A","某单位领导因为坚持原则和下属发生严重的争执"],["B","一位年轻女孩子，因男友的冷漠，和他吵起来了"],["C","一位年轻的同事正在向顾客说明什么，但顾客表现得很激动"],["D","一位老者正在教训那些采摘校园玫瑰花的人"]],"a":["B"],"an":"第一步：找到定义关键词。\n关键词强调“情绪上的对立或敌意”。\n第二步：逐一选项。\nA项：领导坚持原则与下属发生争执并非情绪上的对立或敌意，而是属于工作性冲突；\nB项：年轻女孩因男友的冷漠和他吵起来，体现了“情绪上的对立”，符合定义；\nC项：顾客表现得很激动，并未体现情绪上的对立或敌意；\nD项：老者正在教训采摘校园玫瑰花的人，也未体现“情绪上的对立或敌意”。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0079","type":"single","t":"差异性市场策略是指企业在对整体市场细分的基础上，针对每个细分市场的需求特点，设计和生产不同的产品，制定并实施不同的市场营销组合策略（各种营销手段的综合运用），试图以差异性的产品满足差异性的市场需求。根据上述定义，下列属于差异性市场策略的是：","o":[["A","某汽车生产企业面向工薪阶层，主要生产经济型轿车，这种轿车售价低，耗油少，深受工薪阶层欢迎"],["B","某超市推行会员制，根据会员积分的多少，赠予不同档次的礼品"],["C","某企业生产的电脑在市场上销路很好，为拓宽市场，又开始研发手机"],["D","某化妆品生产企业针对不同年龄阶段的消费生产、销售不同种类的润肤露"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“整体市场细分”，“差异性的产品”，“差异性的市场”。\n第二步：逐一判断选项。\nA中汽车生产企业主要生产经济型轿车，并没有细分整体市场，不符合关键词“整体市场细\n分”，因此不属于差异性市场策略；\nB中不同档次的礼品不是产品，不符合关键词“差异性的产品”，因此不属于差异性市场策略；\nC中企业生产电脑，为拓宽市场，又研发手机，针对的是原有市场，且电脑和手机是完全不\n同的产品，不符合关键词“差异性的产品”和“差异性的市场”，因此不属于差异性市场策略；\nD中化妆品生产企业的做法完全符合关键词，因此属于差异性市场策略。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0080","type":"single","t":"订单式培养：指用人单位提出用人申请后，由劳动保障部门委托培训机构根据用工需求组织实施的明确就业岗位去向的人才培养模式。下列属于订单式培养的是：","o":[["A","某职业技术学院调研后发现，烹饪即将成为未来数年的紧俏职业，当年就开设了烹饪专业，果不其然，毕业生很抢手，很多餐饮名店都登门签约"],["B","某民办托儿所急需几名保育员，主管部门接到申请后马上找到一家资深代培机构组织培训，几名合格的保育员很快到岗"],["C","某市每年都会根据各乡镇上报的用人需求，在全省高校中聘请一批科研人员，然后分派到各地担任科技副镇长"],["D","某物业公司最近被多个小区选中，需要补充大批保安，为了顺利接手各个小区的安保工作，公司急招了数十名新手，正委托专业保安公司强化培养"]],"a":["B"],"an":"第一步：找到定义关键词\n“用人单位提出用人申请后”、“劳动保障部门委托培训机构根据需求组织实施的明确就业岗\n位去向的人才培养”\n第二步：逐一分析选项\nA项：职业技术学院开设烹饪专业不是受劳动保障部门委托，而是主动开设，不符合定义，\n排除；\nB项：托儿所提出的是保育员的用人申请，主管部门委托代培机构组织培训符合劳动保障部\n门委托培训机构根据需求组织人才培养，符合定义，当选；\nC项：某市在高校中聘请科研人员不属于委托培训机构根据需求组织人才培养，不符合定义，\n排除；\nD项：物业公司委托专业保安公司强化培养并没有，不是劳动保障部门委托培训机构，并没\n有提出用人申请，不符合定义，排除。\n故正确答案为B。\n 第06关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0081","type":"single","t":"标杆管理：不断寻找和研究同行一流公司的最佳实践，以此为基准与本企业进行比较、分析、判断，从而使自己企业得到不断改进，从而进入赶超一流公司创造优秀业绩的良性循环过程。其核心是向业内或业外的最优企业学习。根据上述定义，下列属于标杆管理的是：","o":[["A","空调业两大巨头公司合力投资、联合研发新一代生态环保空调"],["B","某保险公司将本公司与业内最优公司的年终业绩差距与员工年终奖挂钩"],["C","某公司将同行公司“生产产品之前先造就人才”的先进经营理念引入本公司"],["D","某公司研究对手公司的优势和弱势，改进自身生产流程，增强了产品的市场竞争力"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括：“寻找和研究同行一流公司的最佳实践”、“与本企业进行比较、分析、判断”、\n“使自己企业得到不断改进，从而进入赶超一流公司，创造优秀业绩的良性循环过程”、“核\n心是向业内或业外的最优企业学习”\n第二步：逐一判断选项。\nA项：涉及的是空调业的两大巨头相互合作的案例，并没有提到一个公司与另一个公司进行\n比较、分析、判断的学习过程，因此不属于标杆管理；\nB项：保险公司的做法并没有体现出“寻找和研究同行一流公司的最佳实践”、“与本企业进行\n比较、分析、判断”，只是单纯地把员工的年终奖和业绩差距挂钩，这就有点像过去大学里\n把学位证和四级成绩挂钩一样，不属于标杆管理；\nC项：首先，同行公司并不一定是本行业的一流公司，这里无法体现出“寻找和研究同行一\n流公司的最佳实践”；其次，这里引进的是个经营理念，体现不出“与本企业进行比较、分析、\n判断”的过程；再次，这里也没有说明引进先进经营理念后的效果如何，体现不出“创造优秀\n业绩”。综合以上三点，显然本选项不符合标杆管理的定义；\nD项：能够成为公司的对手，反映出对方公司具有一定的实力，在行业里处于一流地位，体\n现了“寻找和研究同行一流公司的最佳实践”。研究对手公司的优劣并加以改进自身的生产流\n程，体现出了“与本企业进行比较、分析、判断”的过程；增强了产品的市场竞争力，则符合\n“创造优秀业绩”这点。所以该选项最为符合标杆管理的定义。\n综上所述，A、B、C都不属于标杆管理。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0082","type":"single","t":"社会支持系统通常是指来自社会各方面包括父母、亲戚、朋友等给予个体的精神或物质上的帮助和支持的系统，它的目标是使个体重新恢复到和谐的心理状态和优良的生活中。根据上述定义，下列不属于社会支持系统的是：","o":[["A","小陈高考失败，父母对其进行安慰"],["B","张某因为失恋，心情不好，找朋友倾诉"],["C","小赵心情不好时，就听自己偶像的歌曲缓解情绪"],["D","平时工作压力很大，李某就经常和同事出去唱歌吃饭"]],"a":["C"],"an":"第一步：查找关键词。“社会各方面包括父母、亲戚、朋友等”。第二步：逐一分析\n选项。A项：父母给予精神上的支持，属于社会支持系统；B项：朋友在精神上支持鼓励，\n属于社会支持系统；D项：朋友在精神上支持，属于社会支持系统；C项：小赵听偶像的音\n乐，并不是来自社会各方面包括父母、亲戚、朋友等的支持。\n本题为选非题，故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0083","type":"single","t":"菜单成本指的是商家调整产品价格而产生的成本。根据上述定义，下列选项属于菜单成本的是：","o":[["A","某百货公司进行店面装修，为此提高部分商品价格、转嫁开支"],["B","某手机生产商下调产品价格销量大增，为此对生产线进行扩建"],["C","某汽车生产商对某车型进行升级后，提高了该车型的市场售价"],["D","某保险公司增加险种受到顾客欢迎，但因此理赔成本也增加了"]],"a":["B"],"an":"第一步：找出定义关键词。\n关键词为“调整产品价格”“产生的成本”，“调整产品价格”是因，“产生的成本”为果，属于因\n果关系。\n第二步：逐一分析选项。\nA项：因为店面装修而提升价格，不符合定义；\nB项：因为价格降低带来销量大增，进而对生产线扩建，扩大生产线需要产生成本，符合定\n义；\nC项：因为对车型升级而提高价格，不符合定义；\nD项：因为增加险种受到顾客欢迎，客户群体大了引起理赔成本增加，同样不符合定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0084","type":"single","t":"定义：①后像是指刺激物对感受器的作用停止后，感觉现象并不立即消失，而是保留一段短暂的时间。②闪光融合是指断续的闪光由于频率的增加，人们会得到融合的感觉。③视觉掩蔽是指在某种条件下，当一个闪光出现在另一个闪光之后，这个闪光能影响到对前一个闪光的觉察。典型例证：（1）面对熟悉的场所，小周沉浸在美好的回忆之中，回忆中的情景是那么清晰，就像在眼前一样。（2）阿姆斯特朗在环法自行车大赛中，骑得飞快，车轮的辐条几乎像消失了一样。（3）在霞光暮霭之中，火箭腾空而起，逐渐消失在浩瀚的宇宙之中。上述典型例证与定义存在对应有关系的数目有：","o":[["A","0 个"],["B","1 个"],["C","2 个"],["D","3 个"]],"a":["B"],"an":"第一步：抓住每个定义中的关键词。\n①后像：关键词是“保留一段短暂的时间”；②闪光融合：关键词是“频率的增加，人们会得\n到融合的感觉”；③从众：关键词是“后一个闪光能影响到对前一个闪光的觉察”。\n第二步：逐一判断选项。\n例证（1）不属于上述任何定义，它是面对熟悉的场所，唤起了内心深处沉淀的回忆，并不\n是后像；例证（2）属于闪光融合；\n例证（3）不属于上述任何定义，它就是一个客观事实。\n所以符合上种定义之一的例证有1个。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0085","type":"single","t":"半导体：是导电性能介于金属和绝缘体之间的物质。按照这个定义，下面说法错误的是：","o":[["A","某溶液的导电性能不如金属，又不是绝缘体。所以这种溶液是半导体"],["B","干燥的木块不导电，将木块弄潮湿后开始导电，但导电性能远不如铝、铜等金属。但是，“潮湿将木块由绝缘体变为半导体”的说法是错误的"],["C","汞的导电性大大小于铝、铜、铁等金属材料，所以，汞是半导体物质"],["D","在纯结晶状态的硅中掺入某些元素原子后，会由不导电变为导电，但它在某一个方向导电比另一个方向容易些，而且导电能力受电压等外界因素影响大。这些导电性能不如金属，所以，是硅半导体物质"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词强调半导体的导电性能介于金属和绝缘体之间。\n第二步：逐一判断选项。\nA中“某溶液”的导电性能介于金属和绝缘体之间，所以“某溶液”是半导体，A正确；\nB中“潮湿的木块”导电性能虽不如铝、铜等金属，但它仍比其他某些金属导电性能好，它是\n导体。所以“潮湿将木块由绝缘体变为半导体”是错误的，B正确；\nC中“汞”导电性能虽然远小于“铝、铜、铁等金属材料”，但是汞仍属于金属导体，C错误；\nD中“硅”能导电但是导电性能不如金属，所以它是半导体，D正确。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0086","type":"single","t":"缺陷补偿是指个体在充当社会角色时不可能事事成功，当自我角色目标失败时，常常可能会对相关的社会角色的重要性做重新评价，从而进行自我定义以补偿自己角色缺陷。根据上述定义，下列属于缺陷补偿的是（ ）。","o":[["A","小王认为评上优秀员工是晋升的关键，因此当评选失利后决定在下一次的评选中再接再厉"],["B","小张有份很不错的工作，他参加公务员考试是抱着试试看的态度，所以当他得知自己没有通过考试时并未觉得太遗憾"],["C","黄某大学毕业后求职不顺利，他觉得这是由于自己不是名牌大学毕业生，否则就业会容易的多"],["D","袁女士离婚后全身心投入工作，取得了很大成绩，她认为事业成功比婚姻幸福更重要"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“自我角色目标失败”，“相关的社会角色”，“重新评价”。\n第二步：逐一判断选项。\nA中小王评选失败后只是决定在下一次的评选中再接再厉，不符合关键词“重新评价”，因此\n不属于缺陷补偿；\nB中当小张得知自己没有通过考试时并未觉得太遗憾，同样不符合关键词“重新评价”，因此\n不属于缺陷补偿；\nC中黄某求职不顺觉得这是由于自己不是名牌大学毕业生，是他个人，并没有对“相关的社\n会角色”进行评价，因此不属于缺陷补偿；\nD中袁女士离婚后（自我角色目标失败），认为事业成功比婚姻幸福更为重要（对相关的社\n会角色的重要性做重新评价），符合关键词，因此属于缺陷补偿。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0087","type":"single","t":"受贿：国家工作人员、集体经济组织工作人员或者其他从事公务的人员，利用职务上的便利，索取或者非法收受他人财物，为他人谋取利益的行为。根据以上定义，下面哪种行为是受贿：","o":[["A","甲是某厂财务主管，在给乙报销时，多报销2000元，事后与乙平分，二人各得1000元"],["B","卫某(女)因盗窃金店而被公安机关收审，贾某负责审理这个案子。卫某想让贾某帮助她。即以身相许，尔后贾某便利用自己的职权设法使卫某逃避了法律制裁"],["C","刘某想倒卖彩电，就托人找到电视机厂主管彩电批发的王某，送去10000元人民币，希望王某按批发价卖给他100台彩电。王某收到钱后交给了领导"],["D","王某主管某单位分房子，李某为了给他在该单位工作的儿子分得一套住房，就给王某送去价值5000元的厚礼。王某得到钱后给李某的儿子分了房子"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“国家工作人员、集体经济组织工作人员或者其他从事公务的人员”，“索取或者\n非法收受他人财物”，“为他人谋取利益”。\n第二步：逐一判断选项。\nA项中甲和乙的行为不符合关键词“索取或者非法收受他人财物”，因此不是受贿；\nB项中卫某是以身相许，贾某的行为不符合关键词“索取或者非法收受他人财物”，因此不是\n受贿；\nC项中王某收到钱后交给了领导，王某的行为不符合关键词“索取或者非法收受他人财物”，\n因此不是受贿；\nD项中王某得到钱后给李某的儿子分了房子，完全符合关键词，因此是受贿。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0088","type":"single","t":"旅游商品，是指旅游者在旅游活动中出于非商业性目的而购买的实物性商品，它不包含维持旅游活动所必需的生活用品。根据上述定义，下列属于旅游商品的是：","o":[["A","小王在尼泊尔买了100个手链、200条围巾准备放到自己在北京经营的店铺里销售"],["B","到欧洲出差的张小姐利用闲暇时间在英国某古董商店购买了一套精美茶具"],["C","某夫妇为了国庆假期的海南五日游到超市购买了一瓶防晒霜和两副墨镜"],["D","李女士在泰国旅游时从小商贩那里得到了很多关于当地美食娱乐方面的信息"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n定义强调“旅游者”“在旅游活动中”“非商业性目的”“实物性商品”“不包含旅游所需的生活用\n品”。\n第二步：逐一判断选项。\nA项小王买的东西是用于销售，属于商业性目的，与定义不符；\nB项张小姐是旅游者，在旅游活动中，买的茶具是实物性商品，不用于商业性目的，也不是\n维持旅游活动所必需的生活用品，符合定义；\nC项某夫妇买的防晒霜和墨镜属于到海南旅游必备的生活用品，与定义不符；\nD项李女士获得的是信息，不是实物性商品，不符合定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0089","type":"single","t":"角色混同指的是将自己所具有的不同角色相混淆，而发生的导致背离角色期待和角色规范的行为。根据上述定义，下列哪项属于角色混同：","o":[["A","到北京来打工的某外省青年有时不自觉地说起家乡话，常常弄得同事莫名其妙"],["B","庄周梦见自己变成蝴蝶，醒过来之后惊惶不定，庄周不知自己梦中变成了蝴蝶，还是蝴蝶梦中变成了自己"],["C","小王是个游戏迷，他常常将工作中的同事假想成游戏中的玩家，也常常将游戏中的玩家想象成自己的某个同事"],["D","老李是某局局长，对于儿子提出的要求，他常常不自觉地说：“这事得和其他同志研究研究。”为此，他多次受到妻子的批评"]],"a":["D"],"an":"角色混同关键词为“将自己所具有的不同角色相混淆”和“导致背离角色期待和角色\n规范”。A、B、C三项都没有体现出一个人所具有的两种不同的角色，D项老李对儿子的要\n求不自觉地说出工作中的语言，把父亲和局长的身份混淆了，属于角色混同。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0090","type":"single","t":"知识溢出是指知识接受者将获得的知识与自有知识相融合后得出新的知识，却没有给予知识的提供者以补偿，因而提供者没有享受原知识的全部收益，或者给予的补偿小于知识创造的成本，接受者自觉或不自觉地未承担知识的全部成本的现象。根据上述定义，下列属于知识溢出的是：","o":[["A","学生从辅导班学到了某题的解题方法和技巧，并且可熟练地解答这一类型的题目"],["B","某公司代理国外知名电子产品的生产与销售，后引入生产线为这款电子产品生产配套的充电设备，公司效益大增"],["C","某公司通过与海外研究机构联合工作，引入对方的技术开发出一款新产品，双方约定共享产权和效益"],["D","某城市设计机构参与了另外一个大城市的规划方案，结合本市原有设计方案和实际情况设计了新区交通网络"]],"a":["D"],"an":"第一步：抓住定义中的关键词。知识溢出的关键词：①“知识接受者将获得的知识\n与自有知识相融合后得出新的知识”、②“没有给予知识的提供者以补偿”、③“或者给予的补\n偿小于知识创造的成本”、④“接受者自觉或不自觉地未承担知识的全部成本”。第二步：逐\n一判断选项。A项，学生学习的是解题技巧，并没有与自己的知识融合后得出新的知识，所\n以不符合关键词①；学生从辅导班学习解题技巧，辅导班是收费的，学生作为知识接受者，\n给与知识提供者即辅导班学费，即为足够的补偿，不符合关键词②。B项，代理生产和销售\n也好、引入新生产线也好，均只是对国外生产技术的照搬，并没有体现出将外国的新技术与\n自身技术结合后得到新的技术，因此不符合①；题干对于是否有补偿，以及补偿程度，并未\n提及。C项：引入对方开发的新产品，共享产权和效益，说明此公司在收益和权利上与对方\n分享，提供了足够的补偿，不符合②、③、④。D项，参考本市原有设计方案属于自有知识，\n根据实际情况设计说明获取了另一个城市的相关知识，二者结合后设计出了新区交通网络，\n属于知识创新，符合①。这里没有提及是否对原设计方案的设计方给与补偿。属于半对半错\n选项。综上所述，A、B、C三项均为明显错误选项。\n故正确答案为D。\n 第07关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0091","type":"single","t":"破窗现象：一个房子如果窗户破了，没有人去修补，隔不久，其他的窗户也会莫名其妙地被人打破，所以环境中的不良现象如果被放任存在，会诱使人们仿效，甚至变本加厉。根据上述定义，下列不属于破窗现象的是：","o":[["A","一面墙出现了一些涂鸦没有被清除，很快，墙上就布满了乱七八糟、不堪入目的东西"],["B","一个干净的地方，人们不好意思丢垃圾，但是一旦地上有垃圾出现，人们就会毫不犹豫地跟着丢，丝毫不会惭愧"],["C","一个村里发生了传染性疾病，由于没有及时隔离，结果很快整个村落的人都被传染上了"],["D","一个教室里，有两个学生偷偷讲话，老师没有制止，很快大半个班级的学生都在聊天了"]],"a":["C"],"an":"第一步：找到定义关键词。\n环境中的不良现象，被放任存在，诱使人们仿效\n第二步：逐一分析选项。\nC项传染性疾病的传播并非是人们仿效造成的结果，不满足定义，是本题答案。\nA项墙上的涂鸦、B项地上的垃圾、D项教室学生讲话都是不良现象被放任存在后，别人仿\n效形成的结果，满足关键词。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0092","type":"single","t":"边民互市贸易是指边境区边民在我国陆路边境20公里以内，经政府的批准开放点或指定的集市上，在不超过规定的金额或数量范围内进行的商品交换活动。下列各项中最有可能属于边民互市贸易的是（ ）。","o":[["A","家住四川的小李到北方旅游，在离中俄边境很近的俄罗斯境内购买了一些漂亮的但是价值并不高的俄罗斯民间艺术品"],["B","胡某是越南人，生活在中越边境地区的越南境内，虽然家境不是很富裕，但是每天他都会步行二十分钟越过国境线到中国境内买他喜欢吃的中国美食"],["C","在我国跟尼泊尔的边境方圆不超过20公里范围内的两国的外贸公司之间总是进行着一些小额贸易"],["D","中国的工业产品在缅甸非常受欢迎，中国某公司生产的摩托车行销缅甸全国"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“边境区边民”，“在我国陆路边境20公里以内”，“经政府的批准开放点或指定的\n集市上”，“在不超过规定的金额或数量范围内”。\n第二步：逐一判断选项。\nA中的“家住四川的小李”和C中“外贸公司”均不符合关键词“边境区边民”，因此A和C均错；\nB中的描述符合关键词，因此属于边民互市贸易；\nD中“行销缅甸全国”不符合关键词“我国陆路边境20公里以内”，因此D错。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0093","type":"single","t":"划分是把一个属概念分为他的各个种概念，以明确概念外延的一种思维方法。正确的划分要求划分出的各项外延之和必须等于母项，而且要采用同一标准，子项的外延不相容，而且是同一层次的概念。下列语句作为划分正确的是：","o":[["A","直系亲属分为“双亲”“胞亲”“配偶”和“子女”"],["B","战争分为常规战争和非常规战争"],["C","地球分为南半球和北半球"],["D","健康分为心理健康和生理健康"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n划分需按“统一标准”。划分出的“子项外延之和必须等于母项”且“子项的外延不相容且是同一\n层次”，即子项应为全异关系。\n第二步：逐一判断选项。\nA中各项的外延之和不等于“直系亲属”，“双亲”、“子女”、“配偶”属于“直系亲属”，但“直系\n亲属”还应包括外祖父与外孙子女等，且“胞亲”不属于“直系亲属”；\nB中按使用的武器种类分为“常规战争”和“非常规战争”，但是它们的外延之和小于战争，因\n为战争还包括不使用武器的战争；\nC中“南半球”和“北半球”是按方位划分的，二者之和等于地球且二者是全异关系；\nD中子项外延之和小于母项，因为健康包括心理健康、生理健康和道德健康。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0094","type":"single","t":"强度相对数是两个不同性质但又有联系的总量指标之间的比值，用以说明现象的强度、密度、和普遍程度的综合指标。根据以上定义，以下描述属于强度相对数的有：","o":[["A","2006年，我国人均GDP超过2000美元"],["B","2007年，某地区城镇在职职工的人均月工资为1800元"],["C","美国与中国的人均GDP之比约为20：1"],["D","2008年1月某地区劳动生产率为3000元/人"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n定义中强调“不同性质但又有联系的总量指标”、“比值”等。\n第二步：逐一判断选项。\nA、B中的数字均不是比值；\nC中的比值不是不同性质的总量间的比值；\nD中的数字是产值与人数的比值，符合定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0095","type":"single","t":"自媒体：指为个体提供信息生产、积累、共享、传播内容兼具私密性和公开性的信息传播方式。下列属于自媒体的是：","o":[["A","私人电视台"],["B","名人博客"],["C","小区内部通知"],["D","公司内部公告"]],"a":["B"],"an":"第一步：抓住定义中关键词。\n定义的关键词有“共享”、“兼具私密性和公开性”。\n第二步：逐一判断选项。\nA项私人电视台没有体现“公开性”，不符合定义；\nB项名人博客兼具私密性和公开性，符合定义；\nC项“小区内部”没有体现“公开”，不符合定义；\nD项“公司内部”没有体现“公开性”，不符合定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0096","type":"single","t":"极端制造：指在极端条件下，制造极端尺度或极高功能的器件和功能系统，集中表现在微细制造、超精密制造、巨系统制造等方面。下列不属于极端制造的是：","o":[["A","飞机制造与热连轧机组制造等复杂系统制造"],["B","无缝钢管、电子秤、折叠自行车等的制造"],["C","以激光、电子束、离子束刻蚀等强能束制造为代表的激光加工"],["D","生物矿石破碎、微生物冶金技术等生物制造"]],"a":["B"],"an":"第一步：抓住定义中关键词。\n定义的关键词有“极端条件”、“微细”、“精密”。\n第二步：逐一判断选项。\nA项的“飞机制造与热连轧机组制造等复杂系统”，C项“强能束制造为代表的激光加工”，D\n项“微生物冶金技术等生物制造”等都体现了“微细”、“精密”等关键词，符合定义。\nB项“无缝钢管、电子秤、折叠自行车等”等都属于常见的的加工制造，不符合定义。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0097","type":"single","t":"自然淘汰育种法，指在良种筛选过程中，减少人为干预，尽量通过被筛选对象的自然生长确定所需良种的育种方法。下列属于自然淘汰育种法的是","o":[["A","甲鱼养殖场为了选育出抗病力强的种鱼，在甲鱼接连死亡的情况下，没有使用任何药物，存活到最后的则作为种鱼"],["B","锦鲤养殖户从幼鱼开始分拣最有经济价值的鱼苗，经过三次人工选鱼后，最终只有大约10%的幼鱼成了精品锦鲤"],["C","石斛养殖户爬上人迹罕至的悬崖峭壁采集野生石斛，挑选其中的一部分作为种苗，精心培育出了多个新品种"],["D","生长在山坡上的某种植物，有的长势非常茂盛，有的则弱小枯黄，泾渭分明，这正是“物竞天择”的形象说明"]],"a":["A"],"an":"第一步，找到定义关键词\n关键词为“筛选过程中”“减少人为干预”“自然生长”“确定所需良种”\n第二步，逐一分析选项\nA项：甲鱼养殖场没有使用任何药物，相当于没有进行人为干预，尽量通过自然生长筛选，\n存活到最后的抗病力强的种鱼就是所需的良种，符合定义；\nB项：经过三次人工选鱼，说明多次进行人工干预，不符合减少人为干预的关键词，排除；\nC项：养殖户的精心培育是人工干预，同时也没有体现筛选过程，不符合定义，排除；\nD项：山坡上的植物长势是自然状态，并不是良种筛选的过程，排除；\n故正确答案为A","tp":"定义判断","d":"中"},
	{"i":"fjcs_0098","type":"single","t":"反政治的政治指的是一种政治态度，是对极权政治的一种否定。其基本思想是不把政治看做是关于权力和操纵的技术，也不把政治看做是关于控制人类的规则或有用的艺术，而是把政治看做是一种寻求和实现有意义生活的方式。根据以上定义，以下最符合反政治的政治的是：","o":[["A","杰出的政治家都是哲学家"],["B","应该根据文化传统来建立不同人群的国家"],["C","国家之间应该求同存异"],["D","政治的根本目的是追求人的和谐，全面的发展"]],"a":["D"],"an":"第一步：找关键词。反政治的政治的定义条件包括：（1）否定极权政治的一种政\n治态度；（2）不把政治看作是关于权力和操纵的技术，也不把政治看作是关于控制人类的\n规则或有用的艺术；（3）一种寻求和实现有意义生活的方式。第二步：逐一分析选项。A\n项政治家都是哲学家这是一种观点，而非一种政治态度，不符合定义（1）；B项中的政治\n观点体现了企图通过文化传统来对不同人群生活规则的控制，不符合定义条件（2）；C项\n国家之间应该求同存异体现了政治对不同国家人类规则的一种控制与影响，不符合定义条件\n（2）；D项政治的根本目的是追求人的和谐、全面发展，体现了人权的重要性，是对极权\n政治的一种否定，符合定义。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0099","type":"single","t":"附加值是附加价值的简称，是在产品原有价值的基础上，通过生产过程中的有效劳动新创造的价值，即附加在产品原有价值上的新价值。根据上述定义，以下行为提高了产品附加价值的是：","o":[["A","某明星为娱乐活动优胜者的奖品签名"],["B","雨天商贩以高于市场价的价格在景区内销售雨具"],["C","某生产饮料的厂家将产品由过去的罐装变为塑料包装"],["D","个体商贩请人在白色T恤上画上各种漂亮的图案后出售"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“原有价值的基础上”，“有效劳动新创造的价值”。\n第二步：逐一判断选项。\nA项中明星为奖品签名并不符合关键词“有效劳动新创造的价值”，因此不属于提高了产品附\n加价值；\nB项中雨天商贩高价销售雨具同样不符合关键词“有效劳动新创造的价值”，因此不属于提高\n了产品附加价值；\nC项中厂家将产品由过去的罐装变为塑料包装的做法，不符合关键词“原有价值的基础上”，\n因此不属于提高了产品附加价值；\nD项中个体商贩的做法符合关键词，因此属于提高了产品附加价值。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0100","type":"single","t":"诽谤罪是指故意捏造并散布某种事实，损坏他人人格，破坏他人名誉，情节严重的行为。下列行为构成诽谤罪的是：","o":[["A","甲因公司经理对其进行批评而心怀不满，认为这是由于自己在言行方面得罪了经理的缘故，于是多次在同事面前表述这种想法，给经理的声誉造成了很坏的影响。"],["B","乙与邻居王某素来不睦，在王某想要卖房搬家之际，乙多次向周围住户宣称王某家的房屋风水不好，致使王某因房价下跌遭受严重的经济损失。"],["C","丙听说同学小张在校外参与打架斗殴，在消息未经证实的情况下，丙到处向同学诉说丙因带头聚众斗殴而被拘留，致使小张因压力过大而自杀。"],["D","丁为某公司财务部门主管领导，因一笔巨款不翼而飞，认为是会计小刘私吞，因而多次找小刘谈话，并在部门会议上表示小刘有作案嫌疑，致使小刘声誉受损。"]],"a":["C"],"an":"第一步：抓住定义中关键词。\n定义中强调“故意捏造并散布”、“损坏他人人格”、“破坏他人名誉”、“情节严重”。\n第二步：逐一判断选项。\nA项并未体现“情节严重”；\nB项并未“损害他人人格”；\nC项符合定义所有要素，特别是“情节严重”使人因压力过大而自杀；\nD项中是否“故意捏造”并无定论。\n故正确答案为C。\n 第08关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0101","type":"single","t":"共同共有：指两个或两个以上的共有人对共有财产享有同等权利并承担同等的责任和义务。根据上述定义，下列哪一种情况属于共同共有：","o":[["A","某百万富翁立下遗嘱，言明他所有的存款及房产折价后，平等地分给他的两个儿子，两个各享一半财产的继承权"],["B","某大学的学生宿舍按规定应该每个宿舍住六个人，由于人数原因，最后一个安排的宿舍只有三个人。后学校给每个宿舍配了一台饮水机，给三个人的宿舍也装了一个"],["C","某风险投资商投资某一正在发展的小型企业，并言明该企业以后实行股份制，企业董事长拥有30%的股份，风险投资商占有70%的股份"],["D","两个伙伴合作开办了一家公司，一个负责经营，一个负责开发，但他们在合伙前就以书面公证的形式言明，两人共同拥有这家公司，但是一旦破产欠债，管开发的人不负责还债"]],"a":["B"],"an":"第一步：找到定义关键词。\n两个或两个以上，共有财产，同等权利并承担同等的责任和义务。\n第二步：逐一分析选项。\nA项两个儿子各享一半的财产，不满足“共有财产”；\nB项饮水机属于宿舍不可分割的共有财产，宿舍里的学生享有同等权利并承担同等的责任，\n是本题答案；\nC项董事长和风险投资商享有的权利和承担的义务不同等，不满足关键词；\nD项两个合伙人承担的责任不同，不满足关键词。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0102","type":"single","t":"化学反应：指一种或多种物质改变化学组成、性质和特征成为与原来不相同的另一种或多种物质的变化。下列变化哪一种不属于化学反应：","o":[["A","以石油为原料合成聚乙烯"],["B","木炭燃烧获取热量"],["C","葡萄通过乙醇等工艺制造成葡萄酒"],["D","自来水加热变成水蒸气"]],"a":["D"],"an":"第一步：找到定义关键词。\n成为与原来不相同的另一种或多种物质。\n第二步：逐一分析选项。\nA项石油变成聚乙烯，B项木炭燃烧后变成炭灰，C项葡萄变成葡萄酒，变成的物质与原来\n不相同，满足关键词。\nD项水蒸气是水的气体形式，不满足“成为与原来不相同的另一种或多种物质”，是答案。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0103","type":"single","t":"共生又叫互利共生，是两种生物彼此互利地生存在一起，缺此失彼都不能生存的一类种间关系，是生物之间相互关系的高度发展。共生的生物在生理上相互分工，互换生命活动的产物，在组织上形成了新的结构。依据上述定义，下列现象中不属于共生的是：","o":[["A","海葵常固定在寄居蟹的外壳上，当它靠刺细胞防御敌害时，能对寄居蟹起到间接的保护作用。而寄居蟹到处爬行，可使海葵得到更多的食物"],["B","廯是皮肤感染霉菌后而引起的一种疾病，霉菌主要侵害皮肤、毛发和指（趾）甲，依据发病部位可分为头廯、手廯、足癣、甲癣、体癣等"],["C","鞭毛虫寄居在白蚁或其他动物的消化道里，消化纤维供给宿主，宿主则为其提供营养和栖所"],["D","科学家们发现一种桶形仙人掌，它的顶端有不断生产花蜜的“蜜厂”，这些花蜜养活了一些蚂蚁。蚂蚁就尽心尽力地保护仙人掌的种子在自行脱落前不被虫子吃掉"]],"a":["B"],"an":"第一步：查找关键词。\n定义的关键词为：“两种生物彼此互利”“缺此失彼都不能生存”。\n第二步：逐一分析选项。\nA项中海葵对寄居蟹起到保护作用，寄居蟹使海葵得到更多的食物，彼此互利共生，符合定\n义；\nB项中癣与霉菌并非互利共生，癣仅为感染霉菌后的一种疾病，不符合定义；\nC项中鞭毛虫消化纤维供给白蚁，白蚁为鞭毛虫提供营养和栖所，二者互利共生，符合定义；\nD项中仙人掌生产花蜜养活蚂蚁，蚂蚁保护仙人掌种子不被虫吃。二者互利共生，符合定义。\n此题为选非题，故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0104","type":"single","t":"逆向思维是一种比较特殊的思维方式，它的思维取向是与常人的思维取向相反的。逆向思维并不是主张人们在思考时违逆常规，不受限制的胡思乱想，而是训练一种小概率思维模式，即在思维活动中关注小概率可能性的思维。根据上述定义，下列属于逆向思维的是：","o":[["A","人弃我取，人进我退，人动我静，人刚我柔"],["B","以某一复杂问题的结果为发散点，尽可能多的把它与别的事物组合成新问题"],["C","以某一复杂问题的结果为发散点，推出各种结果的各种原因"],["D","将人们通常思考的思路稍加扭转，“歪打正着”"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n逆向思维强调“与常人的思维取向相反”，“关注小概率可能性”。\n第二步：逐一判断选项。\nA中“人弃、进、动、刚，我取、退、静、柔”表明我的行为和别人取向相反，这属于逆向思\n维A符合；\nB、C中“以结果为发散点进行多种推导”，这属于发散性思维，B、C不符；\nD中“对常人的思维稍加扭转”并非“与常人的思维相反”，D不符。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0105","type":"single","t":"短板理论是指木桶的盛水量是由组成木桶的模板中最短的那一块决定的，这块短板即为这个木桶盛水量的“限制因素”。根据上述定义，下列不符合短板理论的是：","o":[["A","某单位员工工作积极性降低，单位遂任命一位新领导，提高了团队士气"],["B","某家长注重孩子的智力培养，忽视其心理健康，使得孩子因为心理问题而迷失自我"],["C","某企业注重对技术精英的培养，对一般员工的使用和开发不足，致使团队士气受挫"],["D","某酒业集团投入巨资做广告，一度成为酒业的新秀，但最终因产能不足，导致企业破产"]],"a":["A"],"an":"定义中强调的关键词句：“短板即为……限制因素”。\nA项中没有体现出短板对组织的影响，不符合定义；B项因为“心理健康”，C项“一般员工”\n的使用和开发不足，D项的“产能不足”均属于短板的限制，符合定义。\n本题为选非题，故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0106","type":"single","t":"威客是指通过互联网把自己的智慧、知识、能力、经验转换成实际收益的人，他们在互联网上通过解决科学、技术、工作、生活、学习中的问题从而让知识、智慧、经验、技能体现经济价值。根据上述定义，下列各项中属于威客或威客模式的网站是：","o":[["A","某网站提供近三十年的学术论文的检索，但如果要全文下载要收取一定的费用"],["B","赵教授是医治心脑血管疾病的知名专家，为更好地为广大患者服务，他在互联网上创建了个人网页，为心脑血管患者提供免费专业咨询，另一方面也使赵教授所在的医院提高了知名度，吸引更多的患者前来求医"],["C","某大型家电生产企业开办了自己的网站，消费者在使用该企业所生产的家电的过程中遇到任何问题均可在网上留下地址和联系方式，该企业提供上门服务"],["D","近年来，有这样一种网站在互联网上悄然兴起，任务发布者可以在网站上发布任务，并将任务奖金全额预付给该网站，从而吸引众多的网友参与任务，而网站将部分奖金支付给任务完成得最好的一位参与者"]],"a":["D"],"an":"第一步：抓住定义中的关键词。\n关键词包括“自己的智慧、知识、能力、经验”，“在互联网上体现经济价值”。\n第二步：逐一判断选项。\nA中网站提供的三十年的学术论文不是自己的，不符合关键词“自己的智慧、知识、能力、\n经验”，因此不属于威客或威客模式的网站；\nB中赵教授在网上提供的是免费服务，只是提高了知名度，经济价值是在现实生活中体现出\n来的，不符合关键词“在互联网上体现经济价值”，因此不属于威客或威客模式的网站；\nC中家电生产企业也没有在互联网上体现经济价值，不符合关键词“在互联网上体现经济价\n值”，因此不属于威客或威客模式的网站；\nD中网站的模式符合关键词，因此属于威客模式的网站。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0107","type":"single","t":"商业秘密指不为公众所知悉、能为权利人带来经济利益、具有实用性并经权利人采取保密措施的技术信息和经营信息。根据上述定义，下列属于商业秘密的是：","o":[["A","商场促销活动的细则"],["B","学校后勤集团的管理规定"],["C","天府饭店招牌菜东坡肉的秘方"],["D","动画制作的方法"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词强调“不为公众所知悉”、“经权利人采取保密措施的技术信息”。\n第二步：逐一判断选项。\nA、B、D项公众都可知悉，只有C项符合定义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0108","type":"single","t":"恐怖症是指病人对某种特定的客体或处境或与人交往时而发生强烈恐惧，并主动采取回避方式来解除这种焦虑不安。根据以上定义，下列属于恐怖症的是：","o":[["A","小红从小就怕虫子，一见到虫子就躲到父母身后，现在小红已经20岁了，仍然怕虫子，一见到都会尖叫跳起"],["B","建筑工人小张一次从高的围栏上摔下，造成骨折。好了之后他一直害怕到高的地方并因此换了工作。并将家搬到了一楼，就连看电视也不敢看有关高空作业的节目"],["C","于艳艳特别怕黑，快到天黑，她就得赶紧回家，除非到灯光较多的夜市区。如果需要在黑的地方，必须有人陪着她，她才敢去"],["D","刘柳是个非常内向的人，一见生人就脸红，要是异性就更严重，连话都说不出来了，所以他特别害怕到交际的场合，每逢单位组织活动他都紧张得不得了，汗都急出来"]],"a":["B"],"an":"第一步：抓住定义中的关键词\n关键词包括“强烈恐惧”，“主动采取回避方式”。\n第二步：逐一判断选项\nA项中小红虽然害怕虫子，但却没有出现焦虑不安的情绪，不符合关键词“强烈恐惧”，因此\n不属于恐怖症；\nB项中小张情况完全符合定义关键词，因此属于恐怖症；\nC项中于艳艳怕黑并没有体现出“主动采取回避方式”，因此不属于恐怖症；\nD项中刘柳害怕交际场合，但对此只是感到紧张，并没有回避单位组织的活动，不符合关键\n词“强烈恐惧”和“主动采取回避方式”，因此不属于恐怖症。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0109","type":"single","t":"物证是指能够证明案件真实情况的物质痕迹和物品。物证的特征是它的外形、质量、特性和所在的位置等，反映了某些案件事实，人们可以此来证明案件的事实真相。根据以上定义，下列属于物证的是：","o":[["A","高速公路上发生一起交通事故，交通警察勘测现场时拍摄的现场照片"],["B","在审理一起恶性的杀人案件中，因目击证人担心遭到报复，不愿出庭作证，而提供的记录证言的录音带"],["C","某地警方在打击盗窃机动车的行动中追缴回来的被盗车辆"],["D","根据警方在盗窃现场提取的指纹，鉴定人员所做的指纹鉴定报告"]],"a":["C"],"an":"第一步，找关键词。\n“物证是指能够在证明案件真实情况的物质痕迹和物品，最主要的是物证的自身属性可以反\n映了某些案件的事实。”\n第二步，逐一分析选项。\nA选项交通警察勘测现场时拍摄的现场照片，是在记录案发现场，是勘验笔录，排除；\nB选项录音带中记录的事证人的证词，所以不是物证，排除；\nC选项被盗车辆是可以反映被盗的事实，符合物证的定义，正确；\nD选项鉴定人员所做的鉴定报告是鉴定的结论，不是物证，排除。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0110","type":"single","t":"覆盖竞争：指在行业内部竞争已经十分激烈的阶段，行业外部的生产经营者强势介入该行业领域，导致业内竞争进一步加剧的现象。下列属于覆盖竞争的是：","o":[["A","从事电子产品设计与开发的某公司进入刚刚开始兴起的无人机研制领域"],["B","鉴于去年各个分公司的销售业绩都实现了快速增长，公司高层经研究决定今年再成立几家分公司"],["C","某房地产公司在市区中心地带的大型购物广场开业后，周边五六家大型商场的客流量明显减少"],["D","某汽车零部件销售商为了进一步满足客户需求，决定新增汽车维修保养业务"]],"a":["C"],"an":"第一步：找到定义关键词\n“行业内部竞争十分激烈”、“行业外部的生产经营者强势介入”、“业内竞争进一步加剧”\n第二步：逐一分析选项\nA项：刚刚开始兴起的无人机研制领域说明行业内部竞争并不激烈，不符合定义，排除；?\nB项：公司鉴于去年分公司销售业绩快速增长，决定再成立分公司并没有出现行业外部生产\n经营者的介入，不符合定义，排除；\n?C项：房地产公司介入商场行业符合行业外部的生产经营者强势介入，周边大型商场的客\n流量减少说明业内竞争进一步加剧，符合定义，当选；?\nD项：汽车零部件销售商新增汽车维修保养业务是为了近一步满足客户需求，并没有出现行\n业外部生产经营者的介入，不符合定义，排除；\n故正确答案为C。\n 第09关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0111","type":"single","t":"直觉思维是人脑对于突然出现的新问题、新事物和新现象，能迅速理解并做出判断的思维方式。下列不属于直觉思维的一项是：","o":[["A","古希腊学者阿基米德在浴缸中洗澡时发现了浮力定律"],["B","以某个问题为中心，从不同的方向和不同的角度，将思维指向这个中心"],["C","人类从昆虫的眼睛构成得到启示，研制了许多先进的夜视武器"],["D","达尔文在阅读马尔萨斯人口论著作时悟出“自然选择”理论"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“迅速理解并做出判断”。\n第二步：逐一判断选项。\nA中阿基米德洗澡时发现了浮力定律，C中人类根据昆虫的眼睛研制夜视武器，D中达尔文\n阅读著作时悟出“自然选择”理论，这三项明显都符合关键词，因此均属于直觉思维；\nB中从不同的方向和不同的角度，将思维指向某个问题，不符合关键词“迅速理解并做出判\n断”，实际是一种收敛性的思维特点，因此属于直觉思维。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0112","type":"single","t":"侵占罪是指以非法占有为目的，将为他人保管的财物或者其他遗忘物、埋藏物占为己有，数额较大且拒不交还的行为。根据以上定义，下面哪种行为是典型的侵占罪：","o":[["A","刘某的朋友张某到他家中做客，酒后张某将内有1.2万元人民币的手包忘在刘某的家中，返回寻找时刘某称未曾看到此包"],["B","某企业会计利用其经手公司财务的便利，将公司的一笔2万元的款项转借给其好友，但是好友由于生意不好而未归还"],["C","一位中年男子由于手头拮据，在一天晚上到其邻居家串门时，顺手拿走一条价值5000元的项链"],["D","王某几年前向朋友刘某借用1万元，多年来一直忘记归还"]],"a":["A"],"an":"第一步：抓住定义中关键词。\n定义的关键词有“非法占有为目的”、“将为他人保管的财物或者其他遗忘物、埋藏物占为己\n有占为己有”、“数额较大且拒不交还”。\n第二步：逐一判断选项。\nA项符合定义；\nB项“好友由于生意不好而未归还”不符合以非法占有为目的，排除B；\nC项“顺手拿走一条价值5000元的项链”不符合“为他人保管财物”，排除C；\nD项“多年来一直忘记归还”不符合“以非法占有为目的\"和“拒不交还”，排除D。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0113","type":"single","t":"社区作为社会生活的基本单位，是指一定数量居民组成的，具有内在互动关系与文化维系力的地域性的生活共同体。地域、人口、组织结构和文化是社区构成的基本要素。根据上述定义，下列属于社区的是：","o":[["A","某医院住院部的所有病人"],["B","具有多个地方办事处的某行业协会"],["C","居住在某个自然村的所有农村居民"],["D","负责处理居民事务的某街道办事处"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词包括“一定数量居民”，“地域”，“组织结构和文化”。\n第二步：逐一判断选项。\nA项中医院住院部的所有病人不符合关键词“组织结构和文化”，因此不属于社区；\nB项中某行业协会不符合关键词“一定数量居民”，因此不属于社区；\nC项中自然村的所有农村居民完全符合关键词，因此属于社区；\nD项中街道办事处不符合关键词“一定数量居民”，因此不属于社区。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0114","type":"single","t":"欠税指纳税人因故超过税务机关核定的纳税期限，未缴或者少缴税款的行为。对欠税者税务机关除令其限期照章补缴所欠税款外，并从滞纳之日起，按日加收所欠税款的滞纳金。根据上述定义，下面情况属于欠税的一项是：","o":[["A","方利平开有一食品服务小商店，税务部门规定对他的税款实行查账征收。当有大笔买卖时，他就将发票撕下来，将存根联和客户联单独填写数字，客户联按实际发生金额填写，而存根联上一般填写很小的数值"],["B","某电脑公司在出售个人家用电脑时，如果是私人买电脑，他们就给买主开一张自己印的收据；当买主是某单位或集体时，就开一张正式的发票"],["C","李霖是一外地来的民工，在给别人打了两年工的基础上，他发现目前装修房屋是个消费热点，于是他就联合了几个民工成立了一个装修队，哪里有人要装修房屋就到哪里干。由于他们是流动的，税务和工商部门很难对他们进行管理，没有办法让他们缴纳税款"],["D","某先生在一次有奖活动中运气非常好，一下中了头奖，奖品是奥迪牌小轿车一辆，他将小汽车以30万元人民币卖掉了，并将售车的款项全部存入了个人的账户"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n关键词强调“纳税人因故超过核定的纳税期限”，“未缴或者少缴税款”。\n第二步：逐一判断选项。\nA项和B项中的行为是少缴税款的行为，但他们并没有“因故超过核定的纳税期限”，其行为\n均属于偷税、漏税，而不是欠税；\nC项中民工们是流动性的，所以他们不能“在纳税期限内”“上缴、缴全他们的税款”，所以他\n们未缴纳的税款属于欠税；\nD项中某先生在领取奖品时，国家已经针对奖品收过税了，所以他卖汽车的钱不用被重复征\n税，不涉及欠税。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0115","type":"single","t":"场依存性是指人对物体的知觉倾向于把外部参照作为信息加工的依据，难以摆脱环境因素的影响。他们的态度和自我知觉更易受周围的人，特别是权威人士的影响和干扰，善于察言观色，注意并记忆言语信息中的社会内容。根据上述定义，下列属于场依存性的是：","o":[["A","具备独立自主的学习能力"],["B","对于他人的评价有自己的看法"],["C","做事情由内在动机支配"],["D","做事情由外在动机支配"]],"a":["D"],"an":"第一步：关键词查找。\n场依存性的定义条件包括：“把外部信息作为信息加工依据”、“难以摆脱外部环境的影响”。\n第二步：逐一分析选项。\nA、B、C三项均属于场独立性，A项强调的是独立自主的学习能力，B项有自己的看法，均\n不符合条件。\nC项内在动机也不同于外部环境，故排除，D项强调外在动机支配与外部环境影响，与定义\n相符。\n故正确答案为D。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0116","type":"single","t":"法是反映统治阶级意志的，由国家制定或认可并以国家强制力保证实施的行为规则的总称。下列表述正确的一项是：","o":[["A","法在本质上是社会成员公共意志的体现"],["B","法既执行政治职能，也执行社会公共职能"],["C","法最终决定于历史传统、风俗习惯、国家结构"],["D","法不受客观规律的影响"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n关键词包括“统治阶级意志”，“行为规则”。\n第二步：逐一判断选项。\nA中法是社会成员公共意志的体现，这是错误的，因为法反映的是统治阶级的意志，因此A\n项错误；\nB项从题干对法的定义可知，该说法是正确的，因此B项正确；\nC中的“历史传统、风俗习惯、国家结构”无法从题干得知，因此C项错误；\nD中说法明显不正确，因此D项错误。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0117","type":"single","t":"可更新资源是指能够通过自然力以某一增长率保持或增加蕴藏量的自然资源，如太阳能、大气、水等，当代人消费的数量不会便后代人消费的数量减少；又如森林、各种野生动植物等，不人为破坏基本上保持稳定。根据上述定义，下列说法正确的是：","o":[["A","风吹绿了草原，草原是可更新资源"],["B","煤由太阳能转化而形成，因此是可更新资源"],["C","很多金属机械报废后可以回收，因此是可更新资源"],["D","地球上的淡水资浑已经非常稀少，属于不可更新资源"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n关键词强调“通过自然力”、“当代人消费”不会影响“后代人消费”。\n第二步：逐一判断选项。\nA项中的草原能通过自然力以某一增长率保持或增加蕴含量，并且当代人的消费不会影响后\n代人的消费；\nB项中的煤和C项中的金属使用完后需要很长的地质作用才能再生成，现在对其的消费，必\n定会使后世无法再使用，因而属于不可再生资源；\nD项淡水可以通过大气循环和水循环转化，属于可更新资源。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0118","type":"single","t":"军事上的电子欺骗指的是利用电子设备对己方的相关信息进行伪装或者虚假模拟，欺骗敌方的电子侦察，使敌方对己方部署、作战能力和作战企图等产生错误判断，从而达到迷惑和扰乱敌方的目的。根据上述定义，下列涉及电子欺骗的是：","o":[["A","军事演习时蓝军故意丢失伪造的电子作战地图，佯装泄露己方情报"],["B","某国将无人机藏匿于敌国领空，冒充敌国领导人编制、发布虚假命令"],["C","二战中盟军虚设了一个司令部，用通讯设备源源不断地发送各种“指挥命令”"],["D","驻扎在太平洋小岛的某部为其计算机系统设置了数量庞大的仿真数据库"]],"a":["C"],"an":"第一步：抓住定义中的关键词。定义的关键词有“对己方的相关信息进行伪装或者\n虚假模拟”“欺骗敌方的电子侦察”。第二步：逐一判断选项。A项“故意丢失”“佯装泄露己方\n情报”没有体现“欺骗敌方的电子侦察”，不符合定义；B项“冒充敌国领导人编制、发布虚假\n命令”不符合“对己方的相关信息进行伪装或虚假模拟”，不符合定义；C项“虚设了一个司令\n部，用通讯设备源源不断地发送各种‘指挥命令’”体现了定义中的“对己方的相关信息进行伪\n装或者虚假模拟”“欺骗敌方的电子侦察”，符合定义；D项“设置了数量庞大的仿真数据库”\n没有体现“欺骗敌方的电子侦察”，不符合定义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0119","type":"single","t":"隐域性是指自然地理现象在受到局部的地形、水文、土壤、气流、洋流、季风等因素的影响下，在地球表面不按或偏离纬向地带性规律分布的特性，它使地带性分布规律变得不鲜明，使自然环境变得更具复杂性与多样性。以下属于隐域性分布的是：","o":[["A","关汉卿《窦娥冤》中描写的“六月飞雪”"],["B","余秋雨所描写的丝绸之路上的“月牙泉”"],["C","岑参在诗中所描述的“北风卷地白草折”"],["D","电影《木乃伊归来》中所出现的大沙漠"]],"a":["B"],"an":"第一步：抓住定义中的关键词。主体：自然地理现象；条件：受到局部的地形、水\n文、土壤等因素的影响；结果：使地带性分布规律不鲜明，使自然环境变得更复杂更多样。\n第二步，逐一判断选项。A项“六月飞雪”是小说中的虚构现象，非地理现象，主体关键词不\n符合；B项“月牙泉”是沙漠中的奇妙景观，符合特殊自然环境导致的复杂性和多样性的特征，\n符合定义；C项“北风卷地白草折”是气候现象，不符合主体关键词；D项“大沙漠”是符合地\n带性规律分布的地貌，不符合结果关键词。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0120","type":"single","t":"公民的基本权利可分为积极权利和消极权利。积极权利是指通过国家积极介入保障公民在社会经济生活领域的权利，是要求国家积极作为的权利。消极权利即自由权，是要求排除国家妨害、国家相应不作为的权利。根据上述定义，下列选项属于积极权利范畴的是：","o":[["A","董事长不得借助权力剥夺股东的股权"],["B","国家为满足低收入者需要建设保障房"],["C","盲、聋、哑人员应依法列入选民名单"],["D","每一位公民都有不受非法逮捕的权利"]],"a":["B"],"an":"第一步：判断考查的定义。题目考查的“积极权利”。第二步：抓住定义中的关键词。\n积极权利的定义包含的重点关键词是“国家”、“社会经济生活领域”和“作为”。第三步：逐一\n判断选项。A项主体并非“国家”，不符合定义；B项主体国家，保障公民生活方面的权利，\n符合定义；C项中选举权属于政治领域，不属于“社会经济生活领域”不符合定义；D项应该\n让国家不主动介入，是消极权利。\n故正确答案为B。\n 第10关","tp":"定义判断","d":"中"},
	{"i":"fjcs_0121","type":"single","t":"分配性正义就是在分配领域的公平，指依据一定的标准公平地分配对象物、合理地取得被分配物，即“得其所应得”，它是正义在分配领域的体现。根据以上定义，下列不属于分配性正义获得的是：","o":[["A","甲因加班时间比乙长而获得更多的工资"],["B","在三人组成的创业团队中，甲因为投资更多获得更多的收益"],["C","某公司所有职员对同一项目都有相同的机会去工作以获得收益"],["D","救灾中老人和儿童优先被分得食物和水"]],"a":["C"],"an":"第一步：关键词查找。\n分配性正义的定义条件包括：“依据标准公平地分配”。\n第二步：逐一分析选项。\nA选项：甲因加班时间比乙长而获得更多的工资，符合定义，多劳多得，得其所应得；\nB选项：在三人组成的创业团队中，甲因为投资更多获得更多的收益，投资大收益就大，得\n其所应得，符合定义关键词；\nC选项：某公司所有职员对同一项目都有相同的机会去工作以获得收益，相同的机会不属于\n分配行为，不符合定义关键词；\nD选项：救灾中老人和儿童优先被分得食物和水，老弱病残优先，符合定义关键词。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0122","type":"single","t":"农超对接是指农户和商家签订意向性协议书，由农户向超市、菜市场和便民店直供农产品的新型流通方式，主要是为优质农产品进入超市搭建平台。农超对接的本质是将现代流通方式引向广阔农村，将千家万户的小生产与千变万化的大市场对接起来，构建市场经济条件下的产销一体化链条，实现商家、农民、消费者共赢。根据上述定义，下列哪项属于农超对接的作用：","o":[["A","市场需要什么，农民就生产什么，避免生产的盲目性"],["B","减少流通环节，降低流通成本"],["C","有利于降低农产品的生产成本"],["D","稳定农产品销售渠道和价格"]],"a":["B"],"an":"第一步：找到定义关键词。\n“农超对接的关键词是一种流通方式”。\n第二步：逐一判断选项。\nA项对应生产环节；\nB项对应流通环节；\nC项对应生产环节；\nD项对应销售环节。\n只有B项和定义相关，同属于流通环节。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0123","type":"single","t":"心理暗示，是指人或环境以非常自然的方式向个体发出信息个体无意中接受这种信息，从而做出相应反应的一种心理现象。根据定义，不会给人带来心理暗示的是","o":[["A","谢谢你昨晚的帮助，你真是太棒了。"],["B","四环的这段路总是出交通事故。"],["C","请勿携带食物和饮料进入本商店"],["D","不怕啊，不怕啊，摸摸毛，吓不着。"]],"a":["C"],"an":"第一步，提取定义关键词句。\n“人或环境自然的向个体发出信息“ “个体无意中接受这种信息” “做出相应反应”\n第二步，逐一分析选项。\nC项存在明显错误，请勿携带食物和饮料进入本商店，是明确规定，并不是暗示，个体也不\n需要无意中接收，不符合定义；A、B、D三项均满足定义关键词，符合定义。\n本题为选非题，故正确答案为C。","tp":"定义判断","d":"中"},
