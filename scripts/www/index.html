	{"i":"fjcs_0801","type":"single","t":"自白任意性规则是指只有基于犯罪嫌疑人自由意志而作出的、承认有罪的真实陈述，才具有证据能力。根据上述定义，下列符合自白任意性规则做法的是()","o":[["A","为避免犯罪嫌疑人有做出虚假陈述，应中止讯问"],["B","犯罪嫌疑的有罪陈述须与收集到的证据材料一致"],["C","犯罪嫌疑人主张自己无罪，可以不承担举证责任"],["D","以从轻处罚为条件，换取犯罪嫌疑人的有罪答辩"]],"a":["C"],"an":"关键词是自由意志。A选项提出终止询问，B选项提到材料一致，D选项从轻发落，C选项提到个人主张这种自由意志。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0802","type":"single","t":"印记学习是指发生在动物生活的早期阶段、由直接印象形成的学习行为，印记学习行为虽发生在早期，但对晚期行为也具有一定影响。根据上述定义，下列不属于印记学习行为的是()","o":[["A","绵羊走近并试图留在喂养过它的主人身边"],["B","由人喂养大的斑马雀会向主人的手指求偶"],["C","母羊用舌舐小羊的方式来标记自己的后代"],["D","刚出生的绿头鸭跟随着一个移动的物体走"]],"a":["C"],"an":"印记学习发生在动物活动的早期阶段，A、B、D三项都是动物在早期形成了一种印象或者习惯，继而影响到现在的行为。C项行为的主体是母羊，而它舔小羊的行为并不是在它早期由直接印象形成的学习行为。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0803","type":"single","t":"农产品补贴通常是指一国政府对本国的农业产品生产商或者经营者提供资金或财政上的支持，包括现金补贴、价格支持或其他政策优惠待遇，使其农业产品在国际、国内市场上与未受补贴的同类产品相比获得竞争优势。根据上述定义，下列属于农产品补贴的是()","o":[["A","甲地区主要是草原，由于过度放牧导致草场退化。国家政府根据该地区的情况，发放牧民8~10年的补贴，请他们减少饲养的禽畜，这导致市场上的牛羊肉价格升高了"],["B","某国政府为农民和水稻研究所牵线搭桥，使该国农民种植了新品种水稻。该种水稻的质量和产量大幅度提升，使得该国水稻出口价格与国际市场上的水稻相差无几"],["C","为了稳定农产品价格，某市政府除对农贸市场经营者的摊位租金实行减免政策外，还规定若摊位租金低于限定数额，可以向经营者发放10%~40%不等的补贴"],["D","甲国市场上，政府以高于国际市场价格收购农民种植的玉米，再低价售出，以鼓励农民种植玉米。该国某企业利用玉米作为主要饲料培育肉鸡，再大量出口到乙国"]],"a":["D"],"an":"A项中国家给的补贴是为了保护草场，并非为农产品；B项中没有“提供资金或财政上的支持”；C项中主体不符，某市政府不能代表国家；D项中政府高价回收玉米就是对该农产品的补贴。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0804","type":"single","t":"有些产品的精心设计使产品方便高效，能给客户带来舒适感，使用时不用阅读复杂的说明或是求助他人。而有些产品恰恰相反，它们的设计没有考虑用户的使用习惯和需要，因而使人们在使用过程中会遇到困难或者迷惑不解的情况，这类产品被人们称为诺曼产品。根据上述定义，下列属于诺曼产品的是()","o":[["A","某品牌木制大衣柜的底部滑轮质量较差，用户很难将门拉开"],["B","某款网络游戏很难通关，很多玩家在网上求助怎样破解其中的关卡"],["C","汽车收音机按钮和其他设备开关的形状、大小都一样，用户很难分辨哪个是收音机按钮"],["D","某科技公司的精密实验设备附有300页的说明书，一般人觉得里面术语太多，很难读懂"]],"a":["C"],"an":"定义的核心是“产品的设计没有考虑用户的习惯和需要，造成使用上的不便”。A项是质量问题；B项是游戏难度的设置，并没有造成使用的不便；D项说明书并不是产品本身；C项符合。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0805","type":"single","t":"调查显示，59.4%的公众感觉当前社会“逆淘汰”现象普遍。所谓“逆淘汰”，简言之，即指坏的淘汰好的，劣质的淘汰优质的，平庸的淘汰杰出的等现象。根据上述定义，下列属于逆淘汰现象的是()","o":[["A","某公司拥有领先的卫星通话技术，语音质量高，覆盖范围广，但该技术的维持费用高昂。后来该公司入不敷出，宣告破产"],["B","市场上某些价格高昂的止咳药疗效实际不如价格低廉的常用药，而事实上常用药所占市场份额较小"],["C","许多公司都有对工作发牢骚的人，结果，凡是公司中有对工作发牢骚的人，那家公司一定比没有这种人的公司要成功得多"],["D","名牌大学毕业的甲和普通大学毕业的乙同时进入某国际知名公司，但甲始终未获提升，乙却逐渐得到了公司的认可"]],"a":["B"],"an":"A项中的领先的卫星通话技术费用昂贵而没有获得市场优势，说明自身存在不足，不能说是“劣质的淘汰了优质的”；B项价格高的药占据了大部分市场，而疗效却不如常用药，属于典型的“平庸的淘汰杰出的”情况。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0806","type":"single","t":"逆向服务是在产品(服务)销售以后，企业向顾客提供实现产品(服务)使用价值的服务。根据上述定义，下列不属于逆向服务的是()","o":[["A","某电信运营商推出“存话费送手机”的优惠活动"],["B","某空调生产商为客户提供终身免费上门维修服务"],["C","某网店推出售后商品7天内可免费退、换货服务"],["D","汽车4S店为客户提供二手车估价、转让服务"]],"a":["A"],"an":"关键信息是“产品(服务)销售以后”提供服务，A项是在销售的同时赠送，不符合定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0807","type":"single","t":"心理契约是指个体与组织之间隐含的明文规定的双方各自的责任及对对方的期望。根据上述定义，下列属于建立心理契约的措施是()","o":[["A","为提高员工积极性，每月业绩最好者能享受双薪"],["B","为解决员工后顾之忧，与优秀员工签订终身合同"],["C","为吸引优秀人才，承诺为员工提供购房免息借款"],["D","结合企业的发展蓝图，为员工提供职业生涯设计"]],"a":["D"],"an":"心理契约的一个重要特点是“没有明文规定”。A、B、C项都属于明示的、双方明确约定的情况。D项通过为员工提供职业生涯设计，使员工与企业发展结合在一起，符合定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0808","type":"single","t":"政策性亏损是指为保证国民经济的协调发展和人民生活的安定，企业在实现政府规定的社会公益服务目标，生产经营某种商品的过程中，由于国家限价等原因而产生的亏损。发生这类亏损，由财政部门审核后给予合理补偿。根据上述定义，下列属于政策性亏损的是()","o":[["A","2012年，某粮食直补每亩增至120元，补贴资金将通过“省财政涉农补贴一本通”发放到种粮农民手中，以弥补农民增加的种粮成本"],["B","国家出台提高小麦最低收购保护价政策，某粮油企业为开拓市场大量抢购小麦，又将大量面粉低于市场价销售，因此造成了亏损"],["C","政府为实现农业现代化的目标，加大了对农业生产改造的资金投入，某农机企业在这种形势下扩大生产规模导致了亏损，得到了退税补偿"],["D","某县的粮食购销企业在经营政府规定的平价粮油过程中，因国家粮食保护价高但粮油成品销售价格低导致了亏损，财政部门给予了定额补贴"]],"a":["D"],"an":"定义可以简单概括为“企业为了配合政策公益目标造成亏损，政府财政予以补贴”。D项符合这一定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0809","type":"single","t":"自我建构指个体通过行为表现表明自己符合在他人心目中的已经建立起来的社会身份或社会形象。根据上述定义，下列属于自我建构的是()","o":[["A","16岁的女孩欢欢经常模仿话剧团演员的表演并像他们一样早起练功，她自己希望以后也成为一名话剧演员"],["B","某公司创立之初就定下服务社会的企业使命，后来在偏远山区建立多所希望小学，树立了公司热心于社会公益事业的良好形象"],["C","一些企业家经常穿着昂贵的西装，坐豪华轿车，有些人认为这是“炫富”，但他们认为如果不是这样，就不会得到同行的认可"],["D","不同航空公司要求本公司的空中乘务员穿着不同的制服，他们认为员工形象会影响到公司在旅客心中的形象"]],"a":["C"],"an":"A项不存在已经建立的社会身份或社会形象；B项是通过行为树立了形象，并非为了符合已经建立的形象；D项员工形象会影响公司在旅客心中的形象，并非符合已经在旅客心中建构的形象；C项企业家通过穿西装、坐豪车来表明自己符合在同行心中的形象，符合定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0810","type":"single","t":"威客模式是指一些人通过互联网把自己的智慧、知识、能力、经验转换成实际收益，他们在互联网上通过解决科学、技术、工作、生活、学习中的问题从而让知识、经验、技能产生经济价值。根据上述定义，下列属于威客模式的是()","o":[["A","某高校学生建立的免费回答中小学生学习问题的公益网站受到了学生和家长的好评，当地一家教育机构出资赞助扩大这个网站的规模，以帮助更多的学生"],["B","某IT技术人员用业余时间开了一个小公司，主要在网络远程帮助他人修理电脑"],["C","某大学毕业生在一个B2C网站上开了一家服装店，运用自己的人脉资源使网店很快就开始盈利"],["D","某摄影师个人网站上的摄影作品吸引了大批网友浏览、转发，后来该摄影师依靠在该网站上发布摄影器材广告带来大量收入"]],"a":["B"],"an":"A项为公益性质，并没有产生经济价值；C项和D项只是借助网络平台，而并不是将自己的智慧、知识、能力、经验直接转化为经济收益；B项属于利用网络，是自己的技术直接转化为经济收益。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0811","type":"single","t":"平静:讲述()","o":[["A","欣喜:接受"],["B","愤怒:言论"],["C","悲哀:哀乐"],["D","快乐:行为"]],"a":["A"],"an":"本题考查语法关系，前者可以修饰后者，平静地讲述，且后者为动词。欣喜地接受符合。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0812","type":"single","t":"军队:命令()","o":[["A","乐队:指挥"],["B","游客:向导"],["C","志愿者:号召"],["D","学生:教导"]],"a":["A"],"an":"军队必须绝对服从命令，乐队必须绝对服从指挥。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0813","type":"single","t":"兴趣:索然无味()","o":[["A","知识:不学无术"],["B","误会:善解人意"],["C","骨气:卑躬屈膝"],["D","礼貌:盛气凌人"]],"a":["C"],"an":"索然无味是指没有兴趣，卑躬屈膝是指没有骨气。两者均为反义关系。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0814","type":"single","t":"软件:程序员:编写()","o":[["A","木头:木匠:打制"],["B","渔网:渔民:编织"],["C","车票:乘客:购买"],["D","麦克风:歌手:唱歌"]],"a":["B"],"an":"程序员编写软件，渔民编织渔网。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0815","type":"single","t":"()对于湿地相当于稀土对于()","o":[["A","候鸟:工业"],["B","生态:资源"],["C","雨水:黄金"],["D","沼泽:矿产"]],"a":["D"],"an":"沼泽是一种湿地，稀土是一种矿产。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0816","type":"single","t":"文字:剧本:话剧()","o":[["A","水:水果:果汁"],["B","叶子:植物:中药"],["C","字母:键盘:文章"],["D","音符:乐谱:歌曲"]],"a":["D"],"an":"由文字组成剧本，根据剧本编排话剧；由音符组成乐谱，根据乐谱演唱歌曲。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0817","type":"single","t":"地理:自然地理:经济地理()","o":[["A","城市:居民区:商业区"],["B","卫星:遥感:雷达"],["C","糖果:水果糖:芝麻糖"],["D","单位:千米:公里"]],"a":["C"],"an":"自然地理与经济地理为并列关系，同属地理；水果糖与芝麻糖为并列关系，同属糖果。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0818","type":"single","t":"()对于家具相当于花岗岩对于()","o":[["A","书桌:石膏"],["B","家电:岩石"],["C","木材:雕塑"],["D","房间:石矿"]],"a":["C"],"an":"家具的一种原材料是木材，雕塑的一种原材料是花岗岩。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0819","type":"single","t":"()对于领航相当于规则对于()","o":[["A","航班:选手"],["B","航标:犯规"],["C","导航:比赛"],["D","航线:裁判"]],"a":["D"],"an":"根据航线进行领航，根据规则进行裁判。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0820","type":"single","t":"邮局对于()相当于()对于网购","o":[["A","快递:网店"],["B","邮政:网银"],["C","电子邮件:百货商场"],["D","驿站:网站"]],"a":["C"],"an":"使用电子邮件可以代替去邮局发信，网购可以代替百货商场购物。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0821","type":"single","t":"传播媒介拥有不可抵抗的强大力量，它们所传递的信息在受传者身上就像子弹击中身体、药剂注入皮肤一样，受众完全处于被动的地位，消极地等待和接受媒介所灌输的各种思想、感情、知识，受众的性格差异对大众传媒提供的信息产生的反应可以忽略不计。如果以下各项为真，最能削弱上述观点的是()","o":[["A","人对某种特定刺激就必然会引起某种特定反应"],["B","坚持读者需求导向并不能为受众创造最大利益"],["C","社会对电视节目庸俗化倾向普遍存在担忧心理"],["D","取消电影分级制度并未影响其观众的数量和构成"]],"a":["C"],"an":"题干观点：传播媒介拥有不可抵抗的强大力量，受众完全处于被动的地位。C项“社会对电视节目庸俗化倾向普遍存在担忧心理”说明受众不是完全被动的接受，削弱了题干观点。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0822","type":"single","t":"科学家发现，儿童时期不接触细菌和病菌，是5岁以下人群糖尿病病例近年来急剧增加的主要原因之一。而那些生活在农村的孩子由于更早接触到带菌的物质，有更多机会与宠物相处，患过敏症、哮喘和湿疹等疾病的几率反而很低。所以，将细菌消灭得过于彻底的环境可能反而会给儿童的健康带来危害。以下哪项如果为真，将有力地支持上述结论？()","o":[["A","刚出生的婴儿，其体表和体内是无菌的，但开始吃奶、喝水后，细菌便乘机进入体内"],["B","人体皮肤上的细菌大多起保护作用，并为每个人制造出独特的体味"],["C","大部分细菌是有益于身体健康的，人的健康长寿离不开正常的菌群"],["D","很多有害细菌平时与人体相安无事，当人体免疫力下降时，细菌便开始侵害人体"]],"a":["C"],"an":"要支持的论点：彻底消灭细菌可能对健康有危害。C项人体健康离不开正常菌群，即彻底消灭细菌人体就不健康，对论点直接支持。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0823","type":"single","t":"所有的战争和混乱都是在没有协商、无理可讲的时候发生的，讲理和协商都离不开语言，然而，并非有语言的地方就自动会有说理，有语言的地方必须有自由才能有说理。由此可以推出()","o":[["A","所有的战争和混乱都是因为没有自由而发生的"],["B","并非所有的战争和混乱都是在不可以协商和不可以讲理的时候发生的"],["C","如果没有自由，不能讲理，就可能发生战争和混乱"],["D","有语言和自由的地方就一定不会发生战争"]],"a":["C"],"an":"翻译推理。战争和混乱→无协商无理，讲理协商→语言，说理→语言且自由。C项：无自由→无理，无理推不出必然有战争，但可能有战争，正确。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0824","type":"single","t":"2亿年前，在恐龙统治地球之时，一小撮夜行性的远古爬行动物在不知不觉中找到了一条生存策略，并最终走向了大脑的进化之路。科学家从与原始哺乳动物极其类似的远古爬行动物的头骨化石中得出结论，正是嗅觉的发展促进了远古爬行动物大脑的进化。以下哪项如果为真，最能支持上述结论？()","o":[["A","许多早期哺乳动物由于自然选择进化出了更小的身体，而它们的脑却未能按比例缩小"],["B","研究人员分析了爬行动物犬齿龙类化石，其与早期哺乳动物摩根兽亲缘关系很近，但摩根兽的大脑比犬齿龙要大一半，其中处理嗅觉的区域明显增大"],["C","早期夜行性哺乳动物进化出更大的脑是为了促进它们的听觉，因为视觉在夜晚并不能起到很大作用"],["D","研究表明，与现存哺乳动物关系最近的巨颅兽，其大脑容量和鼻腔所占空间都要比早期爬行动物大一些"]],"a":["B"],"an":"论点为嗅觉的发展促进了远古爬行动物的进化。B项对比了进化程度较高的哺乳动物的大脑容量和嗅觉的区域，支持了论点。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0825","type":"single","t":"某单位每逢年底会针对全体员工进行评优，评优奖项有5个，分别是最佳敬业奖、最佳创意奖、最佳协作奖、最佳写作奖，年度明星奖。其中如果评选了年度明星奖则不能再评选最佳创意奖和最佳敬业奖；如果评选了协作奖就不能再获得写作奖；如果评选了敬业奖，则不能再获得协作奖。每个人最多获得两个奖项。综合科一共3位员工，揽括了所有奖项，每个人都获奖，但是奖项各不相同。已知员工甲获得了明星奖，员工乙和员工丙二人之间有人获得了写作奖。由此可知，下列推测一定正确的是()","o":[["A","如果乙获得了写作奖，则其还获得敬业奖"],["B","如果乙获得了协作奖，则乙和丙各获得两个奖项"],["C","如果乙获得了写作奖和创意奖，则甲一定只获得一个奖项"],["D","如果丙获得了协作奖，则乙一定不能获得敬业奖"]],"a":["B"],"an":"翻译推理。明星→非创意且非敬业；协作→非写作；敬业→非协作。B项中说乙获得协作奖，则不能获得写作奖，并且不能获得敬业奖，丙一定获得了写作奖，甲获得了明星奖，不能获得创意和敬业奖，也不能获得协作奖和写作奖。甲只能获得一个奖项，乙丙都能获得2个奖项。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0826","type":"single","t":"研究人员在正常的海水和包含两倍二氧化碳浓度的海水中分别培育了某种鱼苗。鱼苗长大后被放入一个迷宫。每当遇到障碍物时，在正常海水中孵化的鱼都会选择正确的方向避开。然而那些在高二氧化碳浓度下孵化的鱼却会随机地选择向左转或向右转，这样，这种鱼遇到天敌时生存机会减少。因此，研究人员认为在高二氧化碳环境中孵化的鱼，生存的能力将会减弱。以下哪项如果为真，不能支持该项结论？()","o":[["A","人类燃烧化石燃料产生的二氧化碳大约有三分之一都被地球上的海洋吸收了，这使得海水逐渐酸化，会软化海洋生物的外壳和骨骼"],["B","在二氧化碳含量高的海洋区域，氧气含量较低。氧气少使海洋生物呼吸困难，觅食、躲避掠食者以及繁衍后代也变得更加困难"],["C","二氧化碳是很多海洋植物的重要营养物质，它们在光照下把叶子吸收的二氧化碳和根部输送来的水分转变为糖、淀粉以及氧气"],["D","将小丑鱼幼鱼放在二氧化碳浓度较高的海水中饲养，并播放天敌发出的声音，结果这组小鱼听不到声音"]],"a":["C"],"an":"要支持的论点：高二氧化碳环境中孵化的鱼，生存能力较弱。A、B、D都加强了论点，C项二氧化碳会转化成淀粉氧气，有利于生存，对论点是削弱。不能支持的是C项。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0827","type":"single","t":"传统观点认为，尽管用于制造贫铀弹所使用的贫铀放射性低，仍会导致人类染色体受损，从而引发肿瘤或癌症。但是，在最近的一项研究中，研究人员对接触过贫铀弹的退伍老兵的血细胞进行研究，到目前为止，还没有检测到任何染色体断裂和重复，并没有发现任何由于接触贫铀弹而造成的负面健康影响。因此相关研究人员认为，放射性低的贫铀弹不会对人类的健康造成影响。以下哪项如果为真，最能削弱研究人员的结论？()","o":[["A","某地居民向法院起诉，声称该国军队试验贫铀弹，已影响该地居民健康"],["B","世界上很多国家的专家都在致力于解决贫铀弹的放射性问题"],["C","有数据显示，这些退伍老兵的后代患有先天性缺陷的比率高于正常值"],["D","没有接触过贫铀弹的人也会患有肿瘤或癌症"]],"a":["C"],"an":"要削弱的论点：放射性低的贫铀弹不会影响健康。论据是对退伍老兵的体检未检测出负面影响。C项有数据显示这些退伍老兵的后代患有先天性缺陷的比率高于正常值，直接削弱了结论。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0828","type":"single","t":"科学家们认为，梦是大脑中主管人体各种功能的各个中心点联合作用的结果。人在睡眠时其部分脑细胞仍然在活动着，这就是梦的基础。最近的研究成果证实，做梦不仅不会影响人的睡眠和健康，而且还是保护大脑健康所必需的生理活动之一。以下哪项如果为真，最能支持上述结论？()","o":[["A","根据问卷分析，长期不做梦的人比经常做梦者所需的睡眠时间更长，在休息后有一半人仍会感到疲倦"],["B","实验中，研究人员在睡眠者出现做梦的脑电波时，就立即将其阻断，结果发现被试的血压和体温明显增高"],["C","研究中，梦境被打扰的被试在醒来后显得焦虑不安，容易紧张，并出现记忆的短期障碍"],["D","调查显示，能完整讲述梦境的被试相比遗忘梦境者，在工作中更能快速集中注意力，从而工作效率更高"]],"a":["A"],"an":"论点为：睡眠不会影响健康，反而会保护大脑健康。A项直接给出现象，长期不做梦的人睡醒后仍然会感到疲惫，说明做梦对健康有益。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0829","type":"single","t":"树木枝干和许多植物的茎秆通常含有大量难以分解的木质素，因此利用它们来提炼生物燃料的效率会大打折扣。目前，人们发现了一种名为红球菌的细菌。它具有分解木头和其他植物中木质素的能力，因此，人们认为可以将红球菌广泛用于以往大都废弃的茎秆，从而大大提高生物燃料的利用率。以下哪项如果为真，最能支持上述结论？()","o":[["A","红球菌能分泌一种酶，这种酶具有分解木质素的能力，但其分泌能力呈现周期性变化"],["B","一些真菌也具有分解木质素的能力，研究发现，这些真菌的生长需要特定的温度和湿度"],["C","红球菌易于培养，目前对红球菌已完成基因测序，因此可以利用红球菌大规模地生产分解木质素的酶"],["D","木质素是一种优质高分子材料，迄今为止，超过95%的木质素都是直接排入江河或浓缩烧掉，很少有效利用"]],"a":["C"],"an":"论点为红球菌能够提高生物燃料的利用率。C项说红球菌易于培养且可以大规模生产分解木质素的酶，支持了结论。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0830","type":"single","t":"富裕起来的这一代中国父母，仍然处在家庭教育的“初级阶段”内，习惯于用物质欲望的满足、用金钱砸下的“抢跑”来帮助孩子“赢在起跑线上”，用不肯放手来表达自己对孩子的爱、对教育的重视。快乐对于单纯的孩子而言，实在是很简单的事。有爱心的父母，没有那么多期望与要求，放下怀抱的焦虑感，单纯地和孩子在一起，为他们营造一个更安全的环境，一起度过快乐美好的一天。由此可以推出()","o":[["A","关心孩子会给孩子带来比金钱更多的快乐"],["B","让孩子“赢在起跑线上”是一种错误的想法"],["C","满足孩子的物质欲望也是爱孩子的一种方式"],["D","孩子希望父母陪伴而不是把他们送进补习班"]],"a":["D"],"an":"题干中表达了父母对孩子的教育，两种不同的方式都进行了表述，但是并没有进行比较，只有D项能够推出。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0831","type":"single","t":"一般地说，“智慧”不同于“知识”的最大特点在于“智慧”具有原创性。“知识”要求“广”，“智慧”要求“新”。但两者又非绝对;“智慧”必须有“知识”作基础，反之，只死读书，而无己见，无创意，那就容易成为，也不算是“智慧”。","o":[["A","对立学究"],["B","矛盾古董"],["C","等同桎梏"],["D","排斥束缚"]],"a":["A"],"an":"第二空应填入一个名词，“束缚”是动词，排除D。“死读书、无己见、无创意”与第二空构成解释关系，与此最相符的为“学究”。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0832","type":"single","t":"文学解读和批评可以是感性的、印象式的，也可以是理性的和高度理论化的。文学不是用单纯的社会学方法可以的，就像心灵不能用此时此刻或彼时彼刻的一孔之见来一概而论。","o":[["A","可见一斑"],["B","一览无余"],["C","明察秋毫"],["D","拨云见雾"]],"a":["B"],"an":"“一览无余”形容事物很简单，一下子就能看清楚，符合语境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0833","type":"single","t":"幸福有没有标准?我认为，现实生活离不开比较，但是幸福的比拼，本身就是比较的事情。幸福耐不住人家打扰，经不起科学研究，当幸福成为指数，成为概念，成为一批标准时，也就变得了。","o":[["A","混乱 一文不值"],["B","私密 可有可无"],["C","模糊 无足轻重"],["D","荒诞 遥不可及"]],"a":["D"],"an":"第一空填“荒诞”，第二空填“遥不可及”符合语境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0834","type":"single","t":"周敦颐通过自己的努力，丰富和发展了儒家思想理论体系，开拓了儒学发展的新境界，使之一扫魏晋南北朝及隋唐五代的，回归到原有的正统地位，赢得了与释、道竞争的全面胜利，取得了意识形态的主导权。","o":[["A","独树一帜 弊端"],["B","柳暗花明 萧条"],["C","脱胎换骨 落寞"],["D","焕然一新 颓势"]],"a":["D"],"an":"“一扫颓势”为固定搭配，且“焕然一新”也与“新境界”对应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0835","type":"single","t":"托尔斯泰创造了小说艺术的巅峰，他能把拿破仑进军俄国的战争史诗般场面驾驭自如，能把安娜的人性刻画得。像这样的大手笔再也没有了。","o":[["A","惟妙惟肖"],["B","妙笔生花"],["C","入木三分"],["D","鬼斧神工"]],"a":["C"],"an":"对人性的刻画，用“入木三分”最合适。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0836","type":"single","t":"近年来，网络阅读、手机阅读并存的多元化阅读方式，带来了铺天盖地的。这在人们知识面的同时，也使得以快餐式、跳跃性、碎片化为特征的“浅阅读”取代了“深阅读”。","o":[["A","资讯 拓展"],["B","信息 延伸"],["C","新闻 扩大"],["D","内容 开拓"]],"a":["A"],"an":"第一空填“资讯”，第二空填“拓展”搭配恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0837","type":"single","t":"灾难性事件往往以突发的方式出现，给个人与社会造成巨大的破坏和影响。灾难的突发性决定了报道的是第一位的。最快的时间、最新的报道，才能满足人们在灾难发生后对的迫切需求和思想混乱时的心理需求。能否快速地投入新闻报道成为决定此类新闻报道能否成功的关键。","o":[["A","内容 真相"],["B","方式 沟通"],["C","实效 事实"],["D","速度 信息"]],"a":["D"],"an":"“最快的时间、最新的报道”是对第一空的解释，由此可知第一空填“速度”最恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0838","type":"single","t":"留学异国的人常有“边缘人”的苦闷。人们显然不可能在进入一块陌生国土的同时，就在一瞬间也加入它的文化，而原来的文化背景又会由于天长地远而渐渐疏离。在实际生活中，两种的文化，会经常骤然直率地在我们面前相遇、碰撞，一开始真有无所适从亦无可躲避的。","o":[["A","水火不容 失落"],["B","截然不同 窘迫"],["C","南辕北辙 狼狈"],["D","针锋相对 无奈"]],"a":["B"],"an":"第一空填“截然不同”，第二空填“窘迫”符合语境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0839","type":"single","t":"生活中，每一秒都有无数种可能，任何瞬间一旦错过，就不会再重演，然而只有那些能够向我们足够有力信息和情绪的决定性瞬间才有记录的价值和意义。为了这样的瞬间摄影师需要付出很多，比如洞察这种瞬间的感知力，等待这种瞬间的和捕捉这种瞬间的。","o":[["A","传递 耐心 技巧"],["B","展示 信心 素质"],["C","表达 决心 能力"],["D","获取 恒心 灵感"]],"a":["A"],"an":"第一空填“传递”，第二空填“耐心”，第三空填“技巧”符合语境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0840","type":"single","t":"人类社会自有了国家，就开始了征税的历史。从古到今各国开征的税种，但总的来说，可以将它们为直接税和间接税两大类。直接税如土地税、房屋税等,间接税如盐税、渔税等。两类税种本身以及主体税种的经历了一个漫长演进的过程。","o":[["A","大同小异 概括 出现"],["B","林林总总 划分 发展"],["C","不胜枚举 归纳 更替"],["D","五花八门 合并 蜕变"]],"a":["C"],"an":"第一空应填入表示“多”含义的词语，排除A。“划分”意为把整体分成若干部分，与句意不符，排除B。“蜕变”指人或事物发生质变，不能用于形容税种的变更，排除D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0841","type":"single","t":"如果把不同的异文化仅仅看成是认识的对象、认识的客体，就意味着主体对客体可以任意地处置。异文化作为客体也就成了被研究、被注视、被处置、被奴役的了，殖民主义时期殖民者对土著文化采用的便是这种态度。","o":[["A","这里就会出现不平等"],["B","这在当今社会已成为一种常见的现象"],["C","同时也无法赢得对方的尊重"],["D","这样跨文化交际就难以进行"]],"a":["A"],"an":"文段强调主体对客体任意处置会导致不平等。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0842","type":"single","t":"所谓国民媒介素养，是指国民正确判断媒介信息的价值、意义和作用并有效使用和传播信息的素养。在信息时代，国民媒介素养已成为国民综合素养的重要组成部分。作为媒介受众，国民如果具有较高的媒介素养，就可以分清大众传媒背后的各种思想意识和价值观念，对接收的信息去伪存真、去粗取精，从而坚持和弘扬健康向上的观念和文化，抵制和批判消极腐朽的观念和文化。这段文字意在说明:","o":[["A","什么是国民媒介素养"],["B","提高国民媒介素养的重要意义"],["C","如何保持较高的媒介素养"],["D","要分层推进不断提高国民媒介素养"]],"a":["B"],"an":"文段主要强调提高国民媒介素养的重要性。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0843","type":"single","t":"天坛由于天地合祀，故内外垣墙皆前方后圆。主要建筑皆为圆形，而圜丘外垣墙和祈年殿外垣墙皆为方形，象征天圆地方。天坛内外垣墙内遍植槐柏，一片绿海，摒除视野的一切干扰。置身圜丘，仰望苍天、环视绿色大地，肃穆的氛围，引向皇权神授，天地人合一，人与天地对话的境界。祈年殿中四柱象征四极，内外双列十二柱喻十二月及十二时辰。顶棚高耸，龙蟠藻井。祭祀时香烟飘渺，乐声齐鸣，加强了对上天的崇敬与信仰。这段文字主要是介绍了天坛的:","o":[["A","建筑意境"],["B","艺术风格"],["C","布局特点"],["D","设计理念"]],"a":["A"],"an":"文段主要介绍了天坛的建筑意境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0844","type":"single","t":"当宇航员在国际空间站外执行任务时，太空中的化合物会粘在他们的衣服上，被带回空间站，而宇宙的气味就在这些特殊的化合物上，于是他们就“闻到”了宇宙的真实气味:外太空闻起来像是汽车比赛中的气味，混合了发热金属、柴油和烧烤的气味，这些气味主要是那些快要消亡的恒星剧烈燃烧产生的副产品散发出来的。这种副产品是一种气味强烈的化合物――多环芳烃，这些分子充斥在整个宇宙，并且会永久飘浮下去。彗星、流星和太空尘埃中都有它们的身影，它们也是地球生命最初形成时的重要成分之一，地球上的煤炭、石油甚至食物中，也都没能缺少它。下列说法与原文相符的是:","o":[["A","即将消亡的恒星在剧烈燃烧中会产生多环芳烃"],["B","多环芳烃是地球生命得以延续和进化的基础"],["C","太空中的化合物种类丰富"],["D","宇宙气味对宇航员有一定危害"]],"a":["A"],"an":"由“这些气味主要是那些快要消亡的恒星剧烈燃烧产生的副产品散发出来的。这种副产品是一种气味强烈的化合物――多环芳烃”可得出A项。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0845","type":"single","t":"双轨制度是中国从计划经济向市场经济过渡所采取的制度安排，曾在各个经济领域广泛使用。到目前为止，中国所有工业品和绝大多数农产品的市场已经全部放开，但是粮食领域的双轨制度依然存在，这在一个侧面反映出粮食流通体制的改革具有复杂性和特殊性。根据这段文字，关于“双轨制度”理解正确的是:","o":[["A","双轨制度在市场经济下完全退出时机尚不成熟"],["B","在计划经济时期，工业产品普遍采用双轨制度"],["C","农产品市场的全面开放指日可待"],["D","粮食市场的双轨制度限制了粮食的自由交易"]],"a":["A"],"an":"由文段可知，粮食领域的双轨制依然存在，说明完全退出时机尚不成熟。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0846","type":"single","t":"最近，研究人员开发出一种新型锂电池，有望广泛用于笔记本电脑、手机等电子产品。传统的锂电池使用液态电解质，并用一层聚合物薄膜隔开正负极，而在这种新型锂电池中，电池的正负极被融合到一起，制作出一种类似果冻的胶状物。这种胶状物看起来是固态的，但其中70%的成分是液体电解质，可以很好地起到导电作用。新型锂电池功能与传统锂电池相当，突出优点在安全方面。传统锂电池如封装工艺不好，起火和爆炸的风险相对较高，而使用胶状物的新型锂电池相比之下就要安全得多。根据这段文字，可以知道:","o":[["A","新型锂电池的胶状物燃点更高所以更安全"],["B","传统锂电池不需要聚合物隔膜隔开正负极"],["C","新型锂电池已广泛使用于手机等电子产品"],["D","两种锂电池的内部结构相异但导电原理相同"]],"a":["D"],"an":"A项“胶状物燃点”无中生有；B项偷换概念；C项混淆已然与未然。本题答案为D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0847","type":"single","t":"自上世纪90年代以来，稀土全球年消费量从3.3万吨增加到10多万吨。稀土不仅是钢铁、有色金属、石油等传统产业的重要原料，而且在光电信息、催化等同技术、新材料领域中显示出不可替代的作用。当今世界，几乎每隔3~5年就会发现稀土的一种新用途，每四项新技术就有一项与稀土有关。中国是稀土最大的资源国，保护稀土资源刻不容缓。这段文字主要说明:","o":[["A","稀土的特性和价值正逐步被人类了解"],["B","我国稀土资源的开发利用前景广阔"],["C","国际社会已将稀土视为一种战略资源"],["D","稀土的开发利用制约着高新技术应用"]],"a":["A"],"an":"文段主要说明稀土的特性和价值正逐步被人类了解。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0848","type":"single","t":"在城市化的进程中，地铁等大型公共设施或建筑，常常承载着城市记忆的功能，是城市历史文化的一部分。城市中的大型公共建筑并非要紧跟潮流，也无需趋向同一化，而是要将建筑与城市的历史文脉、人文环境等相联系。在某种程度上，焕然一新已经成为主导性的城市美学追求，城市因而处于种种不必要的求新求变中，城市建筑特色模糊，有时沦为“换装比赛”的牺牲品，久而久之，使得城市的文化内涵始终难以形成和延续。这段文字意在强调:","o":[["A","城市建筑缺乏整体设计会使城市失去人文特色"],["B","城市的文化内涵无法形成和延续到了刻不容缓的境地"],["C","城市建设的求新求变会导致城市的模式化"],["D","历史和人文在城市建设中是不应忽略的重要元素"]],"a":["D"],"an":"文段强调城市建设不应忽略历史和人文。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0849","type":"single","t":"英国保守党党魁亲自在广告中招揽年轻人，工党设有青年工党全国委员会，并在2005年修订的党章中指出，要争取年轻人对工党理念和主张的共鸣;自由民主党甚至放松年龄，连12岁的儿童都可以加入其青年组织。这也推动了政党领袖的年轻化趋势，给英国政界带来了活力;前工党首相布莱尔44岁就上任，现任首相卡梅伦39岁就当了保守党领袖。这段文字意在说明:","o":[["A","英国鼓励青年从政的文化和环境俱佳"],["B","英国的三大政党都重视吸收年轻成员"],["C","英国年轻人有着较强的参政意识"],["D","英国政党领袖年轻化的趋势日趋明显"]],"a":["B"],"an":"文段列举英国三大政党在吸收年轻成员方面所做的努力，说明这三大政党都重视吸收年轻成员。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0850","type":"single","t":"在目前地球上所有的生命中，人类已经不是传统意义上食物链上的成员，而是在制造甚至控制着食物链，并对自然生态系统施加前所未有的影响。原子武器、转基因技术的滥用，是以使我们赖以生存的地球生命系统毁灭，追求享乐的消费模式所制造的垃圾将覆盖这个星球。并透支了子孙后代的地下资源、空间资源甚至太空资源。日益升温的地球，已为人类引为自豪的技术文明敲响了警钟。这段文字意在说明:","o":[["A","地球升温与人类活动有关，必须引起重视"],["B","人类在发展技术的同时，必须注重可持续发展"],["C","人类对自然进行着前所未有的破坏,必然深受其害"],["D","技术进步改变了人类的生活方式，造成了严重的后果"]],"a":["B"],"an":"文段强调人类在发展技术的同时，必须注重可持续发展。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0851","type":"single","t":"①历史上严重的干旱和洪水给生命和财产带来了难以估计的损失②但却未能从根本上摆脱严重的干旱和洪水反复给经济社会带来的巨大灾难③几千年来，人类以巨大的努力不屈不挠地进行着筑堤防洪、截流蓄水、开渠引水、掘井取水等传统模式的水利建设，推动着文明的发展④而现代社会在严重的旱涝灾害面前仍然脆弱无力⑤而且到处分布和大规模聚集的人口更易受生态破坏、气候恶化所带来的自然灾害高频率、高难度的更大冲击将以上5个句子重新排列，语序正确的是:","o":[["A","③②①④⑤"],["B","①④③②⑤"],["C","③④⑤②①"],["D","①③④②⑤"]],"a":["A"],"an":"③句引出人类防洪抗旱的话题，更适合做段首，②句有转折词“但是”，与③句构成转折关系，故③②应紧密相连。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0852","type":"single","t":"①根据专业统计,消费者在每封信件上只会停留短短7秒钟②要想消费者从众多的直邮中拆开你的信件,那你的信封就必须够独特,够有诱惑力③如果将企业的直邮销售看作一个产品,那么信封就是这个产品的包装④如果目标顾客连你的信封都不拆开，就别提直邮营销的成功率⑤目标顾客邮箱里天天电话单、朋友寄来的贺卡、银行账单、各种企业目录等信件源源不断将以上5个句子重新排列，语序正确的是:","o":[["A","④①②③⑤"],["B","③⑤②①④"],["C","⑤①④③②"],["D","①⑤③②④"]],"a":["D"],"an":"①句说消费者停留时间短，⑤句说邮箱里信件多，③句把信封比作包装，②句说信封要独特，④句说拆开信封的重要性，逻辑顺序为①⑤③②④。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0853","type":"single","t":"1977年在安徽阜阳西汉汝阴侯灶墓出土了“不知名漆器”，经考证，它是世界上现存的年代最早且具有确定年代的主表。“不知名漆器”打开后顺着南北方向摆放,利用其北侧立耳在正午时投下的影子，就能指示冬至、春分、夏至和秋分的到来。这种类型圭表适用的地理纬度是固定的，经测算，汝阴侯其墓圭表的适用纬度恰恰就在汉代长安到汝阴侯国一带。这架圭表的精妙之处还在于，四个节气日影所在的位置不是用刻度表示，而是暗含在木块和漆器上的一些特殊图案和位置中。关于这架圭表，以下说法正确的是:","o":[["A","可指示二十四节气"],["B","使用年代不详"],["C","适用于特定地理位置"],["D","表上标有详细的时间刻度"]],"a":["C"],"an":"由原文可知，这架圭表只能指示“冬至、春分、夏至和秋分”，故A错误；由“它是世界上现存的年代最早且具有确定年代的圭表”可知B错误；由“四个节气日影所在的位置不是用刻度表示”可知D错误。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0854","type":"single","t":"考试技术有先进和落后之分，但高校招考制度很难说有先进和落后之分。1993年，学者研究指出:考试制度与各国的国家教育制度及社会情况密切相关,有些国家的考试制度具有高度持久性，而且不易改变;有些国家的考试制度则正在经历实质、甚至快速的改制。此外，各国考试制度的改革方向也不尽相同。这段文字体现了作者怎样的观点?","o":[["A","对考试制度应进行历史的客观的评价"],["B","高校招考制度各有千秋，很难区分优劣"],["C","应根据国家的具体情况改革高校招考制度"],["D","国外的考试制度历史悠久，值得借鉴"]],"a":["B"],"an":"文段为总分结构，首句为主旨句，指出高校招考制度很难说有先进和落后之分。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0855","type":"single","t":"若批评不自由，则赞美无意义。从某种意义上讲，赞美的可信度要靠批评的自由度来检验。如果我们处在一个不能自由表达批评意见的环境中，那么无论赞美的声音表达得多么充分，也不能让公众信以为真，因为最真实的评价总是在一个可以自由竞争的言论环境中产生的。一旦缺失了这一保障赞美言论公信力的制度土壤，哪怕赞美真的是出自当事人的真情实感，效果也会大打折扣。对这段文字的主旨概括最准确的是:","o":[["A","赞美与批评是矛盾的统一体"],["B","真实的赞美才能达到最好的效果"],["C","批评和赞美都需要自由的言论环境"],["D","能够自由表达批评才能有真实的赞美"]],"a":["D"],"an":"文段强调批评自由对赞美真实性的重要性。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0856","type":"single","t":"通常人们认为，废旧的老式电视机显像管(阴极射线管)是一种包含有毒物质的废料。但一项新研究显示，这种废料也许有用。研究人员在放射性活度800万亿贝克勒尔的钴放射源和测量辐射剂量的仪器之间放置阴极射线管玻璃的碎屑，以测定其屏蔽放射线的能力。分析结果表明，即使对阴极射线管的玻璃碎屑不进行任何加工，55厘米厚的玻璃碎屑就能使辐射剂量下降至原来的1%，这相当于约9厘米厚的铅板的屏蔽能力，而铅被认为是迄今为止吸收、屏蔽核辐射能力最强的物质。如是将玻璃碎屑和粉碎阴极射线管产生的玻璃粉混合到一起，那么约40厘米厚就能达到上述效果。关于阴极射线管的玻璃碎屑，以下说法正确的是:","o":[["A","吸收核辐射的能力和铅不相上下"],["B","厚度增加，其屏蔽核辐射的能力也会提高"],["C","其包含有毒物质的观点受到质疑"],["D","对其加工的精细程度会影响屏蔽核辐射的能力"]],"a":["D"],"an":"文段未将阴极射线管的玻璃碎屑与铅吸收核辐射的能力进行比较，A项无中生有；B项由文段无法推出；C项颠倒黑白，文段并未质疑阴极射线管包含有毒物质的观点。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0857","type":"single","t":"艺术博物馆经过近200年的发展，已经从最初的“艺术家的机构”演变为今天“公众的艺术机构”。艺术博物馆的馆长、总监、策展人发现，他们现在面临的最大问题不是和捐赠人、收藏家、同行打交道，而是如何把没有受过艺术教育、缺乏相关的艺术体验的普通人吸引到艺术博物馆里来。潜在的观众群不进博物馆是因为他们不懂艺术史，缺乏相关的艺术体验，一直认为博物馆不欢迎他们，里面没有让他们感兴趣的东西。消除这种“不舒服感”首先需要淡化艺术博物馆的精英色彩。艺术并不只关乎大人物，更关乎普通人。从社会学角度讲，后者更重要。这段文字主要说明:","o":[["A","艺术教育的普及将大众引向博物馆"],["B","去精英化是当下艺术发展的方向"],["C","艺术博物馆应主动贴近普通大众"],["D","公众的艺术欣赏水平和层次不断提高"]],"a":["C"],"an":"文段主要说明艺术博物馆应主动贴近普通大众。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0858","type":"single","t":"政府职能与成本问题一直备受争议,但这方面的研究似乎还处于一种观点与立场远未一致的状态，一个重要原因是研究视角与方法的局限。大体上看，这类研究有两条思路，一条是信守新古典经济学理论预设，认为市场可以有效解决经济社会发展中的问题，持“小政府”观点;另一条是信守政府干预主义理论预设，认为政府不时干预是市场能够健康运转的必要条件。笔者认为，要解决这种困境，必须有新的理论视野和新的研究方法，而新兴古典经济学理论就是其中之一。这段文字接下来最有可能讲述的是:","o":[["A","新兴古典经济学的理论框架与研究方法"],["B","新理论视野对提高政府的行政效率有何帮助"],["C","新古典经济学理论预设的局限性"],["D","政府职能与成本之间矛盾难解的原因"]],"a":["A"],"an":"文段尾句提出新兴古典经济学理论，接下来应介绍其理论框架与研究方法。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0859","type":"single","t":"传统节日有了法定假期，未必就不会渐行渐远，一个古老节日之所以沿袭不衰，真正动因不在于它有多热闹、能带来多少商机，而在于它承载着中国人代代累积下来的那份感情，流淌着中华民族赖以生存的精神血脉和文化基因，如今社会进步、经济发展，人们对传统节日有了更高的要求和期待，既期待它回归，帮助我们找到历史深处民族精神的根，也期待它更新，富有实在鲜活的当代内容。无论哪种期待，都是期待传统节日更厚重、更有文化、更有精神内涵。这段文字旨在说明:","o":[["A","过度商业化会削弱传统节日的精神内涵"],["B","传统节日的生命力在于其精神内涵的继承与发扬"],["C","人们期待历史价值与现实意义相统一的传统节日"],["D","传统节日可以为人们提供情感归宿和精神家园"]],"a":["B"],"an":"文段强调传统节日的生命力在于其精神内涵。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0860","type":"single","t":"20世纪80年代以来以市场为取向的改革，使人力资本的市场价值得以实现，居民的教育收益率从较低水平提高10%左右，这也是不同受教育水平劳动者之间收入差距扩大的重要原因。随着劳动者受教育程度普遍提高，高学历劳动者不再稀缺，教育收益逐渐稳定，高学历与低学历的劳动者工资比不再上升，近年来甚至出现工资趋同的现象，不同学历劳动者之间的收入差距在缩小。随着我国中等教育和高等教育的进一步普及和教育公平得到保障，教育对缩小收入分配差距的积极效应将进一步显现。与这段文字相符的是:","o":[["A","学历高低与劳动者收入多少成正比"],["B","劳动者受教育程度普遍提高，不同学历劳动者之间的工资比稳中有降"],["C","人力资本市场不断调整，使得教育因素对收入的影响逐渐减小"],["D","教育普及和教育公平的保障，使收入分配差距不断缩小"]],"a":["D"],"an":"由文段最后一句可知，D项正确。","tp":"言语理解","d":"中"},

	{"i":"fjcs_0865","type":"single","t":"甲乙结婚后，乙的父母于2011年11月1日出资300万元为甲乙购买了房屋，房屋产权登记在乙的名下。由于甲外出打工，乙长期在娘家居住，经夫妻协商将房屋出租。2012年4月20日，因甲在外出打工期间与他人同居，乙提起诉讼离婚。法院判决甲与乙离婚。下列说法不正确的是:","o":[["A","该房屋应认定为乙的个人财产"],["B","该房屋应视为乙的父母只对乙的赠与"],["C","房屋租金属于夫妻共同财产"],["D","应将房屋视为夫妻共同财产并依法分割"]],"a":["D"],"an":"根据《婚姻法解释(三)》规定，婚后由一方父母出资为子女购买的不动产，产权登记在出资人子女名下的，视为只对自己子女一方的赠与，该不动产应认定为夫妻一方的个人财产。","tp":"常识判断","d":"中"},

	{"i":"fjcs_0882","type":"single","t":"一个圆形牧场面积为3平方公里,牧民骑马以每小时18公里的速度围着牧场外沿巡视一圈，约需多少分钟?","o":[["A","12"],["B","18"],["C","20"],["D","24"]],"a":["C"],"an":"圆面积=πr²=3，r=√(3/π)≈0.98，周长=2πr≈6公里，时间=6÷18×60=20分钟。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0883","type":"single","t":"某工厂生产的零件总数是一个三位数，平均每个车间生产了35个，统计员在记录时粗心地将该三位数的百位与十位数字对调了,结果统计的零件总数比实际总数少270个。问该工厂所生产的零件总数最多可能有多少个?","o":[["A","525"],["B","630"],["C","855"],["D","960"]],"a":["B"],"an":"零件总数应能被35整除，且百位与十位对调少270，630对调为360，差270，且630>525。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0884","type":"single","t":"某单位向希望工程捐款，其中部门领导每人捐50元，普通员工每人捐20元，某部门所有人员共捐款320元,已知该部门总人数超过10人,问该部门可能有几名部门领导?","o":[["A","1"],["B","2"],["C","3"],["D","4"]],"a":["B"],"an":"设领导x人，员工y人，50x+20y=320，化简得5x+2y=32。x为偶数，若x=4则y=6，总人数未超10；x=2则y=11，总人数13>10。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0885","type":"single","t":"甲乙两地相距20公里，小李、小张两人分别步行和骑车，同时从甲地出发沿同一路线前往乙地，小李速度为4.5公里/小时，小张速度为27公里/小时。出发半小时后，小张返回甲地取东西,并在甲地停留半小时后再次出发前往乙地。问小张追上小李时,两人距离乙地多少公里?","o":[["A","8.1"],["B","9"],["C","11"],["D","11.9"]],"a":["D"],"an":"小张再次出发时小李已走4.5×1.5=6.75公里，设小张再次出发后x小时追上，27x=6.75+4.5x，解得x=0.3，距乙地20-27×0.3=11.9公里。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0886","type":"single","t":"在空间中最多能放置多少个正方体，使得任意两个正方体都有一部分表面相接触?","o":[["A","4"],["B","5"],["C","6"],["D","7"]],"a":["C"],"an":"在同一平面上最多3个正方体两两接触，空间中通过上下两层可放置6个。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0887","type":"single","t":"箱子中有编号为1~10的10个小球,每次从中抽出1个记下编号后放回,如是重复3次，则3次记下的小球编号乘积是5的倍数的概率是多少?","o":[["A","43.2%"],["B","48.8%"],["C","51.2%"],["D","56.8%"]],"a":["B"],"an":"乘积是5的倍数，只要抽到5或10即可，每次抽不到的概率为0.8，所求为1-0.8³=48.8%。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0888","type":"single","t":"某单位举办象棋比赛,规则为胜一场得4分，负一场得-1分，平一场不得分。一轮比赛中参赛人员共100人，两两配对后分别比赛，所有人的总得分为126分，问该轮比赛中平局有多少场?","o":[["A","4"],["B","8"],["C","12"],["D","16"]],"a":["B"],"an":"分出胜负一场总分为3分，平局得0分。总比赛50场，设分出胜负x场，3x=126，x=42，平局50-42=8场。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0889","type":"single","t":"有100个编号为1~100的罐子，第1个人在所有的编号为1的倍数的罐子中倒入1毫升水,第2个人在所有编号为2的倍数的罐子中倒入1毫升水……最后第100个人在所有编号为100的倍数的罐子中倒入1毫升水，问此时第92号罐子中装了多少毫升的水?","o":[["A","2"],["B","6"],["C","46"],["D","92"]],"a":["B"],"an":"92号罐子装的水等于其约数个数，92=2²×23，约数有1、2、4、23、46、92共6个。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0890","type":"single","t":"某单位共有职工72人,年底考核平均分数为85分,根据考核分数,90分以上的职工评为优秀职工,已知优秀职工的平均分数为92分,其他职工的平均分数是80分,问优秀职工的人数是多少?","o":[["A","12"],["B","24"],["C","30"],["D","42"]],"a":["C"],"an":"利用十字交叉法，优秀职工与其他职工人数比为5:7，优秀职工=72×5/12=30人。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0891","type":"single","t":"2台大型收割机和4台小型收割机在一天内可收完全部小麦3/10，8台大型收割机和10台小型收割机在一天内可收完全部小麦。如果单独用大型收割机和单独用小型收割机进行比较，要在一天内收完小麦，小型收割机要比大型收割机多用多少台?","o":[["A","8"],["B","10"],["C","18"],["D","20"]],"a":["C"],"an":"设大型效率a，小型效率b，解得a=1/12，b=1/30，小型比大型多用30-12=18台。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0892","type":"single","t":"甲、乙两仓库各放有集装箱若干个,第一天从甲仓库移出和乙仓库集装箱总数同样多的集装箱到乙仓库，第二天从乙仓库移出和甲仓库集装箱总数同样多的集装箱到甲仓库，如此循环，则到第四天后，甲、乙两仓库集装箱总数都是48个。问甲仓库原来有多少个集装箱?","o":[["A","33"],["B","36"],["C","60"],["D","63"]],"a":["D"],"an":"逆推法，第四天甲乙各48，依次逆推得甲原有63个。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0893","type":"single","t":"某彩票设有一等奖和二等奖，其玩法为从10个数字中选出4个，如果当期开奖的4个数字组合与所选数字有3个相同则中二等奖，奖金为投注金额的3倍，4个数字完全相同则中一等奖，为了保证彩票理论中奖金额与投注金额之比符合国家50%的规定，则一等奖的奖金应为二等奖的多少倍?","o":[["A","8"],["B","9"],["C","10"],["D","11"]],"a":["D"],"an":"设一等奖奖金为a，解得a=33，是二等奖的11倍。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0894","type":"single","t":"某公司推出的新产品预计每天销售5万件，每件定价为40元，利润为产品定价的30%。公司为了打开市场推出九折促销活动，并且以每天10万元的费用为产品和促销活动做广告宣传。问销量至少要达到预计销量的多少倍以上，每天的盈利才能超过促销活动之前?","o":[["A","1.75"],["B","2.25"],["C","2.75"],["D","3.25"]],"a":["A"],"an":"促销前利润每件12元，促销后单价36元，成本28元，每件利润8元。设销量为a万件，8a-10>5×12，解得a>8.75，8.75÷5=1.75。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0895","type":"single","t":"有甲乙两个水池，其中甲水池中一直有水注入。如果分别安排8台抽水机去抽空甲和乙水池，则分别需要16小时和4小时，如给甲水池加5台，则可以提前10小时抽空。若共安排20台抽水机，则为了保证两个水池能同时抽空，在甲水池工作的抽水机应该比乙水池多多少台?","o":[["A","4"],["B","6"],["C","8"],["D","10"]],"a":["C"],"an":"设每台抽水机每小时工作量为1，乙池容量32，甲池每小时注水1，设甲池a台，乙池20-a台，解得a=14，甲比乙多8台。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0896","type":"single","t":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。","o":[],"a":["C"],"an":"第一组图形中，内外图形形状相同大小不同，相连的是一条线；第二组相连的是一个点。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0897","type":"single","t":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。","o":[],"a":["D"],"an":"第一组每个图形的线条数都是14；第二组每个图形的线条数都是12。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0898","type":"single","t":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。","o":[],"a":["D"],"an":"第一组图形中都有角，第二组图形中都没有角。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0899","type":"single","t":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性。","o":[],"a":["A"],"an":"图形中线条之间的交点总数和图形中的线条数相等。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0900","type":"single","t":"以下哪两个图形调换位之后，能使之呈现一定的规律性?","o":[],"a":["C"],"an":"④和⑤互换后，图形的封闭区域数依次是1、2、3、4、5、6。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0901","type":"single","t":"水土流失是指在水力、重力、风力等外力作用下，水土资源和土地生产力遭受的破坏和损失，包括土地表层侵蚀和水的损失，亦称水土损失。水土流失是不利的自然条件与人类不合理的经济活动互相交织作用产生的。根据以上定义，下列不存在水土流失的是:","o":[["A","某地在一次暴雨后发生泥石流"],["B","某些地区在强风作用下逐步沙漠化"],["C","岩石经过长期的风化变成沙砾"],["D","黄河将高原大量的泥沙挟带至下游"]],"a":["C"],"an":"岩石风化成沙砾不属于水土流失。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0902","type":"single","t":"化归思想是指当问题难以直接解决时，根据问题的性质、条件和关系的特点，采取适当的变换方法而对问题进行转换，最终把它化为容易的、较简单的或已经解决的问题的思想。根据上述定义，下列运用了化归思想的是:","o":[["A","人类发明了用钨丝做灯丝的电灯泡，取代了以往的碳丝电灯，从而使电灯的亮度明显提高"],["B","在掌握了扇形和三角形的面积计算公式以后,用图形分割的方法求出弓形的面积"],["C","张教授用新的实验方法取代以往的实验方法，从而攻克了一道技术上的难题"],["D","法学研究者将法学方法加以理论化，从而上升为法学方法论"]],"a":["B"],"an":"B项将弓形面积转化为扇形和三角形面积，符合化归思想。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0903","type":"single","t":"道路交通事故是指车辆在道路上因过错或意外造成的人身伤亡或者财产损失的事件。其中“道路”，是指公路、城市道路和虽在单位管辖范围但允许社会机动车通行的地方，包括广场、公共停车场等用于公众通行的场所。下列不属于道路交通事故的是:","o":[["A","小王在进行封闭管理的小区内倒车时不慎将一老人撞倒"],["B","周小姐带着宠物狗横穿马路时，乱闯的宠物狗不幸丧生在车轮下"],["C","小赵将汽车停在商场附近的停车场，取车时发现车尾部被撞，肇事车辆已逃跑"],["D","绿灯亮时，小姜穿过斑马线过马路，被一辆闯红灯的自行车撞伤"]],"a":["B"],"an":"B项是宠物狗被撞，不符合“造成人身伤亡或财产损失”。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0904","type":"single","t":"自我障碍策略指的是当人们预期自己会失败的时候，常常会提前设置一些障碍来阻挠自己获得成功，以作为解释失败的借口，这种行为被称为自我障碍策略。根据上述定义，下列使用自我障碍策略的是:","o":[["A","小李的学习成绩一直是全班第一，但对马上来临的期末考试很没有把握，索性谎称自己生病了,以此来逃避期末考试"],["B","营销员张某的业绩出现下滑，经理找其谈话，张某解释这是因为最近一段时间自己神经衰弱，工作状态不佳导致的"],["C","小杨一路披荆斩棘，终于杀入全国网球总决赛。这时他突然担心决赛拿不到好名次，故意在训练中扭伤脚，带伤去参加比赛"],["D","中学时期一直是学习尖子生的小刘，高考发挥失常，只考上一所不起眼的大学，之后破罐子破摔,再也提不起学习的兴趣了"]],"a":["C"],"an":"C项符合预期失败且提前设置障碍。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0905","type":"single","t":"知识营销是指在企业的营销过程中，使企业的广告、宣传、公关、产品注入一定的知识含量与文化内蕴，帮助消费者增加与商品相关并实用的信息与知识，提高他们的消费与生活质量，从而达到推广产品、树立形象、提升品牌竞争力的目的。根据上述定义，下列属于知识营销的是:","o":[["A","某保健品生产企业深入社区为居民开设健康生活讲座，并在讲座中推销其保健品"],["B","某体育用品生产企业为希望小学捐献价值20万元的体育用品，多家媒体报道了这一事迹"],["C","某师范院校派出大学生支教团，在支教的同时宣传教育的重要性"],["D","某证券公司股票分析师经常受电视台邀请在电视节目中为广大股民进行股票分析"]],"a":["A"],"an":"A项符合知识营销的定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0906","type":"single","t":"利群偏差指的是人们对自己的群体成员的行为总是倾向于给予善意的理解，而在解释其他群体成员的类似行为时，更容易从坏的角度去设想。根据上述定义，下列存在利群偏差的是:","o":[["A","东道主球队的胜利得益天时地利人和，我们客场作战失利，是因为球员在异国他乡水土不服"],["B","我们队员比赛失利的主要原因是训练过度劳累，让对方球员捡了个大便宜"],["C","某公司经理认为去年公司业绩不尽如人意的主要原因是低估了竞争对手的实力"],["D","某班主任看到自己班学生的打闹行为时会认为只是“玩笑胡闹”，在看到其它班学生的类似行为时会认为是“品质恶劣”"]],"a":["D"],"an":"D项符合利群偏差的定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0907","type":"single","t":"互补商品是指两种或几种共同满足消费者同一种欲望的相关商品，在消费者的爱好，货币收入和其他商品价格保持不变的情况下，如果商品甲价格的下跌引起对商品乙需求的增长，那么商品甲和乙就是互补商品。根据上述定义，下列属于互补商品的是:","o":[["A","在胶片相机价格不变时，胶卷价格的上涨使得人们对胶片相机的需求也相应减少"],["B","由于原料成本的增加，某酒厂将其生产的葡萄酒每瓶的价格由原先的10元调到11元，但并没有影响市场上酒杯的价格"],["C","一些地区为了缓解交通压力出台了汽车限购令，使得一些汽车的价格有所下降，与此同时，由于石油紧缺，汽油的价格却在不断上涨"],["D","某学校为了组建一支乒乓球队，采购了一批乒乓球和球拍，后发现球拍的质量不好，又增购了一批高质量的球拍"]],"a":["A"],"an":"A项符合互补商品的定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0908","type":"single","t":"内隐认知是指人的大脑对各种刺激的内部加工过程，即在认知过程中，虽然行为者不能回忆某一过去经验,但这一经验已潜在地对行为者的行为和判断产生影响。根据上述定义，下列符合内隐认知的是:","o":[["A","小方在电视上看到某品牌手机的广告，她想到爸爸使用的手机听筒有问题，不如买一款广告中的手机送给他"],["B","小辉利用业余时间学习了法语，工作后由于没有从事法语相关工作，法语学习就被迫中断了"],["C","三十岁的张明很怕毛毛虫，母亲认为这是因为他一岁半时曾被毛毛虫蜇伤过"],["D","一些企业借鉴国外经验，请名人为公司产品代言，并进行广泛宣传，以此为企业赢得利润与声誉"]],"a":["C"],"an":"C项符合内隐认知的定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0909","type":"single","t":"挤进效应是指政府采用扩张性财政政策时，能够诱导民间消费和投资的增加，从而带动产出总量或就业总量增加的效应;挤出效应是指当供应和需求有新的增加时，随着政府支出的增加而引起的私人消费或投资降低的效果，这会导致部分资金从原来的预支中挤出，而流入到新的商品中。根据上述定义，下列属于挤出效应的是:","o":[["A","某地区县政府对家庭困难的个体经经营者减免税收，从而带动了当地的个体经济"],["B","某地方政府计划投资一些大型化工项目并建立化工厂，由于工厂将占用一部分耕地，因此该地区粮食价格上涨"],["C","由于适龄儿童增加，该地区政府加大了对学校基础建设的资金投入，并降低学杂费，于是当地家庭为孩子报艺术班的比例增加了"],["D","某市实行房屋限购令后，楼市交易低迷，人们转向投资邻市，使邻市楼市被进一步催热"]],"a":["C"],"an":"C项符合挤出效应的定义。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0910","type":"single","t":"内部行政行为是指行政主体在内部行政组织管理过程中所作的只对行政组织内部产生法律效力的行政行为。下列属于内部行政行为的是:","o":[["A","某省粮食局制定保障粮食生产发展纲要，要求各市县粮食局贯彻实施"],["B","某市工商局指导当地外资企业进行网上年检"],["C","某市国税局购进一批办公桌椅，因质量问题暂缓支付剩余款项"],["D","某市政府与清洁工签订劳动合同"]],"a":["A"],"an":"A项属于内部行政行为中的行政主体间工作关系行为。","tp":"判断推理","d":"中"},

	{"i":"fjcs_0918","type":"single","t":"科学家对发掘于埃塞俄比亚哈达尔遗址的南方古猿足骨的第4根跖骨化石进行分析研究后发现，非洲南方古猿具有定型的弓形足。他们据此认为，人类的祖先早在320万年前就开始像现代人一样用双脚行走。以下哪项如果为真，最能支持上述论证?","o":[["A","只有分析第4根跖骨化石，才能发现非洲南方古猿具有定型的弓形足"],["B","只有南方古猿才是人类的祖先"],["C","只有具有定型的弓形足，才能使用双脚行走"],["D","只有使用双脚行走，才具有定型的弓形足"]],"a":["D"],"an":"在“定型的弓形足”和“使用双脚行走”之间建立联系。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0919","type":"single","t":"美国睡眠专家设计了一项测试，让志愿者在睡眠实验室里连续度过13个夜晚。前4个夜晚，志愿者每晚能睡足8小时;接下来6天，他们的睡眠时间缩短至每晚6小时;最后3个晚上，志愿者出现“补觉”现象，每天要睡10小时。测试结果显示，持续几天睡眠不足后，志愿者反应速度变慢。补觉后，虽然感觉头脑清醒一些，但仍行动迟缓、笨拙。由此可见，连续工作一周、睡眠不足后，用3个晚上补觉可以改善困倦的状况，但是不能改善缺觉对认知功能造成的累积影响。以下哪项如果为真，最能支持上述结论?","o":[["A","很多志愿者难以适应睡眠实验室的环境，晚上经常做梦"],["B","志愿者平时习惯的睡眠时间不等，平均睡眠时间为每晚6小时"],["C","实验前后对志愿者进行大脑功能扫描，发现大脑结构并无明显异常"],["D","补觉后让志愿者进行反应灵敏度测试，多数人的灵敏度明显低于平时"]],"a":["D"],"an":"补觉后灵敏度仍低于平时，支持了补觉不能改善累积影响的结论。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0920","type":"single","t":"某研究机构调查分析了208名有心痛和心律不齐等症状的病人，在开始接受手术治疗时通过问卷报告了自己对病情的看法，其中约20%的人非常担忧病情会恶化，有的人甚至还害怕因此死亡，其他人就没有那么多担忧。后来随访调查表明，那些术前严重担忧情绪的人术后半年复发率高于其他人。研究人员认为担忧情绪不利于心脏病的康复。以下哪项如果为真，最能支持上述结论?","o":[["A","有研究表明担忧情绪会抑制大脑前额叶皮层活动，使人更抑郁"],["B","研究人员发现那些有严重担忧情绪的人更关注自己的健康状况"],["C","那些有严重担忧情绪的人血液中含有加重心脏病风险的化学物质"],["D","担忧情绪对健康是一个潜在威胁，会导致癌症、糖尿病等多种疾病"]],"a":["C"],"an":"直接说明担忧情绪加重心脏病风险，支持结论。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0921","type":"single","t":"某水果店只有进货价低于正常价格时，才能以低于市场的价格卖水果而获利;除非该水果店的销售量很大，否则，不能从果农那里购得低于正常价格的水果;要想有大的销售量，该水果店就要拥有特定品种水果的独家销售权。因为种种原因，该水果店没有得到特定品种水果的独家销售权。由此可以推出:","o":[["A","该水果店的销售量很大"],["B","该水果店的进货价低于正常价格"],["C","该水果店不能以低于市场的价格卖水果而获利"],["D","该水果店获利很少"]],"a":["C"],"an":"由条件递推可知，没有独家销售权→没有大销量→不能购得低价水果→不能低价获利。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0922","type":"single","t":"挪威研究人员分析了该国过去几十年里230万份出生记录，以及相应孕妇的健康数据，结果发现，如果母亲怀孕期间出现妊娠剧吐症状，女儿后来怀孕时也出现该症状的可能性是其他人的3倍。研究还表明，孕妇妊娠剧吐与腹中胎儿是否含有来自丈夫一方的相关基因没有关系，导致这一症状的基因只可能来自母亲。因此研究人员认为妊娠剧吐与父亲的基因无关，而是由母亲遗传给女儿。以下哪项如果为真，最能削弱上述结论?","o":[["A","女儿和母亲生活的自然和家庭环境(气候、饮食习惯等)比较类似"],["B","一项亚洲研究表明,母亲有妊娠剧吐,女儿出现的可能性是其他人的1.5倍"],["C","研究表明，外婆怀孕时有妊娠剧吐，外孙女出现的可能性是其他人的3倍"],["D","在过去几十年中，挪威妇女吸烟的比例逐年上升，而吸烟与妊娠剧吐有关"]],"a":["A"],"an":"指出环境因素导致，属于另有他因，削弱结论。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0923","type":"single","t":"大雁一般排成整齐的人字形或一字形飞行，这是集群本能的表现。因为这样有利于防御敌害。雁群总是由有经验的老雁当“队长”，飞在队伍的最前面。在飞行中，带队的的大雁体力消耗得很厉害，因而它常与别的大雁交换位置。幼鸟和体弱的鸟，总是插在队伍的中间。因此，飞行时它们不会受到敌害的攻击。以下哪项如果为真,可以成为得出上述结论所需的前提?","o":[["A","大雁的飞行队形兼具防守和攻击两种功能"],["B","体弱的不可能成为带队的大雁"],["C","飞行时敌害不会攻击大雁飞行队列的中间"],["D","雁群中需要有不止一只能带队的大雁"]],"a":["C"],"an":"必须假设敌害不攻击中间，否则结论不成立。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0924","type":"single","t":"研究发现，如果开饭时间晚了几分钟，人类的婴儿就会大声哭叫，而对于3、4个月大的企鹅幼崽来说,它们却异常平静。在小企鹅的父母外出觅食时,它们甚至要适应长达几天没有食物的困境。以下哪项如果为真，能够解释这一现象?","o":[["A","3、4个月大的企鹅消化系统并未发育健全,因此它们的食量相对较小"],["B","当雌企鹅去觅食时，雄性企鹅会用胃内的分泌物喂食幼崽"],["C","大企鹅外出时，小企鹅常会在夜间聚在一起互相取暖"],["D","当大企鹅不在时，小企鹅的叫声会引来天敌"]],"a":["A"],"an":"食量小解释了为什么能长时间不进食而不叫。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0925","type":"single","t":"某军事驻地有9名士兵陆续出现身体极度不适的症状。据调查，在距这9名士兵驻守点约200米处停有两辆被贫铀弹击毁的坦克。医生认为，这是由于他们吸入了贫铀弹爆炸产生的放射性粉尘。但有关专家反对说，贫铀弹击中目标后，其产生的放射性粉尘最终会沉降在爆炸点150米的范围内，因此不会影响这些士兵的身体健康。以下哪项如果为真，能够反驳上述专家的言论?","o":[["A","研究已经证明，贫铀弹会诱发各种肿瘤疾病"],["B","该地区的风一向很大，贫铀弹爆炸产生的放射性粉尘会被风吹到40公里外的地方"],["C","在爆炸点150米范围内吸入放射性粉尘的士兵均出现了身体不适症状"],["D","爆炸事件发生后，路过该地的某居民没有出现明显的不适状况"]],"a":["B"],"an":"指出粉尘会被吹到更远，反驳了专家的150米范围说。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0926","type":"single","t":"当鸟类面临栖息地破坏、天敌威胁和环境污染等生存压力时，自身就会分泌一种名为皮质醇的激素。因此，经常处于生存压力状态下的鸟类，其羽毛会变得较为稀疏。以下哪项如果为真，能够支持上述论证?","o":[["A","鸟类体内的皮质醇含量可能会因全球变暖而发生变化"],["B","一些鸟类更换栖息地后，体内的激素水平会提高"],["C","皮质醇会影响鸟类羽毛的生长和代谢"],["D","如果鸟类的羽毛变得稀疏,则它们一定处于长期的压力状态"]],"a":["C"],"an":"在皮质醇和羽毛稀疏之间建立联系。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0927","type":"single","t":"某国政府在半年内两次宣布降低购房按揭贷款的利率，因此很多潜在的购房者都处于持币待购的状态，进一步观望利率能否再探新低，所以六月份新建房屋的销售量大幅下降，但是，一个值得关注的现象是，在新建房屋销售量大幅下降的同时，新建房屋销售的平均价格却在快速上涨。以下哪项如果为真，能解释这一矛盾现象?","o":[["A","新建高价房处于热销中，价格一路上涨，因为高价房的购买者基本不受利率波动的影响"],["B","受利率波动的影响，己购房者惜售手中的房屋，造成二手房的市场供应量不足"],["C","过去三年中，由于住房供应短缺的问题越来越严重，使得新建房屋的销售量一直在缓慢上涨"],["D","受国际市场的影响，一年来该国建筑材料价格不断波动"]],"a":["A"],"an":"高价房热销拉高了平均价格，解释了矛盾。","tp":"判断推理","d":"中"},
	{"i":"fjcs_0928","type":"single","t":"2011年某省广电产业实际创收收入达192.98亿元，同比增长32.33%。该省电影票房收入10.6亿元，同比增长45.24%。有线电视用户达1970.12万户，比上年末净增84.24万户。从结构分析:广告收入89.38亿元，占总创收的46.32%。有线网络收入53.18亿元，占总创收的27.55%。其他创收收入50.42亿元，占总创收比重达26.13%，同比增速达51.12%。101.2011年该省平均每月净增有线电视用户约多少万户?","o":[["A","7"],["B","12"],["C","8"],["D","164"]],"a":["A"],"an":"84.24÷12≈7。","tp":"资料分析","d":"中"},

	{"i":"fjcs_0932","type":"single","t":"以下关于2011年该省广电产业的描述正确的是:","o":[["A","电影票房同比增速低于广电产业整体增速"],["B","有线数字电视用户占有线电视用户比重接近七成"],["C","县级收入占总收入比重比上年有所上升"],["D","北部地区省以下实际创收超过15亿元"]],"a":["D"],"an":"北部地区92.34×16.71%>15亿元。","tp":"资料分析","d":"中"},

	{"i":"fjcs_0966","type":"single","t":"由于体制性障碍、城乡利益及农民工知识技能不足等原因，农民工一直是城市中的边缘群体，是没有真正融入城市社会的城市居民。当前，农民工家庭面临着经济层面、制度层面和文化层面三种相互关联、依次递进的社会融合问题。对这段文字理解不正确的是:","o":[["A","农民工在城市中一直处于非主流地位"],["B","农民工没有真正融入城市社会，城乡二元体制是因素之一"],["C","农民工与城市生活方式格格不入"],["D","农民工需要在经济、制度、文化层面融入城市社会"]],"a":["C"],"an":"“格格不入”表述过于绝对。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0967","type":"single","t":"目前我们的城市化道路走了一条不符合中国的道路，为什么?一是现有的城市发展是“关起门来搞城市化”，把农民关在城外，自己在城内搞现代化，这是为城市“锦上添花”，而不是搞农村“人口城市化”。二是我们在城市化道路上搞“天女散花”，强调大力发展小城镇，因为“小城镇，大战略”，能解决农村剩余劳动力的大问题。这是一种错误的战略选择和过时观念，实际上这是一种“离土不离乡”传统观念的延续，它实质上就是不愿意让让农民进大中城市，不许他们分亨大中城市积累的文明成果。这段文字的主要观点是:","o":[["A","城市化就是让农村人口城市化"],["B","城市化就是使农村人口进入大中城市"],["C","城市化就是让农民离土又离乡"],["D","城市化道路选择要考虑中国国情"]],"a":["D"],"an":"文段意在说明城市化道路选择要考虑中国国情。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0968","type":"single","t":"看待让社会公正问题，应防止落入平均主义这种无论在历史上还是在现实中都颇具诱惑力的窠臼中。虽然平均主义在某些领域是否适用的，但若将其推广到所有领域尤其是分配领域，否认人的差别而要求平均分享一切，最终只会扼制人的积极性，扼杀社会发展的活力，不利于社会公正的实现。这段话意在强调:","o":[["A","社会公正是相对的"],["B","平均主义是国人习惯的“窠臼”"],["C","平均主义适合非分配领域"],["D","追求社会公正并非要搞平均主义"]],"a":["D"],"an":"文段强调不能搞平均主义。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0969","type":"single","t":"据日本社会保障规定，失业完全无收入者，每月可领到一定数额的失业补助金。丧失劳动能力及无人赡养的老人除每月可领取补助以外，房租减收，用水、看病免费，市内交通费70岁以上全免、以下减半，若有未成年的子女，还另外增加补助金。凭这样几条，足可以维持基本的生活，根本无需上街去“流浪”。这段文字意在说明:","o":[["A","日本社会保障制度的完善"],["B","日本社会保障的基本目标"],["C","日本社会保障制度的具体内容"],["D","日本没有流浪者的原因"]],"a":["A"],"an":"文段主要说明日本社会保障制度完善。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0970","type":"single","t":"有朋友对我说，你们古董行不好，净卖假货，我深刻反省，究其原因，文物的文化含量太大，难以一目了然。自古文物收藏凭的是眼力，玩的是心跳，至少宋代以来许多国家就在真假之间争论，翻来覆去者并不罕见。历史上被判了死刑的文物又起死回生也不是凤毛麟角。由于人类对自身文化认知的局限而对文物发生错判，只要不是故意，情有可原。对该段文字理解有误的一项是:","o":[["A","非故意的卖假古董可以原谅"],["B","非故意的错判文物真假可以原谅"],["C","宋代以来许多国宝陷于真假之争"],["D","历史上有不少被判为赝品的古董又被鉴定为真品"]],"a":["A"],"an":"文段未提及非故意卖假古董可原谅。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0971","type":"single","t":"现在中文系的文学教学是普遍存在弊病的，突出的表现是:概论、文学史和各种理论展示的课程太多，作家作品与专书选读太少，结果呢，学生刚上大学可能还挺有灵气，学了几年后，理论条条有了，文章也会操作了，但悟性与感受力反而差了。这段文字不直接支持以下哪种观点:","o":[["A","中文系学生的“文气”在日益弱化"],["B","现在中文系的文学教学需要改革"],["C","现在中文系学生普遍缺少文学作品的阅读"],["D","现在中文系文学教学应大幅削减概论、文学史及理论课"]],"a":["D"],"an":"文段未说要大幅削减。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0972","type":"single","t":"高校社团活动现在遭到批评，批评的不是该不该有社团，而是高校对社团的经营方式。目前的高校社团组织应该改进，使参加社团的多数人受益，而不是少数人的成功。如果高校社团经营好了，在大学生培养中的作用就不只是“第二课堂”。这段文字意在说明:","o":[["A","高校社团的社会评价很差"],["B","高校社团的经营方式需要改进"],["C","高校社团不能满足于少数大学生的获益"],["D","高校社团的定位不是“第二课堂”"]],"a":["B"],"an":"文段强调经营方式需要改进。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0973","type":"single","t":"与营养餐相比，音体美教育的缺失似乎显得不那么迫在眉睫，这样的逻辑并不错。然而，换一个角度的话，或许能逼视出这种逻辑的不足:与物质匮乏相比，心灵缺乏滋养，难道不是一个至少同样重要的问题?我们有理由呼吁:各种慈善努力，无论官方或民间，务请聚焦贫困地区音体美的匮乏。从这段文字推出的错误结论是:","o":[["A","营养餐和音体美教育同为贫困地区学生所需要"],["B","贫困地区的音体美教育匮乏"],["C","作者认为营养餐比音体美教育更亟需"],["D","慈善事业对贫困地区的音体美教育关注不够"]],"a":["C"],"an":"作者并未比较营养餐和音体美教育。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0974","type":"single","t":"作为可再生新能源，风能具有无污染、永不枯竭、综合社会效益高、研发成本相对低等特点。然而，风能行业建设投资回收周期长，客观上需要长期、稳定的优惠政策保障。美国风能增长潜力很大，但因美政府对风能税收鼓励政策不稳定，使包括中国风能企业在内的国际投资者在美国风能市场的增长前景变得不确定。对这段文字理解不准确的是:","o":[["A","风能属于可再生新能源"],["B","风能行业的优势大于其劣势"],["C","美政府对风能企业的优惠政策不稳定"],["D","在美国投资的中国风能企业市场前景不确定"]],"a":["B"],"an":"文段未比较优势与劣势。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0975","type":"single","t":"在国际上，“医药代表”已经有近40年历史，已经被广泛认可和接受。作为传递药品安全使用信息的桥梁，“医药代表”扮演着非常重要的角色，他不仅给医务专业人员传递药品临床使用相关的知识，而且还收集临床药品使用情况，尤其是药品不良反应信息，反馈给药品生产企业，为下一步改进或研发新药提供宝贵线索。这段文字主要介绍的是:","o":[["A","医药代表的发展历史"],["B","医药代表的作用"],["C","关于医药代表的国际研究成果"],["D","医药代表的执业资格"]],"a":["B"],"an":"文段主要介绍医药代表的作用。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0976","type":"single","t":"一直以来，公立医院15%“药品加成”政策已被固化为“以药养医”顽疾，甚至滋生出“以药腐医”乱象，取消“以药养医”成为新医改的重头戏之一。作者认为“以药养医”是:","o":[["A","政府对公立医院的特殊政策"],["B","医疗价格虚高的原因"],["C","“以药腐医”的原因"],["D","“药品加成”政策的结果"]],"a":["D"],"an":"由文段可知“以药养医”是药品加成政策的结果。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0977","type":"single","t":"你身边有没有这样一群人?早上上班见面好，他在低头玩手机:中午同事吃饭闲聊，他低头玩手机;晚上朋友聚会叙旧，他还在低头玩手机，其实他没有那么忙，他可能是在“切水果”，可能是在“打小鸟”，更有可能是在刷微博、摇微信。移动互联网的应用、智能手机和平板电脑的普及，培养出了这样一群“指头族”，一群习惯通过手指看世界的人。以上文字的主旨最可能的是:","o":[["A","描述“指头族”的生活方式"],["B","描述“指头族”看世界的方式"],["C","说明“指头族”产生的原因"],["D","描述“指头族”的手机情结"]],"a":["A"],"an":"文段主要描述“指头族”的生活方式。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0978","type":"single","t":"“当你的微博‘粉丝’超过10万，你就是一份都市报;超过100万，你就是一份全国性报纸;超过1000万，你就是电视台”。以上文字意在说明:","o":[["A","微博平台出色的宣传功效"],["B","“粉丝”数量越多，对微博的作用越大"],["C","微博比报纸和电视更具宣传优势"],["D","“粉丝”是自媒体发展的重要推手"]],"a":["A"],"an":"强调微博的宣传功效。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0979","type":"single","t":"“理论研究一应用研究一商品生产(工程建设)一经济效益(社会效益)”的技术经济价值，传统的分工是高校的理科从事基础理论研究、工科从事应用研究，企业从事生产建设和相应的技术研究，各环节的创新活动是相对独立的，环节间的纵向协同创新较少，因而许多理论研究成果乃至应用研究成果被束之高阁。这个局面能否改变，对高校而言，关键在于学校和教师对科学研究的价值定位。如果价值定位是完成论文和科研课题，那么学校和教师就会将成果止步于学术期刊和实验室，难以产生与企业协同创新的愿望和内动力;如果价值定位是将研究成果应用于实际，那么学校和教师就会自发产生与企业合作的内驱力。作者最想说明的是:","o":[["A","对科学研究的价值定位影响着高校和教师科研成果的转化"],["B","科研成果的应用价值是高校与企业协同创新的内在动力"],["C","应该打破将研究成果束之高阁的不利局面"],["D","只有将研究成果应用于实际，科学研究才有价值"]],"a":["B"],"an":"强调应用价值是协同创新的内在动力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0980","type":"single","t":"随着时代的进步，生态文明越来越得到国际社会的普遍认同，正如国外学者所指出的，“没有环境保护的繁荣是推迟执行的灾难”;不保护环境，经济就会陷入“增长的极限”;通过保护环境优化发展，经济则会有“无限的增长”。对“没有环境保护的繁荣是推迟执行的灾难”的准确理解是:","o":[["A","没有环境保护的经济发展势必带来生态文明的灾难"],["B","没有环境保护，经济繁荣只会昙花一现"],["C","经济发展一定会造成环境破坏"],["D","有了环境保护，经济才会有持续的发展"]],"a":["A"],"an":"强调没有环保的经济发展会带来生态灾难。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0981","type":"single","t":"“低碳农业”是以“低消耗、低污染、低排放、高品质、高效益”等“三低、两高”为特征的现代农业。彻底转变农业发展方式，合理高效利用资源和能源，建立清洁能源结构和实施清洁生产，并促进能源和资源利用技术创新、制度创新和可持续发展。显然，低碳农业是低碳经济在农业发展中的实现形式，是维护全球生态安全、改善全球气候条件，在农业领域推广节能减排技术、开发生物质能源和可再生能源的农业，具备“持续生产、安全保障、品质优良、调节气候、生态涵养”等多元功能。根据这段文字，对“低碳农业”理解不正确的是:","o":[["A","“低碳农业”具有多方面的功能"],["B","“低碳农业”是现代农业的一种表现形式"],["C","“低碳农业”是农业发展的理想目标"],["D","“低碳农业”是实现低碳经济的形式之一"]],"a":["B"],"an":"低碳农业本身是现代农业，而非表现形式。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0982","type":"single","t":"作为一套复杂、动态的监管系统，实名制的各个步骤环环相扣，相互影响。如果执行与监管不到位，就算制度设计得再周详，也会形同虚设。最近，周围不少朋友抱怨实名成了“睁眼瞎”。有人上医院挂号，发现实名制下，号贩子依然猖獗，挂号依然难于上青天;还有人坐火车，发现根本没人验票，实名制对票贩子成了摆设，倒是给乘车人增添了不少麻烦。近年来，越来越多的服务领域开始实施实名制。实名制是通过真实身份信息验证来分配服务资源的一种方式，它并不改变服务资源的供应量，在缓解供求矛盾中，算是一种需求侧管理。第4段加横线的句子“消费手续、服务流程、监管步骤缺一不可”的意思是:","o":[["A","只有消费者、服务者、监管者相互配合，实名制才会事半功倍"],["B","消费者、服务者、监管者缺一不可"],["C","消费手续、服务流程、监管步骤缺一不可"],["D","消费手续、服务流程、监管步骤要环环相扣"]],"a":["A"],"an":"强调三者配合才能发挥实名制效应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0983","type":"single","t":"对文章主旨表述最直接并最准确的是:","o":[["A","实名制的执行需要多方联动"],["B","如果执行与监管不到位，实名制将形同虚设"],["C","应该加强对实名制的监管"],["D","越来越多的服务领域开始实施实名制"]],"a":["B"],"an":"文章主要论述执行与监管不到位实名制会形同虚设。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0984","type":"single","t":"对于实名制执行过程中出现的问题，作者的态度是:","o":[["A","抱怨"],["B","批评"],["C","理解与宽容"],["D","无所谓"]],"a":["C"],"an":"作者认为对新制度的遗憾应多一些理解与宽容。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0985","type":"single","t":"关于合理饮食有利于健康的下列说法正确的是:","o":[["A","没有水就没有生命"],["B","饮用水越纯净越好"],["C","调味剂和营养剂加得越多越好"],["D","养成良好的饮食习惯，多吃蔬菜、水果等碱性食物"]],"a":["D"],"an":"A与题意无关，B、C说法错误。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0986","type":"single","t":"食用菌是可供人类食用的大型真菌。世界第一大食用菌是:","o":[["A","金针菇"],["B","木耳"],["C","蘑菇"],["D","香菇"]],"a":["C"],"an":"蘑菇是世界第一大食用菌。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0987","type":"single","t":"人体汗腺分布最多的部位是:","o":[["A","腋窝"],["B","腹股沟"],["C","阴部"],["D","手掌和脚底"]],"a":["D"],"an":"手掌和脚底汗腺分布最多。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0988","type":"single","t":"微博在汇聚民众智慧的同时，也可能成为谣言散布的途径。从传播学的角度看，事件越重要、事实越不清楚，传播的就越快越广，谣言的危害也就越大.“谣言=(事件的)重要性X(事件的)模糊性X公众的判断能力。”因此，当有重要事件发生时:①大众应避免盲从，要有理性判断②传媒应承担社会责任，防止消息扩散③个人应尽快传播，自由行使权利④政府应及时发布信息，谣言止于公开。","o":[["A","①②"],["B","①④"],["C","②③"],["D","②④"]],"a":["B"],"an":"①和④正确，②中防止消息扩散错误，③中尽快传播错误。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0989","type":"single","t":"从2012年10月8日起，A市正式实施机动车工作日高峰时段区域“错峰限行”交通管理措施。A市交警部门规定，该措施实施第一周，对于违禁上路车辆以提示、教育、警告为主，适应期过后，严格执行管理。对上述事件最合理的概括是:","o":[["A","转变职能，加强监管"],["B","以人为本，合理行政"],["C","合法行政，廉洁高效"],["D","民主执政，科学执政"]],"a":["B"],"an":"体现以人为本、合理行政。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0990","type":"single","t":"经过改革开放30多年来的努力，中国人民享受了前所未有的开放和自由，中国的人权事业取得了举世瞩目的成就。中国政府高度重视人权的根本原因是:","o":[["A","中国全面落实依法治国的方略"],["B","国家最高权力机关是人民代表大会"],["C","我国人民民主具有真实性"],["D","我国是人民当家做主的社会主义国家"]],"a":["D"],"an":"我国是人民当家作主的社会主义国家。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0991","type":"single","t":"职业精神与人们职业活动紧密联系，是具有自身职业特征的精神。我国公务员职业精神的本质是:","o":[["A","恪尽职守"],["B","诚实守信"],["C","公而忘私"],["D","服务人民"]],"a":["D"],"an":"服务人民是公务员的本质要求。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0992","type":"single","t":"先秦两汉时期成就最高、影响最大、通过人物描写来反映历史面貌的作品是:","o":[["A","《左传》"],["B","《史记》"],["C","《国语》"],["D","《国策》"]],"a":["B"],"an":"《史记》是第一部以人物描写为中心的通史。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0993","type":"single","t":"汉武帝在位初年，西汉国库中积蓄了大量的粮食和财钱，这说明了:","o":[["A","封建统治者注意休养生息,政府开支较少"],["B","生产力高度发达,出现了大量剩余产品"],["C","封建政府征收重税，聚敛了大量财富"],["D","地主剥削较轻，社会公共财富比较充裕"]],"a":["A"],"an":"汉初休养生息政策使国库充实。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0994","type":"single","t":"“从物到感觉和思想”与“从感觉和思想到物”是两条根本对立的认识路线，它属于:","o":[["A","辩证法与形成上学的对立"],["B","唯物主义反映论与唯心主义先验论的对立"],["C","可知论与不可知论的对立"],["D","辩证唯物主义与旧唯物主义的对立"]],"a":["B"],"an":"前者是唯物主义反映论，后者是唯心主义先验论。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0995","type":"single","t":"古诗云:“王子去求仙，丹成入九天。洞中方七日，世上已千年。”这是用神话形式说明时间:","o":[["A","是客观的"],["B","是有限的"],["C","是可知的"],["D","是相对的"]],"a":["D"],"an":"说明时间是相对的。","tp":"常识判断","d":"中"},

	{"i":"fjcs_0997","type":"single","t":"一个天真的孩子听妈妈讲故事。妈妈对他讲鲸鱼是现在生存在海洋里体积最大的动物,比大象大得不知有多少。孩子天真的问妈妈:那鲸鱼一定是最大的鱼了?妈妈笑着说他错了，那么，孩子错在哪里呢?","o":[["A","鲸鱼并不是海洋里现存的最大的动物"],["B","鲸鱼不生活在海洋里"],["C","鲸鱼其实不是鱼,是一种哺乳动物"],["D","现在已经不存在鲸鱼了"]],"a":["C"],"an":"鲸鱼是哺乳动物，不是鱼。","tp":"常识判断","d":"中"},

	{"i":"fjcs_1045","type":"single","t":"血浆包括各种矿物质、糖类、脂类、蛋白质、激素和维生素等。在上述各种物质中，造成血液颜色为红色的是:","o":[["A","激素"],["B","蛋白质"],["C","糖类"],["D","维生素"]],"a":["B"],"an":"血红蛋白是蛋白质，使血液呈红色。","tp":"常识判断","d":"中"},

	{"i":"fjcs_1048","type":"single","t":"中国是世界上稀土资源最丰富的国家，素有“稀土王国”之称。下列关于稀土的表述，错误的是:","o":[["A","稀土一般是以氧化物状态分离出来的，稀土的得名是因为很稀少"],["B","美国是稀土的主要使用国，目前中国出口的稀土数量居全球之首"],["C","我国是稀土资源储藏大国，也是稀土产品生产、应用和出口大国"],["D","我国的稀土储量占世界稀土储量的百分比近年来因开发已经下降"]],"a":["B"],"an":"日本是稀土主要使用国。","tp":"常识判断","d":"中"},

	{"i":"fjcs_1050","type":"single","t":"欧盟《传统植物药注册程序指令》大限将至，中药出口欧洲遭遇严冬，人们不禁对中药产生了不小的怀疑。这其中确有中药自身种植、生产加工不统一的原因，致使药效和安全性能受到国际市场，但究其深层原因，则与国际中药市场暗藏的利益争夺不无关系。依次填入划横线部分最恰当的一项是:","o":[["A","标准化 排斥"],["B","现代化 指责"],["C","产业化 发难"],["D","国际化 质疑"]],"a":["D"],"an":"中药出口欧洲遭遇严冬，直接受影响的是国际化。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1051","type":"single","t":"在多元文化语境下，出现的情感价值取向实属正常现象，我们充分尊重个人的情感选择。但是，过度情感的极端自由、极端物欲，其实会给个人的幸福带来许多内伤。依次填入划横线部分最恰当的一项是:","o":[["A","林林总总 鼓吹"],["B","琳琅满目 渲染"],["C","纷繁芜杂 追逐"],["D","标新立异 强调"]],"a":["A"],"an":"“林林总总”形容种类繁多，符合情感价值取向多样性。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1052","type":"single","t":"及时纠偏，纠错，不仅体现一个社会的集体智慧，也是一个国家理性力量的表现。就像当初如能认识到人口问题的严重性，今天解决人口超负荷的难度就会低得多。因此，从及时纠错的现代理性角度看，适度容忍不同声音是相当必要的，多元价值的重要意义之一便是达到某种以免在一个方向上走得太远而使纠错成本过大。依次填入划横线部分最恰当的一项是:","o":[["A","尽早 制衡"],["B","彻底 均衡"],["C","公开 均势"],["D","坦诚 和谐"]],"a":["A"],"an":"“尽早”与“及时”对应，“制衡”与多元价值对应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1053","type":"single","t":"在知识大爆炸的今天，不少人已习惯于浅阅读，这虽在所难免，其____也是明显的。浅阅读虽能够收获一些印象式的谈资,但______之中透露出的是浮躁心气,很难为提升阅读者主体素质的扎实“文化准备”。依次填入划横线部分最恰当的一项是:","o":[["A","代价 走马观花 转换"],["B","影响 浅尝辄止 汲取"],["C","弊端 浮光掠影 沉淀"],["D","局限 言谈举止 锤炼"]],"a":["C"],"an":"“弊端”对应浅阅读的缺点，“浮光掠影”对应浅阅读。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1054","type":"single","t":"负面新闻并不是永远都制造______，从商业角度看，负面宣传在某种情况下可以______销售,尤其在公司和产品不知名的情况下。曾有研究者发现,如果某些书籍的作者让读者感觉______，书被评为劣作却能起到相反的效果一一它们的销量增加了45%。依次填入划横线部分最恰当的一项是:","o":[["A","防害 促进 亲切"],["B","损失 带动 熟悉"],["C","悲剧 刺激 陌生"],["D","难题 提高 冷淡"]],"a":["C"],"an":"第三空与“不知名”对应“陌生”。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1055","type":"single","t":"优秀的企业需要什么样的员工?他们需要的不仅仅是______的员工，更需要员工发挥其聪明才智。如果领导者不能充分信任员工、激励员工，很多员工并不会多走一步，主动承担责任，为企业做出额外的贡献。即使员工能对上司的吩咐一五一十地执行，不会消极怠工，但也绝不会主动______。依次填入划横线部分最恰当的一项是:","o":[["A","朝气蓬勃 完成"],["B","兢兢业业 工作"],["C","脚踏实地 改进"],["D","言听计从 创新"]],"a":["D"],"an":"与“一五一十地执行”对应“言听计从”。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1056","type":"single","t":"对于吸引人才，地方政府最应该做的，是营造一个适合人才流动、有利人才成长的环境与空间，而不是直接参与、甚至______企业的人才录用过程。其实，自由、公平的竞争本身就是对人才最好的回报，足够的成长空间才是吸引人才、留住人才的沃土。依次填入划横线部分最恰当的一项是:","o":[["A","主导 长久"],["B","干预 直接"],["C","破坏 长期"],["D","影响 有效"]],"a":["A"],"an":"“主导”比“参与”程度更深。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1057","type":"single","t":"文具行业以其覆盖面广、技术含量低、进入门槛极低、投资少见效快、市场需求大等因素吸引许多中小企业纷纷投资，但有些企业为了单纯扩大______，采取降价策略，屡屡造成国际贸易______，这些问题亟须引起有关部门重视并加以调控。依次填入划横线部分最恰当的一项是:","o":[["A","效益 纠纷"],["B","规模 争端"],["C","产量 矛盾"],["D","出口 摩擦"]],"a":["D"],"an":"“国际贸易摩擦”为固定搭配。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1058","type":"single","t":"如果全球变暖导致海平面大幅上升，和其他国家一样，中国将要______被海水淹没地区的人口，特别是长江下游河段，或者建造大坝保护地处低洼地区的沿海城市，这些都需要巨大的花费。中国和其他国家面临的挑战是限制二氧化碳的排放，从而______全球变暖所导致的最坏结果的发生，这在未来20年里更加重要。依次填入划横线部分最恰当的一项是:","o":[["A","转移 阻止"],["B","控制 避免"],["C","延缓 减少"],["D","安置 改变"]],"a":["A"],"an":"“转移人口”“阻止结果发生”搭配恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1059","type":"single","t":"龙马负图、神龟载书，远古时代河图洛书的传说，数千年来被认为是中华传统文化的源头。河图出于河南洛阳市的孟津县，人们对它已是______，而洛书出于何处，一直______，没有定论。依次填入划横线部分最恰当的一项是:","o":[["A","无可厚非 莫衷一是"],["B","了然于胸 疑窦重重"],["C","如数家珍 扑朔迷离"],["D","妇孺皆知 影影绰绰"]],"a":["B"],"an":"“了然于胸”指心里明白，“疑窦重重”指有很多疑问。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1060","type":"single","t":"当然，想象并不是凭空______的。丰富的想象来源于知识的广博和平时对生活深入、细致的观察。观察就要用专业的角度去关注、______周围的事物，有意识地汲取、思索、分析，看在眼里，记在心里。依次填入划横线部分最恰当的一项是:","o":[["A","杜撰 体验"],["B","虚构 体味"],["C","捏造 体会"],["D","臆造 体察"]],"a":["D"],"an":"“臆造”指凭主观想法编造，“体察”指体验观察。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1061","type":"single","t":"从社会学的眼光看，重复博弈的结果之一可能是博弈双方由陌生人变为熟人，甚至成为______，并发展出超越当下经济互动关系之外的其他社会关系。假如当前的经济互动关系只不过是发生在双方之间的多种社会交往之中的一种，其他社会交往就可能______当事人在当下博弈中的策略选择。依次填入划横线部分最恰当的一项是:","o":[["A","伙伴 加快"],["B","搭档 操纵"],["C","朋友 影响"],["D","同僚 改变"]],"a":["C"],"an":"“朋友”比“熟人”更深，“影响”选择。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1062","type":"single","t":"情报专家巴克斯特在给花草浇水时，脑子里突然出现了一个______的念头，也许是经常与间谍、情报打交道的缘故，他竟______地把测试仪器的电极绑到一株天南星植物的叶片上。结果他惊奇地发现，当水从根部徐徐上升时，测试仪上显示出的曲线图形居然与人在激动时测到的曲线图形很相似。依次填入划横线部分最恰当的一项是:","o":[["A","古怪 异想天开"],["B","奇怪 突发奇想"],["C","怪异 浮想联翩"],["D","奇特 心血来潮"]],"a":["A"],"an":"“古怪”程度深，“异想天开”指荒唐离奇的想法。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1063","type":"single","t":"“查清中国海，进军三大洋，登上南极洲”是曾经的海洋梦想“老三样”，这个梦想也只是在本世界初才得以实现。但限于当时的能力，主要做的是海洋的表面文章，对于海面之下隐藏的深海神秘世界，则只是______。依次填入划横线部分最恰当的一项是:","o":[["A","完整 浅尝辄止"],["B","部分 走马观花"],["C","彻底 浮光掠影"],["D","具体 蜻蜓点水"]],"a":["A"],"an":"“完整”与“表面文章”对应，“浅尝辄止”指不深入。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1064","type":"single","t":"国际市场疲软给中国经济带来了不确定性。面对外汇资产缩水风险、出口贸易受到影响和输入性通胀压力上升等______，中国需要______考量应对，谋定而后动。制定短期和中长期的、货币和财政的、战略和战术的、经济和政治的“中国对策”。依次填入划横线部分最恰当的一项是:","o":[["A","困境 郑重 迫在眉睫"],["B","考验 审慎 刻不容缓"],["C","局面 仔细 急如星火"],["D","局势 认真 十万火急"]],"a":["B"],"an":"“考验”符合，“审慎”指谨慎，“刻不容缓”指情势紧迫。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1065","type":"single","t":"想法或假说的产生，来源于研究者的思想，用来解释事物的成因，寻找或构造相关的______以便揭示所观察到的事实的真相。因而，假说完全有可能是______的。知道这一点，养成产生想法时保留判断的习惯就非常重要。依次填入划横线部分最恰当的一项是:","o":[["A","自由 证据 错误"],["B","主观 定律 歪曲"],["C","特别 学说 荒谬"],["D","独立 理论 虚假"]],"a":["A"],"an":"“证据”证明事实，“错误”对应保留判断。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1066","type":"single","t":"新闻媒介是沟通社会与政府的重要桥梁，在政务信息传输系统中具有______的作用。但体制转型的压力，加之巨大利益的诱惑及制度缺失，给记者的职业操守带来巨大______。各种虚假报道不时见诸报端，成为小道消息的渊薮。因此我们必须不断完善新闻从业人员资格准入制度及新闻评估核实制度。依次填入划横线部分最恰当的一项是:","o":[["A","独一无二 冲击"],["B","独树一帜 影响"],["C","无与伦比 挫折"],["D","无可厚非 挑战"]],"a":["A"],"an":"“独一无二”强调重要性，“冲击”指带来负面影响。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1067","type":"single","t":"对于一个经历过贫困童年的富翁来说，他的消费行为有时显得______。对于大金额的支出，他会随随便便，甚至显得有些铺张浪费;而对于小金额的支出，他则不得不与自己的吝啬性作斗争。依次填入划横线部分最恰当的一项是:","o":[["A","变幻莫测 积重难返"],["B","出人意料 与生俱来"],["C","反复无常 根深蒂固"],["D","不可思议 始终如一"]],"a":["C"],"an":"“反复无常”指变化不定，“根深蒂固”指贫困童年留下的深刻影响。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1068","type":"single","t":"前些年翻看先生的这本书时，尽管自己对民国话题有着欲说还休的浓厚兴趣，对这本话语剪辑独出心裁的编排方式下潜藏的______常常默契会心，但读完仍是感到______。依次填入划横线部分最恰当的一项是:","o":[["A","至理名言 戛然而止"],["B","妙言要道 耳目一新"],["C","不经之谈 百读不厌"],["D","微言大义 意犹未尽"]],"a":["D"],"an":"“微言大义”指精微的语言包含深刻道理，“意犹未尽”指读后还想读。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1069","type":"single","t":"对城市建设焕然一新的追求，不仅会使城市记忆受到损坏甚至毁灭，也是对城市中人的生活情感的______。城市中长期积淀形成的文化风格和人文环境，被当作了“过时”的东西予以______或抛弃，城市记忆也因此没有了依托对象，公众的情感认同无法被唤起，在心灵上就会出现______的不安状态。依次填入划横线部分最恰当的一项是:","o":[["A","轻视 改造 居无定所"],["B","淡忘 分解 无依无靠"],["C","漠然 整饬 孤苦伶仃"],["D","亵渎 批判 举目无亲"]],"a":["A"],"an":"“轻视”情感，“改造”或抛弃，“居无定所”指没有依托。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1070","type":"single","t":"解决城市交通可以尝试一种新机制:公交因为承担着为低收入者、环保人士等提供社会公益性服务的职能，由政府购买公交服务，低价提供给公众;个体自行车出行或纳入到政府购买体系，或推行自行车优先措施;出租车因为价格的高低并不会影响需求者对出租车这种出行方式的选择，所以自然由开放的竞争市场来提供相应服务;对小汽车的使用者可以征收道路使用费，使交通拥堵的外部性内化。这种机制的实施，还要求有配套措施:比如完善公交优先基础设施、鼓励拼车行为、恢复或建设自行车道、制定针对绿色出行的政策法规，引导和鼓励绿色出行方式等。对文中的“新机制”最恰当的概括是:","o":[["A","“主体一配套”机制"],["B","“多元一环保”机制"],["C","“保障一市场”机制"],["D","“公平一高效”机制"]],"a":["C"],"an":"文段强调保障与市场结合。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1071","type":"single","t":"我们说儒家是道德至上或者道德决定论的时候，是一种宏观上的总体定性和评价。所谓“子罕言利”或者“小人喻于利”，是着眼于人作为一种道德存在、超越存在的“应然”特质而立论，所拒斥和鄙夷的只是“不义而富且贵”。具体到关乎民生的问题，儒家并非不言利、否定利，而是主张让利于民，惠民富民;并非认为道德决定民生，而是认为民生决定道德。根据这段文字，以下说法正确的是:","o":[["A","儒家认为“利”在不同历史时期有不同的含义"],["B","儒家的民生观不是空谈道德而是强调以民为本"],["C","儒家认为道德与民生并不对立，而是相互促进"],["D","在民生问题上，儒家倡导道德至上"]],"a":["B"],"an":"儒家强调民生决定道德，以民为本。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1072","type":"single","t":"“真实”是指事实、真理，它可以用于客观事物:自然、社会、个人;它的反面是虚假，是不真。“真诚”也是“真”，但是指主观意识领域里的真，它仅涉及人，而且是主体的个人，它强调的是向内反省，要求的是忠实于自己，是不欺己、不欺心，这就好像内心有一个法官在检查所有的意识和念头，看它们是真的发自内心，还是一些浮在表层的托辞和借口。彻底的真诚要求一个人能鉴别和杜绝一切有意无意哄骗自己的念头，在行为上就反映为:言其真心所欲言，行其真心所欲行。这段文字意在说明:","o":[["A","“真实”与“真诚”的区别"],["B","“真诚”的本质含义及外部表现"],["C","“真诚”行为属于主观表现因而难以鉴别"],["D","如何使“真实”与“真诚”实现内在统一"]],"a":["B"],"an":"文段主要介绍“真诚”的含义和表现。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1073","type":"single","t":"今后，技术的交叉与融合会越来越明显。新一轮科技和产业革命的方向不会仅仅依赖于一两类学科或某种单一技术，而是多学科、多技术领域的高度交叉和深度融合。技术融合趋势决定了战略性新兴产业不可能也不应该孤立地发展，而是既要有利于推动传统产业的创新，又要有利于未来新兴产业的崛起。而且，战略性新兴产业与其他产业之间、战略性新兴产业内部之间的融合也是大势所趋，这将使得行业间的界限越来越模糊，综合竞争力越来越强。这段文字主要说的是:","o":[["A","战略性新兴产业的发展需要顺应技术融合的新趋势"],["B","未来行业的界限会变模糊但综合竞争力会增强"],["C","提高综合竞争力将是未来产业发展的主要目标"],["D","战略性新兴产业是促进新一轮科技和产业革命的主力军"]],"a":["A"],"an":"主旨是战略性新兴产业要顺应技术融合趋势。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1074","type":"single","t":"在市场经济条件下，企业要想达到自身获利的目的，必须首先生产或提供对他人有价值的东西。如果企业置他人利益于不顾，采取欺骗的手段进行不正当交换，不仅不被社会容忍，而且要受到法律惩罚。市场经济内在地要求企业遵循诚信、公平、负责等交换准则。这些交换准则，内含着维系和推动企业发展的道德力量。换言之，不具备道德力的企业、不对他人或社会负责任的企业，终将被淘汰出局。这段文字意在说明:","o":[["A","提升企业道德力，是市场经济健康发展的内在要求"],["B","提升企业道德力，是为了增强企业责任感和使命感"],["C","提升企业道德力，是现代企业持续发展的必要条件"],["D","提升企业道德力，是企业避免受到法律惩罚的手段"]],"a":["C"],"an":"强调道德力是企业持续发展的必要条件。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1075","type":"single","t":"隋唐时期的三彩陶器，标志着彩釉陶器的横空出世，同时也开启了中国陶器与西域的交流。襟怀宽广的大唐盛世，借鉴了中亚、南亚诸国的金银器造型及工艺，丰富了中国壶具的型制与装饰语言。长沙窑的盘口壶、广口壶，还有更具代表性的执壶等名声显赫的中国陶瓷，则通过陆上、海上两条途径实现了向西辐射至阿拉伯与欧洲、非洲，向东延伸到日本、朝鲜及东南亚诸国的商品与文化输出，并深刻影响了这些国家民众的生活方式。这段文字主要介绍了:","o":[["A","唐代文化艺术交流对其他国家产生影响"],["B","陶器发展的历程闪现着文化交流的光辉"],["C","唐代陶器吸收国外工艺并向全世界输出"],["D","陶制壶具的输出影响当地居民生活方式"]],"a":["B"],"an":"主要介绍陶器发展中的文化交流。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1076","type":"single","t":"学术评价中，往往交织着主客观的各种复杂因素。由于学术评价常受到评价主体学术观点、情感倾向、价值观等因素的影响，所以人们倾向于依靠量化数据进行评价。事实上，这类数据所包含的评价意义是由点击者、下载者、引用者体现出的，过度倚重这类数据就是把量化数据的制作者当成了评价主体。这段文字意在说明:","o":[["A","以量化指标为标准的评价体系备受争议"],["B","在进行学术评价时不能过多依赖量化数据"],["C","正确的学术评价需要经历很长的历史过程"],["D","经得住实践检验的学术评价才是可靠的"]],"a":["B"],"an":"强调不能过多依赖量化数据。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1077","type":"single","t":"近几年中国的投资环境发生了根本性的变化，劳动力成本上升、劳动保护加强、土地成本上升、环保成本上升、能源资源使用成本上升、优惠政策取消，外资企业需要在更高的成本上与内资企业竞争，这是外资企业必须正视的事实和趋势。但要素和能源资源成本上升，伴随的是生产方式和经济结构的提升，意味着经济发展水平和人民生活水平的提高，也意味着市场规模的扩大。取消优惠政策，不是对外资实行歧视政策，也意味着市场规模的扩大。取消优惠政策，不是对外资实行歧视政策，而是为了实行国民待遇，是为了挤出低效率企业，给市场公平竞争的机会。由这段文字可以推出:","o":[["A","中国的投资环境在朝良性发展的方向转化"],["B","生产成本的增加可以促使外资更加注重效率"],["C","取消外资优惠政策是对国内外企业负责任的举措"],["D","外资企业应抓住近年市场规模扩大的发展好时机"]],"a":["A"],"an":"文段说明投资环境向良性发展。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1078","type":"single","t":"有人说，传统小说是依赖经验的写作，而网络小说是依赖想象的写作。看来，这两种写作需要找到一个结合点，依赖经验的写作需要吸纳网络小说的想象，而依赖想象的写作则需要糅入传统小说中丰厚充实的经验。因此，当今的文学要从原创力日益萎缩的窘境中走出来，作家们增加生活经验的积累应该是一个非常关键的举措。但这还只是由经验通往原创力的第一步，接下来必须在体验上进行认真的修炼，使生活经验转化为心灵体验，使客观的经验世界转化为作家主观的心灵世界。这段文字重点强调的是:","o":[["A","如何转化经验吸纳想象"],["B","怎样找到传统和网络小说的结合点"],["C","作家应该如何不断地积累生活经验"],["D","如何提高文学的原创力"]],"a":["D"],"an":"重点强调提高文学的原创力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1079","type":"single","t":"①上海海纳百川、兼容并蓄的特征也开始初露端倪②历史上的上海，处于传统江南文化的边缘地位③来自各地的商帮，如浙江的宁波帮、绍兴帮，湖南的洞庭商帮，广东潮州帮，福建泉漳帮等活跃在上海④从经济地理角度而言，上海距离素称“鱼米之乡”的苏杭尚有相当距离，在以农耕文明为主体的传统社会中自然不占突出位置⑤在这样的历史条件下，作为政治、经济、文化三重边陲的上海，尚无法在以苏杭为代表的江南主流文化方面有什么建树⑥虽然在文化上处于边缘地位，但由于优越的地理条件，上海在明清时期已经成为江南重要的商业市镇之一将以上6个句子重新排列，语序正确的是:","o":[["A","④②⑤⑥①③"],["B","①⑤④③②⑥"],["C","⑥③②④⑤①"],["D","②④⑤⑥③①"]],"a":["D"],"an":"②句引出上海，④⑤说明其边缘地位，⑥转折说明成为商业市镇，③举例，①总结。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1080","type":"single","t":"①第一本防水平装书还将拥有强大的防伪功能②澳大利亚的银行现在已经使用该项技术来延长纸币的使用寿命，同时减少伪造的风险③英国出版商近日透露，世界上第一本防水平装书有望明年夏天上架销售④书的外面还有一层防撕毁的坚韧的聚合物涂层，整本书的架上寿命可以由此增加两倍⑤据了解，防水平装书将采用先进的防水技术，外面包裹透明的蜡封，这样即便书潮湿了，字迹也不会模糊，书页也不会损毁⑥这将是此技术首次应用于普通平装书。目前，只有专业的潜水可以做到完全防水将以上6个句子重新排列，语序正确的是:","o":[["A","③⑤④⑥②①"],["B","③①②⑤④⑥"],["C","⑤①②④⑥"],["D","⑤④⑥②①③"]],"a":["A"],"an":"③引出话题，⑤④介绍技术，⑥②说明应用，①补充防伪功能。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1081","type":"single","t":"历史学家的工作对象是史料，这些史料主要是各种文献、遗存，它们可以归为广义上的文本，而且最终它们都要以语言形式进入史家的研究。就此而论，历史学家永远无法真正直接接触到过去本身，而只能借助于各种历史文本而对过去有所言说，因而______。填入划横线部分最恰当的一项是:","o":[["A","文本性就是历史学家的全部工作所无法脱离的樊篱"],["B","无法接触完整的史料对历史学家来说是一种遗憾"],["C","对史料本身的收集和考证就成了史学客观性的保证"],["D","重建和还原历史的本来面目就成了历史学的根本目的"]],"a":["A"],"an":"强调历史学家离不开文本。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1082","type":"single","t":"人生不可能是尽善尽美的。我们也很难找到一朵花是完美无缺的。虽然人体总的来说是左右对称的，可是这种对称远远不是完全的。每个人左右手的粗细不一样，一只眼睛比另一只眼睛更大或更圆，两个耳垂的形状也不同。最明显的，就是每个人只有一个心脏，通常都在靠左的位置。这段文字是一篇文章的开头，文章接下来最可能讲述的是:","o":[["A","弥补不对称缺憾的诸多方式"],["B","人生中的不完美也能转换为完美"],["C","不对称也能产生和谐与平衡的美感"],["D","人体之所以产生不对称现象的生理基础"]],"a":["C"],"an":"接下来可能讲述不对称的美感。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1083","type":"single","t":"18世纪产业革命以后，能源的大量开发利用成为各国经济发展的主流，其开发程度的规模直接决定了一国经济的增长，特别是煤炭的大规模开发利用和大量廉价石油的供应改写了工业化国家的经济发展史。经济学研究的能源战略也主要是如何以不断增长的能源供给保证经济社会发展日益增长的需求，而任何提高能源消费水平的研究和开发都被认为是不合算和不经济的。这种能源战略对鼓励人们开发利用能源、保证工业化国家基础建设和工业的高速增长起了积极作用，但对开发能源不作限制，造成了能源资源的破坏和浪费，形成了到现在还无法根治的环境污染和公害。根据这段文字，以下说法正确的是:","o":[["A","能源战略的经济意义远远不能抵消其对环境造成的危害"],["B","18世纪后的能源开发战略追求对能源的无限制开发和利用"],["C","煤炭和石油的开发程度是一国经济发展的标志"],["D","能源开发缺乏合理的规划使产业革命后的能源开发陷入无序"]],"a":["B"],"an":"文段提到对开发能源不作限制。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1084","type":"single","t":"数学方法是西方科学中极其重要和不可或缺的方法。严谨和精确是科学精神的重要组成部分，而严谨和精确在很大程度上是由数学方法带来的。科学要求各种概念尽可能被定量且能以一定的精确性加以检验。定律和定理的精确性体现在它的数学表达上。实验测定值与定律和定理的数学推定值二者的符合或接近，是定律和定理得以成立的主要依据，也是定律和定理令人信服的主要原因。长期以来形成的观念是:一门学科如果不能“数学化”，就算不得精确学科，或被认为是不成熟的学科。对这段文字的主旨概括最准确的是:","o":[["A","数学化是衡量科研成果的标准"],["B","数学表达使定律和定理更精准"],["C","数学方法是使科学精准化的手段"],["D","数学的魅力在于严谨和精确"]],"a":["C"],"an":"主旨是数学方法使科学精准化。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1085","type":"single","t":"公元1616年，莎士比亚与汤显祖同年逝世。二人都可算作16、17世纪之交的伟大剧作家。二人都爱写剧本，不过写法却不大一样。比如《罗密欧与朱丽叶》故事临近结尾，一双恋人殉情身亡，惨烈的悲剧以双方家族的和解收尾。和解的意愿的确美妙，只可惜，莎翁用于和解的笔墨太过不经意，仿佛仅仅为了“和解”的概念草草应付收场。《牡丹亭》里的杜丽娘，因梦中的相遇而思，而哀，而死，又因此而还生，而圆满。汤显祖将笔墨挥洒于爱而不耗损于恨，推敲于柔美而不沉醉于暴力，他笔下的爱，期待、给予、容纳、无嗔。这段文字的主旨是:","o":[["A","阐述莎士比亚和汤显祖的伟大之处"],["B","分析《牡丹亭》独特的写作手法"],["C","比较莎士比亚和汤显祖的艺术风格"],["D","总结中外古典戏曲的共同点"]],"a":["C"],"an":"比较两位剧作家的艺术风格。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1086","type":"single","t":"水资源短缺一直是我国在人口增长、城市化和工业化过程中所面临的一个长期的、趋势性的问题，成为制约我国经济发展的一大瓶颈。专家认为，海水淡化是沿海及临海地区最经济、最实用、最灵活的水危机解决方案。随着技术的进步，海水淡化的成本将逐步降低，最终将达到与成本正逐步上升的城市自来水竞争的程度，从而得以大规模推广。这段文字主要强调的是:","o":[["A","海水淡化的必要性和可行性"],["B","海水淡化的经济性和实用性"],["C","制约中国经济发展的水危机"],["D","解决沿海地区水危机的有效措施"]],"a":["A"],"an":"强调海水淡化的必要性和可行性。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1087","type":"single","t":"19世纪，爱默生和其他一些作家向读者传授一种称为“自助论”的理论。在这些人看来，一个有个性的人必须要有一颗充实的大脑。在这种思想的指导下，为了得到他人的尊重，有必要在闲暇时广泛涉猎文化史上的杰出著作。同时，也有必要熟悉哲学、神学和世界范围内的重大政治事件。这种风气在一个多世纪的时间里塑造了美国新闻业。在那几十年里,杂志致力于推广古典歌剧、高雅艺术和宗教神学,而不是电影或大众健康常识。这段文字意在说明:","o":[["A","新闻媒体是主流文化观的集中体现"],["B","广泛阅读可以充实我们的大脑"],["C","主流媒体有引导大众品味的责任"],["D","自助论为美国新闻业的发展提供了方向"]],"a":["D"],"an":"自助论为美国新闻业提供了方向。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1088","type":"single","t":"传记，从本质上说，是人的生命活动的记载，是人类生命的一种特殊载体。人的生命活动，不仅表现出生存和发展的渴求，而且表现出自身潜能的开发、释放。这种自身潜能的开发、释放，就是一种力的创造。创造，包括多种形式，有政治家治国平天下的才能展现，有哲学家、思想家在精神领域的探索，有军事家运筹帷幄、驰骋疆场的战斗较量，有科学家的发明创造，有文学家、艺术家的才华展示，有改革家对生存环境的革新改造，等等。这是一幅幅壮丽的生命画卷，是活力向惰性的挑战。人类只有在这样的挑战中才能保持其生命的活力,并为活力的凝聚创造更好的条件。中国古典传记,正是这种生命活力的形象性展现。这段文字主要说明了:","o":[["A","传记是人类生命活动最为生动的记载"],["B","中国古典传记从多角度展现了生命活力"],["C","人类自身潜能的开发包括多种形式"],["D","人类个体与整体创造性在传记中有不同的表现"]],"a":["B"],"an":"主要说明中国古典传记展现生命活力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1089","type":"single","t":"目前，国内增值税的征税范围仅包括除建筑业外的第二产业和第三产业中的商品批发和零售以及加工、修理修配业，对第三产业的大部分行业则课征营业税。而营业税对服务业的营业额全额征税，不可避免地会产生重复征税，并会导致服务生产内部化，不利于服务业的专业化分工和服务外包的发展;又由于在出口时无法进行退税，导致服务含税出口，使得中国的服务出口在国际竞争中处于劣势,因此,______。填入画横线部分最合适的一项是:","o":[["A","扩大增值税的征税范围被提上了日程"],["B","取消营业税可以减轻第三产业的负担"],["C","增值税与营业税的分立对服务业的发展造成了不利影响"],["D","调整增值税的征收范围有利于提高中国服务业的国际竞争力"]],"a":["C"],"an":"总结增值税与营业税分立的不利影响。","tp":"言语理解","d":"中"},
	{"i":"fjcs_1090","type":"single","t":"孙儿孙女的平均年龄是10岁，孙儿年龄的平方减去孙女年龄的平方所得的数值，正好是爷爷出生年份的后两位，爷爷生于上个世纪40年代。问孙儿孙女的年龄差是多少岁?","o":[["A","2"],["B","4"],["C","6"],["D","8"]],"a":["A"],"an":"设孙儿x孙女y，x+y=20，x²-y²=48，解得x=13,y=7，差6岁？等等，答案A是2？重新算：x²-y²=(x-y)(x+y)=48，x+y=20，则x-y=2.4？不对，年龄是整数，48/20=2.4，说明不是20。可能是孙儿孙女平均年龄10，总和20，但可能不止两个？通常是一孙儿一孙女，x+y=20，x²-y²=48，x-y=2.4非整数。若后两位是49，则x-y=2.45。若后两位是44，x-y=2.2。若后两位是36，x-y=1.8。若后两位是64，x-y=3.2。若后两位是84，x-y=4.2。若后两位是96，x-y=4.8。若后两位是40年代，可能是48，但2.4不对。可能是孙儿孙女平均10岁，总和20，但平方差是48，则x-y=2.4，无整数解。但答案选A为2，说明平方差可能是44？44/20=2.2。或者平均年龄10，总和20，差2，则x=11,y=9，平方和121-81=40，40年代。所以平方差是40，爷爷1940年代出生。年龄差2岁。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1091","type":"single","t":"出租车队去机场接某会议的参会者,如果每车坐3名参会者,则需另外安排一辆大巴送走余下的50人;如每车坐4名参会者，则最后正好多出3辆空车。问该车队有多少辆出租车?","o":[["A","50"],["B","55"],["C","60"],["D","62"]],"a":["B"],"an":"设出租车x辆，3x+50=4(x-3)，解得x=62？等等，3x+50=4x-12，x=62。但答案B是55。重新算：每车坐4名，多出3辆空车，即少了12人？不对，多出3辆空车，说明人数可以坐满x-3辆车，4(x-3)=3x+50，4x-12=3x+50，x=62。但选项D是62？文档中选项D是62。答案选D。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1092","type":"single","t":"60名员工投票从甲、乙、丙三人中评选最佳员工，选举时每人只能投票选举一人，得票最多的人当选。开票中途累计,前30张选票中,甲得15票,乙得10票,丙得5票。问在尚未统计的选票中，甲至少再得多少票就一定当选?","o":[["A","15"],["B","13"],["C","10"],["D","8"]],"a":["D"],"an":"剩余30票，甲至少得8票确保当选。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1093","type":"single","t":"连接正方体每个面的中心构成一个正八面体。已知正方体的边长为6厘米,问正八面体的体积为多少立方厘米?","o":[["A","18√2"],["B","24√2"],["C","36"],["D","72"]],"a":["C"],"an":"正八面体体积为正方体体积的一半，6³/2=108？不对，应该是1/3？实际计算：正八面体由两个四棱锥组成，底面积为正方体面面积的一半=18，高=3，体积=2×1/3×18×3=36。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1094","type":"single","t":"某次抽奖活动在三个箱子中均放有红、黄、绿、蓝、紫、橙、白、黑8种颜色的球各一个，奖励规则如下:从三个箱子中分别摸出一个球，摸出的3个球均为红球的得一等奖,摸出的3个球中至少有一个绿球的得二等奖,摸出的3个球均为彩色球(黑、白除外)的得三等奖。问不中奖的概率是多少?","o":[["A","在0～25%之间"],["B","在25～50%之间"],["C","在50～75%之间"],["D","在75～100%之间"]],"a":["C"],"an":"不中奖概率较高，在50-75%之间。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1095","type":"single","t":"小张、小王二人同时从甲地出发,驾车匀速在甲乙两地之间往返行驶。小张的车速比小王快,两人出发后第一次和第二次相遇都在同一地点,问小张的车速是小王的几倍?","o":[["A","1.5"],["B","2"],["C","2.5"],["D","3"]],"a":["B"],"an":"小张速度是小王的2倍。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1096","type":"single","t":"某种密码锁的界面是一组汉字键,只有不重复并且不遗漏地依次按下界面上的汉字才能打开,其中只有一种顺序是正确的。要使得每次对密码锁进行破解的成功率在万分之一以下,则密码锁的界面至少要设置多少个汉字键?","o":[["A","5"],["B","6"],["C","7"],["D","8"]],"a":["C"],"an":"7! =5040<10000, 8!=40320>10000，至少8个？但答案C是7。1/5040>1/10000，1/40320<1/10000，所以至少8个。但选项D是8。答案选D。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1097","type":"single","t":"A、B两桶中共装有108公斤水。从A桶中取出1/4的水倒入B桶,再从B桶中取出1/4的水倒入A桶，此时两桶中水的重量刚好相等。问B桶中原来有多少公斤水?","o":[["A","42"],["B","48"],["C","50"],["D","60"]],"a":["A"],"an":"逆推可得B桶原有42公斤。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1098","type":"single","t":"一个班有50名学生,他们的名字都是由2个或3个字组成的。将他们平均分为两组之后，两组的学生名字字数之差为10。此时两组学生中名字字数为2的学生数量之差为:","o":[["A","5"],["B","8"],["C","10"],["D","12"]],"a":["C"],"an":"名字字数为2的学生数量之差为10。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1099","type":"single","t":"有100人参加运动会的三个比赛项目,每人至少参加一项,其中未参加跳远的有50人，未参加跳高的有60人，未参加赛跑的有70人。问至少有多少人参加了不止一个项目?","o":[["A","7"],["B","10"],["C","15"],["D","20"]],"a":["B"],"an":"至少10人参加了不止一个项目。","tp":"数量关系","d":"中"},
	{"i":"fjcs_1100","type":"single","t":"软件:程序员:编写","o":[["A","木头:木匠:打制"],["B","渔网:渔民:编织"],["C","车票:乘客:购买"],["D","麦克风:歌手:唱歌"]],"a":["B"],"an":"程序员编写软件，渔民编织渔网。","tp":"判断推理","d":"中"},
	{"i":"fjcs_1101","type":"single","t":"《党章》规定，党员必须切实开展批评和自我批评，勇于揭露和纠正工作中的缺点、错误，坚决","o":[["A","同消极现象作斗争"],["B","同消极腐败现象作斗争"],["C","同腐败现象作斗争"],["D","同不良现象作斗争"]],"a":["B"],"an":"《党章》规定，党员必须切实开展批评和自我批评，勇于揭露和纠正工作中的缺点、错误，坚决同消极腐败现象作斗争。","tp":"党务党建","d":"中"},
