	{"i":"fjcs_0623","type":"single","t":"甲、乙两人在长30米的泳池内游泳，甲每分钟游37.5米，乙每分钟游52.5\n米，两人同时分别从泳池的两端出发，触壁后原路返回，如是往返。如果不计转向的时间，\n则从出发开始计算的1分50秒内两人共相遇了多少次：","o":[["A","2"],["B","3"],["C","4"],["D","5"]],"a":["B"],"an":"方法一：题目的关键在于第一次相遇，两人游过长度之和为泳池长，之后每次相遇，\n都需要两人再游过两个泳池长。两人一起游一个泳池长，所需时间为30÷（37.5＋52.5）\n×60＝20秒，因此两人分别在20秒时、60秒时、100秒时相遇，共相遇3次。\n方法二：关键点同方法一。直接求出1 分50 秒两人合起来游过的距离为（37.5＋52.5）\n×110÷60＝165米，为5.5个泳池长。而两人相遇时都恰是合起来游过距离为奇数个泳池长\n时，也即两人分别在合游1个、3个、5个泳池长时相遇，故共相遇3次。\n方法三：套用公式。先看迎面相遇， ，得 ，即有\n3次迎面相遇；公式：两运动体从两端同时出发，相向而行，不断往返；第N次迎面相遇，\n两运动体路程和＝全程× ；\n故正确答案为B。","tp":"数学运算","d":"中"},

	{"i":"fjcs_0626","type":"single","t":"围棋被人们形象地比喻为黑白世界，在古代称作对弈。由围棋的思维方式和行棋方式来看，它与古代哲学有着密切的关系，后来，围棋也成为培养军人才能的重要工具，许多著名的军事家都对盘式，招法等_,随着围棋传遍大江南北,围棋名人的增多,也不断见于史载，常为人所乐道。依次填入划横线部分最恰当的一项是:","o":[["A","胸有成竹典故"],["B","滚瓜烂熟逸事"],["C","了然于胸掌故"],["D","烂记于心趣闻"]],"a":["C"],"an":"第一空考查成语的含义及使用。胸有成竹，比喻熟练有把握，心中有数。滚瓜烂熟，形容读书或背书流利纯熟，对知识掌握得透彻明白。了然于胸，心里非常明白。烂记于心，比喻记得非常清楚。根据填空可知，需要一个动宾结构短语，因此排除B项，B项是形容词短语。排除A项，意思不符。第二空，典故，历史上的经典故事。逸事，不见于正式记载的事例。掌故，关于历史人物、典章制度等的遗闻轶事。趣闻，有趣的故事。因此，掌故更符合语境，特指古代的故事。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0627","type":"single","t":"国际货币体系是保证国际交易正常进行的某种世界各国_的制度安排。其主要_有二:第一，提供流动性，方便商品、资产跨境交易;第二，提供调整贸易不平衡的某种机制。填入画横线部分最恰当的一项是:","o":[["A","遵照目标"],["B","遵循目的"],["C","遵从用途"],["D","遵守功能"]],"a":["D"],"an":"此题为实词填空题。第一空，C选项遵从是指遵照并服从，一般指上级的命令，而文段中并没有提到上级命令，故排除C。第二空，空格后有两点内容，目标和目的都有想要达到的境地的含义，但是题干中的两点内容并非是要达到的境地或结果，而是描述国际货币体系的有利作用，故第二个空排除A、B两项，用“功能”最为合适，故D选项符合题意。第一个空格填写遵守，意思是依照规定行动，根据习惯搭配，遵守规定、制度最为合适，验证D项正确。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0628","type":"single","t":"中国自古就有浓烈的宗法传统,宗族血亲之内的彼此关照，互相提携，并一致对外，上自帝王下至百姓，","o":[["A","讲究前赴后继"],["B","讲求概莫能外"],["C","寻求无一幸免"],["D","追求百喙如一"]],"a":["B"],"an":"本题考查实词和成语的应用。本题根据第二空就可得到答案。根据“上自......下至......”的搭配，可知要表达全面包含的意思，“概莫能外”最契合文意。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0629","type":"single","t":"中国、印度、巴西、南非等发展中国家主动采取了减排措施，为促进哥本哈根会议取得积极成果发挥了积极的()作用。","o":[["A","指导性"],["B","战略性"],["C","战术性"],["D","建设性"]],"a":["D"],"an":"本题考查实词语境最佳选择。A项“指导性”一般带有强制性意味，如上级指导下级工作;B项“战略”本意是指导战争全局的计划和策略，后泛指为完成某项任务而做的规划和策略;C项“战术”原指指导战斗的原则和方法，包括战斗的基本原则、战斗的方法和战斗的组织实施等具体原则。发展中国家的具体做法对会议进程谈不上指导性、战略性或战术性意义，故排除前三项。D项“建设性”具有推进、促进项目实施的含义，文中发展中国家的做法有助于推进、促进会议取得积极成果，符合题干描述。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0630","type":"single","t":"“凑足一群人就可以走了，和红绿灯无关”，略带自嘲和无奈的“中国式过马路”，着集体漠视规则的人们，_了城市交通管理的软肋。填入横线处恰当的一项是:","o":[["A","调侃戳中"],["B","讥讽击中"],["C","嘲弄戳痛"],["D","挖苦打中"]],"a":["A"],"an":"A选项:“调侃”多指用言语和他人开玩笑或用言辞嘲弄，戏谑。正好对应首句语言的自嘲与无奈。“戳中”软肋也属于固定搭配。符合文意;B、D选项:“讥讽”、“挖苦”语义程度过重，与前文的“略带”无法形成匹配，排除;C选项:“戳痛”带有程度的表述，而文段的痛感无从体现，排除。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0631","type":"single","t":"2012年8月，美国“好奇号”火星车在火星表面着陆，这是人类迄今在其他星球登陆的最精密的移动科学实验室，“好奇号”将测量火星岩石和泥土中不同化学元素的丰度，火星表面的辐射环境及其对未来登陆火星宇航员的危害，火星是否具有适宜生命存在的环境，行星变化的线索。填入横线处恰当的一项是:","o":[["A","评价找寻跟踪"],["B","判断考察挖掘"],["C","测算探究注意"],["D","评估探索寻找"]],"a":["D"],"an":"第一空中,选项A的“评价”和选项B的“判断”都是形容得到固定的结论,而文中是在描述探索寻找的过程，故排除A、B项;第三空中“线索”与“寻找”搭配，故确定D项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0632","type":"single","t":"王国维读书治学的一个重要方法，就是对一个问题，总是先地收集资料，然后地予以分析，最后进行综合性的总结，从而达到对这一问题深刻的认识。","o":[["A","谨慎抽丝剥茧"],["B","全面独出心裁"],["C","广泛条分缕析"],["D","仔细分门别类"]],"a":["C"],"an":"本题考查实词和成语的混搭填空。第一空，用来修饰“收集资料”，一般用“全面”或者“广泛”搭配，因此排除A、D两项。第二空，接下来解释一下各成语含义:“抽丝剥茧”形容分析事物极为细致，而且一步一步很有层次;“独出心裁”原指诗文的构思有独到的地方，后泛指想出的办法与众不同;“条分缕析”形容分析得有条理，很细致;“分门别类”指把一些事物按照特性和特征分别归入各种门类。根据文段中“综合性的总结”可知，前文的分析应该是有条理的、细致的，而不是与众不同的，因此第二个空格应该填“条分缕析”。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0633","type":"single","t":"与先秦不同，新生代的中国研究人员不愿意接受古籍中的描写，在希冀精确追溯中国历史的尝试中，他们所的是实物、数据以及更为“西式”的方法。依此填入划横线部分最恰当的一项是:","o":[["A","被动依靠"],["B","全盘倚重"],["C","直接擅长"],["D","无端强调"]],"a":["B"],"an":"本题考查近义实词的辨析填空。材料两句话之间暗含转折关系,后一个空易于切入,“实物、数据以及更为'西式'的方法”都是凭借、手段、工具，所以“擅长”“强调”二词语意不合，CD两项排除;“依靠”和“倚重”都对，但“倚重”更佳，从语体色彩上来说，倚重属于书面色彩，用在第二个空格处得体大方，语境协调，因此选B。回到第一个空格，“直接”与“间接”对应，“无端”强调没有缘由，“被动”与“主动”相对，“全盘”强调不假思索地都拿来，根据转折语境，“全盘”更符合语意语境，验证B项正确。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0634","type":"single","t":"19世纪的西方建筑师大多满足于把钢铁作为一种手段应用于当时流行的古典式或哥特式建筑。很久以后，建筑师才_了古典和哥特模式，充分发挥了钢铁构架结构的各种潜能。从下列选项中选择最恰当的一组填入横线中:","o":[["A","次要放弃"],["B","补充摆脱"],["C","主要超越"],["D","典型淘汰"]],"a":["B"],"an":"此题考查实词的语境搭配。第一空，从材料中“很久以后......才充分发挥了钢铁构架结构的各种潜能”可推知，19世纪的时候钢铁的潜能并没有被充分发挥，所以可以判断那时钢铁是作为一种“次要”或“补充”的手段，而不是“主要”或“典型”手段，所以排除C、D，在A、B中寻找答案。第二空，“放弃”一般指主观方面，而“摆脱”有种客观意味，是被动中寻求主动。而材料中的意思是建筑师跳出了古典和哥特模式的约束，使钢铁发挥其本身潜能，所以选“摆脱”，所以选择B选项。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0635","type":"single","t":"英国车，汽车工艺的代表，处处____出高贵、优雅、灵动、恒久的艺术气质。而这一切，源自于英国人一直_的传统造车技艺-始终以手工进行装嵌。依次填入划横线部分最恰当的一项是:","o":[["A","彰显迷恋"],["B","展示擅长"],["C","流露秉承"],["D","体现坚守"]],"a":["C"],"an":"第一空考查词语搭配。与“气质”一词搭配，选项中的四个动词均可。第二空考查词语含义。文中“一直传统始终均体现出英国人对于自古流传的手工装嵌技术的使用时间之久，并搭配“技艺”，A项“迷恋”一词明显与文意不符，故排除。B项“擅长”，文段并不是侧重于强调长短处，排除。“秉承”用于接过前人好的东西，继续发扬光大，而“坚守”是指坚定地遵守或保持。此处与“传统造车技艺”搭配，“秉承技艺”搭配更为恰当。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0636","type":"single","t":"电脑上的“大脑训练”游戏曾经被斥责为()，但最近发表的一个研究结果表明,这种训练确实能够提高65岁以上老年人的记忆力和注意力。事实上,人的大脑也在()让老年人的退休生活变得愉快。","o":[["A","天方夜谭,想方设法"],["B","荒谬之词,尽心尽力"],["C","无稽之谈，尽其所能"],["D","奇谈怪论,忠心耿耿"]],"a":["C"],"an":"考查选择成语填空的能力。天方夜谭:比喻虚诞夸饰的议论，荒诞不经的说法。荒谬之词:错得离谱的说法。无稽之谈:没有根据的说法。奇谈怪论:奇怪的、不合情理的言论。文中“但最近发表的一个研究结果表明，这种训练确实能……”转折词“但”表明，人们研究“游戏训练”能够提高老年人记忆力是有根据的，这也说明“大脑训练”游戏在此前被认为是毫无根据的，因此第一空选择“无稽之谈”，A、B、D三项都无法与后文找到根据相对应。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0637","type":"single","t":"是让圆明园保留的现状,还是应当重建?在国内的互联网上,围绕这个问题展开了激烈的","o":[["A","遗迹争执"],["B","遗存讨论"],["C","废墟争论"],["D","废址研讨"]],"a":["C"],"an":"本题考查近义实词词义侧重的辨析与填空。第一空，“遗迹”是古代人类通过各种活动遗留下来的痕迹;“遗存”指古代遗留下来的东西。由原句“重建”可知，第一空应强调圆明园的“废”，故可排除A、B项。“废址”强调地址，也不符合语意。故选“废墟”。第二空，“讨论”强调的是论，即大家互相说明自己的观点。“研讨”强调的是研究。“讨论”和“研讨”反映的人们的心态都是理性的;“争论”强调的是争，即互相说明自己的观点之外，还要驳倒对方。“争执”强调的是执，即不论对错，都坚持自己的观点，毫不退步。“争论”和“争执”就含有非理性的因素。其中争执由于过于非理性，所以一般用于贬义的环境;“保留”与“重建”是两种截然不同的观点，“互联网”上应是各执己见，经常是非理性的，故可排除“讨论”和“争执”。“争执”是僵持不下时的状态，不可能“激烈”。故第二空选“争论”。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0638","type":"single","t":"在这种只关心自身利益尤其是选举利益的短视逻辑下，西方领导人“忘记”了向公众解释这种_的方式是无法持续的，它必将会损害到国家的未来。由于他们弃难择易，放松了道德要求，因而“负债经济”成了一种必然。填入画横线部分最恰当的一项是:","o":[["A","以邻为壑"],["B","掩耳盗铃"],["C","削足适履"],["D","寅吃卯粮"]],"a":["D"],"an":"本题考查成语含义及文段对应。与前文中“只关心自身利益的短视逻辑”及后文中的“负债经济”对应可知，“这种方式”只看眼前，不顾长远，会导致“负债经济”的不良后果，唯有D项“寅吃卯粮”意为寅年吃了卯年的粮食，形容入不敷出，预先借支，可与文意对应。A项“以邻为壑”意为嫁祸于人或把困难、问题推给别人;B项“掩耳盗铃”意为捂住耳朵去偷铃，比喻自己欺骗自己;C项“削足适履”意为脚大鞋小，为了穿上鞋而把脚削去一点儿，比喻无原则地迁就现成条件或不顾客观条件生搬硬套。与文意的对应都不及D项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0639","type":"single","t":"我们中华民族有悠久的历史和优秀的文化传统，有丰富的文化遗产，中国文化是世界上最古老的文化之一，，我们的文化不同于其他古代文化的一个特点是，几千年来它一直没有中断,我们丰硕的文化遗产_可以丰富我国人民_可以丰富世界人民的精神文明的宝库。依次填入划横线部分最恰当的一项是:","o":[["A","同时不仅而且"],["B","但是不仅而且"],["C","于是既也"],["D","同时既也"]],"a":["B"],"an":"本题考查关联词选择。第二、三个空，在题干后半段中，由“我国人民”到“世界人民”的精神文明，范围逐步扩大，因此，第二和第三个空应该为一组递进关系的关联词，故可排除C、D。第一个空，所连接的内容之间并不存在并列关系，并且横线后面的内容指出了中国民族文化不同于其他文化的特点，有强调的意味，转折词“但是”能表现出这种效果，所以第一空应选“但是”，而非“同时”。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0640","type":"single","t":"当你打开书想在书中找到平静的时候，最初的几页是很难读进去的。最初的几页读完后，你就会觉得好书就像是一堵墙，把街面上的_还有喧嚣的声音阻拦在了外边。你似乎可以在里闻到花香，听到鸟鸣，大自然仿佛又回到了你的身边。依次填入划横线处最恰当的一项是","o":[["A","车水马龙白纸黑字"],["B","纸醉金迷字里行间"],["C","灯红酒绿语言文字"],["D","红男绿女字字句句"]],"a":["A"],"an":"第一空，用于形容“街面上”的一种热闹场面。“车水马龙”是形容来往车马很多，连续不断的热闹情景;“灯红酒绿”是形容奢侈糜烂的生活，也形容都市或娱乐场所夜晚的繁华热闹的景象。二者都可用于衬托热闹场面，与文段描述环境相符。“纸醉金迷”用来形容奢侈豪华、腐朽享乐的生活;“红男绿女”指穿着各种漂亮服装的青年男女，用于形容人。二者都不能用来形容热闹的场面，故排除B、D两项。第二空，A项，“白纸黑字”与后文“花香、鸟鸣”等形成对比，将枯燥无味的书本文字变得生动丰富起来，当选。C项，“语言文字”是语言与文字的总和，书中只对应文字，不符合语境，排除。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0641","type":"single","t":"领导干部应该深入群众，和群众打成一片，真正民情。填入划横线部分最恰当的一项是:","o":[["A","体察"],["B","体恤"],["C","体贴"],["D","体验"]],"a":["A"],"an":"领导干部应该深入群众，和群众打成一片说明领导干部是真的关心老百姓的疾苦，体会老百姓的生活，了解民情。只有“体察”有体会和观察的意思。“体察”:指体会和观察。“体恤”:设身处地为人着想，给予同情，照顾。“体验”:在实践中认识事物;亲身经历。“体贴”:对别人的心理或境况进行了解并予以关心和照料。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0642","type":"single","t":"人生是一个容器，可这个容器的容量实在是非常愁苦和畏惧多了，欢乐与就少了。填入划横线部分最恰当的一项是:","o":[["A","庞大胆量"],["B","可观轻松"],["C","有限勇气"],["D","莫测勇敢"]],"a":["C"],"an":"本题考查实词填空。第一空，由第二句话中的“多了，就少了”可知，题干是在说人生这个容器是有限的，庞大、可观、莫测这三个词语填入第一空都不符合语境，排除A、B、D;第二空，“欢乐”对应“愁苦”，第二空应填入与“畏惧”对应的词语，所以选择“勇气”。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0643","type":"single","t":"文化认同作为小到一个群体、大到一个民族向心力的有机“粘合剂”，是凝聚这个群体和民族伟大精神力量的_____。文化认同如果缺失,社会语境便趋于焦虑,人们的价值取向便会_。因为，文化认同，相对于政治认同和社会认同，具有更深远的","o":[["A","根基迷失内涵"],["B","基础失落后盾"],["C","基础失落意义"],["D","根本丢失价值"]],"a":["A"],"an":"本题考查近义实词不同侧重点的辨析和语境搭配。先看第二空，需要搭配“人们的价值取向”，A项的“迷失”最符合语意，“迷失”指丢失了方向。“失落”一方面指遗失、丢失;另一方面指精神上的空虚或失去寄托。这两个方面的含义放在此处都不能与“人们的价值取向”搭配。相对于“迷失”来讲，“丢失”的表述略显苍白，故更加倾向于“迷失”，故排除B、C、D三项。答案锁定A。以第一空进行验证，根据文意，其强调的是文化对于凝聚群体和民族精神力量的重要作用，“根基”的词义程度最深,最符合语意。“根基”指根本、基础。第三空，将A项的“内涵”代入句中，符合语意。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0644","type":"single","t":"国际市场疲软给中国经济带来了不确定性,面对外汇资产缩水风险、出口贸易受到影响和输入性通胀压力上升等______，中国需要______考量应对，谋定而后动，制定短期和中长期的、货币和财政的、战略的和战术的、经济和政治的“中国政策”依次填入划横线部分最恰当的一项是:","o":[["A","困境郑重迫在眉睫"],["B","考验审慎刻不容缓"],["C","局面仔细急如星火"],["D","局势认真十万火急"]],"a":["B"],"an":"本题可先从第三空入手，“急如星火”和“十万火急”较口语化，不适用于文段语境所描述的事件及规范化的表达，排除C、D两项。再看第二空，“郑重”指严肃、认真，侧重主观的态度，一般的搭配为“郑重宣布”“郑重宣誓”等，与空格后的“考量”不搭配，排除A项。第一空代入验证，“面对考验”可以搭配。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0645","type":"single","t":"预循环是一种更环保的生活方式，指通过购入会产生垃圾的家庭或商业物品来减少垃圾数量的行为。可循环的垃圾经过处理后可以别的功效，可是处理这些可循环物质也是要消耗能源并产生垃圾的，所以更加环保的方式是尽量少用会产生垃圾的物品。依次填入画横线部分最恰当的一项是:","o":[["A","避免发挥"],["B","杜绝具备"],["C","放弃衍生"],["D","禁止实现"]],"a":["A"],"an":"第一空，杜绝禁止是指外力不让做一些事情，且程度较重，避免放弃是指主动去做，且程度较轻。根据文段表述，预循环是一种生活方式，并没有外力一定要我们如何去做的意思，故排除B、D两项。再根据文段最后一句话，预循环主要是倡导人们尽量少用一些会产生垃圾的家庭或商业物品。所以这些行为不是完全“放弃”而只能是尽可能“避免”。第二空，考查词语搭配。“发挥”和“功效”搭配比较合理。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0646","type":"single","t":"政府信息公开_要在“量”上扩展,更要在“质”上发力。_逐年在进步，许多政府信息的完整性、详尽性仍显不足。依次填入下列横线处的词语，最恰当的一组是()","o":[["A","因为，尽管，但是"],["B","不仅，哪怕，并且"],["C","不仅，尽管，但是"],["D","因为，哪怕，并且"]],"a":["C"],"an":"第一空,由“更要在'质'上发力”可知,第一句话是一个递进关系,因此排除AD两项。后面内容意在强调，政府信息公开固然有进步但是仍然存在完整性、详尽性不足的问题，所以二、三空应该意含转折，对应到C选项。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0647","type":"single","t":"她总是喜欢她的美丽。填入划横线处最恰当的一项是:","o":[["A","表示"],["B","夸奖"],["C","夸口"],["D","炫耀"]],"a":["D"],"an":"A项错误，“表示”与美丽存在动宾搭配不当的问题，可排除;B项错误,“夸奖”指赞美、称赞。可以是自己对别人的赞美,也可以是别人对自己的赞美,不可用于自己对自己,可排除;C项错误,夸口指吹牛,说大话的意思,与文意不符,可排除;D项正确,“炫耀”是指向别人展示自己比别人好的事物,而文中的“美丽”就是自己比别人好的事物。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0648","type":"single","t":"《功夫熊猫》的热映说明“中国元素”已不仅仅只是好莱坞电影中的______，它甚至已经成好莱坞电影导演的灵感来源，片中“功夫”和“熊猫”两个主要元素都来自中国文化，而猴王、老虎、螳螂、毒蛇、丹顶鹤等五大高手更是把中国功夫中轻功演绎得填入横线部分最恰当的一项是:","o":[["A","点缀惟妙惟肖"],["B","卖点栩栩如生"],["C","陪衬精妙绝伦"],["D","题材活灵活现"]],"a":["A"],"an":"第一空，根据文段中关联词“不仅仅……甚至”可知第一空填的词语与“灵感来源”构成递进关系，语义比“灵感来源”轻，且带有褒义的感情色彩。“点缀”指对事物加以衬托或装饰，使原有事物更加美好，符合文意;“卖点”指商品具备了别出心裁或与众不同的特色、特点，其语义程度已经超过了“灵感来源”;“陪衬”是衬托的意思，带有消极色彩，与文段积极语义相悖;“题材”同样语义过重。基本锁定答案为A。第二空验证，“惟妙惟肖”形容描写模仿的非常逼真，或是雕刻得十分逼真，填入横线符合语境。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0649","type":"single","t":"条纹，作为最简洁而又生机勃勃的视觉设计语言，自石器时代起便被广泛运用。彩色条纹依旧不断_于当今时装界，新锐设计师们拒绝了浮华，但同样着高调。依次填入画横线部分最恰当的一项是:","o":[["A","流行维持"],["B","时兴延续"],["C","风靡保持"],["D","活跃蕴含"]],"a":["C"],"an":"此题运用对应与搭配的方法作解。第二空为本题突破口。第二空所填动词搭配的名词是“高调”,“蕴含”是内在的含义,与外显得“高调”显然矛盾，故排除D项;“维持”的基本含义是必须经过努力或采取必要的手段，才能使原有的状态、已经或可能出现了问题的状态得以继续下去，而且这种状态的继续可能是短暂的，随时会中断的。加之文中并没有体现持续高调需要付出很大的努力才行，搭配不当，故排除A项。第一空，根据前后语义，前文提到条纹“自石器时代起便被广泛运用”，引出空格所在句“于当今时装界”彩色条纹依旧流行的意思，“风靡”所表达的正是这一含义。“时兴”一词过于口语化，与文段语体风格不符，排除B项。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0650","type":"single","t":"在下列句子横线处填入的词语。最为适当的一项是:(1)这家医药公司_世界医药行业之首，是因为有多项产品连续获得国际金奖。(2)现代科学技术的发展可谓一日千里，过去的幻想在今天均有可能得以实现。(3)方天名因德语能力和交往能力很强，被学校____到德籍留学生管理中心工作。","o":[["A","跻身，以致，委派"],["B","跃居，以致，委任"],["C","跃居，以至，委派"],["D","跻身，以至，委任"]],"a":["C"],"an":"此题考查近义实词的语境搭配和不同侧重点。先看句子(1)，“跻身”是指使自己(的地位)上升到某种行列、位置等;“跃居”指跳跃式地上升到某个位子。修饰首位、榜首一般与“跃居”搭配。排除A、D项。再看句子(3)，“委任”指任命某人担任某职务;“委派”指派遣某人做某事。(3)中表达的意识是派遣方天名到德籍留学生管理中心工作，所以应该与“委派”搭配。所以C对。再看句子(2)，“以至”指事物扩展、延伸或事物发展到一定程度产生的效果，表范围、数量、程度、时间等延伸和发展，一般指从小到大，从少到多，从浅到深。“以致”接事态发展所形成的结果，表示由于前面所说的原因而造成某种结果，多指不良结果或者不希望出现的结局。(2)中空白处表示科学技术发展到一定程度的效果，与“以至”搭配，所以印证了C项。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0651","type":"single","t":"每一届《感动中国》的感动点，实际上都和当年中国特定的大背景相关联，触动了中国公众最敏感的神经，代表了当年最能公众，最能感动中国的力量。填入横线部分最恰当的一项是:","o":[["A","引起共鸣"],["B","打动心灵"],["C","拨动心弦"],["D","震撼内心"]],"a":["C"],"an":"第一空，从句式看，“打动”、“拨动”能与前后文的“触动”、“感动”形成语义对应，故排除A项的“引起”，D项，程度较重的“震撼”。第二空,结合语境,横线处所填入的词语也应当能表现出公众的思想感情因受外界事物影响而感动,“拨动......心弦”能与上文“神经”一词相对应,而“心灵”与“神经”不能构成对应。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0652","type":"single","t":"中国是世界上发展最快的经济体,如果它继续按照专家们的发展下去,那么在20年后可以与美国。","o":[["A","猜测比肩"],["B","预测匹敌"],["C","推断抗衡"],["D","预期媲美"]],"a":["B"],"an":"本题考查近义实词的辨析填空。先看第一空，C项“推断”指根据事实或前提进行推理判断事实的因果关系，根据语意，“20年后的结果”与前面的“中国是世界上发展最快的经济体”并不构成严格的因果关系，故无法直接“推断”，排除C;B选项,对未来的发展趋势应该用预期或者预测,而后一个空媲美的意思是:美好得可以和什么相比，匹敌的意思是:相比相当。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0653","type":"single","t":"当浮力大于物体所受的重力时，物体上浮，，物体下沉。","o":[["A","反之"],["B","相反"],["C","否则"],["D","反而"]],"a":["A"],"an":"本题是考查近义词虚词辨析填空。“相反”、“反而”、“否则”、“反之”都有相对立的意思，但“相反”、“反而”、“否则”都不能单用，从词语中不能体现反对的对象，而“反之”说明反对的“之”指代的内容。材料中“之”指代的是“当浮力大于物体所受的重力时，物体上浮”的情况，表述清楚、准确。如用“相反”、“反而”“否则”，都会造成指代不明。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0654","type":"single","t":"在各种利益的下,一批的企业家把目光盯在了高科技产业上,看准了就一掷千金。","o":[["A","驱动深谋远虑"],["B","诱惑深谋远虑"],["C","驱动深思熟虑"],["D","诱惑深思熟虑"]],"a":["A"],"an":"本题考查近义实词和成语辨析的能力。第一空考察实词，“驱动”的意思是①施加外力，使动起来;②驱使，推动;“诱惑”的意思是①使用手段，使人认识模糊而做坏事②吸引，招引;“驱动”比“诱惑”更加侧重“受到吸引去做某事”，据题干可知，企业家为了获得利益而投资高科技产业，所以“驱动”更适合。第二空考察成语,“深谋远虑”指周密的计划,往长远考虑;“深思熟虑”指反复地深入细致地思索考虑;据题干可知，企业家看准高科技产业是因为考虑长远，所以“深谋远虑”更合适。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0655","type":"single","t":"国际金融实践领域出现的新情况，了人们对国际金融理论与政策变革的需求，随着国际金融危机的全面爆发，各国之间经济金融政策相互协调的重要性再次学术界和政府部门对各国政策协调配合的也更为激烈。依次填入划横线部分最恰当的一项是:","o":[["A","激发明晰反响"],["B","强化浮现争议"],["C","刺激彰显讨论"],["D","推动凸显谈判"]],"a":["C"],"an":"此题考查词语的固定搭配。第一空所填动词搭配“需求”，故可排除A项的“激发”。第二空所填动词搭配“重要性”，故可排除B项的“浮现”。第三空所填动词搭配主语为“学术界和政府部门”，D项“谈判”的双方应地位平等，而“学术家和政府部门”显然并不平等，故排除。激烈的讨论亦为常见搭配。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0656","type":"single","t":"在碳纳米管的研究问题上,当国外把主攻方向放在小直径时,我国科学家瞄准了超长纳米管的合成。填入画横线部分最恰当的一项是:","o":[["A","独辟蹊径"],["B","离经叛道"],["C","标新立异"],["D","推陈出新"]],"a":["A"],"an":"此题为成语填空题。根据题干可知我国科学家采取了和国外主攻方向不同的方向，瞄准了超长纳米管的合成，属于创新，应选择具有创新含义的成语。因此，结合选项应该选择A，A选项“独辟蹊径”比喻独创一种新风格或者新方法,新体裁,与文段语意相符。B选项“离经叛道”泛指背离占主导地位的理论或学说,与我国科学家创新地研究问题不符,故排除;C选项“标新立异”指故意与众不同以显示自己,也不符合文意,故排除;D选项“推陈出新”多指对旧文化进行分析批判，剔除其糟粕，吸取其精华，创造新文化，不符合上下文语境，故排除。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0657","type":"single","t":"领导人下台只是欧债危机的一个后果,并非医治危机的良药。欧洲依然在艰难____，并试图寻求外界的援助，但是大西洋对岸的美国盟友已经_，有实力施以援手的是在欧亚大陆另一端的中国。依次填入画横线部分最恰当的一项是:","o":[["A","挣扎形影相吊"],["B","踯躅焦头烂额"],["C","突围自顾不暇"],["D","徘徊分身乏术"]],"a":["C"],"an":"此题考查成语和实词的混搭填空。第一空用“艰难”作修饰语，说明欧洲的状态，B项与D项都有徘徊不前的意思,不能与“艰难”搭配,排除B、D项。文中以“试图向外界求助”解释前文，说明虽然困难但还在自救，C项”突围“比较合适。第二空意思是说美国救不了欧洲，有实力施救的是中国，因此分析美国救不了的原因。“形影相吊”是说非常孤单，没有伴侣，与文意不符，可排除A项，美国是因为自身难保才不救的。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0658","type":"single","t":"下岗工人将获得7万美元补偿，这相当于普通蓝领工作两年的税后年薪，仅靠这笔钱，在美元疲软、物价上涨的时代并不能，不过尚能维持一个家庭几年的正常生活。","o":[["A","高枕无忧"],["B","一劳永逸"],["C","丰衣足食"],["D","为所欲为"]],"a":["C"],"an":"此题考查成语的语境搭配。题干想要表达的是在物价上涨的时代，靠着七万美元的补偿，家庭生活虽不算太富足，但尚可维持正常水平几年。“丰衣足食”是指吃的穿的都很丰富充足，符合语境。A项“高枕无忧”是指垫高了枕头睡觉，无忧无虑，比喻平安无事，不用担忧，也比喻放松警惕。属于迷惑项,但是“高枕无忧”常用于摆脱危险,平安放心,不如“丰衣足食”更符合语境;B项“一劳永逸”指辛苦一次，把事情办好，以后就不再费事了;D项“为所欲为”是任意而为。均不符合语境。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0659","type":"single","t":"“春雨断桥无渡，小舟撑出绿阴来。”上句在横线处选填最恰当的字是:","o":[["A","愁"],["B","恰"],["C","叹"],["D","人"]],"a":["D"],"an":"诗句出自北宋诗人徐俯的《春游湖》，意为“由于春雨之故湖中水位上涨，没过了小桥，导致游人无法渡过此处，恰好此时有一叶小舟从绿荫处撑来，游人得以继续游湖赏景”。“无渡”所指的主体是“人”，即人无法渡过。因此，结合选项应该选择D。A、B、C三项都为动词，不能成为“无渡”的对象。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0660","type":"single","t":"传统出版社的竞争优势在于历史和传统使其在内容创新和版权拥有方面有深厚的_____，这是一个不断积累叠加的过程，不可能","o":[["A","资本一步登天"],["B","实力一挥而成"],["C","资源一日千里"],["D","积淀一蹴而就"]],"a":["D"],"an":"第一空,“深厚的”与“资本”“资源”搭配不当,排除A、C两项。第二空,与“一个不断累积叠加的过程”相反,即一下子就能办成。“一蹴而就”比喻事情轻而易举，一下子就成功，与语境相符。“一挥而成”形容写字、写文章、画画快，与语境不符，排除B项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0661","type":"single","t":"中国国家质检总局将继续加强对企业的监督管理，要求企业进一步完善其质量安全自控体系，确保出口日本产品质量安全;同时将继续加强与日方其尽快解除对其余三十七家企业产品的检查命令，保证输日食品贸易的进展顺利。","o":[["A","协商要求"],["B","商量催促"],["C","磋商敦促"],["D","洽谈恳请"]],"a":["C"],"an":"此题考查近义实词的不同侧重点的辨析和语境搭配。A项错误，国与国之间正常贸易摩擦不能“要求”对方;B项错误，根据材料，题干涉及国与国之间的交流与贸易，是正式场合，“商量”不能用于正式场合;C项正确，“磋商”表示双方仔细商量和研究，交换意见。“敦促”表示以诚恳或迫切的态度催促或提醒注意，常用于正式文稿中，所以C选项最符合空格处内容;D项错误，国与国之间地位平等，不能用“恳请”。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0662","type":"single","t":"高尚的人，从电影中自己的心灵，自己的情操，自己的智慧。卑微的人，从电影中享乐的醉酒，庸俗的慰藉，自己的品格。填入横线上最恰当的一项是:","o":[["A","陶冶升华增强吸收寻找玷污"],["B","熏陶丰富强化获得找寻侮辱"],["C","陶冶丰富增添吸饮寻找污染"],["D","熏陶丰富增加吮吸找寻玷污"]],"a":["C"],"an":"此题考查近义实词的填空。第一空中“陶冶”指怡情养性，比喻给人的思想、性格以有益的影响。“熏陶”指人的思想行为因长期接触某些事物而受到好的影响。文意讲“电影”对人的影响，但没有涉及时间的问题，所以第一个空填“陶冶”，排除B、D项;根据第四空后面的“醉酒”可知，空白处应填“吸饮”，“吸收”放在此处不搭配，故排除A项。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0663","type":"single","t":"历史反复昭示我们，向海而兴，背海而衰，是一条的铁律。中华民族要实现伟大复兴，必须地走向海洋、经略海洋，坚定不移地走以海富国、以海强国的和平发展之路。依次填入画横线部分最恰当的一项是:","o":[["A","亘古不变义无反顾"],["B","一成不变勇往直前"],["C","原封不动理直气壮"],["D","颠扑不破昂首阔步"]],"a":["A"],"an":"第一空对应前文“历史”，可知A项“亘古不变”最佳。B项“一成不变”和C项“原封不动”偏贬义，不恰当。第二空与后文“坚定不移”形成同义对应最佳的成语即为A项“义无反顾”，本句并没有强调勇气、理由和气势，所以B项“勇往直前”、C项“理直气壮”和D项“昂首阔步”均不恰当。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0664","type":"single","t":"作为曾经和数理传统同样重要的研究范式，博物学传统其实从19世纪末开始就逐渐_。仅仅是在大自然中观察、采集、记录而缺少定量分析，从医生、军官到传教士都能玩一把的博物学，在科学研究日益精细化、职业化的大趋势中显得依次填入划横线部分最恰当的一项是:","o":[["A","衰落格格不入"],["B","转型特立独行"],["C","蜕变曲高和寡"],["D","退化大材小用"]],"a":["A"],"an":"结合文段语境，可以看出博物学以前很重要，现在却衰落了。“转型”一般是往好的方向转变;“蜕变”是比喻事物由一种状态转变成另一种状态，主要是往好的方向发展，蜕变前后之间具有明显的对比关系，不符合语境，排除B、C两项。“从医生、军官到传教士都能玩一把的博物学，在科学研究日益精细化、职业化的大趋势中显得”，谈论的主体是“博物学”，“大材小用”比喻使用不当，浪费人才，主体论述不一致;“格格不入”指彼此不协调，不相容，符合文意。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0665","type":"single","t":"在这个万物互通互联的时代，单个企业是无法_的，只有人人安全、合作伙伴都安全、整个环境都安全，才能最大限度地保障自己的网络安全，这也是网络安全的更高等级-一生态安全。填入画横线部分最恰当的一项是:","o":[["A","明哲保身"],["B","自力更生"],["C","独善其身"],["D","自给自足"]],"a":["C"],"an":"根据文意可知，只有人人安全，合作伙伴都安全，整个环境都安全才能保障自己的安全，文段重在突出企业安全问题的互联互通，故对于企业来说，考虑到整个环境的安全十分必要，而不能只考虑自身，C项“独善其身”指只顾自己，不管别人，与文意相符，当选。A项“明哲保身”指因怕连累自己而回避原则斗争的处世态度，文段并没有连累、回避之意，排除;B项“自力更生”指依靠自己的力量把事情办起来，D项“自给自足”指依靠自己的生产，满足自己的需要，二者均指没有其他人的帮助企业无法存活之意，而文段并非强调企业的存活问题，而是重在突出企业安全问题的互联互通，故排除。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0666","type":"single","t":"有人总是把工作当成一种负担，得过且过，搪塞敷衍，这是很可怕的，因为慢慢地你的理想就会被，志气就会被蚕食，最终难免迷失方向，沦为平庸之辈。填入画横线部分最恰当的一项是:","o":[["A","磨灭"],["B","催毁"],["C","丢弃"],["D","消磨"]],"a":["A"],"an":"所填空要与“志气被蚕食”相对应，主语是“理想”，与之搭配的“磨灭”更符合题意，有一点一点慢慢被掠夺的意味。摧毁与丢弃是整体消灭，不符合题意，先排除B、C两项。磨灭比消磨更能突出最终消逝,完全不剩的结果。消磨通常是和时间、光阴相搭配的。因此本题选“磨灭”更合适。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0667","type":"single","t":"时下几乎所有的西方博物馆都处于虚拟化的完成或进行当中。当然，大多数虚拟博物馆仍处在2D的传统网页模式，“文字+图片”的初级阶段，更多是对实体博物馆信息的发布与补充，数字化储存做到了，但在网上浏览的方面远远不够。真正的虚拟博物馆应该是能模拟人们的观展体验的，强调观众是展览的核心，为他们营造出更富想像力与互动性的空间。填入画横线部分最恰当的一项是:","o":[["A","生动性"],["B","及时性"],["C","丰富性"],["D","便捷性"]],"a":["A"],"an":"本题考查实词的应用。尾句是对空格处所填词语的解释。为观众“营造出更富想像力与互动性的空间”，与“生动性”对应最佳。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0668","type":"single","t":"为了抵御金融危机，各国政府共同放松信贷、降低利率、发行货币，就是为了加大流动性，满足资本盈利的要求。可是，这无疑是种()的方法。因为，资本在获得利润满足后必然把更大的危机丢给社会。","o":[["A","饮鸩止渴"],["B","亡羊补牢"],["C","杀鸡取卵"],["D","竭泽而渔"]],"a":["A"],"an":"本题考查成语语境最佳选择。由后文的“必然把更大的危机丢给社会”可知，前面的应对危机的措施是用错误的办法来解决眼前的困难，而不顾以后的更严重的后果。A项“饮鸩止渴”是指用毒酒解渴，比喻只图解决目前的困难，不顾后患。该成语填入括号内，符合语境。B项“亡羊补牢”比喻失误后及时补救，与题干文意明显不合，排除;C项“杀鸡取卵”比喻贪图眼前的好处而不顾长远利益，D项“竭泽而渔”比喻取之不留余地，只图眼前利益，不作长远打算,C、D项只是说不顾长远利益,都不能体现出把更大的危机丢给社会这层含义,予以排除。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0669","type":"single","t":"思想观念的价值，在竞争中才会在实践中才能检验。“我不同意你的看法，但我捍卫你说话的权力”，这是一种胸怀，更是一种。“不同即敌对”的思维模式，在本质上是一种狭隘虚弱的表现。依次填入划线部分最恰当的一项是:","o":[["A","流露雅量"],["B","展现理解"],["C","体现宽容"],["D","彰显自信"]],"a":["D"],"an":"本题考查实词的语境搭配。从第二空切入，由“更”字可知，填入词的意思要比“胸怀”更进一步。“雅量”、“理解”、“宽容”都在不同程度上表现出“胸怀”大。“自信”与“胸怀”含义不同，在语意上比“胸怀”更进一步，且“胸怀”与后文的“狭隘”对应，而“自信”恰与“虚弱”对应。故该空应选“自信”。第一空，填入的词应与“价值”搭配。“流露”、“展现”与“价值”搭配不当。由“在竞争中”可知，价值的显现应是主动的，因此“彰显价值”比“体现价值”更贴切，故该空选“彰显”。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0670","type":"single","t":"沙漠里真有魔鬼吗?在那时人们的知识水平看起来，确像是有魔鬼在作怪。但是人们在掌握了自然规律以后，便可把海市蜃楼这种的现象说清楚。填入划横线部分最恰当的一项是:","o":[["A","奇形怪状"],["B","鬼斧神工"],["C","光怪陆离"],["D","鬼鬼祟祟"]],"a":["C"],"an":"本题考查成语语境最佳选择。“光怪陆离”形容奇形怪状，五颜六色，多指现象奇特，用来形容题中的“海市蜃楼”十分合适。因此，结合选项应该选择C。A项，“奇形怪状”指不同一般的、奇奇怪怪的形状，修饰“现象”不合适;B项，“鬼斧神工”多形容工艺,也不修饰“现象”;D项,“鬼鬼祟祟”多形容人的动作,不用于修饰“现象”。故都排除。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0671","type":"single","t":"夜色渐浓,江风徐徐,在灯火通明的街道上,叫卖声人们抛开白日里水泥森林的高压与冷漠，在人流摩肩接踵的繁华小巷，百年老城的夜生活，就在的夜晚中拉开了序幕。依次填入横线处最恰当的一项是:","o":[["A","不绝于耳徘徊欢声笑语"],["B","此起彼落穿梭杂乱无序"],["C","此起彼伏流连熙熙攘攘"],["D","声声入耳漫步喧嚣不已"]],"a":["C"],"an":"第二空，文段表达的感性色彩都是正面积极的，故排除强调犹豫不决的“徘徊”;第三空，作者对于夜生活的态度依然是积极的，排除含有贬义的“杂乱无序”“喧嚣不已”，“熙熙攘攘”形容人多、热闹。将“此起彼伏”代入第一空验证，语句通顺，符合文意。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0672","type":"single","t":"中国网民应该更加珍惜这种参政议政方式，“网络暴力”等不良行为，发兴亡之言不叉腰，写载道之文不偏激狭隘，做负责任、建设性的大国网民。填在横线上最恰当的词语是:","o":[["A","杜绝谩骂"],["B","杜撰漫骂"],["C","杜绝漫骂"],["D","杜撰谩骂"]],"a":["A"],"an":"此题考查实词的填空。第一空“杜绝”指遏制、彻底制止;“杜撰”指臆造、虚构，没有根据地编造、虚构;“谩骂”指用轻慢、嘲笑的态度骂;“漫骂”指放肆地乱骂。根据以上分析，首先排除“杜撰”，即B、D项;第二空中，根据文意，对于网民的“骂”，作者并没有过度地批评，只是奉劝他们要文明理性，而“漫骂”放在这里语义过重，故排除。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0673","type":"single","t":"作为一个公司领导，不需要、也不可能事必躬亲，但一定要能够在注重细节当中比他人观察得更细致、__，在某一细节的操作上做出榜样，并形成使每个员工都不敢马虎，无法。只有这样，企业的工作才能真正做细。填入画横线部分最恰当的一项是:","o":[["A","明察秋毫周密威慑力搪塞"],["B","明辨是非周详使命感推脱"],["C","抓大放小透彻好习惯塞责"],["D","高瞻远瞩入微内聚力敷衍"]],"a":["A"],"an":"本题考查成语和实词的混搭填空。多个词语的选词填空题适合采用排除法。文段旨在说明公司领导在细节方面如何有效管理员工。解题时要特别注意句中的对应关系。文段第一空考察成语的搭配，“但一定要”后面有一句话，“能够在注重细节当中比他人观察得更细致”，而这句话正好就是明察秋毫成语的体现。“明断是非”是指分清楚是和非、正确和错误;“抓大放小”意思是抓住主要矛盾和矛盾的主要方面，搞好宏观控制，对次要矛盾和矛盾的次要方面进行微观调节;“高瞻远瞩”比喻眼光远大。这三个成语在文段中都没有对应，因此排除B、C、D三项。A项中“周密”与“细致”对应，“威慑力”对应“是每个员工不敢马虎”，“搪塞”也可与“马虎”形成对应。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0674","type":"single","t":"及时纠偏，纠错，不仅体现一个社会的集体智慧，也是一个国家理性力量的表现。就像当初如能认识到人口问题的严重性，今天解决人口超负荷的难度就会低得多。因此，从及时纠错的现代理性角度看，适度容忍不同声音是相当必要的，多元价值的重要意义之一便是达到某种_____，以免在一个方向上走得太远而使纠错成本过大。依次填入划横线部分最恰当的一项是:","o":[["A","尽早制衡"],["B","彻底均衡"],["C","公开均势"],["D","坦诚和谐"]],"a":["A"],"an":"纠偏与纠错并列，因此第一空应选择“及时”的近义词，显然只有“尽早”符合语境。验证第二空，根据语境，“适度容忍不同的声音是相当必要的”以免在一个方向上走得太远，所以多元价值的含义就是不同价值间的制约与平衡，“制衡”也最贴近语境，排除B、C、D三项。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0675","type":"single","t":"前些年翻看先生的这本书时，尽管自己对民国话题有着欲说还休的浓厚兴味，对这本话语剪辑独出心裁的编排方式下潜藏的常常默契会心，但读完仍是感到","o":[["A","至理名言戛然而止"],["B","妙言要道耳目一新"],["C","不经之谈百读不厌"],["D","微言大义意犹未尽"]],"a":["D"],"an":"先看第一空，根据文段的叙述，并没有负面消极的感情色彩，“不经之谈”是贬义词，首先排除C项。不经之谈:荒诞无稽、没有根据的话。“至理名言”指最正确的道理，最精辟的言论，用“潜藏”修饰不恰当，排除A项。再看第二空，前面提到“自己对民国话题有着欲说还休的浓厚兴味”，又“常常默契会心”，即说明作者对书中的内容是了解、熟悉的。“戛然而止”指突然停止。“耳目一新”指看见的和听见的都和以前不一样，使人感到新鲜，均不符合文意，排除B项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0676","type":"single","t":"依次填入划横线部分最恰当的一项是:①据此，我认为长期以来的疑惑已②我们要知道竹子的性质，就要特别栽种竹子，以研究它生长的过程，要把叶子切下来拿到显微镜下去观察,决不是_____就可以得到的知识。③这首诗之所以成为的名篇,无论如何不在于如专家所认为的在两句诗中罗列了三座桥和一座山。④他的这种奇谈怪论,看来决非是对历史的无知,而是地捏造谎言。","o":[["A","毋庸置疑一蹴而就家喻户晓居心叵测"],["B","无可厚非唾手可得叹为观止煞费苦心"],["C","迎刃而解袖手旁观脍炙人口别有用心"],["D","不攻自破不劳而获流芳百世千方百计"]],"a":["C"],"an":"本题考查对成语的理解把握。第一空，是本题的破题点。据此后面应跟肯定性的结论，即我的疑惑得到解决。因此排除A、B选项。又因为不攻自破的攻在文中并未体现，故答案锁定C选项。第二空，强调的是要实践，而不是只看看就能学到知识的。因此用袖手旁观最为恰当。第三空，根据描述的对象是名篇，可以确定是脍炙人口。脍炙人口:比喻好的诗文受到人们的称赞和传诵。描述对象是诗文。第四空,可根据奇谈怪论决非捏造谎言等词判断出句子表达的是消极的感情倾向。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0677","type":"single","t":"古人早有“腹有诗书气自华”的_,更直言过士大夫三日不读书,则义理不交于胸中,对镜觉面目可憎,向人亦语言无味。足见读书对人心善良与审美思维的的价值。而且，不同的人生阶段赋予人不同的读书境界，这就更使人一生与书为伴。清人张潮就写过:少年读书，如隙中窥月;中年读书，如庭中望月;老年读书，如台上玩月。人生历练助读书地真意，而读书本身_不是借他人之笔丰富自我的人生。","o":[["A","感慨，培养，须，未尝"],["B","叹息，培育，需，如何"],["C","感叹，塑造，需，怎么"],["D","喟叹，养成，须，何尝"]],"a":["D"],"an":"文段围绕读书对于人自身的重要作用来论述。第一空，考查的是实词的运用。填入的实词用来表述古人对于读书这个行为的一种观点与看法。叹息指的是叹气，更多时候表述的是一种后悔与无奈，这里文段无从体现，故排除B选项。第二空，填入的词表示读书对于人心与审美思维的重要作用，培养按照一定的目的长期地教育和训练，在这里搭配不当，故排除A。第三空,需表示一种需要,须表示必须,感情色彩不同。文段如此强调读书的重要作用,显然人生必须要以书为伴,凸出读书的重要性,故排除C选项。第四空,代入验证,何尝不是进行反问,加强语气,凸显读书的重要作用。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0678","type":"single","t":"吴越历史舞台的中心在哪里，多年来一直是学者与公众共同关注的焦点。尽管古籍文献对此有所但是多有的虽言之凿凿却只是演义。依次填入画横线部分最恰当的一项是:","o":[["A","论证浮光掠影"],["B","涉及穿凿附会"],["C","记载语焉不详"],["D","描述轻描淡写"]],"a":["C"],"an":"本题考查实词与成语的混搭填空。第一空，古籍文献只能是记载或描述，不能论证，故排除A项。第二空，填入的词与其后言之凿凿却只是演义的意思应一致。言之凿凿形容说话有根有据，则言之凿凿却只是演义理解为虽有记载，但不够详细。语焉不详指虽然提到了，但说得不详细，符合语境;浮光掠影比喻观察不仔细或印象不深刻;穿凿附会指把讲不通的或不相干的道理、事情硬扯在一起进行解释;轻描淡写指说话或写文章时对重要的事情一笔带过，不加重视。A、B、D三项中的三个词均与材料语境不符，都不选。该空应选语焉不详。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0679","type":"single","t":"他们讲究亭台轩榭的。讲究假山池沼的，讲究花草树木的讲究近景远景的_，总之，一切都要为构成完美的图画而存在，决不容许有欠美伤美的败笔。依次填入划横线部分最恰当的一项是:","o":[["A","映衬布局配合层次"],["B","配合布局层次映衬"],["C","层次布局映衬配合"],["D","布局配合映衬层次"]],"a":["D"],"an":"本题考查实词填空。通过阅读可知，材料描述的是一幅园林景观图。第三空，花草树木给人一种视觉上的色彩冲击，各种颜色相互衬托辉映，故该空选映衬可排除A、B;近景远景体现的是一种因距离远近,视角不同而形成的层次感,故第四空应选层次。第一空，文中对景观图的描述包含了远近、搭配等多个角度，统归到整体只能是布局的意思。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0680","type":"single","t":"将下列选项中的词语依次填入各句横线，最恰当的一组是:①有些企业在《劳动合同法》实施以前,开始着手解除那些工龄即将满十年的员工的劳动合同，____以未来的经济补偿风险。②广西某饮食服务公司由于狠抓管理,杜绝铺张浪费,三个月下来,仅办公经费一项,就了五十万元。③北京市知名食品企业与北京市食品研究所，历时近两年，研发了200多个样品，并从中出第一批新北京特产。","o":[["A","规避结余遴选"],["B","回避节余遴选"],["C","规避节余筛选"],["D","回避结余筛选"]],"a":["C"],"an":"此题考查实词的填空。第一空规避是指设法躲开，逃避之意，回避则是让开、躲开之意，①中的有些企业解除那些工龄即将满十年的员工的劳动合同是有意为之，规避符合语境，故可排除B、D两项;第二空结余是指结算后余下的，与②叙述的狠抓管理，杜绝铺张浪费没有什么联系，而节余则有因节约而剩下之意，据此可排除A、D两项;第三空筛选泛指通过淘汰的方法挑选，遴选则常用来指选拔人才。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0681","type":"single","t":"这次国际金融危机_了中国特色发展模式的优越性，中国积极应对国际金融危机,并以本国经济增长为相关国家和经济体_____困境提供市场和资金支持,进而在国际危机治理和国际机构改革进程中发挥了建设性作用，改善了国际形象，提升了道义感召力，国际社会开始重新中国发展模式。上面划线处依次填入词语，最恰当的是:","o":[["A","凸显摆脱审视"],["B","显现走出注视"],["C","表明远离注意"],["D","突显去除思考"]],"a":["A"],"an":"本题考查近义实词不同侧重点的辨析和语境搭配。从第二空入手，和困境搭配最恰当的是摆脱，据此可排除C、D。第一空，凸显是指清楚地显露出来，根据文意，国际金融危机涉及很多国家，中国由于其独特的发展模式，从而在所有国家中显现出了优越性，因此凸显比显现更符合语境。第三空，审视是指仔细地观察;注视是指集中目光看，根据国际社会开始重视我国发展模式的语境，审视更为准确恰当。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0682","type":"single","t":"回到故乡时，发现故乡的传统生活方式正在消亡，村里的人们曾经拥有一个而完整的精神世界，但是外面的世界改变了这一切，这个村正在而又急速的转型，只是生活在其中的人依此填入划横线部分最恰当的一项是:","o":[["A","美好不着痕迹似信非信"],["B","淳朴潜移默化漠然无知"],["C","单一默不作声懵懵懂懂"],["D","封闭悄无声息浑然不觉"]],"a":["D"],"an":"本题考查成语和实词的辨析填空。首先看第二空，潜移默化指人的思想或性格受其他方面的感染而不知不觉地起了变化;默不作声指不说话不出声，表示沉默的样子，两者都不能用来形容村庄，故排除B、C项。再看第一空，由外面的世界改变了这一切可知，村里人们原来的精神世界是封闭而完整的。美好与外面的世界无法构成对比，不符合文意，故不选。再看第三空，浑然不觉指完全没有感觉到，用在此处最为合适，与前文的不知不觉形成对照，悄无声息指没有一点声音、动静，不被人所察觉，比喻做事毫无声音。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0683","type":"single","t":"一些学者认为，在信息时代强化互联网服务提供者的责任，实际上就是要求他们对互联网使用者发布的信息进行_，这不利于我国宪法和法律所规定公民的言论自由和出版自由的实现。毫无疑问，这是典型的_。如果散布谣言也属于自由，那么任何人都可以借助互联网散布谣言，损害国家利益、公共利益和公民的合法利益。依次填入画横线部分最恰当的一项是:","o":[["A","过滤偷梁换柱"],["B","整合断章取义"],["C","评价混淆是非"],["D","审核以偏概全"]],"a":["A"],"an":"第一空，根据前后文语义可知，空格处所填动词的意思为，对信息的处理动作不利于自由的实现，整合与评价不会影响自由的实现，故可排除B、C两项。而审核与过滤均可能对自由造成影响，但相较之下，过滤一词更能体现出互联网服务提供者对于互联网使用者发布的信息进行的筛选与清除，而审核并不必然带来筛选与清除，故此处用过滤最为恰当。第二空验证，偷梁换柱比喻玩弄手法，暗中改变事物的性质或内容。与后文散布谣言也属于自由对应恰当。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0684","type":"single","t":"空间探测器拍摄的大量照片和探测仪器的取样分析，揭开了被测行星的大气环境和表面景观的让人看到了它们的真实面目。1997年美国探路者号探测器及索杰纳号火星车拍摄的大量照片和检测结果显示，如今一片荒凉的火星曾经是一个温暖、潮湿的地方，而且可能曾是一个和维持过生命的星球。依次填入画横线部分最恰当的一项是:","o":[["A","面纱孕育"],["B","伪装诞生"],["C","谜底萌发"],["D","帷幕繁衍"]],"a":["A"],"an":"第一空考查词语搭配。本空填入的词应该是与揭开搭配的词语，同时文中非常生动形象描述出揭开了被测行星的大气环境和表面景观，B项伪装语义过于消极，且文段并无曾受过误导的语义与文段不符;D项帷幕与揭开搭配，意指刚刚开始，与语义不符。故排除B、D两项。第二空考查词语含义以及语境。文中空格处与维持生命是顺承关系，那么填入孕育更为合适。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0685","type":"single","t":"重视新生代农民工的社会诉求，地解决他们面临的问题，对于社会的____有着十分重要的意义。依次填入画横线处最恰当的一项是:","o":[["A","因地制宜全面提升"],["B","因人而异高速发展"],["C","因时制宜持续前行"],["D","因势利导长治久安"]],"a":["D"],"an":"第一空，解决的是新生代农民工面临的问题，因地制宜指根据各地的具体情况，制定适宜的办法，本题与地点无关，排除A;因人而异指因人的不同而有所差异，文段中新生代农民工是一个整体，故不存在因人而异的情况，排除B。C项因时制宜意为根据不同时期的情况采取适当的办法，文段中亦无不同的或特定的历史时期，故基本亦可排除。D项因势利导意为顺应事物的发展趋势，向有利的方面引导，此为解决农民工问题的一种趋势，符合文意，基本锁定D项。第二空验证，文段主体为新生代农民工这一底层群体，故解决好他们的问题能对社会起到的最大作用应是维稳、安定，对应选项即为D项长治久安，使社会长期安定、稳固，符合文意。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0686","type":"single","t":"面对如此美丽绝伦的景色，大家不禁发出","o":[["A","赞扬"],["B","赞叹"],["C","赞服"],["D","感叹"]],"a":["B"],"an":"本题属于实词辨析题。A、C两项错误,赞扬强调表扬、赞服强调佩服,两者均不符合语境;B项正确,赞叹指赞美感叹,用在这里感叹景色之美,很合适;D项错误，感叹主要指有所感触而叹息，语境并无叹息之意。因此赞叹更合适。故本题答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0687","type":"single","t":"奥运一百多年的历史始终陷入一种_____，一方面它高扬超越民族的人类精神，另一方面参与竞争的基本单位是民族国家，前者表现为超越功利的尊重和欣赏;后者则是更实在的，不敢怠慢的国家荣誉和自尊心，金牌多寡成了竞争的","o":[["A","困境准则"],["B","矛盾标志"],["C","争议目的"],["D","悖论核心"]],"a":["D"],"an":"考查语境搭配的实词填空。悖论指在逻辑上可以推导出互相矛盾之结论，但表面上又能自圆其说的命题或理论体系。根据文句中一方面……另一方面……可知第一个空填悖论最为合适。第二空的主语是金牌的多寡，具有一定的不确定性，而准则、标志、目的都是明确性的，用核心更贴切。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0688","type":"single","t":"“盛世和光敦煌艺术大发展”正在北京中国美术馆展出，这是迄今为止敦煌艺术在京城最大规模的()，一批又一批的参观者闻讯而来。","o":[["A","活动"],["B","表演"],["C","亮相"],["D","工程"]],"a":["C"],"an":"此题考查实词的语境搭配。活动作为名词时指没某种目的而行动;表演指戏剧、舞蹈等演出，展演;亮相比喻公开露面或表演;工程生产制造部门用庞大或较为复杂的设备进行的工作，还比喻需要耗费大量人力精力的工作。整句话的主语是敦煌艺术展览，后半句中主语是敦煌艺术，所以用亮相较为合适，表演并不适合;活动不符合语境，也没有公开露面的意思;展出与工程并不适合搭配。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0689","type":"single","t":"湿地的生命力是可以被一点一滴看见的。我最先看见的是湿地上的青蛙，它地弹跳，让寂静的湿地有了动感;青蛙落脚的地方，黑颈鹤，动作像骄傲的体操运动员那样自由、舒展;接下来，三三两两的羊像无声的云从村子里飘过来，它们身后是牦牛家族，带着高海拔的困倦与__;再后来，高原上真正的主角放牧者出现了，他们被牦牛这些群众演员簇拥着，压轴出场。","o":[["A","猝不及防腾空跃起慵懒"],["B","始料不及悠然自得疲惫"],["C","出其不意翩翩起舞懒惰"],["D","突如其来昂首阔步疲倦"]],"a":["A"],"an":"从第二、三两个空较易入手，先看第二空，从形容黑颈鹤的动作像骄傲的体操运动员那样自由、舒展可排除形容自由清闲,心情舒畅的悠然自得和形容精神振奋,意气昂扬的昂首阔步,因此可排除B、D两项。再看第三空，形容羊群像云飘过来，可知文段意境悠美，恬静，与C项的懒惰不符;A项的慵懒与空前的困倦相匹配。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0690","type":"single","t":"这几项有关职工福利的方案，是全厂职工代表大会的任何人无权随意改动。","o":[["A","核定"],["B","商定"],["C","规定"],["D","审定"]],"a":["D"],"an":"此题是考查近义实词的辨析。本题对象是职工福利方案，并且在全厂职工代表大会这种相对正式的场合，D项审定是指审查决定，一般用于计划和方案等，适合题意。A项核定是核对、审定，一般用于数据指标等，不符合句意;B项商定是商量决定，不适合职工代表大会;C项规定指对某一事物做出决定，使用范围广，不如审定确切。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0691","type":"single","t":"拖延是一种对待生活的消极态度，你总是寄希望于明天，你终究会被拖入一事无成的困境。再美丽的花朵，终将有枯萎的那一天，不要等到一切都枯萎了再采取行动。","o":[["A","因为所以即使都所以"],["B","如果那么即使也所以"],["C","只要那么哪怕都因此"],["D","只要那么即使都因此"]],"a":["B"],"an":"本题考查虚词中的关联词搭配。前两空考查的是一种假设关系，是本题的破题点。假设一种情况对拖延是一种对待生活的消极态度进行说明。因为……所以……表因果关系。只要……那么……表必要或充足条件。确定答案B。第三、四空考查让步关系。即使，表示假设的让步。承认某种事实，暂让一步，在正常句里常用也呼应，说出结论。哪怕……都……也是让步连词，相当于即使，表示姑且承认某种事实。根据此空无法排除选项。最后一空是对前文的总结，故选择所以因此可以。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0692","type":"single","t":"最近有媒体称，尽管美国表面上称要通过外交途径迫使伊朗，但以副总统切尼为代表的鹰派已经迫不及待，认为通过外交手段不能伊朗的核野心，因此美国媒体更频繁鼓吹对伊朗采取强硬措施。","o":[["A","就范控制"],["B","就范遏制"],["C","屈服遏制"],["D","屈服控制"]],"a":["B"],"an":"此题考查近义实词的填空。就范是指听从支配和控制，一般与迫使形成习惯搭配。遏制有制止之意，即强迫使停止、不允许继续(行动)，与采取强硬措施呼应，比控制一词更恰当。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0693","type":"single","t":"一个人应该从多方面加强自己的道德修养，但首先要做到的是()端正。填入划横线部分最恰当的一项是:","o":[["A","品行"],["B","品性"],["C","态度"],["D","品格"]],"a":["A"],"an":"文段强调的是要加强自身的道德修养，且与端正搭配，品行指的是人品德性，可以与端正构成搭配。品性侧重品质性格，不能与端正构成搭配，排除B。态度是个体对特定对象(人、观念、情感或者事件等)所持有的稳定的心理倾向，材料中并没有特定对象，排除C。品格也与端正搭配不当，排除D。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0694","type":"single","t":"信用卡从根本上改变了我们的花钱方式，当我们用现金买东西时，购买行为就涉及到实际的损失一我们的钱包变空了，然而，信用卡却把交易行为化了，这样我们实际上就不容易感觉到花钱的消极面了。脑成像试验表明，刷卡真的会降低脑岛的活动水平，而脑岛是与消极情绪有关的脑区。信用卡的实质就是我们，让我们感觉不到付账的痛苦。依次填入画横线部分最恰当的一项是:","o":[["A","合理麻痹"],["B","抽象麻醉"],["C","简单迷惑"],["D","概念蒙蔽"]],"a":["B"],"an":"第一空，根据然而一词可知，前后句子语义构成相反关系，前面谈的是实际的损失，具体性的感受，而后面这样我们实际上就不容易感觉到花钱的消极面了，表明信用卡把交易行为从具体变为抽象或概念化了。故可以排除A、C两项。第二空，信用卡支付使我们感觉不到付账的痛苦，结合常识做手术前进行麻醉即是为了达到使人的局部或全身的感觉消失的目的，故第二空填麻醉既形象又符合语境。蒙蔽指蒙上眼睛，侧重于欺骗，不符合语境。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0695","type":"single","t":"舞台上，一个是中国京剧大师，一个是交响乐指挥家;一会儿传来韵味十足的京腔，一会儿又是沁人心脾的管弦乐。面对京剧传承的尴尬和交响乐普及的艰难，这种抱团取暖的方式，对两个不搭界的艺术形式进行嫁接，究竟是还是异想天开?填入画横线部分最恰当的一项是:","o":[["A","相得益彰"],["B","取长补短"],["C","推陈出新"],["D","移花接木"]],"a":["A"],"an":"由原文究竟是……还是……可知，此空应填入一个与异想天开语义相反的词语，表示对这种嫁接的正面评价，故较容易排除D项移花接木。移花接木意为把带花的枝条嫁接在别的花木上，比喻暗地里使手段更换人或事物以达到某种目的，为典型的贬义词，与文段所需的褒义词相悖。对比A、B、C三项。A项相得益彰表示两个人或两件事物互相配合，使双方的能力、作用和好处能得到充分展示，与文段中抱团取暖嫁接等词对应得当;而B项取长补短意为吸取别人长处弥补自己不足，文段中并未重点提及京剧与交响乐的长短之处;C项推陈出新表示去掉旧事物的糟粕，并使它向新的方向发展，文中没有新旧事物的对比。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0696","type":"single","t":"一个思想家或艺术家,没有比把作品写到生命上更令人()。本雅明是这种人如其文的思想家,文字与生命贯彻着忧郁的气质。忧郁性格的人,建立的同时永远潜藏一股自我毁灭力，以否定来肯定一如从忧郁撷取力量。填入括号部分最恰当的一项是:","o":[["A","惊心动魄"],["B","动人心魄"],["C","胆战心惊"],["D","触目惊心"]],"a":["A"],"an":"本题考查成语的辨析填空。空格处的词语用来形容把作品写到生命上带给人的感受。A项惊心动魄形容使人感受很深，触动很大，用在此处合适，突出了文字与生命结合所带给读者心灵上的触动。B项动人心魄指激动人心,非常动人,此处不能说令人动人心魄,排除;C项胆战心惊形容十分害怕;D项触目惊心指看见某种严重情况而内心震惊,形容事态严重,引起轰动;C、D项都有都有害怕之意,用在文段中显然不合适。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0697","type":"single","t":"文学评论中,对形式的模仿与内容的抄袭,不应;对早期的作品和现在的创作，不可","o":[["A","相提并论等量齐观"],["B","等量齐观混为一谈"],["C","混为一谈同日而语"],["D","同日而语相提并论"]],"a":["C"],"an":"本题考查成语的应用。本题可从第二空得出答案。早期的作品和现在的创作体现了时间上的对比，可知同日而语最符合文意。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0698","type":"single","t":"诚然，我们的民族经历了难以计数的可是中华民族顽强不屈的精气神和自信力从来都没有_过，它犹如一座巍峨壮丽永不倒的万里长城，屹立在中华儿女的心里,并_不绝,纵然历经千年的风雨沧桑。填入横线处最恰当的一项是:","o":[["A","内外交困熄灭横亘"],["B","走投无路消灭耸立"],["C","山穷水尽绝灭伸展"],["D","内忧外患泯灭绵延"]],"a":["D"],"an":"此题考查成语和实词的混搭。第一空，首先根据成语的词性来判断，根据上文可知经历了难以计数的，只能选名词性成语，所以排除B、C项。第二空，熄灭指火的熄灭，不能用来形容精气神和自信力。泯灭指行迹、印象的消失，符合语境。第三空，考虑词语搭配，绵延不绝搭配恰当，且没有横亘不绝的说法，故排除A项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0699","type":"single","t":"这个世界不是孤岛，谁都不可能真的，尤其是在网络时代，个人的生活越来越多地与他人关联，旁观他人的生活，感受别人的情绪，接受他们的传播。填入划横线部分最恰当的一项是:","o":[["A","洁身自好"],["B","自得其乐"],["C","独善其身"],["D","一尘不染"]],"a":["C"],"an":"由空格前不可能可知，空格处所填成语应与后文内容形成反义对应。后文强调个人的生活越来越多地与他人关联:旁观他人的生活，感受别人的情绪，接受他们的传播，反义对应即为只顾自己的生活。A项洁身自好形容在污浊的环境中保持自身清白，不同流合污;D项一尘不染形容非常清洁、干净，A、D两项均有出淤泥而不染之意，与文意不符。B项自得其乐表示自己能从中得到乐趣，原文并无乐趣之意。C项独善其身指只顾自己不管别人，符合文段语境。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0700","type":"single","t":"文风源于内心，你表面上可以做到不动声色，但作为情感的，文字通常会将你内心的感受直接表现出来,一个人的文风并不是__的，它会随着人的年龄、心态、思想内涵及的变化而改变。依次填入横线处最恰当的一项是:","o":[["A","宣泄一成不变阅历"],["B","抒发一以贯之经历"],["C","爆发一蹴而就资历"],["D","表露持之以恒历练"]],"a":["A"],"an":"先看第二空，根据后文语义可知，本空填入的词要表达文风不会改变的意思，故排除强调轻而易举的一蹴而就和强调坚持的持之以恒，而一以贯之虽然强调的是不变，但意思为用一个根本性的事理贯通事情的始末或全部的道理，用来形容文风不恰当;故选A项;代入第一空，宣泄更能对应后文的内心感受直接表现出来，阅历一词搭配也得体。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0701","type":"single","t":"法律的道德化和道德的法律化是永不停歇的过程，法律规范和道德规范之间也并非,而是互动互补、","o":[["A","壁垒森严浑然天成"],["B","格格不入相辅相成"],["C","非此即彼水乳交融"],["D","泾渭分明浑然一体"]],"a":["B"],"an":"第二空为本题的突破点，考查成语并列关系，填入的词应该与互动互补词义相近。相辅相成是指两件事物互相配合，互相辅助，缺一不可，符合文意。浑然天成是形容诗文结构严密自然，用词运典毫无斧凿痕迹，亦形容人的才德完美自然;水乳交融比喻感情很融洽或结合十分紧密;浑然一体是指融合成一个整体，不可分割。多用于诗文、绘画等。本文主体为法律规范和道德规范且为论述二者之间的关系，而非成为一体，故排除A、C、D选项。第一空，代入验证，格格不入形容两者之间不协调，不相容，对应文段两个主体且符合语境意思。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0702","type":"single","t":"最早对西方的写实油画表示莫名惊叹欣赏的，是康有为、梁启超一辈。他们对光影效果、_的视觉幻象，及西洋宗教画所体现的人文情怀，都表达了由衷的激赏。填入画横线部分最恰当的一项是:","o":[["A","眼花缭乱"],["B","惟妙惟肖"],["C","光怪陆离"],["D","栩栩如生"]],"a":["D"],"an":"填入空格的词是用来形容视觉幻象的，与前文中写实一词对应可知，康有为、梁启超一辈惊叹的是视觉效果的逼真，故可以排除A项用来比喻事物复杂，无法分辨清楚的眼花缭乱和C项用来形容形象奇特、色彩斑斓的光怪陆离。B选项惟妙惟肖与D选项栩栩如生均可表达逼真，但前者更侧重于模仿或描写，与视觉幻象搭配不够准确;后者则侧重于表达十分逼真，像活的一样，与前文的写实对应更为恰当。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0703","type":"single","t":"毋庸讳言，由于历史的原因，中国看待西方总有一个的影子，那就是历史的悲愤。如果说，这种悲愤过去的外在表现主要是悲，那么今天的表现形式更多的是傲，两者的内在逻辑;我们缺乏与西方世界在心理上真正的平等对视。","o":[["A","挥之不去一脉相承"],["B","纠缠不清如出一辙"],["C","阴魂不散一以贯之"],["D","排解不掉一体相连"]],"a":["A"],"an":"此题考查成语搭配。第一空所填形容词搭配的名词是影子，只有挥之不去可与之搭配。纠缠不清指无法理出头绪，或故意纠缠;阴魂不散比喻坏人、坏事虽已清除，但不良影响还在起作用;排解不掉常与情绪等进行搭配。所以可确定正确答案为A。第二空，两者指代的是过去和今天之间的差别，内含传承之意，故一脉相承可与之对应。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0704","type":"single","t":"看过许多名人访谈，他们无不谈到过去某段时期的迷茫与困惑，低调与失败。彼时，如果他们向命运低头，他们就是失败者。只有冷静下来，摆正心态，才有赢取辉煌的可能，可见，平日的积累与锻炼固然重要，但关键时刻的_____与爆发力却能成就一个真正的王者。填入划横线部分最恰当的一项是:","o":[["A","背水一战表现"],["B","反败为胜勇气"],["C","逆水行舟速度"],["D","反戈一击突破"]],"a":["B"],"an":"此题考查成语和实词的混搭填空。根据语境可知，空格处和空格后赢取辉煌是并列关系，语义相近。第一个空，反败为胜指扭转战局，赢得胜利，符合语境。背水一战比喻在艰难情况下跟敌人决一死战，逆水行舟一般与不进则退连用，比喻不努力就要后退。反戈一击指调转武器向自己所属阵营进行攻击，比喻恩将仇报陷害自己的朋友或盟友的行为。这三个词都没有赢的意思，不符语境。第二个空，勇气和爆发力成就王者，与前文向命运低头成为失败者构成反义关系，符合文意。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0705","type":"single","t":"龙马负图、神龟载书，远古时代河图洛书的传说，数千年来被认为是中华传统文化的源头。河图出于河南洛阳市的孟津县，人们对它已是______，而洛书出于何处，一直_，没有定论。依次填入划横线部分最恰当的一项是:","o":[["A","无可厚非莫衷一是"],["B","了然于胸疑窦重重"],["C","如数家珍扑朔迷离"],["D","妇孺皆知影影绰绰"]],"a":["B"],"an":"先看第一空，根据语境，河图出于河南洛阳市的孟津县是人们都知道、都了解的事情。无可厚非是指没什么可过分责难的，表示虽有缺点，但是可以原谅，表意与语境不符，排除A项;妇孺皆知，可以表述为，某件事妇孺皆知，不能叫作人们已经妇孺皆知，妇孺与人们重复，排除D项。再看第二空，扑朔迷离形容事情错综复杂，不容易看清真相，一般形容案件，疑窦重重指有很多让人怀疑之处，文中提到没有定论，表明洛书出于何处这件事情有很多说法，没有统一的结论，每种说法都不确定，可见疑窦重重更符合语境，排除C项。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0706","type":"single","t":"“制作粗糙”，某文艺评论家这样点评当下国内的许多多媒体舞蹈作品。把几段现成的图像符号式地投射在背景屏幕上充当画外音，充其量只是布景道具的升级版。多媒体效果太过目眩神迷,与舞蹈__，有一种独立于表达之外的野心。比如有一个多媒体舞蹈，投射在大屏幕上的图案随着演员的每个动作变幻:演员伸展双臂，身后便出现万丈光芒，演员抱住身体，灯光也随之黯淡，看上去是在配合表演，其实是在和演员争夺观众的眼球，舞蹈彻底沦为了配角。依次填入画横线部分最恰当的一项是:","o":[["A","哗众取宠失枝脱节"],["B","喧宾夺主貌合神离"],["C","主次颠倒亦步亦趋"],["D","避重就轻格格不入"]],"a":["B"],"an":"本题考查成语的应用。第一空根据和演员争夺观众的眼球，舞蹈演员彻底沦为了配角可知选喧宾夺主，说明外来的或次要的事物占据了原有的或主要的事物的位置;主次颠倒说明事物轻重大小颠倒了位置，因此排除A、D两项。第二空根据独立于表达之外的野心可排除C项，亦步亦趋比喻由于缺乏主张，或为了讨好，事事模仿或追随别人，明显与文意相悖。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0707","type":"single","t":"在食品安全治理上，公众监督很有必要。但从监督治理的来看，公众监督不应该成为监管部门卸责的借口。食品安全太多的专业领域，公众不是专家，不具有科学的手段和方法。","o":[["A","途径涉及检验"],["B","路径涉及检测"],["C","路径牵涉检测"],["D","途径牵扯检验"]],"a":["B"],"an":"第一空考查近义词辨析。途径与路径均有方式、方法之意，前者使用范围更广，后者更为书面化。填入第一空均可。第二空，根据搭配，较易排除D项牵扯，牵扯常与精力等词搭配使用，而非文段中的专业领域。对比涉及与牵涉，后者搭配范围较为消极，牵涉其中的事件往往是不太好的事件，如贪污腐败等，而涉及相对更为中性，使用范围更广。食品安全问题尚未严重到极其败坏的程度，故据此排除C项。第三空考查固定搭配，食品安全是用科学手段和方法检测出来的，而非检验，故排除A项。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0708","type":"single","t":"在画家的笔端，梅兰竹菊，被赋予文人风骨;牡丹荷花，被赋予盛世风范......无论色彩丰富还是清淡，都能读出诗意，读出真诚。要它的____，有每一笔最自然的亮丽，要它的_____，有攀附向上生命力的线条，要它的_____，有花间人的恬淡自在，要它的_，有藤萝架上鸟儿的清唱。依次填入划横线部分最恰当的一项是:","o":[["A","表里远近"],["B","色形意音"],["C","情趣静动"],["D","美力真声"]],"a":["B"],"an":"本题考查语境搭配的实词填空。第一空后的亮丽形容颜色，则该空应填色。第二空后的线条指形态，则该空应填形。第三空后的恬淡自在是一种意境，则该空应填意。第四空后的清唱体现了声音，则该空应填音。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0709","type":"single","t":"家长自己艰苦朴素、尊老爱幼、和睦邻里、乐于助人，会使孩子耳濡目染，久而久之便留下深刻的烙印。这时，稍加言教点拨，就能收到事半功倍的效果。_，如果家长自己言行不一、碌碌无为、不孝敬长辈、见利忘义，难以使自己的言教有说服力，会为孩子树立坏的榜样。填入划横线部分最恰当的一项是:","o":[["A","只有才相反因为所以"],["B","只要就同时既又"],["C","既然就可见不仅还"],["D","如果就反之不但而且"]],"a":["D"],"an":"本题考查关联词辨析。先看最后一空。根据句意可知，难以使自己的言教有说服力与会为孩子树立坏的榜样两分句之间存在递进关系，排除A、B两项。再分析可知家长艰苦朴素、尊老爱幼与如果家长自己言行不一、碌碌无为属于并列关系，因此第一空填如果更恰当。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0710","type":"single","t":"个体户目前正面临日益的竞争和税费两大压力，个体户的急剧减少导致大量小资金无法进行常规创业，从而转向投机，进而使社会的不稳定程度。","o":[["A","残酷加剧"],["B","残酷加大"],["C","激烈加剧"],["D","激烈加大"]],"a":["C"],"an":"考查近义实词语境辨析与填空。第一空中，残酷意为凶狠冷酷，用在此处程度过重;激烈意为激越，猛烈。个体户之间的竞争用激烈形容比较贴切。第二空中,加大意为变大;加剧意思是使程度变得更严重。因此题干中社会的不稳定程度用加剧合适，且程度加剧是固定搭配。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0711","type":"single","t":"我国的残疾人事业总体呈现出梯次发展的格局，随着新中国的成立基础日渐牢固，随着改革开放的逐步深入而不断发展，其既有传统的一，也有政策的一还有时代的一。","o":[["A","延续继承跟进"],["B","延续传承烙印"],["C","延绵继承烙印"],["D","延绵传承跟进"]],"a":["D"],"an":"本题考查近义实词的程度辨析和语境搭配。第一空，延绵指形态上的连贯、延续不断;延续指事件或动作上的持续、继续。与第一空搭配的是传统，因此延绵更为恰当。由深入而不断发展可知，后面的表达有积极发展义，故第三空跟进比烙印更恰当。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0712","type":"single","t":"2012年8月，美国好奇号火星车在火星表面着陆，这是人类迄今在其他星球登陆的最精密的移动科学实验室。好奇号将测量火星岩石和泥土中不同化学的丰度，火星表面的辐射环境及其对未来登陆火星宇航员的危害，火星是否具有适宜生命存在的环境，行星变化的线索。","o":[["A","评价找寻跟踪"],["B","判断考察挖掘"],["C","测算探究注意"],["D","评估探索寻找"]],"a":["D"],"an":"第一空，选项A的评价和选项B的判断都是形容得到固定的结论，而文中是在描述探索寻找的过程，故排除A、B两项。第三空,线索与寻找为固定搭配,故确定D项。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0713","type":"single","t":"赵景深在《文心剪影》里说:他(叶圣陶)的复信措辞谦抑，字迹圆润丰满，正显出他那_而又诚实的心。正如当年他主编《小说月报》曾精心培育了一大批后来成为新文学史上的著名作家时那样。他那_的精神和工作态度，给予年轻一代的教育、鼓舞的力量是无法的。","o":[["A","谦卑兢兢业业估价"],["B","谦和公而忘私估量"],["C","正直大公无私衡量"],["D","率真孜孜以求想象"]],"a":["B"],"an":"本题第一空可考虑暗示词,对应前文复信措辞谦抑,所以第一空只能是谦和或者是谦卑，排除C、D两项。第三空可考虑习惯搭配，要和力量搭配，只能是估量，而不能是估价，排除A项。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0714","type":"single","t":"对大多数人来说，岗位是个人历练成长的基石，除了极少数的人能创建自己的事业，大多数人都必须走一条相同的路:在岗位上磨练，依托奠定未来事业的基础。依此填入划横线部分最恰当的一项是:","o":[["A","直接组织"],["B","主动团队"],["C","独立同事"],["D","一手集体"]],"a":["A"],"an":"本题考查近义实词的辨析填空。根据除了极少数……，大多数……的引导可知，前后部分构成相反关系。材料最后说在岗位上磨练，依托某种力量，奠定事业的基础，那么第一个空格要表示无需磨练，无需依托某种外力的意思，所以第一个空格应该选填直接一词，主动独立一手都不是与后文的准确相反关系。第二空的各个词语意思相近，填入第二空中均可，主要看第一空的选择。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0715","type":"single","t":"酒主要以液态形式存在。在古代缺乏严密容器的条件下是很难保存的，因此出土的古酒就十分","o":[["A","长期罕见"],["B","完好珍贵"],["C","妥善难得"],["D","大量稀少"]],"a":["A"],"an":"本题考查实词的最佳语境搭配。第一空，应与前面以液态形式相呼应，古代难以保存酒是因为缺乏严密容器，作为液态的酒是会挥发的，所以长期保存很难，此处选长期更符合语境。C项妥善主要用于形容处理事情正确恰当，不合文意，排除。第二空，根据因此可知是前文的结果，其主语是出土的古酒，正因为难以长期保存，所以很少发现有古酒出土。珍贵没有体现少的含义，与语境不符;稀少虽强调少，但不如罕见程度重;罕见强调难得见到，更符合语境。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0716","type":"single","t":"依次填入下列横线处的词语，最恰当的一组是:命与运如骨肉之不可剥离，然而倘作理性研究，医学上的生理解剖，需先就骨论骨，就肉论肉。","o":[["A","必然如也"],["B","必然同则"],["C","固然同也"],["D","固然如则"]],"a":["D"],"an":"本题是对虚词中关联词的考查。第一空，固然……然而……是表转折关系的固定搭配。此处固然表示承认某个事实，引起下文转折，理性研究不是这样。必然表述太过绝对，排除。第三空，则表顺承关系，所连接的前一部分表原因，后一部分表结果。因为理性研究不是这样，所以要就骨论骨，就肉论肉。第二空，是插入生理解剖的例子，来做例证，举例子用如。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0717","type":"single","t":"不可以想象，没有以学术作为内容的思想，将成为怎样一种思想，而没有思想的学术，这种学术还有什么价值?思想和学术它们之间没有不是东风压倒西风，便是西风压倒东风那种()的关系。填入括号部分最恰当的一项是:","o":[["A","非此即彼"],["B","针锋相对"],["C","势不两立"],["D","此消彼长"]],"a":["C"],"an":"本题考查成语的辨析填空。空格处前边的语境不是东风压倒西风，便是西风压倒东风是对空格处的解释，说明:学术与思想相互对立，且只能有一个存在。C势不两立指两种事物不能同时存在，互相敌对，与前文表述一致，正确。A非此即彼:非:不是;此:这个;即:便是;彼:那个。在两者之间必取其一的选择，并没有体现两者不能共存的关系，故不符文意;D此消彼长意为我方削弱了，相对比起来，就会感觉对方的力量增长了，也没体现二者的对立关系。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0718","type":"single","t":"作为领导者，要心胸宽广，对于不同的人和不同的意见，要既能坚持原则又能","o":[["A","打击报复"],["B","听之任之"],["C","同情怜悯"],["D","灵活处理"]],"a":["D"],"an":"本题考查实词语体色彩的辨析与填空。填入划线部分的词应与坚持原则相对应，并且感情色彩应有褒义倾向。因此，结合选项应该选择D。选项A、B、C感情色彩与语境不符。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0719","type":"single","t":"世间的事物很少能比大学更美。在这里，憎恨无知的人奋力求知，真理的人传授真理，在青年们长知识的年华里，大学给予他们远大目标和共同生活的规范，给予他们渴望得到的亲密友情，让青年人永无止境地对永恒的主题。没有这些，青春便只是耗费时光。依次填入划横线部分最恰当的一项是:","o":[["A","通晓言无不尽"],["B","谙悉各抒己见"],["C","敬畏上下求索"],["D","掌握高谈阔论"]],"a":["B"],"an":"第一空,由句意可知,只有洞悉真理的人才能传授真理,敬畏有敬重害怕之意,与文意不符，排除C项。第二空，高谈阔论原指志趣高雅、范围广泛的谈论，含褒义;现也用来指大发议论或不着边际的谈论，含贬义。而文段中既没有体现出传授真理的人志趣高雅，又没有体现出贬义语境，排除D项。言无不尽多与知无不言连用，强调把知道的全部说出来，没有保留，文段侧重的是对主题的讨论，而不是全部说出来，排除A项。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0720","type":"single","t":"列夫·托尔斯泰创造了19世纪俄国小说艺术的巅峰，他能把拿破仑进军俄国的战争史诗般的场面驾驭自如，能把安娜的人性刻画得，像这样的大手笔后来的作品再也没有了。填入划横线处最恰当的一项是:","o":[["A","惟妙惟肖"],["B","妙笔生花"],["C","入木三分"],["D","鬼斧神工"]],"a":["C"],"an":"本题考查固定搭配。空格处所填词语用以修饰托尔斯泰对安娜的人性刻画。A项惟妙惟肖意为模仿或描写得非常美妙，非常逼真，多搭配人物形象，而非人性，排除;B项妙笔生花形容写作技巧高超，能创作出精美的作品，侧重强调人的写作功力，排除;D项鬼斧神工意为鬼神所造，非人力所为，形容建筑、雕塑等技艺高超奇妙，显然与文段中写作这一大背景搭配不当，排除。而C项入木三分比喻见解、议论非常深刻，与人性刻画等词的搭配均可，当选。故正确答案为C。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0721","type":"single","t":"依次填入下列横线处的词语，最恰当的一组是()。①全面建设小康社会，要求我们的干部一定要当好人民的公仆，否则就是对这一称号的②春节临近，海峡两岸人民三通呼声越来越高，然而台湾当局却认为，与大陆谈判的时机还不成熟。本来可以深入的新一轮谈判因此而了。③著名足球评论员王健翔认为，要想彻底解决中超联赛中执法不公的黑哨问题，就必须产生这一现象的社会土壤。","o":[["A","污蔑搁浅铲除"],["B","诬蔑搁浅根除"],["C","污蔑搁置根除"],["D","诬蔑搁置铲除"]],"a":["A"],"an":"此题是考查近义实词的辨析。第一空，诬蔑是歪曲事实，造谣毁谤，败坏人家的名誉。污蔑主要是用话语栽赃陷害的意思。污强调使脏，而诬更强调捏造事实，题目并没有捏造事实的情况，应选污蔑。故排除B、C项。第二空，搁浅是比喻事情遇到阻碍而中途停了下来，搁置则指把事情放到一边，不去管它，题目的意思是谈判受到台湾当局的阻碍而不能进一步发展，搁浅更符合文意。故本题正确答案为A。第三空，铲除的对象除抽象事物，如旧思想、旧意识外，还可指具体事物如铲除杂草等。根除比铲除的程度重，对象多是抽象的有害的事物。黑哨问题不是抽象事物，用铲除合适。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0722","type":"single","t":"随着时间的推移，新一代农民开始()自己的打工生涯，并希望能融入城市，走出农民工这个身份模糊的地带。","o":[["A","计划"],["B","谋划"],["C","策划"],["D","规划"]],"a":["D"],"an":"要填入词语搭配生涯，生涯主要用于与工作有关的情况，强调持续性，D项规划就是指进行比较全面的、长远的发展计划，是对未来整体性、长期性问题的思考，二者搭配恰当，且规划生涯为常见搭配。A、C两项均无法体现持续性，没有D项搭配恰当，排除A、C两项;谋划指试图找到解决办法，文段没有此意，排除B。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0723","type":"single","t":"在这场全球性的金融危机中，中国不可能","o":[["A","特立独行"],["B","独善其身"],["C","独步天下"],["D","孤独求败"]],"a":["B"],"an":"本题考查选择成语填空的能力。空格之前的语境与空格构成了条件关系，即全球性金融危机情况下，中国必然受到影响，强调危机与中国的联系性。B项正确，独善其身意思为在不好的环境中，只顾保全自己，也有修身养性的意思，综合来看，符合语境。A项特立独行意思为不随波逐流，强调个人志行高洁;C项独步天下意思为超群出众，无人可比;D项孤独求败强调能力卓著，无人能打败。A、C、D三者均强调个人特性，无法体现中国与环境的联系性。故正确答案为B。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0724","type":"single","t":"根据历史上的真人真事进行文艺创作时，为了使人物表现的更为可以对人物进行符合本身和时代背景的适当创作，但是大的历史事实、人物命运、主要矛盾、重要事件都必须符合历史，不能对历史人物的人生层面进行和歪曲。从下列选项中选择最恰当的一组填入横线中:","o":[["A","完整杜撰"],["B","真实虚构"],["C","形象改编"],["D","丰满臆造"]],"a":["D"],"an":"此题考查实词的语境搭配。第一空，题干提到对人物进行适当创作，在此意味着合理的加工，所以是会使人物表现得更丰满、有血有肉的。丰满都可以表达此意，任务塑造本身就是形象;完整是指不片面，没有语境支撑;真实是不虚假，不合适当创作的语境，所以基本锁定D项。第二空，根据与第二个空并列的歪曲一词可知，第二个空从色彩上看应是个贬义词，臆造是无根据的创造，含贬义。而其他词语都是中性词，都不选。综上，正确答案为D。故正确答案为D。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0725","type":"single","t":"在一定程度上，技术的飞速发展与国家之间的竞争有着的关系。战抑或冷战时期，某些领域尤其是军事领域的科学突破即是例证，以登月为标志的航天科技的突飞猛进只是其中之一。但如果将今天的进步缓慢归因于竞争不充分，甚至怀念那样一个阴暗、极端、意识狭隘的时代，显然是的。人类所有可以称道的文明进步最终在于包容和协助，事实上，目前的太空探索也正是朝着国际合作的方向努力。依次填入划横线部分最恰当的一项是:","o":[["A","相辅相成荒谬"],["B","此消彼长无奈"],["C","不可或缺可怕"],["D","休戚与共落伍"]],"a":["A"],"an":"第一空，由某些领域尤其是军事领域的科学突破即是例证可知，技术的飞速发展与国家之间的竞争应该是促进关系，而此消彼长指这个上升，那个下降，排除B项。休戚与共形容彼此之间关系密切，利害一致，也不符合语境，排除D项。第二空，从后半句的感情色彩判断，怀念那个时代的做法是不可取的，所以荒谬(不合常理)要比可怕(令人害怕)更适合。故正确答案为A。","tp":"选词填空","d":"中"},
	{"i":"fjcs_0726","type":"single","t":"中国是世界上稀土资源最丰富的国家，素有“稀土资源”之称，下列属于稀土的表述，错误的是()","o":[["A","我国是稀土资源储藏大国，也是稀土产品生产、应用和出口大国"],["B","美国是稀土的主要使用国，目前中国出口的稀土数量占全球之首"],["C","稀土一般是以氧化物状态分离出来的，稀土的得名是因为很稀少"],["D","我国的稀土储量占世界稀土储量的百分比近年来因开发已经下降"]],"a":["B"],"an":"本题考查地理国情常识。ACD表述都是正确的，只有B选项是错误的，错误原因是日本是稀土的主要使用国，而不是美国。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0727","type":"single","t":"下列关于隐形飞机的原理，说法错误的是()","o":[["A","外层涂料的颜色为天蓝色或者银白色，以避免被雷达发现"],["B","除了发动机、电子设备等部件，飞机上的其他部件用透波材料来制作"],["C","改进发动机的进气道和尾喷口等所有能产生镜面反射的表面，以减少对雷达波的反射"],["D","隐形飞机采用非金属材料或者雷达吸波材料，吸收而不是反射雷达波"]],"a":["A"],"an":"本题考查科技常识。A选项是错误的，隐形飞机的外层涂料的颜色是黑色，而不是天蓝色或者银白色。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0728","type":"single","t":"与我国接壤的金砖国家有()","o":[["A","1个"],["B","2个"],["C","3个"],["D","4个"]],"a":["B"],"an":"金砖国家(BRICS)是指巴西、俄罗斯、印度、中国、南非五国。其中与我国接壤的是俄罗斯和印度，共2个。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0729","type":"single","t":"下列诗句描写菊花的是()","o":[["A","总被东风吹作雪，绝胜南陌碾成尘"],["B","寂寞东篱湿露华，依前金靥照泥沙"],["C","疑是广寒宫里种，一秋三度送天香"],["D","冲天香阵透长安，满城尽带黄金甲"]],"a":["B"],"an":"本题考查文学常识。“寂寞东篱湿露华，依前金靥照泥沙”出自宋·范成大《重阳后菊花二首》，描写的是菊花。A项描写的是柳絮，C项描写的是桂花，D项描写的是菊花但非题干所指（注：原卷解析指定B为正确选项）。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0730","type":"single","t":"下列哪项没有运用热胀冷缩原理()","o":[["A","医生用水银温度计给病人量体温"],["B","架设电线时，两个电线杆之间的电线要略有下垂"],["C","古代人在冬天往岩石缝里灌水，水结冰后膨胀使岩石碎裂"],["D","夏季自行车胎不能打太足的气"]],"a":["C"],"an":"考察热胀冷缩原理。C选项水结冰后膨胀使岩石碎裂，是利用水结冰体积膨胀的原理，不属于热胀冷缩。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0731","type":"single","t":"血浆包括各种矿物质、糖类、脂类、蛋白质、激素和维生素等。在上述各种物质中，造成血液颜色为红色的是()","o":[["A","激素"],["B","蛋白质"],["C","糖类"],["D","维生素"]],"a":["B"],"an":"本题考察医学常识。造成血液颜色为红色的是蛋白质（血红蛋白）。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0732","type":"single","t":"经济增长通常是指在一个较长的时间跨度上，一个国家人均产出(或人均收入)水平的持续增加。拉动经济增长的三大主要因素不包括()","o":[["A","投资"],["B","消费"],["C","信贷"],["D","出口"]],"a":["C"],"an":"拉动经济增长的三大马车分别是投资、消费、出口。信贷不属于三大因素。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0733","type":"single","t":"下列行为侵犯到他人知识产权的是()","o":[["A","甲模仿某知名作家的写作风格创作小说并以该作家名字公开发表"],["B","甲因无法分辨真假销售某高仿皮包，但未给商标权利人造成损失"],["C","甲开发“A之C”游戏并公开销售，但“AC”商标的权利人是乙"],["D","甲申请注册“AC琴行”，“AC”二字与某知名电脑商标完全重合"]],"a":["C"],"an":"根据《商标法》第9条，申请注册的商标，应当有显著特征，便于识别，并不得与他人在先取得的合法权利相冲突。C项甲开发的游戏名称与他人商标相同，侵犯了商标权。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0734","type":"single","t":"下列有关核能表述正确的是()","o":[["A","氢弹爆炸发生轻核聚变，其威力比原子弹小"],["B","核电站使用的燃料一般是铀等放射性重金属"],["C","自然界只有在人为条件下才会发生热核反应"],["D","核电站的能量转换过程是直接从核能到电能"]],"a":["B"],"an":"核电站一般都是使用铀等放射性金属的。A项氢弹威力比原子弹大；C项太阳的热核反应不是人为的；D项核电站是核能-内能-机械能-电能。","tp":"常识判断","d":"中"},

	{"i":"fjcs_0737","type":"single","t":"下列哪组词语都与中国古代科举考试有关?()","o":[["A","蟾宫折桂、桂冠、连中三元"],["B","问鼎中原、独占鳌头、蟾宫折桂"],["C","连中三元、五子登科、名落孙山"],["D","金榜题名、桂冠、独占鳌头"]],"a":["C"],"an":"蟾宫折桂、连中三元、五子登科、名落孙山、金榜题名、独占鳌头都与科举考试有关。桂冠源于古希腊，问鼎中原与楚庄王有关。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0738","type":"single","t":"下列语句与出处对应错误的是()","o":[["A","不战而屈人之兵-----《孙子兵法》"],["B","知之为知之，不知为不知，是知也-----《韩非子》"],["C","天时不如地利，地利不如人和-----《孟子》"],["D","青出于蓝而胜于蓝-----《荀子》"]],"a":["B"],"an":"“知之为知之，不知为不知，是知也”出自《论语·为政》，不是《韩非子》。","tp":"常识判断","d":"中"},

	{"i":"fjcs_0741","type":"single","t":"《三国演义》开篇称:“天下大势，分久必合，合久必分”，但是这句话未必准确，因为()","o":[["A","事物的发展需以条件为背景"],["B","事物的本质不以时间为转移"],["C","事物的质变从量变开始的"],["D","矛盾双方是可以相互转化的"]],"a":["D"],"an":"“分”与“合”是矛盾双方，二者相互转化，没有体现A、B、C。","tp":"常识判断","d":"中"},

	{"i":"fjcs_0743","type":"single","t":"下列奖项与其表彰对象对应关系错误的是()","o":[["A","菲尔兹奖--数学家"],["B","普利策奖--记者"],["C","南丁格尔奖--医生"],["D","图灵奖--计算机科学家"]],"a":["C"],"an":"南丁格尔奖是表彰在护理事业中做出卓越贡献人员的最高荣誉奖，授予护士。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0744","type":"single","t":"地震是地球上的主要自然灾害之一，下列关于地震的说法，错误的是()","o":[["A","地震活动在时间分布上具有一定的周期性"],["B","环太平洋地震带是地球上地震最活跃的地区"],["C","里氏地震规模每增强一级，释放的能量增加10倍"],["D","有记录以来最大的一次地震是1960年智利大地震，其震级为9.5级"]],"a":["C"],"an":"里氏地震规模每增强一级，释放的能量大约增加32倍。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0745","type":"single","t":"下列关于医学常识的说法，错误的是()","o":[["A","临床上一般以血红蛋白的浓度值作为诊断贫血的依据"],["B","卡介苗是一种疫苗，一般在婴儿出生后接种，可以预防结核病"],["C","游泳时应避免将水咽入口中，以免水通过鼻咽部进入中耳引发中耳炎"],["D","人体骨密度在达到高峰值后会逐年下降，男性下降幅度较女性大"]],"a":["D"],"an":"女性骨密度下降幅度较男性明显，尤其是60岁以后。","tp":"常识判断","d":"中"},
	{"i":"fjcs_0746","type":"single","t":"对于一个经历过贫困童年的富翁来说，他的消费行为有时显得()。对于大金额的支出，他会随随便便，甚至显得有些铺张浪费;而对于小金额的支出，他则不得不与自己的吝啬性作斗争。","o":[["A","变幻莫测 积重难返"],["B","出人意料 与生俱来"],["C","反复无常 根深蒂固"],["D","不可思议 始终如一"]],"a":["C"],"an":"先看第一空，富翁的消费行为不可能“不可思议”或“出人意料”。再看第二空，“根深蒂固”强调原本、根本，与贫困童年经历相呼应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0747","type":"single","t":"及时纠偏，纠错，不仅体现一个社会的集体智慧，也是一个国家理性力量的表现。就像当初如能认识到人口问题的严重性，今天解决人口超负荷的难度就会低得多。因此，从及时纠错的现代理性的角度看，适度容忍不同声音是相当必要的，多元价值的重要意义之一便是达到某种()，以免在一个方向上走得太远而使纠错成本过大。","o":[["A","尽早 制衡"],["B","彻底 均衡"],["C","公开 均势"],["D","坦诚 和谐"]],"a":["A"],"an":"“纠偏”与“纠错”并列，第一空选“尽早”。第二空，多元价值强调各方制衡。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0748","type":"single","t":"对于吸引人才，地方政府最应该做的，是营造一个适合人才流动、有利人才成长的环境与空间，而不是直接参与、甚至()企业的人才录用过程。其实，自由、公平的竞争本身就是对人才最好的回报，足够的成长空间才是吸引人才、留住人才的沃土。","o":[["A","主导 长久"],["B","干预 直接"],["C","破坏 长期"],["D","影响 有效"]],"a":["A"],"an":"“而不是……甚至……”递进，第一空选“主导”。企业需要的是长久留住人才。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0749","type":"single","t":"文具行业以其覆盖面广、技术含量低、进入门槛极低、投资少见效快、市场需求大等因素吸引许多中小企业纷纷投资，但有些企业为了单纯扩大()，采取降价策略，屡屡造成国际贸易()，这些问题亟须引起有关部门重视并加以调控。","o":[["A","效益 纠纷"],["B","规模 争端"],["C","产量 矛盾"],["D","出口 摩擦"]],"a":["D"],"an":"由“国际贸易”可知，第一空选“出口”，“国际贸易摩擦”是固定用语。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0750","type":"single","t":"如果全球变暖导致海平面大幅上升，和其他国家一样，中国将要()被海水淹没地区的人口，特别是长江下游河段，或者建造大坝保护地处低洼地区的沿海城市，这些都需要巨大的花费。中国和其他国家面临的挑战是限制二氧化碳的排放，从而()全球变暖所导致的最坏结果的发生，这在未来20年里更加重要。","o":[["A","转移 阻止"],["B","控制 避免"],["C","延缓 减少"],["D","安置 改变"]],"a":["A"],"an":"第一空，“被海水淹没地区的人口”应被“转移”或“安置”，排除B、C。第二空，“结果的发生”被“阻止”，排除D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0751","type":"single","t":"龙马负图、神龟载书，远古时代河图洛书的传说，数千年来被认为是中华传统文化的源头。河图出于河南洛阳市的孟津县，人们对它已是()，而洛书出于何处，一直()，没有定论。","o":[["A","无可厚非 莫衷一是"],["B","了然于胸 疑窦重重"],["C","如数家珍 扑朔迷离"],["D","妇孺皆知 影影绰绰"]],"a":["B"],"an":"第一空，河图出于孟津县是人尽皆知的，排除A、D。第二空，“扑朔迷离”形容事情错综复杂，不容易看清真相，“疑窦重重”指有很多使人怀疑之处，文中说“没有定论”，用“疑窦重重”更合适。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0752","type":"single","t":"在多元文化语境下，出现的情感价值取向实属正常现象，我们充分尊重个人的情感选择。但是，过度()情感的极端自由、极端物欲，其实会给个人的幸福带来许多内伤。","o":[["A","林林总总 鼓吹"],["B","琳琅满目 渲染"],["C","纷繁芜杂 追逐"],["D","标新立异 强调"]],"a":["A"],"an":"第一空，“琳琅满目”多指书籍或工艺品，不能修饰“情感价值取向”，排除B；“纷繁芜杂”强调杂乱，没有条理，排除C；“标新立异”强调“新”和“异”，排除D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0753","type":"single","t":"从社会学的眼光看，重复博弈的结果之一可能是博弈双方由陌生人变为熟人，甚至成为()，并发展出超越当下经济互动关系之外的其他社会关系。假如当前的经济互动关系只不过是发生在双方之间的多种社会交往之中的一种，其他社会交往就可能()当事人在当下博弈中的策略选择。","o":[["A","伙伴 加快"],["B","搭档 操纵"],["C","朋友 影响"],["D","同僚 改变"]],"a":["C"],"an":"第二空前面有“甚至”，应填入比“熟人”程度更深的词，排除A、B、D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0754","type":"single","t":"情报专家巴克斯特在给花草浇水时，脑子里突然出现了一个()的念头，也许是经常与间谍、情报打交道的缘故，他竟()地把测试仪器的电极绑到一株天南星植物的叶片上。","o":[["A","古怪 异想天开"],["B","奇怪 突发奇想"],["C","怪异 浮想联翩"],["D","奇特 心血来潮"]],"a":["A"],"an":"第二空，“浮想联翩”与“一个念头”矛盾，排除C；“心血来潮”与前文“脑子里突然出现了一个念头”重复，排除D。第一空，“古怪”比“奇怪”程度更深。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0755","type":"single","t":"人类和其他生物一样，都是自然界进化的结果，其他生物在享用大自然赋予的资源时，与人类拥有同样的()。达尔文在《物种起源》一书的最后，写下了一段()的话语：地球依照重力定理绕行太阳，从这么简单的起源，进化出无数最美丽、最奥妙的事物。","o":[["A","待遇 深入浅出"],["B","地位 奥妙无穷"],["C","权利 发人深省"],["D","优势 耐人寻味"]],"a":["C"],"an":"第一空，“待遇”一般与“享受”搭配，排除A；“地位”和“优势”与“享用资源”搭配不当，排除B、D。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0756","type":"single","t":"拉丁美洲曾深受西方殖民主义之害，这形成了拉美人民在苦难中反思和抗争的传统，并铸就了()的精神，正是这种精神气质使拉美电影在世界影坛()。","o":[["A","百折不挠 独树一帜"],["B","坚韧不拔 长盛不衰"],["C","矢志不渝 别具一格"],["D","奋发图强 独具匠心"]],"a":["A"],"an":"第一空，“矢志不渝”“奋发图强”与“反思和抗争”语意不符，排除C、D；“坚韧不拔”一般形容意志，排除B。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0757","type":"single","t":"意大利地处欧亚大陆和非洲大陆板块的挤压带上，因此境内活火山较多。频繁爆发的火山给意大利人带来了丰厚的()，可作为优质胶凝材料的火山灰。这种()的自然条件使古罗马人利用火山灰发明了自然混凝土。","o":[["A","收获 天造地设"],["B","回报 应有尽有"],["C","财富 举世无双"],["D","馈赠 得天独厚"]],"a":["D"],"an":"第一空，火山灰是大自然给的，用“馈赠”合适。第二空，意大利的这种自然条件是独特的，用“得天独厚”。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0758","type":"single","t":"“查清中国海，进军三大洋，登上南极洲”是曾经的海洋梦想“老三样”，这个梦想也只是在本世纪初才得以实现。但限于当时的能力，主要做的是海洋的表面文章，对于海面之下隐藏的深海神秘世界，则只是()。","o":[["A","完整 浅尝辄止"],["B","部分 走马观花"],["C","彻底 浮光掠影"],["D","具体 蜻蜓点水"]],"a":["A"],"an":"第一空，这些梦想都已实现，排除B；第二空，“浅尝辄止”指略微尝试一下就停止，比喻不肯下功夫深入钻研，符合语境。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0759","type":"single","t":"对城市建设焕然一新的追求，不仅会使城市记忆受到损坏甚至毁灭，也是对城市中人的生活情感的()。城市中长期积淀形成的文化风格和人文环境，被当作了“过时”的东西予以()或抛弃，城市记忆也因此没有了依托对象。","o":[["A","轻视 改造 居无定所"],["B","淡忘 分解 无依无靠"],["C","漠然 整饬 孤苦伶仃"],["D","亵渎 批判 举目无亲"]],"a":["A"],"an":"第三空，“居无定所”形容没有固定的居住位置，与城市记忆没有依托对象对应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0760","type":"single","t":"负面新闻并不是永远都制造()，从商业角度看，负面宣传在某种情况下可以()销售，尤其在公司和产品不知名的情况下。曾有研究者发现，如果某些书籍的作者让读者感觉()，书被评为劣作却能起到相反的效果——它们的销量增加了45%。","o":[["A","伤害 促进 亲切"],["B","损失 带动 熟悉"],["C","悲剧 刺激 陌生"],["D","难题 提高 冷淡"]],"a":["C"],"an":"第三空，公司与产品在不知名的情况下，读者对其感觉“陌生”最恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0761","type":"single","t":"想法或假说的产生，来源于研究者的思想，用来解释事物的成因，寻找或构造相关的()，以便揭示所观察到的事实的真相。因而，假说完全有可能是()的。知道这一点，养成产生想法时保留判断的习惯就非常重要。","o":[["A","自由 证据 错误"],["B","主观 定律 歪曲"],["C","特别 学说 荒谬"],["D","独立 理论 虚假"]],"a":["A"],"an":"第二空，“证据”是证明事实的依据，符合寻找或构造证据来揭示真相。第三空，假说没有证据可能是错误的。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0762","type":"single","t":"在美国，失业保险金的主要()是雇主缴纳的失业保险税，只有少数几个州会向职工征收失业保险税。税率根据雇主裁员前享受失业保险待遇的雇员人数的多少而上下浮动，解雇率越高，税率越高，这种计算方式可以有效()雇主的解雇行为。","o":[["A","构成 避免"],["B","类型 减少"],["C","来源 抑制"],["D","保障 降低"]],"a":["C"],"an":"第一空，讲的是失业保险金的来源问题，选“来源”。第二空，“抑制”解雇行为搭配恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0763","type":"single","t":"新闻媒介是沟通社会与政府的重要桥梁，在政务信息传输系统中具有()的作用。但体制转型的压力，加之巨大利益的诱惑及制度缺失，给记者的职业操守带来巨大()，各种虚假报道不时见诸报端。","o":[["A","独一无二 冲击"],["B","独树一帜 影响"],["C","无与伦比 挫折"],["D","无可厚非 挑战"]],"a":["A"],"an":"第一空，“独树一帜”比喻自成一家，不能修饰“作用”，排除B；“无可厚非”不能作定语，排除D。第二空，“冲击”职业操守搭配恰当。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0764","type":"single","t":"在知识大爆炸的今天，不少人已习惯于浅阅读，这虽在所难免，其()也是明显的。浅阅读虽能够收获一些印象式的谈资，但()之中透露出的是浮躁心气，很难为提升阅读者主体素质的扎实“文化准备”。","o":[["A","代价 走马观花 转换"],["B","影响 浅尝辄止 汲取"],["C","弊端 浮光掠影 沉淀"],["D","局限 言谈举止 锤炼"]],"a":["C"],"an":"第一空，浅阅读带来的弊端明显。第三空，“沉淀”与“扎实文化准备”对应。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0765","type":"single","t":"欧盟《传统植物药注册程序指令》大限将至，中药出口欧洲遭遇严冬，人们不禁对中药产生了不小的怀疑。这其中确有中药自身种植、生产加工不统一的原因，致使药效和安全性能受到国际市场()，但究其深层原因，则与国际中药市场暗藏的利益争夺不无关系。","o":[["A","标准化 排斥"],["B","现代化 指责"],["C","产业化 发难"],["D","国际化 质疑"]],"a":["D"],"an":"第一空，中药出口欧洲遭遇严冬，直接受影响的是中药的“国际化”问题。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0766","type":"single","t":"解决城市交通可以尝试一种新机制：公交因为承担着为低收入者、环保人士等提供社会公益性服务的职能，由政府购买公交服务，低价提供给公众；个体自行车出行或纳入到政府购买体系，或推行自行车优先措施；出租车因为价格的高低并不会影响需求者对出租车这种出行方式的选择，所以自然由开放的竞争市场来提供相应服务；对小汽车的使用者可以征收道路使用费，使交通拥堵的外部性内化。这种机制的实施，还要求有配套措施。对文中的“新机制”最恰当的概括是()","o":[["A","“主体—配套”机制"],["B","“多元—环保”机制"],["C","“保障—市场”机制"],["D","“公平—高效”机制"]],"a":["C"],"an":"文段用冒号解释新机制，不同交通方式分别由政府保障和市场调节，概括为“保障—市场”机制。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0767","type":"single","t":"我们说儒家是道德至上或者道德决定论的时候，是一种宏观上的总体定性和评价。所谓“子罕言利”或者“小人喻于利”，是着眼于人作为一种道德存在、超越存在的“应然”特质而立论，所拒斥和鄙夷的只是“不义而富且贵”。具体到关乎民生的问题，儒家并非不言利、否定利，而是主张让利于民，惠民富民；并非认为道德决定民生，而是认为民生决定道德。根据这段文字，以下说法正确的是()","o":[["A","儒家认为“利”在不同历史时期有不同的含义"],["B","儒家的民生观不是空谈道德而是强调以民为本"],["C","儒家认为道德与民生并不对立，而是相互促进"],["D","在民生问题上，儒家倡导道德至上"]],"a":["B"],"an":"A项“不同时期”无中生有；C项“相互促进”与文意不符；D项与文意相反。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0768","type":"single","t":"今后，技术的交叉与融合会越来越明显。新一轮科技和产业革命的方向不会仅仅依赖于一两类学科或某种单一技术，而是多学科、多技术领域的高度交叉和深度融合。技术融合趋势决定了战略性新兴产业不可能也不应该孤立地发展，而是既要有利于推动传统产业的创新，又要有利于未来新兴产业的崛起。这段文字主要说的是()","o":[["A","战略性新兴产业的发展需要顺应技术融合的新趋势"],["B","未来行业的界限会变模糊但综合竞争力会增强"],["C","提高综合竞争力将是未来产业发展的主要目标"],["D","战略性新兴产业是促进新一轮科技和产业革命的主力军"]],"a":["A"],"an":"文段主体为“战略性新兴产业”，强调其与其他产业相融合是技术融合的大势所趋。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0769","type":"single","t":"在市场经济条件下，企业要想达到自身获利的目的，必须首先生产或提供对他人有价值的东西。如果企业置他人利益于不顾，采取欺骗的手段进行不正当交换，不仅不被社会容忍，而且要受到法律惩罚。市场经济内在地要求企业遵循诚信、公平、负责等交换准则。这些交换准则，内含着维系和推动企业发展的道德力量。这段文字意在说明()","o":[["A","提升企业道德力，是市场经济健康发展的内在要求"],["B","提升企业道德力，是为了增强企业责任感和使命感"],["C","提升企业道德力，是现代企业持续发展的必要条件"],["D","提升企业道德力，是企业避免受到法律惩罚的手段"]],"a":["C"],"an":"尾句“不具备道德力的企业……终将被淘汰出局”强调现代企业持续发展必须提升道德力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0770","type":"single","t":"隋唐时期的三彩陶器，标志着彩釉陶器的横空出世，同时也开启了中国陶器与西域的交流。襟怀宽广的大唐盛世，借鉴了中亚、南亚诸国的金银器造型及工艺，丰富了中国壶具的型制与装饰语言。长沙窑的盘口壶、广口壶等中国陶瓷，则通过陆上、海上两条途径实现了向西辐射至阿拉伯与欧洲、非洲，向东延伸到日本、朝鲜及东南亚诸国的商品与文化输出。这段文字主要介绍了()","o":[["A","唐代文化艺术交流对其他国家产生影响"],["B","陶器发展的历程闪现着文化交流的光辉"],["C","唐代陶器吸收国外工艺并向全世界输出"],["D","陶制壶具的输出影响当地居民生活方式"]],"a":["B"],"an":"文段首句强调陶器开启了中国陶器与西域的交流，后文具体阐述隋唐陶器吸收国外工艺并向外输出，B项包含“陶器”和“文化交流”两个核心要素。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0771","type":"single","t":"学术评价中，往往交织着主客观的各种复杂因素。由于学术评价常受到评价主体学术观点、情感倾向、价值观等因素的影响，所以人们倾向于依靠量化数据进行评价。事实上，这类数据所包含的评价意义是由点击者、下载者、引用者体现出的，过度倚重这类数据就是把量化数据的制作者当成了评价主体。这段文字意在说明()","o":[["A","以量化指标为标准的评价体系备受争议"],["B","在进行学术评价时不能过多依赖量化数据"],["C","正确的学术评价需要经历很长的历史过程"],["D","经得住实践检验的学术评价才是可靠的"]],"a":["B"],"an":"文段主要讲学术评价交织复杂因素，言外之意是不应过多依赖量化数据。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0772","type":"single","t":"有人说，传统小说是依赖经验的写作，而网络小说是依赖想象的写作。看来，这两种写作需要找到一个结合点，依赖经验的写作需要吸纳网络小说的想象，而依赖想象的写作则需要糅入传统小说中丰厚充实的经验。因此，当今的文学要从原创力日益萎缩的窘境中走出来，作家们增加生活经验的积累应该是一个非常关键的举措。但这还只是由经验通往原创力的第一步，接下来必须在体验上进行认真的修炼。这段文字重点强调的是()","o":[["A","如何融合传统和网络小说"],["B","怎样找到传统和网络小说的结合点"],["C","作家应该如何不断地积累生活经验"],["D","如何提高文学的原创力"]],"a":["D"],"an":"文段尾句由转折词“但”引出主题句，即原创力走出困境的方法，重点强调提高文学的原创力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0773","type":"single","t":"很早以前科学家就发现有些人对于某些药物的反应和其他病人不同。例如，某种麻醉用肌肉松弛剂会导致特定的人无法呼吸。后来，科学家发现产生这种现象的原因在于这类人拥有特定的基因。这也就带来了一个问题：研究人们之间的遗传差异是否可以促进医学发展出更高级的治疗手段？科学家已经辨认出了一批与药物相互作用的基因，但是要真正实现，恐怕为时尚早。以下说法正确的是()","o":[["A","基因学的研究成果已广泛应用于医学"],["B","医学用药不当会导致人体遗传基因变异"],["C","人体的基因差异可能会体现在药物反应上"],["D","基因与药物能够相互作用的假设还无法证明"]],"a":["C"],"an":"A项“广泛应用”与“为时尚早”矛盾；B项“用药不当导致基因变异”无中生有；C项由“这类人拥有特定的基因”可知正确。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0774","type":"single","t":"历史学家的工作对象是史料，这些史料主要是各种文献、遗存，它们可以归为广义上的文本，而且最终它们都要以语言形式进入史家的研究。就此而论，历史学家永远无法真正直接接触到过去本身，而只能借助于各种历史文本而对过去有所言说，因而()。","o":[["A","文本性就是历史学家的全部工作所无法脱离的樊篱"],["B","无法接触完整的史料对历史学家来说是一种遗憾"],["C","对史料本身的收集和考证就成了史学客观性的保证"],["D","重建和还原历史的本来面目就成了历史学的根本目的"]],"a":["A"],"an":"文段强调历史学家只能借助历史文本研究，尾句应总结文本的重要性，A项“文本性”与前文主体一致。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0775","type":"single","t":"人生不可能是尽善尽美的。我们也很难找到一朵花是完美无缺的。虽然人体总的来说是左右对称的，可是这种对称远远不是完全的。每个人左右手的粗细不一样，一只眼睛比另一只眼睛更大或更圆。这段文字是一篇文章的开头，文章接下来最可能讲述的是()","o":[["A","弥补不对称缺憾的诸多方式"],["B","人生中的不完美也能转换为完美"],["C","不对称也能产生和谐与平衡的美感"],["D","人体之所以产生不对称现象的生理基础"]],"a":["C"],"an":"文段基调是接受不完美，不对称不一定就是缺憾，C项符合逻辑，不对称也能产生美感。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0776","type":"single","t":"公元1616年，莎士比亚与汤显祖同年逝世。二人都可算作16、17世纪之交的伟大剧作家。二人都爱写剧本，不过写法却不大一样。比如《罗密欧与朱丽叶》故事临近结尾，一双恋人殉情身亡，惨烈的悲剧以双方家族的和解收尾。《牡丹亭》里的杜丽娘，因梦中的相遇而思，而哀，而死，又因此而还生，而圆满。这段文字的主旨是()","o":[["A","阐述莎士比亚和汤显祖的伟大之处"],["B","分析《牡丹亭》独特的写作手法"],["C","比较莎士比亚和汤显祖的艺术风格"],["D","总结中外古典戏曲的共同点"]],"a":["C"],"an":"文段为总分结构，首句点明主旨——莎士比亚和汤显祖写法不同，后文举例比较二者艺术风格。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0777","type":"single","t":"18世纪产业革命以后，能源的大量开发利用成为各国经济发展的主流，其开发程度的规模直接决定了一国经济的增长。经济学研究的能源战略也主要是如何以不断增长的能源供给保证经济社会发展日益增长的需求。这种能源战略对鼓励人们开发利用能源、保证工业化国家基础建设和工业的高速增长起了积极作用，但造成了能源资源的破坏和浪费，形成了到现在还无法根治的环境污染和公害。以下说法正确的是()","o":[["A","能源战略的经济意义远远不能抵消其对环境造成的危害"],["B","18世纪后的能源开发战略追求对能源的无限制开发和利用"],["C","煤炭和石油的开发程度是一国经济发展的标志"],["D","能源开发缺乏合理的规划使产业革命后的能源开发陷入无序"]],"a":["A"],"an":"由尾句“对开发能源不作限制，造成了……环境污染和公害”可知A项正确。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0778","type":"single","t":"数学方法是西方科学中极其重要和不可或缺的方法。严谨和精确是科学精神的重要组成部分，而严谨和精确在很大程度上是由数学方法带来的。科学要求各种概念尽可能被定量且能以一定的精确性加以检验。定律和定理的精确性体现在它的数学表达上。长期以来形成的观念是：一门学科如果不能“数学化”，就算不得精确学科。这段文字的主旨概括最准确的是()","o":[["A","数学化是衡量科研成果的标准"],["B","数学表达使定律和定理更精准"],["C","数学方法是使科学精准化的手段"],["D","数学的魅力在于严谨和精确"]],"a":["C"],"an":"文段为总分总结构，首句和尾句都强调数学方法使科学精准化。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0779","type":"single","t":"水资源短缺一直是我国在人口增长、城市化和工业化过程中所面临的一个长期的、趋势性的问题，成为制约我国经济发展的一大瓶颈。专家认为，海水淡化是沿海及临海地区最经济、最实用、最灵活的水危机解决方案。随着技术的进步，海水淡化的成本将逐步降低，最终将达到与成本正逐步上升的城市自来水竞争的程度，从而得以大规模推广。这段文字主要强调的是()","o":[["A","海水淡化的必要性和可行性"],["B","海水淡化的经济性和实用性"],["C","制约中国经济发展的水危机"],["D","解决沿海地区水危机的有效措施"]],"a":["A"],"an":"文段先提出水资源短缺问题，接着提出海水淡化方案，最后介绍成本降低使大规模推广成为可能，强调了必要性和可行性。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0780","type":"single","t":"19世纪，爱默生和其他一些作家向读者传授一种称为“自助论”的理论。在这些人看来，一个有个性的人必须要有一颗充实的大脑。在这种思想的指导下，为了得到他人的尊重，有必要在闲暇时广泛涉猎文化史上的杰出著作。这种风气在一个多世纪的时间里塑造了美国新闻业。这段文字意在说明()","o":[["A","广泛阅读可以充实我们的大脑"],["B","主流媒体有引导大众品味的责任"],["C","新闻媒体是主流文化观的集中体现"],["D","自助论为美国新闻业的发展提供方向"]],"a":["D"],"an":"文段尾句点明主旨，自助论的思想塑造了美国新闻业，即为其发展提供方向。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0781","type":"single","t":"传记，从本质上说，是人的生命活动的记载，是人类生命的一种特殊载体。人的生命活动，不仅表现出生存和发展的渴求，而且表现出自身潜能的开发、释放。这是一幅幅壮丽的生命画卷，是活力向惰性的挑战。中国古典传记，正是这种生命活力的形象性展现。这段文字主要说明了()","o":[["A","传记是人类生命活动最为生动的记载"],["B","中国古典传记从多角度展现了生命活力"],["C","人类自身潜能的开发包括多种形式"],["D","人类个体与整体创造性在传记中有不同的表现"]],"a":["B"],"an":"文段最后一句是主旨句，强调中国古典传记展现了生命活力。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0782","type":"single","t":"目前，国内增值税的征税范围仅包括除建筑业外的第二产业和第三产业中的商品批发和零售以及加工、修理修配业，对第三产业的大部分行业则课征营业税。而营业税对服务业的营业额全额征税，不可避免地会产生重复征税，并会导致服务生产内部化，不利于服务业的专业化分工和服务外包的发展。因此，()。","o":[["A","扩大增值税的征税范围被提上了日程"],["B","取消营业税可以减轻第三产业的负担"],["C","增值税与营业税的分立对服务业的发展造成了不利影响"],["D","调整增值税的征收范围有利于提高中国服务业的国际竞争力"]],"a":["C"],"an":"文段前文讲增值税和营业税分立带来的问题，尾句应总结这种分立对服务业发展不利。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0783","type":"single","t":"①第一本防水平装书还将拥有强大的防伪功能②澳大利亚的银行现已经使用该项技术来延长纸币的使用寿命③英国出版商近日透露，世界上第一本防水平装书有望明年夏天上架销售④书的外面还有一层防撕毁的坚韧的聚合物涂层⑤据了解，防水平装书将采用先进的防水技术，外面包裹透明的蜡封⑥这将是此技术首次应用于普通平装书。将以上6个句子重新排列，语序正确的是()","o":[["A","③⑤④⑥①②"],["B","③①②⑤④⑥"],["C","⑤①②④⑥③"],["D","⑤④⑥②①③"]],"a":["A"],"an":"③提出“防水平装书”概念，⑤具体阐述，③应在⑤前，排除C、D；①中有“还”，不能直接接③后，排除B。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0784","type":"single","t":"近几年中国的投资环境发生了根本性的变化，劳动力成本上升、劳动保护加强、土地成本上升、环保成本上升、能源资源使用成本上升、优惠政策取消，外资企业需要在更高的成本上与内资企业竞争。但要素和能源资源成本上升，伴随的是生产方式和经济结构的提升，意味着经济发展水平和人民生活水平的提高，也意味着市场规模的扩大。这段文字可以推出()","o":[["A","中国的投资环境在朝良性发展的方向转化"],["B","生产成本的增加可以促使外资更加注重效率"],["C","取消外资优惠政策是对国内外企业负责任的举措"],["D","外资企业应抓住近年市场规模扩大的发展好时机"]],"a":["A"],"an":"文段先指出投资环境变化表面看对外的企业不利，后文转折指出实际是朝良性方向发展。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0785","type":"single","t":"审慎原则并不是尊重科学，而是对科学应用的务实态度。科研成果的取得及其社会认可，往往代表着巨大的经验利益甚或科学家的终身成就，这就很难保证科学家不会放松科学原则要求而违规。这段文字意在强调()","o":[["A","对科学成果的应用应当秉承谨慎态度"],["B","科研成果应用的潜在危险无法被预测"],["C","科学附带的经济效益腐化了科学精神原则"],["D","道德原则是科学研究首要遵循的"]],"a":["A"],"an":"首句提出观点，审慎原则是对科学应用的务实态度，后文具体阐明，意在强调对科学成果应用应谨慎。","tp":"言语理解","d":"中"},
	{"i":"fjcs_0786","type":"single","t":"某商场开展购物优惠活动：一次购买300元及以下的商品九折优惠；一次购买超过300元的商品，其中300元九折优惠，超过300元的部分八折优惠。小王购物第一次付款144元，第二次又付款310元。如果他一次购买并付款，可以节省多少元？()","o":[["A","16"],["B","22.4"],["C","30.6"],["D","48"]],"a":["A"],"an":"第一次付款144元，原价为144÷0.9=160元；第二次付款310元，超过300×0.9=270元，原价300+(310-270)÷0.8=350元。总价510元，一次付款300×0.9+210×0.8=438元。分开付款144+310=454元，节省454-438=16元。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0787","type":"single","t":"某单位今年一月份购买5包A4纸、6包B5纸，购买A4纸的钱比B5纸少5元；第一季度该单位共购买A4纸15包、B5纸12包，共花费510元；那么每包B5纸的价格比A4纸便宜()","o":[["A","1.5元"],["B","2.0元"],["C","2.5元"],["D","3.0元"]],"a":["C"],"an":"设A4纸每包x元，B5纸每包y元。6y-5x=5，15x+12y=510，解得x=20，y=17.5，便宜2.5元。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0788","type":"single","t":"早上7点两组农民开始在麦田里收割麦子，其中甲组20人，乙组15人。8点半，甲组分出10人捆麦子；10点，甲组将本组所有已割的麦子捆好后，全部帮乙组捆麦子；如果乙组农民一直在割麦子，什么时候乙组所有已割的麦子能够捆好？(假设每个农民的工作效率相同)()","o":[["A","10:45"],["B","11:00"],["C","11:15"],["D","11:30"]],"a":["B"],"an":"赋值每人每小时割麦效率为1。甲组割麦总量：20×1.5+10×1.5=45。捆麦效率：45÷1.5÷10=3。设10点后经过x小时捆完乙组麦子，15×(3+x)=20×3×x，解得x=1，即11:00。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0789","type":"single","t":"60名员工投票从甲、乙、丙三人中评选最佳员工，选举时每人只能投票选举一人，得票最多的人当选。开票中途累计，前30张选票中，甲得15票，乙得10票，丙得5票。问在尚未统计的选票中，甲至少再得多少票就一定当选？()","o":[["A","15"],["B","13"],["C","10"],["D","8"]],"a":["B"],"an":"还剩30票。考虑最不利情况，乙对甲威胁最大，先给乙5票，甲乙各15票，其余25票中甲再得13票即可确保当选。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0790","type":"single","t":"小张、小王二人同时从甲地出发，驾车匀速在甲乙两地之间往返行驶。小张的车速比小王快，两人出发后第一次和第二次相遇都在同一地点，问小张的车速是小王的几倍？()","o":[["A","1.5"],["B","2"],["C","2.5"],["D","3"]],"a":["B"],"an":"设第一次相遇时小张走x，小王走y。第二次相遇时小张走2y，小王走x-y。由比例法x/y=(2y)/(x-y)，解得x=2y，速度比为2:1。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0791","type":"single","t":"某种密码锁的界面是一组汉字键，只有不重复并且不遗漏地依次按下界面上的汉字才能打开，其中只有一种顺序是正确的。要使得每次对密码锁进行破解的成功率在万分之一以下，则密码锁的界面至少要设置多少个汉字键？()","o":[["A","5"],["B","6"],["C","7"],["D","8"]],"a":["D"],"an":"N个汉字的全排列数为A(N,N)，要满足1/A(N,N)<1/10000，即A(N,N)>10000。A(8,8)=40320>10000。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0792","type":"single","t":"一个班有50名学生，他们的名字都是由2个或3个字组成的。将他们平均分为两组之后，两组的学生名字字数之差为10。此时两组学生中名字字数为2的学生数量之差为()","o":[["A","5"],["B","8"],["C","10"],["D","12"]],"a":["C"],"an":"两组人数相同，名字字数相差10，说明其中一组比另一组多10个3字名，则2字名少10个。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0793","type":"single","t":"某产品售价为67.1元，在采用新技术生产节约10%成本之后，售价不变，利润可比原来翻一番。则该产品最初的成本为多少元。()","o":[["A","51.2"],["B","54.9"],["C","61"],["D","62.5"]],"a":["C"],"an":"设最初成本为x，67.1-0.9x=2(67.1-x)，解得x=61。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0794","type":"single","t":"孙儿孙女的平均年龄是10岁，孙儿年龄的平方减去孙女年龄的平方所得的数值，正好是爷爷出生年份的后两位，爷爷生于上个世纪40年代。问孙儿孙女的年龄差是多少岁？()","o":[["A","2"],["B","4"],["C","6"],["D","8"]],"a":["A"],"an":"代入法，相差2岁，孙儿孙女分别为9岁和11岁，11²-9²=40，符合40年代。","tp":"数量关系","d":"中"},
	{"i":"fjcs_0795","type":"single","t":"出租车队去机场接某会议的参会者，如果每车坐3名参会者，则需另外安排一辆大巴送走余下的50人；如每车坐4名参会者，则最后正好多出3辆空车。问该车队有多少辆出租车？()","o":[["A","50"],["B","55"],["C","60"],["D","62"]],"a":["D"],"an":"设出租车x辆，3x+50=4(x-3)，解得x=62。","tp":"数量关系","d":"中"},
