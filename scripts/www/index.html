	{"i":"fjcs_0124","type":"single","t":"学习迁移即一种学习对另一种学习的影响，它广泛地存在于知识、技能、态度和行为规范的学习中。任何一种学习都会受到学习者已有知识经验、技能、态度等的影响，只要有学习，就有迁移。下列属于学习迁移的是：","o":[["A","小王的父亲是著名的画家，受父亲影响，他从小就对绘画产生了兴趣，后来也成为一名画家"],["B","某大学生在人多的教室里复习功课总容易分心，于是换到一个独处的安静环境，学习效率非常高"],["C","小芳学会了拉二胡，自己尝试拉小提琴，结果也很快学会"],["D","某学生沉迷于网络游戏致使学习成绩下降，后来通过老师的教育和同学的帮助，改掉了毛病，学习进步非常快"]],"a":["C"],"an":"第一步：抓住定义中的关键词。\n该定义项中的关键词为“一种学习对另一种学习的影响”，而且这种影响来自“学习者已有知\n识经验、技能、态度等”。\n第二步：逐一判断选项。\nA项，小王对绘画产生兴趣是“受父亲影响”，不是受自身已有技能的影响，不符合定义；\nB项说的某大学生改变学习环境之后学习效率提高；\nC项，小芳很快学会拉小提琴是受已经会拉二胡的影响，符合定义；\nD项是某学生在老师和同学的帮助下提高学习成绩，这两种情况都没有体现出“一种学习对\n另一种学习的影响“，不符合定义。\n故正确答案为C。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0125","type":"single","t":"农业现代化是指把建立在直接经验和手工工具基础上的传统农业转变为以现代先进科学技术、生产手段和管理方法为基础的社会化农业的过程。根据以上定义，下列与农业现代化含义不符的一项是：","o":[["A","建立合理的农业生产结构和农村经济结构，实现以生产商品化为核心的农业生产社会化"],["B","因地制宜，根据不同地区农业资源状况和农业生产条件的差异，使畜力耕作和农业机械化手段相结合"],["C","广泛运用发酵、基因、无土栽培等农业高技术手段，实现农业生产技术科学化和集约化发展"],["D","走以实现贸工农一体化为中心，以高产、优质、高效为基本内容的农业产业化道路"]],"a":["A"],"an":"第一步：抓住定义中的关键词。\n关键词强调“以现代先进科学技术、生产手段和管理方法为基础的社会化农业”。\n第二步：逐一判断选项。\nA项“建立合理的农业生产结构和农业经济结构”没有体现“现代先进科学技术、生产手段”，\n不符合关键词；\nB项的“蓄力耕作与农业机械化手段相结合”运用了现代先进科学技术和生产手段，符合关键\n词；\nC项的“运用发酵、基因、无土栽培等农业高技术手段”运用了现代先进科学技术和生产手段，\n符合关键词；\nD项的“贸工农一体化”运用了先进的管理方法，符合关键词。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0126","type":"single","t":"连续犯，是指基于数个同一的犯罪故意，连续数次实施犯罪行为，触犯同一罪名的犯罪形态。下列属于连续犯的是：","o":[["A","赵某因怀疑刘某盗窃其店内财物，将刘某非法扣留在其店中长达两天。"],["B","赵某为了倒卖死牛肉牟利，先后7次在本村路上、菜地投放洒有液体鼠药的馍块或菜叶，将本村6户农民的7头耕牛毒死。"],["C","李某自己伪造、编造国家机关公文、证件、印章后，又擅自设立金融机构。"],["D","张某偷窃邻居的电视后，一直据为已有。"]],"a":["B"],"an":"第一步：抓住定义中的关键词。\n强调“基于数个同一的犯罪故意”、“连续数次实施犯罪行为”、“触犯同一罪名”。\n第二步：逐一判断选项。\nA项“非法扣留在其店中长达两天”和C项“伪造、编造国家机关公文、证件、印章后，又擅\n自设立金融机构”均不符合题干定义“连续数次实施犯罪行为”；\nB项“为了倒卖死牛肉牟利”体现了“基于数个同一的犯罪故意”，“先后7次在本村路上、菜地\n投放洒有液体鼠药的馍块或菜叶”体现了“连续数次实施犯罪行为”，而“将本村6户农民的7\n头耕牛毒死”体现了“触犯同一罪名”；\nD项不符合定义“触犯同一罪名”。\n故正确答案为B。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0127","type":"single","t":"网络集群行为，指一定数量的相对无组织的网民，在网络环境中或在网络传播影响下，针对某一共同影响或刺激产生的群体性行为。根据上述定义，下列属于网络集群行为的是（ ）。","o":[["A","网友们为抵制非理智追星而发起的“69”圣战"],["B","为调查网上热传的“陈易卖身救母”事件，一名深圳网友前往四川调查真相"],["C","某高校要求学生通过教室微信扫二维码完成签到工作"],["D","暴雪公司开发的“魔兽世界”游戏中的公会成员线下不定期聚会"]],"a":["A"],"an":"第一步：抓住定义中的关键词\n无组织的网民，网络环境中，群体性行为\n第二步：逐一判断选项\nA选项，“网友们”符合无组织网民和网络环境下，“发起圣战”符合群体性行为，符合；\nB选项，“一名深圳网友”不符合一定数量的相对无组织的网民，排除；\nC选项，“某高校要求学生”不符合一定数量的相对无组织的网民，排除\nD选项，“线下不定期聚会”不符合通过网络环境，排除。\n故正确答案为A选项。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0128","type":"single","t":"定金是指合同当事人为了确保合同的履行，依据法律规定或者当事人双方的约定，由当事人一方在合同订立时，或订立后、履行前，按合同标的额的一定比例，预先给付对方当事人的金钱或其他代替物。以下属于定金的是：","o":[["A","甲与乙（房东）于6月5日签订租房协议（月租金500元），该协议将于6月10日生效。乙要求甲先交100元钱，如甲不能履行合同，将不予退还。"],["B","小张今年考上大学，通知书上写明，须先交纳学费5000元，才能办理入学手续。"],["C","甲预向乙借款1000元，甲的好友丙将自己1000元的相机留给乙作为担保"],["D","小王近期签订了一份购房合同，在合同条款中规定，首付10万现金，剩余10万元于办理产权证书时一并交清。"]],"a":["A"],"an":"第一步：抓住定义中关键词。\n定义强调“合同当事人”、“合同订立时，或订立后、履行前”、“预先给付对方当事人的金钱或\n其他代替物”。\n第二步：逐一判断选项。\nA项符合定义；\nB项没有涉及合同订立，显然不符合定义；\nC项中的丙并非“合同当事人”，而是第三人的担保，不符合定义；\nD项属于交付中的首付款而非定金。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0129","type":"single","t":"风险规避是指通过计划的变更来消除风险或风险发生的条件，保护目标免受风险的影响。风险规避并不意味着完全消除风险，而是规避风险可能造成的损失，一是要降低损失发生的几率，这主要是采取事先控制措施；二是要降低损失程度。这主要包括事先控制、事后补救两个方面。根据上述定义，下列不属于“风险规避”的是：","o":[["A","某外语培训机构近两年业务发展迅速，但缺乏配套的资金投入，因此该机构选择通过上市发行股票这一渠道来筹集资金"],["B","某广告公司为减少员工流失，实行了许多激励机制，包括提供更多培训机会、加大奖金幅度，增加保险度等措施"],["C","小李业余时间喜欢理财，他在银行的理财产品涉及很多类型，有债券、基金，有短期也有长期的，他觉得这样理财更稳健"],["D","某购物网站有专门的储物仓库，平时供货稳定，但过节期间常供不应求，为此公司制定了一系列方案来控制货物储备和物流管理"]],"a":["A"],"an":"第一步：抓住定义中的关键词，①消除风险或风险发生的条件；②降低损失发生的\n几率；③降低损失程度。第二步：逐一判断选项。A项，缺乏配套的资金不属于一种风险，\n并且，某机构选择通过上市发行股票这一渠道来筹集资金是一种风险很高的融资行为，这种\n行为是完全的暴露风险，而没有规避风险，不符合定义；B项，某广告公司为减少员工流失\n而采取的一系列措施属于降低损失发生的几率，这主要是采取事先控制措施；C项，小李选\n择的理财产品涉及面虽然广但不能说明某种理财产品能降低另一种理财产品损失发生的几\n率和程度。小李的举措属于风险分散，即通过多样化的投资来分散和降低风险的方法，属于\n事先控制，规避风险；D项，某购物网站节前制定过节期间的方案属于降低损失发生的几率，\n这主要是采取事先控制措施。B、C、D三项都属于风险规避。\n本题为选非题，故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0130","type":"single","t":"案例教学法是指在教师的指导下，由学生对选定的具有代表性的典型案例，进行针对性地分析、审理和讨论，做出自己的判断和评价。根据上述定义，下列属于案例教学法的是：","o":[["A","为讲解什么是“正当防卫”，赵老师给出真实案件，把学生分为辩方律师与控方律师进行分析、辩论"],["B","为教授无土栽培技术，李老师以“无土栽培番茄”为例进行逐步演示，学生分组动手操作，并完成栽培过程书面报告"],["C","为讲解“包产到户”，张老师组织学生到小岗村进行实地考察，与当地农民座谈、讨论、分析“包产到户”的必要性"],["D","为传授网线制作的技巧，刘老师播放了一段事先录制好的网线制作视频，供大家观察、讨论和学习"]],"a":["A"],"an":"第一步：找到关键词\n关键词为“在教师的指导下”、“学生”、“学生对选定的典型案例”、“针对性分析、审理、讨论”、\n“做出自己的判断和评价”。\n第二步：逐一分析选项\nA项：赵老师为讲解“正当防卫”，给出了案例，体现了在教师的指导下，把学生分组进行分\n析、辩论，符合“学生对案例针对行分析、审理、讨论”，体现了学生的主体作用，符合定义，\n当选；?\nB项：李老师在教授中自己进行逐步演示，是老师在分析案例，学生直接动手操作，没有体\n现学生对案例分析、审理和讨论，不符合定义，排除；\nC项：张老师组织学生实地考察，并不是典型案例，学生也没有对案例进行针对性分析，属\n于实地考察，不符合定义，排除；\nD项：刘老师播放了事先录制好的网线制作视频，只是教授制作技巧，并不是具有代表性的\n典型案例，学生也没有进行针对性的讨论、分析，不符合定义。\n故正确答案为A。","tp":"定义判断","d":"中"},
	{"i":"fjcs_0131","type":"single","t":"河流：水（）","o":[["A","沙漠：泥"],["B","森林：树木"],["C","草原：动物"],["D","山脉：冰雪"]],"a":["B"],"an":"【解析】第一步：分析题干词语的逻辑关系河流里面必然有水，组成关系。第二步：逐一分析选项A项：沙漠里必然有沙子，而不是泥，与题干不一致；B项：森林里必然有树木，组成关系，和题干一致；C项：草原的必然组成部分是草，而不是动物，与题干不一致；D项：山脉里必然有土和石头，而不是冰雪，与题干不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0132","type":"single","t":"燕子：春天","o":[["A","知了：夏天"],["B","山鸡：高原"],["C","蟋蟀：冬天"],["D","白药：云南"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是动物是季节里的代表动物之一的对应。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为A。B和D没有季节；C中蟋蟀不是冬天的代表动物。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0133","type":"single","t":"黄色：红色：白色","o":[["A","忧伤：高兴：愤怒"],["B","女医生：男医生：医生"],["C","科学：非科学：伪科学"],["D","左手：右手：举手"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。黄色、红色、白色都表示颜色。题干的三个词语构成并列关系。第二步：判断选项词语间逻辑关系。A项忧伤、高兴、愤怒都是表达情绪的词语，构成并列关系；B项女医生和男医生都属于医生，前两项和第三项之间是包容关系；C项科学和非科学、伪科学之间构成的是矛盾关系；D项左手和右手与举手构成对应关系，非并列关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0134","type":"single","t":"三角形之于平面相当于（）之于（）","o":[["A","菱形——四面体"],["B","棱柱——空间"],["C","点——直线"],["D","曲线——椭圆"]],"a":["B"],"an":"【解析】第一步：将选项逐一代入，判断各选项前后部分的逻辑关系。A选项，菱形之于四面体是平面与立体的对应关系；B选项，棱柱之于空间是属性关系；C选项，点之于直线是包含关系中的组成关系；D选项，曲线之于椭圆是包容关系中的组成关系。第二步：逻辑关系与题干相同即为答案。题干中三角形之于平面是属性关系。综合以上分析，仅B选项前后两组词语逻辑关系相同。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0135","type":"single","t":"歇斯底里：癔症","o":[["A","买单：结账"],["B","脚踏车：自行车"],["C","引擎：发动机"],["D","可口可乐：饮料"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是同义词，且是音译外来词和本土词之间的同义词。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为C。A和B的第一个词不是音译外来词，D是包容关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0136","type":"single","t":"经济特区∶珠海","o":[["A","南沙群岛∶黄岩岛"],["B","乐器：陶笛"],["C","海军∶航空母舰"],["D","飞禽∶蝙蝠"]],"a":["B"],"an":"【解析】第一步：判断题干词语间的逻辑关系。珠海是经济特区的一种，属于种属关系。第二步：判断选项词语间的逻辑关系。A项，黄岩岛是南沙群岛的一部分，属于组成关系，不符合题意；B项，陶笛是乐器的一种，属于种属关系；C、D两项都不构成种属关系，不符合题意。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0137","type":"single","t":"控告：辩护","o":[["A","怀疑：相信"],["B","侵犯：自卫"],["C","胜利：失败"],["D","鼓励：自满"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是主动和被动两个相对行为间的对应关系，前者是主动，后者是被动。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为B项；A项和C项均是一对反义词，D项中“自满”不是被动的行为，是主动行为。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0138","type":"single","t":"编辑对于（）相当于（）对于蔬菜","o":[["A","报纸果农"],["B","传媒农业"],["C","书刊农村"],["D","杂志农民"]],"a":["D"],"an":"【解析】第一步：将选项逐一代入，判断各选项前后部分的逻辑关系。A项代入后，编辑和“报纸”构成对应关系，即职业和其作用对象的对应，而“果农”和蔬菜之间没有逻辑关系；B项“编辑”是传媒行业的一种职业，而“蔬菜”是种植农业的一种，前后逻辑不一致；C项编辑与“书刊”构成对应关系，“农村”和蔬菜没有逻辑关系；D项编辑编撰“杂志”，“农民”种植蔬菜，均构成对应关系，即职业和其作用对象的对应。第二步：逻辑关系相同即为答案。由第一步可知逻辑关系完全相同的是D项。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0139","type":"single","t":"刀：屠夫：肉","o":[["A","剪刀：裁缝：布料"],["B","粉笔：老师：黑板"],["C","法律：法官：犯人"],["D","相机：记者：摄影"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词是语法关系，且是使用工具、职业与工具作用对象的对应关系。屠夫用刀切肉，且肉的完整性被破坏。第二步：判断选项词语间逻辑关系。A项与题干逻辑关系相同，裁缝用剪刀裁剪布料，且布料的完整性被破坏；B项老师用粉笔在黑板上写字，黑板的完整性并没有被破坏；C项犯人的完整性没有被破坏；D项摄影不是相机的作用对象，是相机的功能。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0140","type":"single","t":"琴棋书画：经史子集","o":[["A","兵强马壮：闭关自守"],["B","悲欢离合：漂泊流浪"],["C","衣帽鞋袜：冰清玉洁"],["D","鸟兽虫鱼：江河湖海"]],"a":["D"],"an":"【解析】第一步：分析题干词语间的逻辑关系“琴棋书画”和“经史子集”都是名词，且每个词是四个并列关系的名词。第二步：逐一分析选项A选项：“兵强马壮”中的“强”、“壮”都是形容词，“闭关自守”中的“闭”、“守”都是动词，与题干逻辑关系不符合，排除；B选项：“悲欢离合”中的“离合”是动词，且“漂泊流浪”是动词，与题干逻辑关系不符，排除；C选项：“衣帽鞋袜”是四个名词，但“冰清玉洁”是形容词，与题干逻辑关系不符，排除；D选项：“鸟兽虫鱼”和“江河湖海”都是名词，且四个字之间是并列关系的名词，符合；","tp":"类比推理","d":"中"},
	{"i":"fjcs_0141","type":"single","t":"硬盘：计算机","o":[["A","学院：大学"],["B","白马：马"],["C","打印纸：办公室"],["D","矿泉水：水"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是组成关系，硬件是计算机的组成部分。第二步：判断选项词语间逻辑关系。A项：学院是大学的组成部分，属于组成关系；B项：白马是马的一种，即白马和马是种属关系；C项：打印纸和办公室无明显逻辑关系；D项：矿泉水和水是种属关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0142","type":"single","t":"扦插：播种","o":[["A","分株：嫁接"],["B","授粉：孤雌生殖"],["C","剪枝：分根"],["D","克隆：受精"]],"a":["D"],"an":"【解析】题干：扦插和播种是并列关系。扦插属于无性繁殖，播种属于有性繁殖。A项，分株和嫁接是并列关系，二者都是无性繁殖；B项，授粉和孤雌生殖是并列关系，授粉是有性繁殖，孤雌生殖是无性繁殖；C项，剪枝和分根是并列关系，剪枝不是一种繁殖手段，只是一种园艺上管理的措施，分根是无性繁殖；D项，克隆和受精是并列关系，克隆属于无性繁殖，受精属于有性繁殖。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0143","type":"single","t":"哈维：血液循环说","o":[["A","人类从类人猿进化而来：达尔文"],["B","伽利略：脉冲星发出脉冲"],["C","康德：太阳系构造及星际运动规律"],["D","毛泽东：抗日战争是持久战，最后胜利是中国的"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是人物和其贡献的对应关系，人物在前，贡献在后。哈维是英国科学家、医生、生理学家、胚胎学家，创立了血液循环学说。第二步：判断选项词语间逻辑关系。A中“人类从类人猿进化而来”确实是达尔文提出的，但选项中为贡献在前，人物在后，因此A错；B中“脉冲星发出脉冲”是1967年由英国天文学家休伊什的学生贝尔发现的，因此B错；C中康德是德国哲学家、天文学家，是星云说的创立者之一，是德国古典哲学的创始人，他的主要贡献是在哲学方面，因此C错；D与题干为相同逻辑关系，毛泽东的《论持久战》一文提出了“抗日战争是持久战，最后胜利是中国的”这一著名论点。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0144","type":"single","t":"工人：机器","o":[["A","赌球：球员"],["B","无产者：资本家"],["C","农民：土地"],["D","商人：商品"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且属于人物和其谋生手段之间的对应关系。第二步：判断选项词语间逻辑关系。A、B和题干逻辑关系不同；C、D与题干逻辑关系相同，但C项中的土地和题干中的机器均为生产资料，而D项中的商品不属于生产资料，故排除D。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0145","type":"single","t":"上山:山上，","o":[["A","上海:海上"],["B","回收:收回"],["C","工人:人工"],["D","下台:台下"]],"a":["D"],"an":"【解析】第一步，判断题干词语间逻辑关系。“上山”是动词，“山上”是名词，表示地点，人上山后到达山上。第二步：逐一分析选项。A项：“上海”是名词，“海上”是名词，表示地点，前者与题干词性不一致，排除。B项：“回收”是动词，“收回”是动词，二者为近义词，与题干逻辑关系不一致，排除。C项：“工人”是名词，“人工”是形容词，前者与题干词性不一致，排除。D项：“下台”是动词，“台下”是名词，表示地点，人下台后到达台下，与题干逻辑关系一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0146","type":"single","t":"泼水节对于（）相当于（）对于彝族","o":[["A","瑶族——走婚"],["B","侗族——开斋节"],["C","回族——淋浴节"],["D","傣族——火把节"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。根据题干给出的词汇，可以推断，题干中的前两个词和后两个词分别是对应关系，且是民族和节日间的一一对应关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为D；A选项，走婚走婚是摩梭人的一种婚姻模式，瑶族的传统节日有讨念拜、讨寮皈节；B选项，开斋节是伊斯兰教节日，侗族的节日以春节、祭牛神（农历四月初八或六月初六）、吃新节（农历七月间）较为普遍。有些地区还有在十月或十一月过侗年。由于民族之间的交往，侗族还有清明、端午、中秋、重阳等节；淋浴节是西藏的节日；C选项，回族的传统节日为开斋节、古尔邦节和圣纪节。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0147","type":"single","t":"鱼沉雁渺：音信全无","o":[["A","风声鹤唳：人心惶惶"],["B","焚琴煮鹤：附庸风雅"],["C","举杯望月：对牛弹琴"],["D","势成骑虎：威风凛凛"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。“鱼沉雁渺”与“音信全无”为近义词关系。“鱼沉雁渺”比喻书信不通，音信断绝。“音信全无”是指一点消息也没有。第二步：判断选项词语间逻辑关系。A项：”风声鹤唳”与“人心惶惶”为近义词关系。“风声鹤唳”形容惊慌失措，或自相惊忧。“人心惶惶”形容人们内心惊恐不安。与题干逻辑关系一致，当选。B项：“焚琴煮鹤”指把琴当作柴火烧了去煮白鹤。比喻糟蹋美好的事物。“附庸风雅”指某些人为装点门面，追随结交名士，从事有关文化方面的活动（多含贬义）。C项：”举杯望月”指举起杯子望着月亮。“对牛弹琴”指讥笑听话的人不懂对方说的是什么。不存在明显的逻辑关系，排除。D项：“势成骑虎”比喻做某事过程中遇到障碍，但由于形势的需要，不可能就此罢手的情况。“威风凛凛”指使人敬畏的声势或气派。不存在明显的逻辑关系，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0148","type":"single","t":"铁路：火车：乘客","o":[["A","车间：机器：工人"],["B","旅馆：房间：宾客"],["C","田地：庄稼：农民"],["D","海洋：潜艇：士兵"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。三者为对应关系，行驶在铁路上的火车搭载乘客。第二步：判断选项词语间逻辑关系。A项：工人操作车间里的机器，与题干逻辑关系不一致，排除；B项：旅馆里的房间为宾客提供住宿，与题干逻辑关系不一致，排除；C项：农民种植田地里的庄稼，与题干逻辑关系不一致，排除；D项：行驶在海洋里的潜艇搭载士兵，与题干逻辑关系一致，当选。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0149","type":"single","t":"站台：码头：停机坪（）","o":[["A","现金：支票：银行卡"],["B","软件：硬件：互联网"],["C","外套：婚纱：羽绒服"],["D","演员：群众：主持人"]],"a":["A"],"an":"【解析】第一步：分析题干词语的逻辑关系站台是城市轨道交通高架车站或高铁、火车站供上下乘客及装卸货物的平台。码头是海边、江河边专供乘客上下、货物装卸的平台。停机坪是供直升机起降的平台。三者之间为并列关系，并且存在功能上的相似。第二步：逐一分析选项A选项：现金、支票、银行卡都具有支付的功能，三者属于并列关系，与题干逻辑关系一致，为正确答案。B选项：软件与硬件是并列关系，但与互联网无明显的逻辑关系，排除。C选项：外套和婚纱无明显的逻辑关系，羽绒服与外套为种属关系，与题干逻辑不符，排除。D选项：演员的主要职业是表演，与群众在职能上没有明显相似关系，主持人的职能是主持活动，三者之间在功能职能上与题干逻辑不符，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0150","type":"single","t":"（）对于信箱相当于电脑对于（）","o":[["A","邮件激光"],["B","邮局硬盘"],["C","邮递员程序员"],["D","光缆光驱"]],"a":["B"],"an":"【解析】第一步：将选项逐一代入，判断各选项前后部分的逻辑关系。A项信箱是用来装“邮件”的，二者之间为对应关系，电脑和“激光”之间无明显逻辑关系；B项信箱是“邮局”的一部分，“硬盘”是电脑的一部分，前后两部分均为包容关系中的组成关系；C项“邮递员”将信件放入或取出信箱，“程序员”用电脑来编程，前后两部分的逻辑关系并不一致；D项“光缆”和信箱无明显逻辑关系，“光驱”与电脑之间是包容关系中的组成关系。第二步：逻辑关系相同即为答案。由第一步可知逻辑关系完全相同的是B项。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0151","type":"single","t":"电子邮件对于（），相当于（）对于指南针","o":[["A","网络∶工具"],["B","书信∶导航仪"],["C","信息∶方向"],["D","邮件∶卫星"]],"a":["B"],"an":"【解析】将选项逐一代入，判断各选项前后部分的逻辑关系。A选项：电子邮件通过网络来发送，二者是要素间的对应关系；工具和指南针属于种属关系，两组词前后逻辑关系不一致；B选项：电子邮件和书信功能相同，出现的先后顺序不同，属于属性连接的对应关系，导航仪和指南针功能相同，出现的先后顺序不同，属于属性连接的对应关系，前后逻辑关系一致；C选项：电子邮件是信息传输的载体，方向并非是指南针的载体，前后逻辑关系不一致；D选项：电子邮件和邮件是包容关系，卫星和指南针是对应关系，前后逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0152","type":"single","t":"规避：风险","o":[["A","开怀：畅饮"],["B","弹冠：相庆"],["C","控制：管理"],["D","防止：灾害"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词为对应关系，规避风险，构成动宾结构短语。第二步：逐一判断其他选项。A、B项，首词均不是动词；C项两词为并列关系；三项均与题干逻辑关系不一致。D与题干逻辑关系一致，防止灾害，构成动宾结构短语。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0153","type":"single","t":"忠诚：隶属","o":[["A","强制：敌对"],["B","同事：上下级"],["C","反感：斗争"],["D","朋友：和睦"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是因果关系，且是前者是因，后者是果。第二步：判断选项词语间逻辑关系。A无明显逻辑关系；B为包容关系，即同事包含上下级；C与题干为相同逻辑关系；D为属性关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0154","type":"single","t":"中国：上海","o":[["A","美国：华盛顿"],["B","俄罗斯：莫斯科"],["C","法国：巴黎"],["D","澳大利亚：悉尼"]],"a":["D"],"an":"【解析】第一步判断题干词语间逻辑关系。题干两词为包容关系，上海位于中国，且并非首都。第二步判断各个选项的关系，找出与题干一致的，即为答案。只有D与题干逻辑关系一致，悉尼位于澳大利亚，且并非首都，是答案。A、B、C三项均为国家与首都的对应，与题干逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0155","type":"single","t":"作家：出版社","o":[["A","演员：制片厂"],["B","警察：派出所"],["C","球员：运动场"],["D","医生：手术台"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。“作家”和“出版社”是对应关系，“作家”的作品由“出版社”出版。第二步：逐一分析选项。A项“演员”和“制片厂”是对应关系，“演员”的作品由“制片厂”发行；B项“警察”和“派出所”是主体与场所的对应关系；同理，C、D两项也是主体与场所的对应关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0156","type":"single","t":"正义：非正义","o":[["A","有理数：无理数"],["B","早晨：今晚"],["C","植物：动物"],["D","宽恕：怨恨"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是并列关系，且是并列关系中的矛盾关系。第二步：判断选项词语间逻辑关系。与题干相同的逻辑关系为A，有理数和无理数之间是矛盾关系；B项不是矛盾关系；C项植物和动物是并列关系中的反对关系；D项是反义词，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0157","type":"single","t":"书：纸","o":[["A","笔：纸"],["B","文具：文具盒"],["C","菜肴：萝卜"],["D","飞机：大炮"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是包容关系，且是包容中的或然组成关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为C；A是并列关系；B是或然组成关系，但是位置颠倒；D无明显逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0158","type":"single","t":"管中窥豹：坐井观天","o":[["A","班门弄斧：按部就班"],["B","刻舟求剑：竹篮打水"],["C","言不由衷：口是心非"],["D","未雨绸缪：杞人忧天"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。管中窥豹、坐井观天，二者是近义词关系。管中窥豹：从竹管的小孔里看豹，只看到豹身上的一块斑纹。比喻只见到事物的一小部分，指所见不全面或略有所得。坐井观天：比喻眼光狭小，不懂大道理，限于认识问题的角度，看问题不全面。题干所给的两组词语属于近义词关系。第二步：判断选项词语间逻辑关系。A项：班门弄斧、按部就班，二者不是近义词关系。班门弄斧比喻在行家面前卖弄本领；按部就班比喻按照一定的步骤、顺序进行。也指按老规矩办事，缺乏创新精神。B项：刻舟求剑比喻办事刻板，没有发展的眼光；竹篮打水：比喻花了时间精力，到头来却什么也没有得到。二者不是近义词关系。C项：言不由衷、口是心非二者都指说的不是真心话，比喻心口不一致。D项：未雨绸缪比喻事先做好准备工作；杞人忧天比喻不必要的或缺乏根据的忧虑与担心，二者意不相同。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0159","type":"single","t":"车轮:汽车:运输","o":[["A","衣服:衣架:晒衣"],["B","镜片:眼镜:读书"],["C","听筒:电话:通话"],["D","墨汁:毛笔:书法"]],"a":["C"],"an":"【解析】第一步：判断题干词语间的第一重逻辑关系，并在选项中进行选择。题干前两词是包容关系中的组成关系，车轮是汽车的一部分。与之逻辑关系相同的是B项和C项，A、D两项中前两词是对应关系。第二步：答案不唯一时，再判断题干词语间第二重逻辑关系，并在选项中进行选择。题干中后两个词是物体与功能间的对应关系，汽车的功能是运输，相同特征的即为C项，电话的功能是通话，B项中眼镜的功能是矫正视力，不是看书。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0160","type":"single","t":"满腹经纶对于（）相当于（）对于震撼","o":[["A","才能精彩绝伦"],["B","才华触目惊心"],["C","才干美轮美奂"],["D","才学绚丽多彩"]],"a":["B"],"an":"【解析】第一步：将选项逐一代入，判断词语之间的逻辑关系。A项中“才能”主要指比较重要的实践活动方面，与“满腹经伦”并不搭配。B项“满腹经伦”是用来形容“才华”，也是“才华”的表现之一，属于对应关系；“触目惊心”表示受到震惊，与“震撼”属于对应关系。C项“才干”主要侧重指办事能力，与“满腹经伦”也不搭配。D项“满腹经纶”可以形容人有“才学”属对应关系，但“绚丽多彩”不能修饰“震撼”，二者无关系。第二步：逻辑关系相同即为答案。B项同属于对应关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0161","type":"single","t":"出人头地：苏轼","o":[["A","东山再起：谢安"],["B","多多益善：项羽"],["C","投笔从戎：班固"],["D","指鹿为马：李林甫"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词间是对应关系，即历史典故与其对应的人物。“出人头地”出自欧阳修的《与梅圣俞书》。欧阳修在其中写道：“读轼书，不觉汗出，快哉快哉！老夫当避路，放他出一头之地也。”其中“读轼书”意即“读苏轼的书”，涉及到苏轼。第二步：判断选项词语间逻辑关系。A项：“东山再起”对应的是谢安，当选；B项：“多多益善”对应的是韩信；C项：“投笔从戎”对应的是班超；D项：“指鹿为马”对应的是赵高。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0162","type":"single","t":"计划对于（）相当于（）对于操作","o":[["A","实施规程"],["B","调研方法"],["C","方案制定"],["D","改变失误"]],"a":["A"],"an":"【解析】将选项逐一代入，判断各选项前后部分的逻辑关系。计划和实施是一组动宾关系，规程和操作也是一组动宾关系。B、C、D项均无明显逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0163","type":"single","t":"外交官：大学生","o":[["A","食物：庄稼"],["B","大炮：玩具"],["C","大雁塔：琉璃瓦"],["D","蔬菜：绿色植物"]],"a":["A"],"an":"【解析】第一步：判断词语之间逻辑关系。题干两词是交叉关系，大学生毕业后可能当外交官，也可能不当外交官，外交官不一定是大学生。第二步：判断选项词语之间逻辑关系。A项庄稼成熟后可能被当作食物，也可能不被当作食物（比如棉花就不能被当作食）；B项和C项没有交集，显然不符合题干逻辑；D项属于强干扰项，蔬菜和绿色植物之间没有先后的逻辑关系，蔬菜必定是绿色植物。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0164","type":"single","t":"寒对于（）相当于叫对于（）","o":[["A","冷喊"],["B","冬唱"],["C","春吟"],["D","冰说"]],"a":["A"],"an":"【解析】第一步：将选项逐一代入，判断选项前后两部分的逻辑关系。A项与题干组成的两组词均为全同关系中的近义词关系；B中前两词为属性关系，后两词没有逻辑关系；C中两词与题干均不构成逻辑关系；D中前两词为属性关系，后两词不构成逻辑关系。第二步：逻辑关系相同即为答案","tp":"类比推理","d":"中"},
	{"i":"fjcs_0165","type":"single","t":"雪花：大海","o":[["A","绿叶：土地"],["B","星星：宇宙"],["C","白云：天空"],["D","树木：森林"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。雪花飘落到大海里，融化后融入大海。第二步：判断选项词语间逻辑关系。A项：绿叶飘落到土地上，腐烂后融入土地；B项：星星是在宇宙中的，二者是组成关系，星星是组成宇宙的一种物质形式；C项：白云和天空是对应关系，白云漂浮在天空中；D项：树木和森林是组成关系，森林是由树木组成的。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0166","type":"single","t":"胎生动物：蝴蝶","o":[["A","男教师：女青年"],["B","实数：正数"],["C","哺乳动物：鸭嘴兽"],["D","文科：化学"]],"a":["D"],"an":"【解析】第一步，判断题干词语间逻辑关系。蝴蝶属于卵生动物，二者之间为种属关系，卵生动物与胎生动物为全异关系；第二步，判断选项词语间逻辑关系。A项：男教师和女青年之间无明显的逻辑关系。B项：实数包含正实数（正数）、零、负实数，实数与正数之间为组成关系，与题干逻辑关系不一致。C项：鸭嘴兽是一种哺乳动物，二者之间为种属关系，与题干逻辑关系不一致。D项：化学属于理科，二者之间为种属关系，文科与理科为全异关系，与题干逻辑关系一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0167","type":"single","t":"曹操：刘备","o":[["A","汽车：货车"],["B","蔬菜：食物"],["C","南京：北京"],["D","珠峰：喜马拉雅山"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是并列关系，曹操和刘备同为三国时期著名人物。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的为C，南京和北京同为中国主要城市，A、B、D项均为包容关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0168","type":"single","t":"春联：年画","o":[["A","灯笼：元宵"],["B","粽叶：粽子"],["C","菊花：月饼"],["D","灶王：腊八粥"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是并列关系，且是同属于一个节日下的并列关系，即“春联”和“年画”都属于春节时的所需品。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为A项，即“灯笼”和“元宵”都属于元宵节时的所需品；B项为包容关系，“粽叶”是“粽子”的一部分；C项中“菊花”属于重阳节的所需品，“月饼”属于中秋节的所需品；D项中腊月二十三至除夕供奉“灶王”，“腊八粥”一般在腊月初八。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0169","type":"single","t":"山色：水声","o":[["A","春花：秋月"],["B","珠圆：玉润"],["C","钟鼓：琴瑟"],["D","天寒：地冻"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。“山色”与“水声”为并列关系，且“山色”与“水声”都是偏正结构。第二步：判断选项词语间逻辑关系。A项：“春花”与“秋月”为并列关系，且“春花”与“秋月”都是偏正结构，与题干逻辑关系一致，当选；B项：“珠圆”与“玉润”为并列关系，但“珠圆”和“玉润”均非偏正结构，排除；C项：“钟鼓”与“琴瑟”为并列关系，但“钟鼓”与“琴瑟”都是并列结构，排除；D项：“天寒”与“地冻”为并列关系，但“天寒”和“地冻”均非偏正结构，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0170","type":"single","t":"谬误：语法","o":[["A","木头：煤炭"],["B","俗气：文章"],["C","馒头：面粉"],["D","快乐：高兴"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且前者可以用来形容后者。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为B。A是并列关系，C是对应关系，后者是制作前者的材料，D是近义词。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0171","type":"single","t":"创造：历史","o":[["A","发展：经济"],["B","和谐：社会"],["C","发扬：光大"],["D","生产：积累"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，构成动宾结构。第二步：判断选项词语间逻辑关系。A项中，发展经济是动宾关系，与题干逻辑关系相同，正确；B项为偏正关系；C项中的“发扬光大”是成语；D项前后不是动宾关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0172","type":"single","t":"传记对于（）相当于（）对于基因","o":[["A","自传细胞"],["B","人物遗传学"],["C","文学染色体"],["D","纪实治疗"]],"a":["B"],"an":"【解析】将选项逐一代入，判断各选项前后部分的逻辑关系。代入A项，“自传”是“传记”的一种，但“基因”不是“细胞”的一种，前后逻辑关系不完全一致；代入B项，“人物”是“传记”的主要记录对象，“基因”是“遗传学”的主要研究对象，前后逻辑关系一致；代入C项，“传记”是一种“文学”，但“基因”不是一种“染色体”，前后逻辑关系不一致；代入D项，“传记”是一种纪实，而“治疗”与“基因”没有明显的逻辑关系，前后逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0173","type":"single","t":"喜气洋洋：欢乐","o":[["A","气象万千：天气"],["B","寻根究底：问题"],["C","画蛇添足：多余"],["D","眼明手快：好动"]],"a":["C"],"an":"【解析】“喜气洋洋”形容非常得意或异常欢乐的样子。“喜气洋洋”用来形容“欢乐”，二者之间为对应关系。A项：“气象万千”形容景象或事物壮丽而多变化，而不是形容“天气”，二者之间无明显的逻辑关系，排除。B项：“寻根究底”指追求根底，一般指追问一件事的原由。“寻根究底”和“问题”之间无明显的逻辑关系，排除。C项：“画蛇添足”比喻做多余、不恰当的事，以致弄巧成拙。“画蛇添足”用来形容“多余”，二者之间为对应关系，当选。D项：“眼明手快”形容看得准，动作敏捷，而不是用来形容“好动”，二者之间无明显的逻辑关系，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0174","type":"single","t":"湖北：湖南","o":[["A","广州；广东"],["B","北京：上海"],["C","山东：广东"],["D","新疆：西藏"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是并列关系，且题干中湖北和湖南同为中国的省份，而且是相邻的关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为D，新疆和西藏相邻。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0175","type":"single","t":"微机：电脑桌：办公室","o":[["A","仪器：小白鼠：实验室"],["B","门：窗：家具"],["C","芹菜：炒锅：食堂"],["D","牛：马：大草原"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题目考查对应关系和包含关系，“微机”在“电脑桌”上，“电脑桌”在“办公室”里。第二步：判断选项词语间逻辑关系。A项中“仪器”里有“小白鼠”，但两者位置与题干相反；B项中“门”和“窗”是并列关系；C项中“芹菜”在“炒锅”里，“炒锅”在“食堂”里，对应关系和包含关系与题干一致；D项中“牛”和“马”是并列关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0176","type":"single","t":"冰∶水∶蒸气","o":[["A","汉人∶华人∶华侨"],["B","二氧化碳∶干冰∶灭火"],["C","金刚石∶石墨∶铅笔"],["D","纸张∶论文∶作者"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词是对应关系，三个词的本质是一样的，分别是固态、液态、气态。第二步：判断选项词语间逻辑关系。A项中汉人、华人、华侨本质上都是中国人，分别是按民族、人种、国籍做的表达；B、C项中只有前两词的本质相同；D构不成逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0177","type":"single","t":"选择：抉择","o":[["A","爱好：嗜好"],["B","决定：决策"],["C","按时：准时"],["D","参加：参与"]],"a":["B"],"an":"【解析】第一步：判断词语之间逻辑关系。题干两词是词义相近，抉择用于较正式的场合或书面。第二步：判断选项词语之间逻辑关系。A项“爱好”和“嗜好”词义相近，但“嗜好”多用于贬义，而并非是“爱好”在正式场合或书面时的使用；B项“决定”和“决策”词义相近，而“决策”用于较正式的场合或书面，符合题干逻辑；C项“准时”、D项“参与”没有明显的场合要求。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0178","type":"single","t":"空气：空调：冷气","o":[["A","信号：电视：图像"],["B","食材：烹饪：美食"],["C","面粉：烤箱：面包"],["D","石油：提炼：汽油"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。空调对空气制冷形成冷气，冷气与空气是种属关系，三者都是名词。第二步：判断选项词语间逻辑关系。A项：电视对信号转换形成图像，图像是一种信号，与题干逻辑关系一致，当选。B项：烹饪是动词，排除。C项：烤箱对面粉烘培做成面包，但面包不是面粉的一种，不构成种属关系，排除。D项：提炼是动词，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0179","type":"single","t":"交通:拥堵:治理","o":[["A","生活:贫困:救济"],["B","食材:讲究:享用"],["C","音乐:动感:聆听"],["D","健康:虚弱:保健"]],"a":["A"],"an":"【解析】交通拥堵构成主谓结构，治理拥堵构成动宾结构，并且交通拥堵是治理拥堵的原因。A项生活贫困是主谓结构，救济贫困是动宾关系，生活贫困是救济贫困的原因，符合题意；B项食材讲究是主谓结构，但是讲究享用不构成动宾结构；C项音乐和动感是主客体关系，不能说音乐动感，而要说音乐有动感；D项健康和虚弱是反义词关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0180","type":"single","t":"鱼饵：鱼竿","o":[["A","笔：书籍"],["B","写诗：笔"],["C","锅铲：炒锅"],["D","电脑：无线路由器"]],"a":["C"],"an":"【解析】第一步：分析题干词语的逻辑关系鱼饵和鱼竿为配套使用的对应关系。第二部：逐一分析选项A选项：笔和书籍没有必然对应关系，笔可以书写书籍，但是书籍上的文字也能通过打印形成。与题干逻辑不符，排除。B选项：写诗和笔没有必然对应关系，笔可以写诗，但不是必然的对应关系，并且写诗是动宾关系，与题干逻辑不符，排除。C选项：锅铲与炒锅是配套使用的，与题干逻辑关系一致，为正确答案。D选项：电脑和无线路由器没有必然配套使用的对应关系，与题干逻辑不符，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0181","type":"single","t":"不想当将军的士兵不是好士兵","o":[["A","常在河边走，哪能不湿鞋"],["B","巧妇难为无米之炊"],["C","万事俱备，只欠东风"],["D","吃得苦中苦，方为人上人"]],"a":["D"],"an":"【解析】第一步：判断题干逻辑关系。题干体现了必要条件关系，“想当将军的士兵”是“好士兵”的必要条件。第二步：判断选项词语之间逻辑关系。A项是“常在河边走”是“湿鞋”的充分条件；B项、C项没有明显的逻辑关系；D项“吃得苦中苦”是“为人上人”的必要条件，符合题干逻辑。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0182","type":"single","t":"守望：期待","o":[["A","智慧：语言"],["B","咬文：嚼字"],["C","智商：情商"],["D","升腾：冲刺"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是近义词，属于全同关系。第二步：判断选项词语间逻辑关系。A中“智慧”和“语言”是对应关系；B中“咬文”和“嚼字”也是近义词；C中“情商”和“智商”是反对关系，除了这二者之外还有“逆境商”；D中“升腾”指向上升，“冲刺”指向前。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0183","type":"single","t":"生态：原生态","o":[["A","金三角：珠三角"],["B","海内：天涯"],["C","公交：巴士"],["D","缩水：布缩水"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干中两词是包容关系中的属种关系，原生态是一种生态。第二步：判断选项词语间逻辑关系。D中布缩水是缩水的一种，与题干逻辑关系相同。A中“金三角”和“珠三角”是两个不同的地方，是并列关系；B中“海内”和“天涯”是对应关系，都表示空间、距离；C中“公交”和“巴士”是本土词和英译词之间的同义词，是全同关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0184","type":"single","t":"丰功：伟绩","o":[["A","维和：行动"],["B","风餐：露宿"],["C","文化：传播"],["D","风卷：残云"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干中“丰功”和“伟绩”构成并列式成语。第二步：判断选项词语间逻辑关系。A中“维和”和“行动”不能构成成语；B中“风餐”和“露宿”同样构成并列式成语；C中“文化”和“传播”不能构成成语；D中“风卷”和“残云”构成动宾式成语。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0185","type":"single","t":"丝线：编制：花边","o":[["A","毛笔：描画：美景"],["B","竹木：铺设：浮桥"],["C","专家：总结：理论"],["D","电影：编辑：文字"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词是对应关系，丝线经过编制成为花边，即原材料、动作、产成品的对应关系。与之关系相同的是B项，竹木经过铺设成为浮桥。第二步：逐一判断其他选项。A项美景不是毛笔的产成品；C项专家不是原材料；D项电影不是原材料，文字不是电影的产成品。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0186","type":"single","t":"枕头：卧具","o":[["A","铅笔：工具"],["B","地球：宇宙"],["C","宣纸：文具"],["D","车厢：火车"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是包容关系，且是包容中的种属关系。枕头属于卧具，宣纸属于文具。第二步：判断选项词语间逻辑关系。A无明显逻辑关系；B、D是包容中的必然组成关系；与题干相同逻辑关系的即为C。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0187","type":"single","t":"莱茵河：欧洲","o":[["A","多瑙河：北美洲"],["B","非洲：尼罗河"],["C","亚马逊河：南美洲"],["D","亚洲：黄河"]],"a":["C"],"an":"【解析】第一步：判断题干词语间的对应关系。题干两词为对应关系，是位置的对应。第二步：判断选项词语间的逻辑关系。A中多瑙河位于欧洲；B、D中前后词顺序与题干相反；C中的亚马逊河位于南美洲。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0188","type":"single","t":"花卉：花","o":[["A","汽车：车"],["B","人口：人"],["C","山峰：山"],["D","粮食：米"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。花卉包含花和草，花卉与花是种属关系。第二步：判断选项词语间逻辑关系。A项：车不仅仅只包括汽车，还有自行车、火车、电动车等，是种属关系，但汽车外延比车的外延小；B项：人口是人的复数，二者所指含义相同；C项：山峰是山的突出的尖顶，二者是组成关系；D项：米是粮食的一种，二者是种属关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0189","type":"single","t":"报纸：新闻","o":[["A","电影：电影院"],["B","报刊亭：报纸"],["C","杂志：广告"],["D","信封：信纸"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是交叉关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为C。报纸是传播新闻的一种载体或方式，却不是唯一方式，报纸和新闻是交叉关系。C项中广告可通过杂志发布，但还可通过电视、电台等其他方式发布。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0190","type":"single","t":"高大：渺小","o":[["A","无穷：无尽"],["B","春种：秋收"],["C","赞誉：诋毁"],["D","牛奶：面包"]],"a":["C"],"an":"第一步：判断题干词语间逻辑关系。高大和渺小是反义词关系。第二步：判断选项词语间逻辑关系。A项：无穷和无尽都是指没有穷尽的意思，是同义词关系，排除。B项：春种是指春天耕种，秋收是指秋天收获，二者不构成反义词关系，排除。C项：赞誉是指赞美称扬，诋毁是指污蔑诽谤，二者构成反义词关系，当选。D项：牛奶和面包都是食品，是并列关系，不构成反义词关系，排除。故正确答案为C。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0191","type":"single","t":"守株待兔：望梅止渴","o":[["A","唇亡齿寒：鸡鸣狗盗"],["B","闻鸡起舞：指鹿为马"],["C","掩耳盗铃：拔苗助长"],["D","不寒而栗：不学无术"]],"a":["C"],"an":"【解析】题干：守株待兔比喻企图不经过努力而得到成功的侥幸心理。望梅止渴比喻愿望无法实现，便凭空想来加以安慰。二者均含有贬义色彩。A项：唇亡齿寒比喻关系密切，利害相关，为中性词。鸡鸣狗盗比喻那些既无真才实学，也无堂皇风度，只不过略有低下本领的人，含贬义；B项：闻鸡起舞比喻有志报国的人及时奋起，为褒义词。指鹿为马比喻故意颠倒黑白，混淆是非，是贬义词；C项：掩耳盗铃比喻自己欺骗自己，明明掩盖不住的事情偏要想法子掩盖，贬义词。拔苗助长比喻违反自然规律发展的客观规律，急于求成，不加思考，反而把事情弄糟，贬义词。二者都是贬义词，符合题干逻辑关系；D项：不寒而栗比喻因为害怕而形成发抖的样子，没有明显的感情色彩。不学无术比喻人无学问、没本事，是贬义词。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0192","type":"single","t":"劳动者：农民","o":[["A","野兔：草"],["B","动物：脊椎动物"],["C","爬行动物：哺乳动物"],["D","昆虫：鱼类"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干中两词构成包容关系，“劳动者”包括“农民”。第二步：判断选项词语间逻辑关系。与题干逻辑关系相同的只有B，“动物”包括“脊椎动物”。A中两词为对应关系，“兔子”吃“草”，进食者与食物的对应；C中两词为并列关系，爬行动物和哺乳动物都是动物的一种；D中两词为并列关系，昆虫和鱼类都是动物群体之一。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0193","type":"single","t":"教师：教室","o":[["A","士兵：子弹"],["B","士兵：战斗"],["C","战场：战士"],["D","士兵：军营"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词为对应关系，且为职业和地点之间的一一对应关系。第二步：判断选项词语间逻辑关系。与题干相同的逻辑关系即为D，士兵的工作地点在军营；A、B、C均没有地点。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0194","type":"single","t":"棉花：棉田","o":[["A","灯光：灯火"],["B","海滩：海豚"],["C","庙会：庙宇"],["D","茶树：茶园"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，棉花生长在棉田里。第二步：判断选项词语间逻辑关系。A、B、C中词语间并非物与地点的对应关系；D符合题干逻辑，茶树生长在茶园里。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0195","type":"single","t":"鲁迅∶《呐喊》的作者","o":[["A","医生∶大夫"],["B","番茄∶西红柿"],["C","土豆∶马铃薯"],["D","爱因斯坦∶相对论的创立者"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应，且是人物和对人物描述间的对应关系，即“鲁迅”是“《呐喊》的作者”。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为D，即“爱因斯坦”是“相对论的创立者”。A、B和C均是同一事物的不同称谓，且没有人物和对人物描述间的对应关系，因此A、B和C均错误。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0196","type":"single","t":"阴晴圆缺：月亮","o":[["A","潮涨潮落：海洋"],["B","天高云淡：金秋"],["C","暮鼓晨钟：时光"],["D","稍纵即逝：机会"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。月亮会有阴晴圆缺的变化，且阴晴圆缺是月亮的一种正常的自然现象。第二步：判断选项词语间逻辑关系。A项：海洋会有潮涨潮落，且潮涨潮落也是海洋的一种正常的自然现象，与题干对应关系完全吻合，当选；B项：天高云淡是形容天空的，与金秋无关，不相对应；C项：暮鼓晨钟并非一种自然现象，与题干逻辑关系不相对应，排除；D项：稍纵即逝也并非一种自然现象，与题干逻辑关系不相对应，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0197","type":"single","t":"实践：认识","o":[["A","矛盾：发展"],["B","内因：外因"],["C","整体：部分"],["D","物质：意识"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，实践是认识的基础，认识反作用于实践。第二步：判断选项词语间逻辑关系。A选项矛盾是发展的动力，与题干逻辑关系不同；B选项内因和外因是并列关系中的矛盾关系；C选项二者是包容关系中的组成关系，整体是由部分组成的；D选项物质决定意识，是意识的基础，意识反作用于物质。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0198","type":"single","t":"衣柜：衣服：拉链","o":[["A","鞋盒：鞋子：鞋带"],["B","食品：饼干：糖果"],["C","运动：羽毛球：球拍"],["D","灯光：阳光：月光"]],"a":["A"],"an":"【解析】第一步：判断题干前两词间的逻辑关系，并在选项中进行选择。题干中前两词为对应关系，是物体与其存放地点的对应。A项中前两词为物体与存放地点的对应；B、C项中前两词为种属关系；D项中前两词为并列关系。第二步：判断题干后两词间的逻辑关系，并在选项中进行选择。题干后两词为组成关系。A项中后两词为组成关系，符合题干。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0199","type":"single","t":"食物：食品","o":[["A","拘泥：拘谨"],["B","达到：到达"],["C","发挥：发扬"],["D","矿产：矿石"]],"a":["D"],"an":"【解析】第一步：判断题干关系。食物定义很广泛，能吃的东西就称为食物，食品即经过加工包装出来的食物，所以两者是包容关系，后者是前者的一部分。第二步：逐一判断选项关系。A项拘泥和拘谨是同义词，属于全同关系，排除；B项达到是动词，到达是形容词或副词，意思不同没有直接关系，排除；C项发挥和发扬是同义词，属于全同关系，排除；D项矿产和矿石是包容关系，矿石是矿产的一种，符合题干的关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0200","type":"single","t":"软件：程序员：编写","o":[["A","木头：木匠：打制"],["B","渔网：渔民：编织"],["C","车票：乘客：购买"],["D","麦克风：歌手：唱歌"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词构成产成品、职业者与动作的对应关系，软件是程序员编写的，程序员是一种职业。与之逻辑关系相同的是B项，渔网是渔民编织的，渔民是一种职业。第二步：逐一判断其他选项。A项木匠打制出来的是木制品，而非木头；C项乘客购买车票，但乘客不是一种职业；D项歌手用麦克风唱歌，麦克风是歌手唱歌的工具，不是产成品。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0201","type":"single","t":"房屋：地基","o":[["A","艺术：经济"],["B","火车：铁路"],["C","婚姻：爱情"],["D","烦恼：欲望"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。“房屋”建立在“地基”之上，要想建造“房屋”，必须先打“地基”。因此“房屋”和“地基”是一一对应的关系，且“房屋”和“地基”也都是具体的事物。第二步：判断选项词语间逻辑关系。A项中“艺术”和“经济”之间没有明显的逻辑关系，虽然“经济”状况良好对于发展“艺术”能够起到推动和促进作用，但是“艺术”的发展并不以“经济”良好为必需要件；B项中“火车”只能在“铁路”上运行，要想运行“火车”，必须修建“铁路”，二者是一一对应的关系，同时它们也都是具体的事物；C项中理想状态下，“婚姻”是“爱情”的殿堂，但是“婚姻”并不一定需要“爱情”的存在，比如有些以政治、经济为目的的“婚姻”，以及一些父母包办的“婚姻”等，因此二者并不是一一对应的关系；D项中人们产生“烦恼”，有些时候是因为“欲望”没有得到满足，但是“烦恼”也会来源于其他方面，比如没有达到期望、没有完成目标等，而且二者都是抽象的事物。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0202","type":"single","t":"邀请：拒绝：接受","o":[["A","问候：咒骂：感谢"],["B","道歉：真诚：虚伪"],["C","威胁：妥协：报警"],["D","建议：反对：接纳"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。给出邀请后对方有两种结果：拒绝和接受。第二步：判断选项词语间逻辑关系。D项给出建议后对方有两种结果：反对和接纳；A、B、C三项没有体现出两种结果。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0203","type":"single","t":"潮:涨:落","o":[["A","花:蕊:瓣"],["B","草:荣:枯"],["C","心:悲:喜"],["D","水:沸:冰"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。潮涨、潮落都是潮的一种周期状态，二词均为主谓结构。第二步：判断选项词语间逻辑关系。A项：花蕊、花瓣均非花的一种状态，而是花的组成部分，排除。B项：草荣、草枯都是草的一种周期状态，二词均为主谓结构，与题干逻辑关系对应。C项：悲、喜为形容词词性，与题干涨、落动词词性不对应，排除。D项：沸、冰为形容词词性，与题干涨、落动词词性不对应，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0204","type":"single","t":"建筑：凝固的音乐：哥特式建筑","o":[["A","运动：使人健康的方式：生命"],["B","眼睛：心灵的窗户：丹凤眼"],["C","偶数：能被2整除的数：6"],["D","音乐：流动的符号：钢琴"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干第一个和第二个词是对应关系，且前者可以比喻为后者。第一个词和第三个词之间是包容关系，且是包容中的种属关系。将“建筑”比喻为“凝固的音乐”，“哥特式建筑”是形容“建筑”的一种风格。第二步：判断选项词语间逻辑关系。A中运动就是一种使人健康的方式，是种属关系；B中将“眼睛”比喻为“心灵的窗户”，“丹凤眼”是形容“眼睛”的一种形态；C中“偶数”是“能被2整除的数”，这是一个明确的概念，并不是比喻；D中音乐和钢琴不是种属关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0205","type":"single","t":"请从四个选项中选出正确的一项，其关系与题干给出的词或词组的关系最为相似。前进：倒退","o":[["A","鞭策：规劝"],["B","海洋：陆地"],["C","震动：安静"],["D","延长：压缩"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是反义词关系。第二步：判断选项词语间逻辑关系。与题干具有相同逻辑关系的即为D项。A项为近义词关系，B项为并列关系，C项中“安静”的反义词应该为“吵闹”，而不是“震动”。综上，","tp":"类比推理","d":"中"},
	{"i":"fjcs_0206","type":"single","t":"二氧化碳对于干冰相当于（）对于（）","o":[["A","一氧化碳——墨"],["B","石墨——金刚石"],["C","水——液体"],["D","空气——氧气"]],"a":["B"],"an":"【解析】第一步：判断题干词语间的对应关系。题干两词为对应关系，是化学式相同的物质间不同状态的对应。第二步：逐一判断选项。A中两物质的化学式不同；B中两词的化学式均为C，且状态不同；C、D中的液体和空气不是纯净物，不存在化学式。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0207","type":"single","t":"舞台：道具：演员","o":[["A","汽车：驾驶：司机"],["B","操场：足球：学生"],["C","商场：商品：消费者"],["D","工厂：机器：工人"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干词语可造句为：演员在舞台上使用道具。其中第一词为状语，第二词为宾语，第三词为主语。第二步：判断选项词语间逻辑关系。A项：司机驾驶汽车，第二词为谓语，与题干词性不相对应。B项的学生在操场踢足球、C项的消费者在商场购买商品、D项的工人在工厂操作机器，三项在造句对比中，均与题干对应；而演员是一种职业，工人也是一种职业，故D项与题干的切合度更高，学生和消费者均非一种职业，排除B、C两项。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0208","type":"single","t":"红豆：秋衣","o":[["A","宝马：香车"],["B","骆驼：沙漠"],["C","白雪：冬天"],["D","绿箭：口香糖"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是商品品牌与商品种类的对应关系。第二步：判断选项词语间逻辑关系。D绿箭牌口香糖，与题干具有相同的逻辑关系。A、B、C均是物品与象征意义的对应关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0209","type":"single","t":"外科医生∶X光片","o":[["A","木匠∶围底"],["B","老师∶黑板"],["C","业务员∶合同"],["D","作家∶作稿"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是使用者与工具的一一对应关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为B；A不存在明显逻辑关系；C不是一一对应关系；D中“作家”对应的应为“笔”。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0210","type":"single","t":"旗舰店：商店","o":[["A","黄金水道：航线"],["B","劳力士：钟表"],["C","总统套房：标间"],["D","金刚钻：瓷器"]],"a":["A"],"an":"【解析】第一步：判断题干词语间第一重逻辑关系，并在选项中进行选择。题干词语间为包容关系，且是包容关系中的种属关系，前者是后者的一种，旗舰店是一种特殊的商店。A项：黄金水道是航线的一种，符合题干逻辑关系；B项：劳力士是钟表的一种，也符合题干逻辑关系；C项：总统套房与标间，不符合题干逻辑关系；D项：金刚钻与瓷器，也不符合题干逻辑关系。第二步：判断题干词语间第二重逻辑关系，看选项是否符合。A、B两项都符合第一重逻辑关系，此时我们就需要进行属性关系的比较，旗舰店和黄金水道都是一个集合概念，分别是对高端商店和高端航线的统称，而劳力士是一个品牌的标志。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0211","type":"single","t":"杯：碗与（）在内在逻辑关系上最为相似。","o":[["A","锯：刀"],["B","灯：光"],["C","木：椅"],["D","火：炉"]],"a":["A"],"an":"【解析】第一步：分析题干词语的逻辑关系杯和碗都是容器的两种，并列关系，且功能类似。第二步：逐一分析选项A项：锯和刀都是工具里面的两种，并列关系，功能也类似，和题干逻辑关系一致；B项：发光是灯的属性，和题干逻辑关系不一致；C项：木是椅子的其中一种可能性原材料属于对应关系，和题干逻辑关系不一致；D项：炉里面生火属于对应关系，和题干逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0212","type":"single","t":"画圣：吴道子","o":[["A","酒圣：杜康"],["B","茶圣：陆游"],["C","武圣：张飞"],["D","医圣：华佗"]],"a":["A"],"an":"【解析】第一步：判断词语之间逻辑关系。题干两词是对应关系，后人对第二个的尊称为第一个。第二步：判断选项词语之间逻辑关系。B项茶圣是陆羽；C项武圣是关羽；D项医圣是张仲景。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0213","type":"single","t":"非法：非难","o":[["A","非但：非凡"],["B","非礼：非洲"],["C","非议：非分"],["D","非诚勿扰：非常完美"]],"a":["C"],"an":"【解析】第一步：判断题干词语间逻辑关系。非法为形容词，意为“不”，例：非法之徒；非难为动词，例：无可非难，意为“指责”。第二步：判断选项词语间逻辑关系。A项：非但为关联词，即为“不但”，词性与题干不符；B项：非洲为名词。题干词语中并未出现名词，排除；C项：非议为动词，例：无可非议，同样意为指责；非分为形容词，例：非分之想。无论是词性还是词意，都与题干交叉对应，当选；D项：非常完美中的非为副词，与题干不符。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0214","type":"single","t":"蓝天：飞行员：战斗机","o":[["A","草原：牧民：牛羊"],["B","刺绣：绣女：绣花针"],["C","森林：伐木工：电锯"],["D","大海：水兵：军舰"]],"a":["D"],"an":"【解析】第一步：判断题干词语间第一重逻辑关系，并在选项中进行选择。题干词语之间属于对应关系，飞行员在蓝天上驾驶战斗机，A、D项均符合此逻辑。第二步：再判断题干词语间第二重逻辑关系，并在选项中进行选择。题干描述的是军事领域，与此逻辑相符的是D项。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0215","type":"single","t":"网络日记对于（）相当于菠萝对于（）","o":[["A","网络——苹果"],["B","电脑——香蕉"],["C","博客——凤梨"],["D","写手——水果"]],"a":["C"],"an":"【解析】第一步：将选项逐一代入，判断各选项前后部分的逻辑关系。A、B中前两词均为对应关系，后两词均为并列关系；C中两组词均可组成全同关系，且为同义词；D中前两次为对应关系，后两词为种属关系。第二步：逻辑关系相同即为答案。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0216","type":"single","t":"咽喉：要塞","o":[["A","耳目：刺探"],["B","头脑：智力"],["C","手脚：捣鬼"],["D","眉目：头绪"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。咽喉的比喻义为要塞，表示重要的通道节点，必经之路。常说的“咽喉要地”，就是指在军事上像咽喉一样十分要害的地方。二者是并列对等的。第二步：判断选项词语间逻辑关系。A项：耳目的比喻意义为侦探、卧底，不是刺探；B项：头脑不存在比喻义，和智力之间没有比喻与被比喻的关系；C项：手脚比喻为了显示某种企图而暗中采取的行动，而不是捣鬼；D项：眉目用来比喻要办的事情有了一定的进展，有了头绪，符合题干词语间逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0217","type":"single","t":"拍摄：剪辑：放映","o":[["A","诊断：检查：康复"],["B","编辑：征稿：出版"],["C","化妆：演出：喝彩"],["D","开采：加工：销售"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词之间存在一定的先后顺向，先拍摄，然后剪辑，最后放映。第二步：判断选项词语间逻辑关系。A项：应先检查，然后诊断，顺序颠倒，排除；B项：应先征稿，然后编辑，顺序颠倒，排除；C项：喝彩并不存在一定的顺序逻辑，在哪个阶段都可以赢得喝彩，演出前往往也有喝彩声，排除；D项：先开采，然后加工，最后销售，符合题干的先后顺序，当选。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0218","type":"single","t":"考古：文物：博物馆","o":[["A","教育：人才：企业"],["B","贸易：商品：工厂"],["C","耕种：庄稼：土地"],["D","培训：员工：社会"]],"a":["A"],"an":"【解析】第一步：判断题干词语间第一重逻辑关系，并在选项中进行选择。题干中“考古”后得到“文物”，二者是因果关系，只有A符合此逻辑关系。B中“贸易”和“商品”，C中“耕种”和“庄稼”，D中“培训”和“员工”都是对应关系。第二步：再判断题干词语间第二重逻辑关系，检验选项。题干中“文物”和“博物馆”是物品与场所间的或然对应关系。A中“人才”和“企业”也是或然对应关系，A正确；B中“商品”和“工厂”，C中“庄稼”和“土地”是必然对应关系；D中“员工”和“社会”间无明显逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0219","type":"single","t":"（）对于运动相当于手术对于（）","o":[["A","学习；健康"],["B","锻炼；急救"],["C","足球；治疗"],["D","懒惰；药物"]],"a":["C"],"an":"【解析】将选项逐一代入，判断各选项前后部分的逻辑关系。A项代入前一组词为并列关系，后一组词为对应关系；B项代入前一组不构成逻辑关系，后一组构成对应关系；C项中前一组构成种属关系，后一组为种属关系，足球是一种运动方式，手术是一种治疗手段；D项中前一组不构成逻辑关系，后一组为对应关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0220","type":"single","t":"《大学》：《中庸》：四书","o":[["A","泰山：华山：五岳"],["B","物欲：财欲：六欲"],["C","朝夕：除夕：七夕"],["D","春风：秋雨：四季"]],"a":["A"],"an":"【解析】第一步：分析题干词语间逻辑关系。《大学》和《中庸》是并列关系，二者为四书的组成部分。第二步：判断选项词语间逻辑关系。A项：泰山和华山是并列关系，二者为五岳的组成部分，符合题干的逻辑关系，当选；B项：六欲是中国古代区分感情的一种分类，一般指眼（见欲，贪美色奇物）、耳（听欲，贪美音赞言）、鼻（香欲，贪香味）、舌（味欲，贪美食口快）、身（触欲，贪舒适享受）、意（意欲，贪声色、名利、恩爱）。物欲和财欲不是六欲的组成部分，不符合题干的逻辑关系，排除；C项：朝夕指的是一天中的早晚，除夕和七夕都是传统节日，不符合题干的逻辑关系，排除；D项：春风和秋雨都是天气现象，二者不是四季的组成部分，不符合题干的逻辑关系，排除。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0221","type":"single","t":"（）对于龙，相当于行星对于（）","o":[["A","麒麟∶太空"],["B","传说∶天文"],["C","生肖∶地球"],["D","动物∶恒星"]],"a":["C"],"an":"【解析】将选项逐一代入，判断各选项前后部分的逻辑关系。A选项：麒麟和龙是并列关系，行星和太空属于包容关系中的组成关系；B选项：传说和龙是包容关系，行星和天文没有明显逻辑关系；C选项：生肖和龙是包容关系，地球和行星是包容关系；D选项：动物和龙是包容关系，行星和恒星是并列关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0222","type":"single","t":"教师：学生（）","o":[["A","裁判：运动员"],["B","律师：法官"],["C","医生：护士"],["D","厨师：饲养员"]],"a":["A"],"an":"【解析】第一步：分析题干词语的逻辑关系教师和学生是两个对应的身份，教师教学生，两个主体构成工作上的主宾关系。第二步：逐一分析选项A项：裁判对应运动员，裁判判罚运动员，两个主体构成工作上的主宾关系，和题干逻辑关系一致；B项：律师在法庭上进行辩护，法官在法庭上进行审判，二者并列关系，不构成工作上的主宾关系，和题干逻辑关系不一致；C项：医生与护士是医院里两种分工不同的职业，二者是并列关系，两个主体不构成工作上的主宾关系，和题干逻辑关系不一致；D项：厨师是做饭的，饲养员是饲养动物的，二者是并列关系，不构成工作上的主宾关系，和题干逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0223","type":"single","t":"经济特区：珠海","o":[["A","乐器：陶笛"],["B","南沙群岛：黄岩岛"],["C","飞禽：蝙蝠"],["D","海军：航空母舰"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是种属关系，珠海是经济特区中的一个。第二步：判断选项词语间逻辑关系。A选项：陶笛是乐器的一种；B选项：黄岩岛属于中沙群岛众多岛屿之一，而不是南沙群岛；C选项：飞禽是飞行的鸟类，蝙蝠属于哺乳动物而不是飞禽；D选项：航空母舰属于海军，属于海军运输工具中的一种。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0224","type":"single","t":"芒种：成熟：节气","o":[["A","音响：立体：设备"],["B","流星：闪光：天体"],["C","冠礼：婚嫁：礼仪"],["D","古稀：高寿：称谓"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干三词是对应关系，“芒种”是代表“成熟”的“节气”。第二步：逐一分析选项。只有D项与之逻辑关系一致，“古稀”是中国人自古指七十“高寿”的“称谓”，是答案。A项“立体声”是“音响”自身所具有的一种实际属性，而不是一种代表义；B项，“流星”是一种“天体”，但是不会“闪光”；C项，“冠礼”是一种代表“成年”的“礼仪”，而不是“婚嫁”。A、B、C三项均与题干逻辑关系不一致。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0225","type":"single","t":"青霉素：细菌","o":[["A","伪劣产品：信誉"],["B","维生素：营养"],["C","国策：人口"],["D","经济措施：危机"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。青霉素可以对抗细菌。题干两词构成前一词作用于后一词的对应关系，且后一词是有害的。第二步：判断选项词语间逻辑关系。A项，伪劣产品会影响信誉，两词也是对应关系，但信誉并非不好的、需要解决的现象，与题干逻辑不符；B项，维生素是有营养的，两词构成属性关系，与题干逻辑不符；C项，制定国策解决人口问题，两词也是前一词作用于后一词的对应关系，但人口本身并不能说明有害或无害，与题干逻辑不符；D项，经济措施可以对抗危机，危机是有害的，需要消除的现象，与题干逻辑相符。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0226","type":"single","t":"收入分配：基尼系数","o":[["A","食品支出：恩格尔系数"],["B","CPI：消费者价格指数"],["C","环境保护：幸福指数"],["D","香港：恒生指数"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。基尼系数是测定收入分配差异的指标，收入分配差异越大，基尼系数越高。第二步：判断选项词语间逻辑关系。A项，恩格尔系数是食品支出总额占个人消费支出总额的比重，食品支出总额的占比越高，恩格尔系数越高，和题干逻辑一致；B项，CPI就是消费者价格指数；C项，环境保护和幸福指数之间没有关系；D项，恒生指数是香港股市价格的重要指标，跟“香港”不存在直接逻辑关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0227","type":"single","t":"上海：沪","o":[["A","河南：豫"],["B","福建：鲁"],["C","江西：皖"],["D","河北：赣"]],"a":["A"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是省份和简称的一一对应关系。第二步：判断选项词语间逻辑关系。福建是闽，江西是赣，河北是冀，B、C、D错误，河南为豫。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0228","type":"single","t":"跆拳道∶韩国","o":[["A","日本∶相扑"],["B","武术∶中国"],["C","足球∶美国"],["D","英国∶网球"]],"a":["B"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且是体育项目和其发源国之间的一一对应关系。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为B；A相扑发源于日本，但是对应关系相反；C足球发源于英国；D网球发源于英国，但是对应关系相反。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0229","type":"single","t":"堤坝∶洪水","o":[["A","水∶火"],["B","抑制∶情感"],["C","军人∶战争"],["D","食物∶饥饿"]],"a":["D"],"an":"【解析】第一步：判断题干词语间逻辑关系。题干两词是对应关系，且前者与后者是作用与被作用的对应关系，“堤坝”用来阻拦“洪水”。第二步：判断选项词语间逻辑关系。与题干相同逻辑关系的即为D，D中“食物”用来解除“饥饿”；A是反义词；B和C虽是对应关系，但均不符合作用与被作用的对应关系。","tp":"类比推理","d":"中"},
	{"i":"fjcs_0230","type":"single","t":"妻子：母亲：社会角色","o":[["A","水：冰：液体"],["B","父亲：儿子：家庭"],["C","冰糖：砂糖：糖精"],["D","石墨：金刚石：化学物质"]],"a":["D"],"an":"【解析】第一步：判断题干词语间第一重逻辑关系，并在选项中进行选择。题干中“妻子”和“母亲”是一个人的不同角色，有此逻辑关系的有A、B、D。C中“冰糖”和“砂糖”不是同一种糖，C错误。第二步：再判断题干词语间第二重逻辑关系，并在选项中进行选择。题干中“妻子”和“母亲”都是“社会角色”，这是种属关系。A中“冰”不是“液体”，A错误；B中“父亲”和“儿子”是“家庭成员”而不是“家庭”，B错误；D中“石墨”和“金刚石”是碳的不同表现形式，且“石墨”和“金刚石”属于“化学物质”，D正确。","tp":"类比推理","d":"中"},
	{"i": "fjcs_0231", "type": "single", "t": "科学界最近发现了一种α拟菌病毒，这种病毒会寄生于β变形虫体内。被这种 病毒寄生的β变形虫会在哺乳类动物体内释放某种γ刺激物，这种刺激物会导致该动物的呼 吸系统产生剧烈反应，严重时会造成呼吸困难。目前在临床中发现有呼吸困难症状的动物体 内都能找到α拟菌病毒。 由此可以推出：", "o": [["A", "在呼吸正常的哺乳类动物体内不可能发现γ刺激物"], ["B", "β变形虫在哺乳类动物体内会使哺乳类动物的呼吸系统产生剧烈反应"], ["C", "β变形虫在没有α拟菌病毒寄生的情况下，不会产生导致哺乳类动物呼吸困难 的刺激物"], ["D", "如果某个哺乳类动物感染了α拟菌病毒，该动物肯定有呼吸困难的症状"]], "a": ["C"], "an": "本题为关联词推导题型。 第一步：翻译题干。 （1）α拟菌病毒∧β变形虫γ刺激物（事实信息，构成充要条件，互为前、后件） （2）γ刺激物→呼吸系统产生剧烈反应 （3）呼吸困难症状→α拟菌病毒 第二步：逐一翻译选项。 “呼吸正常”是对“呼吸困难”的绝对否定，并不等价于对“呼吸系统产生剧烈反应”的绝对否定 （此处为强干扰，容易错选）；根据逆否规则，无法推出不存在γ刺激物，A项无法推出； β变形虫→呼吸系统产生剧烈反应，由联言命题规则可知，两个联言肢如有一假，则联言命 题为假，因没有提到是否有“α拟菌病毒”寄生，故无法推出存在“γ刺激物”，继而无法推出“呼 吸系统产生剧烈反应”，B项无法推出； 没有“α拟菌病毒寄生”，否定了（1）联言命题中的一肢，则整个联言命题为假，根据充要条 件规则，可知不存在“γ刺激物”，C项可以推出； 感染α拟菌病毒，肯定了（3）的后件，充分关系中，肯后件无法推出肯前件，D项无法推出。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0232", "type": "single", "t": "A、B、C、D四个女生住在同一个宿舍，她们当中有一个人在洗水果，一个人在画画，一个人在上网，一个人在复习功课。其中：(1)A不在洗水果，也不在复习功课；(2)B不在上网，也不在洗水果；(3)如果A不在上网，那么D不在洗水果；(4)C不在复习功课，也不在洗水果；(5)D不在复习功课，也不在上网。下列说法正确的是：", "o": [["A", "B在复习功课，C在画画"], ["B", "C在洗水果，D在复习功课"], ["C", "A在上网，B在画画"], ["D", "A在复习功课、D在画画"]], "a": ["A"], "an": "根据已知信息，找到突破口。 先找提到频率最高的信息：不洗水果，根据“（1）A不在洗水果，也不在复习功课；（2）B 不在上网，也不在洗水果；（4）C不在复习功课，也不在洗水果”知道A、B、C都不洗水 果，那么一共4个人，洗水果的一定是D。 同理，根据（1)、（4）、（5）得到B在复习功课。 结合条件（3）D洗水果->A在上网。那么C在画画。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0233", "type": "single", "t": "张红、李聪、王敏，一个是江苏人，一个是浙江人，一个是广东人。浙江人 比李聪年龄小，张红和浙江人不同岁，王敏的年龄比广东人大。 根据上述断定，可以推出：", "o": [["A", "张红是江苏人，李聪是浙江人，王敏是广东人"], ["B", "张红是广东人，李聪是江苏人，王敏是浙江人"], ["C", "张红是浙江人，李聪是广东人，王敏是江苏人"], ["D", "张红是浙江人，李聪是江苏人，王敏是广东人"]], "a": ["B"], "an": "本题属于排列组合题。 第一步：找突破口。 本题突破口为信息量最大对象，即浙江人。由浙江人比李聪年龄小，张红和浙江人不同岁， 可能浙江人既不是李聪，也不是张红，而是王敏。 第二步：将信息列于表中，即将题干和第一步的信息抄到一个表里。 地方：浙江人 广东人 ＞ ＞ 人物： 李聪 王敏 第三步：填空，即填上每一个集合的空格 地方：江苏人 浙江人广东人 ＞ ＞ 人物： 李聪 王敏 （张红） 由上表可知，张红是广东人，李聪是江苏人，王敏是浙江人。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0234", "type": "single", "t": "在接受测谎器测验时，只要服用少量某种常用镇静剂，就可使人在说谎时不 被察觉。因为由测谎器测出的心理压力反应可以通过药物抑制，而不会产生显著的副作用。 由此推之，这种药物对降低日常生活中的心理压力也会很有效。 此段话的假设前提是：", "o": [["A", "镇静剂对于治疗心理压力有效"], ["B", "对于心理压力反应的抑制增加了主观的心理压力"], ["C", "由测谎器测出的心理压力与日常生活的心理压力相似"], ["D", "在测谎器测验中说谎的人经常显示出心理压力的迹象"]], "a": ["C"], "an": "第一步：找到论点和论据。 本题论点是镇静剂对降低日常生活中的心理压力也会很有效，论据是由测谎器测出的心理压 力反应可以通过药物抑制，而不会产生显著的副作用。 第二步：判断加强方式。 论点强调日常生活中的心理压力，论据强调测谎器测出的心理压力，所以论点与论据间不存 在明显因果关系，所以需加强论证，在论点和论据间搭桥。 第三步：逐一判断选项的作用。 C即在测谎器测出的心理压力与日常生活的心理压力间搭桥，是答案。 A、B、D均与日常生活中的心理压力无直接关系，属无关选项。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0235", "type": "single", "t": "“并非只有上大学才能成才。”与这一判断等值的是：", "o": [["A", "不上大学就不能成才"], ["B", "不上大学但也能成才"], ["C", "如果上大学，就能成才"], ["D", "并非如果不成才就是没上大学"]], "a": ["B"], "an": "第一步：利用充分必要条件翻译选项。 第一句：－（成才上大学），利用推导关系的矛盾命题继续推导即为（你成才了∧没上大学）。 第二步：逐一翻译选项并判断选项的正确，利用逆否规则。 A不上大学∧不能成才，A错； B不上大学∧成才，B正确； C上大学成才，C错； D－（不成才没上大学），利用推导关系的矛盾命题继续推导即为（不成才∧上大学），D 错。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0236", "type": "single", "t": "在一项实验中，实验对象的一半作为实验组，食用了大量的某种辣椒。而作 为对照组的另一半没有吃这种辣椒。结果，实验组的认知能力比对照组差得多。这一结果是 由于这种辣椒的一种主要成分——维生素E造成的。 以下哪项如果为真，则最有助于证明这种辣椒中某些成分造成这一实验结论：", "o": [["A", "上述结论中所提到的维生素E在所有蔬菜中都有，为了保证营养必须摄入 一定量这种维生素E"], ["B", "实验组中人们所食用的辣椒数量是在政府食品条例规定的安全用量之内的"], ["C", "第二次实验时，只给一组食用大量辣椒作为实验组，而不设不食用辣椒的 对照组"], ["D", "实验前两组实验对象是按认知能力均等划分的"]], "a": ["D"], "an": "第一步：找到论点和论据。 本题论点是维生素E造成认知能力降低，论据是在一项实验中，实验对象的一半作为实验 组，食用了大量的某种辣椒。而作为对照组的另一半没有吃这种辣椒。结果，实验组的认知 能力比对照组差得多。 第二步：逐一判断选项的作用。 A、B都与实验无关，属于无关选项； C中去掉了对照组，实验更加没有说服力，属于削弱论据； D中控制了实验中的变量即人本身的认知能力，使实验更具有说服力。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0237", "type": "single", "t": "调查显示，我国图书阅读率连续6年下降，2005年的国民图书阅读率首次低 于50%，与此同时我国社会大众的学习热情却持续高涨。 下列表述正确的一项是：", "o": [["A", "“没有时间读书”是图书阅读率下降的主要原因。"], ["B", "我国国民网上阅读率从1999年的3.7%增长到2005年的27.8%。"], ["C", "近年来我国图书出版中存在着书价过高、内容乏味、过度炒作等问题。"], ["D", "通过听讲座也能学到许多知识。"]], "a": ["B"], "an": "第一步：抓住语句中的对象及其关系。 语句强调“我国图书阅读率连续6年下降，社会大众的学习热情却持续高涨\"。 第二步：判断整体关系。 语句展现了“我国图书阅读率连续6年下降”和“我国社会大众的学习热情持续高涨”之间的矛 盾，说明必然有其他的学习途径来平抑图书阅读率的下降趋势。 第三步：逐一判断选项的作用。 A项只是解释“图书阅读率下降”的原因，与学习热情持续高涨无关；C项提出的问题是“图书 阅读率下降”的原因之一；D项只是个理论，实际上大众听过讲座没有，根本不知道。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0238", "type": "single", "t": "美国著名的智囊公司—兰德公司花费了20年的时间跟踪世界500家大公司， 发现百年长生不衰的企业具有一个共同的特征，就是树立了超越利润的社会目标，不以利润 为唯一追求目标。 从这段文字可以推出：", "o": [["A", "百年企业都不追求利润"], ["B", "百年企业不追求最大利润"], ["C", "企业价值观中最主要的、最核心的是企业的利润观"], ["D", "树立超越利润最大化的价值观是百年企业的精神文化基础"]], "a": ["D"], "an": "第一步：抓住题干的中心思想。 题干描述了百年企业的特征：树立超越利润的社会目标，不以利润为唯一追求目标。 第二步：根据题干判断正确选项。 题干中说“不以利润为唯一追求目标”并不意味着不追求利润，同样，也不意味着不追求最大 利润，A、B错误。题干中说“树立了超越利润的社会目标”意味着企业价值观中最核心的是 超越利润的社会目标，C错误。由题干中“就是树立了超越利润的社会目标，不以利润为唯 一追求目标。”可知百年企业的特征是树立了超越利润的价值观，D正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0239", "type": "single", "t": "一家飞机发动机制造商开发出了一种新型发动机，安全性能要好于旧型发动 机。在新旧两种型号的发动机同时被销售的第一年，旧型发动机的销量超过了新型发动机， 该制造商于是得出结论认为安全性并非客户的首要考虑。 下面哪项如果正确，会最严重地削弱该制造商的结论：", "o": [["A", "新型发动机和旧型发动机没有特别大的价格差别"], ["B", "新型发动机可以被所有的使用旧型发动机的飞机使用"], ["C", "私人飞机主和航空公司都从这家飞机发动机制造商这里购买发动机"], ["D", "客户认为旧型发动机在安全性方面比新型号好，因为他们对旧型发动机的 安全性了解更多"]], "a": ["D"], "an": "第一步，分析题干，找到论点论据。 论点：“安全性并非客户的首要考虑”。 论据：“新的发动机安全性要好于就的发动机，但是新型发动机在销量上却没有取得领先的 位置”，设问要削弱该制造商的结论。 第二步，逐一分析选项。 A项“新型发动机和旧型发动机没有大的价格差别”，论点中和论据中没有讨论关于价格的问 题，所以这是明显的论题不一致，排除； B项题干中同样没有提及新型发动机可以被旧型发动机使用，所以也是论题不一致，排除； C项题干中没有提及私人飞机主和航空公司，所以同样是根据论题不一致排除； D项“客户认为旧型发动机在安全性方面比新型号好”，客户之所以买旧型发动机，是因为他 们更了解旧型发动机的安全性，直接将论点进行否定。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0240", "type": "single", "t": "有的人即便长时间处于高强度的压力下，也不会感到疲劳，而有的人哪怕干 一点活也会觉得累。这除了体质或习惯不同之外，可能与基因不同有关。英国格拉期哥大学 的研究小组通过对50名慢性疲劳综合症患者基因组的观察，发现这些患者的某些基因与同 年龄、同性别健康人的基因是有差别的。 以下哪项如果为真，最能支持该研究成果应用于慢性疲劳综合症的诊断和治疗：", "o": [["A", "基因鉴别已在一些疾病的诊断中得到应用"], ["B", "科学家们鉴别出了导致慢性疲劳综合症的基因"], ["C", "目前尚无诊断和治疗慢性疲劳综合症的方法"], ["D", "在慢性疲劳综合症患者身上有一种独特的基因"]], "a": ["B"], "an": "第一步：分析题干信息。 本题研究成果是患者的某些基因与同年龄、同性别健康人的基因是有差别的。 第二步：逐一判断选项的作用。 要将研究成果应用于“慢性疲劳综合症的诊断和治疗”就必须要找出导致慢性疲劳综合症的 原因。 A中说基因鉴别已在一些疾病的诊断中得到应用，在一定程度上支持了将研究成果应用于该 疾病； B中说法恰好将研究成果和疾病联系在一起，并给出疾病的原因，加强支持了将研究成果应 用于该疾病； C中说法对将研究成果应用于该疾病几乎无作用，属于无关选项； D中说慢性疲劳综合症患者身上有一种独特的基因，一定程度上也支持了将研究成果应用于 该疾病。 综上，B的内容支持力度最强。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0241", "type": "single", "t": "在人们的印象中，生物燃料是一种可再生的绿色能源。而最新公布的研究成 果颠覆了人们的这一传统印象。研究人员发现，生物燃料可能因其未完全燃烧而转化为乙醛， 进而污染空气，这种污染会导致M国每年有1400人早亡。因此，有M国医疗机构人员认 为现阶段应该暂缓推广生物燃料，限制其使用。 以下哪项如果为真，会对医疗机构人员的观点提出最有力的质疑：", "o": [["A", "现阶段M国科学家已研制出使生物燃料充分燃烧的新技术"], ["B", "目前M国正在使用的其他燃料的污染每年会导致超过3000人早亡"], ["C", "石油等传统燃料已经得到技术改善，由燃烧所带来的污染大幅降低"], ["D", "科学家预计，随着研究工作的推进，5年后新型生物燃料将不会再产生乙醛"]], "a": ["A"], "an": "第一步：找出论点和论据。 论点：现阶段应该暂缓推广生物燃料，限制其使用。 论据：研究人员发现，生物燃料可能因其未完全燃烧而转化为乙醛，进而污染空气，这种污 染会导致M国每年有1400人早亡。 第二步：判断削弱方式。如果要削弱本题论点，则应当从论证的反面出发。 第三步：逐一分析选项。 A选项：直接说明现阶段科学家已经研制出使生物燃料充分燃烧的新技术，削弱了论点； B选项：只说明了正在使用的其他燃料的污染每年会导致超过3000人早亡，其他燃料和生 物燃料并没有什么关系，并没有削弱论点； C选项：只说明了石油等传统燃料已经得到技术改善，石油燃料和生物燃料并没有什么关系， 并没有削弱论点； D选项：5年后新型生物燃料将不会再产生乙醛也不能解决现阶段生物燃料的问题，并没有 削弱论点。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0242", "type": "single", "t": "某机关精简机构，计划减员25％，撤销三个机构，这三个机构的人数正好占 全机关的25％。计划实施后，上述三个机构被撤销，全机关实际减员15％。此过程中，机 关内部成员有所调动，但全机关只有减员，没有增员。 如果上述断定为真，以下肯定为真的是： ①上述计划实施后，有的机构调入新成员。 ②上述计划实施后，没有一个机构所调入的新的成员的总数，越过机关原总人数的10％ ③上述计划实施后，被撤销机构中的留任人员，不超过机关原总人数的10％", "o": [["A", "只有①"], ["B", "只有②"], ["C", "只有③"], ["D", "只有①和③"]], "a": ["A"], "an": "第一步：抓住题干主要信息。 第一句计划减员25%，撤销的三个机构的人数正好占全机关的25％；第二句三个机构被撤 销，全机关实际减员15％；第三句机关内部成员有所调动，但全机关只有减员，没有增员。 第二步：分析题干信息，并结合选项得出答案。 ①一定为真。由题干“被撤消的三个机构的人数占全机关的25％，实际减员15％”可知，被 撤消的三个机构中，至少有占全机关人数10％的成员调入被保留机构。 ②不一定为真。因为题干所说的人员调动，不一定局限于被撤消机构的人员调入被保留机构， 也可能包括被保留机构人员的互相调动。 ③不一定为真。因为完全有可能被撤消的三个机构的人员全部留任，而被保留机构的成员被 减员。 综上，只有①一定为真。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0243", "type": "single", "t": "某市某繁华街道“十字路口可见度改善工程”竣工使用后，有关它对交通事故 预防效果的两份调查报告出台了。 第一份报告的结论是：此项工程改善了此十字路口的能见度，从而大大减少了那里的交通事 故的发生。 第二份报告的结论是：此项工程完工后，每周交通事故增加了而不是减少了，因此，此项工 程增加了事故发生的几率。 以下对于评价第二份报告的论述最有用的选项是：", "o": [["A", "工程完工后，在十字路口处值勤的交警员平均值勤时间是多少"], ["B", "工程竣工使用后，作为该市最为繁忙的十字路口之一，车流量的改变情况如 何"], ["C", "邻近城镇在改善危险路段可见度方面采取了什么样的措施"], ["D", "工程完工后，该十字路口是否会不便于行人通行"]], "a": ["B"], "an": "第一步：找到论点和论据。 第二份报告中的论点为，此项工程增加了事故发生的几率；论据为，每周交通事故增加。 第二步：判断加强方式。 论点强调事故发生的几率，论据强调交通事故的次数，论点和论据强调的对象不同，需在两 者间搭桥，加强论证。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0244", "type": "single", "t": "阅读材料完成以下各题： 有 8 个候选人竞选学生会主席（1 号、2 号、3 号、4 号、5 号、6 号、7 号、8 号）。竞选 满足以下条件： 如果 3 号的票数多于 4 号，并且 5 号的票数多于 8 号，那么 1 号当选； 如果 4 号的票数多于 3 号，或者 6 号的票数多于 7 号，那么 2 号当选； 如果 8 号的票数多于 5 号，那么 6 号当选。 如果上述陈述为真，并且事实上2号当选，则以下陈述必定为真的是：", "o": [["A", "8 号的票数不比 5 号多"], ["B", "6 号的票数比 7 号多"], ["C", "7 号的票数比 6 号多"], ["D", "4 号的票数不比 3 号多"]], "a": ["A"], "an": "第一步：翻译题干，利用充分必要条件。 第一个条件：（3号的票数＞4号的票数）∧（5号的票数＞8号的票数）1号当选，第二个 条件：（4号的票数＞3号的票数）∨（6号的票数＞7号的票数）2号当选，第三个条件： 8号的票数＞5号的票数6号当选。 57题题干中条件为：2号当选。 第二步：逐一翻译代入选项并判断选项的正确。 A项假设该陈述为假，则有：8号的票数＞5号的票数，由第一步中的第三个条件可知，此 时应该为6号当选，这与58题题干中“2号当选”不符，因此假设错误，从而A项陈述应该 正确； 由第一步中的第二个条件：（4号的票数＞3号的票数）∨（6号的票数＞7号的票数）2 号当选，又知2号当选，此时属于对关系式的肯后件，无法推出绝对表达的结论。既无法判 断4号的票数和3号的票数的大小，也无法判断6号的票数和7号的票数的大小，因此B、 C和D中的陈述都不能判断正确与否，均错误。 故正确答案为 A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0245", "type": "single", "t": "一项调查结果显示，即使普通人的后代与成功人士的后代同样的努力，其成 功的几率也仅为后者的一半。由此可以得出结论，成功与否主要取决于遗传因素。下列最能 反驳上述结论的是：", "o": [["A", "成功人士的后代往往比普通人更加努力"], ["B", "许多成功人士的后代事业上毫无建树"], ["C", "很多所谓的成功人士出身于普通家庭"], ["D", "成功人士的后代较普通人后代有更好的成长环境"]], "a": ["D"], "an": "第一步：首先分析题干，找到论点论据。 论点是“成功与否主要取决于遗传因素”，论据是“即使普通人的后代与成功人士的后代同样 的努力，其成功的几率也仅为后者的一半”。 第二步，逐一分析选项。 A项，成功人士的后代往往比普通人更加努力，而原题中的假设是“普通人的后代与成功人 士的后代同样的努力”的情况，因此，A项属于主题不一致，排除； B项，许多成功人士的后代事业上毫无建树，题干中讨论的是成功的几率，并没有否认这种 情况，无法削弱，； C项，很多所谓的成功人士出身于普通家庭，同样题干也没有否认这种情况的存在； D项，成功人士的后代较普通人后代有更好的成长环境，指出了成功与否并非是遗传因素， 是他因削弱。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0246", "type": "single", "t": "一类疫苗是国家根据目前国内疾病流行情况以及我国儿童的普遍身体状况规 定的必须接种的疫苗，接种费用由政府支付，而其他不属于一类疫苗并且需要家长自费的疫 苗属于二类疫苗。由此，家长们普遍认为，二类疫苗只是预防一类疫苗之外的疾病的。 以下哪项最能反驳家长们的看法：", "o": [["A", "二类疫苗中的五联疫苗可以预防一类疫苗已覆盖的一些疾病，因此可减少 接种次数"], ["B", "一类疫苗预防的是可能给孩子带来更大伤害的疾病，二类疫苗则不一定"], ["C", "同一种疫苗在不同的国家和地区可能属于不同类型的疫苗"], ["D", "选择不接种二类疫苗除了经济原因，还有对其安全性的考虑"]], "a": ["A"], "an": "第一步：找到论点和论据。 论点：家长的看法为“二类疫苗只是预防一类疫苗之外的疫病”——二类疫苗预防的疾病与一 类疫苗预防的疾病没有交集。 论据：一类疫苗必须接种，政府支付；二类疫苗家长自费接种。 第二步：逐一分析选项。 A项通过实例证明“二类疫苗中的某种疫苗可以预防一类疫苗已覆盖的一些疾病”，即二类疫 苗预防的疾病与一类疫苗预防的疾病有交集，直接否定了家长的看法，为正确选项； B项中提到的疫苗的危害性以及D项中经济原因与家长看法没有联系，属于无关项，排除； C项是可能选项，削弱力度较小。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0247", "type": "single", "t": "一位退休教师说：“老师最喜欢的是成绩最好的学生，我也是这样。现在回顾 30多年的教学生涯才发现：一个学生成绩好不等于他将来的事业很成功。在我所教过的学 生中，有的人读书时成绩很好，有的人后来事业很成功。但是却没有一个当年成绩最好的学 生后来在事业上很成功。” 如果该老师说的话为真，以下哪项也必然为真：", "o": [["A", "该老师当年最喜欢的学生后来在事业上都不是很成功"], ["B", "后来在事业上很成功的学生中，有的是该老师当年最不喜欢的"], ["C", "该老师的学生中，当年成绩最差的后来在事业上也都不成功"], ["D", "凡是老师最喜欢的学生，毕业后在事业上都不会很成功"]], "a": ["A"], "an": "第一步：抓住题干的主要信息。 题干叙述了老师对学生的喜好，以及成绩好的学生和成绩不好的学生与他们的事业成功与否 的关系。 第二步：逐一判断选项的作用。 A项，由题干中“老师最喜欢的学生成绩最好”和“没有一个当年成绩最好的学生后来在事业上 很成功”可以推出老师最喜欢的学生没有一个在事业上成功，即“该老师当年最喜欢的学生后 来在事业上都不是很成功”，A正确； B项，题干中没有涉及到老师最不喜欢的学生，B是无关项，B错误； C项，成绩最差的学生和其在事业上成功与否的关系在题干中并未涉及，C错误； D项，“凡是……都……”过于绝对。题干只是从该退休教师的情况出发，这并不能推及到所有 老师，D错误。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0248", "type": "single", "t": "有经验的司机完全有能力并习惯以120公里的时速在高速公路上行驶，为了 迅速提高道路的使用效率，某条高速公路的最高时速限制由原来100公里转为120公里。 以下各项如果为真，最能质疑上述主张的是：", "o": [["A", "统计表明行车速度达120公里时事故发生率明显增加，反而影响高速公路 的使用效率。"], ["B", "限速每小时120公里不能迅速提高公路使用效率，因为高速驾车对技术的 要求很高。"], ["C", "时速达120公里时，汽车的油耗量将明显增加，考虑到油价，大多数司机 还是放松油门。"], ["D", "虽然时速限制放宽到120公里，但在不少路段上，很多司机对此速度有安 全之虞。"]], "a": ["A"], "an": "第一步：找出论点和论据。论点：为了迅速提高道路的使用效率，某条高速公路的 最高时速限制由原来100公里转为120公里。论据：有经验的司机完全有能力并习惯以120 公里的时速在高速公路上行驶。第二步：逐一判断选项的作用。A项中限速转为120公里会 明显增加事故，影响高速公路使用效率，即降低使用效率，直接削弱论点；B项说的是不能 迅速提高使用效率，但并不否定限速转为120公里以后有提高使用效率的可能性，削弱论 点；C项说的是大多数司机考虑到油价，通常不会开到时速120公里，说明时速120公里 不一定能够提高使用效率，同样是削弱论点；D项说的是司机对车速的顾虑，没有说明是否 影响道路使用效率，属无关选项。A、B、C三项都削弱论点，但B、C两项只说明不能提高 公路使用效率，而A项强调的是会降低使用效率，削弱力度比B、C两项强。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0249", "type": "single", "t": "“断食法”在日本、台湾等亚洲一些地区比较盛行，这种方法是一日三餐以果 汁、菜汤清水等低卡路里饮食取代固体食物，为期三至十天不等，以求达到排毒、燃脂和瘦 身等效果。 如果以下各项为真，哪项最不能削弱上述观点：", "o": [["A", "人体每天摄取热量过低时，可能会出现血糖或血压过低的状况。"], ["B", "肥胖者身体摄取热量太低，会加速燃烧脂肪，肾功能会发生积极变化。"], ["C", "食用蔬菜可以促进肠道蠕动 ，但其热量过低，过度食用会干扰新陈代谢。"], ["D", "低卡路里饮食会导致体内毒素因缺乏营养而丧失活性但同时因新陈代谢早 扰乱而存在致胖风险。"]], "a": ["B"], "an": "第一步：找到论点和论据。论点：断食法可以达到排毒、燃脂以及瘦身等效果。没 有论据。第二步：判断削弱方式。本题只有论点，没有论据，所以需削弱论点。第三步：逐 一判断选项的作用。A、C、D三项中指出断食法会带来一些坏处，削弱断食法的积极作用； B项描述的是断食法带来的积极作用，具有加强作用，因此最不能削弱。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0250", "type": "single", "t": "疾病预防控制中心的研究报告认为，烟草使用是首要的可预防死因。每年全 世界有500万人死于烟草相关疾病，其中每年死于二手烟的人数也高达60万，四分之一以 上是儿童。 以下各项如果为真，哪项最不能质疑上述观点：", "o": [["A", "每年全世界有500多万人死于因运动不足而引发的疾病"], ["B", "每年全世界有500多万人死于因生活不规律而引发的疾病"], ["C", "每年全世界不低于1405万人的可预防死因并非烟草相关疾病"], ["D", "每年全世界因心理调试不当引发的疾病成为人类首要的可预防死因"]], "a": ["C"], "an": "第一步：找到论点和论据。论点：烟草使用是首要的可预防死因，论据：每年全世 界有500万人死于烟草相关疾病，其中每年死于二手烟的人数也高达60万，四分之一以上 是儿童。第二步：逐一判断选项的作用。A、B两项分别说“死于运动不足”和“死于生活不规 律”的人数是500多万人，比题干中死于烟草相关的人数多；C项不能起到削弱作用，因为 可预防死因有很多种，如果种类很多，但是数量很少，加起来也能达到1405万人；D项则 直接说心理调适不当是首要可预防死因，在论点和论据间不搭桥，起削弱作用。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0251", "type": "single", "t": "小张对小李说：“红色象征着热情，我一看到红色就热血沸腾。”小李于是书 写了红色两个字，对小张说：“你觉得热血沸腾吗？” 以下句子的逻辑表述方法与所给题干一致的是（ ）。", "o": [["A", "小李对小张说：“海水咸吗？要不，你去尝尝那两个字，看看有咸味不？”"], ["B", "小李对小张说：“你的朋友真是个好人啊，你看，长得就非常漂亮”"], ["C", "小李对小张说：“一年四季都有花盛开，花就像美女一样，人人爱看”"], ["D", "小李对小张说：“这个人真麻烦，一点麻烦都解决不了”"]], "a": ["A"], "an": "题干中的表述方式是：小张说的红色是指实物的颜色，指的是视觉上的感受，而小 李理解为是“红色”这两个字，两个人所说的含义不同，这种表述方式会使人产生误解 分析个选项： A项中的咸有两个含义，一个是指味觉上的咸，而另一个是指“咸”这个字本身 B项没有涉及同一个词的不同含义，与题干表述方法不同，排除； C项只是运用了比喻手法，将花比作女人，并不是表述了花的两个不同含义，与题干的表述 方式不同，排除； D项虽然表述了麻烦这个词的不同含义，但是并没有涉及人体感官，这样的表述方式也不会 产生误解，与题干表述方式不同，排除。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0252", "type": "single", "t": "技术革命究竟会不会加重失业，这是长期以来困扰人们的一个问题，从一些 统计数字中人们发现了有趣的现象，尽管美国过去多年来在计算机技术和其他方面投入巨 资，但它目前的失业率（约为5.5%）并不比20世纪60年代初期的失业率高，而在西欧失 业率则为11%，那里对计算机的投资一直少于美国。 从上述文字中可以合乎逻辑地推出：", "o": [["A", "信息技术的发展前景十分广阔"], ["B", "信息技术需要更快地发展"], ["C", "信息技术不会导致失业"], ["D", "信息技术的发展不会加重失业"]], "a": ["D"], "an": "第一步：抓住题干主要信息。 第一点说明技术革命究竟会不会加重失业是长期以来困扰人们的一个问题，第二点说明美国 过去多年来在计算机技术和其他方面投入巨资，但它目前的失业率（约为5.5%）并不比20 世纪60年代初期的失业率高，第三点说明在西欧失业率则为11%，那里对计算机的投资一 直少于美国。 第二步：分析题干信息，并结合选项得出答案。 A项：信息技术的发展前景广阔，发展前景题干并未涉及，因此A中说法无法推出； B项：信息技术需要更快地发展，需要更快发展题干并未涉及，因此B中说法无法推出； C项：信息技术不会导致失业，说法过于绝对，导致失业题干并未涉及，因此C中说法无法 推出； D项：由第一步中第一点知题干信息围绕技术革命和加重失业，再从第二点和第三点的对比 可以得出，信息技术的发展不会加重失业，因此D中说法可以推出。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0253", "type": "single", "t": "某个国家在2008年的控制非法药物进入的计划失败了。尽管对非法药物的需 求呈下降趋势，但是，如果这个计划没有失败，多数非法药物在2008年的批发价格不会急 剧下降。 以上结论依赖于哪个假设：", "o": [["A", "2008年，非法药物的供给大幅下降"], ["B", "该国本国非法药物产量，比非法进入该国的非法药物增加更多"], ["C", "2008年非法药物需求的下降不是其批发价格下降的唯一原因"], ["D", "2008年少数几种非法药物的批发价格大幅上升了"]], "a": ["C"], "an": "第一步：找到论点和论据。 论点是某个国家在2008年的控制非法药物进入的计划失败了。论据是如果这个计划没有失 败，多数非法药物在2008年的批发价格不会急剧下降。 第二步：判断加强方式。 论点和论据之间不存在明显的因果关系，要是论点成立，需要加强论证。 第三步：逐一判断选项的作用。 A项说供给下降，题干说需求下降，无法判断需求和供给的下降幅度，无法推断价格是不是 下降，因此也就无法证明计划是否失败； B项说本国非法药物产量比进入该国的多，题干说需求下降，无法判断需求下降的幅度和供 给的增加的幅度，无法推断价格是不是下降，因此也就无法证明计划是否失败； C项根据题干可知，非法药物的需求呈下降趋势，那么价格应该下降，然而价格却没有急剧 下降，这说明一定有某些其他原因导致价格没有急剧下降，进而导致该计划失败，因此C 项符合推断； D项“少数”显然无法对大局产生明显影响，因此无法证明该计划失败。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0254", "type": "single", "t": "某领导在一次工作会议上说：“我们首先要有‘亲民’意识。有了‘亲民’意识，我 们就能站在老百姓的角度来考虑问题，就能负责地为老百姓解决实际问题。如果我们及时帮 助群众解决困难，那么干群关系就拉近了。” 从领导的这句话，我们可以推出：", "o": [["A", "如果有“亲民”意识，那么干群关系就拉近了。其结果必然是，我们能及时帮 助群众解决困难"], ["B", "如果有“亲民”意识，那么干群关系就拉近了。但是，其前提是，我们能及时 帮助群众解决困难"], ["C", "只有具备“亲民”意识，我们才能站在老百姓的角度来考虑问题，才能负责地 为百姓解决实际问题。其结果必然是，我们密切了干群关系"], ["D", "如果我们能负责地为老百姓解决实际问题，我们就具备“亲民”意识。但是， 其前提是，我们必须重视干群关系"]], "a": ["B"], "an": "第一步：翻译题干。利用充分必要条件。 根据“有了‘亲民’意识，我们就能站在老百姓的角度来考虑问题，就能负责地为老百姓解决实 际问题”得到关系：有亲民意识站在老百姓的角度考虑问题∧负责地为老百姓解决问题。 根据“如果我们及时帮助群众解决困难，那么干群关系就拉近了”得到关系：负责地为老百姓 解决问题干群关系拉近。 利用联言命题规则得到站在老百姓的角度考虑问题∧负责地为老百姓解决问题负责地为老 百姓解决问题。 将以上三个推导关系连起来即为：有亲民意识站在老百姓的角度考虑问题∧负责地为老百姓 解决问题负责地为老百姓解决问题干群关系拉近。 第二步：逐一翻译选项并判断选项的正确。利用逆否规则。 A项：有亲民意识干群关系拉近负责地为老百姓解决问题，“干群关系拉近”属肯后件，无法 推出绝对表达的结论，A错； B项：有亲民意识负责地为老百姓解决问题干群关系拉近，是题干推导关系，B正确； C项：站在老百姓的角度考虑问题∧负责地为老百姓解决问题有亲民意识干群关系拉近，“站 在老百姓的角度考虑问题∧负责地为老百姓解决问题”属肯后件，无法推出绝对表达的结论， C错； D项：负责地为老百姓解决问题干群关系拉近有亲民意识，“干群关系拉近”属肯后件，无法 推出绝对表达的结论，D错。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0255", "type": "single", "t": "调查发现，内向的人不太敢在公共场合发表自己的意见，他们即使有好的建 议，也往往藏在心里，或者只和自己很熟悉的朋友交流。所以，一个好的领导，除了在大会 上听取各种意见之外，还需要：", "o": [["A", "自己多干实事"], ["B", "自己多了解情况"], ["C", "多关心内向的员工"], ["D", "和内向的人交朋友"]], "a": ["D"], "an": "第一步：抓住每句话中的对象及主要内容。 第一句说明内向的人发表意见的方式：藏在心里或和朋友交流，第二句说明好的领导怎么全 面的听取意见。 第二步：判断整体关系。 领导要全面听取意见，两句间是包含关系，领导要听的意见也包括了内向的人发表的意见。 第三步：逐一判断选项的作用。 A、B都是从领导的自身角度进行改善，和内向的人无关； C多关心内向的人，也不能保证就一定能听到他们的意见，因为他们发表意见的方式只有两 种就是，藏在心里或和朋友交流； D强调领导和内向的人交朋友，内向的人便可能与之交流。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0256", "type": "single", "t": "根据最近一项调查显示，近年来在某市外资企业高收入(指合法收入为年薪12 万元以上)人群中，外国留学归来的人(简称“海归派”)数占60％以上，这充分说明国内大学 毕业的人(简称“本土派”)在该市外资企业中获得高工资极为困难。 以下哪项，如果为真，最能加强上述结论：", "o": [["A", "在该市外资企业中，“本土派”人数占40％"], ["B", "在该市外资企业中，“本土派”人数超过50％"], ["C", "在该市就业的人群中，“海归派”仅为“本土派”的10％"], ["D", "在该市就业的人群中，“海归派”与“本土派”的人数比例约为6:4"]], "a": ["B"], "an": "第一步：找到论点和论据。 本题论点是国内大学毕业的人在该市外资企业中获得高工资极为困难。论据是高收入人群 中，外国留学归来的人数占60％以上。 第二步：判断加强方式。 论点强调本土派获高薪极为困难，论据强调海归派高收入占全市外资企业总人数60％。所 以论点和论据间不存在明显因果关系，需加强论证。 第三步：逐一判断选项的作用。 选项A中，本土派人数占40％，而高薪也占40％（海归派占60％），二者比例相当，因 此并不能说本土派获高薪困难，A错误； 选项B中，本土派人数超过50％，而获得高薪的却不超过40％（海归派占60％），充分 证明本土派获高薪人数占外资总人数比例不高，B正确； 选项C、D中“该市就业人群”与题干中“外资就业人群”不符，二者没有可比性，C、D错误。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0257", "type": "single", "t": "想从事媒体工作的学生都报考新闻与传播专业。李金报考了新闻与传播专业， 他一定想从事媒体工作。 下述哪项为真，最能支持上述论断：", "o": [["A", "所有报考新闻与传播专业的学生都想从事媒体工作"], ["B", "有些媒体的记者是大学新闻与传播专业的毕业生"], ["C", "想从事媒体工作的学生有些报考了新闻与传播专业"], ["D", "只有新闻与传播专业毕业的学生，才有资格从事媒体工作"]], "a": ["A"], "an": "第一步：分析题干，找到论点和论据。 论点：李金一定想从事媒体工作。 论据：李金报考了新闻与传播专业。 第二步：逐一分析选项。 A项：可翻译为：报考新闻与传播专业→想从事媒体工作，在专业和工作之间搭桥，加强论 证，支持题干论点，当选； B项：提及的是媒体记者，而不是想从事媒体工作的学生，与题干主体不同，排除； C项：该项说的是有些人的情况,不是必然性判断，无法推出绝对表达的结论，排除； D项：题干强调的是想不想从事媒体工作，而D项说的是有没有资格从事媒体工作，与论 点无关，属于无关选项，排除。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0258", "type": "single", "t": "某超市举行店庆促销活动。其中，具体规定如下： 只有在店庆当天的一次消费中购买甲类商品和乙类商品至少各一样，才能获得小熊赠品一 只。 只有VIP会员并且当天一次性消费至少一件甲类商品或乙类商品，当次所购全部商品才能获 得八折优惠。 如果购买乙类商品的件数在五件以上，则可以申请成为VIP会员。 假如店庆当天张丽仅在该超市消费一次，但没有购买乙类商品，则以下哪项一定为真？（ ）", "o": [["A", "张丽所购商品不可能得到八折优惠"], ["B", "张丽是VIP会员并购买了甲类商品"], ["C", "张丽不能获得小熊赠品"], ["D", "张丽有可能获得小熊赠品"]], "a": ["C"], "an": "第一步：分析题干的逻辑关系。 ①小熊→店庆当天且甲且乙 ②八折→VIP且（甲或乙） ③乙（＞5）→VIP ④消费一次且-乙 第二步：逐一分析选项。 A选项，-乙并不代表着是否买了甲，也不知道是不是VIP，因此不构成对②的否后，所以不 清楚是否享受到了八折优惠，排除； B选项，因为根据③，一次性购买大于5件乙类商品才可能申请，而现在张丽没有购买乙类 商品，属于否前，得不到确定性结论，排除； C选项，因为张丽没有购买乙类商品，因此对①形成了否后，可以得到否前的结论，即-小 熊，正确； D选项，根据对上个选项的分析我们可以得知张丽是没有得到小熊赠品的，排除。 故正确答案为C选项。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0259", "type": "single", "t": "传统观点认为鸡蛋黄胆固醇含量高是直接造成高血压，动脉粥样硬化、冠心 病及脑中风的罪魁祸首。所以，很多中老年人不敢吃鸡蛋黄，最近，营养学家组织了一个专 门研究鸡蛋黄与胆固醇之间关系的小组，对116名50至65岁男性进行了为期半年的实验。 假定以下是几种实验的结果，哪种将最能削弱传统观点：", "o": [["A", "将被试者分为两组，分别食用蛋黄和蛋清，结果发现两组被试者体内胆固 醇含量没有明显差异"], ["B", "将被试者分为两组，分别食用蛋黄和蛋清，结果发现食用蛋清的一组被试者 体内胆固醇含量明显增加"], ["C", "将被试者分为两组，一组食用蛋黄，一组不食用蛋黄，半年后发现没有食 用蛋黄的被试者体内胆固醇含量有所减少"], ["D", "将被试者分为两组，一组食用蛋黄，一组不食用蛋黄，半年后被试者体内 的胆固醇含量均没有发生变化"]], "a": ["D"], "an": "第一步：找到论点和论据。论点：鸡蛋黄胆固醇含量高是直接造成高血压、动脉粥 样硬化、冠心病及脑中风的罪魁祸首。没有论据。第二步：逐一判断选项的作用。本题要研 究的是鸡蛋黄与胆固醇之间的关系，属于类比论证题型，即保证其他条件相同，唯一不同的 是食用鸡蛋黄和不食用鸡蛋黄，实验结果是前一组被试者的胆固醇含量和后一组被试者的胆 固醇含量一样多，说明胆固醇不起作用，从而有力地削弱论点。A、B两项对比的是蛋黄和 蛋清，而蛋清跟论点中的胆固醇没有关系，因此实验结果不能说明蛋黄和胆固醇之间的关系， A、B两项属无关选项；C项的两组对象分类符合实验要求，但实验结果说明鸡蛋黄跟胆固 醇含量高有关，加强了论点。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0260", "type": "single", "t": "部分英国医生宣称，他们开始对苹果iPad用户类似重复性劳损的病症进行 治疗，这类被戏称为“i伤害”的病症，主要表现为用户的手和点击、触摸屏幕的手指出现各 种各样的病痛。专家推测：大多数iPad用户左手拿着平板电脑以保持其稳定，右手食指点 击屏幕发送邮件或生成文件。这使得他们有患上诸如重复性劳损、腕管综合症以及其他肌腱 伤害的风险。 如果以下各项为真，最能支持上述专家推测的是：", "o": [["A", "使用iPad的用户患上此类病症的概率比较高"], ["B", "使用其他品牌平板电脑的用户出现了类似病症"], ["C", "未普及iPad的地区此类病症出现的比率极少"], ["D", "使用台式机的用户患上此类病症的概率比较低"]], "a": ["A"], "an": "第一步：找出论点和论据。论点：大多数iPad用户因为iPad使用习惯的问题，有 患上诸如重复性劳损、腕管综合症以及其他肌腱伤害的风险。第二步：逐一判断选项。A项 说使用iPad的用户患上此类病症的概率比较高，是对论点的直接加强；B项说其他品牌平 板电脑的用户也出现类似病症，说明不是只有iPad用户才会出现这类问题，否定专家的推 测；而C项，“未普及iPad的地区此类病症出现的比率极少”，未普及iPad的地区到底有多 少人用iPad不知道，多少人得病不知道，得病的这部分人是不是这些用iPad的人也不知道， 因此无法对题干进行支持；D项能一定程度支持，但比A项力度弱。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0261", "type": "single", "t": "一军用仓库被窃，公安部门已掌握如下线索：①甲、乙、丙三人至少有一个 是窃贼；②如甲是窃贼，则乙一定是同案犯；③盗窃发生时，乙正在影剧院看电影。 由此可以推出：", "o": [["A", "甲、乙、丙都是窃贼"], ["B", "甲和乙都是窃贼"], ["C", "丙是窃贼"], ["D", "甲是窃贼"]], "a": ["C"], "an": "第一步：翻译题干，利用充分必要条件。 线索①：甲、乙、丙三人至少有一个是窃贼；②甲是窃贼乙是窃贼。③盗窃发生时乙正在影 剧院看电影可知，乙不是窃贼，是事实信息。 第二步：由题干事实信息推导得出正确答案。 乙不是窃贼。由线索②的逆否命题可知：﹣乙是窃贼﹣甲是窃贼，故甲、乙都不是窃贼。由 线索①知丙是窃贼。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0262", "type": "single", "t": "历史的进程是后浪推前浪，没有人永远站在风口浪尖上，所以会有拿破仑兵 败滑铁卢和许多著名的改革人物从历史的舞台上渐渐沉寂。 从上文内容不能推出的结论是：", "o": [["A", "没有人能够永远站在风口浪尖上是很正常的。"], ["B", "许多著名改革人物渐渐沉寂也是正常的。"], ["C", "历史的进程会淘汰拿破仑一样的人物。"], ["D", "许多著名人物在改革的舞台上消失属于极不正常的情况。"]], "a": ["D"], "an": "第一步：抓住题干主要信息。 第一句：历史的进程是后浪推前浪； 第二句：没有人永远站在风口浪尖上； 第三句：许多著名的改革人物从历史的舞台上渐渐沉寂。 第二步：分析题干信息，结合选项得出答案。 A项可从第一句话推出； B项可从第三句话推出； 从第一和第三句话可知，历史的进程是后浪推前浪，因此许多改革人物再著名，终究也无法 摆脱被历史淘汰的命运，他们从历史的舞台上消失也是正常的情况，故C项正确，D项错误。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0263", "type": "single", "t": "任何一本所有批评家赞许的作品都被每个文学工作者所读过，并且任何一个 读过点什么都将谈论到它，任一个批评家都将赞许那些推崇批评家本人的人的任一作品，张 因铣推崇每位批评家，由此可见：", "o": [["A", "张因铣写了很多作品"], ["B", "所有文学工作者都读过张因铣的作品"], ["C", "张因铣作品被所有批评家读过"], ["D", "张因铣所有作品都被所有的文学工作者谈论"]], "a": ["B"], "an": "第一步：翻译题干的逻辑。 题干前半部分：所有批评家赞许的作品该作品被每个文学工作者所读过；某作品被读过有作 品被谈论。 题干后半部分：某人推崇某个批评家该批评家赞许该人的作品，也就是说某人推崇所有批评 家所有批评家赞许该人的作品。 将以上三个推导连起来即为：某人推崇所有批评家所有批评家赞许该人的作品该作品被每个 文学工作者所读过有作品被谈论。 第二步：从事实信息开始推导，并得到结论。 题中未提及张因铣的作品数量，A错误； 题干中“张因铣推崇每位批评家”是事实信息，由此开始推导。将“张因铣推崇每位批评家”代 入到题干的逻辑关系中可以得到：张因铣推崇每位批评家所有批评家都赞许张因铣的任一作 品所有文学工作者都读过张因铣的所有作品有作品被谈论，B正确； 题干指出批评家只赞许一个人的作品，但题中并未提及批评家是否读过，C错误； 有作品被谈论，但不见得是所有作品都被谈论，D错误。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0264", "type": "single", "t": "刑警王某从某个杀人现场勘察完毕后回到局里。门卫老张问他结果怎么样， 王某说知道了杀人犯到过现场。老张知道王刑警在调侃他，因为根本无须王某告诉，他就知 道：如果某人是杀人犯，那么案发时他一定在现场。 据此回答，我们可以推知：", "o": [["A", "如果张三案发时在现场，那么他就是杀人犯"], ["B", "如果李四不是杀人犯，那么案发时他就不在现场"], ["C", "如果王五案发时不在现场，那么他就不是杀人犯"], ["D", "即使许六不在案发现场，也有可能是杀人犯"]], "a": ["C"], "an": "第一步：翻译题干。 题干中老张的意思为，杀人犯到过犯罪现场。 第二步：逐一判断选项。 A项意思为，到过犯罪现场杀人犯；肯定题干命题后件，由逆否规则可知无法得出结论。B 项意思为，－杀人犯﹣到过犯罪现场；否定题干命题前件，由逆否规则可知无法得出结论。 C项意思为，﹣到过犯罪现场－杀人犯，为题干命题的逆否命题，因此正确。D项意思为， ﹣到过犯罪现场－杀人犯，这个命题为假命题；与题干意思相悖。因此正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0265", "type": "single", "t": "小张一定想报考某中学。因为所有想报考某中学的小学生都参加了该中学举 办的冬令营，而小张参加了该中学举办的冬令营。下列哪项判断能够最好地加强上述论证：", "o": [["A", "所有想参加该中学举办的冬令营的学生都想报考该中学"], ["B", "有的不想报考该中学的小学生也参加了该中学举办的冬令营"], ["C", "小张在小学6年学习中成绩一直非常优秀"], ["D", "小张参加该中学举办的冬令营是因为他父母强烈建议他参加"]], "a": ["A"], "an": "第一步：找到论点和论据。 本题论点是小张一定想报考某中学，论据是想报考某中学参加冬令营，小张参加了该中学举 办的冬令营。 第二步：判断加强方式。 论点强调报考某中学，论据强调冬令营，所以论点与论据间不存在明显因果关系，需加强论 证，在论点和论据间搭桥。 第三步：逐一判断选项的作用。 A即在报考中学和冬令营间搭桥，参加冬令营想报考某中学 B认为参加冬令营的也有可能不想报考某中学，是削弱选项，B错； C说小张参加冬令营的原因； D说小张成绩优秀，属无关选项。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0266", "type": "single", "t": "美国著名的经济学家阿瑟·奥肯发现了周期波动中经济增长率和失业率之间的 经验关系，即当实际GDP增长相对于潜在GDP增长（美国一般将之定义为3%）下降2% 时，失业率上升大约1%；这条经验法则以其发现者为名，称为奥肯定律。潜在GDP这个 概念是奥肯首先提出的，它是指在保持价格相对稳定情况下，一国经济所产生的最大产值。 潜在GDP也称充分就业GDP。 下列和上述的分析方法相同的是：", "o": [["A", "青蛙的双腿对水面的蹬力很大，水给青蛙的反作用力也很大，人们从中受 到启示，模仿青蛙发明了蛙泳的游泳方式"], ["B", "齿轮的转速和齿数成反比，即齿轮的齿数越多，齿轮转速越慢"], ["C", "蝙蝠在夜间能够快速飞行，可以躲避障碍物，这是因为它的耳朵能听到超 声波遇到障碍物时产生的回声。如果把蝙蝠的耳朵堵上，它就会撞到障碍物；如果把蝙蝠的 眼睛蒙上，它却不会撞到障碍物"], ["D", "天上有了扫帚云，不出三天大雨淋"]], "a": ["D"], "an": "第一步：分析题干。 奥肯定律是指周期波动中经济增长率和失业率之间的经验关系。 第二步：逐一分析选项。 A项中“模仿青蛙发明了蛙泳的游泳方式”、B项“齿轮的转速和齿数成反比”、C项“蝙蝠在夜 间能够快速飞行”都属于科学实验而不是经验推断； D项也是从日常经验中获取的，符合题干逻辑。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0267", "type": "single", "t": "对过去十年世界男女马拉松最佳成绩分析显示：女子纪录的进步7倍于男子 纪录，然而，最快的男子马拉松选手仍比最快的女子马拉松选手快许多。 由此可以推知：", "o": [["A", "对男子马拉松选手的训练水平尚需提高"], ["B", "女子马拉松选手的发展潜力比男子马拉松选手大"], ["C", "当前女子马拉松的纪录比十年前男子马拉松的纪录快"], ["D", "十年前女子马拉松的纪录是男子的7倍多"]], "a": ["B"], "an": "第一步：抓住题干对象及其关系。 前部分强调女子马拉松成绩进步纪录是男子纪录的7倍，后部分说最快的男子马拉松选手比 最快的女子马拉松选手快许多。说明女子马拉松选手的发展潜力比男子马拉松选手大。 第二步：逐一判断选项。 A项不符合推断，题干说女子进步纪录较男子快，并不能说明男子马拉松选手的训练水平尚 需提高； B项符合第一步推断； 题干统计的数据是过去时间年的平均水平，而不是指当前的，也不是指十年前的，因此C、 D项表述不符合题干推断。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0268", "type": "single", "t": "调查表明，在当今85~90岁的人中，极少数人是左撇子。社会学家研究认为， 这是因为在80年前如果小孩用左手吃饭或写字就要挨打，所以被迫用右手。 这项调查能够加强的论断是：", "o": [["A", "用手习惯是遗传优势与社会压力的产物"], ["B", "在过去，人们用左手还是右手存在不同的社会态度"], ["C", "因为用右手的人可以长寿，所以父母逼迫用左手的小孩改变习惯"], ["D", "使用右手更聪明，在科学上是站不住脚的"]], "a": ["A"], "an": "第一步：抓住题干主要信息。 第一句说明调查表明85~90岁这个年龄阶段的人中极少是左撇子；第二句是社会学家的解 释，认为80年前的小孩迫于压力不得不用右手。 第二步：分析题干信息，并结合选项得出答案。 A项从题干可知，用手习惯跟来自外界的压力有关，A项正确； B项从题干社会学家的观点可看出，过去人们是反对使用左手的，所以对用左手还是用右手， 不存在不同的社会态度，题干的调查无法B项的论断； C项，题干只提到过去的小孩被迫用右手，没有解释原因，C项无法从题干的调查得到加强； D项讨论的是用右手是否更聪明的问题，与题干内容无关，属于无关选项。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0269", "type": "single", "t": "某中学高中部所有喜欢球类运动的学生都参加过学校的运动会。因此，有些 喜欢美术的同学不喜欢球类运动。 为使上述论证成立，关于该中学高中部学生的断定必须假设的是", "o": [["A", "所有喜欢球类运动的学生都不喜欢美术"], ["B", "参加过学校运动会的学生都喜欢球类运动"], ["C", "所有喜欢美术的同学都没参加过学校的运动会"], ["D", "有些喜欢美术的同学没有参加过学校的运动会"]], "a": ["D"], "an": "本题属于加强题型 第一步：找到论点和论据 论点：有些喜欢美术的同学不喜欢球类运动 论据：高中部所有喜欢球类运动的同学都参加过运动会 本题虽然是加强题型，但是题干中存在明显的逻辑关联词，可先将关联词翻译，题干论点翻 译为：有的美术→不球类，论据翻译为：球类→运动会。 第二步：逐一分析选项 A选项：喜欢球类的都不喜欢美术，翻译为：球→不美，可逆否为：美→不球，即A项可以 替换为所有喜欢美术的都不喜欢球类运动，可以得出题干中有的喜欢美术的同学不喜欢球类 运动的结论，属于直接加强结论； B选项：参加过运动会的都喜欢球类运动，可翻译为：运动会→球，与喜欢美术的同学是否 喜欢球类运动无关，属于无关选项； C选项：所有喜欢美术的同学都没参加过运动会，翻译为：所有美术→不运动会，根据题干 论据球类→运动会可知，所有美术→不运动会→不球类，在美术和运动会之间搭桥，支持题 干论证关系； D选项，有些喜欢美术的同学没参加过运动会，翻译为：有些美术→没运动会，根据题干论 据：有的美术→不运动会→球类，可得：有的美术→不球类，在美术和运动会之间搭桥，支 持题干论证关系； 本题的A、C选项得出的结论都是所有喜欢美术的都不喜欢球类运动，尽管这两者都能推导 出有的喜欢美术的不喜欢球类运动，但D选项的出的结论直接就是：有的喜欢美术的不喜 欢球类运动，与题干的结论是完全一致的，因此，D选项要优于 A、C选项。 故本题正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0270", "type": "single", "t": "任何无法量化及不设定时限的目标都是无效目标，而任何无效的目标都没有 实际操作的方法。因此，详细的职业规划不是无法量化及不设定时限的目标 为使上述论证成立，必须补充以下哪项作为前提：", "o": [["A", "详细的职业规划不都是无效的目标"], ["B", "详细的职业规划有实际操作的方法"], ["C", "有效的目标都是可以量化和设定时限的目标"], ["D", "无法量化及不设定时限的目标没有实际操作的方法"]], "a": ["B"], "an": "本题论点是详细的职业规划不是无法量化及不设定时限的目标；论据是任何无法量 化及不设定时限的目标都是无效目标，而任何无效目标都没有实际操作的方法。 本题可采用形式逻辑的方式来解： 论据翻译为：有实际操作方法→不是无法量化及不设定时限的目标 论点翻译为：详细的职业规划→–无法量化及不设定时限的目标 要想论证成立，只须说详细的职业规划是有实际操作方法的即可。因此，B项正确。这里需 要注意A项：A项的表达是“不都是”，所以不正确，如果改成不是，也可支持。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0271", "type": "single", "t": "哥伦布航海发现美洲新大陆，促进了近代历史进程。而大约在距今5万年前， 一些生活在亚洲北部的游猎民族从冰河时代海水冻结的白令海峡进入美洲。最近有学者宣称 有证据表明，明朝航海家郑和比哥伦布早72年发现美洲大陆。 从中我们可以得出：", "o": [["A", "哥伦布的发现在亚洲游牧民族之后，意义不大"], ["B", "郑和到达美洲即使得到证实，意义也比不上哥伦布"], ["C", "上述学者试图推翻亚洲游牧民族首先到达美洲的历史"], ["D", "如果郑和到过美洲被证实，郑和的成就可能在哥伦布之上"]], "a": ["D"], "an": "第一步：抓住题干的关键信息。 题干讲述了近代哥伦布发现美洲，5万年前游猎民族进入美洲，郑和比哥伦布早发现美洲， 这三个发生时间不同的事件。 第三步：逐一判断选项的作用。 由“哥伦布航海发现美洲新大陆，促进了近代历史进程”可知哥伦布发现美洲新大陆对近代历 史意义重大，所以A错误； “哥伦布航海发现美洲新大陆，促进了近代历史进程”，而“明朝航海家郑和有可能比哥伦布 早72年发现美洲大陆”，这就意味着如果郑和早于哥伦布发现新大陆的猜测被证实，郑和对 近代历史的意义会比哥伦布更重大，所以B错误，D正确； 哥伦布发现美洲大陆是几百年前，而游猎民族进入美洲大陆是5万年前，因此亚洲游牧民族 首先到达美洲的历史根本无法被推翻，所以C错误。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0272", "type": "single", "t": "最新研究发现，狼和狗的关键性区别，是食用人类食物这一特点。经过几个 世纪，食用人类食物导致了狗具备消化淀粉的基因，它们因此能依靠人类剩余的饭菜繁衍下 来，并最终对它们实现了驯化，即在形态、生理功能、行为习惯，对人类的态度等方面都发 生大幅度的变化，成为家畜。 以下哪项为真，不能质疑上述说法：", "o": [["A", "如果人们在野外捕捉了狼的幼崽，并对它们进行驯化，时间长了小狼的行 为也会发生变化，并且会和人类亲近"], ["B", "长期的野外观察表明，当狼群缺少可猎食的动物时也会挖掘植物的块茎充 饥"], ["C", "在牧区许多牧羊犬和其主人一样以肉食为主，并不吃淀粉类食物，并且世 代如此"], ["D", "狗从农业社会开始食用人类的饭菜，因此狗比狼对人类更友好，更愿意在 人类定居点的周围徘徊"]], "a": ["D"], "an": "第一步：找到论点论据。 论点：狼和狗的关键性区别，是食用人类食物这一特点。 论据：食用人类食物使狗具备了消化淀粉的基因，它们因此能依靠人类剩余的饭菜繁衍下来， 并最终被驯化。 第二步：逐一分析选项。 A项说明狼的幼崽也可以被驯化，与人类亲近，否认了食物的作用，削弱了论点； B项说明狼也食用淀粉类食物，故食物上与狗没有很大差别，削弱了论点； C项说明牧羊犬以肉食为主，不吃淀粉类食物，并且世代如此，否认了论据的真实性，削弱 了论据； D项阐述了狗从农业时代开始食用人类饭菜，因此比狼对人类更友好，加强了论点。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0273", "type": "single", "t": "甲乙丙三人择偶标准： 甲：只要他有钱，就嫁给他 乙：只有他有钱，才嫁给他 丙：只要他人好，就嫁给他 若一男没钱但人好，则一定不愿意嫁给他的人是：", "o": [["A", "甲"], ["B", "乙"], ["C", "丙"], ["D", "甲和乙"]], "a": ["B"], "an": "第一步：翻译题干，利用充分条件和必要条件。 甲：有钱→嫁；乙：嫁→有钱；丙：人好→嫁。 第二步：根据事实信息。 -钱∧人好，可推出丙一定嫁，乙根据逆否规则为-有钱→-嫁，乙一定不嫁。对于甲，-钱为 否前，否前只能推出可能性结论，无法推出必然性结论。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0274", "type": "single", "t": "由于按揭贷款的利率在降低，消费者在观望利率会低到什么程度，所以一月 份出售的新房子数量大幅下降了，销售大幅下降的同时，所售新房子平均价格激增。 下面哪项如果正确，最好地解释了新房子平均价格的激增：", "o": [["A", "价格较高房子的销售没有受销量下降的影响，因为它们的买主较少受支付 总额的限制。"], ["B", "建筑商和建筑工会的劳动协议到明年一月才到期。"], ["C", "过去三年中，新房子的价格一直在缓慢上涨，因为住房不足的严重程度增 加了。"], ["D", "一月份比先前的三个月中有更多的房屋所有者再次出售他们的中等价位的 房子。"]], "a": ["A"], "an": "第一步：找到论点和论据。 本题论点是新房子平均价格激增，论据是新房子数量大幅下降了。 第二步：判断加强方式。 论点强调楼价，论据强调成交量，所以论点与论据间不存在明显因果关系，需加强论证，在 论点和论据间搭桥。 第三步：逐一判断选项的作用。 A即在楼价和成交量间搭桥，B与楼价无直接关系，CD说明的情况不能导致平均价格激增。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0275", "type": "single", "t": "会玩的孩子更适应社会交往，心理也更加健康；相反，不少性格内向、孤僻， 甚至有交往困难等行为问题的孩子，大多小时候缺少和同伴的玩耍。如果一个孩子交往技能 比较差，就容易产生焦虑，紧张，多疑等负性情绪，从而影响正常生活和学习。如果这些负 性情绪长期得不到释放，甚至可能导致缩性人格。 由此可以推出：", "o": [["A", "只有给孩子充分的时间玩耍，孩子的心理才可能健康发展"], ["B", "只要让孩子有充分的时间玩耍，孩子的心里就能健康发展"], ["C", "有心理缺陷的孩子，都是因为小时候没有得到足够的时间玩耍"], ["D", "只要孩子会玩耍，长大后就能适应社会"]], "a": ["A"], "an": "题干的主要论述关系为：①心理不健康的孩子大多缺少和同伴的玩耍；②孩子交往 差→容易产生负性情绪→可能导致闭缩性人格。 逐一分析选项。 A 项：由①“心理不健康的孩子大多缺少和同伴的玩耍”可以推知，只有给孩子充分的时间玩 耍，孩子的心理才可能健康发展，A 项表述正确。 B 项：只要让孩子有充分的时间玩耍，孩子的心理就能健康发展，表述过于绝对，并不能由 题干推出，排除。 C 项：题干中只是说心理不健康的孩子大多缺少和同伴的玩耍，选项表述过于绝对，排除。 D项：题干中只是说会玩的孩子更适应社会交往，选项表述过于绝对，并不能由题干推出， 排除。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0276", "type": "single", "t": "“已所不欲勿施于人”虽被很多人当作美德，但也可能产生矛盾。例如，没什 么人想要和一个周末工作、夜里两点钟还要出诊的医生结婚，可是每个病人都希望找到这样 的医生。 由此可以推出：", "o": [["A", "越有道德的医生越难结婚"], ["B", "“已所不欲施于人”才是真正的美德"], ["C", "“已所不欲勿施于人”只会给人带来痛苦"], ["D", "一个人不需要的东西有时恰恰是另一个人所需要的"]], "a": ["D"], "an": "第一步：抓住题干对象及其关系。 第一句说已所不欲勿施于人也可能产生矛盾，意思是有时候一些人不需要的东西恰恰是别人 所需要的；第二句话是对第一句话的例证，说明夜里两点钟还要出诊的医生对病人是负责的， 但对于爱人来说是不负责任的。 第二步：逐一判断选项。 根据第一步分析可知，一些人不需要的东西恰恰是别人所需要的，D项符合推断。 A项说越有道德的医生越难结婚，不符合推断，医生有无道德是否容易结婚，题干均没有涉 及，因此A项是无关项； 题干强调已所不欲勿施于人也可能产生矛盾，并没有完全肯定其是美德，也没有否定一定会 带来痛苦，因此排除BC项。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0277", "type": "single", "t": "某开发区发展委员会召开环境工作专题圆桌会议，参加会议的有委员会主任 和副主任，以及委员会所属的开发区环保局、工业局和农业局的局长和副局长。他们八个人 均匀地坐在一张会议圆桌旁，只有一个同部门的正职和副职的座位被分隔开了。并且：①委 员会副主任对面的人是坐在环保局局长左边的一位局长；②工业局副局长左边的人是坐在农 业局局长对面的一位副局长；③农业局局长右边的人是一位副局长，这位副局长坐在委员会 主任左边第二个位置上的副局长的对面。则座位一定被隔开的是：", "o": [["A", "环保局的局长和副局长"], ["B", "工业局的局长和副局长"], ["C", "农业局的局长和副局长"], ["D", "委员会的主任和副主任"]], "a": ["B"], "an": "根据题意，可画出如下座位图。 根据上图可知 B 项符合题意。 故正确答案为 B", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0278", "type": "single", "t": "美国研究人员分析了南极半岛和邻近的斯科舍海地区的数据后发现，20世纪 70年代以来，当地气温上升了5~6摄氏度，并且来自其他海域的哺乳动物增多导致南极哺 乳动物捕食竞争加剧。因此，在上述地区作为哺乳动物主要食物来源的磷虾的密度降低了 80%。而同一时期，生活在该地区以磷虾为主要食物的阿德利企鹅和帽带企鹅的数量也急 剧减少。 根据以上论述，可推出以下哪项结论：", "o": [["A", "气温上升导致磷虾密度下降"], ["B", "如果磷虾的密度继续减少，阿德利企鹅和帽带企鹅都会灭绝"], ["C", "造成南极海洋哺乳动物捕食竞争加剧的原因是气温上升"], ["D", "帽带企鹅生存的威胁来自气候变暖和哺乳动物的捕食竞争加剧"]], "a": ["D"], "an": "第一步：抓住题干的主要信息。 由于南极半岛气温上升，并且来自其他海域哺乳动物增多导致捕食压力加剧，因此磷虾的密 度降低80%；与此同时，以磷虾为食的帽带企鹅与阿德利企鹅数量也下降了。这说明气温 上升和哺乳动物捕食竞争加剧对帽带企鹅与阿德利企鹅的生存造成了影响。 第二步：分析各选项。 A项中磷虾数量下降的原因是气候上升还是哺乳动物的捕食竞争加剧我们不清楚，属于无理 由猜测，因此错误； B项中说企鹅会灭绝，表达过于绝对，错误； C项中与A项一样属于无理由猜测，错误； D项中气温上升和哺乳动物捕食竞争加剧对帽带企鹅的生存造成了影响，结合主题一致原 则，正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0279", "type": "single", "t": "当受到害虫侵袭时，大豆和其他植物会产生一种叫做茉莉酸盐的荷尔蒙，从 而启动一系列化学反应，合成更多蛋白酶抑制剂，增强自身的抵抗力。害虫吃下这种化合物 以后，其消化功能会受到抑制。植物生物学家德鲁西亚发现高浓度二氧化碳会导致植物丧失 分泌茉莉酸盐的能力，整个“防御通道”由此将被关闭，于是大豆类作物的抗虫害能力便随着 二氧化碳含量的增多而逐渐减弱。 由此可以推出：", "o": [["A", "大豆产量会受到空气状况的影响"], ["B", "茉莉酸盐的主要作用是抵抗害虫"], ["C", "不能产生茉莉酸盐的植物将很难抵御害虫"], ["D", "减少空气中的二氧化碳会增加大豆的抗虫害能力"]], "a": ["A"], "an": "第一步：抓住每句话中的对象。 第一句说明植物受害虫侵害时会产生茉莉酸盐增强抵抗力，第二句说明蛋白酶抑制剂能够抑 制害虫的消化功能，第三句说明高浓度二氧化碳会导致植物丧失分泌茉莉酸盐的能力，大豆 抗虫能力随二氧化碳增多而减弱。 第二步：逐一判断选项的作用。 A项题干说“大豆类作物的抗虫害能力便随着二氧化碳含量的增多而逐渐减弱”，也就表明大 豆产量会受到空气状况的影响，因此A项可以推出； B项产生茉莉酸盐从而启动一系列化学反应，合成更多蛋白酶抑制剂，增强自身的抵抗力， 而不是自身能够抵抗害虫，因此B项无法推出； C项题干中没有提及说不能产生茉莉酸盐的植物将很难抵御害虫，因此C项无法推出； D项题干只说二氧化碳的增加会导致植物丧失分泌茉莉酸盐的能力，并没有说减少空气中的 二氧化碳就会增加大豆的抗虫害能力，因此D项无法推出。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0280", "type": "single", "t": "专家们认为，造成老虎数量急剧下降的原因很简单：捕杀野生动物的违法行 为仍未被完全禁止，东亚许多国家仍猖狂地进行动物皮毛交易。专家指出，亚洲新的人口增 长趋势和经济变化对老虎生存造成了非常重大的影响。亚洲富有的中产阶级可以承受昂贵的 “虎宴”——用老虎身体的各个部分做成晚餐，炫耀财富。这也充分刺激了野生老虎的非法贸 易，直接导致了亚洲老虎数量急剧下降。由此可以推出：", "o": [["A", "减少对老虎的捕杀，老虎数量就不会下降"], ["B", "制止动物毛皮交易，老虎数量就不会下降"], ["C", "经济变化趋势对有些动物的生存影响很大"], ["D", "如果中产阶级改变不健康的消费观，老虎的数量就不会下降"]], "a": ["C"], "an": "第一步：翻译题干。 捕杀野生动物老虎数量急剧下降；动物皮毛交易老虎数量急剧下降；亚洲新的人口增长趋势 和经济变化老虎数量急剧下降；亚洲富有的中产阶级需求野生老虎的非法贸易老虎数量急剧 下降。 第二步：根据逆否规则逐一判断选项。 A项，减少对老虎的捕杀老虎数量就不会下降，否前推不出否后，排除A； B项，制止动物毛皮交易老虎数量就不会下降,否前推不出否后，排除B； C项，由题干“亚洲的经济变化趋势对老虎的生存造成了重大的影响”可知C项满足题干推断； D项，中产阶级改变不健康的消费观老虎数量就不会下降,否前推不出否后，排除D。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0281", "type": "single", "t": "有9张纸牌，分别为1至9。甲、乙、丙、丁四人取牌，每人取2张。现已 知甲取的两张牌之和是10；乙取的两张牌之差是1；丙取的两张牌之积是24；丁取的两张 牌之商是3。 请说出剩下的一张是什么牌：", "o": [["A", "6"], ["B", "3"], ["C", "7"], ["D", "4"]], "a": ["C"], "an": "第一步：找突破口。 本题突破口是丙，丙取的两张牌之积是24，丙拿的为3、8或4、6。 第二步：看其他条件并判断选项。 假设丙拿的为3、8，要使丁取的两张牌之商是3，丁拿的必为6、2。和为10的只有1、9， 那么甲拿的两张牌是1和9；差为1的只有4、5，乙拿的为4、5。剩下的那张牌是7。假 设丙拿的为4、6，要使丁取的两张牌之商是3，那么丁可能取到3、1或3、9。假设丁取 到3、1，那么甲拿的两张牌是2和8，而剩下的5、7、9中没有差为1的；若丁拿的是3、 9，那么甲拿的两张牌是2和8，那么剩下的1、5、7中没有差为1的。因此丙拿的必须为 3、8，甲拿的两张牌是1和9，乙拿的为4、5，丁拿的必为6、2，剩下7。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0282", "type": "single", "t": "未来深海水下线缆的外皮是由玻璃制成的，而不是特殊的钢材或铝合金。因 为金属具有颗粒状的微观结构，在深海压力之下，粒子交界处的金属外皮容易断裂。而玻璃 看起来虽然是固体，但压力之下可以流动，因此可以视为液体。 由此可以推出：", "o": [["A", "一切所谓的固体，几乎都可以被视为缓慢流动的液体"], ["B", "玻璃比起钢材或铝合金，更适合做建筑材料"], ["C", "液体没有颗粒状的微观结构"], ["D", "在未来的深海操作中，玻璃钢将取代金属，发挥更大的作用"]], "a": ["D"], "an": "第一步：抓住每句话中的对象及其关系。 第一句说明未来深海水下线缆的外皮是由玻璃制成的；第二句说明不用金属的原因；第三句 说明采用玻璃的原因。三句间是总分结构。 第二步：逐一判断选项的作用。 A项题干只说玻璃看起来虽然是固体，但压力之下可以流动，因此可以视为液体，并不是说 所有固体，A选项扩大题干范围； B项题干说的是深海水下线缆的材料，不能推广到建筑材料； C项题干中说固体不适合的原因在于金属具有颗粒状的微观结构，在深海压力之下，粒子交 界处的金属外皮容易断裂，而玻璃被视为液体可以被用作线缆的材料，并不能说明液体没有 颗粒状的微观结构，产生差异的原因可能是别的问题； D项粒子交界处的金属外皮容易断裂，而玻璃被视为液体可以被用作线缆的材料，因此在深 海操作中玻璃比金属可用性和耐用性更强，故将取代金属作为深海操作的材料，D正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0283", "type": "single", "t": "某些公务员是行政管理专业的。因此，某些行政管理专业的人做管理工作。 上述推理如果成立，必须补充以下哪项作为前提：", "o": [["A", "所有公务员都做管理工作"], ["B", "某些公务员不是做管理工作的"], ["C", "某些行政管理专业的人不是公务员"], ["D", "所有行政管理专业的人都是公务员"]], "a": ["A"], "an": "本题属于三段论推理。题设的条件：存在公务员是行政管理专业的，即“有的公务 员→行政管理专业”等价于“有的行政管理专业→公务员”，题设的结论：存在行政管理专业 的人做管理工作，即“有的行政管理专业→做管理”。在公务员与管理工作之间，缺少一个衔 接条件，方向应从条件指向结论，A项所有公务员都做管理工作，即“公务员→做管理”，满 足要求。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0284", "type": "single", "t": "中国的汽车厂家正在开发节能型汽车。其直接原因是汽油价格节节攀升，消 费者的节能意识不断提高。开发节能汽车需要投入大量的资金。中国一汽集团在2015年之 前将对以节能汽车为主的自主品牌汽车投入130亿元人民币的开发费用。上海汽车集团也 计划在2012年之前投入214亿元人民币，用于新车的节能技术开发。节能汽车的开发竞争， 可望加速中国汽车产业调整，改善大中小企业混杂的混乱局面。 以下哪一项最可能是中国汽车厂家投资开发节能汽车的原因：", "o": [["A", "节能汽车在中国尚未普及"], ["B", "节能汽车巨大的市场前景"], ["C", "开发节能汽车需要投入大量资金"], ["D", "节能汽车是汽车工业发展的趋势"]], "a": ["B"], "an": "第一步：抓住题干的对象及其关系。 前部分强调“汽油价格节节攀升，消费者的节能意识不断提高”。后部分说明汽车厂家投入大 量的资金开发节能汽车。 第二步：判断整体关系。 “汽油价格节节攀升，消费者的节能意识不断提高”说明了一个道理，即节能汽车巨大的市场 前景。而巨大的市场前景促使汽车厂家投入大量的资金开发节能汽车。 第三步：逐一判断选项的作用。 A项“尚未普及”显然不能作为原因，且题干没有涉及； B项“巨大的市场前景”符合第二步推断； C项“需要投入大量资金”就是对题干内容的简单重复，显然不能作为原因； D项“节能汽车是汽车工业发展的趋势”可以作为结果，而不是原因。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0285", "type": "single", "t": "随处可见的榨菜，在中国经济舞台上正扮演越来越重要的角色。从2007年到 2011年，涪陵榨菜在华南地区的市场份额从49%一路跌破30%，与此对应的是珠三角地 区劳动密集型企业的转移。2012年，在中西部地区务工的农民工数量增长较快，与此同时， 该地区涪陵榨菜销售额创造了接近50%的增长。有专家就此指出，榨菜销售量与农民工的 流动趋势存在巨大的相关性，政府可根据“榨菜指数”变化情况提前制定政策，从容应对人口 骤增后带来的就业、治安、教育、社保等公共服务问题。 以下哪项如果为真，最能支持上述专家的言论：", "o": [["A", "榨菜是大众喜爱的食品，四川，重庆人也喜欢榨菜，而四川、重庆两地又 都是农民工输出地"], ["B", "榨菜美味可口、价格低廉，购买、携带均很方便，在外地务工的农民工是榨 菜的主要消费群体"], ["C", "据传，国家某权威部门根据“榨菜指数”变化情况将全国分为“人口流入区”和 “人口流出区”，但近期该部门对此传闻予以明确否认"], ["D", "浙江、福建等地生产的榨菜可能与涪陵榨菜销量情况相似，其销量的区域 变化也能体现农民工的流动趋势"]], "a": ["B"], "an": "第一步：找到论点论据。 论点：可根据“榨菜指数”制定政策，应对人口骤增带来的公共服务问题。论据：有数据证明 榨菜销售量与农民工流动趋势相关。 第二步：逐一判断选项的作用。 题干由榨菜的销量与农民的流动趋势有很大相关性，得出政府可以根据“榨菜指数”变化情况 来制定相关政策。 B 项：“外地务工的农民工是榨菜的主要消费群体”是榨菜能体现农民工流动趋势的前提条 件，说明了榨菜销量的改变与农民工转移之间的内在联系，加强了论据，支持专家的言论， 当选。 A 项“四川、重庆”和D 项“浙江、福建”都是枚举小样本的论据，支持力度弱于B 项近乎整体 性样本，排除。 C 项：“否认说”削弱了专家言论，排除。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0286", "type": "single", "t": "食用碘盐可以预防甲状腺肿大，但过量可能会对人体产生危害。对此，有专 家指出，只要食用量不超过专业部门规定的标准，它的危害就完全可以避免。因此，人们对 于食用碘盐的担心是毫无必要的。 要使上述结论成立，所需要的前提是：", "o": [["A", "很少有人大量食用碘盐"], ["B", "目前数据显示，碘盐只对极少数的使用者产生了副作用"], ["C", "碘盐的副作用对人体的伤害并不大"], ["D", "所有人都严格按照专业部门的规定标准食用碘盐"]], "a": ["D"], "an": "第一步：找到论点和论据。 本题的论点是“人们对于食用碘盐的担心是毫无必要的”。论据是“有专家指出，只要食用量 不超过专业部门规定的标准，它的危害就完全可以避免”。 第二步：判断加强方式。 论点强调人们不用担心，论据强调不超量食用可以避免危害。论点和论据间因果联系不强， 需在食用量标准范围和担心间搭桥，要加强论证。 第三步：逐一判断选项的作用。 A项中“很少有人大量食用”，B项中“只对极少数的使用者产生了副作用”和C项中“副作用对 人体的伤害并不大”说明还是存在危害健康的可能性，因此并不能解除所有人的担心。故不 能为食用量标准范围和人们的担心之间搭桥，A、B、C三项均错误； D项中“所有人都严格按照专业部门的规定标准食用碘盐”指出人们的食用量是在标准范围 内并没有超量，没有危害，所以人们不用担心。此表述是为食用量标准范围和人们的担心之 间搭桥，正确。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0287", "type": "single", "t": "研究人员通过基因工程技术将特定基因引入作物，使其能够编码合成Bt毒蛋 白，该蛋白能杀死侵袭的害虫。某地广泛种植转基因Bt棉花，有效控制了棉铃虫的危害， 但与此同时，另外一种害虫——盲椿象却泛滥成灾。对此，研究人员认为，盲椿象泛滥并非 是转基因Bt棉花导致的，而是由于当地气候比较适合盲椿象生长。 以下哪项如果为真，最能削弱研究人员的观点？", "o": [["A", "盲椿象一般于6月上中旬从其他寄主迁入棉田，而这段时间正是二代棉铃 虫的防治期"], ["B", "转基因Bt棉花大面积种植后，由于棉花本身抗棉铃虫，农药喷洒次数和用 量都明显减少，间接导致盲蝽象种群获得生存空间"], ["C", "随着盲椿象从棉田继续向其他寄主迁移，盲椿象也威胁到了当地葡萄、苹 果树、桃树和梨树的生长，成为多种作物的新虫害"], ["D", "棉花生长期间该地的气候条件同时也有利于棉蚜、地老虎和红蜘蛛等害虫 的生长"]], "a": ["B"], "an": "本题是削弱题型。要削弱的观点是：盲椿象泛滥不是转基因Bt棉花导致的，而因 为气候适宜其生长。 要想削弱，最强的削弱应该是：盲椿象泛滥就是转基因Bt棉花导致的。 A选项说的是盲蝽象的迁移时间与棉铃虫防治期重合，没有体现与转基因Bt棉花的关系， 无关选项，排除； B选项解释了盲蝽象与转基因Bt棉花之间的关系，说明盲椿象泛滥确是转基因Bt棉花导致 的，可以削弱； C选项盲蝽象危害的生物属于无关选项，排除； D选项棉花生长期有利于什么害虫属于无关选项，排除。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0288", "type": "single", "t": "有关统计结果表明，就冠心病的发病率看，发达国家将近是发展中国家的三 倍。有人认为这归咎于发达国家中人们的高脂肪、高蛋白、高热量的食物摄入。相对来说， 发展中国家较少有人具备生这种“富贵病”的条件。其实，这种看法很难成立。因为它忽略了 这样一个事实：目前发达国家的人均寿命高于70岁，而发展中国家则不到50岁。 以下哪项最能加强上述反驳：", "o": [["A", "统计资料显示，冠心病相对集中在中老年阶段，即50岁以上"], ["B", "一般地说，一个人的寿命越长，在其有生之年患有某种疾病的概率越高"], ["C", "相对于发展中国家来说，发达国家的人们具有较高的防治冠心病的常识和 较好的医疗条件"], ["D", "发展中国家人们的高脂肪、高蛋白、高热量食物的摄入量，无论是总量还 是人均量，都在逐年增长"]], "a": ["A"], "an": "第一步：找到论点和论据。 本题论点是发达国家比发展中国家冠心病的发病率高。论据是发达国家的人均寿命高于70 岁，而发展中国家则不到50岁。 第二步：逐一判断选项的作用 。 A项在论据中的人均寿命和论点中的冠心病之间建立联系，由于冠心病相对集中在50岁以 上年龄层的人，而发达国家人均寿命高于70岁，发展中国家则不到50岁，因此发达国家 冠心病发病率远高于发展中国家，A项加强论据的说服力，正确； B中只笼统地说患有某种疾病的概率随寿命增加而增加，没有说明冠心病与寿命的关系，加 强论据的力度远不如A项； C项发达国家拥有更好的防治冠心病的常识和较好的医疗条件； D项中发展中国家三高食品的摄入量逐年增加，都跟寿命高导致冠心病发病率高无关，属于 无关选项。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0289", "type": "single", "t": "调查发现，养宠物的人往往身体比较健康，心理比较乐观。由此，我们可以 得出如下结论：", "o": [["A", "养宠物会让人身心健康"], ["B", "身心健康的人才有精力养宠物"], ["C", "对动物有爱心使人身心比较健康"], ["D", "养宠物的人身心比较健康"]], "a": ["D"], "an": "第一步：抓住题干主要信息。 题干包括两个信息，养宠物的人身体比较健康，心理也比较乐观。 第二步：分析题干信息，并结合选项找出答案。 A项错误，题干只说养宠物的人的身心状态，没有说养宠物对身心的影响，A项说法无法从 题干推出； B项中的“有精力养宠物”和“对动物有爱心”题干都没有涉及，均属于无关选项； D项是对题干的概括，为正确选项。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0290", "type": "single", "t": "甲乙丙丁同住一寝室，有人问他们：“你们当中谁会的语言最多？”甲说：“我 不会说英语，当乙和丙交谈时，我能用外语给他们翻译。”乙说：“我是英国人，丁不会说英 语，但我俩可以毫无困难地交流。”丙说：“我和丁交流时，需要乙来帮忙翻译。”丁说：“我 们四个人不能同时用一种语言交流。” 据此可以推断出四个人中谁会的语言最多？", "o": [["A", "甲"], ["B", "乙"], ["C", "丙"], ["D", "丁"]], "a": ["B"], "an": "注：本题不严谨，考试时考场临时通知修改了题问，将“三个人”修改为“四个人”， 但是修改后仍然有问题，如果进行推理需要假设非常多情况并且得不出来确定结论。此外， 从命题人的出题角度看，也不会让考生在考试时进行过于复杂的假设和推理，因此，本题在 考试的时候可采用以下思路快速解题： 分析题干可知，甲不会说英语，丁不会说英语，丙和丁交流的时候需要乙做翻译，说明丙不 会丁的语言，故甲、丙、丁都至少有一种不会的语言。此时，如果乙会所有语言，与题干要 求并不矛盾，那么可以猜测乙会的语言可能最多。 故本题正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0291", "type": "single", "t": "尽管大家开始抵制珍稀动物的皮草产品，但仍有家居制造商将珍稀动物的皮 毛用于家居饰品。几年前，专家发明了一种新的高仿合成皮草，受到了家居制造商广泛的好 评。但从最近几年的统计看，各地为获取皮毛而对珍稀动物进行捕杀的活动却并没有减少。 以下哪一项正确，最有助于对“捕杀活动没有减少”进行解释：", "o": [["A", "生产新的高仿合成皮草比生产原来的合成皮草的成本更低"], ["B", "新的高仿合成皮草与动物皮毛的质地相似，很难区分"], ["C", "绝大部分珍稀动物的皮毛用在越来越流行的皮草服饰上"], ["D", "家居制造商在销售大的家居物件时，往往将家居饰品当作赠品免费送给购 买者"]], "a": ["C"], "an": "第一步：找到论点和论据。 论点是各地为获取皮毛而对珍稀动物进行捕杀的活动却并没有减少，无有效论据。 第二步：判断加强方式。 加强论点，解释为什么各地为获取皮毛而对珍稀动物进行捕杀的活动却并没有减少。 第三步：逐一判断选项的作用。 A项强调原来的合成皮草，而不是真正的皮毛，所以是无关选项； B项强调新的高仿合成皮草非常好，这应该有助于减少捕杀，属削弱选项； C项“珍稀动物的皮毛用在越来越流行的皮草服饰上”说明皮草服饰有很大需求，进而对珍稀 动物的皮毛也有很大需求，解释了对珍稀动物“捕杀活动没有减少”，符合题意； D项”将家居饰品当作赠品免费送给购买者“，没有说明家居饰品的材质，属于无关选项。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0292", "type": "single", "t": "根据下列各种事实，综合分析，预测最可能发生的结果是： ①电脑的普及②电脑管理社会③电脑技术者的伦理观念降低④电脑管理情报的泄露⑤电脑 专业人才的增加⑥企业整体业务管理的信息化", "o": [["A", "电脑犯罪率增加"], ["B", "个人隐私受侵害"], ["C", "电脑过敏症增加"], ["D", "从事管理工作的失业者增加"]], "a": ["A"], "an": "第一步：抓住题干主要信息。 根据题意主要是讲电脑普及之后，在管理方面产生的问题。 第二步：分析题干信息，并结合选项得出答案。 从第③④可以得出A项符合题意。 B中个人隐私，C中电脑过敏症，D中从事管理工作的失业者，题干信息均未涉及，因此都 无法推出。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0293", "type": "single", "t": "一个老人告诉医生，说他的右腿疼，医生说：“这是上了年纪的缘故。” 以下最能反驳医生说法的是：", "o": [["A", "老人年轻的时候右腿也疼"], ["B", "比老人年纪小的人腿也疼"], ["C", "比老人年纪大的人腿不疼"], ["D", "老人现在左腿不疼"]], "a": ["A"], "an": "第一步：找到论点。 论点：老人的右腿疼是年纪大导致的。 第二步：判断削弱方式。 本题提问的是哪项能反驳医生的观点，即老人的腿疼不是年纪大导致的。 第三步：逐一判断选项的作用。 A项老人年轻时右腿也疼，说明不是年纪大的原因，直接削弱医生的结论； B、C两项其他人与老人的右腿疼无关，为无关项； D项的左腿也为无关选项。 故正确答案为A。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0294", "type": "single", "t": "某网站近日公布的就业调查统计显示，截至目前，仍有50．9％的大学生未 收到用人单位的就业通知。就业压力不小，大学生们对待遇的期望却不低，超过四成的被调 查者对月薪的期望是8000-10000元。对此，有专家表示8000-10000元的月薪期望不切实 际。 以下哪项如果为真，最能支持专家的观点", "o": [["A", "被调查的对象中，绝大部分都是硕士生和博士生"], ["B", "另一份调查显示，期望月薪4000-6000元的才是主体"], ["C", "每个人都有表达自身愿望的权利，不应该被嘲笑"], ["D", "报道中就业调查所涉及的区域主要是二三线城市"]], "a": ["D"], "an": "第一步：找出论点和论据。专家的观点：8000-10000元的月薪期望不切实际。题 干并无明显论据。 第二步：逐一判断选项 A项：被调查的对象中大部分是高学历者，因此对薪资要求较高，可以解释题干现象，增加 新论据，在一定程度削弱专家观点，排除； B项：月薪4000-6000元是主体，并不能推出月薪8000-10000元不切实际，属于无关选项， 排除； C项：每个人是否有表达自身愿望的权利与8000~10000 元的月薪是否不切实际无关，属于 无关选项，排除 D项：因被调查者均为二三线城市，工资水平相对较低，因此判断出8000-10000元的月薪 期望较高，不切实际，通过增加新论据从而支持论点，当选。 故正确答案为D。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0295", "type": "single", "t": "某地区有两个出租车公司甲和乙，他们推出的出租车的颜色分别是蓝色和红 色。经调查发现：在市场上流通的出租车中有70%是红色的，只有30%是蓝色的；红色出 租车发生车祸的平均概率是4%，而蓝色则为6%。现在，该区发生了一起出租车车祸。则：", "o": [["A", "与红色出租车相比，出车祸的更有可能是蓝色出租车"], ["B", "与蓝色出租车相比，出车祸的更有可能是红色出租车"], ["C", "两种颜色的出租车出车祸的概率是一样的，均为50%"], ["D", "无法比较"]], "a": ["B"], "an": "第一步：抓住题干主要信息。 第一点说明在市场上流通的出租车中有70%是红色的，只有30%是蓝色的；第二点说明红 色出租车发生车祸的平均概率是4%，而蓝色则为6%；第三点说明现在该区发生了一起出 租车车祸。 第二步：分析题干信息，并结合选项得出答案 。 由第一步中“在市场上流通的出租车中有70%是红色的，只有30%是蓝色的”和“红色出租车 发生车祸的平均概率是4%，而蓝色则为6%”可得，在市场上流通的出租车中红色出租车发 生车祸的概率为70%×4%＝2.8%，蓝色的为30%×6%＝1.8%，因此出车祸的更有可能是 红色的出租车。通过分析，只有B中说法符合。 故正确答案为B。", "tp": "逻辑判断", "d": "中"},
	{"i": "fjcs_0296", "type": "single", "t": "在大型游乐公园里，现场表演是刻意用来引导人群流动的。午餐时间的表演 是为了减轻公园餐馆的压力；傍晚时间的表演则有一个完全不同的目的：鼓励参观者留下来 吃晚餐。表面上不同时间的表演有不同的目的，但这背后，却有一个统一的潜在目标，即： 以下哪一选项作为本段的结束语最为恰当：", "o": [["A", "尽可能地减少各游览点的排队人数"], ["B", "吸引更多的人来看现场表演，以增加利润"], ["C", "在尽可能多的时间里最大限度地发挥餐馆的作用"], ["D", "尽可能地找来顾客，希望他们再次来公园游览"]], "a": ["C"], "an": "第一步：抓住题干主要信息。 第一点说明现场表演是刻意用来引导人群流动的；第二点说明午餐时间的表演是为了减轻公 园餐馆的压力，而傍晚时间的表演则是为了鼓励参观者留下来吃晚餐；第三点说明表面上不 同时间的表演有不同的目的，但这背后，却有一个统一的潜在目标。 第二步：分析题干信息，并结合选项得出答案。 “现场表演”和“公园餐馆”两个经营项目，前一个是为后一个服务的，即通过现场表演来引导 人群流动，在尽可能多的时间里选择最大限度的发挥餐馆的作用，故C为正确答案。其他 的选项都是断定的是现场表演的可能目的，不是直接目的。 故正确答案为C。", "tp": "逻辑判断", "d": "中"},
